<!doctype html>

<head>

  <title>竞品分析 - Linkincrease 知识库</title>

  <style>
:root {
  --bg:#fbfaf8; --text:#2f3437; --muted:#787774; --faint:#a8a29e;
  --line:#e7e2dc; --line-strong:#d8d1c8; --accent:#6b5f4b;
  --accent-soft:#eee9df; --code:#f3f0eb; --panel:#fff; --soft:#f7f6f3;
}
* { box-sizing:border-box; }
html { min-height:100%; }
body { margin:0; color:var(--text); background:var(--bg); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif; line-height:1.78; }
.back-link { display:block; padding:12px 16px; color:#6f5f43; text-decoration:none; font-size:14px; border-bottom:1px solid var(--line); }
.back-link:hover { background:var(--soft); }
article { max-width:940px; margin:0 auto; padding:44px 52px 88px; background:var(--bg); }
article h1, article h2, article h3, article h4 { color:var(--text); line-height:1.25; letter-spacing:0; }
article h1 { margin:0 0 22px; font-family:Georgia,"Times New Roman","Songti SC",serif; font-size:40px; font-weight:700; }
article h2 { margin:38px 0 14px; padding-top:6px; border-top:1px solid var(--line); font-size:23px; font-weight:680; }
article h3 { margin:26px 0 10px; font-size:18px; font-weight:680; }
article h4 { margin:22px 0 8px; font-size:16px; font-weight:650; }
article p, article li { color:var(--text); font-size:15px; line-height:1.78; }
article p { margin:10px 0; }
article ul, article ol { padding-left:1.45em; margin:10px 0 16px; }
article li + li { margin-top:4px; }
article a { color:#6f5f43; text-decoration:underline; text-decoration-color:#d7c7aa; text-underline-offset:3px; }
article blockquote { margin:18px 0; padding:2px 0 2px 16px; color:var(--muted); border-left:3px solid var(--line-strong); }
article table { display:block; width:100%; margin:18px 0 24px; overflow:auto; border-collapse:collapse; font-size:14px; }
article th, article td { min-width:120px; border:1px solid var(--line); padding:8px 10px; vertical-align:top; line-height:1.55; background:var(--panel); }
article th { color:#4f4a43; background:var(--soft); font-weight:650; }
article code { padding:2px 5px; border-radius:4px; background:var(--code); color:#5c4b35; font-size:.92em; }
article pre { margin:18px 0; padding:16px; overflow:auto; border:1px solid var(--line); border-radius:8px; background:#282522; color:#f7f3ec; }
article pre code { padding:0; background:transparent; color:inherit; }
@media (max-width:900px) { article { padding:30px 20px 72px; } article h1 { font-size:31px; } article h2 { font-size:21px; } }
</style>
</head>
