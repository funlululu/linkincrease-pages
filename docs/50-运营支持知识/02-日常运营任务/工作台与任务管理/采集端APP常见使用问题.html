<h1 id="app">采集端 APP 常见使用问题</h1>
<p>采集端用于现场执行、任务采集、附件上传、签名和批复查看。</p>
<h2 id="_1">常见问题</h2>
<table>
<thead>
<tr>
<th>问题</th>
<th>排查方向</th>
</tr>
</thead>
<tbody>
<tr>
<td>看不到任务</td>
<td>是否被指派、是否有 FlowSpace 权限、任务状态是否正确</td>
</tr>
<tr>
<td>无法提交</td>
<td>必填字段、附件格式、网络、工单状态</td>
</tr>
<tr>
<td>附件上传失败</td>
<td>文件大小、格式、网络、权限</td>
</tr>
<tr>
<td>登录失败</td>
<td>账号状态、密码、验证码、团队权限</td>
</tr>
<tr>
<td>消息不提醒</td>
<td>通知设置、任务指派、消息中心配置</td>
</tr>
</tbody>
</table>
<h2 id="_2">运营建议</h2>
<p>给现场人员培训时，应使用真实任务演示：打开任务、填写字段、上传图片、签名、提交、查看反馈。</p>

  </article>
