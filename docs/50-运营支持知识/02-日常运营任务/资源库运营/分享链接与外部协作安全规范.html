<h1 id="_1">分享链接与外部协作安全规范</h1>
<p>本页用于规范资源库分享、邮件协作、外部填写链接和协作团队参与方式。</p>
<h2 id="_2">基本原则</h2>
<ol>
<li>外部协作只开放完成任务所需的最小数据。</li>
<li>不通过截图、转发表格替代系统权限。</li>
<li>分享链接应关注有效期、访问范围和是否可编辑。</li>
<li>协作团队进入 FlowSpace 前必须明确角色和数据围栏。</li>
</ol>
<h2 id="_3">检查清单</h2>
<table>
<thead>
<tr>
<th>项目</th>
<th>检查点</th>
</tr>
</thead>
<tbody>
<tr>
<td>链接有效期</td>
<td>是否需要过期时间</td>
</tr>
<tr>
<td>数据范围</td>
<td>是否只包含必要字段和记录</td>
</tr>
<tr>
<td>编辑权限</td>
<td>是否允许外部修改数据</td>
</tr>
<tr>
<td>附件权限</td>
<td>是否可下载敏感资料</td>
</tr>
<tr>
<td>日志追踪</td>
<td>是否能追踪外部提交或查看行为</td>
</tr>
</tbody>
</table>
