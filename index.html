inkincrease定位;数字供应链;协同平台;系统边界", "sources": []}, {"path": "docs/56-数字供应链专项知识/README.md", "title": "56 数字供应链专项知识", "folder": "docs/56-数字供应链专项知识", "text": "# 56 数字供应链专项知识  本目录沉淀供应链数字化、数字供应链协同平台、主数据治理、系统版图、可视化预警和 Linkincrease 产品定位相关知识。它连接 `55 外贸供应链行业知识` 和 Linkincrease 的产品/运营方案，帮助产品经理和产品成功判断客户问题属于流程协同、数据治理、系统集成、管理可视化还是专业业务系统边界。  ## 目录  | 页面 | 用途 | | --- | --- | | [数字供应链基础框架](./数字供应链基础框架.md) | 说明数字供应链解决什么问题，以及 Linkincrease 应关注的能力层 | | [供应链数字化成熟度模型](./供应链数字化成熟度模型.md) | 判断客户当前数字化阶段和下一步建设重点 | | [供应链系统地图与边界](./供应链系统地图与边界.md) | 区分 ERP、PLM、MES、WMS、TMS、QMS、SRM 和协同平台边界 | | [供应链主数据与业务数据治理](./供应链主数据与业务数据治理.md) | 说明主数据、流程数据、指标数据和审计数据如何治理 | | [供应链协同平台能力模型](./供应链协同平台能力模型.md) | 定义协同平台应具备的对象、流程、权限、自动化、分析能力 | | [供应链可视化与预警体系](./供应链可视化与预警体系.md) | 设计从待办、异常、风险到管理指标的可视化体系 | | [Linkincrease 在数字供应链中的定位](./Linkincrease在数字供应链中的定位.md) | 说明 Linkincrease 适合解决什么，不适合承诺什么 |  ## 与其他目录的关系  | 目录 | 关系 | | --- | --- | | `55 外贸供应链行业知识` | 说明外贸供应链业务场景本身，如订单、验货、出货、审核、绩效 | | `56 数字供应链专项知识` | 说明这些业务如何被数字化、平台化、数据化和可视化 | | `50 运营支持知识` | 将行业与数字化判断转成客户方案、SOP 和复盘样本 | | `20/30/40` | 提供 Linkincrease 当前产品对象、流程、权限和审计权威规则 | | `60 数据分析支持` | 承接指标口径、报表和仪表盘实现细节 |  ## 使用原则  1. 先判断客户数字化阶段，再推荐能力组合。 2. 先治理主数据和流程数据，再谈自动化、看板和智能分析。 3. 明确 Linkincrease 与 ERP、MES、WMS、TMS、QMS 等系统边界。 4. 不把系统集成、算法预测或专业业务系统能力默认承诺给客户。 5. 数字化方案必须落到角色、对象、流程、权限、数据、预警和指标。  ## 产品成功使用路径  客户问题 -> 判断业务场景：查 docs/55 -> 判断数字化阶段和系统边界：查 docs/56 -> 映射 Linkincrease 能力：查 docs/20/30/40/60 -> 输出客户方案：查 docs/50/03 -> 上线后复盘：查 docs/50/09", "domain": "数字供应链", "module": "数字供应链专项知识", "tags": "数字供应链;供应链数字化;系统边界;Linkincrease定位", "sources": []}, {"path": "docs/56-数字供应链专项知识/供应链主数据与业务数据治理.md", "title": "供应链主数据与业务数据治理", "folder": "docs/56-数字供应链专项知识", "text": "# 供应链主数据与业务数据治理  ## 1. 目标  供应链数字化的基础是可信数据。客户如果主数据混乱、流程字段不稳定、权限边界不清，再复杂的自动化和仪表盘都会失真。  本页用于说明产品成功如何判断供应链数据应该放在资源库、FlowSpace、订单、工单、子表、附件、日志还是仪表盘中。  ## 2. 数据类型  | 数据类型 | 定义 | 典型对象 | Linkincrease 承载 | | --- | --- | --- | --- | | 主数据 | 长期复用、跨流程引用的稳定对象 | 供应商、工厂、产品、证书、服务商 | 资源库 | | 交易/流程数据 | 一次业务执行产生的数据 | 订单、验货计划、出货计划、审核项目 | FlowSpace、订单、里程碑 | | 任务数据 | 某个角色需要填写或处理的工作单元 | 工单、批复、整改任务、单证任务 | 工单、批复 | | 证据数据 | 支撑判断的材料 | 图片、附件、报告、签名 | 附件字段、历史记录 | | 指标数据 | 支撑管理决策的聚合结果 | 准时率、通过率、逾期数 | 仪表盘、报告 | | 审计数据 | 记录谁在何时做了什么 | 操作日志、动态、历史快照 | 日志、历史记录 |  ## 3. 主数据判断  一个对象适合进入资源库，通常满足：  1. 会被多个订单、流程或团队重复使用。 2. 有稳定唯一标识或需要去重。 3. 有状态、有效期、归属或维护责任。 4. 需要被引用、筛选、统计或做权限控制。  不适合直接做资源库的内容：  - 一次性任务说明。 - 某次订单中的临时备注。 - 只服务单个附件的描述。 - 没有稳定字段和维护责任的数据。  ## 4. 数据治理清单  | 维度 | 检查问题 | | --- | --- | | 唯一性 | 是否有编码、名称、证照号或组合唯一规则？ | | 归属 | 谁负责维护，谁有权修改？ | | 状态 | 是否有生效、暂停、失效、退出等状态？ | | 有效期 | 证书、报告、审核结果是否会过期？ | | 引用 | 哪些 FlowSpace、订单或工单需要引用？ | | 快照 | 历史订单是否需要保留当时的字段值？ | | 同步 | 从流程写回资源库时是否覆盖已有值？ | | 权限 | 外部协作方能否看到或修改？ | | 指标 | 是否会进入仪表盘或供应商评价？ |  ## 5. 常见建模建议  | 业务内容 | 推荐承载 | | --- | --- | | 供应商、工厂、产品、证书 | 资源库 | | 一次订单履约 | 订单 / FlowSpace | | 一个阶段性任务 | 里程碑下的工单 | | 一次验货或审核 | 工单或独立 FlowSpace | | 多个缺陷/单证明细 | 子表、多个工单或独立对象，视统计需求决定 | | 批复意见 | 工单批复或里程碑批复 | | 过程附件 | 工单附件，必要时同步到资源库 | | 风险等级 | 资源库字段，但需要来源和更新规则 |  ## 6. 数据质量指标  | 指标 | 用途 | | --- | --- | | 主数据完整率 | 判断资源库基础质量 | | 重复主体数量 | 判断去重和唯一性问题 | | 字段缺失率 | 判断模板配置和执行质量 | | 附件完整率 | 判断证据是否充分 | | 状态异常数 | 识别流程卡点或配置错误 | | 指标不可计算项 | 判断看板数据源是否稳定 |  ## 7. 关联知识  - [资源库数据模型](../20-业务对象与数据模型/资源库数据模型.md) - [字段、组件、子表、引用关系](../20-业务对象与数据模型/字段、组件、子表、引用关系.md) - [核心指标口径](../60-数据分析支持/核心指标口径.md)", "domain": "数字供应链", "module": "数字供应链专项知识", "tags": "主数据;业务数据;数据治理;资源库;指标", "sources": []}, {"path": "docs/56-数字供应链专项知识/供应链协同平台能力模型.md", "title": "供应链协同平台能力模型", "folder": "docs/56-数字供应链专项知识", "text": "# 供应链协同平台能力模型  ## 1. 定位  供应链协同平台的核心价值是让多个组织围绕同一业务对象和流程协作：有人提交资料，有人审核，有人现场执行，有人看风险和结果。它不是单一内部管理系统，而是连接品牌方、贸易公司、供应商、工厂、服务商和管理层的协同层。  ## 2. 能力模型  | 能力 | 解决的问题 | Linkincrease 对应能力 | | --- | --- | --- | | 对象建模 | 知道业务围绕哪些对象运转 | 资源库、订单、FlowSpace | | 流程编排 | 知道从发起到关闭怎么走 | 业务模板、里程碑、工单、批复 | | 外部协作 | 让供应商/工厂/服务商参与 | 协作团队、邮件协作、采集端 | | 权限隔离 | 防止越权查看和误操作 | 角色权限、数据围栏、字段显隐 | | 数据采集 | 收集现场、附件、表单和证据 | 工单、附件、采集端、图片编辑 | | 自动化提醒 | 减少人工催办和遗漏 | 自动化、消息通知、定时任务 | | 审计追溯 | 保留过程证据和责任 | 动态、历史记录、操作日志 | | 可视化分析 | 让管理层看到进度、异常和风险 | 仪表盘、报告、跨 FlowSpace 数据 | | 复盘沉淀 | 将经验转为可复用资产 | 客户样本、FAQ、SOP、Skill |  ## 3. 场景到能力组合  | 场景 | 能力组合 | | --- | --- | | 供应商/工厂准入 | 资源库 + 准入 FlowSpace + 审核工单 + 批复 + 权限 + 看板 | | 订单履约跟踪 | 订单 + 里程碑 + 工单 + 自动化 + 仪表盘 | | QC 验货 | 验货工单 + 采集端 + 附件 + 批复 + 异常跟进 | | 出货单证 | 出货里程碑 + 单证工单 + 附件 + 批复 + 到期提醒 | | 绩效风险 | 资源库 + 跨 FlowSpace 数据 + 指标口径 + 仪表盘 + 改善工单 |  ## 4. 方案设计顺序  1. 明确业务目标和适用场景。 2. 找出主数据和流程数据。 3. 设计 FlowSpace、里程碑和工单。 4. 设计角色、权限和数据围栏。 5. 设计自动化提醒和异常升级。 6. 设计仪表盘和指标口径。 7. 设计上线试点和复盘机制。  ## 5. 常见误区  | 误区 | 风险 | 正确做法 | | --- | --- | --- | | 先做大屏 | 数据不可信 | 先统一对象、字段和状态 | | 先做自动化 | 误触发、漏触发 | 先确认流程和字段规则 | | 所有异常都 CAP | 流程过重 | 设置 CAP 触发边界 | | 外部协作直接开放全部数据 | 数据泄露 | 先设计协作团队和数据围栏 | | 一套模板覆盖所有客户 | 适配困难 | 沉淀场景模式和配置变体 |  ## 6. 关联知识  - [运营专业知识建设路线图](../55-外贸供应链行业知识/运营专业知识建设路线图.md) - [客户访谈与方案评审 SOP](../50-运营支持知识/06-运营规范与SOP/客户访谈与方案评审SOP.md) - [运营专业方案设计](../50-运营支持知识/08-工作技能/运营专业方案设计.md)", "domain": "数字供应链", "module": "数字供应链专项知识", "tags": "协同平台;FlowSpace;工单;权限;自动化;看板", "sources": []}, {"path": "docs/56-数字供应链专项知识/供应链可视化与预警体系.md", "title": "供应链可视化与预警体系", "folder": "docs/56-数字供应链专项知识", "text": "# 供应链可视化与预警体系  ## 1. 目标  供应链可视化不是把所有数据做成图，而是让不同角色及时看到该处理的任务、该关注的风险和该决策的指标。预警也不是越多越好，而是基于明确对象、状态、期限、责任人和影响范围触发。  ## 2. 可视化层级  | 层级 | 面向角色 | 关注问题 | 典型视图 | | --- | --- | --- | --- | | 待办视图 | 一线执行人 | 我今天要处理什么 | 待提交、待审核、待复核 | | 进度视图 | 运营/跟单 | 哪些订单或流程卡住 | 订单阶段、里程碑状态、逾期工单 | | 异常视图 | 负责人 | 哪些问题需要升级 | 质量异常、单证缺失、CAP 逾期 | | 风险视图 | 管理层 | 哪些供应商/工厂/订单高风险 | 高风险工厂、未关闭问题、延期订单 | | 绩效视图 | 管理层/采购 | 哪些对象表现好或差 | 准时率、通过率、关闭周期、资料完整率 |  ## 3. 预警类型  | 预警 | 触发条件 | 管理动作 | | --- | --- | --- | | 期限预警 | 日期临近或逾期 | 催办责任人 | | 状态预警 | 长时间停留在某状态 | 查卡点 | | 数据完整性预警 | 必填字段或附件缺失 | 补资料 | | 风险状态预警 | 工厂/供应商高风险 | 限制使用或复审 | | 异常升级预警 | 重大、重复或逾期异常 | 升级负责人 | | 指标异常预警 | 指标低于阈值 | 做复盘和改善计划 |  ## 4. 指标设计原则  每个指标必须回答：  1. 谁看这个指标？ 2. 用它做什么决策？ 3. 分子、分母和排除项是什么？ 4. 数据来自哪个字段、工单或资源库？ 5. 异常后采取什么动作？  ## 5. 场景指标建议  | 场景 | 一线指标 | 管理指标 | | --- | --- | --- | | 工厂准入 | 待补资料、待审核、CAP 逾期 | 平均准入周期、通过率、证书有效覆盖率 | | 订单履约 | 逾期工单、待批复订单 | 准时交付率、延期天数、异常关闭率 | | QC 验货 | 待验货、报告待确认 | 验货通过率、复验率、质量异常关闭周期 | | 出货单证 | 单证未提交、待审核 | 单证一次通过率、出货准时率 | | 供应商绩效 | 改善计划待处理 | 准时率、验货通过率、CAP 按期关闭率 |  ## 6. Linkincrease 落地方式  | 需求 | Linkincrease 能力 | | --- | --- | | 一线待办 | 工单视图、任务中心、消息 | | 进度跟踪 | FlowSpace、里程碑、订单视图 | | 异常预警 | 工单状态、自动化、消息通知 | | 管理看板 | Tower 仪表盘、报告 | | 跨场景分析 | 跨 FlowSpace 数据、资源库引用 | | 审计追溯 | 历史记录、动态、操作日志 |  ## 7. 建设顺序  1. 先做待办和逾期视图。 2. 再做流程进度和异常看板。 3. 再做供应商、工厂、订单维度的管理指标。 4. 最后做趋势、评分、风险预测。  ## 8. 关联知识  - [核心指标口径](../60-数据分析支持/核心指标口径.md) - [仪表盘配置说明](../60-数据分析支持/仪表盘配置说明.md) - [供应商绩效与风险管理](../55-外贸供应链行业知识/03-业务流程与单据/供应商绩效与风险管理.md)", "domain": "数字供应链", "module": "数字供应链专项知识", "tags": "可视化;预警;仪表盘;指标;风险", "sources": []}, {"path": "docs/56-数字供应链专项知识/供应链数字化成熟度模型.md", "title": "供应链数字化成熟度模型", "folder": "docs/56-数字供应链专项知识", "text": "# 供应链数字化成熟度模型  ## 1. 目标  本模型用于产品成功和产品经理判断客户当前处于什么数字化阶段，避免在基础数据和流程还没跑通时，过早承诺复杂自动化、预测分析或智能决策。  ## 2. 成熟度分级  | 等级 | 状态 | 典型表现 | Linkincrease 建设重点 | | --- | --- | --- | --- | | L0 人工分散 | Excel、邮件、聊天驱动 | 数据重复、责任不清、进度靠问 | 先梳理对象、角色、流程和字段 | | L1 线上记录 | 有系统记录，但结构不稳定 | 数据能录入，但难复用和统计 | 建资源库、模板和基本权限 | | L2 流程协同 | 业务流程在线跑通 | 有工单、批复、提醒和外部协作 | 标准化 FlowSpace、自动化和审计 | | L3 管理可视 | 管理层能看见进度、异常和风险 | 有稳定指标和仪表盘 | 建指标口径、看板和复盘机制 | | L4 数据驱动 | 用数据指导供应商、订单和风险管理 | 有周期评价、预警和改善闭环 | 建绩效、风险、改善计划和数据质量治理 | | L5 智能优化 | 规则和模型辅助预测、推荐和优化 | 可预测延期、风险和资源瓶颈 | 需要稳定历史数据和明确规则，谨慎承诺 |  ## 3. 快速诊断问题  | 维度 | 诊断问题 | | --- | --- | | 数据 | 是否有统一供应商、工厂、产品、订单、证书和报告主数据？ | | 流程 | 是否知道每个业务从发起到关闭的节点和责任人？ | | 权限 | 外部供应商、工厂、服务商是否有清晰数据边界？ | | 状态 | 订单、工单、异常、审核和 CAP 是否有统一状态？ | | 自动化 | 提醒和触发是否基于稳定字段，而不是人工记忆？ | | 指标 | 管理层看的指标是否有分子、分母、时间范围和数据来源？ | | 复盘 | 上线后是否沉淀客户样本、问题和改进动作？ |  ## 4. 阶段建议  | 当前阶段 | 不建议直接做 | 推荐下一步 | | --- | --- | --- | | L0 | 智能分析、大屏、复杂自动化 | 建资源库和最小流程模板 | | L1 | 跨场景绩效评分 | 标准化字段、状态和权限 | | L2 | 黑箱风险预测 | 做运营看板和异常闭环 | | L3 | 复杂算法 | 固化指标口径和复盘机制 | | L4 | 无来源的自动决策 | 建规则、样本和历史数据 |  ## 5. 输出模板  ## 客户当前成熟度判断 ## 证据 ## 当前最主要短板 ## Linkincrease 推荐建设重点 ## 暂不建议承诺的能力 ## 30 天试点目标 ## 后续升级路径  ## 6. 关联知识  - [数字供应链基础框架](./数字供应链基础框架.md) - [供应链协同平台能力模型](./供应链协同平台能力模型.md) - [上线后 30 天价值复盘 SOP](../50-运营支持知识/06-运营规范与SOP/上线后30天价值复盘SOP.md)", "domain": "数字供应链", "module": "数字供应链专项知识", "tags": "数字化成熟度;供应链;阶段判断;产品成功", "sources": []}, {"path": "docs/56-数字供应链专项知识/供应链系统地图与边界.md", "title": "供应链系统地图与边界", "folder": "docs/56-数字供应链专项知识", "text": "# 供应链系统地图与边界  ## 1. 目标  本页用于说明供应链常见系统的职责边界，帮助产品成功判断客户需求应该由 Linkincrease 承载，还是应由 ERP、PLM、MES、WMS、TMS、QMS、SRM 或外部系统承载。  ## 2. 常见系统版图  | 系统 | 主要职责 | 常见数据 | 与 Linkincrease 的关系 | | --- | --- | --- | --- | | ERP | 订单、采购、财务、库存、结算 | 采购订单、供应商、物料、价格、发票 | Linkincrease 可协同订单履约和外部任务，ERP 保持交易和财务权威 | | PLM | 产品开发、款式、规格、BOM | 款式、规格、样品、BOM、版本 | Linkincrease 可协同样品/资料收集，PLM 保持产品技术数据权威 | | MES | 生产执行、工序、产量、设备 | 生产计划、工序进度、产量、异常 | Linkincrease 可采集/协同进度，MES 保持车间执行明细 | | WMS | 仓储、收发货、库存 | 库位、库存、入库、出库 | Linkincrease 可协同出货资料，不替代库存管理 | | TMS | 运输计划和物流执行 | 运输单、路线、承运人、轨迹 | Linkincrease 可协同出货节点和单证，不替代运输执行 | | QMS | 质量标准、检验、缺陷、质量改进 | 检验标准、缺陷、质量事件 | Linkincrease 可承载验货协同和 CAP，不替代完整质量体系 | | SRM | 供应商准入、绩效、合同、风险 | 供应商档案、评价、合同 | Linkincrease 可承载准入/协同/绩效轻量场景 | | 协同平台 | 跨组织流程、任务、证据、审批、看板 | 工单、附件、状态、批复、日志 | Linkincrease 的核心定位 |  ## 3. 边界判断  | 客户需求 | 优先判断 | | --- | --- | | 要录入和协同供应商资料 | Linkincrease 资源库 + 权限 | | 要管理采购订单金额、发票、付款 | ERP/财务系统为主，Linkincrease 只做协同证据 | | 要跟踪生产现场每道工序产量 | MES 为主，Linkincrease 可做节点采集或异常协同 | | 要管理出货文件收集和审批 | Linkincrease 可承载 | | 要自动计算库存可用量 | WMS/ERP 为主 | | 要质量抽样标准和缺陷库 | QMS 或专业规则为主，Linkincrease 可做验货协同 | | 要供应商风险和绩效看板 | Linkincrease 可做轻量看板，复杂评分模型需确认 |  ## 4. 集成表达方式  不要直接承诺“我们可以替代 ERP/MES/WMS”。更稳妥的表达：  Linkincrease 更适合承载跨组织协同、任务推进、资料收集、审批留痕和运营看板。 如果客户已有 ERP/MES/WMS/TMS/QMS，可以把它们作为专业数据源或执行系统， Linkincrease 负责把外部协作和过程证据组织起来。  ## 5. Linkincrease 系统边界  | 适合承载 | 谨慎承诺 | | --- | --- | | 外部供应商/工厂协作 | 财务记账、付款、库存核算 | | FlowSpace 流程跟踪 | 生产排程和设备执行 | | 工单采集、附件和批复 | 专业质量标准自动判定 | | 权限隔离和数据围栏 | 运输轨迹实时追踪 | | 自动化提醒和审计 | 法规合规自动判断 | | 运营仪表盘和报告 | 复杂预测和优化算法 |  ## 6. 关联知识  - [供应链协同平台能力模型](./供应链协同平台能力模型.md) - [Linkincrease 在数字供应链中的定位](./Linkincrease在数字供应链中的定位.md) - [集成方案](../80-架构与技术方案/集成方案.md)", "domain": "数字供应链", "module": "数字供应链专项知识", "tags": "ERP;MES;WMS;TMS;QMS;SRM;系统边界", "sources": []}, {"path": "docs/56-数字供应链专项知识/数字供应链基础框架.md", "title": "数字供应链基础框架", "folder": "docs/56-数字供应链专项知识", "text": "# 数字供应链基础框架  ## 1. 定义  数字供应链不是把线下表格搬到系统里，而是用数字化方式连接供应链中的组织、对象、流程、数据、风险和决策。它要解决的问题包括：数据分散、流程不可见、责任不清、异常滞后、外部协同困难、管理层缺少可信指标。  对 Linkincrease 而言，数字供应链的重点不是替代所有专业系统，而是承载跨组织协同、流程跟踪、数据采集、权限隔离、审计追溯和运营可视化。  ## 2. 数字供应链能力层  | 层级 | 目标 | 典型能力 | Linkincrease 关注点 | | --- | --- | --- | --- | | 连接层 | 连接内外部组织和系统 | 外部协作、账号、邮件、API | 协作团队、数据围栏、外部采集、集成 | | 数据层 | 建立可复用对象和可信数据 | 主数据、流程数据、附件、历史快照 | 资源库、订单、工单、字段、附件、历史记录 | | 流程层 | 将业务过程可执行化 | 阶段、任务、审批、状态、异常 | FlowSpace、里程碑、工单、批复、自动化 | | 管控层 | 管理权限、风险和合规 | 角色权限、审计、预警、升级 | 权限体系、日志、自动化提醒、风险看板 | | 分析层 | 支持管理决策 | 指标、仪表盘、报告、趋势 | Tower 仪表盘、跨 FlowSpace 数据、报告 | | 智能层 | 辅助判断和优化 | 预测、推荐、异常识别、Agent | 依赖稳定数据和业务规则，现阶段应谨慎承诺 |  ## 3. 常见客户问题归类  | 客户原话 | 本质问题 | 优先建设 | | --- | --- | --- | | “资料都在 Excel 和聊天里” | 主数据和附件治理 | 资源库、字段标准、权限 | | “进度要一个个问供应商” | 外部协同和流程可视化 | FlowSpace、工单、自动化提醒 | | “不知道哪些订单有风险” | 状态、异常和预警缺失 | 关键节点、异常工单、看板 | | “管理层想看供应商表现” | 指标口径和数据来源不稳 | 指标定义、跨流程数据、仪表盘 | | “想自动判断风险” | 数据和规则还未沉淀 | 先做数据治理和人工规则，再谈智能 |  ## 4. 建设顺序  flowchart LR A[\"业务场景识别\"] --> B[\"主数据治理\"] B --> C[\"流程标准化\"] C --> D[\"权限和审计\"] D --> E[\"自动化提醒\"] E --> F[\"可视化看板\"] F --> G[\"复盘和优化\"] G --> H[\"智能分析/预测\"]  不要跳过前面的数据和流程治理，直接做“智能预警”或“管理大屏”。没有稳定对象、状态和字段口径，后续分析会失真。  ## 5. Linkincrease 方案表达方式  对客户讲数字供应链时，应按这个顺序表达：  1. 先说明客户处在哪个业务场景和数字化阶段。 2. 说明当前问题属于数据、流程、协同、权限、预警还是分析。 3. 说明 Linkincrease 用哪些对象承载：资源库、FlowSpace、订单、里程碑、工单、批复、仪表盘。 4. 说明哪些能力标准支持，哪些需要配置，哪些要外部系统或人工规则。 5. 说明上线先做什么，后续如何扩展。  ## 6. 关联知识  - [供应链数字化成熟度模型](./供应链数字化成熟度模型.md) - [供应链系统地图与边界](./供应链系统地图与边界.md) - [Linkincrease 在数字供应链中的定位](./Linkincrease在数字供应链中的定位.md)", "domain": "数字供应链", "module": "数字供应链专项知识", "tags": "数字供应链;能力层;供应链协同;产品成功", "sources": []}, {"path": "docs/60-数据分析支持/README.md", "title": "60 数据分析支持", "folder": "docs/60-数据分析支持", "text": "# 60 数据分析支持  本目录用于沉淀指标口径、仪表盘、报表、数据来源和分析场景。  ## 页面  - [核心指标口径](./核心指标口径.md) - [仪表盘配置说明](./仪表盘配置说明.md) - [报表权限](./报表权限.md) - [数据来源说明](./数据来源说明.md) - [分析场景](./分析场景.md) - [指标变更记录](./指标变更记录.md) ", "domain": "公共能力", "module": "数据分析支持", "tags": "60-数据分析支持;60 数据分析支持", "sources": []}, {"path": "docs/60-数据分析支持/仪表盘配置说明.md", "title": "仪表盘管理与设计器", "folder": "docs/60-数据分析支持", "text": "# 仪表盘管理与设计器  ## 定位  仪表盘用于在 FlowSpace 内配置统计分析页面，帮助用户快速监控订单动态、业务进度和关键指标。运营端负责仪表盘配置和设计，贸易端根据权限查看仪表盘数据。  Tower 是贸易端团队级标准入口，每个团队固定一个 Tower 入口。Tower 页面内按分组展示仪表盘；当协作团队成员被授权查看其他团队 Tower 仪表盘时，在协作方当前团队的 Tower 页面内按协作来源或来源团队展示，不新增多个 Tower 入口。  ## 管理入口  运营端 FlowSpace 列表增加仪表盘数量字段和仪表盘管理入口。  | 能力 | 规则 | |---|---| | 仪表盘数量 | 统计对应 FlowSpace 添加的仪表盘数量 | | 仪表盘管理 | 可进入当前 FlowSpace 的仪表盘管理页面 | | 添加仪表盘 | 仪表盘名称必填，限制 100 字符 | | 修改名称 | 可修改仪表盘名称，限制 100 字符 | | 删除仪表盘 | 需要二次确认 | | 排序 | 支持拖动排序 | | 国际化 | 仪表盘名称支持国际化 |  运营端团队列表也支持团队 Tower 管理入口：`运营端 > 团队管理 > 团队列表 > 操作列 > 仪表盘`。点击后打开当前团队的 Tower 仪表盘管理弹窗，仅展示当前团队已配置的 Tower 分组和仪表盘。  ## 团队 Tower 管理  团队 Tower 管理用于维护团队级仪表盘分组、仪表盘名称、图标、帆软链接、状态和展示顺序。运营端只维护基础配置和分组，不直接维护贸易端可见权限；运营端可查看可见范围概览，便于判断帆软链接维护影响对象。  ### Tower 分组  Tower 仪表盘必须归属一个分组。分组用于贸易端 Tower 页面按业务主题展示，例如订单履约、供应商绩效、库存与成本。  | 字段 | 规则 | | --- | --- | | 分组名称 | 必填，限制 50 字符，同团队内不可重复 | | 分组名称（英文） | 非必填，限制 100 字符，用于贸易端英文语言展示 | | 状态 | 启用 / 停用 | | 排序 | 支持统一拖拽排序 |  启用分组时，贸易端展示该分组及其下启用仪表盘；停用分组时，贸易端不展示该分组及其下仪表盘。空分组可在运营端展示并继续新增仪表盘；删除分组前必须保证分组下无仪表盘。  ### Tower 仪表盘  | 字段 | 规则 | | --- | --- | | 所属分组 | 必填，新增时默认带入当前分组，可修改 | | 贸易端展示图标 | 必填，从系统预置图标中选择 | | 仪表盘名称 | 必填，限制 100 字符 | | 仪表盘名称（英文） | 非必填，限制 100 字符 | | 帆软链接 | 必填，填写仪表盘访问链接 | | 说明 | 非必填，限制 500 字符 | | 状态 | 默认启用，可切换为停用 | | 打开方式 | V1.0 固定为页面内 iframe 打开 |  新增仪表盘默认追加到所选分组末尾；编辑时修改所属分组，保存后卡片追加到目标分组末尾。删除仪表盘需要二次确认，删除后贸易端不再展示该仪表盘，已配置的可见权限同步失效。  ### 排序与可见范围  仪表盘支持拖拽排序，可跨组拖拽。停用仪表盘仍可参与运营端排序，但贸易端不展示。  运营端提供只读可见范围概览：  | 能力 | 规则 | | --- | --- | | 卡片概览 | 展示内部成员数、协作团队数、协作成员数 | | 查看明细 | 点击可见范围后打开弹窗 | | 无授权成员 | 展示“仅 Tower 管理员可见” | | 编辑限制 | 运营端不支持修改可见权限 | | 权限维护入口 | 可见权限在贸易端团队设置 > Tower 管理中维护 |  ### 贸易端展示规则  | 场景 | 规则 | | --- | --- | | 当前用户无可见仪表盘 | 团队工作台不展示 Tower 入口 | | 当前用户有本团队可见仪表盘 | 展示 Tower 入口 | | 当前用户仅有协作来源仪表盘 | 展示 Tower 入口，进入后仅展示协作来源内容 | | 本团队仪表盘 | 按运营端分组展示 | | 协作来源仪表盘 | 按“来自 {来源团队} > 来源团队分组 > 仪表盘”展示 | | 仪表盘打开 | 服务端二次鉴权通过后，页面内 iframe 打开帆软链接 | | 无权限或已取消授权 | 提示“暂无权限，请联系管理员” |  ## 数据源  仪表盘数据源来自 FlowSpace 的订单信息、里程碑、工单批复等表结构，并可扩展公式字段。  | 数据源 | 字段范围 | |---|---| | 订单信息 | 订单信息字段、里程碑批复字段，排除所有子表字段 | | 订单信息子表 | 订单信息字段、子表字段 | | 里程碑 | 订单列表字段、里程碑字段、工单批复字段，排除所有子表字段 | | 里程碑子表 | 订单列表字段、里程碑字段、子表字段 | | 工单批复子表 | 订单列表字段、里程碑字段、工单批复字段、子表字段 |  如果主表单或里程碑批复包含子表，则订单信息或里程碑会作为分组名，分组下展示对应字段和所有子表。  ### 公式字段  仪表盘支持添加、编辑、删除公式字段。  | 配置 | 规则 | |---|---| | 公式名称 | 必填，限制 100 字符 | | 公式类型 | 必填，默认数字；支持数字、文本、百分比、日期 | | 订单信息公式变量 | 订单信息、订单信息子表、所有里程碑、所有里程碑子表，排除图片、附件、签名、富文本字段 | | 子表公式变量 | 当前子表字段 | | 删除 | 需要二次确认 |  ## 仪表盘设计器组件  仪表盘由布局组件、工具组件、图表组件和特殊图表组成。  | 类型 | 组件 | |---|---| | 布局组件 | 模块分组、标题、标签卡 | | 工具 | 筛选器 | | 图表 | 指标卡、柱状图、折线图、条形图、饼图、组合图、面积图、雷达图、统计表、透视表 | | 特殊图表 | 里程碑状态 |  所有组件通常支持标题、提示描述和国际化。可国际化内容一般包括标题、提示描述，部分图表还包括指标名称。  ## 图表通用配置  大多数图表具备类似的数据配置模型：  | 配置 | 说明 | |---|---| | 数据源 | 从数据表列表选择，默认订单信息 | | 筛选设置 | 可对数据源字段设置筛选条件，并显示已设置条件数量 | | 维度 | 按字段分组统计，日期字段可选年月日、年周、年月、年季、年等格式 | | 指标 | 可添加多个数据源字段或自定义公式字段 | | 统计方式 | 统计记录总数、统计字段数值、自定义公式 | | 排序 | 支持记录顺序、维度值、指标值等排序方式 | | 数据显示 | 可限制展示条数 | | 图表配置 | 图例、数据标签、网格线、推荐配色、自定义配色等 |  多选字段可选择拆分统计或不拆分统计。指标卡计算出的数字统一保留一位小数。  ## 筛选器  筛选器用于联动筛选一个或多个图表。  规则：  1. 可筛选图表为当前仪表盘内的图表，可多选。 2. 所选图表有几个数据源，就展示几个数据源选项。 3. 不同数据源选择的字段必须是同一类型。 4. 最后选择的字段与其他字段类型不一致时，清空其他选项。 5. 日期字段可设置日期格式。 6. 选项字段可设置选项样式。  ## 典型图表  | 图表 | 核心规则 | |---|---| | 指标卡 | 支持统计记录总数、统计字段数值、自定义公式 | | 柱状图 | 支持基础柱状图、堆积柱状图、百分比堆积柱状图 | | 折线图 | 与柱状图类似，侧重趋势展示 | | 条形图 | 与柱状图类似，横纵轴方向不同 | | 饼图 | 支持实心和圆环；配置扇区分组和扇区数值 | | 组合图 | 指标可设置为折线或柱状，并选择左轴或右轴 | | 统计表 | 支持维度、统计方式、汇总、序号、排序 | | 透视表 | 支持行维度、列维度、指标、冻结和汇总 | | 里程碑状态 | 特殊图表，可按订单筛选并展示里程碑状态分布 |  ## 仪表盘权限  贸易端按角色控制仪表盘查看和授权。  | 权限来源 | 能力 | |---|---| | 团队角色-内部FlowSpace管理 | 可查看所有内部 FlowSpace 的仪表盘数据，并可授权 | | FlowSpace业务角色-仪表盘管理 | 可查看当前 FlowSpace 所有仪表盘数据，并可授权 | | 被授权成员 | 可查看被授权的仪表盘 | | 被授权协作团队成员 | 可查看被授权的仪表盘 |  仪表盘权限设置弹窗列出已加入当前 FlowSpace 的内部成员和协作团队成员。内部成员和协作成员即使未注册也可以授权。  权限维护规则：  1. 可模糊搜索内部成员姓名、协作团队名称、协作成员姓名。 2. 协作团队成员支持两级下钻选择。 3. 已选计数和左右列表选中状态需要同步。 4. 当前用户无仪表盘管理权限时，提示暂无权限。 5. 成员被移除 FlowSpace 后，对应仪表盘权限列表也删除；重新加入后需重新授权。  ## 仪表盘查看  可管理当前 FlowSpace 仪表盘的用户可以查看当前 FlowSpace 中所有仪表盘数据。被授权部分仪表盘查看权限的成员或协作团队成员，只能查看被授权仪表盘。  可查看的仪表盘可以星标，星标后在工作台常用视图中展示。如果星标后权限被取消，常用视图中同步隐藏；重新授权后若还需要常用入口，需要重新星标。  ## 关联页面  - [仪表盘与报告权限](../40-权限、安全与审计/仪表盘与报告权限.md) - [常用视图与视图设置](../60-数据分析支持/分析场景.md) - [公式函数](../20-业务对象与数据模型/公式函数.md) - [数据围栏](../40-权限、安全与审计/数据围栏.md)  ## 来源  - `source:thoughts-v2-current/v2.3.x/运营端/【运营端】【SCCS列表-仪表盘】SCCS仪表盘管理.md` - `source:thoughts-v2-current/v2.8/运营端/【运营端】【团队列表-仪表盘】团队Tower管理.md` - `missing-current-source/【运营端】【仪表盘】表单设计组件.md` - `source:thoughts-v2-current/V2.5.x/贸易端/【贸易端】【仪表盘】权限管理.md`  ", "domain": "运营端", "module": "数据分析支持", "tags": "仪表盘;设计器;图表;数据源;权限;Tower", "sources": [{"title": "【运营端】【SCCS列表-仪表盘】SCCS仪表盘管理", "version": "v2.3.x", "product_side": "运营端", "module": "SCCS列表-仪表盘", "last_write_time": "2026-09-04T10:48:09"}, {"title": "【运营端】【团队列表-仪表盘】团队Tower管理", "version": "v2.8", "product_side": "运营端", "module": "团队列表-仪表盘", "last_write_time": "2026-09-04T10:47:43"}, {"title": "【贸易端】【仪表盘】权限管理", "version": "V2.5.x", "product_side": "贸易端", "module": "仪表盘", "last_write_time": "2026-09-04T10:48:00"}]}, {"path": "docs/60-数据分析支持/分析场景.md", "title": "常用视图与视图设置", "folder": "docs/60-数据分析支持", "text": "# 常用视图与视图设置  ## 定位  视图是用户在订单列表中沉淀查询、字段显示、排序、列统计、列宽、分页和查看模式等展示配置的载体。常用视图则把用户高频访问或主动星标的视图带回工作台，成为个人化快捷入口。  ## 常用视图  常用视图展示当前用户标星的视图和访问次数前 10 的视图。常用视图仅对个人可见。  | 项目 | 规则 | |---|---| | 数据来源 | 用户标星的视图 + 访问次数前 10 的视图 | | 去重 | 同一视图只展示一次 | | 权限 | 不展示当下无权限的视图；标星视图点击时仍需判断权限 | | 排序 | 先按星标时间倒序，再按访问次数倒序 | | 访问次数相同 | 按最后访问时间正序 | | 空状态 | 提示用户进入 FlowSpace 将常访问视图标星 | | 状态记忆 | 按账号记住最后一次选中 FlowSpace 列表或常用视图列表状态 |  访问次数超过 999 后显示为 `1k` 类格式，保留一位小数并向下取整。  ## 订单列表查询  订单列表查询由模糊搜索和条件查询组成，两者为且关系。  ### 模糊搜索  模糊搜索支持当前列表所有文字类型字段的搜索，包括文本、数字、百分比、评级、单多选、日期、成员、协作团队、富文本文字部分、公式控件、关联引用字段等。  关键规则：  1. 隐藏字段不在模糊搜索范围内。 2. 搜索结果可高亮展示，并显示结果条数。 3. 支持切换上一条、下一条并定位到对应单元格。 4. 搜索范围跨页，高亮范围为当前页。 5. 按用户记住最近 5 次模糊搜索记录，不区分团队和 FlowSpace。  ### 条件查询  条件查询只在当前用户自己的数据权限范围内筛选。  可查询字段范围：  | 类型 | 字段 | |---|---| | 模板字段 | 主表单、各里程碑批复字段 | | 系统字段 | 订单 ID、订单状态、创建人、创建时间、更新人、更新时间、里程碑批复人、批复时间、里程碑状态、负责人、计划时间、实际时间、耗时等 | | 自定义标签 | FlowSpace 设置中添加的主表单标签字段、各里程碑标签字段 |  数据围栏限制当前用户不可见的字段，查询字段也不可见。自定义视图中，如果被设为条件的字段在运营端被删除，对应字段展示删除样式并增加说明。  ### 表头查询  表头可设置快捷查询条件。表头查询和右上角查询入口双向同步，被设置查询条件的列需要标记。  ## 字段配置  字段配置用于控制列表展示字段、冻结列和不同查看模式下的字段表现。  | 配置 | 规则 | |---|---| | 冻结列 | 最多 5 个，最少 0 个 | | 默认冻结 | 订单标识默认作为默认视图的冻结列 | | 字段显隐 | 打开为显示，关闭为隐藏 | | 默认隐藏 | 订单 ID 默认隐藏，其余字段默认显示 | | 全部操作 | 支持显示所有、隐藏所有 | | 数据围栏 | 不可见字段在字段配置中也不可见 |  冻结列适用于所有查看模式；非冻结列主要适用于详情查看模式。  ## 排序  排序支持右上角排序设置和表头快捷排序，两者双向同步。  | 项目 | 规则 | |---|---| | 排序字段数 | 每次最多 3 列，最少 0 列 | | 多字段排序 | 先按第一字段排序，相同值再按第二字段、第三字段排序 | | 顺序调整 | 可拖拽修改排序字段顺序 | | 默认排序 | 未设置排序字段时，按订单编号倒序 |  支持排序的字段类型包括文本、数字、百分比、评级、单多选、日期、成员姓名、协作团队名称、富文本文字部分、定位、地址、汇率，以及设置为这些类型的公式和关联引用字段。  文本升序规则为：空值、特殊符号、数字、英文字母、中文首字母；降序反向。相同值时，按订单 ID 排序。  ## 列统计  列统计在列表底部展示基础数据统计，统计结果基于当前筛选结果跨页计算。  | 统计方式 | 说明 | |---|---| | 计数 | 当前表格数据条数 | | 求和 | 当前列总和 | | 平均值 | 有值数据总和 / 有值条数 | | 最大值 | 当前列有值数据中的最大值 | | 最小值 | 当前列有值数据中的最小值 | | 未填写 | 当前列空值条数 | | 已填写 | 当前列有值条数 | | 唯一值 | 当前列非空值去重计数 |  规则补充：  1. 数字控件默认统计求和，包括数字公式和关联引用数字。 2. 百分比、评级不纳入数字默认求和。 3. 查询结果变更或编辑订单后，已设置的统计规则保留，并按最新数据重新计算。 4. 有勾选数据时统计勾选部分；没有勾选时统计当前筛选全部数据。 5. 图片、文件、富文本暂不做唯一值统计。 6. 操作人和操作时间同列时，默认统计操作人。 7. 里程碑计划时间、实际时间同列时，不进行统计。  ## 视图保存  视图用于保存列表的展示配置。  触发保存提示的配置变更包括：  - 查询条件、表头查询、模糊搜索 - 字段配置 - 排序 - 列统计 - 列宽调整 - 每页显示条数 - 查看模式切换  视图类型：  | 类型 | 规则 | |---|---| | 默认视图 | 第一次进入列表时存在，展示所有字段、无排序、无筛选；不支持覆盖、重命名、删除 | | 自定义视图 | 支持另存为、覆盖当前、重命名、删除 |  视图排序支持在每个主表单或里程碑模块下拖拽排序，不可跨模块拖拽。里程碑之间也可拖拽排序。  ## 关联页面  - [工作台与FlowSpace入口](../10-功能模块详情/工作台.md) - [订单生命周期](../30-业务流程与产品流程图/订单生命周期.md) - [数据围栏](../40-权限、安全与审计/数据围栏.md) - [资源库](../20-业务对象与数据模型/资源库.md)  ## 子表查看模式  订单列表支持子表查看模式，用于对比查看多条订单下同一子表的数据。切换到子表模式时：  - 下拉选择当前列表模板配置中的一个子表，默认选中模板顺序中的第一个子表。 - 主表单或工单无子表时，对应视图隐藏“子表”切换标签；模板未配置子表时提示没有可展开的子表。 - 展开的子表列仅展示子表字段，并通过列底色区分当前展开区域。 - 字段显隐和位置沿用详情模式字段配置；切换查看模式不影响当前排序和查询规则。 - 列统计按当前展开数据计算，并在查看模式切换过程中记住各模式的列统计规则。 - 子表模式不支持排序和翻页。  ## 来源  - `source:thoughts-v2-current/v2.3.x/贸易端/【贸易端】【工作台】订单日程、任务中心、常用视图.md` - `source:thoughts-v2-current/v2.2.x/贸易端/【贸易端】【订单列表】视图设置.md` - `source:thoughts-v2-current/v2.3.x/贸易端/【贸易端】【订单列表】视图模式：子表.md` - `source:thoughts-v2-current/V2.5.x/贸易端/【贸易端】【资源库】视图管理.md` ", "domain": "贸易端", "module": "数据分析支持", "tags": "常用视图;视图设置;查询;排序;列统计", "sources": [{"title": "【贸易端】【工作台】订单日程、任务中心、常用视图", "version": "v2.3.x", "product_side": "贸易端", "module": "工作台", "last_write_time": "2026-09-04T10:48:17"}, {"title": "【贸易端】【订单列表】视图设置", "version": "v2.2.x", "product_side": "贸易端", "module": "订单列表", "last_write_time": "2026-09-04T10:48:36"}, {"title": "【贸易端】【订单列表】视图模式：子表", "version": "v2.3.x", "product_side": "贸易端", "module": "订单列表", "last_write_time": "2026-09-04T10:48:15"}, {"title": "【贸易端】【资源库】视图管理", "version": "V2.5.x", "product_side": "贸易端", "module": "资源库", "last_write_time": "2026-09-04T10:48:01"}]}, {"path": "docs/60-数据分析支持/报表权限.md", "title": "报告管理与权限", "folder": "docs/60-数据分析支持", "text": "# 报告管理与权限  ## 定位  报告能力用于将订单、里程碑、工单等业务对象与第三方报告链接关联，并按角色和参与关系控制查看权限。报告本身以外部链接形式打开，Linkincrease 负责入口、配置、权限判断和数据表同步。  ## 报告类型  | 类型 | 说明 | |---|---| | 订单报告 | 挂在订单信息层级 | | 里程碑报告 | 挂在里程碑层级 | | 工单报告 | 挂在里程碑下的工单层级 |  贸易端有权限时才展示对应报告按钮。点击按钮后仍需再次判断权限。  ## 贸易端查看  报告入口展示规则：  1. 当某类报告只有一个时，仅展示“查看报告”。 2. 点击“查看报告”后，在浏览器新页签打开报告。 3. 当某类报告有多个时，点击“查看报告”后下拉展示多个报告名称。 4. 点击对应报告名称后，在新页签打开报告。 5. 报告查看页面支持打印。 6. 无权限时提示“暂无权限，请联系管理员”。  ## 运营端报告管理  运营端 FlowSpace 列表增加报告管理入口，用于维护第三方报告链接。  报告列表默认按模板结构展示：  1. 订单信息。 2. 里程碑名称分组。  可在对应分组下新增、编辑、删除报告。里程碑分组下新增报告时，需要选择报告类型：里程碑报告或工单报告，其中里程碑报告为默认类型。  | 字段 | 规则 | |---|---| | 报告名称 | 必填，限制 100 字符 | | 报告名称国际化 | 支持 | | 报告地址 | 必填 | | 数据表列表 | 功能同仪表盘，数据同步 |  ## 权限矩阵  | 角色或关系 | 订单报告 | 里程碑报告 | 工单报告 | |---|---:|---:|---:| | 团队角色-内部FlowSpace管理 | 可看 | 可看 | 可看 | | FlowSpace角色-查看订单报告 | 可看 |  |  | | FlowSpace角色-查看里程碑报告 |  | 可看 |  | | FlowSpace角色-查看工单报告 |  |  | 可看 | | 里程碑批复人 |  | 可看参与批复的里程碑 | 可看参与里程碑批复的工单 | | 工单批复人 |  |  | 可看参与批复的工单 | | 工单采集人 |  |  | 可看参与采集的工单 | | 协作团队-里程碑批复指派 |  | 可看本团队参与批复的里程碑 | 可看本团队参与里程碑批复的工单 | | 协作团队-工单批复指派 |  |  | 可看本团队参与批复的工单 | | 协作团队-工单采集指派 |  |  | 可看本团队参与采集的工单 |  ## 权限判断  报告权限分为前端展示判断和点击后的实际权限判断。  | 阶段 | 规则 | |---|---| | 页面展示 | 有相关报告权限时才展示对应按钮 | | 点击报告 | 再次判断权限 | | 有权限 | 新页签打开报告 | | 无权限 | 提示暂无权限，请联系管理员 |  ## 与仪表盘的关系  报告管理的数据表列表功能同仪表盘，并与仪表盘数据同步。也就是说，报告配置侧可以复用仪表盘的数据表结构、字段范围和数据源组织方式。  报告偏向“外部链接查看和打印”，仪表盘偏向“平台内配置化数据分析”。两者共享 FlowSpace 数据结构，但权限、入口和展示方式不同。  ## 关联页面  - [仪表盘管理与设计器](./仪表盘配置说明.md) - [仪表盘与报告权限](../40-权限、安全与审计/仪表盘与报告权限.md) - [订单](../20-业务对象与数据模型/订单.md) - [工单与批复](../20-业务对象与数据模型/工单与批复.md)  ## 来源  - `source:thoughts-v2-current/V2.5.x/贸易端/【贸易端】报告权限.md` - `source:thoughts-v2-current/V2.6.x/运营端/【运营端】【SCCS管理】SCCS列表增加报告管理.md` ", "domain": "贸易端", "module": "数据分析支持", "tags": "报告;报告权限;第三方报告;订单报告;工单报告", "sources": [{"title": "【贸易端】报告权限", "version": "V2.5.x", "product_side": "贸易端", "module": "贸易端", "last_write_time": "2026-09-04T10:48:04"}, {"title": "【运营端】【SCCS管理】SCCS列表增加报告管理", "version": "V2.6.x", "product_side": "运营端", "module": "SCCS管理", "last_write_time": "2026-09-04T10:47:55"}]}, {"path": "docs/60-数据分析支持/指标变更记录.md", "title": "指标变更记录", "folder": "docs/60-数据分析支持", "text": "# 指标变更记录  本页用于记录指标口径、数据来源、权限范围和展示方式的变化。  ## 记录模板  | 日期 | 指标 | 变更内容 | 影响范围 | 来源 | | --- | --- | --- | --- | --- | | 待补充 | 待补充 | 待补充 | 待补充 | 待补充 |  ## 维护规则  指标变更必须同步检查仪表盘、报表、运营说明和需求文档，避免同一指标在不同页面口径不一致。 ", "domain": "公共能力", "module": "数据分析支持", "tags": "60-数据分析支持;指标变更记录", "sources": []}, {"path": "docs/60-数据分析支持/数据来源说明.md", "title": "订单日程与任务中心", "folder": "docs/60-数据分析支持", "text": "# 订单日程与任务中心  ## 定位  订单日程与任务中心是工作台上的事务处理入口，目标是让用户登录后快速看到自己需要关注、处理、指派或追踪的工作。  ## 订单日程  订单日程向里程碑负责人展示需要关注的订单里程碑计划，按日期和 FlowSpace 聚合展示。  ### 计划负责人来源  FlowSpace 设置-计划管理支持设置默认负责人。创建或编辑订单时，各里程碑负责人默认按规则填入。  | 配置项 | 规则 | |---|---| | 所有订单 | 所有订单统一负责人规则 | | 按条件区分 | 根据主表单字段条件，为不同订单设置不同负责人 | | 可选负责人 | 订单创建人、FlowSpace 内部成员、FlowSpace 内协作团队成员 | | 条件字段范围 | 主表单模板字段；运算符后选择的其他字段也限制在主表单范围 |  创建或编辑订单时，如果字段数据满足条件，里程碑负责人自动按配置填入。  ### 工作台展示  订单日程按日历展示计划开始和计划结束信息。  | 项目 | 说明 | |---|---| | 计划截止 | 展示计划结束时间到达但当前还未结束的里程碑 | | 计划开始 | 展示计划开始时间到达但当前还未开始的里程碑 | | 日期标识 | 日期上展示开始或截止标识，点击日期查看当天明细 | | 分组 | 明细以 FlowSpace 分组，协作 FlowSpace 显示所属团队名称 | | 跳转 | 点击行跳转订单详情并定位到对应里程碑 |  计划今天截止展示订单标识、里程碑名称、工单完成进度、工单批复完成进度。计划今天开始展示订单标识和里程碑名称。  ## 任务中心概览  工作台任务数据分为三类：  | 类型 | 说明 | |---|---| | 团队任务 | 当前用户作为协作团队对接人，或有相关任务指派权限时可指派的任务 | | 我的任务 | 当前账号相关的待办、已处理、已完成任务 | | 邮件协作任务 | 当前账号发起或接收的邮件协作任务 |  工作台任务卡片上的数量可点击跳转到任务中心并自动带入过滤条件。  ## 团队任务  团队任务展示当前用户在当前团队有指派权限的任务。  | 状态 | 包含数据 | |---|---| | 待指派 | 里程碑进行中，任务未指派，且任务仍可处理 | | 已指派 | 里程碑进行中，任务已指派 | | 已完成 | 里程碑已完成或已取消，或工单已批复、已终止采集等不可编辑状态 |  团队任务默认展示“待指派”。标签和主菜单需要展示待指派任务数角标。  ## 我的任务  我的任务展示当前用户可以采集、批复或处理的任务。  | 状态 | 包含数据 | |---|---| | 待处理 | 当前用户尚未完成处理，任务仍处于可编辑状态 | | 已处理 | 当前用户已处理，但任务整体仍处于进行中 | | 已完成 | 任务因里程碑完成、取消、工单批复、终止采集等进入不可编辑状态 |  协作团队未指派的任务，会显示在有权限成员的待处理中。有指派权限的协作方成员直接处理任务后，视为指派给自己并已处理。  ## 我发起的  “我发起的”展示当前用户在当前团队下发出的工单或里程碑批复任务。  | 状态 | 包含数据 | |---|---| | 进行中 | 里程碑进行中，工单未批复、未终止采集 | | 已完成 | 里程碑已完成或已取消，或工单已批复、已终止采集 |  默认展示“进行中”。  ## 我关注的  “我关注的”展示用户在我的任务、团队任务、我发起的中标星的任务。  | 状态 | 规则 | |---|---| | 全部 | 展示当前仍有查看权限的标星任务 | | 进行中 | 标星任务仍处于可处理或进行状态 | | 已完成 | 标星任务已进入不可编辑状态 |  当标星任务失去查看权限时，不展示。  ## 邮件协作任务  邮件协作任务包括“我发起的”和“我协作的”。  | 类型 | 规则 | |---|---| | 我发起的 | 展示当前用户发起且当前有查看权限的邮件协作 | | 我协作的 | 展示当前邮箱账号收到的邮件协作，不区分当前团队 |  邮件协作“我发起的”以工单为分组单位，进行中表示原工单仍可编辑；已完成表示原工单进入不可编辑状态。  邮件协作“我协作的”默认展示待处理。待处理指原工单仍可编辑且当前协作邮箱未提交；已处理指已提交但原工单仍可编辑；已完成指原工单已不可编辑。  ## 任务卡片通用规则  任务卡片通常展示订单标识、FlowSpace 名称、里程碑、工单、计划结束时间、完成度和操作按钮。  | 元素 | 规则 | |---|---| | 计划结束 | 到今天及以前的计划结束时间标红 | | 完成度 | 工单采集完成度按已提交表单数 / 有采集人的表单总数计算 | | 跳转 | 订单标识进入订单详情，FlowSpace 名称进入订单列表，工单打开工单弹窗 | | 操作按钮 | 根据采集、批复、指派、修改处理人等权限展示 | | 星标 | 采集任务和批复任务分别星标 | | 已完成说明 | 显示第一次触发完成的原因和时间 |  ## 查询与排序  任务中心支持模糊搜索和筛选。  | 能力 | 说明 | |---|---| | 默认排序 | 最近发起，即按任务发起时间倒序 | | 可选排序 | 最早发起，即按任务发起时间正序 | | 模糊搜索 | 支持订单标识、里程碑名称、工单名称、FlowSpace 名称 | | 邮件协作搜索 | 邮件协作“我协作的”支持主题和订单标识搜索 | | 计划结束时间 | 对应里程碑计划结束时间 | | 任务更新时间 | 对应每项任务的最终操作时间 | | 任务完成时间 | 任务变更为已完成或不可编辑状态的时间 |  ## 关联页面  - [工作台与FlowSpace入口](../10-功能模块详情/工作台.md) - [邮件协作](../10-功能模块详情/邮件协作.md) - [工单采集与批复](../30-业务流程与产品流程图/工单采集与批复.md) - [里程碑](../20-业务对象与数据模型/里程碑.md)  ## 来源  - `source:thoughts-v2-current/v2.3.x/贸易端/【贸易端】【工作台】订单日程、任务中心、常用视图.md` - `source:thoughts-v2-current/v2.0.x/贸易端/【贸易端】【工作台】工作台、创建SCCS、SCCS分组.md` ", "domain": "贸易端", "module": "数据分析支持", "tags": "订单日程;任务中心;里程碑负责人;邮件协作任务", "sources": [{"title": "【贸易端】【工作台】订单日程、任务中心、常用视图", "version": "v2.3.x", "product_side": "贸易端", "module": "工作台", "last_write_time": "2026-09-04T10:48:17"}, {"title": "【贸易端】【工作台】工作台、创建SCCS、SCCS分组", "version": "v2.0.x", "product_side": "贸易端", "module": "工作台", "last_write_time": "2026-09-04T10:48:46"}]}, {"path": "docs/60-数据分析支持/核心指标口径.md", "title": "核心指标口径", "folder": "docs/60-数据分析支持", "text": "# 核心指标口径  本页用于统一 Linkincrease 数据分析中的核心指标定义。  ## 指标维护模板  | 字段 | 说明 | | --- | --- | | 指标名称 | 指标的标准名称 | | 业务含义 | 指标回答的业务问题 | | 计算口径 | 计算公式、过滤条件、去重规则 | | 数据来源 | FlowSpace、订单、工单、资源库、日志或外部系统 | | 权限范围 | 谁可以查看、是否受数据围栏影响 | | 更新频率 | 实时、定时、手动刷新或离线统计 | | 关联页面 | 仪表盘、报表或运营场景 |  ## 关联文档  - [FlowSpace 数据层级](../20-业务对象与数据模型/FlowSpace数据层级.md) - [仪表盘配置说明](./仪表盘配置说明.md) - [数据来源说明](./数据来源说明.md) ", "domain": "公共能力", "module": "数据分析支持", "tags": "60-数据分析支持;核心指标口径", "sources": []}, {"path": "docs/70-产品维护知识/Demo视觉与页面规范.md", "title": "Demo 视觉与页面规范", "folder": "docs/70-产品维护知识", "text": "# Demo 视觉与页面规范  本页沉淀 Linkincrease Demo 的基础视觉和页面组织规则。它不是前端代码规范，也不替代可运行 prototype；它用于让 AI 或团队成员生成 Demo 时保持统一的产品气质。  ## 1. 总体气质  Linkincrease Demo 应表现为面向 B2B 业务协同的工作台界面：信息密度适中、层级清楚、操作明确、状态可追踪。避免营销页式大标题、过度渐变、装饰性插画和与业务无关的视觉元素。  ## 2. 页面骨架  | 页面类型 | 推荐结构 | 使用说明 | | --- | --- | --- | | 运营端设计器 | 顶部上下文 + 左侧对象树/组件库 + 中间画布 + 右侧属性面板 | 用于模板、表单、字段、资源库模板等配置类页面 | | 运营端管理列表 | 顶部导航 + 筛选区 + 表格 + 批量操作 + 侧滑详情 | 用于用户、团队、资源库、模板、报告等管理页 | | 贸易端列表页 | 顶部团队/FlowSpace 上下文 + 视图/筛选 + 主表格 + 批量操作 | 用于订单列表、工单视图、资源库数据列表 | | 贸易端详情页 | 顶部对象上下文 + 左侧或顶部导航 + 主内容区 + 右侧动态/属性/操作区 | 用于订单、工单、里程碑、资源记录详情 | | 采集端任务页 | 移动端顶部任务上下文 + 分组卡片 + 表单录入 + 底部固定操作 | 用于采集、批复、图片附件和离线草稿 | | 仪表盘页 | 顶部范围和筛选 + 指标卡 + 图表区 + 明细表 | 用于运营监控、风险预警和管理汇总 |  ## 3. 视觉 Token  详细 token 以 `metadata/ui-style-tokens.csv` 为准。Demo 中应优先使用这些约束：  | 类别 | 规则 | | --- | --- | | 页面背景 | 使用浅灰工作台背景，避免纯白大面积无层级页面 | | 主色 | 使用稳定蓝色表达主操作、当前状态和链接 | | 状态色 | 成功、警告、错误、信息状态必须区分，不用单一蓝色表达所有状态 | | 字号 | 表格和面板正文保持 12-14px；页面标题 20-24px；不要用超大营销标题 | | 圆角 | 工作台卡片、弹窗、按钮圆角不超过 8px | | 间距 | 主内容区优先使用 16px 或 24px 间距，表格行高保持紧凑 | | 图标 | 图标用于按钮、状态和对象类型；不使用纯装饰图标堆砌页面 |  ## 4. 组件规则  | 组件 | 必须保持 | | --- | --- | | 顶部栏 | 产品端、团队或 FlowSpace 上下文清楚；主要导航不漂移 | | 筛选区 | 搜索、筛选、视图切换和重置动作集中展示 | | 表格 | 表头固定清晰，状态字段使用 badge，行操作聚合到末列 | | 属性面板 | 配置项按分组展示，保存、取消、发布状态可见 | | 弹窗 | 用于确认、创建、批量操作和风险提示；标题、正文、主次按钮明确 | | 抽屉 | 用于详情预览、配置编辑或影响范围查看；避免嵌套多层抽屉 | | 空态 | 说明当前无数据原因，并给出可执行下一步 | | 保存反馈 | 保存、发布、同步、失败、部分成功都要有状态反馈 |  ## 5. 复杂交互规则  | 场景 | Demo 应体现 | | --- | --- | | 配置到使用 | 运营端配置类页面应说明贸易端、采集端或协作方是否受影响，并展示运行态入口或结果预览 | | 新增或发布 | 展示草稿、保存、发布、启用、停用、失败、部分成功等状态中与需求相关的状态 | | 回退或纠正 | 撤回、重试、回退、恢复、归档、禁用、重新提交等能力必须有知识页依据；未确认时只作为待确认或禁用态 | | 批量操作 | 提供选择数量、影响范围、执行进度、部分成功、失败原因和执行日志入口 | | 跨端协作 | 明确角色、权限、数据围栏、外部协作方可见范围和消息反馈 | | 数据密集页 | 表格、指标和图表优先服务业务判断，突出状态、负责人、时间、风险、异常和最近变化 | | 异常处理 | 失败、拒绝、超时、无权限、数据冲突、同步失败要给出原因和下一步 |  ## 6. 禁止项  - 不把客户临时字段设计成产品通用字段。 - 不用本地文件绝对路径作为共享 Demo 依赖。 - 不让不同产品端混用页面骨架，例如用采集端卡片结构做运营端管理页。 - 不用营销落地页风格生成后台系统 Demo。 - 不用大面积渐变、漂浮卡片、装饰图形替代业务信息。 - 不在 Demo 中省略权限、状态、异常和保存反馈。 - 不把未确认的回退、撤回、恢复、归档、禁用能力设计成默认可用操作。 - 不只展示表单填写成功态，忽略失败、无权限、拒绝、部分成功或待处理状态。  ## 7. 更新方式  当本地 prototype 中某个页面模式稳定后，只把稳定结论沉淀为页面规则、token 或模式登记。不要把完整 HTML、CSS、JS 原样复制进知识库。", "domain": "产品维护", "module": "产品维护知识", "tags": "Demo;视觉规范;页面布局;UI Token;产品维护", "sources": []}, {"path": "docs/70-产品维护知识/README.md", "title": "70 产品维护知识", "folder": "docs/70-产品维护知识", "text": "# 70 产品维护知识  本目录用于沉淀产品持续维护所需的竞品、用户、反馈、需求、决策和原则。  ## 页面  - [竞品分析](./竞品分析.md) - [用户地图](./用户地图.md) - [客户反馈](./客户反馈.md) - [需求池](./需求池.md) - [决策记录](./决策记录.md) - [产品经理知识库工作台](./产品经理知识库工作台.md) - [产品需求影响分析清单](./产品需求影响分析清单.md) - [需求 Demo 输出规范](./需求Demo输出规范.md) - [Demo 视觉与页面规范](./Demo视觉与页面规范.md) - [页面母版沉淀规范](./页面母版沉淀规范.md) - [产品原则](./产品原则.md)", "domain": "公共能力", "module": "产品维护知识", "tags": "70-产品维护知识;70 产品维护知识", "sources": []}, {"path": "docs/70-产品维护知识/产品原则.md", "title": "产品原则", "folder": "docs/70-产品维护知识", "text": "# 产品原则  本页用于沉淀 Linkincrease 长期产品设计原则。  ## 当前原则  1. 以业务对象和数据层级为基础设计功能，不只围绕页面入口设计。 2. 模板负责结构，实例负责运行数据，两者边界必须清晰。 3. 权限、日志、状态、通知、导入导出是核心功能的一部分，不是后置补充。 4. 资源库承载可复用主数据，引用和同步关系必须可追溯。 5. 数据分析先统一口径，再设计图表和报表。 ", "domain": "公共能力", "module": "产品维护知识", "tags": "70-产品维护知识;产品原则", "sources": []}, {"path": "docs/70-产品维护知识/产品经理知识库工作台.md", "title": "产品经理知识库工作台", "folder": "docs/70-产品维护知识", "text": "# 产品经理知识库工作台  本页说明产品经理如何把知识库当成日常工作工具，而不是只在需要查资料时打开。  ## 工作台目标  | 目标 | 说明 | | --- | --- | | 需求澄清更快 | 用知识库快速定位业务对象、用户角色、权限边界和已有能力 | | PRD 更完整 | 在写需求前先检查对象、流程、权限、数据、日志、报表和测试影响 | | 决策可追溯 | 把重要取舍记录到决策记录，避免未来重复讨论 | | 客户反馈可沉淀 | 把反馈转成需求池、FAQ、SOP、Skill 或待确认问题 | | AI 协作更稳定 | 让 Agent 按任务读取正确知识资产，而不是按关键词过度联想 |  ## 高频工作方式  | 工作场景 | 推荐入口 | 产出 | | --- | --- | --- | | 模糊需求澄清 | `skills/linkincrease-product-manager`、`docs/00`、`docs/70/需求池.md` | 问题定义、待确认问题、初步范围 | | PRD 初稿 | `skills/linkincrease-product-manager` + `skills/linkincrease-requirement-design` | PRD 框架、功能清单、验收标准 | | 需求 Demo / 原型 | `skills/linkincrease-demo-prototype`、`docs/70/需求Demo输出规范.md` | 符合 Linkincrease 页面模式的 Demo、HTML 原型或交互样例 | | 影响范围分析 | `docs/20`、`docs/30`、`docs/40`、`docs/60` | 影响矩阵、拆分建议、风险 | | 客户反馈整理 | `docs/70/客户反馈.md`、`docs/50` | 反馈分类、产品机会、SOP/FAQ 建议 | | 产品决策沉淀 | `docs/70/决策记录.md` | 决策背景、选项、结论、复盘条件 | | 周复盘 | `docs/50/06-运营规范与SOP/每周知识库复盘流程.md`、本页 | 本周入库清单、下周产品动作 |  ## 推荐提示词  ### 需求澄清  使用 linkincrease-product-manager，基于知识库帮我分析这个需求： {粘贴客户描述或内部想法}  请输出： 1. 我们先怎么理解这个问题 2. 需要确认的问题 3. 可能影响的产品对象、流程、权限、数据和报表 4. 哪些内容暂不进入范围 5. 下一步应该写 PRD、转配置/SOP，还是进入待确认  ### 影响范围分析  使用 linkincrease-product-manager，帮我做影响范围分析： {需求描述}  请按产品端、业务对象、流程状态、权限数据围栏、通知自动化、报表指标、日志审计、导入导出、测试回归输出矩阵。  ### PRD 初稿  先使用 linkincrease-product-manager 做需求框架，再使用 linkincrease-requirement-design 补成可评审 PRD： {需求描述}  ### 需求 Demo  使用 linkincrease-demo-prototype，基于知识库页面模式和视觉 token 生成 Demo： {需求描述}  请先判断产品端、页面类型和业务对象，选择最接近的 UI pattern；Demo 不依赖本地 prototype 路径。  ### 产品周复盘  使用 linkincrease-product-manager，基于以下本周客户反馈/会议纪要/需求讨论，帮我复盘： 1. 哪些应进入需求池 2. 哪些应沉淀成 FAQ/SOP/Skill 3. 哪些需要决策记录 4. 哪些旧文档需要更新或标记 deprecated 5. 下周产品动作建议  ## 工作闭环  flowchart LR A[\"客户反馈 / 内部需求\"] --> B[\"需求澄清\"] B --> C[\"影响范围分析\"] C --> D{\"处理方式\"} D -- \"产品需求\" --> E[\"PRD / 需求池\"] D -- \"配置或培训\" --> F[\"SOP / FAQ / 产品成功 Skill\"] D -- \"规则不清\" --> G[\"待确认问题\"] D -- \"重要取舍\" --> H[\"决策记录\"] E --> I[\"版本复盘\"] F --> I G --> I H --> I I --> J[\"更新 metadata 与索引\"]  ## 判断原则  1. 能通过配置、SOP 或培训解决的，不直接升级为产品功能。 2. 会改变对象、权限、流程、数据、报表或日志的，必须做影响范围分析。 3. 来自单一客户的诉求，先记录证据和适用边界，再判断是否产品化。 4. 涉及历史取舍、范围砍掉、规则变化的，必须补决策记录。 5. 只有明确要求 Demo、HTML 原型或交互样例时，才调用 demo prototype workflow；普通 PRD 不展开视觉细节。 6. AI 输出不能直接当结论，必须回到权威知识页、来源和待确认问题做校验。", "domain": "产品维护", "module": "产品维护知识", "tags": "产品经理;需求澄清;影响分析;决策记录;AI协作", "sources": []}, {"path": "docs/70-产品维护知识/产品需求影响分析清单.md", "title": "产品需求影响分析清单", "folder": "docs/70-产品维护知识", "text": "# 产品需求影响分析清单  本清单用于产品经理在需求进入 PRD 或排期前快速判断影响范围，避免只看到页面改动而漏掉权限、数据、日志、报表和测试。  ## 快速结论  | 判断项 | 结论 | | --- | --- | | 建议处理方式 | 产品需求 / 配置方案 / SOP / 待确认 / 暂缓 | | 影响等级 | 低 / 中 / 高 | | 是否需要 PRD | 是 / 否 | | 是否需要技术预研 | 是 / 否 | | 是否需要客户验证 | 是 / 否 | | 是否需要决策记录 | 是 / 否 |  ## 影响矩阵  | 维度 | 检查问题 | 关联知识页 | | --- | --- | --- | | 产品端 | 影响运营端、贸易端、采集端还是公共能力？ | `docs/10-功能模块详情/README.md` | | 业务对象 | 是否影响 FlowSpace、订单、里程碑、工单、资源库、模板、字段、附件？ | `docs/20-业务对象与数据模型/README.md` | | 业务流程 | 是否改变创建、编辑、提交、批复、采集、同步、归档、导入导出？ | `docs/30-业务流程与产品流程图/README.md` | | 权限 | 是否影响角色、协作团队、数据围栏、按钮权限、字段可见性？ | `docs/40-权限、安全与审计/权限体系总表.md` | | 数据规则 | 是否涉及字段写入来源、引用关系、同步规则、历史数据和数据口径？ | `docs/20-业务对象与数据模型/字段、组件、子表、引用关系.md` | | 通知自动化 | 是否影响消息、邮件、自动化、定时任务、执行记录？ | `docs/10-功能模块详情/自动化.md` | | 报表指标 | 是否影响仪表盘、报告、统计口径、筛选维度、数据权限？ | `docs/60-数据分析支持/README.md` | | 日志审计 | 是否需要操作日志、动态、历史记录、系统执行记录？ | `docs/40-权限、安全与审计/README.md` | | 兼容迁移 | 是否影响旧模板、旧 FlowSpace、旧数据、移动端版本或客户已有配置？ | `docs/90-版本历史与来源治理/版本变更记录.md` | | 测试验收 | 是否需要权限矩阵、异常边界、回归重点、历史 Bug 高发区？ | `docs/45-测试支持/README.md` |  ## 拆分建议  | 情况 | 建议 | | --- | --- | | 只影响文案、展示、筛选，不改数据结构 | 可作为小需求或配置优化 | | 影响字段、状态、权限或日志 | 进入 PRD，并补验收标准 | | 影响多个产品端或历史数据 | 先做方案评审和技术预研 | | 只服务单个客户且边界不稳定 | 先做客户配置/SOP，暂不产品化 | | 涉及产品原则或长期方向 | 补决策记录，再进入需求池 |  ## 输出模板  ## 结论 ## 需求背景 ## 影响范围矩阵 ## 建议拆分 ## 风险与待确认 ## 需要更新的知识库页面 ## 验收与回归建议", "domain": "产品维护", "module": "产品维护知识", "tags": "产品经理;影响范围;PRD;验收;回归", "sources": []}, {"path": "docs/70-产品维护知识/决策记录.md", "title": "决策记录", "folder": "docs/70-产品维护知识", "text": "# 决策记录  本页用于记录重要产品决策、取舍和原因。凡是会影响产品范围、对象模型、权限边界、数据口径、客户承诺或长期维护成本的决定，都应该留下记录。  ## 记录模板  | 日期 | 决策 | 背景 | 选项 | 结论 | 影响范围 | | --- | --- | --- | --- | --- | --- | | 待补充 | 待补充 | 待补充 | 待补充 | 待补充 | 待补充 |  ## 详细记录模板  ## 决策：{标题}  | 字段 | 内容 | | --- | --- | | 日期 | YYYY-MM-DD | | 状态 | proposed / approved / deprecated | | 背景 | 为什么现在需要做这个决定 | | 选项 | 至少列出 2 个方案或取舍方向 | | 最终结论 | 当前选择 | | 决策原因 | 为什么这样选，放弃了什么 | | 影响范围 | 产品端、对象、流程、权限、数据、报表、日志、测试 | | 关联文档 | 需求、客户反馈、权威知识页、待确认问题 | | 后续复盘条件 | 什么情况下需要重新评估 |  ## 维护规则  1. 影响业务对象、数据层级、权限或审计的决策，必须同步更新对应权威知识页。 2. 影响需求范围、版本排期或客户承诺的决策，必须同步更新需求池或客户反馈。 3. 决策尚未确认时，状态标记为 `proposed`，不要写入权威规则页。 4. 决策失效时，状态标记为 `deprecated`，保留原因和替代方案。", "domain": "公共能力", "module": "产品维护知识", "tags": "70-产品维护知识;决策记录", "sources": []}, {"path": "docs/70-产品维护知识/客户反馈.md", "title": "客户反馈", "folder": "docs/70-产品维护知识", "text": "# 客户反馈  本页用于沉淀客户反馈并追踪其产品处理状态。  ## 记录模板  | 字段 | 说明 | | --- | --- | | 反馈来源 | 客户、运营、实施、销售或内部使用 | | 原始描述 | 保留用户原话或完整背景 | | 影响对象 | 功能模块、业务对象、流程或权限 | | 判断 | 问题、需求、配置建议或误解 | | 后续动作 | 进入需求池、补充 FAQ、更新知识库或不处理 | ", "domain": "公共能力", "module": "产品维护知识", "tags": "70-产品维护知识;客户反馈", "sources": []}, {"path": "docs/70-产品维护知识/用户地图.md", "title": "用户地图", "folder": "docs/70-产品维护知识", "text": "# 用户地图  本页用于沉淀 Linkincrease 用户角色、业务目标、痛点和关键旅程。  ## 用户地图维度  - 用户角色：平台运营、客户团队管理员、业务执行者、协作方、采集人员。 - 业务目标：配置流程、推动协作、采集数据、追踪订单、分析经营。 - 关键触点：运营端、贸易端、采集端、邮件协作、报表和通知。 - 主要阻碍：权限不可见、数据不一致、配置复杂、流程状态不清。  ## 关联文档  - [用户角色与场景](../00-产品总览与规划/用户角色与场景.md) - [产品能力地图](../00-产品总览与规划/产品能力地图.md) ", "domain": "公共能力", "module": "产品维护知识", "tags": "70-产品维护知识;用户地图", "sources": []}, {"path": "docs/70-产品维护知识/竞品分析.md", "title": "竞品分析", "folder": "docs/70-产品维护知识", "text": "# 竞品分析  本页用于沉淀竞品能力、差异点和可借鉴方向。  ## 记录模板  | 字段 | 说明 | | --- | --- | | 竞品名称 | 产品或方案名称 | | 场景 | 对应业务场景 | | 能力描述 | 竞品如何解决该问题 | | Linkincrease 对比 | 当前差异、优势、短板 | | 启发 | 是否形成需求、原则或待验证问题 | ", "domain": "公共能力", "module": "产品维护知识", "tags": "70-产品维护知识;竞品分析", "sources": []}, {"path": "docs/70-产品维护知识/需求Demo输出规范.md", "title": "需求 Demo 输出规范", "folder": "docs/70-产品维护知识", "text": "# 需求 Demo 输出规范  本页用于约束 Linkincrease 需求 Demo、HTML 原型、交互样例和页面说明的输出方式。目标是让 Demo 尽量贴近 Linkincrease 既有页面结构，而不是每个需求重新生成一套随机界面。  ## 1. 适用范围  | 场景 | 是否适用 | 说明 | | --- | --- | --- | | 用户明确要求生成 Demo、HTML 原型、页面原型、交互样例 | 是 | 必须先选择页面模式和视觉规则 | | PRD 中需要补充页面说明 | 部分适用 | 只写页面入口、状态和关键交互，不展开完整视觉稿 | | 普通需求澄清、影响范围分析、验收标准 | 否 | 不主动输出 Demo 设计内容 | | 客户方案、SOP、问题排查 | 否 | 除非用户明确要求生成可视化演示 |  ## 2. 生成前必须判断  | 判断项 | 说明 | | --- | --- | | 产品端 | 运营端、贸易端、采集端或公共能力 | | 页面类型 | 列表页、详情页、配置页、设计器、采集页、仪表盘、弹窗或抽屉 | | 业务对象 | FlowSpace、订单、里程碑、工单、资源库、模板、字段、报表、权限等 | | 标准页面模式 | 从 `metadata/ui-patterns.csv` 选择最接近的模式 | | 视觉约束 | 从 `metadata/ui-style-tokens.csv` 和 [Demo 视觉与页面规范](./Demo视觉与页面规范.md) 读取 | | 产品规则 | 回到 `docs/10`、`docs/20`、`docs/30`、`docs/40` 校验 | | 业务闭环 | 判断是否需要展示从配置/新增管理到运行态使用、数据回写、异常处理、回退/纠正和审计追踪 | | 平台特性 | 判断该 Demo 使用的是 FlowSpace、订单、里程碑、工单、资源库、模板、权限、自动化、仪表盘还是审计能力 | | 交互质量 | 判断复杂功能是否具备引导、反馈、可读数据、权限提示、校验提示和下一步动作 |  ## 3. 输出原则  1. Demo 先套标准页面模式，再替换业务内容。 2. 不从空白页面自由设计主布局。 3. 不在 PRD 正文中混入大段视觉规范；PRD 只标注是否需要 Demo、Demo 采用的页面模式和关键交互。 4. 不依赖维护者本地 prototype 文件夹、绝对路径或未同步资产。 5. 如果没有合适页面模式，先使用最接近的通用结构，并在 [页面母版沉淀规范](./页面母版沉淀规范.md) 中登记待沉淀方向。 6. Demo 里的字段、状态、权限、日志和数据口径必须回到权威知识页确认。 7. Demo 必须体现 Linkincrease 平台特性，不输出脱离 FlowSpace、资源库、工单、权限、自动化、仪表盘等产品能力的通用后台页面。 8. Demo 必须展示足够的业务闭环；如果功能从运营端配置开始，至少说明或呈现贸易端/采集端是否受影响，以及数据、状态和管理动作如何回流。 9. Demo 必须覆盖复杂业务的关键交互状态，包括引导、保存反馈、失败反馈、权限提示、校验提示、异常处理和可恢复路径中与需求相关的部分。  ## 4. Demo 输出流程  需求描述 -> 判断产品端、页面类型和业务对象 -> 判断平台能力映射和跨端业务闭环 -> 查询 metadata/ui-patterns.csv -> 读取对应知识页和 Demo 视觉与页面规范 -> 按闭环、平台特性、交互质量补齐关键状态 -> 生成 Demo 文件或页面说明 -> 用 Demo 验收清单检查布局、状态、权限、文案和响应式 -> 如产生稳定新模式，沉淀到页面母版资产地图和 ui-patterns.csv  ## 5. Demo 三层质量门槛  | 门槛 | 必须回答 | Demo 表现 | | --- | --- | --- | | 业务闭环 | 这个功能从哪里配置/发起、在哪里使用、结果写到哪里、异常怎么处理、是否支持回退或纠正 | 页面中呈现配置入口、运行态结果、状态变化、异常/失败/拒绝路径、审计或历史记录入口 | | 平台特性 | 这个功能基于 Linkincrease 哪些能力，而不是泛泛的后台 CRUD | 使用 FlowSpace、订单、里程碑、工单、资源库、业务模板、权限/数据围栏、自动化、仪表盘、审计日志等对象和术语 | | 交互质量 | 用户是否知道当前状态、下一步做什么、错误如何处理、数据怎么看 | 提供上下文、空态引导、字段校验、保存/发布/同步反馈、权限说明、影响预览、筛选排序、状态 badge 和可恢复动作 |  ## 6. 平台能力映射  生成 Demo 前需要把需求映射到 Linkincrease 平台能力：  | 能力 | 常见 Demo 表现 | | --- | --- | | FlowSpace | 团队/协作空间上下文、订单或业务流程入口、成员角色、阶段进度 | | 业务模板 | 运营端模板配置、字段/里程碑/工单/批复规则、发布状态 | | 资源库 | 主数据列表、引用关系、字段同步、历史记录、权限范围 | | 订单 | 贸易端订单列表、订单详情、负责人、状态、交期、异常 | | 里程碑 | 阶段计划、完成度、审批、逾期、重启或回退问题 | | 工单 | 任务指派、采集、提交、批复、拒绝、补充、移动端同步 | | 权限/数据围栏 | 角色可见范围、按钮可操作性、字段隐藏/只读、无权限提示 | | 自动化/通知 | 触发条件、执行记录、成功/失败/部分成功、消息或邮件反馈 | | 仪表盘/报告 | 指标卡、趋势图、筛选范围、异常列表、明细下钻 | | 审计/历史 | 动态、评论、操作日志、执行日志、历史快照 |  ## 7. 交互质量要求  | 交互点 | 要求 | | --- | --- | | 引导 | 空态、首次配置、复杂表单、跨端配置必须给出下一步动作 | | 反馈 | 保存、发布、提交、批复、同步、批量操作必须展示成功/失败/部分成功状态 | | 数据可读性 | 表格和仪表盘要有状态、负责人、时间、风险、筛选、排序或分组，便于扫描 | | 权限提示 | 无权限、只读、不可操作时说明原因或指向管理员/角色配置 | | 校验提示 | 必填、冲突、重复、格式错误、同步失败要靠近字段或操作点说明 | | 风险确认 | 删除、撤回、批量、跨端影响、权限变更、数据写回需要确认和影响范围 | | 可恢复路径 | 失败、拒绝、异常、过期、撤回后应给出重试、编辑、重新提交、查看日志或创建纠正版本等路径；未确认能力只能作为待确认 |  ## 8. PRD 中的 Demo 写法  需求文档不默认展开视觉设计。确实需要说明 Demo 时，使用轻量字段：  | 字段 | 写法 | | --- | --- | | Demo 是否需要 | 是 / 否 | | 页面模式 | 例如 `TR-001 FlowSpace 订单列表` | | 关键变更 | 只写本需求新增区域或交互 | | 必须沿用 | 标准导航、筛选、表格、详情区、状态反馈等 | | 待确认 | 未有页面模式、交互冲突或视觉边界 |  ## 9. Demo 验收清单  - 页面结构符合 `metadata/ui-patterns.csv` 中的标准模式。 - 视觉 token 符合 `metadata/ui-style-tokens.csv`。 - 主要功能映射到 Linkincrease 平台对象或能力，不是通用后台 CRUD。 - 业务闭环清楚：配置/发起、运行态使用、数据写回、异常处理、纠正/回退问题、审计追踪都有明确说明或界面表达。 - 跨端影响清楚：运营端、贸易端、采集端、外部协作方是否受影响有明确边界。 - 页面顶部能看出当前产品端、团队或 FlowSpace 上下文。 - 主要操作按钮、筛选、表格、详情、右侧面板和弹窗位置稳定。 - 状态、权限、错误、空态、加载和保存反馈至少覆盖一轮。 - 表格、指标、状态 badge、筛选和分组足够支持业务扫描和判断。 - 复杂动作有影响预览、风险提示或确认反馈。 - 不确定的回退、撤回、重试、恢复、归档、禁用等能力被标记为待确认，而不是直接当作已支持能力。 - 没有把本地 prototype 路径、个人目录或未同步图片写入共享知识库。 - 如需新增模式，已记录到页面母版沉淀流程。", "domain": "产品维护", "module": "产品维护知识", "tags": "Demo;原型;页面母版;AI协作;产品维护", "sources": []}, {"path": "docs/70-产品维护知识/需求池.md", "title": "需求池", "folder": "docs/70-产品维护知识", "text": "# 需求池  本页用于沉淀尚未进入正式迭代的需求候选。  ## 记录模板  | 字段 | 说明 | | --- | --- | | 需求名称 | 简短描述 | | 来源 | 客户反馈、竞品分析、内部规划或技术治理 | | 影响范围 | 模块、对象、流程、权限、数据、通知、日志 | | 价值判断 | 用户价值、业务价值、风险降低或效率提升 | | 状态 | 待澄清、待评审、已进入迭代、暂缓 |  ## 维护规则  需求进入正式设计后，应使用 [迭代需求设计工作流](../00-产品总览与规划/迭代需求设计工作流.md) 进行影响分析。 ", "domain": "公共能力", "module": "产品维护知识", "tags": "70-产品维护知识;需求池", "sources": []}, {"path": "docs/70-产品维护知识/页面母版沉淀规范.md", "title": "页面母版沉淀规范", "folder": "docs/70-产品维护知识", "text": "# 页面母版沉淀规范  本页定义如何把本地或项目中的可运行原型沉淀为共享知识库中的页面标准。知识库只记录稳定规则，不依赖维护者本地 prototype 文件夹。  ## 1. 分工边界  | 层级 | 存放内容 | 不存放 | | --- | --- | --- | | 本地 prototype | 可运行 HTML、CSS、JS、实验交互、截图验证记录 | 不能作为团队共享知识库的必需依赖 | | 知识库 docs | 页面结构规则、视觉规范、母版选择标准、验收清单 | 不存完整前端实现和本地绝对路径 | | metadata | 页面模式、样式 token、状态、适用场景、关联知识页 | 不存个人路径和临时 demo 文件 | | skills | 可执行工作流程，告诉 AI 何时读取规则并生成 Demo | 不把普通 PRD 输出强制变成视觉设计 |  ## 2. 沉淀准入  一个页面母版进入知识库前，需要满足：  1. 页面结构在至少一个需求或方案中被验证有效。 2. 能说清楚适用产品端、页面类型和业务对象。 3. 能列出必须保留的布局区块和可替换的业务内容。 4. 视觉规则能抽象成 token 或组件规则。 5. 不依赖本地图片、绝对路径、个人脚本或未同步资源。 6. 有对应权威产品规则页支撑，不把 demo 表现误写成产品规则。  ## 3. 沉淀步骤  本地 prototype 稳定 -> 提炼页面结构和交互规则 -> 更新 Demo 视觉与页面规范 -> 新增或更新 metadata/ui-patterns.csv -> 必要时更新 metadata/ui-style-tokens.csv -> 更新需求 Demo 输出规范或对应 Skill -> 更新 documents.csv、search-index.json、版本变更记录  ## 4. 页面模式登记字段  `metadata/ui-patterns.csv` 使用以下字段：  | 字段 | 说明 | | --- | --- | | pattern_id | 稳定编号，例如 `OP-001`、`TR-001`、`CO-001` | | product_end | 运营端、贸易端、采集端、公共能力 | | page_type | 列表、详情、配置、设计器、采集、仪表盘、弹窗等 | | pattern_name | 页面模式名称 | | layout_rule | 页面骨架摘要 | | when_to_use | 适用需求 | | must_keep | Demo 生成时必须保留的结构和行为 | | can_customize | 可按需求替换的内容 | | related_docs | 关联知识页，用分号分隔 | | status | stable、draft、deprecated | | updated_at | 最近沉淀日期 |  ## 5. 更新原则  - 页面母版变更影响多个 Demo 时，优先更新 metadata 和规范页，再更新具体 demo。 - 只适用于单次需求的视觉处理，不进入 stable 页面模式。 - 如果页面模式与权威产品规则冲突，先更新待确认问题或决策记录。 - Demo 输出 skill 只能在明确需要 Demo 时使用，不参与普通 PRD 文字产出。 ", "domain": "产品维护", "module": "产品维护知识", "tags": "页面母版;原型沉淀;UI Pattern;知识治理", "sources": []}, {"path": "docs/80-架构与技术方案/README.md", "title": "80 架构与技术方案", "folder": "docs/80-架构与技术方案", "text": "# 80 架构与技术方案  本目录用于沉淀面向研发和方案评审的架构、集成、非功能要求和兼容性信息。  ## 页面  - [系统架构](./系统架构.md) - [集成方案](./集成方案.md) - [非功能性需求](./非功能性需求.md) - [性能](./性能.md) - [安全](./安全.md) - [兼容性](./兼容性.md) ", "domain": "公共能力", "module": "架构与技术方案", "tags": "80-架构与技术方案;80 架构与技术方案", "sources": []}, {"path": "docs/80-架构与技术方案/兼容性.md", "title": "兼容性", "folder": "docs/80-架构与技术方案", "text": "# 兼容性  本页用于沉淀兼容性相关要求。  ## 重点场景  - 贸易端 Web 页面。 - 运营端配置和管理页面。 - 采集端移动端页面。 - 邮件协作外部填写链接。 - Excel、PDF、图片、附件等导入导出文件。  ## 关联文档  - [采集端](../10-功能模块详情/采集端.md) - [邮件协作](../10-功能模块详情/邮件协作.md) - [PDF 与批量导入导出](../10-功能模块详情/PDF与批量导入导出.md) ", "domain": "公共能力", "module": "架构与技术方案", "tags": "80-架构与技术方案;兼容性", "sources": []}, {"path": "docs/80-架构与技术方案/安全.md", "title": "安全", "folder": "docs/80-架构与技术方案", "text": "# 安全  本页用于沉淀安全相关要求和检查项。  ## 重点场景  - 登录、找回密码、账号与个人中心。 - 团队角色、FlowSpace 业务角色、协作方角色。 - 数据围栏、字段可见性、资源库分享。 - 外部 API、邮件协作链接、报告链接。  ## 关联文档  - [权限体系总表](../40-权限、安全与审计/权限体系总表.md) - [数据围栏](../40-权限、安全与审计/数据围栏.md) - [资源库权限](../40-权限、安全与审计/资源库权限.md) ", "domain": "公共能力", "module": "架构与技术方案", "tags": "80-架构与技术方案;安全", "sources": []}, {"path": "docs/80-架构与技术方案/性能.md", "title": "性能", "folder": "docs/80-架构与技术方案", "text": "# 性能  本页用于沉淀性能相关要求和风险点。  ## 重点场景  - 订单列表、工单视图、资源库列表的大数据量查询。 - 批量导入、批量导出、PDF 导入导出。 - 仪表盘和报表的数据聚合。 - 自动化和系统同步带来的批量写入。  ## 关联文档  - [PDF 与批量导入导出](../10-功能模块详情/PDF与批量导入导出.md) - [核心指标口径](../60-数据分析支持/核心指标口径.md) ", "domain": "公共能力", "module": "架构与技术方案", "tags": "80-架构与技术方案;性能", "sources": []}, {"path": "docs/80-架构与技术方案/系统架构.md", "title": "系统架构", "folder": "docs/80-架构与技术方案", "text": "# 系统架构  本页用于沉淀 Linkincrease 系统架构视角的信息。  ## 当前范围  - 三端产品关系：运营端、贸易端、采集端。 - 核心业务对象：FlowSpace、订单、里程碑、工单、批复、资源库。 - 公共能力：权限、通知、自动化、日志、仪表盘、报表、导入导出。  ## 关联文档  - [三端数据关系](../10-功能模块详情/三端数据关系.md) - [FlowSpace 数据层级](../20-业务对象与数据模型/FlowSpace数据层级.md) - [系统与集成执行日志](../40-权限、安全与审计/系统与集成执行日志.md) ", "domain": "公共能力", "module": "架构与技术方案", "tags": "80-架构与技术方案;系统架构", "sources": []}, {"path": "docs/80-架构与技术方案/集成方案.md", "title": "第三方数据对接", "folder": "docs/80-架构与技术方案", "text": " # 第三方数据对接  ## 1. 功能定位  第三方数据对接用于把外部系统数据引入 Linkincrease，减少手动录入并保持数据一致。当前资料覆盖两类能力：模板内表单级 API 引用，以及运营端 FlowSpace 级外部 API 集成配置。  ## 2. 表单级 API 引用  表单级 API 引用主要配置在业务模板的里程碑属性中，可分别针对工单、工单批复、里程碑批复设置引用能力。  | 配置项 | 规则 | | --- | --- | | 是否启用 | 默认禁用 | | 按钮名称 | 非必填，默认“数据引用”，限制 20 字符，需国际化 | | URL | 接口地址 | | 请求方式 | 默认 POST | | Result Format | 默认 JSON | | 请求配置 | 请求头等信息，可不填 | | 查询配置 | 传给服务器的查询、过滤、排序、分页等参数 | | 字段匹配 | 接口字段与模板字段映射；模板字段不可重复配置 | | 贸易端白名单 | 控制哪些团队可使用数据引用 |  如果已匹配字段在模板变更后被删除，贸易端和运营端不展示对应字段。  ## 3. 自动引用与定期更新  | 能力 | 规则 | | --- | --- | | 自动引用 | 启用后，用户填写已匹配的触发字段时自动查询并引用 API 数据 | | 多条匹配 | 可选择不引用、引用最新更新、引用最后创建、引用最早创建 | | 引用时机 | 工单初次发起、工单批复初次批复、里程碑初次批复 | | 定期更新 | 开启后，根据自动引用字段内的数据定期更新相关数据 |  可更新状态：  - 工单：里程碑进行中、未被工单批复、未终止，排除互用自的工单。 - 工单批复：里程碑进行中，排除互用自的工单。 - 里程碑批复：里程碑进行中。  更新后需要增加动态和历史记录。  ## 4. 贸易端引用应用  - 对应表单开启 API 配置且当前团队在白名单内，才展示引用按钮。 - 可通过弹窗搜索接口数据，选择一条数据后按字段匹配填入表单。 - 确认引入需要二次确认。 - 填入数据支持手动修改。 - 只读或隐藏字段不填入。 - 采集端任务详情若配置引用第三方数据且工单可编辑，也展示引用能力。  ## 5. FlowSpace 级外部 API 集成  FlowSpace 级外部 API 集成用于把外部系统数据直接创建或更新 Linkincrease 的订单、工单和批复。  | 配置项 | 规则 | | --- | --- | | 集成名称 | 必填 | | 来源标识 | 必填，后端配置项 | | 配置状态 | 默认开启 | | 同步更新 | 默认关闭，关闭时只允许创建新记录 | | 同步删除 | 默认关闭，关闭时外部删除标记不删除 FlowSpace 数据 | | Linkincrease 同步至外部 | 默认关闭，关闭时 Linkincrease 修改不回写 | | 冲突数据同步 | 暂定时间戳优先，仍需补充 |  集成生效后，订单和工单由外部系统创建，Linkincrease 不允许手动创建对应数据。  ## 6. 字段映射  外部 API 集成支持 JSONPath 提取深层数据。  | 映射对象 | 规则 | | --- | --- | | 主表单主键 | 必选，可配置文本、数字、百分比、日期字段 | | 主表单字段 | 支持非子表字段和子表字段配置 | | 里程碑工单 | 按里程碑数组路径映射工单字段 | | 工单批复 | 有工单批复时配置 | | 里程碑批复 | 有里程碑批复时配置 | | 采集人/批复人 | 通常通过邮箱与 FlowSpace 成员匹配，匹配失败则创建失败或后续手动修改 |  参与配置的 FlowSpace 字段不允许重复配置。配置了主键的模板字段不允许用户修改，以防数据冲突。  ## 7. 冲突与写入策略  - API 显式写入：映射配置了字段且外部数据有值时，强制写入。 - FlowSpace 默认值：外部数据无字段或值为空时，创建时可填入默认值。 - 公式/联动：API 写入触发字段后，系统自动计算相关公式字段。 - 未映射字段不可被外部 API 修改。  ## 8. 日志与追溯  外部 API 集成日志列表展示触发时间、事件类型、同步方向、数据标识、状态和详情。  业务侧需要记录：  - 订单跟踪记录：创建订单、更新订单、里程碑开始、删除工单等。 - 工单动态：创建工单、创建里程碑批复、更新工单采集、更新工单批复、更新里程碑批复等。 - 历史记录：以来源标识记录创建或编辑行为。  ## 9. 待确认问题  - 外部主键组合填写规则和后端支持范围仍待补充。 - 冲突数据同步策略除时间戳优先外，是否需要人工处理队列。 - 第三方成员与 FlowSpace 成员邮箱不一致时的异常处理需要形成正式规则。 ", "domain": "运营端", "module": "架构与技术方案", "tags": "第三方数据;API;数据映射;SCMPro", "sources": [{"title": "【运营端】【模板设计】里程碑增加第三方数据对接", "version": "v2.3.x", "product_side": "运营端", "module": "模板设计", "last_write_time": "2026-09-04T10:48:13"}, {"title": "【运营端】【SCCS管理】SCCS列表增加外部api集成配置", "version": "V2.5.x", "product_side": "运营端", "module": "SCCS管理", "last_write_time": "2026-09-04T10:48:05"}]}, {"path": "docs/80-架构与技术方案/非功能性需求.md", "title": "非功能性需求", "folder": "docs/80-架构与技术方案", "text": "# 非功能性需求  本页用于沉淀性能、安全、兼容性、可用性、审计和可维护性要求。  ## 分类  | 类型 | 关注点 | | --- | --- | | 性能 | 列表查询、批量导入导出、仪表盘统计、资源库同步 | | 安全 | 登录、权限、数据围栏、分享链接、外部接口 | | 兼容性 | Web、移动端、邮件链接、导入导出文件 | | 可审计 | 操作日志、系统日志、历史快照、数据变更记录 | | 可维护 | 模板同步、字段变更、指标口径、版本记录 | ", "domain": "公共能力", "module": "架构与技术方案", "tags": "80-架构与技术方案;非功能性需求", "sources": []}, {"path": "docs/90-版本历史与来源治理/README.md", "title": "90 版本历史与来源治理", "folder": "docs/90-版本历史与来源治理", "text": "# 90 版本历史与来源治理  本目录用于管理知识库来源、版本、待确认问题、历史产品文档评估和发布说明。  ## 页面  - [版本变更记录](./版本变更记录.md) - [来源入库状态](./来源入库状态.md) - [待确认问题](./待确认问题.md) - [知识资产地图](./知识资产地图.md) - [历史产品文档评估](./历史产品文档评估.md) - [外部链接快照清单](./外部链接快照清单.md) - [可运行文件与导入导出文件说明](./可运行文件与导入导出文件说明.md) - [团队共享与只读发布方案](./团队共享与只读发布方案.md)", "domain": "知识库管理", "module": "版本历史与来源治理", "tags": "90-版本历史与来源治理;90 版本历史与来源治理", "sources": []}, {"path": "docs/90-版本历史与来源治理/历史产品文档评估.md", "title": "历史产品文档评估", "folder": "docs/90-版本历史与来源治理", "text": "# 历史产品文档评估  ## 1. 页面定位  本页用于评估 `source:product-docs-legacy` 来源层中的历史产品文档，明确哪些内容已经整理为正式知识页，哪些只能作为背景参考，哪些不应直接进入当前知识库口径。  这批文档整体成文时间早于当前最新需求源，内容偏战略、画像、路线图和三端 PRD 草案。它们有助于补齐产品背景，但不能直接覆盖 `source:thoughts-v2-current` 和现有 `docs/` 标准知识页。  ## 2. 总体结论  | 结论 | 说明 | | --- | --- | | 可以补齐战略层信息 | 愿景、定位、问题、用户、指标、路线图可整理为入门层知识页 | | 不适合逐篇原样入库 | 多数文档重复度高，且混合了假设、目标值、商业模式和功能草案 | | 不能直接覆盖功能规则 | 三端 PRD 中的功能描述需要与最新需求源逐项核对 | | 旧称需要统一 | 原文中的 SCCS 在正式知识页中统一为 FlowSpace，来源引用保留原文件名 | | 数据和目标值需确认 | 例如效率提升、活跃率、增长目标、时间规划等，缺少当前证据时只作假设 |  ## 3. 文档处置清单  | 来源文档 | 内容类型 | 评估结论 | 入库动作 | | --- | --- | --- | --- | | `10-产品介绍.md` | 三端架构与模块介绍 | 与现有产品总览、功能地图、三端页面高度重叠 | 作为补充校验来源，不单独入库 | | `产品愿景与定位文档.md` | 愿景、定位、价值主张、产品矩阵 | 可提炼战略层口径 | 已抽取到 [产品战略与定位](../00-产品总览与规划/产品战略与定位.md) | | `问题陈述-ProblemStatement.md` | 用户问题、痛点、指标、约束 | 可保留问题框架，量化数据待确认 | 已抽取到产品战略和用户角色页 | | `精益UX画布-LeanUXCanvas.md` | Lean UX、假设、用户收益、实验 | 可保留假设框架，实验和目标值待确认 | 已抽取到产品战略与指标页 | | `用户角色与画像.md` | 用户角色、画像、权限体系 | 可整理为角色框架，个体画像细节不作为规则 | 已抽取到 [用户角色与场景](../00-产品总览与规划/用户角色与场景.md) | | `用户访谈综合报告-InterviewSynthesis.md` | 访谈主题和洞察 | 可作为问题背景，样本和结论需标注为研究材料 | 已抽取到用户角色页 | | `产品指标体系-OKR.md` | OKR 和指标体系 | 指标框架有价值，具体数值需确认 | 已抽取到 [产品指标与路线图](../00-产品总览与规划/产品指标与路线图.md) | | `产品路线图-0到100.md` | 阶段规划和版本路线 | 阶段框架有价值，时间和版本承诺待确认 | 已抽取到产品指标与路线图页 | | `功能优先级规划-RICE框架.md` | RICE 评估与功能优先级 | 方法可复用，历史分数需重新评估 | 已抽取 RICE 口径 | | `产品综合定义文档.md` | 综合性产品定义 | 与多份文档重复，可作为聚合参考 | 只抽取不单独入库 | | `PRD产品需求文档-贸易端.md` | 贸易端 PRD 草案 | 功能描述需与最新需求源核对 | 作为历史参考，不直接覆盖贸易端规则 | | `PRD产品需求文档-运营端.md` | 运营端 PRD 草案 | 功能描述需与最新需求源核对 | 作为历史参考，不直接覆盖运营端规则 | | `PRD产品需求文档-采集端.md` | 采集端 PRD 草案 | 功能描述需与最新需求源核对 | 作为历史参考，不直接覆盖采集端规则 |  ## 4. 已新增正式知识页  | 知识页 | 作用 | | --- | --- | | [产品战略与定位](../00-产品总览与规划/产品战略与定位.md) | 将愿景、定位、问题、价值主张整理为稳定入门口径 | | [用户角色与场景](../00-产品总览与规划/用户角色与场景.md) | 将角色、场景、需求设计检查项整理为可用框架 | | [产品指标与路线图](../00-产品总览与规划/产品指标与路线图.md) | 将指标、阶段目标、RICE 优先级方法整理为评估框架 |  ## 5. 后续处理建议  1. 三端 PRD 草案不建议全文搬入正式知识库，应逐项与 `source:thoughts-v2-current` 比对。 2. 如果发现历史 PRD 中有最新需求源缺失但仍有效的能力，应补回最新需求源或登记到待确认问题。 3. 市场、商业模式、定价、增长目标如需保留，建议建立独立“商业策略/增长策略”页面，并标注确认状态。 4. 若后续继续维护这批产品文档，应先在原目录中去重、统一术语，再从中抽取到标准知识页。  ## 6. 来源层  - [历史产品文档来源层说明](../../sources/external/product-docs-legacy.md) - `metadata/source-roots.csv` - `metadata/source-manifest.csv`", "domain": "知识库管理", "module": "版本历史与来源治理", "tags": "历史产品文档;来源评估;入库策略;product-docs-legacy", "sources": [{"title": "10-产品介绍", "version": "common", "product_side": "未识别", "module": "", "last_write_time": "2026-04-30T17:27:54"}, {"title": "PRD产品需求文档-贸易端", "version": "common", "product_side": "贸易端", "module": "", "last_write_time": "2026-04-28T15:51:06"}, {"title": "PRD产品需求文档-运营端", "version": "common", "product_side": "运营端", "module": "", "last_write_time": "2026-04-28T15:51:55"}, {"title": "PRD产品需求文档-采集端", "version": "common", "product_side": "采集端", "module": "", "last_write_time": "2026-04-28T15:53:04"}, {"title": "产品愿景与定位文档", "version": "common", "product_side": "未识别", "module": "", "last_write_time": "2026-04-28T15:47:31"}, {"title": "产品指标体系-OKR", "version": "common", "product_side": "未识别", "module": "", "last_write_time": "2026-04-28T15:57:13"}, {"title": "产品综合定义文档", "version": "common", "product_side": "未识别", "module": "", "last_write_time": "2026-04-28T16:05:59"}, {"title": "产品路线图-0到100", "version": "common", "product_side": "未识别", "module": "", "last_write_time": "2026-04-28T15:55:37"}, {"title": "功能优先级规划-RICE框架", "version": "common", "product_side": "未识别", "module": "", "last_write_time": "2026-04-28T15:54:24"}, {"title": "用户角色与画像", "version": "common", "product_side": "未识别", "module": "", "last_write_time": "2026-04-28T15:49:23"}, {"title": "用户访谈综合报告-InterviewSynthesis", "version": "common", "product_side": "未识别", "module": "", "last_write_time": "2026-04-28T16:04:20"}, {"title": "精益UX画布-LeanUXCanvas", "version": "common", "product_side": "未识别", "module": "", "last_write_time": "2026-04-28T15:46:13"}, {"title": "问题陈述-ProblemStatement", "version": "common", "product_side": "未识别", "module": "", "last_write_time": "2026-04-28T16:03:15"}]}, {"path": "docs/90-版本历史与来源治理/可运行文件与导入导出文件说明.md", "title": "可运行文件与导入导出文件说明", "folder": "docs/90-版本历史与来源治理", "text": "# 可运行文件与导入导出文件说明  ## 1. 定位  本页列出当前 Linkincrease 知识库及其最新需求源中可以运行的脚本、会被脚本读取或生成的文件，以及维护时的注意事项。  当前唯一最新需求源为：  最新需求源（source:thoughts-v2-current）  其本地目录不写入仓库，由维护人通过环境变量 `LINKINCREASE_SOURCE_PATH` 指定。  知识库根目录为：  知识库私有 Git 仓库本地工作区  ## 2. 可运行文件  | 文件 | 位置 | 运行目录 | 命令 | 作用 | 是否会修改文件 | | --- | --- | --- | --- | --- | --- | | `scan_source_manifest.py` | `<知识库仓库本地目录>\\scripts\\scan_source_manifest.py` | `<知识库仓库本地目录>` | `python scripts\\scan_source_manifest.py` | 扫描 `最新需求源（source:thoughts-v2-current）` 中的 `.md` 需求文件，生成来源全量清单和本次差异清单 | 会改写 `metadata/source-manifest.csv` 和 `metadata/source-diff.csv` | | `build_static_site.py` | `<知识库仓库本地目录>\\scripts\\build_static_site.py` | `<知识库仓库本地目录>` | `python scripts\\build_static_site.py` | 将公开 Markdown 知识库打包成只读静态站点，供产品团队查看 | 会重建 `exports/site`；默认不展示 `skills/` 和本地临时目录 | | `thoughts_sync.py` | `<最新需求源本地目录>\\thoughts_sync.py` | `<最新需求源本地目录>` | `python thoughts_sync.py` 或按脚本参数运行 | 从所思在线同步/导出最新需求文档到 `最新需求源（source:thoughts-v2-current）` | 会更新最新需求源中的需求 `.md`、图片资产和 `.thoughts_sync` 同步状态 |  ## 3. 脚本说明  ### 3.1 `scan_source_manifest.py`  用途：  - 读取 `metadata/source-roots.csv`，找到当前 active 的外部来源目录。 - 扫描来源目录中的 `.md` 文件。 - 排除 `.thoughts_sync`、`__pycache__`、`*_assets` 等非正文目录。 - 为每份需求生成文件大小、最后修改时间、SHA256 内容指纹。 - 从路径和标题中推断版本、产品端、模块。 - 生成全量来源清单 `metadata/source-manifest.csv`。 - 与上次 manifest 对比，生成差异清单 `metadata/source-diff.csv`。  运行后输出示例：  source_roots=1 manifest=63 diff=0  含义：  - `source_roots=1`：扫描了 1 个 active 来源根目录。 - `manifest=63`：当前最新源中有 63 份 `.md` 需求文档。 - `diff=0`：本次与上次扫描相比没有新增、修改、删除。  适合运行时机：  - 每次运行 `thoughts_sync.py` 之后。 - 手动新增、移动、删除 `2.0需求文档` 中的需求文档之后。 - 准备判断知识库是否需要更新之前。  注意事项：  - 该脚本只读取 `最新需求源（source:thoughts-v2-current）`，不会修改最新源目录。 - 该脚本会覆盖 `metadata/source-manifest.csv` 和 `metadata/source-diff.csv`。 - 如果 `source-diff.csv` 出现 `modified`，需要人工判断对应知识页是否要更新。 - 如果 `source-diff.csv` 出现 `deleted`，不要直接删除知识页，应先确认需求是否迁移、改名或废弃。 - 如果新增来源是图片资产，目前不会进入 manifest；图片资产后续需要单独建立清单。  ### 3.2 `build_static_site.py`  用途：  - 扫描知识库中的公开 Markdown 文档。 - 将文档复制到 `exports/site/content`。 - 生成 `exports/site/index.html`，提供左侧目录、搜索框和 Markdown 阅读界面。 - 用于给产品团队发布只读知识库站点。  默认发布范围：  - 根目录 Markdown。 - `docs/`、`sources/`、`templates/`。 - 不发布隐藏目录、本地临时目录、`exports/`、`backups/`、`archive/`。 - 默认不把 `skills/` 作为页面文档展示，也不展示 Skill 下载入口。  可选环境变量：  | 变量 | 用途 | | --- | --- | | `INCLUDE_SKILLS_IN_SITE=1` | 将 `skills/` 文档加入静态站导航、搜索和站点地图 | | `INCLUDE_SKILL_DOWNLOADS=1` | 生成并展示 Skill zip 下载入口 |  运行后输出示例：  site=知识库私有 Git 仓库本地工作区\\exports\\site documents=78  适合运行时机：  - 知识库内容更新后。 - 需求确认并入库后。 - 准备给产品团队发布最新只读站点前。  注意事项：  - 该脚本会删除并重建 `exports/site`。 - `exports/site` 是发布结果，不是知识库源文件。 - 如果用本地预览，需在 `exports/site` 目录下运行 `python -m http.server 8010` 后访问 `http://localhost:8010`。 - 当前页面渲染使用浏览器端 Markdown 渲染库；如果内网不允许访问外部 CDN，需要后续将渲染库下载到本地资产。  ### 3.3 `thoughts_sync.py`  用途：  - 从所思在线通过 API 导出需求文档。 - 支持增量同步，只导出所思中已更新的文档。 - 将导出内容落到 `最新需求源（source:thoughts-v2-current）` 的版本目录中。 - 维护 `.thoughts_sync` 下的登录、配置、同步状态和浏览器相关缓存。  适合运行时机：  - 想检查所思在线是否有新需求或变更时。 - 产品文档在所思中更新后，需要同步到本地最新源时。 - 准备更新知识库之前。  注意事项：  - 该脚本不在知识库目录内，而在最新需求源目录中。 - `.thoughts_sync` 可能包含登录状态、Cookie、浏览器 profile 或同步元数据，不要纳入知识库正文，不要随意分享。 - 同步完成后，需要回到知识库目录运行 `python scripts\\scan_source_manifest.py`。 - 如果同步脚本报登录失效，应在 `2.0需求文档` 目录下按脚本说明重新登录。  ## 4. 导入/导出与元数据文件  ### 4.1 来源输入配置  | 文件 | 作用 | 维护方式 | 注意事项 | | --- | --- | --- | --- | | `metadata/source-roots.csv` | 定义外部来源根目录，目前 active 来源为 `最新需求源（source:thoughts-v2-current）` | 少量人工维护 | 改路径后必须重新运行 `scan_source_manifest.py`；不要把 `.thoughts_sync` 设为扫描范围 | | `sources/external/thoughts-current.md` | 说明所思最新需求源如何接入知识库 | 人工维护 | 只写流程说明，不放账号、Cookie、Token |  ### 4.2 脚本输出文件  | 文件 | 由谁生成 | 作用 | 是否建议手改 | 注意事项 | | --- | --- | --- | --- | --- | | `metadata/source-manifest.csv` | `scan_source_manifest.py` | 最新需求源的全量文件清单，包含版本、端、模块、标题、大小、更新时间、SHA256 | 不建议手改 | 会被脚本覆盖；用它判断当前最新源有哪些文件 | | `metadata/source-diff.csv` | `scan_source_manifest.py` | 本次扫描相对上次扫描的新增、修改、删除差异 | 不建议手改 | 会被脚本覆盖；每次同步后优先查看它 |  ### 4.3 知识库管理台账  | 文件 | 作用 | 维护方式 | 注意事项 | | --- | --- | --- | --- | | `metadata/documents.csv` | 知识页台账，记录每个标准知识页的 ID、标题、路径、标签、来源 | 人工维护为主 | 新增/重命名知识页后要同步更新；ID 不可重复 | | `metadata/sources.csv` | 已入库来源台账，记录来源文档、所属端、模块、入库状态 | 人工维护为主 | 来源路径应优先使用 `source:thoughts-v2-current/...`；旧 `missing-current-source/...` 表示最新源缺口 | | `metadata/tags.csv` | 标签表，统一标签分类和含义 | 人工维护 | 新增知识页常用标签时补充；避免同义标签泛滥 | | `metadata/permissions.csv` | 权限分级说明 | 人工维护 | 当前用于内部权限口径，不是产品权限矩阵 | | `metadata/search-index.json` | 本地检索索引，记录可检索知识页 | 人工维护为主 | JSON 格式必须有效；新增重要知识页后要补索引 |  ### 4.4 文档和模板  | 文件或目录 | 作用 | 注意事项 | | --- | --- | --- | | `templates/需求文档入库模板.md` | 新增知识页或来源入库时的模板参考 | 适合人工复制使用，不是脚本输入 | | `exports/` | 预留导出目录 | 当前未见实际导出文件；后续可放离线包、PDF、压缩包 | | `sources/exported/` | 预留外部资料导出目录 | 可放钉钉表格、外部报告、补充资料 | | `sources/snapshots/` | 预留快照目录 | 可放重要链接、图片、PDF 的本地快照 | | `archive/` | 预留归档目录 | 可放废弃旧文件、历史压缩包；不要混入当前最新源 |  ## 5. 推荐运行流程  ### 5.1 检查所思是否更新  $env:LINKINCREASE_SOURCE_PATH=\"<最新需求源本地目录>\" cd <最新需求源本地目录> python thoughts_sync.py  然后回到知识库：  cd <知识库仓库本地目录> python scripts\\scan_source_manifest.py  最后查看：  metadata/source-diff.csv  ### 5.2 发现新增需求  1. 查看 `source-diff.csv` 中 `change_type=added` 的行。 2. 判断是新功能、新模块、补充说明还是通用规则。 3. 更新 `05-需求文档来源台账.md`。 4. 新建或更新 `docs/` 知识页。 5. 更新 `metadata/documents.csv`、`metadata/sources.csv`、`metadata/search-index.json`。  ### 5.3 发现需求变更  1. 查看 `source-diff.csv` 中 `change_type=modified` 的行。 2. 打开对应 `最新需求源（source:thoughts-v2-current）` 源文件。 3. 找出变更影响的知识页。 4. 更新知识页正文和来源说明。 5. 必要时更新待确认问题。  ### 5.4 发现需求删除或移动  1. 查看 `source-diff.csv` 中 `change_type=deleted` 的行。 2. 先判断是文件改名、移动、版本归档，还是需求废弃。 3. 不要立即删除知识页。 4. 若业务口径仍有效，知识页保留，但来源状态改为待确认或历史来源。 5. 若确认废弃，更新知识页、来源台账和版本变更记录。  ## 6. 当前已知注意事项  1. 旧 `需求文档/` 已删除，不再维护双来源。 2. 当前最新源 `最新需求源（source:thoughts-v2-current）` 中有 63 份 `.md` 文档。 3. 旧来源中有 3 份文件未在最新源中出现，已标记为待确认： - `公式函数.md` - `【运营端】【资源库模版】表单设计组件.md` - `【运营端】【仪表盘】表单设计组件.md` 4. 如果这 3 份仍有效，应补入 `最新需求源（source:thoughts-v2-current）` 后重新运行扫描脚本。 5. 不要手动编辑 `.thoughts_sync`，除非明确知道同步脚本的登录和缓存机制。 6. 不要把浏览器缓存、Cookie、Token、临时数据库放入知识库正文或 metadata。 7. `source-manifest.csv` 和 `source-diff.csv` 是脚本输出，可以查看和分析，但不建议长期手动维护。 8. 标准知识页以 `docs/` 为准；来源文档不是最终产品口径，只是证据和变更输入。  ## 7. 快速判断表  | 你想做什么 | 应该看/运行什么 | | --- | --- | | 检查所思是否有更新 | 运行 `<最新需求源本地目录>\\thoughts_sync.py` | | 让知识库知道最新源变了没 | 运行 `scripts/scan_source_manifest.py` | | 看当前最新源有哪些需求文件 | `metadata/source-manifest.csv` | | 看这次新增/修改/删除了什么 | `metadata/source-diff.csv` | | 看某个知识页登记情况 | `metadata/documents.csv` | | 看某个来源是否已入库 | `metadata/sources.csv` | | 看知识库检索入口 | `metadata/search-index.json` | | 看单源接入说明 | `sources/external/thoughts-current.md` |", "domain": "知识库管理", "module": "版本历史与来源治理", "tags": "90-版本历史与来源治理;可运行文件与导入导出文件说明", "sources": []}, {"path": "docs/90-版本历史与来源治理/团队共享与只读发布方案.md", "title": "团队共享与只读发布方案", "folder": "docs/90-版本历史与来源治理", "text": "# 团队共享与只读发布方案  ## 定位  本页说明如何将 Linkincrease 知识库提供给产品团队查看，同时保持“仅维护人可管理”的权限边界。  推荐方案：  私有 Git 仓库管理源文件 + 静态网站只读发布给产品团队 + linkincrease-requirement-design Skill 辅助需求设计和入库 + Daren 保留维护权限  ## 1. 权限模型  | 角色 | 权限 | 说明 | |---|---|---| | 知识库维护人 | 读写源文件、提交 Git、发布站点、更新 Skill | 通常由 Daren 负责 | | 产品成员 | 只读访问静态站点 | 查看知识库，不直接修改源文件 | | 需求提出人 | 提交需求草稿或确认稿 | 可让 Skill 做检查，但不直接入库 | | 评审参与人 | 查看影响范围、待确认问题、版本记录 | 用于评审和对齐 |  ## 2. Git 私有仓库  建议将知识库本地工作区初始化为私有 Git 仓库，并托管到公司认可的平台。  可选平台：  - 公司内部 GitLab / Git 服务。 - GitHub Private Repository。 - Gitee 私有仓库。 - Azure DevOps / Bitbucket 等。  建议权限：  | 成员类型 | Git 权限 | |---|---| | Daren | Maintainer / Admin | | 产品成员 | Reporter / Read-only | | 研发、测试 | Reporter / Read-only |  源文件只通过维护人合入，避免知识库口径被多人随手改散。  ## 3. 静态网站只读发布  当前知识库提供本地静态站点生成脚本：  python scripts\\build_static_site.py  生成目录：  exports\\site  默认静态站只展示公开知识页，不展示 `skills/` 文档和本地临时目录。需要给 Agent 使用者临时发布 Skill 文档或下载包时，可显式设置：  $env:INCLUDE_SKILLS_IN_SITE=\"1\" $env:INCLUDE_SKILL_DOWNLOADS=\"1\" python scripts\\build_static_site.py  发布方式可以按团队条件选择：  | 方式 | 说明 | |---|---| | 内网服务器 | 将 `exports\\site` 部署为只读目录 | | Git Pages / GitLab Pages | 由私有仓库发布静态站点 | | NAS / 共享盘 | 将 `exports\\site` 作为只读共享目录 | | 临时预览 | 本机运行 `python -m http.server` 预览 |  本地预览命令：  cd exports\\site python -m http.server 8010  然后访问：  http://localhost:8010  ## 4. Skill 共享方式  Skill 名称：  linkincrease-requirement-design  当前本机位置：  本地 Codex skills 目录中的 `linkincrease-requirement-design` skill  团队使用时建议采用可配置知识库路径：  LINKINCREASE_KB_PATH  优先级建议：  1. 使用环境变量 `LINKINCREASE_KB_PATH` 指向团队共享的知识库本地副本或只读路径。 2. 如果没有环境变量，由使用者提供知识库本地路径。 3. 如果都不存在，由使用者提供知识库路径。  产品成员如果只是查看知识库，不需要安装 Skill。只有需要在 Codex 中做需求设计、草稿检查、影响分析的人才需要安装。  ## 5. 需求确认后的入库流程  成员编写需求草稿 → 使用 Skill 做补漏和冲突检查 → 需求评审确认 → 维护人将确认稿同步到最新需求源（source:thoughts-v2-current） → 维护人运行来源扫描 → 维护人更新知识页、来源台账、metadata、待确认问题和版本记录 → 重新生成静态站点 → 产品团队查看最新只读站点  扫描命令：  python scripts\\scan_source_manifest.py  生成站点命令：  python scripts\\build_static_site.py  ## 6. 注意事项  1. 静态站点是阅读入口，不是编辑入口。 2. Skill 是工作方法和路径索引，不是面向所有阅读者的知识库正文；默认不在静态站导航中展示。 3. 知识库正文统一使用 FlowSpace；历史 `source:` 引用中的 SCCS 保留原始文件名。 4. 产品成员可以提交需求建议，但最终入库应由维护人审核。 5. 每次入库后需要重新生成并发布静态站点。", "domain": "知识库管理", "module": "版本历史与来源治理", "tags": "90-版本历史与来源治理;团队共享与只读发布方案", "sources": []}, {"path": "docs/90-版本历史与来源治理/外部链接快照清单.md", "title": "外部链接快照清单", "folder": "docs/90-版本历史与来源治理", "text": "# 外部链接快照清单  ## 定位  原始需求文档中包含大量远程截图、Teambition 图片、Thoughts 链接和钉钉表格链接。为了避免外部链接失效，本页用于定义外部链接的快照策略和优先处理清单。  ## 外部链接类型  | 类型 | 示例来源 | 风险 | 处理策略 | |---|---|---|---| | Teambition 图片 | `https://tcs.teambition.net/storage/...` | 链接过期、签名失效 | 批量下载到 `assets/images/` 并建立映射 | | Thoughts 文档 | `https://thoughts.teambition.com/...` | 权限变化、目录结构变化 | 导出为 Markdown 或 PDF 放入 `sources/exported/` | | 钉钉表格 | `https://alidocs.dingtalk.com/spreadsheetv2/...` | 权限变化、在线内容变动 | 导出为 xlsx/csv 放入 `sources/exported/` | | 外部 API 说明 | 需求中的外部链接或嵌入说明 | 链接不可访问、字段口径丢失 | 整理为本地接口说明文档 |  ## 当前重点外部资料  | 资料 | 当前出现位置 | 建议处理 | |---|---|---| | FlowSpace 权限矩阵钉钉表格 | `【贸易端】【SCCS设置】.md`、`【贸易端】【协作SCCS设置】.md`、订单详情相关文档 | 优先导出为权限矩阵表，补入 `docs/40-权限、安全与审计/` | | 需求截图 | 几乎所有原始需求文档 | 批量下载并按来源文档、行号或资源 ID 建立索引 | | 采集端消息中心关联 Thoughts 文档 | `【采集端】【消息中心】消息通知列表.md` | 导出原文，补入消息模板来源 | | 邮件、短信、通知规则及模板 | 多份文档引用但未见独立完整文档 | 从在线资料或团队文件中补齐后入库 | | 第三方 API / SCMPRO 字段说明 | 外部 API、第三方数据对接、PDF 导入相关需求 | 整理为字段映射和接口示例文档 |  ## 建议本地存储结构  sources/ exported/ tables/ thoughts/ api/ snapshots/ screenshots/ assets/ images/ requirements/  命名建议：  需求来源短名__资源类型__序号__简述.ext  示例：  sccs-settings__table__permission-matrix.xlsx order-detail__image__tracking-record.png external-api__doc__field-mapping.md  ## 快照元数据建议  后续可新增 `metadata/external-links.csv`，字段建议如下：  | 字段 | 说明 | |---|---| | id | 外部资源唯一 ID | | source_file | 出现在哪个原始需求文档 | | source_line | 出现行号 | | url | 原始 URL | | type | image、thoughts、dingtalk、api、other | | local_path | 本地快照路径 | | status | pending、downloaded、failed、not_needed | | captured_at | 快照时间 | | notes | 备注 |  ## 优先级  | 优先级 | 范围 | 原因 | |---|---|---| | P0 | 权限矩阵表、通知模板、外部 API 字段说明 | 会影响产品规则和后续开发判断 | | P1 | 订单、工单、权限、自动化关键截图 | 有助于还原复杂交互 | | P2 | 普通页面原型截图 | 可在知识页稳定后批量归档 |  ## 关联页面  - [来源入库状态](./来源入库状态.md) - [待确认问题](./待确认问题.md) - [知识库工程架构](../../06-知识库工程架构.md)", "domain": "知识库管理", "module": "版本历史与来源治理", "tags": "外部链接;截图;钉钉表格;Thoughts;快照", "sources": [{"title": "【贸易端】【个人中心】个人信息、切换语言、退出账号", "version": "v2.0.x", "product_side": "贸易端", "module": "个人中心", "last_write_time": "2026-09-04T10:48:45"}, {"title": "【贸易端】【团队管理】创建团队", "version": "v2.0.x", "product_side": "贸易端", "module": "团队管理", "last_write_time": "2026-09-04T10:48:48"}, {"title": "【贸易端】【团队设置】团队信息、角色、成员、协作团队管理", "version": "v2.0.x", "product_side": "贸易端", "module": "团队设置", "last_write_time": "2026-09-04T10:48:47"}, {"title": "【贸易端】【工作台】工作台、创建SCCS、SCCS分组", "version": "v2.0.x", "product_side": "贸易端", "module": "工作台", "last_write_time": "2026-09-04T10:48:46"}, {"title": "【贸易端】【账号】注册登录、忘记密码", "version": "v2.0.x", "product_side": "贸易端", "module": "账号", "last_write_time": "2026-09-04T10:48:52"}, {"title": "【运营端】【模板中心】业务模版管理", "version": "v2.0.x", "product_side": "运营端", "module": "模板中心", "last_write_time": "2026-09-04T10:48:49"}, {"title": "【贸易端】【SCCS设置】", "version": "v2.1.x", "product_side": "贸易端", "module": "SCCS设置", "last_write_time": "2026-09-04T10:48:45"}, {"title": "【贸易端】【协作SCCS设置】", "version": "v2.1.x", "product_side": "贸易端", "module": "协作SCCS设置", "last_write_time": "2026-09-04T10:48:42"}, {"title": "【贸易端】【团队设置】邀请成 员_协作团队流程变更", "version": "v2.1.x", "product_side": "贸易端", "module": "团队设置", "last_write_time": "2026-09-04T10:48:42"}, {"title": "【贸易端】【消息中心】消息中心、实时消息", "version": "v2.1.x", "product_side": "贸易端", "module": "消息中心", "last_write_time": "2026-09-04T10:48:42"}, {"title": "【运营端】【业务模板】表单设计组件", "version": "v2.1.x", "product_side": "运营端", "module": "业务模板", "last_write_time": "2026-09-04T10:48:42"}, {"title": "【运营端】【业务模版】表单属性与显隐设置", "version": "v2.1.x", "product_side": "运营端", "module": "业务模版", "last_write_time": "2026-09-04T10:48:38"}, {"title": "【运营
