计算规则 | | FlowSpace 成员 | 订单详情 | 查看里程碑、创建工单、完成/取消/重启里程碑 | | 协作成员 | 订单详情或采集端任务 | 在授权范围内处理里程碑相关批复或工单 |  ## 3. 核心对象  | 对象 | 说明 | | --- | --- | | 里程碑模板 | 业务模板中定义的流程节点 | | 里程碑实例 | 某个订单中的具体里程碑 | | 里程碑计划 | 计划开始、计划结束、计划耗时及其计算规则 | | 里程碑状态 | 未开始、进行中、已完成、已取消 | | 里程碑批复 | 对阶段结果进行确认的批复数据 | | 里程碑标签 | 根据条件展示在里程碑上的业务标记 | | 里程碑互用 | 将里程碑数据复用于其他订单 |  ## 4. 业务流程  stateDiagram-v2 [*] --> 未开始: 创建订单 未开始 --> 进行中: 创建首个工单或状态推进 进行中 --> 已完成: 完成里程碑 未开始 --> 已取消: 取消里程碑 进行中 --> 已取消: 取消里程碑 已完成 --> 进行中: 重启里程碑 已取消 --> 进行中: 重启里程碑  ## 5. 权限规则  | 操作 | 权限要求 | 状态限制 | | --- | --- | --- | | 查看里程碑 | 有里程碑下任意工单查看权限或里程碑批复查看权限 | 受数据围栏影响 | | 创建工单 | 有当前里程碑创建工单权限 | 里程碑未开始或进行中，订单进行中 | | 修改里程碑状态 | 有当前里程碑修改状态权限 | 按状态机限制 | | 里程碑批复 | 当前批复人或有对应权限成员 | 依模板配置和状态限制 | | 修改处理人 | 有修改处理人权限 | 仅进行中相关对象 | | 里程碑互用 | 有里程碑互用权限 | 已完成/已取消等状态下受限 |  ## 6. 状态与限制  | 状态 | 说明 | 关键限制 | | --- | --- | --- | | 未开始 | 订单创建后尚未推进 | 可创建工单，可取消 | | 进行中 | 已开始执行 | 可创建工单、采集、批复、完成或取消 | | 已完成 | 阶段结束 | 不可创建工单、采集、批复、指派；可按权限重启 | | 已取消 | 阶段取消 | 不可创建工单、采集、批复、指派；可按权限重启 |  计划标签：  - 实际开始与计划开始对比可展示延迟或提前。 - 实际完成与计划结束对比可展示延迟或提前。 - 数据围栏会影响里程碑标签和字段展示。  ## 7. 字段、表单与校验  里程碑计划设置：  - 计划开始或计划结束可基于主表单日期字段、其他里程碑实际开始/结束时间计算。 - 可设置当天、之前、之后和正整数天数。 - 计划耗时只允许正整数。 - 计划开始和计划结束互推公式： - 计划结束时间 = 计划开始时间 + 计划耗时 - 1 - 计划开始时间 = 计划结束时间 - 计划耗时 + 1 - 任一时间设置不为空时，其余字段需完整，否则提示请完善时间设置。  模板属性：  - 里程碑名称必填，限制 100 字符。 - 可配置是否需要里程碑批复、工单批复。 - 可配置默认批复人。 - 可配置创建工单按钮、工单采集按钮文案。 - 支持部分内容国际化。  ## 8. 通知、日志与审计  需要记录：  - 里程碑状态变更。 - 里程碑批复创建、指派、提交、修改处理人。 - 里程碑互用和取消互用。 - 里程碑计划配置变更。 - 自动化更新里程碑相关数据。  ## 9. 异常与提示  已知提示方向：  - 里程碑已完成，不可创建/编辑/处理工单。 - 里程碑已取消，不可创建/编辑/处理工单。 - 里程碑已重启，可继续创建或编辑。 - 请完善时间设置。 - 暂无权限，请联系管理员。  ## 10. 来源需求  - `source:thoughts-v2-current/v2.1.x/贸易端/【贸易端】【SCCS设置】.md` - `source:thoughts-v2-current/v2.2.x/贸易端/【贸易端】【订单详情】查看&操作.md` - `source:thoughts-v2-current/v2.2.x/贸易端/【贸易端】【订单详情】工单&里程碑批复操作.md` - `source:thoughts-v2-current/v2.3.x/贸易端/【贸易端】【订单管理】里程碑互用功能.md` - `source:thoughts-v2-current/v2.0.x/运营端/【运营端】【模板中心】业务模版管理.md`  ## 11. 待确认问题  - 重启里程碑后状态应还原为进行中还是完成/取消前状态。 - 订单完成时，未开始和已取消里程碑是否保持原状态的完整规则。 - 里程碑互用状态限制需要从互用需求继续细化。 "}, {"path": "docs/30-业务流程/README.md", "title": "README", "folder": "docs/30-业务流程", "text": "﻿# 30 业务流程  本目录沉淀跨对象流程。  优先建设：  - [从模板到FlowSpace.md](./从模板到FlowSpace.md) - [订单生命周期.md](./订单生命周期.md) - [工单采集与批复.md](./工单采集与批复.md) - [跨团队协作.md](./跨团队协作.md) - [资源库引用与同步.md](./资源库引用与同步.md) - [自动化执行.md](./自动化执行.md) - [移动端采集.md](./移动端采集.md) - [订单复用关系.md](./订单复用关系.md)"}, {"path": "docs/30-业务流程/从模板到FlowSpace.md", "title": "从模板到FlowSpace", "folder": "docs/30-业务流程", "text": "﻿--- title: 从模板到FlowSpace type: knowledge domain: 公共能力 module: 业务流程 submodule: 模板创建FlowSpace status: authoritative version: v0.1 owner: 产品 maintainer: Daren updated_at: 2026-05-25 permission: internal tags: - 业务模板 - FlowSpace - 模板发布 - 模板同步 source_files: - source:thoughts-v2-current/v2.0.x/运营端/【运营端】【模板中心】业务模版管理.md - source:thoughts-v2-current/v2.0.x/贸易端/【贸易端】【工作台】工作台、创建SCCS、SCCS分组.md - source:thoughts-v2-current/v2.1.x/贸易端/【贸易端】【SCCS设置】.md related_docs: - ../20-业务对象/业务模板.md - ../20-业务对象/FlowSpace.md search_keywords: - 创建FlowSpace - 业务模板 - 模板发布 - 同步至FlowSpace ---  # 从模板到 FlowSpace  ## 1. 流程定位  本流程描述运营端业务模板如何成为贸易端可使用的 FlowSpace，并在 FlowSpace 运行态中继续配置成员、角色、数据围栏、里程碑计划、标签和更多业务设置。  ## 2. 流程图  flowchart TD A[\"运营端创建业务模板\"] --> B[\"配置基础信息\"] B --> C[\"设计主表单、里程碑、工单表单、批复表单\"] C --> D[\"配置订单标识、PDF导入、第三方配置、预览数据\"] D --> E[\"发布模板\"] E --> F{\"模板是否启用且已发布\"} F -->|是| G[\"贸易端模板中心可见\"] F -->|否| H[\"贸易端不可见\"] G --> I[\"团队使用模板创建 FlowSpace\"] I --> J[\"FlowSpace 设置成员、角色、协作团队、数据围栏\"] J --> K[\"配置里程碑计划、标签、订单标识、取消原因\"] K --> L[\"进入订单业务执行\"]  ## 3. 阶段说明  | 阶段 | 关键动作 | 结果 | | --- | --- | --- | | 模板创建 | 添加业务模板，配置名称、图标、创建类型、行业、描述、备注 | 生成未发布模板 | | 模板设计 | 设计主表单、里程碑、工单表单、批复表单 | 确定 FlowSpace 的业务结构 | | 模板发布 | 发布模板并设置可见范围 | 贸易端可见的前置条件 | | FlowSpace 创建 | 贸易端团队选择模板创建 FlowSpace | 生成业务空间 | | FlowSpace 运行态设置 | 设置角色、成员、数据围栏、计划、标签、更多设置 | 形成可执行业务环境 |  ## 4. 权限规则  - 运营端模板管理权限决定谁可创建、编辑、发布、复制和同步业务模板。 - 模板可见范围决定哪些团队可在贸易端模板中心看到模板。 - 贸易端团队角色中的“创建 FlowSpace”权限决定谁可创建 FlowSpace。 - FlowSpace 创建后，FlowSpace 内业务权限由 FlowSpace 业务角色和协作方角色控制。  ## 5. 状态与限制  | 对象 | 状态 | 规则 | | --- | --- | --- | | 业务模板 | 未发布 | 即使启用，贸易端也不可见 | | 业务模板 | 已发布 | 可按可见范围在贸易端展示 | | 业务模板 | 已编辑 | 与已发布版本不一致，需要提示发布 | | FlowSpace | 已创建 | 基于创建时模板生成运行态结构 | | FlowSpace 模板同步 | 同步至未发布状态的 FlowSpace 模板 | 需谨慎处理字段关联和业务数据 |  ## 6. 数据与表单影响  模板定义以下内容：  - 订单主表单。 - 里程碑。 - 工单采集表单。 - 工单批复表单。 - 里程碑批复表单。 - 订单标识默认配置。 - PDF 导入设置。 - 第三方数据对接配置。 - 预览数据。  同步至 FlowSpace 时，需确认新增字段、删除字段、字段关联关系和历史业务数据保留规则。  ## 7. 日志与追溯  需要记录：  - 模板创建、编辑、删除。 - 模板发布。 - 模板可见范围设置。 - 模板复制。 - 同步至 FlowSpace。 - FlowSpace 创建。 - FlowSpace 设置变更。  ## 8. 待确认问题  - 业务模板同步至已创建 FlowSpace 时，字段删除后的历史业务数据如何保留。 - FlowSpace 内模板是否存在发布态/未发布态的完整状态机。 - 用户自建模板和定制模板是否纳入当前流程。  ## 9. 来源需求  - `source:thoughts-v2-current/v2.0.x/运营端/【运营端】【模板中心】业务模版管理.md` - `source:thoughts-v2-current/v2.0.x/贸易端/【贸易端】【工作台】工作台、创建SCCS、SCCS分组.md` - `source:thoughts-v2-current/v2.1.x/贸易端/【贸易端】【SCCS设置】.md` "}, {"path": "docs/30-业务流程/工单采集与批复.md", "title": "工单采集与批复", "folder": "docs/30-业务流程", "text": "﻿--- title: 工单采集与批复 type: knowledge domain: 贸易端 module: 业务流程 submodule: 工单处理 status: authoritative version: v0.1 owner: 产品 maintainer: Daren updated_at: 2026-05-25 permission: internal tags: - 工单 - 采集 - 批复 - 指派 source_files: - source:thoughts-v2-current/v2.2.x/贸易端/【贸易端】【订单详情】工单&里程碑批复操作.md - source:thoughts-v2-current/v2.3.x/采集端/【采集端】【任务详情页】工单、工单批复、里程碑批复详情页.md related_docs: - ../20-业务对象/工单与批复.md - ../20-业务对象/里程碑.md - ../20-业务对象/订单.md search_keywords: - 创建工单 - 采集指派 - 工单采集 - 工单批复 - 里程碑批复 ---  # 工单采集与批复  ## 1. 流程定位  本流程描述工单从创建、设置处理人、协作方指派、采集提交、工单批复，到里程碑批复的执行链路。  ## 2. 流程图  flowchart TD A[\"创建工单\"] --> B[\"设置采集人、工单批复人、里程碑批复人\"] B --> C{\"采集人为协作团队负责人模式\"} C -->|是| D[\"协作方有指派权限成员指派具体成员\"] C -->|否| E[\"采集人直接处理\"] D --> E E --> F[\"提交工单采集\"] F --> G{\"模板是否需要工单批复\"} G -->|是| H[\"工单批复人提交批复\"] G -->|否| I[\"工单采集链路结束\"] H --> I I --> J{\"模板是否需要里程碑批复\"} J -->|是| K[\"里程碑批复人提交批复\"] J -->|否| L[\"进入里程碑推进\"] K --> L  ## 3. 阶段说明  | 阶段 | 关键规则 | | --- | --- | | 创建工单 | 里程碑未开始或进行中，且用户有创建工单权限 | | 设置处理人 | 可选择成员、协作团队负责人或具体协作成员 | | 采集指派 | 协作方负责人模式下，由有指派权限成员指派具体成员 | | 工单采集 | 采集人填写可编辑表单并提交 | | 工单批复 | 模板需要工单批复时执行 | | 里程碑批复 | 模板需要里程碑批复时执行 |  ## 4. 权限与状态限制  不可处理的典型场景：  - 订单已删除。 - 订单已完成或已取消。 - 里程碑已完成或已取消。 - 工单已终止采集。 - 工单已批复。 - 工单已删除。 - 采集人或可编辑表单权限已变化。 - 多人并发提交后当前页面未刷新。  ## 5. 表单与校验  创建工单时：  - 一次最多创建 10 条。 - 至少保留一个非隐藏表单。 - 工单名称必填，默认自动编号。 - 采集人、工单批复人、里程碑批复人按模板要求校验。 - 未设置采集人的表单需要校验必填字段。  采集提交时：  - 当前用户只可编辑自己负责的表单。 - 必填项和字段格式按运营端配置校验。 - 其他人提交后，当前页面需刷新才能继续提交。  ## 6. 通知与日志  | 事件 | 通知/记录 | | --- | --- | | 创建工单 | 通知采集处理成员或协作团队负责人；写入工单动态 | | 采集指派 | 通知被指派成员；写入工单动态 | | 采集提交 | 通知发起人或批复人；写入动态和历史记录 | | 工单批复 | 写入工单批复动态和历史记录 | | 里程碑批复 | 写入里程碑批复动态和历史记录 | | 终止采集 | 写入动态 | | 自动化创建工单 | 操作人为机器人，写入动态和跟踪记录 |  ## 7. 待确认问题  - 终止采集是否可恢复。 - 工单批复后，自动化或资源库同步是否仍可更新采集字段。 - 采集端与贸易端的全部提示文案是否一致。  ## 8. 来源需求  - `source:thoughts-v2-current/v2.2.x/贸易端/【贸易端】【订单详情】工单&里程碑批复操作.md` - `source:thoughts-v2-current/v2.3.x/采集端/【采集端】【任务详情页】工单、工单批复、里程碑批复详情页.md` - `source:thoughts-v2-current/v2.3.x/采集端/【采集端】【任务列表】工单、工单批复、里程碑批复任务列表.md` "}, {"path": "docs/30-业务流程/移动端采集.md", "title": "移动端采集", "folder": "docs/30-业务流程", "text": "﻿--- title: 移动端采集 type: knowledge domain: 采集端 module: 业务流程 submodule: 移动任务处理 status: authoritative version: v0.1 owner: 产品 maintainer: Daren updated_at: 2026-05-25 permission: internal tags: - 采集端 - 任务 - 工单 - 批复 source_files: - source:thoughts-v2-current/v2.3.x/采集端/【采集端】【首页】任务相关数据展示.md - source:thoughts-v2-current/v2.3.x/采集端/【采集端】【任务列表】工单、工单批复、里程碑批复任务列表.md - source:thoughts-v2-current/v2.3.x/采集端/【采集端】【任务详情页】工单、工单批复、里程碑批复详情页.md - source:thoughts-v2-current/v2.3.x/采集端/【采集端】【任务搜索页】工单、工单批复、里程碑批复任务搜索.md related_docs: - ../20-业务对象/工单与批复.md - ./工单采集与批复.md search_keywords: - 采集端 - 任务列表 - 待办 - 团队指派 - 我关注 ---  # 移动端采集  ## 1. 流程定位  移动端采集是采集端承接贸易端任务的执行流程，主要用于查看和处理工单、工单批复、里程碑批复任务，并支持首页统计、任务列表、搜索、详情、消息和个人中心。  ## 2. 流程图  flowchart TD A[\"登录采集端\"] --> B[\"进入首页\"] B --> C[\"查看我的任务、团队待指派、我关注、FlowSpace待办\"] C --> D[\"进入任务列表\"] D --> E{\"任务类型\"} E -->|工单| F[\"进入工单详情并采集\"] E -->|工单批复| G[\"进入工单批复详情并批复\"] E -->|里程碑批复| H[\"进入里程碑批复详情并批复\"] F --> I[\"提交或关注任务\"] G --> I H --> I I --> J[\"同步贸易端任务状态和数据\"]  ## 3. 首页  首页展示：  - 我的任务。 - 团队待指派任务。 - 我关注任务。 - FlowSpace 任务数据。 - 团队切换列表中的待办数量。 - 底部导航任务待办数。  FlowSpace 数据：  - 订单：该团队下需要我处理的任务对应订单数。 - 任务：该团队下需要我处理的任务数。 - 里程碑数字：对应里程碑需要我处理的任务数。 - 待办数：进行中的待办工单、里程碑批复、工单批复。 - 外部协作标识：非本团队 FlowSpace 需展示协作标识和所属团队信息。  ## 4. 任务列表  | 列表 | 规则 | | --- | --- | | 进行中任务 | 包含待办和已处理任务 | | 已完成任务 | 里程碑完成/取消、工单已批复、工单终止采集等 | | 我发起任务 | 发起人为本人的工单或批复 | | 团队指派任务 | 有指派权限的待指派、已指派、已完成任务 | | 我关注任务 | 本人关注的任务 |  任务需排除互用自的工单，仅展示正常创建的工单。  ## 5. 待办与已处理判断  进行中待办：  - 里程碑批复：里程碑进行中且处理人未提交。 - 工单批复：里程碑进行中且处理人未提交。 - 工单：里程碑进行中、无工单批复、未终止，且处理人未提交。 - 协作工单/批复指派：可编辑、未提交、未指派、且有指派权限。  进行中已处理：  - 里程碑批复：里程碑进行中且处理人已提交。 - 工单批复：里程碑进行中且处理人已提交。 - 工单：里程碑进行中、无工单批复、未终止，且处理人已提交。 - 协作工单/批复指派：可编辑、有指派权限，且已提交或已指派。  ## 6. 操作规则  - 支持下拉刷新、上拉加载更多。 - 多 Tab 点击切换。 - 超过两屏高度出现返回顶部按钮。 - 搜索跳转任务搜索页。 - 点击任务进入对应详情页。 - 点击关注后进入我关注列表。 - 点击团队名称可切换团队，切换后任务列表同步切换。  ## 7. 与贸易端同步  采集端处理的工单、工单批复、里程碑批复数据需与贸易端实时同步。采集端状态限制应与贸易端保持一致：  - 订单已完成/取消时不可继续处理。 - 里程碑已完成/取消时不可继续处理。 - 工单已终止或已批复时不可继续采集。 - 权限变化后跳转或提交需提示暂无权限或刷新。  ## 8. 待确认问题  - 采集端是否完整覆盖贸易端所有状态限制和提示文案。 - 离线或弱网场景是否支持草稿或重试。 - 采集端任务关注、搜索、消息之间的数据同步频率。  ## 9. 来源需求  - `source:thoughts-v2-current/v2.3.x/采集端/【采集端】【首页】任务相关数据展示.md` - `source:thoughts-v2-current/v2.3.x/采集端/【采集端】【任务列表】工单、工单批复、里程碑批复任务列表.md` - `source:thoughts-v2-current/v2.3.x/采集端/【采集端】【任务详情页】工单、工单批复、里程碑批复详情页.md` - `source:thoughts-v2-current/v2.3.x/采集端/【采集端】【任务搜索页】工单、工单批复、里程碑批复任务搜索.md` "}, {"path": "docs/30-业务流程/自动化执行.md", "title": "自动化执行", "folder": "docs/30-业务流程", "text": "﻿--- title: 自动化执行 type: knowledge domain: 贸易端 module: 业务流程 submodule: 自动化 status: authoritative version: v0.1 owner: 产品 maintainer: Daren updated_at: 2026-05-25 permission: internal tags: - 自动化 - 定时任务 - 通知 - 执行日志 source_files: - source:thoughts-v2-current/V2.4.x/贸易端/【贸易端】【自动化】一期.md - source:thoughts-v2-current/V2.5.x/贸易端/【贸易端】【自动化】二期：定时任务.md - source:thoughts-v2-current/V2.4.x/贸易端/系统自动执行的相关操作日志.md related_docs: - ../20-业务对象/FlowSpace.md - ./订单生命周期.md - ./工单采集与批复.md search_keywords: - 自动化 - 触发条件 - 执行动作 - 定时任务 - 执行日志 ---  # 自动化执行  ## 1. 流程定位  自动化用于在 FlowSpace 内基于触发条件执行机械性业务动作。自动化由触发条件和执行操作组成，启用后才会执行。执行失败时可通知指定对象，并记录执行日志。  ## 2. 流程图  flowchart TD A[\"创建或编辑自动化\"] --> B[\"配置触发条件\"] B --> C[\"配置最多多个执行操作\"] C --> D[\"校验设置完整性\"] D --> E{\"保存并启用\"} E -->|未启用| F[\"仅保存，不执行\"] E -->|启用| G[\"等待触发\"] G --> H{\"满足触发条件\"} H -->|否| G H -->|是| I[\"按顺序执行操作\"] I --> J{\"某一步失败\"} J -->|是| K[\"后续操作不执行，发送失败通知\"] J -->|否| L[\"执行成功\"] K --> M[\"写入执行日志\"] L --> M  ## 3. 触发条件  | 触发条件 | 说明 | | --- | --- | | 数据新增时 | 当订单基本信息、里程碑批复、里程碑工单等数据新增并满足条件时触发 | | 数据内容变更时 | 当指定数据源字段发生变更并满足条件时触发 | | 到达记录中的时间时 | 当到达某数据源内日期字段的指定时间点时触发 | | 定时任务 | 按不重复、每天、每周、每月、每月第 xx 个周 xx 等周期触发 |  自动化触发条件和执行操作在同一订单内发生，不跨订单执行。  ## 4. 执行操作  | 执行动作 | 说明 | | --- | --- | | 发送通知 | 向 FlowSpace 成员、协作团队、业务角色、协作方角色、系统角色、模板控件等对象发送站内或邮件通知 | | 新增数据 | 主要用于自动新增工单，并设置处理人和默认值 | | 更新数据 | 更新订单基本信息、里程碑批复、工单等数据源字段 |  定时任务下的执行操作有特殊限制：  - 发送通知时，通知对象仅保留 FlowSpace 成员、协作团队、业务角色、协作方角色 4 个分组。 - 新增数据时需增加订单筛选条件，筛选符合条件的订单再创建工单。 - 更新数据时需增加记录范围设置，过滤符合条件的订单、里程碑批复或工单。 - 设置的时间不存在时不执行，且不属于执行失败。  ## 5. 权限与状态限制  | 限制 | 说明 | | --- | --- | | 自动化配置权限 | 需要有 FlowSpace 自动化配置权限 | | 启用校验 | 条件和操作都至少有一个节点，且设置完整 | | 顺序执行 | 任一步失败，后续操作不执行 | | 订单状态 | 订单已完成或已取消时，新增或更新数据通常不执行 | | 里程碑状态 | 里程碑已完成或已取消时，里程碑批复或工单相关动作不执行 | | 互用限制 | 里程碑互用自其他订单、工单互用自其他订单时，部分动作不执行 |  ## 6. 通知规则  自动化通知对象包括：  - FlowSpace 成员。 - FlowSpace 协作团队。 - 业务角色和协作方角色。 - 订单模板控件。 - 步骤一数据源角色。 - 系统角色，如订单创建人、订单更新人、里程碑负责人、工单采集人、工单批复人等。  通知渠道：  - Linkincrease 消息。 - 邮件。 - 失败通知可配置站内、邮件、短信。  ## 7. 日志与审计  执行日志需记录：  - 执行数据。 - 执行时间。 - 执行状态：成功、失败、部分成功。 - 满足的条件。 - 每个执行节点的配置和执行结果。 - 操作人：团队成员、协作方成员或机器人。 - 新增或变更的数据内容。  系统自动执行日志中，自动化操作人应标识为机器人或具体自动程序。  ## 8. 待确认问题  - 部分成功的完整处理规则。 - 自动化与资源库同步同时更新同一字段时的优先级。 - 定时任务的时区、夏令时和不存在日期处理是否需要额外规则。  ## 9. 来源需求  - `source:thoughts-v2-current/V2.4.x/贸易端/【贸易端】【自动化】一期.md` - `source:thoughts-v2-current/V2.5.x/贸易端/【贸易端】【自动化】二期：定时任务.md` - `source:thoughts-v2-current/V2.4.x/贸易端/系统自动执行的相关操作日志.md` "}, {"path": "docs/30-业务流程/订单复用关系.md", "title": "订单复用关系", "folder": "docs/30-业务流程", "text": "﻿--- title: 订单复用关系 type: knowledge domain: 贸易端 module: 业务流程 submodule: 订单复用 status: authoritative version: v0.1 owner: 产品 maintainer: Daren updated_at: 2026-05-25 permission: internal tags: - 订单 - 翻单 - 订单关联 - 里程碑互用 - 工单互用 source_files: - source:thoughts-v2-current/v2.3.x/贸易端/【贸易端】【订单管理】订单翻单功能.md - source:thoughts-v2-current/v2.3.x/贸易端/【贸易端】【订单管理】订单关联功能.md - source:thoughts-v2-current/v2.3.x/贸易端/【贸易端】【订单管理】里程碑互用功能.md - source:thoughts-v2-current/v2.3.x/贸易端/【贸易端】【订单管理】工单互用功能.md related_docs: - ../20-业务对象/订单.md - ../20-业务对象/里程碑.md - ../20-业务对象/工单与批复.md search_keywords: - 翻单 - 订单关联 - 里程碑互用 - 工单互用 - 取消互用 ---  # 订单复用关系  ## 1. 流程定位  订单复用关系用于在订单之间建立业务关系或复用历史数据，包括订单翻单、订单关联、里程碑互用和工单互用。它们都服务于减少重复录入、提高协作效率和保留跨订单追溯关系，但数据同步范围和影响不同。  ## 2. 关系总览  | 关系 | 作用 | 是否复制数据 | 是否建立持续关系 | | --- | --- | --- | --- | | 订单翻单 | 基于原订单创建或指定翻单订单 | 可填入原单、复制里程碑、互用里程碑 | 是，原单与翻单互相展示 | | 订单关联 | 建立订单之间的关系 | 不复制数据 | 是，互相关联展示 | | 里程碑互用 | 将里程碑数据互用于其他订单 | 展示并复用除计划时间、负责人外的数据 | 是，来源里程碑决定互用数据 | | 工单互用 | 将工单复用于其他订单里程碑 | 展示工单数据、工单批复、历史和动态 | 是，原工单被复用 |  ## 3. 订单翻单  flowchart TD A[\"选择原订单\"] --> B{\"翻单方式\"} B -->|创建新订单| C[\"填写新订单数据\"] B -->|选择已有订单| D[\"选择可用已有订单\"] C --> E[\"填入原单主表单数据\"] D --> E E --> F{\"里程碑处理\"} F -->|复制原单| G[\"复制里程碑批复、工单批复、工单数据\"] F -->|互用原单| H[\"互用里程碑数据，不同步计划时间\"] F -->|不处理| I[\"仅建立翻单关系\"] G --> J[\"确认翻单并写入跟踪记录\"] H --> J I --> J  关键规则：  - 翻单权限在 FlowSpace 业务角色中配置。 - 可创建新订单作为翻单，也可选择已有订单作为翻单。 - 创建新订单翻单时，新增订单创建人为翻单操作人。 - 已有订单建立翻单关系时，订单创建人不变。 - 复制原单不复制里程碑计划时间、不复制邮件协作数据。 - 复制或互用里程碑时，主表单公式可能需要重新计算。 - 翻单成功后，原单和翻单都写入跟踪记录。  ## 4. 订单关联  订单关联用于建立订单之间的互相关系，不默认复制字段或流程数据。  关键规则：  - 关联权限在 FlowSpace 业务角色中配置。 - 可从订单列表或订单详情发起。 - 可选择一条或多条订单。 - 可选订单排除当前订单和已关联订单。 - 关联后，两边订单都展示关联标识。 - 点击关联订单跳转详情，无权限时提示暂无权限。 - 取消关联后，两边关系解除并写入跟踪记录。 - 关联订单被删除后，另一方不再展示关联信息，并写入跟踪记录。  ## 5. 里程碑互用  里程碑互用用于将某订单的里程碑数据复用于其他订单。  关键规则：  - 需要有里程碑互用权限。 - 互用后，同步展示原里程碑数据，但计划时间和负责人不同步。 - 原无权限的订单若添加互用里程碑，原工单参与人可跳转并查看互用工单。 - 可将当前里程碑互用于其他订单，也可从其他订单互用里程碑到当前订单。 - 可选订单需满足订单进行中、里程碑未开始或进行中、具备对应权限等条件。 - 里程碑或工单已有互用关系时，部分互用入口需置灰或后端拦截。 - 互用和取消互用均需写入订单跟踪记录。  ## 6. 工单互用  工单互用用于将某个工单复用于其他订单的里程碑。  关键规则：  - 需要有工单互用权限。 - 互用后可查看工单数据、工单批复数据、历史记录、工单动态，但互用工单不可发新动态。 - 可在里程碑操作中添加互用工单，也可在工单操作中将工单互用于其他里程碑。 - 互用自其他工单的工单仅有查看功能，无工单编辑操作。 - 里程碑新增工单命名逻辑不受互用工单影响。 - 源工单动态记录互用和取消互用。 - 任一方数据被删除时，需要取消互用关系并更新展示。  ## 7. 权限与状态限制  | 关系 | 权限 | 状态限制 | | --- | --- | --- | | 翻单 | 订单翻单权限 | 可选订单需符合来源规则，避免循环翻单或已翻单订单重复作为翻单 | | 订单关联 | 订单关联权限 | 排除当前订单、已关联订单、不可见订单 | | 里程碑互用 | 里程碑互用权限 | 订单进行中，里程碑未开始或进行中；排除已有互用冲突 | | 工单互用 | 工单互用权限 | 订单进行中，目标里程碑未完成；排除互用自工单、已互用工单等 |  ## 8. 日志与审计  需要记录：  - 创建翻单关系。 - 取消翻单关系。 - 建立订单关联。 - 取消订单关联。 - 里程碑互用和取消互用。 - 工单互用和取消互用。 - 删除订单、里程碑、工单导致复用关系取消。  ## 9. 待确认问题  - 翻单、关联、互用之间是否允许组合使用的完整矩阵。 - 取消里程碑互用时，目标里程碑数据保留或清空的选择规则。 - 工单互用中源工单被删除后，目标工单删除是否需要保留审计快照。  ## 10. 来源需求  - `source:thoughts-v2-current/v2.3.x/贸易端/【贸易端】【订单管理】订单翻单功能.md` - `source:thoughts-v2-current/v2.3.x/贸易端/【贸易端】【订单管理】订单关联功能.md` - `source:thoughts-v2-current/v2.3.x/贸易端/【贸易端】【订单管理】里程碑互用功能.md` - `source:thoughts-v2-current/v2.3.x/贸易端/【贸易端】【订单管理】工单互用功能.md` "}, {"path": "docs/30-业务流程/订单生命周期.md", "title": "订单生命周期", "folder": "docs/30-业务流程", "text": "﻿--- title: 订单生命周期 type: knowledge domain: 贸易端 module: 业务流程 submodule: 订单生命周期 status: authoritative version: v0.1 owner: 产品 maintainer: Daren updated_at: 2026-05-25 permission: internal tags: - 订单 - 生命周期 - 状态 - 跟踪记录 source_files: - source:thoughts-v2-current/v2.2.x/贸易端/【贸易端】【订单详情】查看&操作.md - source:thoughts-v2-current/v2.2.x/贸易端/【贸易端】【订单列表】订单增删改.md - source:thoughts-v2-current/v2.3.x/贸易端/【贸易端】【订单列表】批量操作.md related_docs: - ../20-业务对象/订单.md - ../20-业务对象/里程碑.md - ../20-业务对象/工单与批复.md search_keywords: - 创建订单 - 完成订单 - 取消订单 - 重启订单 - 跟踪记录 ---  # 订单生命周期  ## 1. 流程定位  订单生命周期描述订单从创建、执行业务、推进里程碑和工单，到完成、取消或重启的完整状态变化，以及各状态下对里程碑、工单、批复和日志的影响。  ## 2. 状态机  stateDiagram-v2 [*] --> 进行中: 创建订单 进行中 --> 已完成: 完成订单 进行中 --> 已取消: 取消订单 已完成 --> 进行中: 重启订单 已取消 --> 进行中: 重启订单  ## 3. 主流程  flowchart TD A[\"创建订单\"] --> B[\"填写订单基本信息\"] B --> C[\"生成里程碑实例\"] C --> D[\"创建工单或处理里程碑批复\"] D --> E[\"工单采集、工单批复\"] E --> F[\"里程碑状态推进\"] F --> G{\"订单是否结束\"} G -->|否| D G -->|完成| H[\"完成订单\"] G -->|取消| I[\"取消订单并选择取消原因\"] H --> J[\"限制后续编辑和处理动作\"] I --> J J --> K[\"写入跟踪记录、历史记录和动态\"]  ## 4. 关键规则  | 动作 | 规则 | | --- | --- | | 创建订单 | 按业务模板主表单填写数据，生成对应里程碑 | | 编辑订单 | 需有编辑订单权限，已完成/已取消状态受限 | | 完成订单 | 仅进行中订单可完成；完成后订单和相关里程碑、工单处理动作受限 | | 取消订单 | 仅进行中订单可取消；需选择取消原因 | | 重启订单 | 已完成或已取消订单可按权限重启为进行中 | | 删除订单 | 需有删除订单权限；删除后相关链接应提示无权限或不可访问 |  ## 5. 完成订单后的影响  - 订单状态变更为已完成。 - 订单不可编辑、不可取消。 - 进行中的里程碑变更为已完成，其余里程碑状态按规则保持。 - 所有里程碑不可创建工单，不可修改状态，不可从其他订单互用里程碑，不可添加互用工单。 - 所有里程碑批复不可编辑、指派、修改处理人。 - 所有工单不可采集、批复、指派、修改处理人、发邮件协作、终止采集、删除工单。 - 跟踪记录增加完成订单记录。  ## 6. 取消订单后的影响  - 订单状态变更为已取消。 - 取消时需选择取消原因。 - 取消原因来自 FlowSpace 设置中的订单取消原因预设。 - 历史订单中保存取消时的文本，后续修改预设不影响已取消订单展示。 - 业务处理动作受限。 - 跟踪记录增加取消订单记录。  ## 7. 权限规则  | 操作 | 权限要求 | | --- | --- | | 查看订单 | 查看订单基本信息权限 + 数据围栏 | | 创建订单 | 创建订单权限 | | 编辑订单 | 编辑订单权限 | | 修改订单状态 | 修改订单状态权限 | | 删除订单 | 删除订单权限 | | 查看跟踪记录 | 查看跟踪记录权限 |  ## 8. 日志与审计  订单生命周期必须写入：  - 订单创建记录。 - 订单编辑历史。 - 完成、取消、重启记录。 - 跟踪记录。 - 自动化修改订单基本信息记录。 - 资源库同步或公式更新引发的系统自动执行日志。  ## 9. 待确认问题  - 订单重启后，已完成/已取消里程碑和工单是否恢复可处理的完整规则。 - 删除订单后，关联订单、翻单、互用数据如何展示和记录。 - 自动化是否允许对已完成或已取消订单继续执行某些动作。  ## 10. 来源需求  - `source:thoughts-v2-current/v2.2.x/贸易端/【贸易端】【订单详情】查看&操作.md` - `source:thoughts-v2-current/v2.2.x/贸易端/【贸易端】【订单列表】订单增删改.md` - `source:thoughts-v2-current/v2.3.x/贸易端/【贸易端】【订单列表】批量操作.md` "}, {"path": "docs/30-业务流程/资源库引用与同步.md", "title": "资源库引用与同步", "folder": "docs/30-业务流程", "text": "﻿--- title: 资源库引用与同步 type: knowledge domain: 贸易端 module: 业务流程 submodule: 资源库应用 status: authoritative version: v0.1 owner: 产品 maintainer: Daren updated_at: 2026-05-25 permission: internal tags: - 资源库 - 引用 - 同步 - 历史记录 source_files: - source:thoughts-v2-current/V2.4.x/贸易端/【贸易端】【资源库】第一阶段.md - source:thoughts-v2-current/v2.7/贸易端/【贸易端】【资源库】SCCS应用数据范围、数据编辑历史记录.md - source:thoughts-v2-current/V2.4.x/贸易端/系统自动执行的相关操作日志.md related_docs: - ../20-业务对象/资源库.md - ../20-业务对象/FlowSpace.md - ../40-权限与安全/权限体系总表.md search_keywords: - 资源库引用 - FlowSpace应用数据范围 - 资源库同步 - 数据编辑历史 ---  # 资源库引用与同步  ## 1. 流程定位  资源库引用与同步描述团队资源库如何被 FlowSpace 订单字段引用，以及资源库数据变化后如何影响订单中的已引用数据和历史记录。  ## 2. 流程图  flowchart TD A[\"运营端配置资源库模板\"] --> B[\"贸易端创建资源库\"] B --> C[\"维护资源库表数据\"] C --> D[\"FlowSpace 关联资源库\"] D --> E[\"订单字段引用资源库数据\"] C --> F[\"资源库数据变更\"] F --> G{\"是否影响已引用数据\"} G -->|按策略同步| H[\"系统自动更新订单引用字段\"] G -->|不同步| I[\"历史订单保留引用快照或文本\"] H --> J[\"写入系统自动执行日志\"] I --> K[\"可通过历史记录追溯\"]  ## 3. FlowSpace 应用数据范围  资源库可按表设置 FlowSpace 应用权限：  | 配置 | 说明 | | --- | --- | | 所有数据 | FlowSpace 关联资源库后，所有用户在订单中引用资源库数据时，可引用所有数据 | | 根据用户权限 | 用户在 FlowSpace 订单中引用资源库数据时，只可引用本人可查看的资源库数据 |  规则：  - 此处 FlowSpace 指与资源库所属同一团队下的 FlowSpace。 - 暂不考虑协作团队 FlowSpace 引用协作资源库的复杂场景。 - 修改配置后，不影响 FlowSpace 已引用的数据。 - 再次编辑订单数据时，可引用数据范围按最新配置生效。  ## 4. 引用与删除规则  | 场景 | 规则 | | --- | --- | | 删除资源库 | 新订单不可再引用；历史订单保留已引用文本 | | 删除资源库数据 | 新订单不可继续引用该数据；历史引用保留 | | 修改资源库数据 | 按同步策略影响已引用字段 | | 修改 FlowSpace 应用范围 | 不影响已引用数据；影响后续编辑引用范围 |  ## 5. 历史记录  - 资源库数据列表每条数据增加历史记录查看按钮。 - 可见该条数据的人可以查看历史记录。 - 历史记录按操作时间正序排序。 - 默认查看最新一条记录。 - 游客操作需增加分享人信息。  ## 6. 日志与审计  需要记录：  - 资源库数据创建、编辑、删除。 - 资源库数据导入、导出。 - FlowSpace 应用数据范围配置变更。 - 资源库同步触发的系统自动执行日志。 - 资源库历史记录。  ## 7. 待确认问题  - 资源库同步与自动化更新同一字段时的优先级。 - 资源库引用字段被手动修改后的冲突处理。 - 协作资源库和协作团队 FlowSpace 引用场景是否纳入近期范围。  ## 8. 来源需求  - `source:thoughts-v2-current/V2.4.x/贸易端/【贸易端】【资源库】第一阶段.md` - `source:thoughts-v2-current/v2.7/贸易端/【贸易端】【资源库】SCCS应用数据范围、数据编辑历史记录.md` - `source:thoughts-v2-current/V2.4.x/贸易端/系统自动执行的相关操作日志.md` "}, {"path": "docs/30-业务流程/跨团队协作.md", "title": "跨团队协作", "folder": "docs/30-业务流程", "text": "﻿--- title: 跨团队协作 type: knowledge domain: 贸易端 module: 业务流程 submodule: 团队协作 status: authoritative version: v0.1 owner: 产品 maintainer: Daren updated_at: 2026-05-25 permission: internal tags: - 团队 - 协作团队 - 协作FlowSpace - 指派 source_files: - source:thoughts-v2-current/v2.0.x/贸易端/【贸易端】【团队设置】团队信息、角色、成员、协作团队管理.md - source:thoughts-v2-current/v2.1.x/贸易端/【贸易端】【协作SCCS设置】.md - source:thoughts-v2-current/v2.2.x/贸易端/【贸易端】【订单详情】工单&里程碑批复操作.md related_docs: - ../20-业务对象/团队与协作团队.md - ../20-业务对象/FlowSpace.md - ../40-权限与安全/权限体系总表.md search_keywords: - 协作团队 - 邀请协作团队 - 协作FlowSpace - 对接人 - 指派 ---  # 跨团队协作  ## 1. 流程定位  跨团队协作描述主团队如何邀请外部团队建立协作关系，并将协作团队加入具体 FlowSpace 参与订单、里程碑、工单和批复处理。  ## 2. 流程图  flowchart TD A[\"主团队邀请协作团队\"] --> B[\"协作团队接受邀请\"] B --> C[\"建立团队层协作关系\"] C --> D[\"主团队将协作团队加入 FlowSpace\"] D --> E[\"设置协作方角色、数据围栏、协作里程碑\"] E --> F[\"协作团队对接人默认加入\"] F --> G[\"工单或批复中选择协作团队/协作成员\"] G --> H{\"是否负责人模式\"} H -->|是| I[\"协作方指派具体成员\"] H -->|否| J[\"具体成员直接处理\"] I --> J  ## 3. 两层协作关系  | 层级 | 说明 | | --- | --- | | 团队层协作 | 当前团队与外部团队建立协作关系，是加入 FlowSpace 的前置关系 | | FlowSpace 层协作 | 将已建立关系的协作团队加入具体 FlowSpace，并设置角色、数据围栏和协作里程碑 |  ## 4. 权限规则  | 场景 | 权限来源 | | --- | --- | | 邀请协作团队 | 团队设置权限 | | 将协作团队加入 FlowSpace | FlowSpace 设置权限 | | 设置协作方角色 | FlowSpace 设置权限 | | 协作成员查看订单/工单 | 协作方角色 + 数据围栏 | | 协作方指派成员 | 对应里程碑或工单的指派权限 | | 协作成员采集/批复 | 被指派或被授权为处理人 |  ## 5. 关键规则  - 团队层协作使用团队码发起邀请。 - 被邀请团队中有团队设置权限的成员收到邀请。 - 协作团队接受后，才能被加入具体 FlowSpace。 - 添加协作团队到 FlowSpace 时，可设置协作方角色、数据围栏、协作里程碑。 - 协作团队拥有者默认成为该 FlowSpace 的对接人。 - 删除协作团队会同步影响其参与的 FlowSpace。 - 相关邮件和消息跳转时，如果权限已失效，应提示暂无权限。  ## 6. 通知与日志  需要记录：  - 协作团队邀请。 - 接受或拒绝协作邀请。 - 将协作团队加入 FlowSpace。 - 设置协作方角色、数据围栏、协作里程碑。 - 删除协作团队。 - 协作方指派、采集、批复相关动态。  ## 7. 待确认问题  - 对接人、负责人、有指派权限成员三者边界是否完全一致。 - 删除协作团队后的任务批量移交规则。 - 协作团队创建的 FlowSpace 引用主团队授权资源库数据的完整规则。  ## 8. 来源需求  - `source:thoughts-v2-current/v2.0.x/贸易端/【贸易端】【团队设置】团队信息、角色、成员、协作团队管理.md` - `source:thoughts-v2-current/v2.1.x/贸易端/【贸易端】【协作SCCS设置】.md` - `source:thoughts-v2-current/v2.1.x/贸易端/【贸易端】【SCCS设置】.md` - `source:thoughts-v2-current/v2.2.x/贸易端/【贸易端】【订单详情】工单&里程碑批复操作.md` "}, {"path": "docs/40-权限与安全/FlowSpace业务角色权限.md", "title": "FlowSpace业务角色权限", "folder": "docs/40-权限与安全", "text": "﻿--- title: FlowSpace业务角色权限 type: knowledge domain: 贸易端 module: 权限 submodule: FlowSpace业务角色 status: authoritative version: v0.1 owner: 产品 maintainer: Daren updated_at: 2026-05-25 permission: internal tags: - 权限 - FlowSpace - 业务角色 - 订单权限 source_files: - source:thoughts-v2-current/v2.1.x/贸易端/【贸易端】【SCCS设置】.md - source:thoughts-v2-current/V2.5.x/贸易端/【贸易端】【仪表盘】权限管理.md - source:thoughts-v2-current/v2.3.x/贸易端/【贸易端】【订单列表】工单导入、导出.md - source:thoughts-v2-current/V2.4.x/贸易端/【贸易端】【操作日志】所有设置类功能.md related_docs: - ../20-业务对象/FlowSpace.md - ../20-业务对象/订单.md - ../20-业务对象/工单与批复.md - ./权限体系总表.md search_keywords: - FlowSpace业务角色 - 业务管理员 - 订单权限范围 - 里程碑权限 - 导入工单 ---  # FlowSpace业务角色权限  ## 1. 功能定位  FlowSpace 业务角色用于控制主团队成员在当前 FlowSpace 内的业务操作权限和相关表单数据权限。它决定成员能否查看、创建、编辑、删除订单，能否处理里程碑和工单，以及能否配置自动化、资源库关联、仪表盘等 FlowSpace 工具能力。  ## 2. 角色模型  | 角色 | 规则 | | --- | --- | | 业务管理员 | 固定角色，拥有当前 FlowSpace 业务角色中的所有权限；不可删除，不可修改权限勾选，但可修改成员 | | 自定义业务角色 | 可配置角色名称、成员、权限点和订单权限范围 | | 成员 | 来自当前 FlowSpace 成员列表；同一成员拥有多个角色时权限叠加 |  ## 3. FlowSpace 工具权限  | 权限名称 | 控制功能 | | --- | --- | | FlowSpace 设置 | 当前 FlowSpace 的成员、协作团队、角色、数据围栏和业务设置 | | 仪表盘管理 | 查看当前 FlowSpace 所有仪表盘数据，并配置各仪表盘的可见成员 | | 自动化配置 | 配置 FlowSpace 内自动化程序 | | 关联资源库 | 配置 FlowSpace 与资源库数据的关联 |  ## 4. 订单权限  | 权限名称 | 控制功能 | | --- | --- | | 创建订单 | 订单列表创建订单 | | 导入订单 | Excel 导入订单、PDF 导入订单 | | 查看订单基本信息 | 订单列表查看订单、订单详情主表单 | | 查看跟踪记录 | 订单详情跟踪记录 | | 编辑订单 | 订单列表编辑/批量编辑、订单详情编辑 | | 修改订单状态 | 完成订单、取消订单、还原订单 | | 删除订单 | 订单列表或订单详情删除订单 | | 订单关联/取消关联 | FlowSpace 内订单关联或取消关联 | | FlowSpace 间订单关联/取消关联 | 与其他 FlowSpace 的订单关联或取消关联 | | 订单翻单/取消翻单 | 订单列表或订单详情翻单 |  ## 5. 里程碑权限  里程碑权限按不同里程碑分别控制。  | 权限名称 | 控制功能 | | --- | --- | | 查看工单 | 工单视图和订单详情查看工单 | | 查看里程碑批复 | 里程碑批复视图和订单详情查看里程碑批复 | | 创建工单 | 订单详情创建工单、订单列表或工单视图批量创建工单 | | 修改处理人 | 修改进行中的里程碑批复人、工单批复人、工单采集人 | | 删除工单 | 订单列表删除工单 | | 终止采集 | 订单详情终止工单采集 | | 修改里程碑状态 | 完成、取消、重开里程碑；批量修改里程碑状态 | | 里程碑互用/取消互用 | 将里程碑数据互用给其他订单或取消互用 | | 工单互用/取消互用 | 将工单互用给其他订单或取消互用 | | 导入工单 | 在订单列表或对应里程碑工单列表导入工单 |  ## 6. 订单权限范围  | 范围 | 说明 | | --- | --- | | 所有订单 | 不限制订单范围 | | 本人创建的订单 | 仅当前登录用户创建的订单 | | 自定义 | 通过条件限定订单范围；条件为空时表示无任何订单权限 |  自定义条件字段范围为主表单模板字段、订单创建人、订单状态等。成员控件、订单创建人、更新人可选择“当前用户”；协作方控件可选择“当前团队”。  ## 7. 勾选联动规则  - 勾选“查看订单基本信息”以下的订单权限时，必须同时勾选“查看订单基本信息”。 - 勾选任意里程碑权限时，必须同时勾选“查看订单基本信息”。 - 勾选“查看里程碑批复”时，必须同时勾选“查看工单”。 - 勾选“查看里程碑批复”之后的权限时，必须同时勾选“查看工单”和“查看里程碑批复”。 - 勾选权限后，才可设置对应行的订单权限范围。 - 当“查看订单基本信息”的订单范围为“本人创建”或“自定义”时，其余权限范围必须保持一致。  ## 8. 成员与失效  - 删除业务角色后，使用该角色的成员失去对应角色权限。 - 从 FlowSpace 删除成员后，该成员不可查看当前 FlowSpace 相关业务数据；任务中心相关工单隐藏；相关邮件和消息跳转需提示“暂无权限”。 - 从团队设置删除成员导致成员从 FlowSpace 中删除时，也需要在 FlowSpace 设置操作日志中记录删除。  ## 9. 审计要求  FlowSpace 设置操作日志需要覆盖业务角色新增、编辑、删除。运营端模板修改不记录在 FlowSpace 设置操作日志中。  ## 10. 待确认问题  - 完整业务角色权限矩阵仍依赖外部表格，建议导出为本地来源。 - 状态限制与权限点之间的优先级需要在订单、里程碑、工单细页继续补全。 - 批量交接为后期规划，需要补成员删除后的任务交接规则。  "}, {"path": "docs/40-权限与安全/README.md", "title": "README", "folder": "docs/40-权限与安全", "text": "﻿# 40 权限与安全  本目录集中维护权限、数据范围和安全边界。  当前页面：  - [权限体系总表.md](./权限体系总表.md) - [团队权限.md](./团队权限.md) - [FlowSpace业务角色权限.md](./FlowSpace业务角色权限.md) - [协作FlowSpace权限.md](./协作FlowSpace权限.md) - [数据围栏.md](./数据围栏.md) - [资源库权限.md](./资源库权限.md) - [仪表盘与报告权限.md](./仪表盘与报告权限.md)"}, {"path": "docs/40-权限与安全/仪表盘与报告权限.md", "title": "仪表盘与报告权限", "folder": "docs/40-权限与安全", "text": "﻿--- title: 仪表盘与报告权限 type: knowledge domain: 贸易端 module: 权限 submodule: 仪表盘与报告 status: authoritative version: v0.1 owner: 产品 maintainer: Daren updated_at: 2026-05-25 permission: internal tags: - 权限 - 仪表盘 - 报告 - 可见性 source_files: - source:thoughts-v2-current/V2.5.x/贸易端/【贸易端】【仪表盘】权限管理.md - source:thoughts-v2-current/V2.5.x/贸易端/【贸易端】报告权限.md related_docs: - ./团队权限.md - ./FlowSpace业务角色权限.md - ./协作FlowSpace权限.md search_keywords: - 仪表盘管理 - 仪表盘权限 - 报告权限 - 订单报告 - 工单报告 ---  # 仪表盘与报告权限  ## 1. 功能定位  仪表盘与报告权限控制分析类内容的查看、授权和入口展示。仪表盘偏向 FlowSpace 内统计分析页面，报告偏向订单、里程碑、工单报告页面。  ## 2. 仪表盘管理权限  | 来源 | 权限效果 | | --- | --- | | 团队角色：内部 FlowSpace 管理 | 可查看本团队创建的所有内部 FlowSpace 仪表盘数据，并可对这些仪表盘授权 | | FlowSpace 业务角色：仪表盘管理 | 可查看当前 FlowSpace 所有仪表盘数据，并可对这些仪表盘授权 |  有团队角色“内部 FlowSpace 管理”或当前 FlowSpace 业务角色“仪表盘管理”的用户，可以配置当前 FlowSpace 仪表盘权限。  ## 3. 单个仪表盘权限配置  配置弹窗列出已添加到当前 FlowSpace 的内部成员和协作团队成员。  | 配置项 | 规则 | | --- | --- | | 模糊搜索 | 同时搜索内部成员姓名、协作团队名称、协作成员姓名 | | 内部成员 | 未注册成员也可以授权 | | 协作团队成员 | 两级下钻选择成员，未注册成员也可以授权 | | 已选 | 显示已选计数；左右列表选中状态需要同步 | | 协作标识 | 协作成员头像需要增加协作标识 | | 权限校验 | 当前用户无仪表盘管理权限时，提示暂无权限 |  当某个成员在授权后被移出 FlowSpace，对应仪表盘权限列表也需要删除该成员；重新加入后需重新授权。  ## 4. 仪表盘权限汇总  仪表盘分组下可查看当前 FlowSpace 所有仪表盘权限分布。有仪表盘管理权限的成员可见。  汇总展示：  - 可管理成员：当前 FlowSpace 拥有仪表盘配置权限的成员，包括团队角色和 FlowSpace 角色有权限成员。 - 各仪表盘内部可见成员。 - 各仪表盘协作团队可见成员。 - 协作团队成员按协作团队名称分组展示。  ## 5. 仪表盘查看  - 可以管理当前 FlowSpace 仪表盘的用户，可查看当前 FlowSpace 所有仪表盘数据。 - 被授权部分仪表盘查看权限的成员、协作团队成员，只能查看被授权仪表盘数据。 - 可查看仪表盘均可星标，星标后在工作台常用视图展示。 - 仪表盘权限被取消后，常用视图同步隐藏；重新授权后如需展示，需要重新星标。  ## 6. 报告类型  | 报告 | 入口规则 | | --- | --- | | 订单报告 | 有一个报告时展示“查看报告”；多个报告时下拉多个报告名称 | | 里程碑报告 | 同上 | | 工单报告 | 同上 |  报告查看页支持打印。前端有相关报告权限才展示按钮，点击按钮后仍需再次判断权限；无权限提示暂无权限。  ## 7. 报告权限矩阵  | 角色或身份 | 订单报告 | 里程碑报告 | 工单报告 | | --- | --- | --- | --- | | 团队角色：内部 FlowSpace 管理 | 可看 | 可看 | 可看 | | FlowSpace 角色：查看订单报告 | FlowSpace 内可看 | 不适用 | 不适用 | | FlowSpace 角色：查看里程碑报告 | 不适用 | FlowSpace 内可看 | 不适用 | | FlowSpace 角色：查看工单报告 | 不适用 | 不适用 | FlowSpace 内可看 | | 里程碑批复人 | 不适用 | 参与里程碑批复的里程碑可看 | 参与里程碑批复的工单可看 | | 工单批复人 | 不适用 | 不适用 | 参与批复工单可看 | | 工单采集人 | 不适用 | 不适用 | 参与采集工单可看 | | 协作团队：里程碑批复指派 | 不适用 | 本团队参与里程碑批复的里程碑可看 | 本团队参与里程碑批复的工单可看 | | 协作团队：工单批复指派 | 不适用 | 不适用 | 本团队参与工单批复的工单可看 | | 协作团队：工单采集指派 | 不适用 | 不适用 | 本团队参与工单采集的工单可看 |  ## 8. 待确认问题  - 报告权限中的“查看订单报告/里程碑报告/工单报告”是否已在当前 FlowSpace 业务角色和协作方角色页面完整配置，需要补来源。 - 仪表盘查看是否受数据围栏影响，需要与实际统计口径核对。 - 仪表盘和报告的操作日志是否有独立记录需求，当前资料未完整覆盖。  "}, {"path": "docs/40-权限与安全/协作FlowSpace权限.md", "title": "协作FlowSpace权限", "folder": "docs/40-权限与安全", "text": "﻿--- title: 协作FlowSpace权限 type: knowledge domain: 贸易端 module: 权限 submodule: 协作FlowSpace status: authoritative version: v0.1 owner: 产品 maintainer: Daren updated_at: 2026-05-25 permission: internal tags: - 权限 - 协作FlowSpace - 协作方角色 - 对接人 source_files: - source:thoughts-v2-current/v2.1.x/贸易端/【贸易端】【SCCS设置】.md - source:thoughts-v2-current/v2.1.x/贸易端/【贸易端】【协作SCCS设置】.md - source:thoughts-v2-current/V2.4.x/贸易端/【贸易端】【操作日志】所有设置类功能.md related_docs: - ../20-业务对象/团队与协作团队.md - ../30-业务流程/跨团队协作.md - ./权限体系总表.md search_keywords: - 协作FlowSpace - 协作方角色 - 对接人 - 工单采集指派 - 里程碑批复指派 ---  # 协作FlowSpace权限  ## 1. 功能定位  协作 FlowSpace 权限控制外部协作团队成员在链主方 FlowSpace 中能看什么、能处理什么、能否指派协作任务。它由链主方在 FlowSpace 设置中授予协作团队角色和协作里程碑，再由协作团队在协作 FlowSpace 设置中分配具体成员。  ## 2. 权限来源  | 来源 | 说明 | | --- | --- | | 链主方 FlowSpace 协作方角色 | 链主方创建，选择协作团队并配置订单、里程碑、工单相关权限 | | 协作团队自建角色 | 协作团队在协作 FlowSpace 设置中自建，控制本团队成员对协作任务的查看和指派 | | 对接人角色 | 协作团队固定角色，可管理角色和成员，并可指派所有协作任务 | | 主团队角色 | 链主方创建并开放给当前协作团队的角色，协作团队只能编辑成员，不能改权限点 |  ## 3. 链主方配置规则  链主方在 FlowSpace 设置中添加协作团队时，可配置：  - 协作方角色。 - 数据围栏。 - 协作的里程碑。  添加协作团队到 FlowSpace 时，协作团队拥有者默认成为该 FlowSpace 的对接人。链主方删除协作团队后，该协作团队所有成员在当前 FlowSpace 相关业务数据不可查看，任务中心相关工单隐藏，相关邮件和消息跳转提示暂无权限。  ## 4. 协作团队角色权限点  | 权限分类 | 权限名称 | 控制功能 | | --- | --- | --- | | FlowSpace 工具权限 | FlowSpace 设置 | 当前协作 FlowSpace 的设置权限 | | 订单权限 | 查看订单基本信息 | 订单列表查看订单、订单详情主表单 | | 里程碑权限 | 查看工单 | 工单视图和订单详情查看工单 | | 里程碑权限 | 查看里程碑批复 | 里程碑批复视图和订单详情查看里程碑批复 | | 里程碑权限 | 工单采集/指派 | 指派或修改本团队工单采集成员，也可处理相关采集任务 | | 里程碑权限 | 工单批复/指派 | 指派或修改本团队工单批复成员，也可处理相关批复任务 | | 里程碑权限 | 里程碑批复/指派 | 指派或修改本团队里程碑批复成员，也可处理相关批复任务 |  ## 5. 订单范围  | 范围 | 说明 | | --- | --- | | 所有参与协作的订单 | 当前协作团队作为工单采集人、工单批复人、里程碑批复人的订单 | | 自定义 | 在本团队参与的所有订单基础上，再按主表单字段设置限制条件 |  协作方自定义订单范围是在“参与协作订单”的基础上收窄，不是跨越链主方授权范围的扩权。  ## 6. 勾选联动规则  - 勾选工单采集/指派、工单批复/指派时，需要同时勾选查看工单。 - 勾选里程碑批复/指派时，需要同时勾选查看里程碑批复。 - 勾选查看里程碑批复时，需要同时勾选查看工单。 - 勾选任意里程碑权限时，需要同时勾选查看订单基本信息。 - 自定义订单范围权限跟随查看订单基本信息。  ## 7. 消息通知设置  协作团队自建角色中，里程碑任务指派权限旁可设置“对接人不再接收此类消息通知”。打开时，如果当前里程碑对应权限尚无其他角色勾选，需要提醒：暂未设置其他成员接收该类消息，打开后可能无法及时通知。  ## 8. 成员管理规则  - 协作 FlowSpace 成员来自已成功加入本团队的成员。 - 添加成员时可设置角色，多选且非必填。 - 删除最后一名对接人时不可删除，提示至少保留一名对接人。 - 删除成员后，该成员当前 FlowSpace 相关业务数据不可查看；任务中心相关工单隐藏；相关邮件、消息跳转提示暂无权限。  ## 9. 审计要求  协作 FlowSpace 设置操作日志需要记录：  - 自建角色新增、编辑、删除。 - 主团队角色编辑，仅记录成员编辑。 - 成员管理新增、删除、设置权限。  主团队修改或删除协作方角色，不记录在协作方 FlowSpace 的操作日志中。  ## 10. 待确认问题  - “对接人”“有指派权限成员”“任务实际处理人”在所有通知和任务列表中的边界需要继续校验。 - 链主方删除协作里程碑权限时，协作团队历史任务和历史记录是否保留完整可见，需要补规则。  "}, {"path": "docs/40-权限与安全/团队权限.md", "title": "团队权限", "folder": "docs/40-权限与安全", "text": "﻿--- title: 团队权限 type: knowledge domain: 贸易端 module: 权限 submodule: 团队权限 status: authoritative version: v0.1 owner: 产品 maintainer: Daren updated_at: 2026-05-25 permission: internal tags: - 权限 - 团队 - 团队角色 - 协作团队 source_files: - source:thoughts-v2-current/v2.0.x/贸易端/【贸易端】【团队设置】团队信息、角色、成员、协作团队管理.md - source:thoughts-v2-current/v2.1.x/贸易端/【贸易端】【团队设置】邀请成 员_协作团队流程变更.md - source:thoughts-v2-current/V2.4.x/贸易端/【贸易端】【操作日志】所有设置类功能.md related_docs: - ../20-业务对象/团队与协作团队.md - ./权限体系总表.md search_keywords: - 团队设置 - 团队角色 - 拥有者 - 团队管理员 - 协作团队 ---  # 团队权限  ## 1. 功能定位  团队权限控制贸易端团队级配置和团队级资源入口，包括团队设置、团队成员、团队角色、协作团队、创建 FlowSpace、FlowSpace 分组、资源库创建与删除等能力。团队权限是 FlowSpace、资源库、仪表盘等后续权限的上层入口。  ## 2. 权限主体  | 主体 | 说明 | | --- | --- | | 拥有者 | 固定角色，有且只有一名成员，默认为团队创建人，可在团队基本信息中移交，拥有团队角色内所有权限 | | 团队管理员 | 固定角色，拥有团队角色内所有权限；不可删除，不可修改权限勾选，但可修改成员 | | 自定义团队角色 | 团队内自定义角色，可配置成员和权限点 | | 团队成员 | 加入或被邀请加入团队的账号，可同时拥有多个团队角色，权限叠加 | | 协作团队 | 与当前团队建立协作关系的外部团队，可加入本团队创建的 FlowSpace 或资源库协作链路 |  ## 3. 团队角色权限点  | 权限分类 | 权限名称 | 控制范围 | | --- | --- | --- | | 团队管理 | 团队设置 | 团队设置页面、邀请成员快捷入口、团队角色、团队成员、协作团队管理 | | FlowSpace 管理 | 创建 FlowSpace | 工作台创建 FlowSpace | | FlowSpace 管理 | 内部 FlowSpace 管理 | 查看和管理本团队创建的 FlowSpace 内订单、工单、仪表盘等全部数据；可配置 FlowSpace 设置、自动化、关联资源库、仪表盘权限 | | FlowSpace 管理 | 协作 FlowSpace 设置 | 查看协作 FlowSpace 内本团队权限范围内的数据；可管理协作 FlowSpace 设置 | | FlowSpace 管理 | FlowSpace 分组 | 工作台 FlowSpace 分组管理 | | 资源库管理 | 创建资源库 | 在当前团队下创建资源库 | | 资源库管理 | 删除资源库 | 删除本团队下资源库，并可查看所有资源库数据 | | 资源库管理 | 资源库设置 | 查看本团队资源库所有数据，管理资源库设置 | | 资源库管理 | 协作资源库管理 | 管理本团队参与协作的资源库设置和主团队授权的数据操作权限 |  ## 4. 成员管理规则  | 操作 | 规则 | | --- | --- | | 邀请成员 | 输入邮箱并设置团队角色；成员可为未注册账号；后续流程变更后，被邀请邮箱可立即成为团队成员 | | 设置成员角色 | 可为成员设置多个团队角色；与团队角色列表数据双向同步 | | 删除成员 | 成员从团队移除，同时从参与的 FlowSpace 中同步删除 | | 重新邀请 | 未注册或未加入成员可重新发送邀请邮件 | | 拥有者限制 | 拥有者不可删除，也无需设置团队角色 |  删除成员时，如果该成员是某些协作 FlowSpace 的唯一对接人，需要先设置其他对接人后再删除。被删除成员当前若仍在该团队上下文内，请求时应跳转到剩余团队选择页或首次创建团队引导页，并提示已被移出团队。  ## 5. 协作团队管理规则  | 操作 | 规则 | | --- | --- | | 邀请协作团队 | 通过团队码识别对方团队；后续流程变更后，邀请团队后协作团队即加入当前团队作为协作方 | | 协作团队列表 | 展示我邀请的团队、邀请我的团队、参与的 FlowSpace 等信息 | | 删除协作团队 | 协作团队从团队中移除，同时从参与的 FlowSpace 中同步删除 | | 邀请失效 | 协作团队被删除后，未处理的邮件链接失效 |  ## 6. 权限叠加与失效  - 同一成员可以拥有多个团队角色，权限按并集叠加。 - 删除角色后，使用该角色的成员失去对应角色权限。 - 从团队删除成员，会同步影响 FlowSpace 成员、任务中心、消息跳转和相关可见数据。 - 从团队删除协作团队，会同步影响 FlowSpace 协作团队、协作任务和相关可见数据。  ## 7. 审计要求  团队设置操作日志需要覆盖：  - 团队角色新增、编辑、删除。 - 成员管理新增、删除、设置权限。 - 协作团队管理新增、删除。  在角色中修改成员，仅记录在角色操作中；在成员中修改权限，仅记录在成员操作中。  ## 8. 待确认问题  - 团队角色完整权限矩阵仍依赖外部钉钉表格，建议导出为本地来源文件。 - 删除团队成员后的任务批量交接仍为后期规划，需要补充正式规则。 - 协作团队加入流程已发生优化，历史“接受/拒绝”流程是否仍在部分场景保留，需要与线上核对。  "}, {"path": "docs/40-权限与安全/数据围栏.md", "title": "数据围栏", "folder": "docs/40-权限与安全", "text": "﻿--- title: 数据围栏 type: knowledge domain: 贸易端 module: 权限 submodule: 数据围栏 status: authoritative version: v0.1 owner: 产品 maintainer: Daren updated_at: 2026-05-25 permission: internal tags: - 权限 - 数据围栏 - 字段可见性 - 标签 source_files: - source:thoughts-v2-current/v2.1.x/贸易端/【贸易端】【SCCS设置】.md - source:thoughts-v2-current/v2.1.x/贸易端/【贸易端】【团队设置】邀请成 员_协作团队流程变更.md - source:thoughts-v2-current/V2.4.x/贸易端/【贸易端】【操作日志】所有设置类功能.md related_docs: - ../20-业务对象/FlowSpace.md - ./FlowSpace业务角色权限.md - ./协作FlowSpace权限.md search_keywords: - 数据围栏 - 字段限制 - 不可查看 - 标签可见 ---  # 数据围栏  ## 1. 功能定位  数据围栏用于限制 FlowSpace 内成员或协作团队不可查看部分订单主表单字段、订单标签或里程碑标签。它控制“看得见什么”，不直接等同于“能不能操作”。  ## 2. 适用对象  | 对象 | 规则 | | --- | --- | | FlowSpace 成员 | 可作为限制成员加入数据围栏 | | 协作团队 | 可作为限制协作团队加入数据围栏，限制作用于该团队下所有成员 | | 未注册成员 | 如果已在成员列表或相关权限列表中出现，需要展示未注册标识 |  ## 3. 可限制内容  | 内容 | 说明 | | --- | --- | | 订单标签 | FlowSpace 标签设置中配置的订单标签字段 | | 里程碑标签 | FlowSpace 标签设置中配置的里程碑标签字段 | | 主表单字段 | 按实际查看订单的布局展示主表单所有字段，可按模块分组全选 |  勾选“不可查看”的字段后，相关成员和协作团队成员在查看主表单数据时需要隐藏对应字段。  ## 4. 管理规则  | 操作 | 规则 | | --- | --- | | 创建/编辑数据围栏 | 名称必填，限制 100 字符；可选择限制成员、限制协作团队，并设置不可查看字段 | | 查询数据围栏 | 支持按名称、限制成员、限制协作团队筛选 | | 删除数据围栏 | 对应成员和协作团队取消字段查看限制 | | 数据双向同步 | 成员或协作团队中的数据围栏设置，与数据围栏列表同步 |  ## 5. 与业务角色的关系  - 业务角色决定是否有查看订单、工单、里程碑等对象的权限。 - 数据围栏在对象可见基础上进一步隐藏字段或标签。 - 如果成员没有对象查看权限，数据围栏不会让其获得查看权限。 - 如果成员有对象查看权限，但命中数据围栏，则对应字段仍不可见。  ## 6. 与标签设置的关系  删除标签后：  - 订单列表和工单列表不再展示该标签字段，包括字段和查询条件。 - 订单详情不再展示该标签字段。 - 数据围栏中不再展示该标签字段。  ## 7. 审计要求  FlowSpace 设置操作日志需要记录数据围栏新增、编辑、删除。运营端模板修改不记录在 FlowSpace 设置操作日志中。  ## 8. 待确认问题  - 数据围栏是否影响历史记录、动态、跟踪记录中的字段展示。 - 数据围栏命中时，导出、报告、仪表盘是否同样隐藏字段。 - 多个数据围栏同时作用于同一成员时，是否按不可见字段并集处理，需与线上规则核对。  "}, {"path": "docs/40-权限与安全/权限体系总表.md", "title": "权限体系总表", "folder": "docs/40-权限与安全", "text": "﻿--- title: 权限体系总表 type: knowledge domain: 公共能力 module: 权限 submodule: 总表 status: authoritative version: v0.1 owner: 产品 maintainer: Daren updated_at: 2026-05-25 permission: internal tags: - 权限 - 角色 - 数据围栏 - 协作团队 source_files: - source:thoughts-v2-current/v2.0.x/贸易端/【贸易端】【团队设置】团队信息、角色、成员、协作团队管理.md - source:thoughts-v2-current/v2.1.x/贸易端/【贸易端】【SCCS设置】.md - source:thoughts-v2-current/v2.1.x/贸易端/【贸易端】【协作SCCS设置】.md - source:thoughts-v2-current/V2.4.x/贸易端/【贸易端】【资源库】第一阶段.md - source:thoughts-v2-current/V2.5.x/贸易端/【贸易端】【仪表盘】权限管理.md - source:thoughts-v2-current/V2.5.x/贸易端/【贸易端】报告权限.md related_docs: - ../20-业务对象/FlowSpace.md - ../20-业务对象/订单.md - ../20-业务对象/工单与批复.md - ../20-业务对象/资源库.md search_keywords: - 团队角色 - FlowSpace业务角色 - 协作方角色 - 数据围栏 - 资源库权限 ---  # 权限体系总表  ## 1. 功能定位  权限体系用于控制用户在 Linkincrease 中“能否看到、能否进入、能否操作、能否管理、能否导出或分享”。权限不能只按页面入口判断，还必须结合业务对象状态、成员关系、数据围栏和服务端校验。  ## 2. 权限分层  flowchart TD A[\"账号身份\"] --> B[\"团队成员身份\"] B --> C[\"团队角色\"] B --> D[\"FlowSpace成员身份\"] D --> E[\"FlowSpace业务角色\"] D --> F[\"数据围栏\"] B --> G[\"协作团队关系\"] G --> H[\"协作FlowSpace角色\"] B --> I[\"资源库角色\"] E --> J[\"业务操作权限\"] F --> K[\"数据可见范围\"] H --> J I --> L[\"资源库操作权限\"]  ## 3. 权限域总表  | 权限域 | 控制对象 | 典型权限点 | 主要来源 | | --- | --- | --- | --- | | 账号权限 | 登录、个人信息、语言、退出 | 登录、修改密码、查看个人信息 | 账号、个人中心需求 | | 团队权限 | 团队信息、成员、角色、协作团队、资源库入口 | 邀请成员、删除成员、设置角色、邀请协作团队、创建资源库 | 团队设置、资源库需求 | | FlowSpace 业务权限 | 订单、里程碑、工单、批复、自动化、仪表盘 | 查看、创建、编辑、删除、状态修改、指派、采集、批复、互用、导入导出 | FlowSpace 设置、订单详情需求 | | 协作 FlowSpace 权限 | 协作团队成员在 FlowSpace 内的业务操作 | 指派、采集、批复、查看、修改处理人 | 协作 FlowSpace 设置、工单批复需求 | | 数据围栏 | 字段、标签、订单、里程碑、工单数据范围 | 可见范围控制 | FlowSpace 设置需求 | | 资源库权限 | 资源库设置、表数据、分享、导入导出 | 查看、创建、编辑、删除、导入、导出、批量操作、分享 | 资源库需求 | | 仪表盘权限 | FlowSpace 仪表盘 | 查看、管理、汇总查看 | 仪表盘权限需求 | | 报告权限 | 报告 | 查看、管理 | 报告权限需求 | | 运营端权限 | 平台用户、团队、FlowSpace、资源库、模板、软件管理 | 平台级查看、配置、监管 | 运营端需求 |  ## 4. 通用判断模型  入口是否展示 = 用户身份 + 所属团队 / FlowSpace / 协作团队关系 + 角色权限 + 对象状态 + 数据围栏或数据范围  提交是否成功 = 服务端权限校验 + 对象是否存在 + 对象状态是否允许 + 数据版本是否最新 + 表单字段是否通过校验  ## 5. 角色与权限关系  | 角色类型 | 所属层级 | 说明 | | --- | --- | --- | | 团队角色 | 团队 | 控制团队设置、团队成员、协作团队、资源库等团队级能力 | | FlowSpace 业务角色 | FlowSpace | 控制主团队成员在当前 FlowSpace 内的订单、里程碑、工单等能力 | | 协作方角色 | 协作 FlowSpace | 控制协作团队成员在当前 FlowSpace 内的业务能力 | | 资源库角色 | 资源库 | 控制资源库设置和表数据操作 | | 运营端角色 | 平台后台 | 控制运营端平台管理能力，当前资料未完整沉淀角色模型 |  ## 6. 数据围栏  数据围栏负责控制“看得见什么”，不等同于“能不能操作”。  需要沉淀的范围：  - 订单字段可见性。 - 里程碑字段和标签可见性。 - 工单表单字段可见性。 - 订单详情左侧树展示范围。 - 标签展示范围。 - 历史记录、动态、跟踪记录是否受围栏影响。  ## 7. 状态限制  权限存在不代表一定可操作，状态会进一步限制入口。  典型限制：  - 订单已完成或已取消时，订单编辑、工单采集、批复、指派等动作受限。 - 里程碑已完成或已取消时，创建工单、采集、批复、互用等动作受限。 - 工单已终止采集或已批复时，采集动作受限。 - 资源库或资源库数据删除后，新业务不可继续引用。  ## 8. 通知、日志与审计  权限相关变更必须可追溯：  - 团队角色变更。 - 团队成员邀请、删除、角色设置。 - 协作团队邀请、删除。 - FlowSpace 业务角色变更。 - FlowSpace 成员和协作团队权限变更。 - 资源库角色和成员变更。 - 数据围栏变更。 - 仪表盘和报告权限变更。  ## 9. 待拆细页  - 团队权限。 - FlowSpace 业务角色权限。 - 协作 FlowSpace 权限。 - 数据围栏。 - 资源库权限。 - 仪表盘权限。 - 报告权限。  ## 10. 来源需求  - `source:thoughts-v2-current/v2.0.x/贸易端/【贸易端】【团队设置】团队信息、角色、成员、协作团队管理.md` - `source:thoughts-v2-current/v2.1.x/贸易端/【贸易端】【团队设置】邀请成 员_协作团队流程变更.md` - `source:thoughts-v2-current/v2.1.x/贸易端/【贸易端】【SCCS设置】.md` - `source:thoughts-v2-current/v2.1.x/贸易端/【贸易端】【协作SCCS设置】.md` - `source:thoughts-v2-current/v2.2.x/贸易端/【贸易端】【订单详情】工单&里程碑批复操作.md` - `source:thoughts-v2-current/V2.4.x/贸易端/【贸易端】【资源库】第一阶段.md` - `source:thoughts-v2-current/V2.5.x/贸易端/【贸易端】【仪表盘】权限管理.md` - `source:thoughts-v2-current/V2.5.x/贸易端/【贸易端】报告权限.md`  ## 11. 待确认问题  - 各端是否存在统一的权限矩阵表，可导出为本地来源。 - 数据围栏是否影响历史记录、动态、跟踪记录中的字段展示。 - 协作团队负责人、对接人、有指派权限成员的边界是否完全一致。 "}, {"path": "docs/40-权限与安全/资源库权限.md", "title": "资源库权限", "folder": "docs/40-权限与安全", "text": "﻿--- title: 资源库权限 type: knowledge domain: 贸易端 module: 权限 submodule: 资源库权限 status: authoritative version: v0.1 owner: 产品 maintainer: Daren updated_at: 2026-05-25 permission: internal tags: - 权限 - 资源库 - 协作资源库 - 分享 source_files: - source:thoughts-v2-current/V2.4.x/贸易端/【贸易端】【资源库】第一阶段.md - source:thoughts-v2-current/V2.5.x/贸易端/【贸易端】【资源库】资源库分享.md - source:thoughts-v2-current/v2.7/贸易端/【贸易端】【资源库】SCCS应用数据范围、数据编辑历史记录.md - source:thoughts-v2-current/V2.4.x/贸易端/【贸易端】【操作日志】所有设置类功能.md related_docs: - ../20-业务对象/资源库.md - ../30-业务流程/资源库引用与同步.md - ./团队权限.md search_keywords: - 资源库权限 - 资源库管理员 - 协作资源库 - 数据权限范围 - 分享链接 ---  # 资源库权限  ## 1. 功能定位  资源库权限控制团队资源库的创建、删除、设置、表数据查看、创建、编辑、删除、导入、导出、分享，以及协作团队对资源库数据的访问和操作范围。  ## 2. 团队级入口权限  | 权限 | 说明 | | --- | --- | | 创建资源库 | 允许成员在当前团队下创建资源库 | | 删除资源库 | 允许成员删除本团队下任意资源库，并可查看所有资源库数据 | | 资源库设置 | 允许成员查看本团队资源库所有数据，并管理资源库设置 | | 协作资源库管理 | 允许成员管理本团队参与协作的资源库设置，以及主团队授权的数据操作权限 |  ## 3. 单个资源库角色  | 角色 | 规则 | | --- | --- | | 资源库管理员 | 每个资源库固定角色，拥有当前资源库所有权限；默认创建资源库的成员为管理员；不可删除，不可修改权限点，但可修改成员 | | 成员角色 | 面向本团队成员，可配置资源库设置和各表权限 | | 协作方角色 | 面向协作团队，权限类似成员角色，但没有资源库设置权限 |  任意资源库中任意角色添加了成员后，该成员即可见资源库主菜单；具体可见哪个资源库、哪些表、哪些数据，继续由角色勾选内容决定。  ## 4. 表权限与数据范围  | 维度 | 规则 | | --- | --- | | 表权限 | 资源库下每张表单独配置权限；勾选任意表操作权限时，需同时勾选该表“查看数据” | | 全部 | 可操作对应表下所有数据 | | 本人创建 | 仅可操作成员本人创建的数据 | | 自定义 | 必须配置字段条件；字段范围包括模板字段、创建人、创建时间、更新人、更新时间等 |  成员控件、创建人、更新人可选择“当前用户”；协作方控件可选择“当前团队”。  ## 5. 数据操作权限  | 操作 | 权限要求 | | --- | --- | | 查看数据 | 需拥有当前表查看权限和对应数据范围 | | 创建数据 | 需拥有当前表新增权限 | | 编辑数据 | 需拥有当前表编辑权限；批量编辑按钮也受此权限控制 | | 删除数据 | 需拥有当前表删除权限 | | 导入数据 | 当前用户在当前资源表需有导入权限 | | 导出数据 | 仅导出当前用户有查看权限的表和数据 | | 批量下载文件 | 所有可进入当前资源表的成员可见 |  导入记录仅能查看本人导入的记录。资源库数据导入成功后，需要增加导入人操作的新增或修改历史记录。  ## 6. 协作资源库  主团队授权后，协作团队资源库列表会展示协作类型资源库，并只展示授权给本团队且有查看权限的表。协作资源库设置包含成员管理，可添加当前团队成员并设置角色。  | 协作角色 | 说明 | | --- | --- | | 资源库管理员 | 拥有当前协作资源库设置权限，以及主团队授权给本团队的所有表内相关权限 | | 普通成员 | 拥有当前资源库中主团队授权给本团队的所有表内相关权限 |  同一协作团队拥有多个角色时，权限叠加。  ## 7. 分享权限  | 分享类型 | 规则 | | --- | --- | | 单条数据分享 | 内部成员或协作团队成员只要有数据查看权限，即可分享单条数据 | | 整表分享 | 有资源表查看权限即可分享整表 | | 分享权限同步 | 分享者权限变更后，被分享方权限同步更新 | | 分享失效 | 分享者失去查看权限时，分享链接失效；重新获得权限后原链接仍失效，需重新分享 | | 分享链接管理 | 管理员可查看权限范围内所有分享链接；成员个人只可查看本人分享链接 |  分享链接删除后失效。预览、删除、编辑提交时均需校验权限。  ## 8. 与 FlowSpace 引用的关系  资源库被 FlowSpace 引用后，数据权限和同步规则会影响订单数据。若资源库协作授权导致数据不可见，当前需求暂按“资源库数据被删除”逻辑同步清空 FlowSpace 订单字段处理，但该方案仍需作为重点确认项保留。  ## 9. 审计要求  资源库设置操作日志需要记录：  - 基本信息新增、编辑。 - 权限管理新增、编辑、删除。  运营端模板修改不记录在资源库设置操作日志中。  ## 10. 待确认问题  - 协作资源库数据不可见时，历史引用数据保留还是同步清空，目前需求中存在方案说明，需与线上规则确认。 - 外部分享只读开关、分享者编辑权限、被分享者编辑权限之间的最终优先级需补充矩阵。 - 导出是否严格按数据范围过滤字段和记录，需要后续用线上验证。  "}, {"path": "docs/50-模板表单与数据/PDF与批量导入导出.md", "title": "PDF与批量导入导出", "folder": "docs/50-模板表单与数据", "text": "﻿--- title: PDF与批量导入导出 type: knowledge domain: 贸易端 module: 模板表单与数据 submodule: 导入导出 status: authoritative version: v0.1 owner: 产品 maintainer: Daren updated_at: 2026-05-25 permission: internal tags: - 导入 - 导出 - PDF - Excel source_files: - source:thoughts-v2-current/v2.0.x/运营端/【运营端】【模板中心】业务模版管理.md - source:thoughts-v2-current/v2.3.x/贸易端/【贸易端】【订单列表】订单导入、订单导出.md - source:thoughts-v2-current/v2.3.x/贸易端/【贸易端】【订单列表】工单导入、导出.md - source:thoughts-v2-current/V2.4.x/贸易端/【贸易端】【资源库】第一阶段.md related_docs: - ../20-业务对象/订单.md - ../20-业务对象/工单与批复.md - ../20-业务对象/资源库.md - ./表单设计组件.md search_keywords: - Excel导入 - PDF导入 - 订单导入 - 工单导入 - 资源库导入 ---  # PDF与批量导入导出  ## 1. 功能定位  批量导入导出用于将订单、工单、资源库数据与本地 Excel、CSV、PDF 文件流转。导入导出必须同时遵守模板字段配置、组件校验、权限、数据围栏、对象状态、历史记录和进程中心规则。  ## 2. 业务模板中的 PDF 导入设置  业务模板可配置 PDF 导入：  - PDF 导入开关默认关闭。 - 当前暂支持指定 PDF 模板。 - 可配置 PDF 附件是否导入到主表单附件字段。 - 贸易端支持上传多份 PDF 文件导入。 - 模板发布和同步至 FlowSpace 时，PDF 导入设置也属于同步内容。  ## 3. 订单 Excel 导入  | 步骤 | 规则 | | --- | --- | | 上传文件 | 支持 `.xls`、`.xlsx`、`.csv`；拖拽不支持格式时提示 | | 导入设置 | 选择工作表、匹配系统字段、设置过滤重复字段、字段格式、日期格式 | | 导入数据 | 分为新增和覆盖；覆盖可选覆盖整行或覆盖有值 | | 执行导入 | 在进程中心显示导入任务，完成后提示成功或失败 | | 导入记录 | 仅能查看本人导入记录，下载文件增加导入执行结果 |  订单导入支持 999 行订单数。订单 ID、成员邮箱、地址不区分大小写，其余控件区分大小写。  ## 4. 订单 PDF 导入  PDF 导入与 Excel 导入主要差异：  - 仅支持 `.pdf` 文件，可上传多份。 - 无需选择工作表。 - 导入文件字段展示运营端配置需导入的字段。 - 无需手动匹配系统字段。 - 过滤重复数据设置与 Excel 分别记忆。 - 识别多份 PDF 的订单数据后，归类为新增或覆盖，后续操作同 Excel 导入。  ## 5. 工单导入  | 规则 | 说明 | | --- | --- | | 权限入口 | 有任意里程碑导入权限的用户可见工单导入按钮 | | 里程碑选择 | 只能选择当前用户有工单导入权限的里程碑 | | 模板字段 | 订单识别字段 + 工单采集字段 | | 匹配订单 | 仅在当前用户有导入工单权限的订单范围内匹配 | | 新增 | 匹配到订单的数据可作为新工单导入 | | 覆盖 | 对有采集权限的已有工单可覆盖采集部分内容 | | 未匹配 | 未匹配到订单的数据仅可查看，不可导入 |  新增工单成功后，工单采集人为导入成员；批复人默认跟随运营端配置，未配置时取导入成员。若此前未创建里程碑批复，则同步创建。  ## 6. 资源库导入导出  资源库导入支持工作表选择、字段匹配、重复数据识别、新增、覆盖整行、覆盖有值、导入记录和进程中心。导入成功后，资源库数据历史记录增加导入人操作的新增或修改记录。  资源库导出可选择导出当前资源库或当前表数据。导出当前整个资源库时，仅导出当前用户有查看权限的表。  ## 7. 导入失败与校验  常见失败原因：  - 当前用户无导入权限。 - 未设置任何新增或覆盖数据。 - 同一条数据同时设为新增和覆盖。 - 覆盖未选择目标数据。 - 多行覆盖至同一条系统数据。 - 对象已完成、已取消或已删除。 - 必填项为空。 - 控件内容不符合输入规则。 - 单选/多选内容与选项值不一致。 - 日期格式与运营端配置不符。  如果必填项正好是当前用户被数据围栏限制不可见字段，则导入时不校验该字段。  ## 8. 导出规则  订单导出范围为当前用户权限内可见的订单、里程碑批复、里程碑工单数据。  导出内容：  - 订单信息，包括订单字段和各里程碑批复字段，需排除数据围栏不可见字段。 - 里程碑工单，按里程碑分 sheet。 - 字段修改次数统计。  导出内容无字段或无数据时，不执行导出并提示没有可导出的数据。  ## 9. 待确认问题  - PDF 字段整理目前仍引用外部资料，建议导出成本地来源。 - 订单、工单、资源库导入的字段类型支持范围需要沉淀为统一矩阵。 - 数据围栏对导入、导出、记录下载的影响需要继续验证。  "}, {"path": "docs/50-模板表单与数据/README.md", "title": "50 模板表单与数据", "folder": "docs/50-模板表单与数据", "text": "# 50 模板表单与数据  本目录沉淀运营端配置与运行态表单数据规则。  当前页面：  - [表单设计组件.md](./表单设计组件.md) - [表单属性与显隐设置.md](./表单属性与显隐设置.md) - [公式函数.md](./公式函数.md) - [PDF与批量导入导出.md](./PDF与批量导入导出.md) - [第三方数据对接.md](./第三方数据对接.md) - [验货组件流程.md](./验货组件流程.md)"}, {"path": "docs/50-模板表单与数据/公式函数.md", "title": "公式函数", "folder": "docs/50-模板表单与数据", "text": "﻿--- title: 公式函数 type: knowledge domain: 公共能力 module: 模板表单与数据 submodule: 公式 status: authoritative version: v0.1 owner: 产品 maintainer: Daren updated_at: 2026-05-25 permission: internal tags: - 公式 - 函数 - 自动计算 source_files: - missing-current-source/公式函数.md - source:thoughts-v2-current/V2.4.x/贸易端/系统自动执行的相关操作日志.md related_docs: - ./表单设计组件.md - ../30-业务流程/自动化执行.md search_keywords: - 公式函数 - SUM - IF - TODAY - 自动更新 ---  # 公式函数  ## 1. 功能定位  公式函数用于表单字段的自动计算，可服务于订单、工单、批复、资源库、验货组件和统计分析。公式组件可输出数字、百分比、文本或日期等类型，并在相关因子变化后自动更新。  ## 2. 基础规则  | 规则 | 说明 | | --- | --- | | 空值定义 | `null`、`undefined`、空字符串统一视为空值 | | 布尔值 | 条件判断目前仅支持小写 `true`、`false` | | 变量来源 | 通常来自当前表单或允许引用的数据源字段 | | 子表计算 | 支持对子表数组字段进行求和、计数、条件统计和去重 |  ## 3. 函数分类  | 分类 | 函数 | | --- | --- | | 文本函数 | CONCATENATE、TEXTJOIN、LEFT、RIGHT、SEARCH | | 数学函数 | SUM、AVERAGE、MAX、MIN、CEILING、FLOOR、INT、SUMIF、SUMIFS、COUNTIF、COUNTIFS、COUNTA、UNIQUE | | 逻辑函数 | IF、IFS、AND、OR | | 时间函数 | DAYS、WORKDAY、DATEDIF、NETWORKDAYS、YEAR、MONTH、DAY、HOUR、TODAY、NOW、MINUTE、SECOND |  ## 4. 常用函数规则  | 函数 | 用途 | 空值处理 | | --- | --- | --- | | CONCATENATE | 合并多个文本 | 空值视为空字符串 | | TEXTJOIN | 按分隔符合并文本 | 可设置是否忽略空值 | | SUM | 求和 | 忽略空值 | | AVERAGE | 平均值 | 忽略空值 | | MAX/MIN | 最大/最小值 | 忽略空值 | | SUMIF/SUMIFS | 按一个或多个条件求和 | 条件区域空值忽略，求和区域空值按 0 | | COUNTIF/COUNTIFS | 条件计数 | 可专门计算空值 | | IF/IFS | 条件判断 | 条件空值按 false | | AND/OR | 逻辑判断 | 空值按 false | | DAYS/DATEDIF | 日期差 | 日期参数为空时返回错误 | | TODAY | 返回当天日期 | 用于自动更新“今天” |  ## 5. TODAY 自动更新  当公式组件内含 TODAY 函数时，贸易端展示需要每天自动更新到当天。  不更新场景：  - 订单已完成。 - 订单已取消。 - 里程碑已完成。 - 里程碑已取消。  ## 6. 自动更新与日志  公式因子发生变更后，相关公式字段需要同步更新。系统自动执行日志中需要记录公式自动更新，并在对应业务模块留下可追溯记录，例如订单跟踪记录、工单/里程碑批复动态、主表单或批复历史记录。  ## 7. 与组件的关系  - 文本、数字、百分比、日期等组件可通过公式计算默认值。 - 公式组件可被其他组件作为关联数据源。 - 公式显示类型影响显隐设置、导入校验、导出和展示格式。 - API 写入触发字段后，也会触发相关公式字段自动计算。  ## 8. 待确认问题  - NOW、MINUTE、SECOND 是否已正式上线，原始资料中部分标注为后期考虑。 - 公式错误值如何在贸易端、导出、报告中展示，需要补统一规则。 - 公式自动更新失败是否需要重试、告警或单独日志页。   "}, {"path": "docs/50-模板表单与数据/第三方数据对接.md", "title": "第三方数据对接", "folder": "docs/50-模板表单与数据", "text": "﻿--- title: 第三方数据对接 type: knowledge domain: 运营端 module: 模板表单与数据 submodule: 第三方数据 status: authoritative version: v0.1 owner: 产品 maintainer: Daren updated_at: 2026-05-25 permission: internal tags: - 第三方数据 - API - 数据映射 - SCMPro source_files: - source:thoughts-v2-current/v2.3.x/运营端/【运营端】【模板设计】里程碑增加第三方数据对接.md - source:thoughts-v2-current/V2.5.x/运营端/【运营端】【SCCS管理】SCCS列表增加外部api集成配置.md related_docs: - ./表单设计组件.md - ./公式函数.md - ../30-业务流程/自动化执行.md search_keywords: - 第三方数据 - API集成 - 字段匹配 - JSONPath - SCMPro ---  # 第三方数据对接  ## 1. 功能定位  第三方数据对接用于把外部系统数据引入 Linkincrease，减少手动录入并保持数据一致。当前资料覆盖两类能力：模板内表单级 API 引用，以及运营端 FlowSpace 级外部 API 集成配置。  ## 2. 表单级 API 引用  表单级 API 引用主要配置在业务模板的里程碑属性中，可分别针对工单、工单批复、里程碑批复设置引用能力。  | 配置项 | 规则 | | --- | --- | | 是否启用 | 默认禁用 | | 按钮名称 | 非必填，默认“数据引用”，限制 20 字符，需国际化 | | URL | 接口地址 | | 请求方式 | 默认 POST | | Result Format | 默认 JSON | | 请求配置 | 请求头等信息，可不填 | | 查询配置 | 传给服务器的查询、过滤、排序、分页等参数 | | 字段匹配 | 接口字段与模板字段映射；模板字段不可重复配置 | | 贸易端白名单 | 控制哪些团队可使用数据引用 |  如果已匹配字段在模板变更后被删除，贸易端和运营端不展示对应字段。  ## 3. 自动引用与定期更新  | 能力 | 规则 | | --- | --- | | 自动引用 | 启用后，用户填写已匹配的触发字段时自动查询并引用 API 数据 | | 多条匹配 | 可选择不引用、引用最新更新、引用最后创建、引用最早创建 | | 引用时机 | 工单初次发起、工单批复初次批复、里程碑初次批复 | | 定期更新 | 开启后，根据自动引用字段内的数据定期更新相关数据 |  可更新状态：  - 工单：里程碑进行中、未被工单批复、未终止，排除互用自的工单。 - 工单批复：里程碑进行中，排除互用自的工单。 - 里程碑批复：里程碑进行中。  更新后需要增加动态和历史记录。  ## 4. 贸易端引用应用  - 对应表单开启 API 配置且当前团队在白名单内，才展示引用按钮。 - 可通过弹窗搜索接口数据，选择一条数据后按字段匹配填入表单。 - 确认引入需要二次确认。 - 填入数据支持手动修改。 - 只读或隐藏字段不填入。 - 采集端任务详情若配置引用第三方数据且工单可编辑，也展示引用能力。  ## 5. FlowSpace 级外部 API 集成  FlowSpace 级外部 API 集成用于把外部系统数据直接创建或更新 Linkincrease 的订单、工单和批复。  | 配置项 | 规则 | | --- | --- | | 集成名称 | 必填 | | 来源标识 | 必填，后端配置项 | | 配置状态 | 默认开启 | | 同步更新 | 默认关闭，关闭时只允许创建新记录 | | 同步删除 | 默认关闭，关闭时外部删除标记不删除 FlowSpace 数据 | | Linkincrease 同步至外部 | 默认关闭，关闭时 Linkincrease 修改不回写 | | 冲突数据同步 | 暂定时间戳优先，仍需补充 |  集成生效后，订单和工单由外部系统创建，Linkincrease 不允许手动创建对应数据。  ## 6. 字段映射  外部 API 集成支持 JSONPath 提取深层数据。  | 映射对象 | 规则 | | --- | --- | | 主表单主键 | 必选，可配置文本、数字、百分比、日期字段 | | 主表单字段 | 支持非子表字段和子表字段配置 | | 里程碑工单 | 按里程碑数组路径映射工单字段 | | 工单批复 | 有工单批复时配置 | | 里程碑批复 | 有里程碑批复时配置 | | 采集人/批复人 | 通常通过邮箱与 FlowSpace 成员匹配，匹配失败则创建失败或后续手动修改 |  参与配置的 FlowSpace 字段不允许重复配置。配置了主键的模板字段不允许用户修改，以防数据冲突。  ## 7. 冲突与写入策略  - API 显式写入：映射配置了字段且外部数据有值时，强制写入。 - FlowSpace 默认值：外部数据无字段或值为空时，创建时可填入默认值。 - 公式/联动：API 写入触发字段后，系统自动计算相关公式字段。 - 未映射字段不可被外部 API 修改。  ## 8. 日志与追溯  外部 API 集成日志列表展示触发时间、事件类型、同步方向、数据标识、状态和详情。  业务侧需要记录：  - 订单跟踪记录：创建订单、更新订单、里程碑开始、删除工单等。 - 工单动态：创建工单、创建里程碑批复、更新工单采集、更新工单批复、更新里程碑批复等。 - 历史记录：以来源标识记录创建或编辑行为。  ## 9. 待确认问题  - 外部主键组合填写规则和后端支持范围仍待补充。 - 冲突数据同步策略除时间戳优先外，是否需要人工处理队列。 - 第三方成员与 FlowSpace 成员邮箱不一致时的异常处理需要形成正式规则。  "}, {"path": "docs/50-模板表单与数据/表单属性与显隐设置.md", "title": "表单属性与显隐设置", "folder": "docs/50-模板表单与数据", "text": "﻿--- title: 表单属性与显隐设置 type: knowledge domain: 运营端 module: 模板表单与数据 submodule: 表单属性 status: authoritative version: v0.1 owner: 产品 maintainer: Daren updated_at: 2026-05-25 permission: internal tags: - 表单 - 显隐设置 - 条件规则 source_files: - source:thoughts-v2-current/v2.1.x/运营端/【运营端】【业务模版】表单属性与显隐设置.md related_docs: - ./表单设计组件.md - ../20-业务对象/业务模板.md search_keywords: - 表单属性 - 显隐设置 - 条件设置 - 隐藏字段清空 ---  # 表单属性与显隐设置  ## 1. 功能定位  表单属性用于配置表单名称、描述和国际化；显隐设置用于根据条件动态显示或隐藏字段。显隐规则直接影响贸易端和采集端的数据录入、必填校验、导入保存和服务端数据。  ## 2. 表单属性  | 字段 | 是否必填 | 限制 | | --- | --- | --- | | 表单名称 | 必填 | 100 字符 | | 表单名称国际化 | 非必填 | 100 字符 | | 描述 | 非必填 | 200 字符 |  ## 3. 显隐设置定义  显隐设置表示：当满足某些条件时，才显示指定字段。未满足条件时，指定字段隐藏。  核心规则：  - 子表和子表内组件不可作为条件字段。 - 条件中已使用的字段，不可再作为显示指定字段。 - 不同显隐规则中的显示指定字段不可重复。 - 本表单若有子表，子表作为一个大组件参与显示字段设置。  ## 4. 可参与条件的数据源  | 当前表单 | 可参与条件的字段 | | --- | --- | | 主表单 | 主表单字段、里程碑批复字段 | | 工单表单 | 主表单字段、同一里程碑所有表单，不含工单批复表单 | | 工单批复表单 | 主表单字段、同一里程碑所有表单、本工单批复表单 | | 里程碑批复表单 | 主表单字段、本里程碑批复字段 |  里程碑所有表单指工单表单和工单批复表单。  ## 5. 条件字段类型与运算符  | 字段类型 | 运算符 | | --- | --- | | 单行文本、多行文本、单选、多选、定位 | 等于、不等于、包含、不包含、为空、不为空 | | 数字、评级、百分比 | 等于、不等于、小于等于、大于等于、为空、不为空 | | 成员 | 为空、不为空 | | 日期 | 等于、早于、晚于、在范围内、为空、不为空 | | 公式 | 根据公式显示类型使用对应运算符 |  当运算符选择“为空/不为空”时，不显示后续条件值输入。  ## 6. 条件值来源  | 来源 | 规则 | | --- | --- | | 自定义 | 根据前方字段类型展示对应输入框；选项字段可选择选项值 | | 其他字段 | 可选同类型数据源字段，但需排除当前条件中的目标字段 |  条件支持同时增加“或”和“且”。  ## 7. 贸易端应用  - 隐藏后的组件所在整行如果无其他显示内容，需要自动上移，不保留整行空白。 - 隐藏组件的数据应清空，不验证必填。 - 隐藏组件数据不保存至服务端。 - 导入时，显隐判断为隐藏的字段即使有导入值，也应导入为空。  ## 8. 变更与删除提示  - 表单内容发生变更，未保存返回或关闭页面时，需要提示保存。 - 删除控件时需要关键操作提示。 - 显隐规则中涉及的字段被删除或变更时，需要避免产生不可见但仍参与判断的悬挂规则。  ## 9. 待确认问题  - 显隐设置是否影响导出、报告、仪表盘统计口径。 - 多条显隐规则同时命中同一字段时目前禁止重复设置，后续是否允许优先级模式。 - 历史数据中已保存的隐藏字段值清空时机，需要与线上逻辑核对。  "}, {"path": "docs/50-模板表单与数据/表单设计组件.md", "title": "表单设计组件", "folder": "docs/50-模板表单与数据", "text": "﻿--- title: 表单设计组件 type: knowledge domain: 运营端 module: 模板表单与数据 submodule: 表单组件 status: authoritative version: v0.1 owner: 产品 maintainer: Daren updated_at: 2026-05-25 permission: internal tags: - 表单 - 组件 - 业务模板 - 资源库模板 source_files: - source:thoughts-v2-current/v2.1.x/运营端/【运营端】【业务模板】表单设计组件.md - missing-current-source/【运营端】【资源库模版】表单设计组件.md related_docs: - ../20-业务对象/业务模板.md - ../20-业务对象/资源库模板.md - ./公式函数.md search_keywords: - 表单设计 - 控件 - 组件 - 关联引用 - 子表 ---  # 表单设计组件  ## 1. 功能定位  表单设计组件是 Linkincrease 低代码配置能力的基础。运营端通过布局组件、基础组件、高级组件和行业组件配置业务模板、资源库模板、工单、批复、里程碑批复等表单结构，贸易端和采集端按配置展示、校验和保存数据。  ## 2. 组件分类  | 分类 | 组件 | | --- | --- | | 布局组件 | 模块分组、分割线、子表 | | 基础组件 | 单行文本、多行文本、数字、百分比、单选、多选、图片、附件、日期、评级、定位、地址、富文本、空白占位 | | 高级组件 | 关联引用、公式、成员单选、成员多选、协作方单选、协作方多选、签名、汇率 | | 行业组件 | 尺寸检验、组合明细等 |  资源库模板组件与业务模板组件整体相似，但资源库模板中的成员/协作方组件面向团队内成员和团队协作方；业务模板中的成员/协作方组件面向 FlowSpace 内参与成员和协作方。  ## 3. 通用属性  | 属性 | 规则 | | --- | --- | | 标题 | 多数组件必填，限制 100 字符 | | 提示描述 | 非必填，通常限制 100 字符 | | 输入框提示 | 文本、数字、日期等输入型组件可配置 | | 必填项 | 默认不勾选；提交时按组件规则校验 | | 国际化 | 可配置标题、提示描述、输入框提示、单位、按钮名称等 | | 布局 | 影响贸易端展示宽度和排列 |  ## 4. 布局组件  | 组件 | 关键规则 | | --- | --- | | 模块分组 | 基础组件和高级组件可拖入分组；修改分组布局时，需要提示是否同步修改分组内组件宽度 | | 分割线 | 用于表单视觉分隔，支持标题、提示描述和国际化 | | 子表 | 可拖入基础组件和高级组件，但排除关联引用；子表必填时，贸易端至少需要一行数据 |  子表内字段必填时，对应表单提交也需要校验。子表支持单元格编辑、新增行、复制组件、关联字段管理等能力。  ## 5. 基础组件要点  | 组件 | 关键规则 | | --- | --- | | 单行文本/多行文本 | 可配置默认值，支持关联已有数据或通过公式计算 | | 数字 | 支持单位、小数位数、千分符等展示规则 | | 百分比 | 支持单位和小数位数，数字与百分比互相关联时需换算 | | 单选/多选 | 选项需要支持贸易端显示和导入校验 | | 图片 | 可限制最大上传数量和单图最大大小 | | 附件 | 可限制最大数量、单文件大小和文件类型 | | 日期 | 支持多种手动输入和粘贴格式，按控件展示格式截取或补全 | | 定位 | 调取设备定位并记录位置 | | 地址 | 运营端精度变更后，贸易端已有数据按格式截取或补空 | | 富文本 | 支持富文本内容录入，导入时通常只处理文字部分 |  ## 6. 高级组件要点  | 组件 | 关键规则 | | --- | --- | | 关联引用 | 可引用组件和子表；可设置引用按钮名称、关联字段、布局和国际化 | | 公式 | 设置函数与变量，自动计算并展示值 | | 成员单选/多选 | 业务模板中选择 FlowSpace 内成员；资源库模板中选择团队内成员 | | 协作方单选/多选 | 业务模板中选择 FlowSpace 内协作方；资源库模板中选择团队协作方 | | 签名 | 支持 Web 和移动端绘制，账号维度可保存一个签名供下次使用 | | 汇率 | 支持固定汇率或实时汇率，用户填写金额和币种，基准汇率不可改 |  ## 7. 资源库双向关联  资源库模板的关联引用组件支持双向关联：  - 表单 A 的关联引用设置双向关联后，表单 B 末尾新增双向关联组件。 - 双向关联开启后，允许关联多条自动开启且不可关闭。 - 表单 B 的双向关联组件可修改位置、标题、提示、自定义按钮、显示字段、布局和国际化。 - 删除表单 B 的双向关联组件，会关闭表单 A 对应关联引用的双向关联。 - 双向关联数据也支持贸易端资源库被订单详情使用。  ## 8. 默认值与数据源  文本、数字、百分比、日期等组件可通过“关联已有数据”或“公式计算”设置默认值。不同表单可选数据源不同：  - 主表单变量来自主表单。 - 里程碑批复变量来自所有里程碑批复表单和主表单。 - 工单表单变量来自同一里程碑所有表单、主表单、所有里程碑批复表单。 - 工单批复表单变量来自同一里程碑所有表单、主表单、所有里程碑批复表单。 - 子表内组件可额外关联当前子表其他字段。  ## 9. 贸易端应用原则  - 按运营端配置展示、校验和保存。 - 组件默认值应用于创建或导入订单、工单、批复等场景。 - 运营端组件显示格式变更后，贸易端已有数据按新格式截取或补全展示。 - 导入、导出、资源库引用、第三方 API 写入都必须遵循组件类型和校验规则。  ## 10. 待确认问题  - 业务模板与资源库模板组件差异需要继续沉淀成字段级清单。 - 各组件在导入、导出、报告、仪表盘中的展示和可用性需要补完整矩阵。 - 行业组件当前以尺寸检验为主，后续如扩展更多行业组件，应单独拆页。   "}, {"path": "docs/50-模板表单与数据/验货组件流程.md", "title": "验货组件流程", "folder": "docs/50-模板表单与数据", "text": "﻿--- title: 验货组件流程 type: knowledge domain: 公共能力 module: 模板表单与数据 submodule: 行业组件 status: authoritative version: v0.1 owner: 产品 maintainer: Daren updated_at: 2026-05-25 permission: internal tags: - 验货 - 尺寸检验 - AQL - 行业组件 source_files: - source:thoughts-v2-current/v2.7/运营端/验货组件流程梳理.md - source:thoughts-v2-current/v2.1.x/运营端/【运营端】【业务模板】表单设计组件.md related_docs: - ./表单设计组件.md - ./公式函数.md - ../20-业务对象/资源库.md search_keywords: - 验货组件 - 尺寸检验 - 组合明细 - 样本测量记录 - AQL ---  # 验货组件流程  ## 1. 功能定位  验货组件流程基于 Linkincrease 低代码平台实现 AQL 抽样检验、尺寸检验和瑕疵检验。它复用资源库、关联 FlowSpace、公式、子表等能力，支持按件判定、多端数据流转与自动判定。  ## 2. 依赖资源库  | 资源库 | 用途 | 关键字段 | | --- | --- | --- | | 部位库 | 定义检验部位和公差标准 | 部位名称、测量方式、上偏差、下偏差、适用产品类型 | | 公差库 | 基于标准的尺寸公差参考 | 标准来源、类型、等级、尺寸段、上偏差、下偏差 | | AQL 字码表 | 按批量范围和检验水平确定抽样字码 | 批量范围、检验水平、字码 | | AQL 样本量 | 按字码确定样本量 | 字码、样本量 | | AQL Ac/Re | 按 AQL 等级和字码确定接收/拒收数 | 字码、AQL 等级、Ac、Re | | 瑕疵库 | 标准化瑕疵类型和等级 | 瑕疵名称、默认严重等级、描述、参考图片 |  ## 3. 运营端配置  尺寸检验组件是行业组件，拖入表单后自动生成多表结构。  | 表 | 说明 | | --- | --- | | 组合明细 | 灵活 1-2 维组合，例如颜色、尺码，记录数量和分配样本 | | 部位 | 记录检验部位、上偏差、下偏差 | | 尺码尺寸 | 按部位和尺码记录基本尺寸 | | 样本测量记录 | 贸易端生成并录入测量结果 |  运营端可配置各表标题、维度名称、列名、计划样本量、关联数据和国际化内容。尺寸检验组件不可拖入布局，逻辑上相当于多个子表。  ## 4. 贸易端应用流程  flowchart TD A[\"填写组合明细\"] --> B[\"填写部位与偏差\"] B --> C[\"填写尺码尺寸\"] C --> D[\"点击生成样本任务\"] D --> E[\"生成样本测量记录\"] E --> F[\"录入实测值\"] F --> G[\"自动判定合格/不合格/待录入\"] G --> H[\"统计记录数和件数\"]  生成样本任务前，前三张表必须填写完整；未填写完整时，未填输入框标红。生成后，如果前三张表被修改，需要提示配置已修改并重新生成；重新生成会清空已录入数据。  ## 5. 组合明细规则  | 字段 | 规则 | | --- | --- | | 维度一 | 默认颜色，可自定义 | | 维度二 | 默认尺码，可自定义；一维模式下隐藏 | | 数量 | 可填写数字 | | 占比 | 数量 / 总数量，精确到 1 位小数 | | 分配样本 | 计划样本量乘以数量占比，四舍五入取整，可手动修改 |  若组合明细关联其他组合明细或尺寸检验组件，则维度、添加行、维度值和数量不可填写，数据来自被关联组件；样本量仍按自身配置计算。  ## 6. 样本测量记录  样本测量记录按“分配样本总和 × 部位数量”生成。  | 列 | 来源 | | --- | --- | | 组合 | 根据维度自动带出 | | 件号 | 同一件不同部位使用同一件号 | | 颜色/尺码 | 根据组合明细自动带出 | | 部位 | 来自部位表 | | 实测值 | 用户填写 | | 合格范围 | 基本尺寸 + 下偏差 到 基本尺寸 + 上偏差 | | 判定 | 实测值在范围内为合格，不在范围内为不合格，未输入为待录入 |  记录表需要支持模糊搜索和组合筛选。统计包括已录入、合格、不合格，以及合格件数、不合格件数、待录入件数。  ## 7. 采集端应用  采集端只展示样本采集部分，并按照组合明细聚合为任务卡片。  任务卡片包括：  - 组合信息，如颜色/尺码。 - 样本数量。 - 已录入进度。  任务详情以矩阵方式录入，每个部位一行，每行显示部位名称、合格范围和每件样本输入框。  ## 8. 统计表设计  | 表 | 说明 | | --- | --- | | `measure_specs` | 整合组合明细、部位、尺码尺寸，作为规格统计表 | | `measure_records` | 存储每件样本每个部位的实测值和判定 |  这两类表可支持后续帆软统计或其他外部分析。  ## 9. 待确认问题  - AQL Ac/Re 判定与尺寸检验判定之间的最终汇总规则需要继续补充。 - 样本任务生成后，采集端与贸易端同时编辑的冲突处理需要明确。 - 行业组件导入模板、统计报表和移动端离线能力仍需后续拆页。  "}, {"path": "docs/60-协作通知与自动化/README.md", "title": "60 协作通知与自动化", "folder": "docs/60-协作通知与自动化", "text": "# 60 协作通知与自动化  本目录沉淀协作、消息、邮件和自动执行能力。  当前页面：  - [消息中心与实时通知.md](./消息中心与实时通知.md) - [邮件协作.md](./邮件协作.md) - [批量邮件协作.md](./批量邮件协作.md) - [自动化配置.md](./自动化配置.md) - [自动化与系统执行日志.md](./自动化与系统执行日志.md)  相关页面：  - [../50-模板表单与数据/第三方数据对接.md](../50-模板表单与数据/第三方数据对接.md)"}, {"path": "docs/60-协作通知与自动化/批量邮件协作.md", "title": "批量邮件协作", "folder": "docs/60-协作通知与自动化", "text": "﻿--- title: 批量邮件协作 type: knowledge domain: 贸易端 module: 协作通知与自动化 submodule: 批量邮件协作 status: authoritative version: v0.1 owner: 产品 maintainer: Daren updated_at: 2026-05-25 permission: internal tags: - 邮件协作 - 批量操作 - 工单视图 source_files: - source:thoughts-v2-current/v2.3.x/贸易端/【贸易端】【工单视图】批量操作：批量发邮件协作、批量采集.md related_docs: - ./邮件协作.md - ../30-业务流程/工单采集与批复.md search_keywords: - 批量发起邮件协作 - 批量采集 - 工单视图 - 邮件协作 ---  # 批量邮件协作  ## 1. 功能定位  批量邮件协作用于在工单视图中对多条工单一次性发起邮件协作，减少重复操作。每个邮箱都会接收当前勾选工单的邮件协作，执行几条工单就收到几封邮件。  ## 2. 入口与适用范围  - 入口：贸易端工单视图批量操作。 - 对象：当前勾选的多条工单。 - 发送记录：与单条邮件协作共用最近 10 条发送邮箱记录。  ## 3. 配置内容  | 配置项 | 规则 | | --- | --- | | 收件邮箱 | 可输入多个邮箱 | | 邮件主题 | 同单个工单邮件协作 | | 备注 | 同单个工单邮件协作 | | 附件 | 可选择当前里程碑工单模板中的图片/附件字段；本地上传附件应用于所有工单 | | 协作内容设置 | 列出当前所选工单中所有表单，可分别设置显隐 | | 预览 | 查看发出后的协作内容 |  由于批量邮件涉及多个工单，选择模板附件字段时不立即带入附件，而是在发出时统一上传。  ## 4. 表单显隐与数据围栏  - 每行工单根据各自表单显隐、当前采集人是否可编辑进行展示。 - 可编辑表单发出后字段内容为空，供外部填写。 - 不可编辑表单发出后展示原工单最新数据。 - 订单基本信息按当前采集人的数据围栏控制，不可见字段对邮件协作者也不可见。  ## 5. 确定校验  | 校验 | 提示 | | --- | --- | | 邮箱格式不正确 | 邮箱格式不正确 | | 某工单可编辑表单全隐藏 | 至少保留一个可编辑模块 | | 采集人可编辑表单或可见表单变更 | 工单编辑权限已变更，请刷新页面 | | 指派权限被取消 | 暂无权限，请刷新页面 | | 订单删除 | 订单已删除，无法操作，请刷新页面 | | 里程碑完成或取消 | 里程碑已完成/已取消，无法操作，请刷新页面 | | 工单终止采集、已批复或删除 | 工单已终止采集/已批复/已删除，无法操作，请刷新页面 |  ## 6. 与批量采集的关系  同一需求中还包含批量采集工单。批量采集在编辑列表中直接修改可编辑工单字段，提交后触发与单条工单采集相同的动态、历史记录和消息通知。批量邮件协作则生成邮件协作任务，不直接提交工单采集数据。  ## 7. 待确认问题  - 批量邮件协作是否支持“所有对象共同接收同一封邮件”的新发送模式，需与单条邮件协作统一。 - 批量邮件发送失败的重试、部分成功和记录展示规则需补充。  "}, {"path": "docs/60-协作通知与自动化/消息中心与实时通知.md", "title": "消息中心与实时通知", "folder": "docs/60-协作通知与自动化", "text": "﻿--- title: 消息中心与实时通知 type: knowledge domain: 公共能力 module: 协作通知与自动化 submodule: 消息中心 status: authoritative version: v0.1 owner: 产品 maintainer: Daren updated_at: 2026-05-25 permission: internal tags: - 消息 - 实时通知 - 采集端 - 贸易端 source_files: - source:thoughts-v2-current/v2.1.x/贸易端/【贸易端】【消息中心】消息中心、实时消息.md - source:thoughts-v2-current/v2.3.x/采集端/【采集端】【消息中心】消息通知列表.md related_docs: - ../30-业务流程/工单采集与批复.md - ../30-业务流程/跨团队协作.md - ../40-权限与安全/团队权限.md search_keywords: - 消息中心 - 实时消息 - 未读 - 待处理 - APP通知 ---  # 消息中心与实时通知  ## 1. 功能定位  消息中心用于汇总用户在所有团队下收到的待处理、通知、自动化、团队管理和账号类消息。实时通知用于在用户在线时弹出新消息提示；采集端还需要触发 APP 消息通知和首页未读红点。  ## 2. 贸易端消息中心  | 维度 | 规则 | | --- | --- | | 数据范围 | 展示当前用户在所有团队下的消息 | | 展示层级 | 一级按消息类型分组；二级展示该分组下所有消息 | | 排序 | 一级按重要程度：待处理、通知、自动化、团队管理、账号；二级按接收时间倒序 | | 时间范围 | 最多显示最近 3 个月消息 | | 筛选 | 全部/未读 tab；未读时只展示有未读的分类和消息 |  ## 3. 已读规则  - 点击二级消息后，该条消息变为已读。 - 若消息有跳转页面，则点击后打开对应页面。 - 如果消息来源不是当前团队，需要提示是否切换到对应团队；无论是否切换，点击即视为已读。 - 二级列表可将当前分类全部标记已读。 - 一级列表可将所有消息全部标记已读。  ## 4. 消息分类  | 类型 | 典型触发 | | --- | --- | | 待处理 | 创建工单通知采集人；创建工单通知协作团队对接人；指派工单采集、工单批复、里程碑批复 | | 通知 | 工单采集提交、工单批复提交、里程碑批复提交、动态中被 @、里程碑预警或延期 | | 自动化 | 自动化相关消息，原始资料中标注暂无，需要跟自动化通知合并确认 | | 团队管理 | 协作团队邀请、接受/拒绝、移出团队、加入/移出 FlowSpace、邀请成员加入团队 | | 账号 | 被邀请加入团队、被移出团队、被添加或移出 FlowSpace、权限或角色被修改、被设置为对接人 |  ## 5. 实时消息  | 设置 | 规则 | | --- | --- | | 实时通知开关 | 默认打开 | | 打开 | 用户在线且触发消息时，右下角弹出小窗 | | 关闭 | 不弹窗，只记录到消息列表并显示未读数量 | | 小窗计数 | 展示本次登录期间收到的未读消息，如“新消息：1/4” | | 点击查看 | 对应消息已读，小窗隐藏该已读消息 | | 关闭浏览器 | 下次登录不展示上次小窗消息，只展示新消息 |  ## 6. 采集端消息中心  采集端消息中心用于移动端任务处理场景。  - 对应团队有未读消息时，首页消息 icon 出现红点。 - 消息全部已读后，首页红点消失。 - 点击首页消息入口跳转消息中心页。 - 消息分类显示红点和未读数。 - 部分消息仅通知，部分消息点击可跳转页面。 - 手机未开启 APP 通知时，底部展示通知条；点击开启跳转手机通知设置页。 - 点击全部已读后，所有分类消息已读。  ## 7. 待确认问题  - 自动化消息分类当前资料标注“暂无”，但自动化执行支持站内通知，需要统一口径。 - 消息模板来源仍在外部链接中，建议导出为本地来源文件。 - 消息跳转时如果用户已失去权限，需统一提示“暂无权限”并保留已读状态。  "}, {"path": "docs/60-协作通知与自动化/自动化与系统执行日志.md", "title": "自动化与系统执行日志", "folder": "docs/60-协作通知与自动化", "text": "﻿--- title: 自动化与系统执行日志 type: knowledge domain: 公共能力 module: 协作通知与自动化 submodule: 执行日志 status: authoritative version: v0.1 owner: 产品 maintainer: Daren updated_at: 2026-05-25 permission: internal tags: - 自动化 - 执行日志 - 系统日志 - 审计 source_files: - source:thoughts-v2-current/V2.4.x/贸易端/【贸易端】【自动化】一期.md - source:thoughts-v2-current/V2.4.x/运营端/【运营端】【SCCS管理】SCCS自动化记录.md - source:thoughts-v2-current/V2.4.x/贸易端/系统自动执行的相关操作日志.md related_docs: - ./自动化配置.md - ../80-日志审计/README.md search_keywords: - 自动化执行日志 - 系统自动执行 - 机器人 - 执行状态 - 自动化记录 ---  # 自动化与系统执行日志  ## 1. 功能定位  自动化与系统执行日志用于追踪自动化、公式自动更新、资源库同步、SCMPro API 数据变更等系统行为，确保自动执行过程可审计、可解释、可排查。  ## 2. 贸易端自动化执行日志  自动化列表中可点击日志查看对应自动化程序的执行记录。  | 字段 | 说明 | | --- | --- | | 执行数据 | 非定时任务显示具体订单标识；定时任务显示定时任务 | | 执行时间 | 自动化执行时间 | | 执行状态 | 成功、失败、部分成功 | | 详情 | 查看触发条件、执行操作、具体数据和结果 |  当前后续规划中提到执行状态可能先只保留成功和失败，部分成功是否启用需要确认。  ## 3. 日志详情  | 节点 | 记录内容 | | --- | --- | | 新增数据触发 | 流程设置、执行记录、操作人、新增数据内容 | | 数据变更触发 | 流程设置、执行记录、操作人、变更前后值 | | 到达时间触发 | 流程设置、执行记录、触发字段值 | | 发送通知 | 通知对象、渠道、标题、内容、链接页面、附件 | | 新增数据 | 被新增记录、处理人、新增数据内容 | | 更新数据 | 被更新记录、更新字段及变更前后值 |  操作人可能是团队成员、协作方成员或自动程序。自动程序头像为机器人，名称为具体触发程序。  ## 4. 运营端自动化记录  运营端 FlowSpace 管理中存在自动化记录模块，用于平台侧追踪自动化任务全生命周期。  筛选项：  - FlowSpace 名称、团队 ID/名称、自动化 ID/名称。 - 触发类型：新增数据、数据变更、到达时间、定时任务。 - 执行状态：成功、失败、已失效、待执行。 - 触发时间、执行时间。  列表字段包括 FlowSpace、所属团队、订单、自动化名称、触发类型、触发数据、触发时间、执行动作、执行状态、执行结果摘要和执行时间。  ## 5. 系统自动执行日志  需要纳入系统自动执行记录的能力：  - 公式自动更新。 - 自动化更新。 - 关联资源库数据同步更新。 - SCMPro API 数据变更自动更新。  自动化更新时：  - 操作人显示为自动化，头像为系统。 - 操作时间为自动化执行时间。 - 主表单更新、创建工单、更新工单采集/批复、更新里程碑批复时，需要增加历史记录。 - 更新时间和更新人也应显示自动化或系统身份。  ## 6. 与业务动态的关系  自动化执行后，需要在业务对象内留下对应动态：  - 创建工单：工单动态增加创建记录，订单跟踪记录增加创建工单。 - 更新工单：按采集和批复分别增加动态。 - 更新里程碑批复：里程碑批复动态增加编辑记录。 - 更新订单基本信息：订单跟踪记录增加编辑订单。  ## 7. 待确认问题  - 失败操作的详情展示原文中仍有待确认项，需要产品补齐。 - 运营端自动化记录与贸易端执行日志是否共用同一数据模型。 - 系统自动执行失败是否有重试、告警、人工处理入口。  "}, {"path": "docs/60-协作通知与自动化/自动化配置.md", "title": "自动化配置", "folder": "docs/60-协作通知与自动化", "text": "﻿--- title: 自动化配置 type: knowledge domain: 贸易端 module: 协作通知与自动化 submodule: 自动化 status: authoritative version: v0.1 owner: 产品 maintainer: Daren updated_at: 2026-05-25 permission: internal tags: - 自动化 - 定时任务 - 通知 - 执行动作 source_files: - source:thoughts-v2-current/V2.4.x/贸易端/【贸易端】【自动化】一期.md - source:thoughts-v2-current/V2.5.x/贸易端/【贸易端】【自动化】二期：定时任务.md related_docs: - ../30-业务流程/自动化执行.md - ../40-权限与安全/FlowSpace业务角色权限.md - ../50-模板表单与数据/第三方数据对接.md search_keywords: - 自动化配置 - 触发条件 - 发送通知 - 新增数据 - 更新数据 ---  # 自动化配置  ## 1. 功能定位  自动化配置用于在 FlowSpace 内设置触发条件和执行操作，自动完成通知、创建工单、更新订单或批复数据等机械性工作。启用状态下才会执行。  ## 2. 自动化列表  | 字段 | 说明 | | --- | --- | | 自动化名称 | 支持模糊搜索 | | 内容 | 展示触发条件和执行操作摘要 | | 状态 | 全部、启用、未启用 | | 执行日志 | 查看对应自动化已执行情况 | | 操作 | 编辑、删除 |  启用自动化时需要校验设置是否完善；未完善时提示前往设置。  ## 3. 配置结构  一个自动化包含：  - 1 个触发条件。 - 最多 5 个执行操作。 - 是否启用。 - 执行失败通知，可选择站内、邮件、短信。  自动化触发条件和执行操作只在同一订单内发生，不跨订单触发执行。  ## 4. 触发条件  | 条件 | 说明 | | --- | --- | | 新增数据时 | 订单基本信息、里程碑批复、里程碑工单新增后触发 | | 数据内容变更时 | 指定数据源字段变更时触发，可使用“变更时”条件 | | 到达记录中的时间时 | 到达数据源内日期字段的当时、之前或之后触发 | | 定时任务 | 按不重复、每天、每周、每月、每月第几个周几执行 |  数据源选择工单且满足条件使用该工单字段时，可设置工单范围为当前工单。  ## 5. 执行操作  | 操作 | 说明 | | --- | --- | | 发送通知 | 通过 Linkincrease 消息或邮件通知成员、团队、角色或模板控件人员 | | 新增数据 | 自动新增里程碑工单，并设置处理人和默认值 | | 更新数据 | 更新订单基本信息、里程碑批复或工单字段 |  自动化按顺序执行。任一步失败，后续操作不执行，并根据失败通知配置通知相关对象。  ## 6. 发送通知  通知对象包括：  - FlowSpace 成员。 - FlowSpace 协作团队。 - 业务角色和协作方角色。 - 订单模板控件。 - 步骤一数据源角色。  通知渠道包括 Linkincrease 消息和邮件。邮件可配置分别发送，或让所有被通知对象同时接收同一封邮件。标题和正文可拼接模板字段；邮件可附带步骤一数据源中的图片或附件字段。  ## 7. 新增数据  新增数据当前主要用于创建工单。  配置项：  - 数据源。 - 工单名称，自定义或自动编号。 - 处理人，至少保留一个非隐藏表单，且至少设置一项采集人、工单批复人或里程碑批复人。 - 工单默认值；未设置处理人的采集表单中如果包含必填字段，必须设置默认值。  不执行场景包括订单已完成/取消、里程碑已完成/取消、里程碑互用自其他订单、处理人为空、必填默认值为空等。  ## 8. 更新数据  更新数据可选择订单基本信息、里程碑批复、工单。数据源为工单时，可选择所有记录或指定记录；指定记录需设置过滤条件。  不执行场景包括：  - 订单已完成或取消。 - 里程碑已完成或取消。 - 里程碑或工单互用自其他订单。 - 更新工单采集字段时，工单已批复或终止采集。  ## 9. 定时任务  定时周期：  - 不重复。 - 每天。 - 每周。 - 每月。 - 每月第几个周几。  设置的时间不存在时不执行，且不属于执行失败。  定时任务特殊规则：  - 通知对象仅保留 FlowSpace 成员、协作团队、业务角色、协作方角色 4 个分组。 - 新增工单时需增加订单筛选条件。 - 更新数据时需增加记录范围设置，过滤符合条件的数据。  ## 10. 待确认问题  - 部分成功目前为后续规划，当前状态是否只保留成功/失败需要与线上统一。 - 失败通知中的短信规则仍依赖外部模板。 - 自动化与资源库同步、API 同步同时更新同一字段时的优先级需要补规则。  "}, {"path": "docs/60-协作通知与自动化/邮件协作.md", "title": "邮件协作", "folder": "docs/60-协作通知与自动化", "text": "﻿--- title: 邮件协作 type: knowledge domain: 贸易端 module: 协作通知与自动化 submodule: 邮件协作 status: authoritative version: v0.1 owner: 产品 maintainer: Daren updated_at: 2026-05-25 permission: internal tags: - 邮件协作 - 工单 - 外部协作 - 数据引用 source_files: - source:thoughts-v2-current/v2.2.x/贸易端/【贸易端】【订单详情】邮件协作.md - source:thoughts-v2-current/v2.3.x/运营端/【运营端】【用户-SCCS管理】邮件协作列表.md related_docs: - ../20-业务对象/工单与批复.md - ../40-权限与安全/数据围栏.md - ../50-模板表单与数据/表单属性与显隐设置.md search_keywords: - 邮件协作 - 邮件填写链接 - 引用数据 - 邮件历史记录 ---  # 邮件协作  ## 1. 功能定位  邮件协作用于把工单采集任务通过邮件继续下发给平台外邮箱收集数据，解决工单采集只支持一级协作时的外部询价、填报和资料收集问题。邮件协作数据可回流到原工单，并可被工单采集人引用。  ## 2. 数据共享范围  同一工单内，邮件协作数据以团队为单位共享。  - 同团队内任一采集人发出的邮件协作，同团队可查看该工单的成员均可查看。 - 同团队采集成员可引用这些邮件协作数据。 - 引用时仅填充当前用户可编辑的表单或子表。  ## 3. 邮件协作列表  | 标签页 | 内容 | | --- | --- | | 邮件协作 | 当前用户所处团队在该工单中发出的邮件协作数据 | | 历史记录 | 邮件协作者提交数据的历史快照 |  固定字段包括序号、备注、附件、邮件发出人和时间、填写人邮箱、更新时间。其余字段为当前工单所有非隐藏表单字段；发出邮件协作时若隐藏某些表单，对应字段置空置灰。  ## 4. 创建邮件协作  创建条件：  - 工单处于可采集状态。 - 当前用户在当前团队作为当前工单采集人。 - 协作团队未指派前，对接人或有工单指派权限成员也可创建。  配置内容：  - 模块显隐设置，至少保留一个可编辑表单。 - 接收邮箱，可输入多个邮箱，并记住最近 10 条发送记录。 - 邮件主题、备注、附件。 - 右侧预览页面按显隐设置展示。  订单基本信息按当前发出邮件协作成员的数据围栏展示；不可见字段对邮件协作者也不可见。  ## 5. 邮件填写与失效  邮件内有两个链接：  - 填写当前邮件协作的链接。 - 查看当前邮箱参与的所有邮件协作列表链接。  失效或不可提交场景：  - 邮件协作被删除，链接失效。 - 原工单被删除，链接失效。 - 原工单已批复、已终止采集。 - 里程碑已完成或已取消。  提交后，需要通知原工单中该邮件协作发出团队下的所有采集人。  ## 6. 邮件协作方列表  邮件协作者可通过“查看我的所有邮件协作”链接查看当前邮箱接收的所有邮件协作工单。  规则：  - 未注册用户跳转注册并自动填入邮箱。 - 已注册用户跳转登录并自动填入邮箱。 - 邮箱验证信息有效期 7 天，前端本地缓存。 - 状态包括可处理、已完成、已失效。 - 支持按最近发起、最近更新排序。  ## 7. 引用数据  | 引用方式 | 规则 | | --- | --- | | 整行引用 | 将某条邮件协作数据覆盖填充到当前工单，填充后仍可修改 | | 子表引用 | 仅覆盖对应子表控件，其余控件不影响 |  引用权限：当前采集处理人可引用本团队发出的邮件协作。子表不可编辑时，提示当前子表不可编辑，无法引用数据。  ## 8. 运营端邮件协作列表  运营端 FlowSpace 管理中可查看邮件协作列表，支持主题、发起人、投递状态、邮件状态、更新时间等筛选。详情页和历史记录同贸易端查看效果。  投递状态包含成功、无效地址、垃圾邮件、失败；若贸易端重发，投递状态和邮件状态以最新发出的邮件为准。  ## 9. 待确认问题  - 邮件协作模板仍引用外部“邮件、短信、通知规则及模板”，需要导出。 - 邮件发送“分别发送”与“共同接收同一封邮件”的最终产品规则需补入。 - 邮件协作填写页切换语言和最后提交时间的更新项需要进一步拆明细。  "}, {"path": "docs/70-展示分析/README.md", "title": "README", "folder": "docs/70-展示分析", "text": "﻿# 70 展示分析  本目录沉淀数据展示、视图、报表与仪表盘。  ## 已沉淀页面  - [工作台与FlowSpace入口.md](./工作台与FlowSpace入口.md) - [订单日程与任务中心.md](./订单日程与任务中心.md) - [常用视图与视图设置.md](./常用视图与视图设置.md) - [仪表盘管理与设计器.md](./仪表盘管理与设计器.md) - [报告管理与权限.md](./报告管理与权限.md)  ## 关联模块  - 权限边界：[../40-权限与安全/仪表盘与报告权限.md](../40-权限与安全/仪表盘与报告权限.md) - 协作任务：[../60-协作通知与自动化/邮件协作.md](../60-协作通知与自动化/邮件协作.md) - 数据配置：[../50-模板表单与数据/公式函数.md](../50-模板表单与数据/公式函数.md)"}, {"path": "docs/70-展示分析/仪表盘管理与设计器.md", "title": "仪表盘管理与设计器", "folder": "docs/70-展示分析", "text": "﻿# 仪表盘管理与设计器  ## 定位  仪表盘用于在 FlowSpace 内配置统计分析页面，帮助用户快速监控订单动态、业务进度和关键指标。运营端负责仪表盘配置和设计，贸易端根据权限查看仪表盘数据。  ## 管理入口  运营端 FlowSpace 列表增加仪表盘数量字段和仪表盘管理入口。  | 能力 | 规则 | |---|---| | 仪表盘数量 | 统计对应 FlowSpace 添加的仪表盘数量 | | 仪表盘管理 | 可进入当前 FlowSpace 的仪表盘管理页面 | | 添加仪表盘 | 仪表盘名称必填，限制 100 字符 | | 修改名称 | 可修改仪表盘名称，限制 100 字符 | | 删除仪表盘 | 需要二次确认 | | 排序 | 支持拖动排序 | | 国际化 | 仪表盘名称支持国际化 |  ## 数据源  仪表盘数据源来自 FlowSpace 的订单信息、里程碑、工单批复等表结构，并可扩展公式字段。  | 数据源 | 字段范围 | |---|---| | 订单信息 | 订单信息字段、里程碑批复字段，排除所有子表字段 | | 订单信息子表 | 订单信息字段、子表字段 | | 里程碑 | 订单列表字段、里程碑字段、工单批复字段，排除所有子表字段 | | 里程碑子表 | 订单列表字段、里程碑字段、子表字段 | | 工单批复子表 | 订单列表字段、里程碑字段、工单批复字段、子表字段 |  如果主表单或里程碑批复包含子表，则订单信息或里程碑会作为分组名，分组下展示对应字段和所有子表。  ### 公式字段  仪表盘支持添加、编辑、删除公式字段。  | 配置 | 规则 | |---|---| | 公式名称 | 必填，限制 100 字符 | | 公式类型 | 必填，默认数字；支持数字、文本、百分比、日期 | | 订单信息公式变量 | 订单信息、订单信息子表、所有里程碑、所有里程碑子表，排除图片、附件、签名、富文本字段 | | 子表公式变量 | 当前子表字段 | | 删除 | 需要二次确认 |  ## 仪表盘设计器组件  仪表盘由布局组件、工具组件、图表组件和特殊图表组成。  | 类型 | 组件 | |---|---| | 布局组件 | 模块分组、标题、标签卡 | | 工具 | 筛选器 | | 图表 | 指标卡、柱状图、折线图、条形图、饼图、组合图、面积图、雷达图、统计表、透视表 | | 特殊图表 | 里程碑状态 |  所有组件通常支持标题、提示描述和国际化。可国际化内容一般包括标题、提示描述，部分图表还包括指标名称。  ## 图表通用配置  大多数图表具备类似的数据配置模型：  | 配置 | 说明 | |---|---| | 数据源 | 从数据表列表选择，默认订单信息 | | 筛选设置 | 可对数据源字段设置筛选条件，并显示已设置条件数量 | | 维度 | 按字段分组统计，日期字段可选年月日、年周、年月、年季、年等格式 | | 指标 | 可添加多个数据源字段或自定义公式字段 | | 统计方式 | 统计记录总数、统计字段数值、自定义公式 | | 排序 | 支持记录顺序、维度值、指标值等排序方式 | | 数据显示 | 可限制展示条数 | | 图表配置 | 图例、数据标签、网格线、推荐配色、自定义配色等 |  多选字段可选择拆分统计或不拆分统计。指标卡计算出的数字统一保留一位小数。  ## 筛选器  筛选器用于联动筛选一个或多个图表。  规则：  1. 可筛选图表为当前仪表盘内的图表，可多选。 2. 所选图表有几个数据源，就展示几个数据源选项。 3. 不同数据源选择的字段必须是同一类型。 4. 最后选择的字段与其他字段类型不一致时，清空其他选项。 5. 日期字段可设置日期格式。 6. 选项字段可设置选项样式。  ## 典型图表  | 图表 | 核心规则 | |---|---| | 指标卡 | 支持统计记录总数、统计字段数值、自定义公式 | | 柱状图 | 支持基础柱状图、堆积柱状图、百分比堆积柱状图 | | 折线图 | 与柱状图类似，侧重趋势展示 | | 条形图 | 与柱状图类似，横纵轴方向不同 | | 饼图 | 支持实心和圆环；配置扇区分组和扇区数值 | | 组合图 | 指标可设置为折线或柱状，并选择左轴或右轴 | | 统计表 | 支持维度、统计方式、汇总、序号、排序 | | 透视表 | 支持行维度、列维度、指标、冻结和汇总 | | 里程碑状态 | 特殊图表，可按订单筛选并展示里程碑状态分布 |  ## 仪表盘权限  贸易端按角色控制仪表盘查看和授权。  | 权限来源 | 能力 | |---|---| | 团队角色-内部FlowSpace管理 | 可查看所有内部 FlowSpace 的仪表盘数据，并可授权 | | FlowSpace业务角色-仪表盘管理 | 可查看当前 FlowSpace 所有仪表盘数据，并可授权 | | 被授权成员 | 可查看被授权的仪表盘 | | 被授权协作团队成员 | 可查看被授权的仪表盘 |  仪表盘权限设置弹窗列出已加入当前 FlowSpace 的内部成员和协作团队成员。内部成员和协作成员即使未注册也可以授权。  权限维护规则：  1. 可模糊搜索内部成员姓名、协作团队名称、协作成员姓名。 2. 协作团队成员支持两级下钻选择。 3. 已选计数和左右列表选中状态需要同步。 4. 当前用户无仪表盘管理权限时，提示暂无权限。 5. 成员被移除 FlowSpace 后，对应仪表盘权限列表也删除；重新加入后需重新授权。  ## 仪表盘查看  可管理当前 FlowSpace 仪表盘的用户可以查看当前 FlowSpace 中所有仪表盘数据。被授权部分仪表盘查看权限的成员或协作团队成员，只能查看被授权仪表盘。  可查看的仪表盘可以星标，星标后在工作台常用视图中展示。如果星标后权限被取消，常用视图中同步隐藏；重新授权后若还需要常用入口，需要重新星标。  ## 关联页面  - [仪表盘与报告权限](../40-权限与安全/仪表盘与报告权限.md) - [常用视图与视图设置](./常用视图与视图设置.md) - [公式函数](../50-模板表单与数据/公式函数.md) - [数据围栏](../40-权限与安全/数据围栏.md)  ## 来源  - `source:thoughts-v2-current/v2.3.x/运营端/【运营端】【SCCS列表-仪表盘】SCCS仪表盘管理.md` - `missing-current-source/【运营端】【仪表盘】表单设计组件.md` - `source:thoughts-v2-current/V2.5.x/贸易端/【贸易端】【仪表盘】权限管理.md`  "}, {"path": "docs/70-展示分析/工作台与FlowSpace入口.md", "title": "工作台与FlowSpace入口", "folder": "docs/70-展示分析", "text": "﻿# 工作台与FlowSpace入口  ## 定位  工作台是贸易端用户进入 Linkincrease 后的主入口，用于承载 FlowSpace 访问、创建 FlowSpace、FlowSpace 分组、常用视图、任务入口和订单日程等日常工作能力。  本页聚焦工作台作为“业务入口”的部分；订单日程、任务中心、常用视图的详细规则见同目录其他页面。  ## 核心能力  | 能力 | 说明 | |---|---| | FlowSpace列表 | 展示当前用户在当前团队可见的内部 FlowSpace 和协作 FlowSpace | | FlowSpace搜索 | 支持按 FlowSpace 名称模糊搜索 | | FlowSpace星标 | 用户可将常用 FlowSpace 标星，星标 FlowSpace 置顶展示 | | FlowSpace分组 | 团队级维护 FlowSpace 分组，影响工作台中的分组展示 | | 创建FlowSpace入口 | 有团队设置-创建 FlowSpace 权限的用户可从工作台进入模板中心并创建 FlowSpace | | 预留事务模块 | 工作台承载常用视图、任务中心、订单日程等事务入口 |  ## FlowSpace列表展示规则  每个 FlowSpace 至少展示 FlowSpace 名称。列表先区分用户可见范围，再按星标与创建时间排序。  | 类型 | 可见条件 | |---|---| | 内部FlowSpace | 用户拥有团队角色-内部 FlowSpace 管理权限，或已加入该内部 FlowSpace | | 协作FlowSpace | 用户拥有团队角色-协作 FlowSpace 管理权限，或已加入该协作 FlowSpace |  排序规则：  1. 星标 FlowSpace 排在非星标 FlowSpace 前。 2. 星标 FlowSpace 按标星时间倒序。 3. 非星标 FlowSpace 按 FlowSpace 创建时间倒序。 4. 星标状态按“当前用户 + 当前团队”存储。  ## 创建FlowSpace  创建 FlowSpace 从工作台入口进入，整体链路为：  flowchart LR A[\"工作台\"] --> B[\"模板中心\"] B --> C[\"模板预览\"] B --> D[\"创建FlowSpace\"] C --> D D --> E[\"创建成功并进入FlowSpace\"]  创建入口仅对有“团队设置-创建 FlowSpace”权限的用户展示。模板中心展示运营端已启用的业务模板，并按行业分类和发布时间倒序排序。  创建 FlowSpace 时的关键字段：  | 字段 | 规则 | |---|---| | FlowSpace名称 | 必填，限制 100 字符 | | FlowSpace编号 | 必填，限制 1-8 位大写英文，输入小写时自动转大写 | | 编号唯一性 | 同团队内 FlowSpace 编号不可重复 | | FlowSpace分组 | 可选择当前团队的 FlowSpace 分组，默认未分组 |  创建成功后：  1. 创建者默认成为该 FlowSpace 成员。 2. 创建者自动配置固定角色“业务管理员”。 3. FlowSpace 设置-业务角色列表自动生成固定角色“业务管理员”，拥有 FlowSpace 业务角色内全部权限。 4. FlowSpace 设置-更多设置默认生成部分预设订单作废原因。  ## FlowSpace分组  FlowSpace 分组用于在工作台组织用户可见的 FlowSpace。分组设置是团队级配置，对团队内所有成员生效，但每个成员只能看到自己有权限查看的 FlowSpace。  | 操作 | 规则 | |---|---| | 默认分组 | 未分组，不可编辑、不可删除 | | 新增分组 | 分组名称必填，限制 20 字符，新分组默认排在最上方 | | 编辑分组 | 可修改分组名称 | | 删除分组 | 删除后，该分组下 FlowSpace 移入未分组 | | 移入分组 | FlowSpace 可移动到除当前分组外的其他分组 | | 排序 | 分组可拖拽排序，FlowSpace 可拖拽移动 |  分组查看规则：  1. 固定展示“所有FlowSpace”tab，包含当前用户可见权限内所有 FlowSpace。 2. 可切换到某个细分分组。 3. 在“所有FlowSpace”tab 中可按分组显示，默认勾选。 4. 分组排序按分组设置中的顺序。 5. 每个分组内按星标、非星标和 FlowSpace 创建时间排序。 6. 当前用户无可见 FlowSpace 的分组隐藏。 7. 前端记住当前用户最后一次“按分组显示”勾选状态。  ## 关联页面  - [从模板到FlowSpace](../30-业务流程/从模板到FlowSpace.md) - [业务模板](../20-业务对象/业务模板.md) - [团队权限](../40-权限与安全/团队权限.md) - [订单日程与任务中心](./订单日程与任务中心.md) - [常用视图与视图设置](./常用视图与视图设置.md)  ## 来源  - `source:thoughts-v2-current/v2.0.x/贸易端/【贸易端】【工作台】工作台、创建SCCS、SCCS分组.md` "}, {"path": "docs/70-展示分析/常用视图与视图设置.md", "title": "常用视图与视图设置", "folder": "docs/70-展示分析", "text": "﻿# 常用视图与视图设置  ## 定位  视图是用户在订单列表中沉淀查询、字段显示、排序、列统计、列宽、分页和查看模式等展示配置的载体。常用视图则把用户高频访问或主动星标的视图带回工作台，成为个人化快捷入口。  ## 常用视图  常用视图展示当前用户标星的视图和访问次数前 10 的视图。常用视图仅对个人可见。  | 项目 | 规则 | |---|---| | 数据来源 | 用户标星的视图 + 访问次数前 10 的视图 | | 去重 | 同一视图只展示一次 | | 权限 | 不展示当下无权限的视图；标星视图点击时仍需判断权限 | | 排序 | 先按星标时间倒序，再按访问次数倒序 | | 访问次数相同 | 按最后访问时间正序 | | 空状态 | 提示用户进入 FlowSpace 将常访问视图标星 | | 状态记忆 | 按账号记住最后一次选中 FlowSpace 列表或常用视图列表状态 |  访问次数超过 999 后显示为 `1k` 类格式，保留一位小数并向下取整。  ## 订单列表查询  订单列表查询由模糊搜索和条件查询组成，两者为且关系。  ### 模糊搜索  模糊搜索支持当前列表所有文字类型字段的搜索，包括文本、数字、百分比、评级、单多选、日期、成员、协作团队、富文本文字部分、公式控件、关联引用字段等。  关键规则：  1. 隐藏字段不在模糊搜索范围内。 2. 搜索结果可高亮展示，并显示结果条数。 3. 支持切换上一条、下一条并定位到对应单元格。 4. 搜索范围跨页，高亮范围为当前页。 5. 按用户记住最近 5 次模糊搜索记录，不区分团队和 FlowSpace。  ### 条件查询  条件查询只在当前用户自己的数据权限范围内筛选。  可查询字段范围：  | 类型 | 字段 | |---|---| | 模板字段 | 主表单、各里程碑批复字段 | | 系统字段 | 订单 ID、订单状态、创建人、创建时间、更新人、更新时间、里程碑批复人、批复时间、里程碑状态、负责人、计划时间、实际时间、耗时等 | | 自定义标签 | FlowSpace 设置中添加的主表单标签字段、各里程碑标签字段 |  数据围栏限制当前用户不可见的字段，查询字段也不可见。自定义视图中，如果被设为条件的字段在运营端被删除，对应字段展示删除样式并增加说明。  ### 表头查询  表头可设置快捷查询条件。表头查询和右上角查询入口双向同步，被设置查询条件的列需要标记。  ## 字段配置  字段配置用于控制列表展示字段、冻结列和不同查看模式下的字段表现。  | 配置 | 规则 | |---|---| | 冻结列 | 最多 5 个，最少 0 个 | | 默认冻结 | 订单标识默认作为默认视图的冻结列 | | 字段显隐 | 打开为显示，关闭为隐藏 | | 默认隐藏 | 订单 ID 默认隐藏，其余字段默认显示 | | 全部操作 | 支持显示所有、隐藏所有 | | 数据围栏 | 不可见字段在字段配置中也不可见 |  冻结列适用于所有查看模式；非冻结列主要适用于详情查看模式。  ## 排序  排序支持右上角排序设置和表头快捷排序，两者双向同步。  | 项目 | 规则 | |---|---| | 排序字段数 | 每次最多 3 列，最少 0 列 | | 多字段排序 | 先按第一字段排序，相同值再按第二字段、第三字段排序 | | 顺序调整 | 可拖拽修改排序字段顺序 | | 默认排序 | 未设置排序字段时，按订单编号倒序 |  支持排序的字段类型包括文本、数字、百分比、评级、单多选、日期、成员姓名、协作团队名称、富文本文字部分、定位、地址、汇率，以及设置为这些类型的公式和关联引用字段。  文本升序规则为：空值、特殊符号、数字、英文字母、中文首字母；降序反向。相同值时，按订单 ID 排序。  ## 列统计  列统计在列表底部展示基础数据统计，统计结果基于当前筛选结果跨页计算。  | 统计方式 | 说明 | |---|---| | 计数 | 当前表格数据条数 | | 求和 | 当前列总和 | | 平均值 | 有值数据总和 / 有值条数 | | 最大值 | 当前列有值数据中的最大值 | | 最小值 | 当前列有值数据中的最小值 | | 未填写 | 当前列空值条数 | | 已填写 | 当前列有值条数 | | 唯一值 | 当前列非空值去重计数 |  规则补充：  1. 数字控件默认统计求和，包括数字公式和关联引用数字。 2. 百分比、评级不纳入数字默认求和。 3. 查询结果变更或编辑订单后，已设置的统计规则保留，并按最新数据重新计算。 4. 有勾选数据时统计勾选部分；没有勾选时统计当前筛选全部数据。 5. 图片、文件、富文本暂不做唯一值统计。 6. 操作人和操作时间同列时，默认统计操作人。 7. 里程碑计划时间、实际时间同列时，不进行统计。  ## 视图保存  视图用于保存列表的展示配置。  触发保存提示的配置变更包括：  - 查询条件、表头查询、模糊搜索 - 字段配置 - 排序 - 列统计 - 列宽调整 - 每页显示条数 - 查看模式切换  视图类型：  | 类型 | 规则 | |---|---| | 默认视图 | 第一次进入列表时存在，展示所有字段、无排序、无筛选；不支持覆盖、重命名、删除 | | 自定义视图 | 支持另存为、覆盖当前、重命名、删除 |  视图排序支持在每个主表单或里程碑模块下拖拽排序，不可跨模块拖拽。里程碑之间也可拖拽排序。  ## 关联页面  - [工作台与FlowSpace入口](./工作台与FlowSpace入口.md) - [订单生命周期](../30-业务流程/订单生命周期.md) - [数据围栏](../40-权限与安全/数据围栏.md) - [资源库](../20-业务对象/资源库.md)  ## 来源  - `source:thoughts-v2-current/v2.3.x/贸易端/【贸易端】【工作台】订单日程、任务中心、常用视图.md` - `source:thoughts-v2-current/v2.2.x/贸易端/【贸易端】【订单列表】视图设置.md` - `source:thoughts-v2-current/v2.3.x/贸易端/【贸易端】【订单列表】视图模式：子表.md` - `source:thoughts-v2-current/V2.5.x/贸易端/【贸易端】【资源库】视图管理.md` "}, {"path": "docs/70-展示分析/报告管理与权限.md", "title": "报告管理与权限", "folder": "docs/70-展示分析", "text": "﻿# 报告管理与权限  ## 定位  报告能力用于将订单、里程碑、工单等业务对象与第三方报告链接关联，并按角色和参与关系控制查看权限。报告本身以外部链接形式打开，Linkincrease 负责入口、配置、权限判断和数据表同步。  ## 报告类型  | 类型 | 说明 | |---|---| | 订单报告 | 挂在订单信息层级 | | 里程碑报告 | 挂在里程碑层级 | | 工单报告 | 挂在里程碑下的工单层级 |  贸易端有权限时才展示对应报告按钮。点击按钮后仍需再次判断权限。  ## 贸易端查看  报告入口展示规则：  1. 当某类报告只有一个时，仅展示“查看报告”。 2. 点击“查看报告”后，在浏览器新页签打开报告。 3. 当某类报告有多个时，点击“查看报告”后下拉展示多个报告名称。 4. 点击对应报告名称后，在新页签打开报告。 5. 报告查看页面支持打印。 6. 无权限时提示“暂无权限，请联系管理员”。  ## 运营端报告管理  运营端 FlowSpace 列表增加报告管理入口，用于维护第三方报告链接。  报告列表默认按模板结构展示：  1. 订单信息。 2. 里程碑名称分组。  可在对应分组下新增、编辑、删除报告。里程碑分组下新增报告时，需要选择报告类型：里程碑报告或工单报告，其中里程碑报告为默认类型。  | 字段 | 规则 | |---|---| | 报告名称 | 必填，限制 100 字符 | | 报告名称国际化 | 支持 | | 报告地址 | 必填 | | 数据表列表 | 功能同仪表盘，数据同步 |  ## 权限矩阵  | 角色或关系 | 订单报告 | 里程碑报告 | 工单报告 | |---|---:|---:|---:| | 团队角色-内部FlowSpace管理 | 可看 | 可看 | 可看 | | FlowSpace角色-查看订单报告 | 可看 |  |  | | FlowSpace角色-查看里程碑报告 |  | 可看 |  | | FlowSpace角色-查看工单报告 |  |  | 可看 | | 里程碑批复人 |  | 可看参与批复的里程碑 | 可看参与里程碑批复的工单 | | 工单批复人 |  |  | 可看参与批复的工单 | | 工单采集人 |  |  | 可看参与采集的工单 | | 协作团队-里程碑批复指派 |  | 可看本团队参与批复的里程碑 | 可看本团队参与里程碑批复的工单 | | 协作团队-工单批复指派 |  |  | 可看本团队参与批复的工单 | | 协作团队-工单采集指派 |  |  | 可看本团队参与采集的工单 |  ## 权限判断  报告权限分为前端展示判断和点击后的实际权限判断。  | 阶段 | 规则 | |---|---| | 页面展示 | 有相关报告权限时才展示对应按钮 | | 点击报告 | 再次判断权限 | | 有权限 | 新页签打开报告 | | 无权限 | 提示暂无权限，请联系管理员 |  ## 与仪表盘的关系  报告管理的数据表列表功能同仪表盘，并与仪表盘数据同步。也就是说，报告配置侧可以复用仪表盘的数据表结构、字段范围和数据源组织方式。  报告偏向“外部链接查看和打印”，仪表盘偏向“平台内配置化数据分析”。两者共享 FlowSpace 数据结构，但权限、入口和展示方式不同。  ## 关联页面  - [仪表盘管理与设计器](./仪表盘管理与设计器.md) - [仪表盘与报告权限](../40-权限与安全/仪表盘与报告权限.md) - [订单](../20-业务对象/订单.md) - [工单与批复](../20-业务对象/工单与批复.md)  ## 来源  - `source:thoughts-v2-current/V2.5.x/贸易端/【贸易端】报告权限.md` - `source:thoughts-v2-current/V2.6.x/运营端/【运营端】【SCCS管理】SCCS列表增加报告管理.md` "}, {"path": "docs/70-展示分析/订单日程与任务中心.md", "title": "订单日程与任务中心", "folder": "docs/70-展示分析", "text": "﻿# 订单日程与任务中心  ## 定位  订单日程与任务中心是工作台上的事务处理入口，目标是让用户登录后快速看到自己需要关注、处理、指派或追踪的工作。  ## 订单日程  订单日程向里程碑负责人展示需要关注的订单里程碑计划，按日期和 FlowSpace 聚合展示。  ### 计划负责人来源  FlowSpace 设置-计划管理支持设置默认负责人。创建或编辑订单时，各里程碑负责人默认按规则填入。  | 配置项 | 规则 | |---|---| | 所有订单 | 所有订单统一负责人规则 | | 按条件区分 | 根据主表单字段条件，为不同订单设置不同负责人 | | 可选负责人 | 订单创建人、FlowSpace 内部成员、FlowSpace 内协作团队成员 | | 条件字段范围 | 主表单模板字段；运算符后选择的其他字段也限制在主表单范围 |  创建或编辑订单时，如果字段数据满足条件，里程碑负责人自动按配置填入。  ### 工作台展示  订单日程按日历展示计划开始和计划结束信息。  | 项目 | 说明 | |---|---| | 计划截止 | 展示计划结束时间到达但当前还未结束的里程碑 | | 计划开始 | 展示计划开始时间到达但当前还未开始的里程碑 | | 日期标识 | 日期上展示开始或截止标识，点击日期查看当天明细 | | 分组 | 明细以 FlowSpace 分组，协作 FlowSpace 显示所属团队名称 | | 跳转 | 点击行跳转订单详情并定位到对应里程碑 |  计划今天截止展示订单标识、里程碑名称、工单完成进度、工单批复完成进度。计划今天开始展示订单标识和里程碑名称。  ## 任务中心概览  工作台任务数据分为三类：  | 类型 | 说明 | |---|---| | 团队任务 | 当前用户作为协作团队对接人，或有相关任务指派权限时可指派的任务 | | 我的任务 | 当前账号相关的待办、已处理、已完成任务 | | 邮件协作任务 | 当前账号发起或接收的邮件协作任务 |  工作台任务卡片上的数量可点击跳转到任务中心并自动带入过滤条件。  ## 团队任务  团队任务展示当前用户在当前团队有指派权限的任务。  | 状态 | 包含数据 | |---|---| | 待指派 | 里程碑进行中，任务未指派，且任务仍可处理 | | 已指派 | 里程碑进行中，任务已指派 | | 已完成 | 里程碑已完成或已取消，或工单已批复、已终止采集等不可编辑状态 |  团队任务默认展示“待指派”。标签和主菜单需要展示待指派任务数角标。  ## 我的任务  我的任务展示当前用户可以采集、批复或处理的任务。  | 状态 | 包含数据 | |---|---| | 待处理 | 当前用户尚未完成处理，任务仍处于可编辑状态 | | 已处理 | 当前用户已处理，但任务整体仍处于进行中 | | 已完成 | 任务因里程碑完成、取消、工单批复、终止采集等进入不可编辑状态 |  协作团队未指派的任务，会显示在有权限成员的待处理中。有指派权限的协作方成员直接处理任务后，视为指派给自己并已处理。  ## 我发起的  “我发起的”展示当前用户在当前团队下发出的工单或里程碑批复任务。  | 状态 | 包含数据 | |---|---| | 进行中 | 里程碑进行中，工单未批复、未终止采集 | | 已完成 | 里程碑已完成或已取消，或工单已批复、已终止采集 |  默认展示“进行中”。  ## 我关注的  “我关注的”展示用户在我的任务、团队任务、我发起的中标星的任务。  | 状态 | 规则 | |---|---| | 全部 | 展示当前仍有查看权限的标星任务 | | 进行中 | 标星任务仍处于可处理或进行状态 | | 已完成 | 标星任务已进入不可编辑状态 |  当标星任务失去查看权限时，不展示。  ## 邮件协作任务  邮件协作任务包括“我发起的”和“我协作的”。  | 类型 | 规则 | |---|---| | 我发起的 | 展示当前用户发起且当前有查看权限的邮件协作 | | 我协作的 | 展示当前邮箱账号收到的邮件协作，不区分当前团队 |  邮件协作“我发起的”以工单为分组单位，进行中表示原工单仍可编辑；已完成表示原工单进入不可编辑状态。  邮件协作“我协作的”默认展示待处理。待处理指原工单仍可编辑且当前协作邮箱未提交；已处理指已提交但原工单仍可编辑；已完成指原工单已不可编辑。  ## 任务卡片通用规则  任务卡片通常展示订单标识、FlowSpace 名称、里程碑、工单、计划结束时间、完成度和操作按钮。  | 元素 | 规则 | |---|---| | 计划结束 | 到今天及以前的计划结束时间标红 | | 完成度 | 工单采集完成度按已提交表单数 / 有采集人的表单总数计算 | | 跳转 | 订单标识进入订单详情，FlowSpace 名称进入订单列表，工单打开工单弹窗 | | 操作按钮 | 根据采集、批复、指派、修改处理人等权限展示 | | 星标 | 采集任务和批复任务分别星标 | | 已完成说明 | 显示第一次触发完成的原因和时间 |  ## 查询与排序  任务中心支持模糊搜索和筛选。  | 能力 | 说明 | |---|---| | 默认排序 | 最近发起，即按任务发起时间倒序 | | 可选排序 | 最早发起，即按任务发起时间正序 | | 模糊搜索 | 支持订单标识、里程碑名称、工单名称、FlowSpace 名称 | | 邮件协作搜索 | 邮件协作“我协作的”支持主题和订单标识搜索 | | 计划结束时间 | 对应里程碑计划结束时间 | | 任务更新时间 | 对应每项任务的最终操作时间 | | 任务完成时间 | 任务变更为已完成或不可编辑状态的时间 |  ## 关联页面  - [工作台与FlowSpace入口](./工作台与FlowSpace入口.md) - [邮件协作](../60-协作通知与自动化/邮件协作.md) - [工单采集与批复](../30-业务流程/工单采集与批复.md) - [里程碑](../20-业务对象/里程碑.md)  ## 来源  - `source:thoughts-v2-current/v2.3.x/贸易端/【贸易端】【工作台】订单日程、任务中心、常用视图.md` - `source:thoughts-v2-current/v2.0.x/贸易端/【贸易端】【工作台】工作台、创建SCCS、SCCS分组.md` "}, {"path": "docs/80-日志审计/README.md", "title": "README", "folder": "docs/80-日志审计", "text": "﻿# 80 日志审计  本目录沉淀所有可追溯记录。  ## 已沉淀页面  - [设置操作日志.md](./设置操作日志.md) - [订单跟踪记录.md](./订单跟踪记录.md) - [动态与评论.md](./动态与评论.md) - [历史记录与快照.md](./历史记录与快照.md) - [系统与集成执行日志.md](./系统与集成执行日志.md)  ## 审计分类  - 设置操作日志：团队、FlowSpace、协作 FlowSpace、资源库等配置变更。 - 订单跟踪记录：订单级关键业务节点。 - 动态与评论：工单、里程碑批复的协作过程和评论。 - 历史记录与快照：字段级变更前后快照。 - 系统与集成执行日志：公式、自动化、外部 API、软件更新等系统来源记录。"}, {"path": "docs/80-日志审计/动态与评论.md", "title": "动态与评论", "folder": "docs/80-日志审计", "text": "﻿# 动态与评论  ## 定位  动态是工单和里程碑批复级别的过程记录，用于展示采集、批复、指派、修改处理人、终止采集、互用、评论等事件。动态同时承担协作评论入口和未读角标提示。  ## 动态类型  | 类型 | 说明 | |---|---| | 修改 | 创建工单、采集工单、批复工单、创建或编辑里程碑批复等 | | 评论 | 成员在工单或里程碑批复动态中发表评论 | | 其他 | 指派、修改处理人、终止采集、工单互用、取消互用等 |  动态按操作时间正序排序。  ## 工单动态  有工单动态的页面包括查看工单、工单采集、工单批复。动态按钮数字角标表示当前成员上次打开这些页面之后新增的评论数。  ### 参与人  工单动态参与人包括：  1. 工单发起人。 2. 采集人。 3. 批复人。 4. 里程碑批复人。  对接人或负责人未指派时，处理人头像显示协作团队头像；已指派后展示对应协作成员头像并增加协作标识。已提交的采集人、批复人头像展示已提交标识。  ### 过滤  | 过滤项 | 说明 | |---|---| | 所有 | 展示所有类型动态 | | 仅评论 | 只展示评论类动态，默认过滤该项 | | 仅修改历史 | 只展示修改表单类型动态，此类动态可查看编辑历史记录 |  ### 典型记录  | 操作 | 动态文案 | |---|---| | 创建工单 | `$操作人 创建了工单` | | 导入工单 | `$操作人 导入工单` | | 采集工单或修改工单采集部分 | `$操作人 编辑了工单` | | 批复工单 | `$操作人 批复了工单，工单无法继续编辑` | | 协作方指派采集 | `$操作人 将工单任务指派给 $被指派人...` | | 协作方指派批复 | `$操作人 将工单批复任务指派给 $被指派人...` | | 修改采集人 | `$操作人 将工单任务处理人修改为 $修改后成员...` | | 修改批复人 | `$操作人 将工单批复人修改为 $修改后成员...` | | 终止采集 | `$操作人 终止采集，工单无法继续编辑` | | 工单互用于 | `$操作人 将此工单互用于 $订单标识` | | 取消互用 | `$操作人 取消 $订单标识 互用此工单` |  修改处理人前后不一致时才记录。  ## 里程碑批复动态  有里程碑批复动态的页面为查看里程碑批复。动态按钮数字角标表示当前成员上次打开页面之后新增的评论数。  ### 参与人  里程碑批复动态参与人包括发起人和里程碑批复人。协作团队未指派时展示协作团队头像；已指派后展示具体协作成员头像并增加协作标识。  ### 典型记录  | 操作 | 动态文案 | |---|---| | 创建里程碑批复 | `$操作人 创建了里程碑批复` | | 里程碑批复 | `$操作人 编辑了里程碑批复` | | 协作方指派里程碑批复 | `$操作人 将里程碑批复任务指派给 $被指派人...` | | 修改里程碑批复人 | `$操作人 将里程碑批复人修改为 $修改后成员...` | | 协作方修改批复指派 | `$操作人 将其团队的里程碑批复人修改为 $被指派人...` |  ## 评论与通知  评论支持 @ 成员、@ 团队和 @ 所有参与者。  | @对象 | 通知规则 | |---|---| | @成员 | 仅通知对应成员 | | @团队 | 通知该团队下参与当前工单或里程碑批复的成员 | | @所有参与者 | 当前工单或里程碑批复的所有参与成员都收到消息和邮件 | | 不@成员 | 不发送通知，仅在详情页面动态按钮上显示未读角标 |  成员支持按姓名或邮箱模糊搜索；团队支持按团队名称或简称模糊搜索。  工单评论可 @ 工单发起人、当前采集人、当前工单批复人、里程碑批复人，以及这些身份所属团队。里程碑批复评论可 @ 发起人、当前里程碑批复人及相关团队。  ## 采集端一致性  采集端任务详情页中的工单动态和里程碑批复动态，数据与操作规则同贸易端。采集端参与评论、查看动态时，应复用同一套动态记录和未读角标规则。  ## 关联页面  - [工单采集与批复](../30-业务流程/工单采集与批复.md) - [移动端采集](../30-业务流程/移动端采集.md) - [消息中心与实时通知](../60-协作通知与自动化/消息中心与实时通知.md) - [历史记录与快照](./历史记录与快照.md)  ## 来源  - `source:thoughts-v2-current/v2.2.x/贸易端/【贸易端】【订单详情】工单&里程碑批复操作.md` - `source:thoughts-v2-current/v2.3.x/贸易端/【贸易端】【工单视图】批量操作：批量发邮件协作、批量采集.md` - `source:thoughts-v2-current/v2.3.x/采集端/【采集端】【任务详情页】工单、工单批复、里程碑批复详情页.md` "}, {"path": "docs/80-日志审计/历史记录与快照.md", "title": "历史记录与快照", "folder": "docs/80-日志审计", "text": "﻿# 历史记录与快照  ## 定位  历史记录用于查看订单主表单、工单、里程碑批复、资源库数据和邮件协作等实体在创建、编辑、采集、批复、导入、同步过程中的字段快照。它回答“某次修改前后字段值是什么”。  ## 通用展示规则  历史记录通常由左侧操作记录和右侧历史快照组成。  | 区域 | 说
