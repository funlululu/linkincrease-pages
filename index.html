 | 工单表单互用跨订单且包含订单内关联引用时，是阻止整表互用，还是复制时跳过关联引用并复制其余字段 | 工单表单互用、订单引用、字段显隐、同步、测试 | 待确认 | 产品和研发确认首期策略，并补充异常提示、服务端校验和测试矩阵 | | Q013 | 工单表单互用的“有效来源数据”是否完全按服务端已保存版本判断 | 工单表单版本、采集草稿、提交校验、历史快照 | 待确认 | 研发确认表单版本能力，形成来源版本、未保存修改和提交失败处理矩阵 | | Q014 | 资源库数据围栏隐藏引用展示字段时，关联引用标签、详情抽屉和历史记录的脱敏文案是否需要统一 | 资源库数据围栏、关联引用、订单表单展示、历史记录 | 待确认 | 确认隐藏字段的统一展示形态、可跳转规则和历史记录过滤口径 | | Q015 | 实验室检验最终结算规则、报价口径和多币种金额是否进入首期业务闭环 | 实验室检验、检测套餐、报价、报表、结算 | 待确认 | 先将检测价格作为检测套餐/项目结构化字段和可展示信息沉淀；结算规则待业务确认后单独入库 |  ## 当前待补充来源  | 内容 | 需要补充 | |---|---| | 邮件、短信、通知规则及模板 | 多份需求引用该材料，但最新源中未见独立完整文档 | | 权限矩阵表 | 多处引用钉钉表格，需要导出并入库为可追溯材料 | | 第三方 API / PDF 导入字段整理 | 需求中有外部链接和嵌入说明，建议整理为本地文档 | | 线上实际菜单结构 | 需要与当前产品版本核对，确认知识库功能地图是否与线上一致 | | 截图资源 | 需求文档中大量截图仍为远程链接，建议批量下载并建立本地映射 |  ## 处理原则  1. 不确定内容不直接写成最终规则；先标注来源和假设。 2. 如果多个需求文档冲突，以更晚版本或产品确认结果为准。 3. 一旦问题确认，需要同步更新对应知识页、来源台账、metadata 和本页状态。 4. SCCS 更名为 FlowSpace 已按当前口径处理；后续新增需求若仍出现 SCCS，正文继续映射为 FlowSpace。 4. 与权限、状态、数据写入优先级相关的问题优先处理，因为它们会影响多个模块。  ## 关联页面  - [来源入库状态](./来源入库状态.md) - [外部链接快照清单](./外部链接快照清单.md) - [待办与问题池](../../99-待办与问题池.md)", "domain": "知识库管理", "module": "版本历史与来源治理", "tags": "待确认问题;待补充来源;冲突处理", "sources": []}, {"path": "docs/90-版本历史与来源治理/来源入库状态.md", "title": "来源入库状态", "folder": "docs/90-版本历史与来源治理", "text": "# 来源入库状态  ## 定位  本页用于追踪 `最新需求源（source:thoughts-v2-current）` 原始材料与标准知识页之间的入库关系，回答三个问题：  1. 哪些原始需求已经被归类。 2. 哪些原始需求已经抽取进标准知识页。 3. 哪些模块还需要继续拆页、补来源或校验。  ## 当前总览  | 项目 | 当前状态 | |---|---| | 来源清单总量 | 87 份（最新需求源 74 份、历史参考源 13 份） | | 已归类状态 | 已完成一级归类 | | 已建立来源元数据 | `metadata/sources.csv` | | 已接入最新来源层 | `最新需求源（source:thoughts-v2-current）` | | 已建立最新来源清单 | `metadata/source-manifest.csv` | | 已建立来源差异清单 | `metadata/source-diff.csv` | | 已建立知识页元数据 | `metadata/documents.csv` | | 已建立检索索引 | `metadata/search-index.json` | | 原始资料处理方式 | `最新需求源（source:thoughts-v2-current）` 作为唯一最新来源层；旧 `需求文档/` 不再保留 | | 历史产品文档处理方式 | `source:product-docs-legacy` 作为低权威参考来源，只抽取战略、角色、指标和路线图框架 | | 最近来源复核 | 2026-09-04 已完成转换器 v4 全量重导复核；64 份旧来源仅为导出格式刷新，4 份实际变更已完成知识页、权限、状态、日志、来源台账和 metadata 入库 |  ## 已建知识页模块  | 模块 | 当前沉淀结果 | |---|---| | 产品端 | 运营端、贸易端、采集端、三端数据关系、账号与个人中心 | | 入门与战略 | 产品战略与定位、用户角色与场景、产品指标与路线图 | | 业务对象 | FlowSpace、订单、工单与批复、资源库、团队与协作团队、里程碑、业务模板、资源库模板 | | 业务流程 | 从模板到 FlowSpace、订单生命周期、工单采集与批复、跨团队协作、资源库引用与同步、自动化执行、移动端采集、订单复用关系 | | 权限与安全 | 权限体系总表、团队权限、FlowSpace 业务角色权限、协作 FlowSpace 权限、数据围栏、资源库权限、仪表盘与报告权限 | | 模板表单与数据 | 表单设计组件、表单属性与显隐设置、公式函数、PDF 与批量导入导出、第三方数据对接、验货组件流程 | | 协作通知与自动化 | 消息中心与实时通知、邮件协作、批量邮件协作、自动化配置、自动化与系统执行日志 | | FlowSpace 数据协同 | FlowSpace 数据移交、FlowSpace 数据互通、跨 FlowSpace 数据整合实例 | | 展示分析 | 工作台与 FlowSpace 入口、订单日程与任务中心、常用视图与视图设置、仪表盘管理与设计器、报告管理与权限 | | 日志审计 | 设置操作日志、订单跟踪记录、动态与评论、历史记录与快照、系统与集成执行日志 |  ## 待继续建设模块  | 模块 | 说明 | 建议优先级 | |---|---|---| | 运营端平台管理细页 | 已有总纲，后续拆用户、团队、FlowSpace、资源库、软件管理等平台监管后台细页 | P1 | | 采集端任务细页 | 已有总纲，后续拆登录、首页、任务列表、任务搜索、任务详情、消息中心、我的 | P1 | | 账号与个人中心细则 | 已创建账号与个人中心页，后续补邮件模板、语言持久化流程图和截图资产 | P2 | | 资源库分享与细则 | 分享链接、游客操作、FlowSpace 应用数据范围、视图细则 | P2 | | 字段级矩阵 | 权限矩阵、组件属性矩阵、日志文案矩阵、异常提示矩阵 | P2 | | 历史 PRD 差异校验 | 将 `source:product-docs-legacy` 中三端 PRD 草案逐项与最新需求源比对，确认是否存在仍有效但未入库内容 | P2 |  ## 入库状态定义  | 状态 | 说明 | |---|---| | 已归类 | 已确定原始需求所属模块，但未必完整抽取 | | imported | 已进入 `metadata/sources.csv` 来源台账 | | authoritative | 已形成标准知识页，可作为当前知识库口径 | | draft | 仍作为问题池或过程文档，需要后续确认 | | 待校验 | 需求之间存在冲突，或需要与线上版本、产品负责人确认 | | 待补充来源 | 需求中引用了外部表格、外部链接或未入库材料 |  ## 维护动作  新增或更新需求文档时，按以下顺序处理：  1. 将所思在线内容同步到 `最新需求源（source:thoughts-v2-current）`。 2. 运行 `python scripts\\scan_source_manifest.py`，更新 `metadata/source-manifest.csv` 和 `metadata/source-diff.csv`。 3. 更新 [需求文档来源台账](../../05-需求文档来源台账.md)。 4. 更新 `metadata/sources.csv`。 5. 抽取或更新对应 `docs/` 知识页。 6. 更新 `metadata/documents.csv` 和 `metadata/search-index.json`。 7. 如果存在冲突或缺口，更新 [待确认问题](./待确认问题.md)。  ## 关联文件  - [需求文档来源台账](../../05-需求文档来源台账.md) - [待办与问题池](../../99-待办与问题池.md) - [documents.csv](../../metadata/documents.csv) - [sources.csv](../../metadata/sources.csv) - [source-roots.csv](../../metadata/source-roots.csv) - [source-manifest.csv](../../metadata/source-manifest.csv) - [source-diff.csv](../../metadata/source-diff.csv) - [search-index.json](../../metadata/search-index.json)", "domain": "知识库管理", "module": "版本历史与来源治理", "tags": "来源追溯;入库状态;metadata;需求文档", "sources": []}, {"path": "docs/90-版本历史与来源治理/版本变更记录.md", "title": "版本变更记录", "folder": "docs/90-版本历史与来源治理", "text": "﻿# 版本变更记录  ## 定位  本页记录 Linkincrease 知识库本身的建设版本，而不是产品线上版本。它用于追踪每一轮知识库新增了哪些模块、补了哪些索引、还留下哪些下一步工作。  ## 当前版本  | 项目 | 内容 | |---|---| | 当前知识库版本 | v0.1 | | 当前阶段 | 标准知识库首轮搭建 | | 最近更新日期 | 2026-09-04 | | 当前状态 | 已完成主体目录、核心对象、流程、权限、配置、协作通知、展示分析、日志审计和来源管理首版 |  ## 变更记录  | 日期 | 版本 | 变更 | |---|---|---| | 2026-05-25 | v0.1-init | 建立根目录总览、维护规范、产品总览、术语、功能地图、知识库架构、来源台账、工程架构、待办池 | | 2026-05-25 | v0.1-objects | 建立业务对象首批页面：FlowSpace、订单、工单与批复、资源库、团队与协作团队、里程碑、业务模板、资源库模板 | | 2026-05-25 | v0.1-flows | 建立业务流程首批页面：从模板到 FlowSpace、订单生命周期、工单采集与批复、跨团队协作、资源库引用与同步、自动化执行、移动端采集、订单复用关系 | | 2026-05-25 | v0.1-permission | 建立权限体系总表及团队、FlowSpace、协作方、数据围栏、资源库、仪表盘与报告权限页面 | | 2026-05-25 | v0.1-config | 建立模板表单与数据页面：表单组件、显隐设置、公式函数、导入导出、第三方数据、验货组件流程 | | 2026-05-25 | v0.1-collab | 建立协作通知与自动化页面：消息中心、邮件协作、批量邮件协作、自动化配置、系统执行日志 | | 2026-05-26 | v0.1-display | 建立展示分析页面：工作台与 FlowSpace 入口、订单日程与任务中心、常用视图与视图设置、仪表盘管理与设计器、报告管理与权限 | | 2026-05-26 | v0.1-audit | 建立日志审计页面：设置操作日志、订单跟踪记录、动态与评论、历史记录与快照、系统与集成执行日志 | | 2026-05-26 | v0.1-source | 建立来源与待办管理页：来源入库状态、待确认问题、外部链接快照清单、版本变更记录 | | 2026-05-26 | v0.1-rename-flowspace | 将知识库正文标准术语由 SCCS 更名为 FlowSpace（流空间）；历史来源文件名和 `source:` 引用保留 SCCS 原名用于追溯 | | 2026-05-26 | v0.1-share-site | 初始化本地 Git 管理底座，新增只读静态站点生成脚本和团队共享发布方案，并将 Skill 调整为可配置知识库路径 | | 2026-06-25 | v0.1-flowspace-transfer | 入库 FlowSpace 数据移交、通用条件规则、通用交互规范三份来源，并补充订单、里程碑、工单、权限、消息和日志相关引用 | | 2026-07-22 | v0.1-flowspace-interoperability | 入库 FlowSpace 数据互通、自动化权限运营端管理、验货组件 v2.8 新口径，并补充批量采集、系统自动计算、团队权限、数据层级和执行日志规则 | | 2026-07-28 | v0.1-inspection-transfer-refresh | 同步尺寸检验组件新来源文件名和无法判定口径，补充 Excel 导入、生成记录、统计、补测和采集端规则；同步 FlowSpace 数据移交中订单负责人默认无权限、需通过自定义权限配置的结论 | | 2026-08-13 | v0.1-agent-memory-pm-workbench | 按 Chat Memory / Skill / Wiki / System Map 分层补充知识资产地图；新增产品经理知识库工作台、产品需求影响分析清单和 `linkincrease-product-manager` Skill；扩展决策记录模板；静态站构建改为自动打包 `skills/` 下全部 Codex Skill | | 2026-08-14 | v0.1-ops-professional-knowledge | 建立运营专业知识五层结构；新增运营专业知识建设路线图、5 个 P0 行业场景页、5 个客户方案页、客户访谈/30天复盘 SOP、运营专业方案设计 Skill 和客户样本复盘目录；更新产品成功 Skill 调用路径 | | 2026-08-14 | v0.1-digital-supply-chain | 新增 `56-数字供应链专项知识`，补充数字供应链基础框架、成熟度模型、系统地图与边界、主数据与业务数据治理、协同平台能力模型、可视化与预警体系、Linkincrease 数字供应链定位，并接入 AGENTS、docs 总入口和产品成功 Skill | | 2026-08-19 | v0.1-demo-pattern-governance | 新增需求 Demo 输出规范、Demo 视觉与页面规范、页面母版沉淀规范、UI pattern/style token metadata 和 `linkincrease-demo-prototype` Skill；明确知识库只沉淀共享页面规则，不依赖本地 prototype 路径 | | 2026-08-19 | v0.1-public-site-skill-hide | 优化静态站生成脚本：默认不在页面导航、搜索、站点地图和下载区展示 `skills/`，并限制公开站点只扫描根目录 Markdown、`docs/`、`sources/`、`templates/` | | 2026-08-19 | v0.1-skill-routing | 新增 `skills/README.md` 和 `metadata/skills.csv`，将 Skill 从普通知识文档目录中分离，明确需求、PRD、客户方案和 Demo 的调用边界，避免 Demo Skill 影响普通需求输出 | | 2026-08-26 | v0.1-demo-quality-gates | 优化 `linkincrease-demo-prototype`：新增业务闭环、Linkincrease 平台能力映射和复杂交互质量门槛，要求 Demo 覆盖跨端影响、数据写回、异常/权限/回退待确认和审计监控 | | 2026-08-27 | v0.1-resource-workorder-sync | 同步 6 份最新需求来源：新增工单表单互用与复制、资源库快捷创建引用数据、资源库数据围栏三页，并刷新订单子表模式、FlowSpace 数据移交和尺寸检验组件口径；更新来源映射、待确认问题和 metadata | | 2026-09-04 | v0.1-lab-inspection-restore-sync | 同步 4 份最新需求来源：新增工单还原采集、实验室检验流程两页；刷新尺寸检验配置更新口径，并将 FlowSpace 数据移交来源路径迁移为 `FS 数据移交.md`；完成来源转换器 v4 全量重导复核，确认其余 64 份旧来源为导出格式刷新，并更新 87 份来源清单基线 |  ## 后续版本建议  | 版本 | 目标 | |---|---| | v0.2 | 补运营端平台管理：用户、团队、FlowSpace、资源库、软件管理 | | v0.3 | 补采集端完整产品端：登录、首页、任务列表、任务搜索、任务详情、消息中心、我的 | | v0.4 | 补账号与个人中心、资源库分享、订单列表细则、工单视图细则 | | v0.5 | 建立字段级矩阵：权限矩阵、日志文案矩阵、表单组件属性矩阵、异常提示矩阵 | | v0.6 | 批量导出外部链接与截图，建立 `metadata/external-links.csv` | | v1.0 | 完成原始需求全量抽取、来源可追溯、检索索引稳定，可作为团队正式知识库 |  ## 发布检查清单  每次知识库版本更新前，至少检查：  1. 新增知识页是否加入对应目录 README。 2. 根 README 阅读路径是否需要更新。 3. `metadata/documents.csv` 是否有对应记录。 4. `metadata/sources.csv` 是否补充来源。 5. `metadata/search-index.json` 是否能解析。 6. ID 是否唯一。 7. 待确认问题是否有新增或状态变化。  ## 关联页面  - [来源入库状态](./来源入库状态.md) - [待确认问题](./待确认问题.md) - [外部链接快照清单](./外部链接快照清单.md)", "domain": "知识库管理", "module": "版本历史与来源治理", "tags": "版本变更;知识库版本;发布检查", "sources": []}, {"path": "docs/90-版本历史与来源治理/知识资产地图.md", "title": "知识资产地图", "folder": "docs/90-版本历史与来源治理", "text": "# 知识资产地图  本页用于把知识库从“文档集合”拆成可治理、可检索、可被 AI Agent 调用的知识资产。它对应团队记忆的四类资产：Chat Memory、Skill、Wiki、CodeGraph / System Map。  ## 资产分层  | 资产类型 | 在本仓库中的形态 | 主要用途 | 维护要求 | | --- | --- | --- | --- | | Wiki | `docs/00` 到 `docs/90` 的权威知识页 | 产品规则、业务对象、流程、权限、指标、行业知识 | 每页登记到 `metadata/documents.csv`，有状态、路径、标签和更新时间 | | Skill | `skills/*/SKILL.md` 与 `docs/50-运营支持知识/08-工作技能` | 把可重复工作变成可执行流程 | 写清适用场景、输入、必读知识页、输出格式和验收标准 | | UI Pattern | `docs/70-产品维护知识`、`metadata/ui-patterns.csv`、`metadata/ui-style-tokens.csv` | 约束需求 Demo、页面原型和交互样例的布局与视觉一致性 | 只记录共享规则、页面模式、token 和验收清单，不依赖本地 prototype 路径 | | Chat Memory | 客户沟通、会议纪要、内部讨论、项目复盘沉淀后的摘要 | 保留“为什么会这样问、这样做、这样决定”的上下文 | 先沉淀为客户反馈、需求池、决策记录或待确认问题，不直接写入权威规则 | | CodeGraph / System Map | `docs/20`、`docs/30`、`docs/40`、`docs/80`、`docs/99` | 分析对象关系、流程影响、权限边界和技术影响 | 重要对象、状态、权限和接口变化要同步到图谱或索引 |  ## 使用边界  | 问题类型 | 优先资产 | 不建议 | | --- | --- | --- | | 产品规则是什么 | Wiki | 只凭客户案例或旧需求下结论 | | 这个需求怎么写 | Skill + Wiki | 直接从聊天生成完整 PRD | | 这个需求要做 Demo | UI Pattern + Skill + Wiki | 从空白页随机生成界面，或依赖维护者本地 prototype 文件 | | 为什么当时这么设计 | 决策记录 + 来源治理 | 只看最终规则，不看取舍原因 | | 客户问题怎么处理 | 产品成功 Skill + 运营 SOP | 把临时配置写成通用产品能力 | | 改动会影响哪里 | System Map + 权限/数据页 | 只按关键词查单页文档 | | 本周知识库要更新什么 | Chat Memory 摘要 + metadata | 把零散聊天原文全部塞进正文 |  ## AI Agent 装备建议  | Agent 角色 | 推荐装载资产 | 典型任务 | | --- | --- | --- | | Product Manager | `AGENTS.md`、`docs/README.md`、`docs/70`、`docs/90`、`skills/linkincrease-product-manager` | 需求澄清、影响分析、决策记录、版本复盘 | | Requirement Designer | `docs/10`、`docs/20`、`docs/30`、`docs/40`、`skills/linkincrease-requirement-design` | PRD、验收标准、权限/状态/日志设计 | | Demo Prototype | `docs/70-产品维护知识/需求Demo输出规范.md`、`docs/70-产品维护知识/Demo视觉与页面规范.md`、`metadata/ui-patterns.csv`、`metadata/ui-style-tokens.csv`、`skills/linkincrease-demo-prototype` | 生成或评审符合 Linkincrease 页面模式的 Demo、HTML 原型和交互样例 | | Product Success | `docs/50`、`docs/55`、`docs/60`、`skills/linkincrease-product-success` | 客户诊断、上线方案、配置方案、问题排查 | | Reviewer / QA | `docs/45`、`docs/40`、`docs/99` | 回归范围、异常边界、权限测试、缺口检查 |  ## 知识入库流转  flowchart TD A[\"客户反馈 / 会议纪要 / 内部讨论\"] --> B{\"是否已确认?\"} B -- \"否\" --> C[\"待确认问题 / 客户反馈 / 需求池\"] B -- \"是\" --> D{\"沉淀类型\"} D -- \"产品规则\" --> E[\"docs/10-40 权威页\"] D -- \"工作方法\" --> F[\"docs/50/08 或 skills/\"] D -- \"指标口径\" --> G[\"docs/60 数据分析支持\"] D -- \"产品取舍\" --> H[\"docs/70 决策记录\"] D -- \"来源/版本\" --> I[\"docs/90 治理页\"] E --> J[\"metadata/documents.csv\"] F --> J G --> J H --> J I --> J  ## 维护节奏  1. 每次新增文档后，更新对应目录 README、`metadata/documents.csv` 和必要的索引页。 2. 每周复盘客户问题、需求讨论和产品决策，把可复用内容转成 FAQ、SOP、Skill 或决策记录。 3. 每月检查一次高频关键词是否过度触发，例如 CAP、供应商治理、仪表盘、自动化、资源库、权限。 4. 旧文档不确定时先标记为 `reference` 或 `deprecated`，不要直接删除。", "domain": "知识库管理", "module": "版本历史与来源治理", "tags": "知识资产;Chat Memory;Skill;Wiki;System Map;Agent", "sources": []}, {"path": "docs/99-图谱与索引/Mermaid图表索引.md", "title": "Mermaid 图表索引", "folder": "docs/99-图谱与索引", "text": "# Mermaid 图表索引  本页用于集中记录可复用 Mermaid 图表。  ## 当前图表  - [数据结构图](./数据结构图.md) - [页面关系图](./页面关系图.md) - [流程图索引](../30-业务流程与产品流程图/流程图索引.md)  ## 维护规则  1. Mermaid 代码保留在 Markdown 文档中，便于复制和版本管理。 2. 图表应配套说明适用场景和关联权威文档。 3. 修改图表时同步检查涉及的对象、流程、权限和数据模型页面。 ", "domain": "公共能力", "module": "图谱与索引", "tags": "99-图谱与索引;Mermaid 图表索引", "sources": []}, {"path": "docs/99-图谱与索引/README.md", "title": "99 图谱与索引", "folder": "docs/99-图谱与索引", "text": "# 99 图谱与索引  本目录用于集中管理功能地图、数据结构图、业务流程图、权限矩阵、页面关系图和 Mermaid 图表索引。  ## 页面  - [功能地图](./功能地图.md) - [数据结构图](./数据结构图.md) - [业务流程图](./业务流程图.md) - [权限矩阵](./权限矩阵.md) - [页面关系图](./页面关系图.md) - [Mermaid 图表索引](./Mermaid图表索引.md) ", "domain": "公共能力", "module": "图谱与索引", "tags": "99-图谱与索引;99 图谱与索引", "sources": []}, {"path": "docs/99-图谱与索引/业务流程图.md", "title": "业务流程图", "folder": "docs/99-图谱与索引", "text": "# 业务流程图  本页用于集中维护业务流程图索引。  ## 入口  - [流程图索引](../30-业务流程与产品流程图/流程图索引.md) - [从模板到 FlowSpace](../30-业务流程与产品流程图/从模板到FlowSpace.md) - [订单生命周期](../30-业务流程与产品流程图/订单生命周期.md) - [工单采集与批复](../30-业务流程与产品流程图/工单采集与批复.md) - [资源库引用与同步](../30-业务流程与产品流程图/资源库引用与同步.md) ", "domain": "公共能力", "module": "图谱与索引", "tags": "99-图谱与索引;业务流程图", "sources": []}, {"path": "docs/99-图谱与索引/功能地图.md", "title": "功能地图", "folder": "docs/99-图谱与索引", "text": "# 功能地图  功能地图用于从产品能力视角索引 Linkincrease 功能模块。  ## 模块入口  - [工作台](../10-功能模块详情/工作台.md) - [FlowSpace](../10-功能模块详情/FlowSpace.md) - [业务模板](../10-功能模块详情/业务模板.md) - [订单](../10-功能模块详情/订单.md) - [工单与批复](../10-功能模块详情/工单与批复.md) - [资源库](../10-功能模块详情/资源库.md) - [表单设计器](../10-功能模块详情/表单设计器.md) - [自动化](../10-功能模块详情/自动化.md) - [消息通知](../10-功能模块详情/消息通知.md) - [仪表盘与报表](../10-功能模块详情/仪表盘与报表.md) - [设置与权限](../10-功能模块详情/设置与权限.md) ", "domain": "公共能力", "module": "图谱与索引", "tags": "99-图谱与索引;功能地图", "sources": []}, {"path": "docs/99-图谱与索引/数据结构图.md", "title": "数据结构图", "folder": "docs/99-图谱与索引", "text": "# 数据结构图  本页用于集中维护数据结构相关图表。  ## FlowSpace 核心层级  flowchart LR A[\"业务模板\"] --> B[\"FlowSpace\"] B --> C[\"订单\"] C --> D[\"里程碑\"] D --> E[\"工单\"] E --> F[\"工单批复\"] D --> G[\"里程碑批复\"] C --> H[\"订单主表单字段\"] E --> I[\"工单表单字段\"] B --> J[\"资源库引用\"]  ## 关联文档  - [FlowSpace 数据层级](../20-业务对象与数据模型/FlowSpace数据层级.md) - [模板与实例关系](../20-业务对象与数据模型/模板与实例关系.md) ", "domain": "公共能力", "module": "图谱与索引", "tags": "99-图谱与索引;数据结构图", "sources": []}, {"path": "docs/99-图谱与索引/权限矩阵.md", "title": "权限矩阵", "folder": "docs/99-图谱与索引", "text": "# 权限矩阵  本页用于集中索引权限矩阵和权限规则。  ## 入口  - [权限体系总表](../40-权限、安全与审计/权限体系总表.md) - [团队权限](../40-权限、安全与审计/团队权限.md) - [FlowSpace 业务角色权限](../40-权限、安全与审计/FlowSpace业务角色权限.md) - [协作 FlowSpace 权限](../40-权限、安全与审计/协作FlowSpace权限.md) - [资源库权限](../40-权限、安全与审计/资源库权限.md) - [仪表盘与报告权限](../40-权限、安全与审计/仪表盘与报告权限.md) ", "domain": "公共能力", "module": "图谱与索引", "tags": "99-图谱与索引;权限矩阵", "sources": []}, {"path": "docs/99-图谱与索引/页面关系图.md", "title": "页面关系图", "folder": "docs/99-图谱与索引", "text": "# 页面关系图  本页用于沉淀页面、模块、对象和流程之间的关系。  ## 当前核心关系  flowchart LR A[\"功能模块详情\"] --> B[\"业务对象与数据模型\"] A --> C[\"业务流程与产品流程图\"] A --> D[\"权限、安全与审计\"] A --> E[\"数据分析支持\"] B --> F[\"图谱与索引\"] C --> F D --> F  ## 维护规则  新增页面时，应判断它属于功能入口、权威规则、流程、权限、运营、分析、维护、架构还是图谱索引。 ", "domain": "公共能力", "module": "图谱与索引", "tags": "99-图谱与索引;页面关系图", "sources": []}, {"path": "docs/README.md", "title": "Linkincrease 知识库目录", "folder": "docs", "text": "# Linkincrease 知识库目录  本目录承载 Linkincrease 的标准知识库正文。当前结构按“产品阅读入口 + 权威规则层 + 运营/行业/分析/维护/架构支撑”组织，既方便产品成员阅读，也保留业务对象、流程、权限、数据和审计的权威沉淀。  ## 目录结构  | 目录 | 定位 | | --- | --- | | [00 产品总览与规划](./00-产品总览与规划/README.md) | 产品定位、用户角色、路线图、术语和能力地图 | | [10 功能模块详情](./10-功能模块详情/README.md) | 面向使用者和团队成员的功能模块入口 | | [20 业务对象与数据模型](./20-业务对象与数据模型/README.md) | FlowSpace、订单、工单、资源库、模板、字段和数据层级 | | [30 业务流程与产品流程图](./30-业务流程与产品流程图/README.md) | 从模板到 FlowSpace、订单生命周期、工单采集、资源库同步等流程 | | [40 权限、安全与审计](./40-权限、安全与审计/README.md) | 角色权限、数据围栏、日志、历史记录、系统执行追溯 | | [45 测试支持](./45-测试支持/README.md) | 模块验收、流程索引、数据校验、权限测试、异常边界、回归重点和测试 FAQ | | [50 运营支持知识](./50-运营支持知识/README.md) | 运营场景、客户配置、模板案例、问题处理、最佳实践和 FAQ | | [55 外贸供应链行业知识](./55-外贸供应链行业知识/README.md) | 为产品研发和测试补充行业依据，并提供产品成功应用出口 | | [56 数字供应链专项知识](./56-数字供应链专项知识/README.md) | 数字供应链框架、成熟度、系统边界、数据治理、协同平台能力和 Linkincrease 定位 | | [60 数据分析支持](./60-数据分析支持/README.md) | 指标口径、仪表盘、报表权限、数据来源和分析场景 | | [70 产品维护知识](./70-产品维护知识/README.md) | 竞品分析、用户地图、客户反馈、需求池、决策记录、产品原则和产品经理工作台 | | [80 架构与技术方案](./80-架构与技术方案/README.md) | 系统架构、集成方案、非功能性需求、性能、安全和兼容性 | | [90 版本历史与来源治理](./90-版本历史与来源治理/README.md) | 版本记录、来源台账、待确认问题、知识资产地图、历史文档评估和发布记录 | | [99 图谱与索引](./99-图谱与索引/README.md) | 功能地图、数据结构图、流程图、权限矩阵、页面关系图和 Mermaid 图表索引 |  ## 阅读建议  1. 新成员先读 [产品能力地图](./00-产品总览与规划/产品能力地图.md) 和 [功能模块详情](./10-功能模块详情/README.md)。 2. 写需求时先定位功能模块，再进入业务对象、业务流程、权限审计、数据分析页面校验影响范围。 3. 涉及 FlowSpace、订单、工单、批复、资源库、字段写入或同步时，必须先读 [FlowSpace 数据层级](./20-业务对象与数据模型/FlowSpace数据层级.md)。 4. 测试验收、权限矩阵、异常边界和回归重点进入 [测试支持](./45-测试支持/README.md)。 5. 运营、客户配置和最佳实践进入 [运营支持知识](./50-运营支持知识/README.md)。 6. 行业角色、对象、流程、风险和通行做法进入 [外贸供应链行业知识](./55-外贸供应链行业知识/README.md)，优先服务产品研发和测试，并向产品成功提供诊断和方案输出入口。 7. 数字供应链成熟度、系统边界、主数据治理、协同平台能力和 Linkincrease 定位进入 [数字供应链专项知识](./56-数字供应链专项知识/README.md)。 8. 指标、仪表盘、报表和统计口径进入 [数据分析支持](./60-数据分析支持/README.md)。 9. 产品经理做需求澄清、影响范围分析、产品取舍和周复盘，优先进入 [产品经理知识库工作台](./70-产品维护知识/产品经理知识库工作台.md)。 10. 输出需求 Demo、HTML 原型或页面原型时，先读取 [需求 Demo 输出规范](./70-产品维护知识/需求Demo输出规范.md)、[Demo 视觉与页面规范](./70-产品维护知识/Demo视觉与页面规范.md)、`metadata/ui-patterns.csv` 和 `metadata/ui-style-tokens.csv`。 11. 尚未确认的历史资料、客户反馈或需求候选，不直接写入权威规则页，先进入来源治理、产品维护或待确认问题。", "domain": "公共能力", "module": "README.md", "tags": "README.md;Linkincrease 知识库目录", "sources": []}, {"path": "sources/external/product-docs-legacy.md", "title": "历史产品文档来源层说明", "folder": "sources/external", "text": "# 历史产品文档来源层说明  ## 定位  `source:product-docs-legacy` 表示早期整理的产品文档来源层。它包含产品愿景、问题陈述、用户画像、用户访谈、三端 PRD 草案、路线图、OKR 和 RICE 优先级规划等内容。  该来源层用于补充产品背景、战略假设、用户场景和指标框架，不作为当前功能规则的最高权威来源。  ## 路径规则  维护人本地目录由环境变量 `LINKINCREASE_PRODUCT_DOCS_PATH` 指定。知识库仓库和只读站点只展示 `source:product-docs-legacy/...`，不展示维护人本机绝对路径。  ## 权威等级  | 内容类型 | 使用方式 | | --- | --- | | 产品愿景、定位、价值主张 | 可抽取为入门层战略口径，但需要与当前产品事实保持一致 | | 用户画像、访谈、问题陈述 | 可作为需求设计背景和角色分析输入 | | OKR、路线图、RICE 评分 | 只作为评估框架或历史假设，具体数值和时间需重新确认 | | 三端 PRD 草案 | 只作为历史参考，具体规则必须与最新需求源和标准知识页核对 |  ## 当前入库结果  已抽取为以下正式知识页：  - [产品战略与定位](../../docs/00-产品总览与规划/产品战略与定位.md) - [用户角色与场景](../../docs/00-产品总览与规划/用户角色与场景.md) - [产品指标与路线图](../../docs/00-产品总览与规划/产品指标与路线图.md) - [历史产品文档评估](../../docs/90-版本历史与来源治理/历史产品文档评估.md)  ## 维护建议  1. 不直接复制历史产品文档全文进入 `docs/`。 2. 不用历史 PRD 覆盖 `source:thoughts-v2-current` 已确认的功能规则。 3. 从历史文档中发现仍有效但未入库的内容时，先登记为待确认问题。 4. 术语统一使用 FlowSpace；历史原文中的 SCCS 只在来源路径或必要说明中保留。", "domain": "知识库管理", "module": "来源层", "tags": "来源层;历史产品文档;product-docs-legacy", "sources": [{"title": "10-产品介绍", "version": "common", "product_side": "未识别", "module": "", "last_write_time": "2026-04-30T17:27:54"}, {"title": "PRD产品需求文档-贸易端", "version": "common", "product_side": "贸易端", "module": "", "last_write_time": "2026-04-28T15:51:06"}, {"title": "PRD产品需求文档-运营端", "version": "common", "product_side": "运营端", "module": "", "last_write_time": "2026-04-28T15:51:55"}, {"title": "PRD产品需求文档-采集端", "version": "common", "product_side": "采集端", "module": "", "last_write_time": "2026-04-28T15:53:04"}, {"title": "产品愿景与定位文档", "version": "common", "product_side": "未识别", "module": "", "last_write_time": "2026-04-28T15:47:31"}, {"title": "产品指标体系-OKR", "version": "common", "product_side": "未识别", "module": "", "last_write_time": "2026-04-28T15:57:13"}, {"title": "产品综合定义文档", "version": "common", "product_side": "未识别", "module": "", "last_write_time": "2026-04-28T16:05:59"}, {"title": "产品路线图-0到100", "version": "common", "product_side": "未识别", "module": "", "last_write_time": "2026-04-28T15:55:37"}, {"title": "功能优先级规划-RICE框架", "version": "common", "product_side": "未识别", "module": "", "last_write_time": "2026-04-28T15:54:24"}, {"title": "用户角色与画像", "version": "common", "product_side": "未识别", "module": "", "last_write_time": "2026-04-28T15:49:23"}, {"title": "用户访谈综合报告-InterviewSynthesis", "version": "common", "product_side": "未识别", "module": "", "last_write_time": "2026-04-28T16:04:20"}, {"title": "精益UX画布-LeanUXCanvas", "version": "common", "product_side": "未识别", "module": "", "last_write_time": "2026-04-28T15:46:13"}, {"title": "问题陈述-ProblemStatement", "version": "common", "product_side": "未识别", "module": "", "last_write_time": "2026-04-28T16:03:15"}]}, {"path": "sources/external/thoughts-current.md", "title": "所思最新需求源接入说明", "folder": "sources/external", "text": "# 所思最新需求源接入说明  ## 定位  `最新需求源（source:thoughts-v2-current）` 是从所思在线导出的最新需求文档目录，作为 Linkincrease 知识库的最新来源层。  维护人本地目录由环境变量 `LINKINCREASE_SOURCE_PATH` 指定，知识库仓库和只读站点只展示来源标识，不展示本机绝对路径。  当前知识库根目录下的旧 `需求文档/` 不再保留，也不作为来源维护对象。  ## 来源层分工  | 来源 | 角色 | 使用方式 | | --- | --- | --- | | `最新需求源（source:thoughts-v2-current）` | 最新权威来源层 | 通过扫描脚本生成 manifest 和 diff，作为后续更新知识页的依据 | | `docs/` | 标准知识库正文 | 只沉淀归纳、去重、校验后的稳定口径 | | `metadata/` | 元数据与治理层 | 管理来源根、来源清单、差异、知识页、检索索引 |  ## 同步流程  1. 在 `LINKINCREASE_SOURCE_PATH` 指向的最新需求源本地目录中运行或更新 `thoughts_sync.py`，从所思在线同步最新文档。 2. 回到知识库目录运行：  python scripts\\scan_source_manifest.py  3. 查看 `metadata/source-diff.csv`，判断新增、修改、删除的来源文件。 4. 将影响业务口径的变更抽取到 `docs/` 对应知识页。 5. 更新 `metadata/documents.csv`、`metadata/sources.csv` 和 `metadata/search-index.json`。  ## 文件说明  | 文件 | 说明 | | --- | --- | | `metadata/source-roots.csv` | 外部来源根目录配置 | | `metadata/source-manifest.csv` | 最新来源文件全量清单，包含版本、端、模块、hash、更新时间 | | `metadata/source-diff.csv` | 本次扫描相对上次扫描的差异 | | `scripts/scan_source_manifest.py` | 扫描外部来源并生成 manifest/diff 的脚本 |  ## 注意事项  1. 不把 `.thoughts_sync/` 纳入知识库正文或来源 manifest。 2. 不把浏览器缓存、同步状态数据库、临时文件作为需求材料入库。 3. `*_assets/` 图片目录先暂不纳入 manifest；需要本地化截图资产时，再单独建立图片资产清单。 4. 所有标准知识页仍以 `docs/` 为准，来源文件只作为证据和变更输入。 5. 不再维护知识库内的旧 `需求文档/` 目录，避免双来源。", "domain": "", "module": "", "tags": "", "sources": []}, {"path": "templates/需求文档入库模板.md", "title": "需求文档入库模板", "folder": "templates", "text": "# 需求文档入库模板  ## 1. 基本信息  | 字段 | 内容 | | --- | --- | | 需求名称 |  | | 来源链接 / 文件 |  | | 来源类型 | Teambition / 本地 PRD / 原型 / 会议纪要 / Demo / 其他 | | 权威等级 | A / B / C / D | | 所属模块 |  | | 涉及版本 |  | | 原始创建 / 更新时间 |  | | 入库人 |  | | 入库时间 |  |  ## 2. 一句话结论  用一句话说明这个需求改变了什么产品事实。  ## 3. 背景与目标  - 背景： - 目标： - 非目标：  ## 4. 影响的核心概念  | 概念 | 影响 | | --- | --- | |  |  |  ## 5. 功能规则摘要  | 规则编号 | 规则 | 来源位置 | | --- | --- | --- | | R-001 |  |  |  ## 6. 权限与数据范围  | 对象 | 权限点 | 数据范围 | 说明 | | --- | --- | --- | --- | |  |  |  |  |  ## 7. 状态、异常与边界  - 状态变化： - 异常处理： - 不支持场景：  ## 8. 需要同步到的知识库页面  - [ ] 产品总览 - [ ] 核心概念词典 - [ ] 功能地图 - [ ] 专题页 - [ ] 问题池  ## 9. 待确认问题  | 编号 | 问题 | 建议确认人 | 状态 | | --- | --- | --- | --- | | Q-001 |  |  | 待确认 | ", "domain": "", "module": "", "tags": "", "sources": []}];
    const nav = document.getElementById('nav');
    const search = document.getElementById('search');
    const content = document.getElementById('content');
    const currentPath = document.getElementById('currentPath');
    const mermaidModal = document.getElementById('mermaidModal');
    const mermaidPreview = document.getElementById('mermaidPreview');
    const mermaidClose = document.getElementById('mermaidClose');
    if (window.mermaid) {
      mermaid.initialize({ startOnLoad:false, theme:'base', securityLevel:'loose', themeVariables: {
        fontFamily:'-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif',
        primaryColor:'#eaf4ff',
        primaryTextColor:'#172033',
        primaryBorderColor:'#85bce9',
        lineColor:'#4c83b4',
        secondaryColor:'#dceeff',
        tertiaryColor:'#f8faff',
        noteBkgColor:'#fff',
        noteBorderColor:'#b9d9f7'
      } });
    }
    function normalize(value) { return (value || '').toLowerCase(); }
    function escapeHtml(value) { return String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function displayFolderName(name) {
      return ({
        'docs': '标准知识库',
        'templates': '模板',
        'sources': '来源说明',
        'metadata': '元数据',
        'skills': 'skills'
      })[name] || name;
    }
    function displayPath(path) {
      const parts = path.split('/');
      const folders = parts.slice(0, -1).map(displayFolderName);
      const fileName = (parts[parts.length - 1] || '').replace(/\.md$/i, '');
      if (/^(readme|index)$/i.test(fileName)) return folders.join(' / ') || '知识库首页';
      return folders.join(' / ');
    }
    function renderNav(items) {
      nav.innerHTML = '';
      if (!items.length) {
        const empty = document.createElement('div');
        empty.className = 'empty-state';
        empty.textContent = '没有找到匹配页面';
        nav.appendChild(empty);
        return;
      }
      const current = decodeURIComponent(location.hash.slice(1)) || 'README.md';
      const tree = buildTree(items);
      const searchActive = !!search.value.trim();
      nav.innerHTML = '<div class="nav-tree">' + renderTree(tree, current, searchActive, 0, '') + '</div>';
    }
    function buildTree(items) {
      const root = { dirs: {}, docs: [] };
      for (const doc of items) {
        const parts = doc.path.split('/');
        let node = root;
        for (let i = 0; i < parts.length - 1; i++) {
          if (!node.dirs[parts[i]]) node.dirs[parts[i]] = { dirs: {}, docs: [] };
          node = node.dirs[parts[i]];
        }
        node.docs.push(doc);
      }
      return root;
    }
    function renderTree(node, currentPath, searchActive, depth = 0, prefix = '') {
      const dirKeys = Object.keys(node.dirs).sort((a, b) => a.localeCompare(b, 'zh-Hans-CN', { numeric: true }));
      const docItems = [...node.docs].sort((a, b) => a.title.localeCompare(b.title, 'zh-Hans-CN'));
      let html = '';
      for (const doc of docItems) {
        const active = doc.path === currentPath ? ' active' : '';
        const linkLevel = Math.min(depth, 4);
        const pathHint = displayPath(doc.path);
        html += '<a href="#' + encodeURIComponent(doc.path) + '" data-path="' + doc.path + '" class="nav-link level-' + linkLevel + active + '">';
        html += '<span class="doc-title">' + escapeHtml(doc.title) + '</span>';
        if (pathHint) html += '<span class="folder">' + escapeHtml(pathHint) + '</span>';
        html += '</a>';
      }
      for (const key of dirKeys) {
        const child = node.dirs[key];
        const childPrefix = prefix ? prefix + '/' + key : key;
        const shouldOpen = searchActive || (currentPath && currentPath.startsWith(childPrefix + '/'));
        const groupLevel = Math.min(depth, 4);
        const childLevel = Math.min(depth + 1, 4);
        html += '<details class="nav-group level-' + groupLevel + '"' + (shouldOpen ? ' open' : '') + '>';
        html += '<summary><span class="nav-caret" aria-hidden="true"></span><span class="nav-label">' + escapeHtml(displayFolderName(key)) + '</span><span class="nav-count">' + countDocs(child) + '</span></summary>';
        html += '<div class="nav-items level-' + childLevel + '">';
        html += renderTree(child, currentPath, searchActive, depth + 1, childPrefix);
        html += '</div></details>';
      }
      return html;
    }
    function countDocs(node) {
      let count = node.docs.length;
      for (const key in node.dirs) {
        count += countDocs(node.dirs[key]);
      }
      return count;
    }
    async function loadDoc(path) {
      const doc = docs.find(item => item.path === path) || docs.find(item => item.path === 'README.md') || docs[0];
      if (!doc) return;
      [...nav.querySelectorAll('.nav-group')].forEach(d => d.removeAttribute('open'));
      let el = nav.querySelector('a[data-path="' + doc.path.replace(/"/g, '\"') + '"]');
      while (el && el !== nav) {
        if (el.tagName === 'DETAILS') el.setAttribute('open', '');
        el = el.parentElement;
      }
      [...nav.querySelectorAll('a')].forEach(a => a.classList.toggle('active', a.dataset.path === doc.path));
      const folder = doc.path.split('/').slice(0, -1).map(displayFolderName).join(' / ');
      currentPath.textContent = folder ? `Linkincrease / ${folder} / ${doc.title}` : `Linkincrease / ${doc.title}`;
      const response = await fetch('content/' + doc.path);
      const markdown = await response.text();
      content.innerHTML = window.marked ? marked.parse(markdown) : '<pre>' + escapeHtml(markdown) + '</pre>';
      enhanceMermaidBlocks();
      renderSourceSection(doc);
      content.querySelectorAll('a[href$=".md"], a[href*=".md#"]').forEach(link => {
        const raw = link.getAttribute('href');
        if (!raw || raw.startsWith('http') || raw.startsWith('#')) return;
        const base = doc.path.split('/').slice(0, -1).join('/');
        const resolved = new URL(raw, 'https://kb.local/' + (base ? base + '/' : '')).pathname.slice(1);
        const target = docs.find(item => item.path === decodeURI(resolved));
        if (target) link.setAttribute('href', '#' + encodeURIComponent(target.path));
      });
    }
    function renderSourceSection(doc) {
      const existing = document.getElementById('source-section');
      if (existing) existing.remove();
      const sources = doc.sources || [];
      const section = document.createElement('details');
      section.id = 'source-section';
      section.className = 'source-section';
      let html = '<summary>需求来源' + (sources.length ? ' (' + sources.length + ')' : '') + '</summary>';
      if (!sources.length) {
        html += '<div class="source-none">暂无关联需求来源</div>';
      } else {
        html += '<table class="source-table"><tr><th>需求文档</th><th>版本</th><th>产品端</th><th>模块</th><th>更新时间</th></tr>';
        for (var i = 0; i < sources.length; i++) {
          var s = sources[i];
          var ts = s.last_write_time ? s.last_write_time.slice(0, 10) : '';
          html += '<tr><td>' + escapeHtml(s.title) + '</td><td><span class="source-badge">' + escapeHtml(s.version) + '</span></td><td>' + escapeHtml(s.product_side) + '</td><td>' + escapeHtml(s.module) + '</td><td>' + escapeHtml(ts) + '</td></tr>';
        }
        html += '</table>';
      }
      section.innerHTML = html;
      content.appendChild(section);
    }
    function enhanceMermaidBlocks() {
      const mermaidStart = /^(flowchart|graph|sequenceDiagram|stateDiagram|stateDiagram-v2|erDiagram|gantt|journey|pie|mindmap|timeline)/i;
      content.querySelectorAll('pre code').forEach(code => {
        const source = code.textContent.trim();
        const isMermaid = code.classList.contains('language-mermaid') || code.classList.contains('lang-mermaid') || mermaidStart.test(source);
        if (!isMermaid || code.closest('.mermaid-source')) return;
        const pre = code.closest('pre');
        const wrapper = document.createElement('div');
        wrapper.className = 'mermaid-source';
        const actions = document.createElement('div');
        actions.className = 'mermaid-actions';
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'mermaid-preview-btn';
        button.textContent = '预览';
        button.addEventListener('click', () => openMermaidPreview(source));
        actions.appendChild(button);
        pre.replaceWith(wrapper);
        wrapper.appendChild(actions);
        wrapper.appendChild(pre);
      });
    }
    async function openMermaidPreview(source) {
      if (!window.mermaid) {
        mermaidPreview.innerHTML = '<pre><code>' + escapeHtml(source) + '</code></pre>';
      } else {
        const id = 'mermaid-' + Date.now().toString(36);
        mermaidPreview.textContent = '';
        mermaidPreview.removeAttribute('data-processed');
      try {
          const result = await mermaid.render(id, source);
          mermaidPreview.innerHTML = result.svg;
          if (result.bindFunctions) result.bindFunctions(mermaidPreview);
      } catch (error) {
          mermaidPreview.innerHTML = '<pre><code>' + escapeHtml(source) + '</code></pre>';
          console.warn('Mermaid render failed', error);
        }
      }
      mermaidModal.classList.add('open');
      mermaidModal.setAttribute('aria-hidden', 'false');
    }
    function closeMermaidPreview() {
      mermaidModal.classList.remove('open');
      mermaidModal.setAttribute('aria-hidden', 'true');
      mermaidPreview.textContent = '';
    }
    mermaidClose.addEventListener('click', closeMermaidPreview);
    mermaidModal.addEventListener('click', event => {
      if (event.target === mermaidModal) closeMermaidPreview();
    });
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && mermaidModal.classList.contains('open')) closeMermaidPreview();
    });
    search.addEventListener('input', () => {
      const keyword = normalize(search.value.trim());
      renderNav(keyword ? docs.filter(doc => normalize(doc.title + ' ' + doc.path + ' ' + doc.text).includes(keyword)) : docs);
      loadDoc(decodeURIComponent(location.hash.slice(1)) || 'README.md');
    });
    window.addEventListener('hashchange', () => loadDoc(decodeURIComponent(location.hash.slice(1)) || 'README.md'));
    renderNav(docs);
    loadDoc(decodeURIComponent(location.hash.slice(1)) || 'README.md');
  </script>
</body>
