【运营端】【资源库模版】表单设计组件.md`、`【运营端】【仪表盘】表单设计组件.md` 是否需要补回最新源 | 表单、公式、仪表盘、资源库模板 | 待确认 | | Q015 | 实验室检验最终结算规则、报价口径和多币种金额是否进入首期业务闭环 | 实验室检验、检测套餐、报价、报表、结算 | 待确认 |  ## 3. 待补充来源  | 内容 | 需要补充 | | --- | --- | | 邮件、短信、通知规则及模板 | 多份需求引用了该材料，但最新源中未见独立完整文档 | | 权限矩阵表 | 多处引用钉钉表格，需要导出并入库为可追溯材料 | | 第三方 API / PDF 导入字段整理 | 需求中有外部链接和嵌入说明，建议整理为本地文档 | | 线上实际菜单结构 | 需要与当前产品版本核对，确认知识库功能地图是否与线上一致 |  ## 4. 处理建议  1. 先处理 P0 页面，形成稳定业务骨架。 2. 每拆一页，回填来源台账中的“入库状态”。 3. 对 Q002、Q003 先开产品确认，因为它们会影响大量页面口径；Q001 已按 FlowSpace 更名口径处理。 4. 外部表格和外部链接材料建议批量导出到 `最新需求源补充资料目录` 或 `sources/exported/`，避免后续链接失效。", "domain": "知识库管理", "module": "问题池", "tags": "待办;问题;待确认", "sources": []}, {"path": "AGENTS.md", "title": "Linkincrease Knowledge Base Agent Guide", "folder": ".", "text": "# Linkincrease Knowledge Base Agent Guide  本文件是给 Codex、Claude Code、OpenClaw 等 AI Agent 使用的知识库入口。使用本仓库前，先按任务类型选择入口，避免把全部文档一次性塞入上下文。  ## 必读入口  - [docs/README.md](./docs/README.md) - [产品能力地图](./docs/00-产品总览与规划/产品能力地图.md) - [FlowSpace 数据层级](./docs/20-业务对象与数据模型/FlowSpace数据层级.md) - [权限体系总表](./docs/40-权限、安全与审计/权限体系总表.md) - [运营支持知识索引](./docs/50-运营支持知识/index.md) - [产品经理知识库工作台](./docs/70-产品维护知识/产品经理知识库工作台.md) - [知识资产地图](./docs/90-版本历史与来源治理/知识资产地图.md)  ## 使用规则  1. 涉及产品规则，优先查 `docs/10-功能模块详情`、`docs/20-业务对象与数据模型`、`docs/30-业务流程与产品流程图`、`docs/40-权限、安全与审计`。 2. 涉及客户配置、SOP、问题排查、上线方案，优先查 `docs/50-运营支持知识`。 3. 涉及外贸供应链业务背景、行业对象、行业流程、运营专业方案，优先查 `docs/55-外贸供应链行业知识`，先读 [运营专业知识建设路线图](./docs/55-外贸供应链行业知识/运营专业知识建设路线图.md)。 4. 涉及数字供应链成熟度、系统边界、主数据治理、可视化预警、Linkincrease 在供应链系统版图中的定位，优先查 `docs/56-数字供应链专项知识`。 5. 涉及指标、报表、仪表盘、统计口径，优先查 `docs/60-数据分析支持`。 6. 涉及需求澄清、影响范围、产品取舍、客户反馈、产品复盘，优先查 `docs/70-产品维护知识`，并使用 `skills/linkincrease-product-manager`。 7. 涉及需求 Demo、HTML 原型、页面原型、交互样例、UI mockup，使用 `skills/linkincrease-demo-prototype`，并读取 `docs/70-产品维护知识/需求Demo输出规范.md`、`docs/70-产品维护知识/Demo视觉与页面规范.md`、`metadata/ui-patterns.csv`、`metadata/ui-style-tokens.csv`。 8. 涉及需求来源、冲突、历史规则、待确认事项、知识资产治理，查 `docs/90-版本历史与来源治理`。 9. 不确定项必须进入 [待确认问题](./docs/90-版本历史与来源治理/待确认问题.md)，不要把客户实践直接写成产品规则。 10. 知识库不得依赖维护者本地 prototype 目录或个人绝对路径；本地原型稳定后，只沉淀页面模式、视觉 token、规则和验收清单。  ## Skill 使用建议  先按 [skills/README.md](./skills/README.md) 判断任务类型。默认只使用一个主 Skill；只有当用户明确从需求进入 Demo、从客户方案进入 Demo，或从需求澄清进入完整 PRD 时，才组合使用多个 Skill。  | Skill | 适用任务 | | --- | --- | | `skills/linkincrease-product-manager` | 需求澄清、影响范围分析、产品取舍、决策记录、产品周复盘 | | `skills/linkincrease-requirement-design` | PRD 写作、需求评审、权限/状态/日志/验收标准设计 | | `skills/linkincrease-product-success` | 客户场景诊断、上线方案、配置方案、运营支持和问题排查 | | `skills/linkincrease-demo-prototype` | 仅在明确输出 Demo、HTML 原型、页面原型或交互样例时使用 |  ## 输出要求  面向产品、实施、客户成功或运营的输出，默认包含：  - 业务目标 - 角色与权限边界 - 资源库设计 - FlowSpace / 模板设计 - 数据流转 - 自动化与通知 - 仪表盘与运营指标 - 上线步骤 - 验收清单 - 风险与待确认  ## 知识沉淀规则  1. 已验证流程沉淀到 `docs/50-运营支持知识/08-工作技能` 或 `docs/50-运营支持知识/06-运营规范与SOP`。 2. 客户案例沉淀到 `docs/50-运营支持知识/03-业务场景案例库`。 3. 问题排查沉淀到 `docs/50-运营支持知识/05-问题排查手册`。 4. 产品规则变更同步到对应权威规则页，并更新 `metadata/documents.csv`、版本记录和待确认问题。 5. 新文档必须登记 `metadata/documents.csv`，至少包含 `id`、`title`、`type`、`domain`、`module`、`status`、`path`、`permission`、`tags`、`updated_at`。 6. 重要产品取舍必须进入 [决策记录](./docs/70-产品维护知识/决策记录.md)，并写明背景、选项、结论、影响范围和复盘条件。 7. 页面母版和视觉样式沉淀到 `docs/70-产品维护知识`、`metadata/ui-patterns.csv`、`metadata/ui-style-tokens.csv`；不要把完整 HTML/CSS/JS 或本地 prototype 路径写入共享知识库。 8. Skill 属于 Agent 调用入口，登记到 `metadata/skills.csv`；不要把 Skill 当成普通业务知识页混入公共知识检索。", "domain": "知识库管理", "module": "AI使用入口", "tags": "AI;Agent;入口;使用规则", "sources": []}, {"path": "README.md", "title": "Linkincrease 知识库", "folder": ".", "text": "# Linkincrease 知识库  本知识库用于沉淀 Linkincrease 产品的定位、功能模块、业务对象、数据模型、业务流程、权限审计、运营支持、外贸供应链行业知识、数据分析、产品维护、架构方案、来源治理和图谱索引。  ## 快速入口  | 入口 | 用途 | | --- | --- | | [docs/README.md](./docs/README.md) | 标准知识库目录入口 | | [产品能力地图](./docs/00-产品总览与规划/产品能力地图.md) | 从产品能力分层理解知识库 | | [功能模块详情](./docs/10-功能模块详情/README.md) | 按工作台、FlowSpace、业务模板、订单、工单、资源库等模块查阅 | | [FlowSpace 数据层级](./docs/20-业务对象与数据模型/FlowSpace数据层级.md) | 判断模板、FlowSpace、订单、里程碑、工单、批复、资源库之间的数据边界 | | [业务流程与产品流程图](./docs/30-业务流程与产品流程图/README.md) | 查看端到端业务流程和流程图索引 | | [权限、安全与审计](./docs/40-权限、安全与审计/README.md) | 查询权限、数据围栏、日志和历史记录 | | [测试支持](./docs/45-测试支持/README.md) | 面向测试人员的验收标准、权限矩阵、异常边界和版本回归重点 | | [运营支持知识](./docs/50-运营支持知识/README.md) | 面向运营、客户配置、问题处理和最佳实践 | | [外贸供应链行业知识](./docs/55-外贸供应链行业知识/README.md) | 为产品研发和测试补充行业依据，并支持产品成功诊断客户与输出方案 | | [数据分析支持](./docs/60-数据分析支持/README.md) | 统一指标口径、仪表盘、报表和数据来源 | | [产品维护知识](./docs/70-产品维护知识/README.md) | 管理竞品、用户地图、客户反馈、需求池和决策记录 | | [架构与技术方案](./docs/80-架构与技术方案/README.md) | 沉淀系统架构、集成、非功能、安全、性能和兼容性 | | [版本历史与来源治理](./docs/90-版本历史与来源治理/README.md) | 管理来源、版本、待确认问题和历史文档评估 | | [图谱与索引](./docs/99-图谱与索引/README.md) | 集中查看功能地图、数据结构图、流程图、权限矩阵和 Mermaid 图表 | | [AI 知识包](./exports/ai-package/README.md) | 给 GPT 网页版、钉钉 AI 小助手等工具使用的摘要、检查清单和提示词 |  ## 使用原则  1. 功能模块页是阅读入口，业务对象、流程、权限、数据和审计页面是权威规则层。 2. 来源文档不等于知识库结论。知识库正文只收纳经过归纳、去重、校验并可追溯来源的信息。 3. 涉及数据新增、字段写入、资源库引用、自动化、导入导出、报表统计或权限控制时，先判断目标数据层级。 4. 行业事实、客户实践和产品现状应分别标记；运营经验、客户反馈、竞品分析和需求候选进入运营支持、行业知识或产品维护区，确认后再同步到权威规则页。 5. Mermaid 图表代码保留在 Markdown 中，站点提供预览能力，方便复制和维护。  ## 本地生成站点  python scripts\\build_static_site.py  生成结果位于 `exports/site`。推送到主分支后，GitHub Actions 会根据部署配置生成并发布公开只读站点。", "domain": "知识库管理", "module": "入口", "tags": "入口;索引;阅读路径", "sources": []}, {"path": "docs/00-产品总览与规划/README.md", "title": "00 产品总览与规划", "folder": "docs/00-产品总览与规划", "text": "# 00 产品总览与规划  本目录用于说明 Linkincrease 是什么、面向谁、解决什么问题、如何规划和衡量。  ## 页面  - [产品战略与定位](./产品战略与定位.md) - [用户角色与场景](./用户角色与场景.md) - [产品指标与路线图](./产品指标与路线图.md) - [术语表](./术语表.md) - [产品能力地图](./产品能力地图.md) - [迭代需求设计工作流](./迭代需求设计工作流.md) ", "domain": "公共能力", "module": "产品总览与规划", "tags": "00-产品总览与规划;00 产品总览与规划", "sources": []}, {"path": "docs/00-产品总览与规划/产品战略与定位.md", "title": "产品战略与定位", "folder": "docs/00-产品总览与规划", "text": "# 产品战略与定位  ## 1. 页面定位  本页用于沉淀 Linkincrease 的产品战略层口径，帮助产品、设计、研发和业务成员理解产品为什么存在、服务谁、解决什么问题，以及当前知识库中哪些内容属于稳定事实，哪些仍属于历史假设。  本页综合历史产品文档中的愿景、定位、问题陈述、精益 UX 画布和综合定义内容，并以当前知识库口径重新整理。历史文档中的 `SCCS` 在本页统一表述为 FlowSpace；如需追溯原文，保留 `source:product-docs-legacy/...` 来源标识。  ## 2. 产品愿景  Linkincrease 面向供应链协作场景，目标是让跨团队、跨企业、跨角色的订单执行过程从“分散沟通、人工追踪、重复录入”转向“统一空间、结构化协作、过程留痕、数据复用”。  战略表达可以归纳为：  > 建立一个以 FlowSpace 为业务协作空间、以订单流程为执行主线、以模板和资源库为配置底座的供应链协作平台，帮助企业更快搭建可执行、可追踪、可复用的业务流程。  ## 3. 核心定位  | 维度 | 定位 | | --- | --- | | 产品类别 | 供应链业务协同平台 | | 核心对象 | FlowSpace、订单、里程碑、工单、资源库、业务模板 | | 核心价值 | 让业务流程可配置、执行过程可协作、数据变化可追溯、标准数据可复用 | | 主要使用者 | 客户团队成员、协作团队、移动执行人员、平台运营/实施人员 | | 主要场景 | 订单执行、任务采集、跨团队协作、模板配置、资源库管理、过程追踪、数据展示 |  ## 4. 主要问题  历史产品资料中的问题可以保留为产品背景，但不能直接当作已验证数据。当前可沉淀的问题框架如下：  | 问题 | 业务表现 | Linkincrease 的对应能力 | | --- | --- | --- | | 信息分散 | 订单、任务、文件和沟通分布在不同工具中 | FlowSpace 统一承载订单、里程碑、工单、动态和跟踪记录 | | 协作边界不清 | 内部团队和外部协作团队的职责、权限、数据范围难管理 | 团队角色、FlowSpace 业务角色、协作 FlowSpace 角色、数据围栏 | | 状态不透明 | 订单和任务进展依赖人工同步 | 订单状态、里程碑状态、工单状态、消息通知、仪表盘和报告 | | 重复录入 | 同类物料、供应商、客户等数据反复维护 | 资源库、资源库模板、资源库引用与同步 | | 过程不可追溯 | 谁改了什么、何时触发、自动化做了什么难复盘 | 操作日志、动态、历史记录、跟踪记录、系统执行日志 | | 移动处理不便 | 外勤、仓库、验货、物流等场景难以及时处理任务 | 采集端任务列表、任务详情、工单采集、批复和消息 |  ## 5. 产品价值主张  | 价值主张 | 说明 | | --- | --- | | 可配置 | 通过业务模板、资源库模板、表单组件和显隐规则适配不同业务流程 | | 可协作 | 通过团队、协作团队、角色、指派、消息和邮件协作支持多方参与 | | 可追踪 | 通过订单跟踪记录、动态、日志、历史记录沉淀过程证据 | | 可复用 | 通过资源库、订单翻单、订单关联、里程碑互用、工单互用减少重复劳动 | | 可分析 | 通过工作台、订单日程、常用视图、仪表盘和报告进行过程观察 |  ## 6. 三端战略分工  | 产品端 | 战略角色 | 不应混淆的边界 | | --- | --- | --- | | 运营端 | 平台配置与监管后台，负责模板、用户、团队、FlowSpace、资源库、集成和报告等平台级管理 | 不承担客户团队的日常订单执行 | | 贸易端 | 客户业务协同主平台，负责团队、FlowSpace、订单、工单、资源库、自动化、消息、仪表盘和报告 | 不直接替代采集端移动执行体验 | | 采集端 | 移动任务处理入口，负责外勤/仓库/验货等场景下的任务查看、采集、批复和消息处理 | 不承担完整后台配置能力 |  ## 7. 使用边界  1. 本页可用于产品介绍、团队共识、知识库入门和需求背景说明。 2. 本页不替代具体功能规则；权限、状态、字段、日志、通知、导入导出规则必须以对应专题页为准。 3. 历史文档中的市场规模、目标数值、阶段时间、版本规划和商业模式仍需产品负责人确认后，才能作为正式策略或 OKR 使用。 4. 当历史文档与 `source:thoughts-v2-current` 最新需求源冲突时，以最新需求源和已确认知识页为准。  ## 8. 关联页面  - [产品总览](../../01-产品总览.md) - [核心概念词典](../../02-核心概念词典.md) - [功能地图](../../03-功能地图.md) - [用户角色与场景](./用户角色与场景.md) - [产品指标与路线图](./产品指标与路线图.md) - [历史产品文档评估](../90-版本历史与来源治理/历史产品文档评估.md)  ## 9. 来源  - `source:product-docs-legacy/产品愿景与定位文档.md` - `source:product-docs-legacy/问题陈述-ProblemStatement.md` - `source:product-docs-legacy/精益UX画布-LeanUXCanvas.md` - `source:product-docs-legacy/产品综合定义文档.md`", "domain": "公共能力", "module": "产品总览与规划", "tags": "产品战略;产品定位;价值主张;历史产品文档", "sources": [{"title": "产品愿景与定位文档", "version": "common", "product_side": "未识别", "module": "", "last_write_time": "2026-04-28T15:47:31"}, {"title": "问题陈述-ProblemStatement", "version": "common", "product_side": "未识别", "module": "", "last_write_time": "2026-04-28T16:03:15"}, {"title": "精益UX画布-LeanUXCanvas", "version": "common", "product_side": "未识别", "module": "", "last_write_time": "2026-04-28T15:46:13"}, {"title": "产品综合定义文档", "version": "common", "product_side": "未识别", "module": "", "last_write_time": "2026-04-28T16:05:59"}]}, {"path": "docs/00-产品总览与规划/产品指标与路线图.md", "title": "产品指标与路线图", "folder": "docs/00-产品总览与规划", "text": "# 产品指标与路线图  ## 1. 页面定位  本页用于沉淀 Linkincrease 的指标与路线图框架，帮助团队在讨论需求优先级、阶段目标和投入顺序时有统一参照。  历史产品文档中的时间、版本、数值目标和 RICE 分数属于早期规划假设。除非已经被产品负责人确认或进入最新需求源，否则本页只将其整理为“评估框架”，不作为承诺版本计划。  ## 2. 指标分层  | 层级 | 关注问题 | 示例指标 | | --- | --- | --- | | 业务结果指标 | 产品是否让供应链协作更有效 | 订单准时完成率、任务处理时长、跨团队响应时长 | | 产品使用指标 | 用户是否持续使用核心能力 | FlowSpace 创建量、订单创建量、工单处理量、资源库引用量 | | 协作效率指标 | 协作是否从人工沟通转为结构化流程 | 工单指派到处理时长、批复处理时长、邮件协作使用量 | | 数据质量指标 | 数据是否可复用、可追踪、可分析 | 资源库字段完整率、引用数据占比、导入成功率、历史记录覆盖率 | | 治理与稳定指标 | 平台是否可控、可审计、可扩展 | 权限配置完整率、日志覆盖率、自动化执行成功率、异常处理闭环率 |  ## 3. 阶段目标框架  | 阶段 | 核心目标 | 产品重点 | | --- | --- | --- | | 0-1 验证阶段 | 验证 FlowSpace + 订单 + 里程碑 + 工单是否能承载核心供应链协作流程 | 业务模板、创建 FlowSpace、订单执行、工单采集、基础权限、基础通知 | | 1-10 增长阶段 | 提升协作效率、复用能力和客户团队规模化使用能力 | 资源库、自动化、订单复用、协作团队、仪表盘、报告、日志治理 | | 10-100 扩展阶段 | 支撑更多行业、更多团队、更复杂集成与管理场景 | 高级模板、外部 API、行业组件、数据分析、生态集成、国际化能力 |  ## 4. 优先级判断原则  | 原则 | 说明 | | --- | --- | | 先主链路后增强能力 | 优先保证 FlowSpace、订单、里程碑、工单、批复、权限、状态能跑通 | | 先稳定口径后体验优化 | 涉及权限、状态、数据流转、日志的需求优先明确规则，再优化交互 | | 先高频场景后低频配置 | 高频业务执行、任务处理、数据复用优先级通常高于低频后台配置 | | 先可追溯后自动化 | 自动化、同步、批量操作必须先明确日志、异常、权限和回滚边界 | | 先确认来源后进入知识库 | 历史文档、访谈假设、路线图目标必须经过确认，才能成为正式规则 |  ## 5. 可复用的 RICE 评估口径  历史文档使用过 RICE 作为功能优先级框架。后续可继续使用，但建议统一解释如下：  | 字段 | 含义 | 使用注意 | | --- | --- | --- | | Reach | 影响用户或业务对象范围 | 需要说明影响哪些端、哪些角色、哪些对象 | | Impact | 对业务目标的影响强度 | 需要连接到订单效率、协作效率、数据质量或治理目标 | | Confidence | 判断依据可信度 | 最新需求、客户反馈、线上数据优先；早期假设需降低置信度 | | Effort | 实现复杂度 | 需要包含前端、后端、数据、权限、日志、迁移和测试成本 |  ## 6. 当前知识库对应关系  | 路线图主题 | 已沉淀知识页 | | --- | --- | | FlowSpace 主链路 | [从模板到FlowSpace](../30-业务流程与产品流程图/从模板到FlowSpace.md)、[FlowSpace](../20-业务对象与数据模型/FlowSpace.md) | | 订单执行 | [订单生命周期](../30-业务流程与产品流程图/订单生命周期.md)、[订单](../20-业务对象与数据模型/订单.md) | | 工单与移动采集 | [工单采集与批复](../30-业务流程与产品流程图/工单采集与批复.md)、[移动端采集](../30-业务流程与产品流程图/移动端采集.md) | | 权限治理 | [权限体系总表](../40-权限、安全与审计/权限体系总表.md)、[数据围栏](../40-权限、安全与审计/数据围栏.md) | | 资源复用 | [资源库](../20-业务对象与数据模型/资源库.md)、[资源库引用与同步](../30-业务流程与产品流程图/资源库引用与同步.md) | | 自动化与通知 | [自动化执行](../30-业务流程与产品流程图/自动化执行.md)、[消息中心与实时通知](../10-功能模块详情/消息中心与实时通知.md) | | 分析展示 | [工作台与FlowSpace入口](../10-功能模块详情/工作台.md)、[仪表盘管理与设计器](../60-数据分析支持/仪表盘配置说明.md)、[报告管理与权限](../60-数据分析支持/报表权限.md) |  ## 7. 待确认问题  | 问题 | 建议处理 | | --- | --- | | 历史文档中的阶段时间是否仍有效 | 需要产品负责人确认后进入版本变更记录或路线图页 | | 历史文档中的 OKR 数值是否有真实数据支撑 | 需要补充数据来源；无来源时仅作假设 | | RICE 分数是否仍符合当前产品阶段 | 需要按最新需求和实现成本重新评估 | | 商业模式、定价策略是否属于当前知识库范围 | 如需保留，建议单独建立商业策略页，不混入功能规则 |  ## 8. 来源  - `source:product-docs-legacy/产品路线图-0到100.md` - `source:product-docs-legacy/产品指标体系-OKR.md` - `source:product-docs-legacy/功能优先级规划-RICE框架.md` - `source:product-docs-legacy/精益UX画布-LeanUXCanvas.md` - `source:product-docs-legacy/产品综合定义文档.md`", "domain": "公共能力", "module": "产品总览与规划", "tags": "产品指标;路线图;OKR;RICE;优先级", "sources": [{"title": "产品路线图-0到100", "version": "common", "product_side": "未识别", "module": "", "last_write_time": "2026-04-28T15:55:37"}, {"title": "产品指标体系-OKR", "version": "common", "product_side": "未识别", "module": "", "last_write_time": "2026-04-28T15:57:13"}, {"title": "功能优先级规划-RICE框架", "version": "common", "product_side": "未识别", "module": "", "last_write_time": "2026-04-28T15:54:24"}, {"title": "精益UX画布-LeanUXCanvas", "version": "common", "product_side": "未识别", "module": "", "last_write_time": "2026-04-28T15:46:13"}]}, {"path": "docs/00-产品总览与规划/产品能力地图.md", "title": "产品能力地图", "folder": "docs/00-产品总览与规划", "text": "# 产品能力地图  产品能力地图用于从产品视角理解 Linkincrease 的能力分层，不替代具体功能页和规则页。  ## 能力分层  | 层级 | 说明 | 主要入口 | | --- | --- | --- | | 产品总览 | 产品定位、用户角色、指标与路线图 | [产品战略与定位](./产品战略与定位.md)、[用户角色与场景](./用户角色与场景.md)、[产品指标与路线图](./产品指标与路线图.md) | | 功能模块 | 面向使用者理解功能范围和入口 | [功能模块详情](../10-功能模块详情/README.md) | | 业务对象与数据 | 面向需求设计理解对象、字段、层级、引用关系 | [业务对象与数据模型](../20-业务对象与数据模型/README.md) | | 业务流程 | 面向场景理解端到端流转 | [业务流程与产品流程图](../30-业务流程与产品流程图/README.md) | | 权限与审计 | 面向安全、可见性、操作追溯 | [权限、安全与审计](../40-权限、安全与审计/README.md) | | 运营支持 | 面向产品运营、客户配置、最佳实践 | [运营支持知识](../50-运营支持知识/README.md) | | 数据分析 | 面向指标口径、仪表盘、报表和数据来源 | [数据分析支持](../60-数据分析支持/README.md) | | 产品维护 | 面向竞品、反馈、需求池和决策沉淀 | [产品维护知识](../70-产品维护知识/README.md) | | 架构方案 | 面向技术方案、集成、非功能要求 | [架构与技术方案](../80-架构与技术方案/README.md) | | 图谱索引 | 面向流程图、结构图、权限矩阵和 Mermaid 复用 | [图谱与索引](../99-图谱与索引/README.md) |  ## 使用建议  需求设计先从功能模块定位入口，再进入业务对象、业务流程、权限审计和数据分析页面校验影响范围。 ", "domain": "公共能力", "module": "产品总览与规划", "tags": "00-产品总览与规划;产品能力地图", "sources": []}, {"path": "docs/00-产品总览与规划/术语表.md", "title": "术语表", "folder": "docs/00-产品总览与规划", "text": "# 术语表  本页用于集中维护 Linkincrease 的核心产品术语，避免需求、知识库、运营说明和研发沟通中出现同词不同义。  ## 当前权威入口  - [FlowSpace](../20-业务对象与数据模型/FlowSpace.md) - [FlowSpace 数据层级](../20-业务对象与数据模型/FlowSpace数据层级.md) - [业务模板](../20-业务对象与数据模型/业务模板.md) - [订单](../20-业务对象与数据模型/订单.md) - [工单与批复](../20-业务对象与数据模型/工单与批复.md) - [资源库](../20-业务对象与数据模型/资源库.md) - [权限体系总表](../40-权限、安全与审计/权限体系总表.md)  ## 维护规则  1. 新增术语时，必须说明定义、适用范围、不可混用的相近概念。 2. 涉及业务对象的数据边界时，优先引用对象页和数据模型页。 3. 历史来源中的 SCCS 等旧称只作为来源追溯保留，正式知识页统一使用 FlowSpace。 ", "domain": "公共能力", "module": "产品总览与规划", "tags": "00-产品总览与规划;术语表", "sources": []}, {"path": "docs/00-产品总览与规划/用户角色与场景.md", "title": "用户角色与场景", "folder": "docs/00-产品总览与规划", "text": "# 用户角色与场景  ## 1. 页面定位  本页用于沉淀 Linkincrease 的用户角色、使用场景和核心诉求，作为需求设计、页面优先级判断、权限边界分析和产品介绍的入口。  历史产品文档中存在较多画像、访谈和假设性描述。本页只保留与当前产品结构相容的角色框架；年龄、职位、目标值、访谈样本等未确认信息只作为背景参考，不作为功能规则。  ## 2. 用户角色总览  | 角色类型 | 典型身份 | 主要使用端 | 核心目标 | | --- | --- | --- | --- | | 平台运营/实施人员 | 内部运营、实施、客服、管理员 | 运营端 | 配置模板、监管团队与 FlowSpace、处理平台级管理事项 | | 客户团队管理者 | 团队 Owner、业务负责人、项目负责人 | 贸易端 | 搭建团队、创建 FlowSpace、配置角色与协作关系、查看业务进展 | | 业务执行人员 | 跟单员、项目经理、订单负责人 | 贸易端 | 创建和维护订单、推进里程碑、创建工单、处理批复和异常 | | 协作团队成员 | 供应商、工厂、物流商、外部协作方 | 贸易端/采集端 | 接收指派任务、提交数据、参与工单或批复 | | 移动执行人员 | 外勤、仓库、验货、采集人员 | 采集端 | 查看任务、填写采集表单、上传附件、处理工单和批复 | | 数据/管理观察者 | 管理层、运营负责人、分析人员 | 贸易端/运营端 | 查看订单进度、仪表盘、报告、异常和追踪记录 |  ## 3. 角色与产品能力关系  | 角色 | 常用能力 | 需要重点关注的规则 | | --- | --- | --- | | 平台运营/实施人员 | 用户管理、团队管理、FlowSpace 管理、模板中心、资源库模板、表单组件、报告管理、外部 API | 配置态与运行态边界、模板发布与同步、平台级日志 | | 客户团队管理者 | 创建团队、团队设置、成员管理、协作团队、创建 FlowSpace、FlowSpace 设置 | 团队角色、FlowSpace 角色、协作团队权限、数据围栏 | | 业务执行人员 | 订单列表、订单详情、里程碑、工单、批复、订单复用、资源库引用 | 订单状态、工单状态、批复状态、字段权限、动态和跟踪记录 | | 协作团队成员 | 协作 FlowSpace、指派任务、工单采集、工单批复、里程碑批复 | 协作方角色、可见数据范围、可操作任务范围 | | 移动执行人员 | 首页任务、任务列表、任务搜索、任务详情、消息中心、我的 | 移动端任务分类、处理状态、附件/签名/表单填写边界 | | 数据/管理观察者 | 工作台、订单日程、常用视图、仪表盘、报告、日志 | 查看权限、报告权限、仪表盘权限、数据范围 |  ## 4. 核心场景  ### 4.1 从模板搭建业务空间  运营端配置业务模板和资源库模板，客户团队在贸易端基于模板创建 FlowSpace，再在 FlowSpace 中配置成员、角色、协作团队、数据围栏、里程碑计划和标签。  关联页面：  - [从模板到FlowSpace](../30-业务流程与产品流程图/从模板到FlowSpace.md) - [业务模板](../20-业务对象与数据模型/业务模板.md) - [FlowSpace](../20-业务对象与数据模型/FlowSpace.md)  ### 4.2 订单执行与任务协作  业务执行人员在 FlowSpace 中创建订单，订单下包含里程碑和工单。工单可由团队成员、协作成员或协作团队负责人处理，过程产生动态、历史记录和跟踪记录。  关联页面：  - [订单生命周期](../30-业务流程与产品流程图/订单生命周期.md) - [工单采集与批复](../30-业务流程与产品流程图/工单采集与批复.md) - [订单](../20-业务对象与数据模型/订单.md) - [工单与批复](../20-业务对象与数据模型/工单与批复.md)  ### 4.3 跨团队协作  主团队可以邀请协作团队，协作团队成员根据协作 FlowSpace 角色和数据范围参与任务。协作关系需要同时关注团队级协作、FlowSpace 级协作、任务指派和数据围栏。  关联页面：  - [跨团队协作](../30-业务流程与产品流程图/跨团队协作.md) - [团队与协作团队](../20-业务对象与数据模型/团队与协作团队.md) - [协作FlowSpace权限](../40-权限、安全与审计/协作FlowSpace权限.md)  ### 4.4 移动任务采集  移动执行人员通过采集端查看待办任务、搜索任务、进入任务详情、填写工单采集表单、提交工单批复或里程碑批复，并接收消息通知。  关联页面：  - [移动端采集](../30-业务流程与产品流程图/移动端采集.md) - [采集端](../10-功能模块详情/采集端.md) - [消息中心与实时通知](../10-功能模块详情/消息中心与实时通知.md)  ### 4.5 数据复用与分析观察  团队通过资源库沉淀标准数据，通过订单复用能力减少重复操作，通过仪表盘、报告、工作台和订单日程观察业务进展。  关联页面：  - [资源库引用与同步](../30-业务流程与产品流程图/资源库引用与同步.md) - [订单复用关系](../30-业务流程与产品流程图/订单复用关系.md) - [仪表盘管理与设计器](../60-数据分析支持/仪表盘配置说明.md) - [报告管理与权限](../60-数据分析支持/报表权限.md)  ## 5. 需求设计检查  新增或变更需求时，至少判断这些角色影响：  | 检查项 | 说明 | | --- | --- | | 谁发起 | 哪类角色可以创建、编辑、提交、取消或删除 | | 谁处理 | 任务、批复、采集、审核由谁承接 | | 谁可见 | 不同团队、角色、协作方的数据可见范围 | | 谁收到通知 | 消息中心、实时消息、邮件协作、移动通知是否受影响 | | 谁留下日志 | 配置变更、业务动作、自动化执行和字段变更如何追踪 | | 谁受限制 | 状态、权限、数据围栏、字段显隐、导入导出限制 |  ## 6. 来源  - `source:product-docs-legacy/用户角色与画像.md` - `source:product-docs-legacy/用户访谈综合报告-InterviewSynthesis.md` - `source:product-docs-legacy/问题陈述-ProblemStatement.md` - `source:product-docs-legacy/PRD产品需求文档-贸易端.md` - `source:product-docs-legacy/PRD产品需求文档-运营端.md` - `source:product-docs-legacy/PRD产品需求文档-采集端.md`", "domain": "公共能力", "module": "产品总览与规划", "tags": "用户角色;用户场景;需求设计;历史产品文档", "sources": [{"title": "用户角色与画像", "version": "common", "product_side": "未识别", "module": "", "last_write_time": "2026-04-28T15:49:23"}, {"title": "用户访谈综合报告-InterviewSynthesis", "version": "common", "product_side": "未识别", "module": "", "last_write_time": "2026-04-28T16:04:20"}, {"title": "PRD产品需求文档-贸易端", "version": "common", "product_side": "贸易端", "module": "", "last_write_time": "2026-04-28T15:51:06"}, {"title": "PRD产品需求文档-运营端", "version": "common", "product_side": "运营端", "module": "", "last_write_time": "2026-04-28T15:51:55"}, {"title": "PRD产品需求文档-采集端", "version": "common", "product_side": "采集端", "module": "", "last_write_time": "2026-04-28T15:53:04"}]}, {"path": "docs/00-产品总览与规划/迭代需求设计工作流.md", "title": "迭代需求设计工作流", "folder": "docs/00-产品总览与规划", "text": "# 迭代需求设计工作流  ## 定位  本页说明如何在新增迭代需求设计时复用 Linkincrease 知识库。目标不是把知识库当资料仓库，而是让它参与需求设计前的背景检索、设计中的规则补全、设计后的影响范围检查和最终入库。  本流程已蒸馏为本地 Codex Skill：`linkincrease-requirement-design`。在其他文件夹进行迭代功能设计或需求文档编写时，可以直接要求使用该 Skill。  适用场景：  - 新增功能需求。 - 调整已有功能规则。 - 补充权限、状态、通知、日志、导入导出等细节。 - 将其他文件夹中的需求设计同步沉淀到知识库。  ## 1. 需求设计前：查背景  开始写需求前，先确认该需求属于哪个产品端、业务对象和流程节点。  | 要确认的问题 | 优先查看 | |---|---| | 这个需求属于哪个端 | [../../03-功能地图.md](../../03-功能地图.md)、[../10-功能模块详情/运营端.md](../10-功能模块详情/运营端.md)、[../10-功能模块详情/贸易端.md](../10-功能模块详情/贸易端.md)、[../10-功能模块详情/采集端.md](../10-功能模块详情/采集端.md) | | 涉及哪些核心对象 | [../../02-核心概念词典.md](../../02-核心概念词典.md)、[../20-业务对象与数据模型/FlowSpace.md](../20-业务对象与数据模型/FlowSpace.md)、[../20-业务对象与数据模型/订单.md](../20-业务对象与数据模型/订单.md)、[../20-业务对象与数据模型/工单与批复.md](../20-业务对象与数据模型/工单与批复.md)、[../20-业务对象与数据模型/资源库.md](../20-业务对象与数据模型/资源库.md) | | 处于哪条业务流程 | [../30-业务流程与产品流程图/从模板到FlowSpace.md](../30-业务流程与产品流程图/从模板到FlowSpace.md)、[../30-业务流程与产品流程图/订单生命周期.md](../30-业务流程与产品流程图/订单生命周期.md)、[../30-业务流程与产品流程图/工单采集与批复.md](../30-业务流程与产品流程图/工单采集与批复.md)、[../30-业务流程与产品流程图/跨团队协作.md](../30-业务流程与产品流程图/跨团队协作.md) | | 是否已有类似历史需求 | [../../05-需求文档来源台账.md](../../05-需求文档来源台账.md)、[../../metadata/source-manifest.csv](../../metadata/source-manifest.csv)、`最新需求源（source:thoughts-v2-current）` |  建议向知识库提问：  基于当前知识库，帮我梳理这个需求涉及哪些已有模块、对象、流程和权限。  ## 2. 需求设计中：补齐规则  写需求正文时，至少检查以下维度。  | 维度 | 需要写清楚 | |---|---| | 产品端 | 运营端、贸易端、采集端分别是否有入口或影响 | | 用户角色 | 平台运营、团队管理员、普通成员、协作团队成员、采集人员等 | | 业务对象 | FlowSpace、订单、里程碑、工单、资源库、模板、报告、仪表盘等 | | 入口 | 菜单、列表、详情、设置页、弹窗、移动端页面 | | 操作 | 查看、新增、编辑、删除、批量、导入、导出、复制、同步 | | 权限 | 团队权限、FlowSpace 业务角色、协作 FlowSpace 角色、资源库权限、数据围栏 | | 状态限制 | 进行中、已完成、已取消、已删除、停用、失效等状态下能否操作 | | 数据影响 | 新老数据、历史快照、字段默认值、同步范围、冲突处理 | | 通知协作 | 站内消息、实时消息、邮件、短信、任务中心、指派规则 | | 日志审计 | 操作日志、动态、历史记录、跟踪记录、系统执行日志 | | 异常提示 | 无权限、数据不存在、状态不允许、导入失败、同步失败等 | | 导入导出 | 模板、字段、失败原因、权限、数据范围、异步任务 |  建议向知识库提问：  帮我检查这份需求是否遗漏权限、状态、通知、日志、导入导出、历史数据影响。  ## 3. 需求设计后：做影响范围检查  需求初稿完成后，用知识库做一次影响范围复盘。  | 检查项 | 说明 | |---|---| | 术语是否统一 | 使用 [../../02-核心概念词典.md](../../02-核心概念词典.md) 中的标准名称，例如 FlowSpace | | 是否影响功能地图 | 新增入口或模块时，需要更新 [../../03-功能地图.md](../../03-功能地图.md) | | 是否影响对象页 | 新规则应回填到对应业务对象页 | | 是否影响流程页 | 流程变化应回填到 `docs/30-业务流程与产品流程图/` | | 是否影响权限页 | 权限变化应回填到 `docs/40-权限、安全与审计/` | | 是否影响通知和自动化 | 通知、邮件、任务、自动化变化应回填到 `docs/60-数据分析支持/` | | 是否影响日志审计 | 日志、历史记录、跟踪记录应回填到 `docs/80-架构与技术方案/` | | 是否存在待确认问题 | 不确定项进入 [../../99-待办与问题池.md](../../99-待办与问题池.md) |  建议向知识库提问：  基于知识库帮我做这份需求的影响范围分析，并列出需要同步更新的知识页。  ## 4. 需求确认后：同步入库  当需求评审确认后，按以下步骤沉淀。  1. 将最终需求文件放入当前迭代需求设计文件夹。 2. 如该需求也属于最新需求源，将文件同步到 `最新需求源（source:thoughts-v2-current）`。 3. 运行 `python scripts\\scan_source_manifest.py` 更新来源清单。 4. 更新 [../../05-需求文档来源台账.md](../../05-需求文档来源台账.md) 的归属模块。 5. 将确认后的规则写入对应知识页。 6. 更新 `metadata/documents.csv`、`metadata/sources.csv`、`metadata/search-index.json` 中的相关记录。 7. 如有未决问题，更新 [../../99-待办与问题池.md](../../99-待办与问题池.md) 和 [../90-版本历史与来源治理/待确认问题.md](../90-版本历史与来源治理/待确认问题.md)。 8. 如是较大迭代，更新 [../90-版本历史与来源治理/版本变更记录.md](../90-版本历史与来源治理/版本变更记录.md)。  ## 5. 推荐提问模板  ### 新需求启动  我准备设计一个新需求：{一句话描述}。 请基于 Linkincrease 知识库，帮我梳理背景、相关模块、已有规则、可能影响范围和设计注意事项。  ### 需求补漏  这是我的需求草稿：{文件路径或内容}。 请基于知识库检查是否遗漏权限、状态、通知、日志、导入导出、历史数据、异常提示和多端差异。  ### 需求冲突检查  请对比这份新需求和知识库已有规则，找出可能冲突、重复或需要产品确认的点。  ### 需求入库  这份需求已确认，请把它同步进 Linkincrease 知识库：更新来源台账、相关知识页、metadata 和待确认问题。  ## 6. 输出物建议  每个迭代需求设计完成后，建议至少形成以下内容：  | 输出物 | 用途 | |---|---| | 需求正文 | 给产品、研发、测试评审 | | 影响范围清单 | 明确会改哪些页面、接口、权限、数据和日志 | | 权限与状态矩阵 | 降低研发和测试理解成本 | | 异常提示清单 | 统一前端提示和测试断言 | | 测试关注点 | 提前覆盖边界场景 | | 知识库更新清单 | 确保确认后的规则沉淀回知识库 |  ## 7. 设计原则  1. 新需求不要只写页面交互，要补齐对象、流程、权限、状态、数据和日志。 2. 能复用已有概念时，不新增同义词。 3. 需求原文用于评审，知识库用于沉淀最终共识。 4. 不确定项不硬写成结论，先进入问题池。 5. 每次迭代结束，都要把确认后的新规则同步回知识库。", "domain": "公共能力", "module": "产品总览与规划", "tags": "00-产品总览与规划;迭代需求设计工作流", "sources": []}, {"path": "docs/10-功能模块详情/FlowSpace.md", "title": "FlowSpace", "folder": "docs/10-功能模块详情", "text": "# FlowSpace  本页是 FlowSpace 功能模块的阅读入口，具体规则以业务对象、数据模型、流程和权限页面为准。  ## 模块范围  - FlowSpace 创建、分组、设置、业务角色与协作方设置。 - FlowSpace 内订单、里程碑、工单、批复、资源库引用、自动化、视图、报表、数据移交和跨 FlowSpace 数据互通能力。 - FlowSpace 与业务模板之间的配置态到运行态映射关系。  ## 权威文档  - [FlowSpace 对象定义](../20-业务对象与数据模型/FlowSpace.md) - [FlowSpace 数据层级](../20-业务对象与数据模型/FlowSpace数据层级.md) - [从模板到 FlowSpace](../30-业务流程与产品流程图/从模板到FlowSpace.md) - [FlowSpace 数据移交](./FlowSpace数据移交.md) - [FlowSpace 数据互通](./FlowSpace数据互通.md) - [FlowSpace 业务角色权限](../40-权限、安全与审计/FlowSpace业务角色权限.md) - [协作 FlowSpace 权限](../40-权限、安全与审计/协作FlowSpace权限.md)", "domain": "公共能力", "module": "功能模块详情", "tags": "10-功能模块详情;FlowSpace", "sources": [{"title": "【运营端】【SCCS管理】SCCS自动化记录", "version": "V2.4.x", "product_side": "运营端", "module": "SCCS管理", "last_write_time": "2026-09-04T10:48:04"}, {"title": "【运营端】【SCCS管理】SCCS列表增加外部api集成配置", "version": "V2.5.x", "product_side": "运营端", "module": "SCCS管理", "last_write_time": "2026-09-04T10:48:05"}, {"title": "【运营端】【SCCS管理】SCCS列表增加报告管理", "version": "V2.6.x", "product_side": "运营端", "module": "SCCS管理", "last_write_time": "2026-09-04T10:47:55"}, {"title": "【贸易端】【工作台】工作台、创建SCCS、SCCS分组", "version": "v2.0.x", "product_side": "贸易端", "module": "工作台", "last_write_time": "2026-09-04T10:48:46"}, {"title": "【贸易端】【SCCS设置】", "version": "v2.1.x", "product_side": "贸易端", "module": "SCCS设置", "last_write_time": "2026-09-04T10:48:45"}, {"title": "【贸易端】【协作SCCS设置】", "version": "v2.1.x", "product_side": "贸易端", "module": "协作SCCS设置", "last_write_time": "2026-09-04T10:48:42"}, {"title": "【运营端】【用户-SCCS管理】平台团队的SCCS数据管理", "version": "v2.1.x", "product_side": "运营端", "module": "用户-SCCS管理", "last_write_time": "2026-09-04T10:48:35"}, {"title": "【贸易端】【SCCS间关联】", "version": "v2.3.x", "product_side": "贸易端", "module": "SCCS间关联", "last_write_time": "2026-09-04T10:48:23"}, {"title": "【贸易端】【工作台】订单日程、任务中心、常用视图", "version": "v2.3.x", "product_side": "贸易端", "module": "工作台", "last_write_time": "2026-09-04T10:48:17"}, {"title": "【运营端】【SCCS列表-仪表盘】SCCS仪表盘管理", "version": "v2.3.x", "product_side": "运营端", "module": "SCCS列表-仪表盘", "last_write_time": "2026-09-04T10:48:09"}, {"title": "【运营端】【用户-SCCS管理】邮件协作列表", "version": "v2.3.x", "product_side": "运营端", "module": "用户-SCCS管理", "last_write_time": "2026-09-04T10:48:12"}, {"title": "【贸易端】【资源库】SCCS应用数据范围、数据编辑历史记录", "version": "v2.7", "product_side": "贸易端", "module": "资源库", "last_write_time": "2026-09-04T10:47:57"}]}, {"path": "docs/10-功能模块详情/FlowSpace数据互通.md", "title": "FlowSpace数据互通", "folder": "docs/10-功能模块详情", "text": " # FlowSpace 数据互通  ## 1. 功能定位  FlowSpace 数据互通用于在同一团队内，将本团队创建或参与协作的不同 FlowSpace 建立数据引用关系。团队管理员或具备权限的成员可在团队设置中配置互通方案，定义来源 FlowSpace、目标 FlowSpace、可引用模块、目标写入位置、字段映射、子表写入规则和来源变化响应方式。  首期只支持目标侧在创建、编辑或查看数据时发起引用，不支持来源侧主动推送；只支持当前团队参与或创建的 FlowSpace，不支持跨团队任意互通。  ## 2. 核心对象  | 对象 | 说明 | | --- | --- | | 互通方案 | 团队内配置的两个 FlowSpace 之间的数据互通规则 | | 来源 FlowSpace | 提供被引用数据的 FlowSpace | | 目标 FlowSpace | 当前创建或编辑数据、接收引用关系或写入字段的 FlowSpace | | 来源数据 | 引用弹窗中选中的来源数据，可来自订单主表单、工单、工单批复或里程碑批复 | | 目标数据 | 当前正在创建、编辑或查看的目标 FlowSpace 数据 | | 仅关联 | 只建立来源数据与目标数据关系，不写入字段 | | 关联并写入数据 | 建立关系，并按字段映射把来源字段写入目标字段 | | 当前启用版本 | 对新增引用执行生效的发布版本 | | 草稿版本 | 未发布配置，不影响当前启用版本 | | 执行版本 | 某次引用或后续更新实际使用的方案版本 | | 关联键 | 识别来源数据与目标字段、目标子表行持续同步关系的标识 |  ## 3. 权限规则  | 权限点 | 控制范围 | | --- | --- | | FlowSpace 互通配置 | 团队设置 > FlowSpace 互通菜单、方案创建、编辑、发布、停用和历史版本 | | 目标侧引用入口 | 当前目标 FlowSpace 存在启用方案、目标模块和目标操作匹配、用户具备目标数据创建或编辑权限、目标数据状态允许写入 |  配置人不要求拥有来源或目标 FlowSpace 的完整业务数据查看、编辑权限。配置时可选 FlowSpace、模块和字段范围由系统按团队身份、主团队开放范围、协作团队可见范围限制，保存草稿和发布时后端必须再次校验。  引用入口不要求目标侧用户拥有来源 FlowSpace 的完整业务权限；引用弹窗只展示方案允许引用且当前用户可见的数据。来源字段展示需受主团队数据围栏和协作团队开放里程碑范围限制。  ## 4. 入口与列表  在团队设置左侧菜单新增 `FlowSpace 互通`。有 `FlowSpace 互通配置` 权限的成员可见；无权限成员不可见，通过 URL 访问需提示无权限。  互通方案列表支持按方案名称、方案编码、来源 FlowSpace、目标 FlowSpace 模糊搜索，并按状态筛选。列表展示方案名称、来源到目标、状态、当前启用版本、草稿版本和操作入口。  | 操作 | 规则 | | --- | --- | | 创建 | 打开创建 FlowSpace 互通方案弹窗 | | 查看 | 展示当前启用版本；停用时展示最新版本；无发布版本且只有草稿时展示草稿 | | 编辑 | 有草稿时打开草稿；无草稿时基于当前启用版本或最新发布版本编辑 | | 历史版本 | 展示所有发布版本和当前草稿 |  一个方案最多只存在一份草稿，草稿不是按成员分别保存。  ## 5. 创建和编辑方案  创建或编辑方案分为四步：基础信息、FlowSpace 互通模块、字段映射、保存或发布。用户可随时保存草稿，保存草稿不影响当前启用版本。  ### 5.1 基础信息  | 字段 | 规则 | | --- | --- | | 方案名称 | 必填，同团队内唯一 | | 方案编码 | 系统生成，全系统唯一，用户不可手动修改 | | 方案说明 | 非必填 |  方案名称为空时不允许进入下一步。  ### 5.2 FlowSpace 互通模块  | 配置项 | 规则 | | --- | --- | | 来源 FlowSpace | 可选当前团队创建或参与协作的 FlowSpace，协作 FlowSpace 展示协作标识 | | 目标 FlowSpace | 可选当前团队创建或参与协作的 FlowSpace，不能与来源 FlowSpace 相同 | | 互通处理方式 | `仅关联` 或 `关联并写入数据` | | 来源数据模块 | 订单基本信息、各里程碑工单、各里程碑工单批复、各里程碑批复 | | 来源数据选择方式 | 单选或多选；多选时需配置最多可选数量，最大 99 | | 是否允许跨订单选择 | 控制一次引用是否可选择不同订单下的数据 | | 是否允许重复引用 | 不允许时，同方案下已被其他目标数据引用的来源数据不再展示或置灰，提交时后端再次校验 | | 目标数据模块 | 订单基本信息、各里程碑工单、各里程碑工单批复、各里程碑批复 | | 目标操作 | 创建时引用、编辑时引用、创建和编辑时均可引用；仅关联时可配置查看时关联 |  协作 FlowSpace 只允许配置主表单以及主团队开放给当前团队的里程碑范围。来源 FlowSpace 配置了数据围栏时，协作团队不可见字段不得作为来源字段展示或写入。  ## 6. 字段映射  仅 `关联并写入数据` 需要配置字段映射，`仅关联` 跳过字段映射步骤。  ### 6.1 非子表字段映射  目标为非子表字段时，最终只能写入一个目标字段值。若来源可能产生多个值，必须通过聚合规则得到一个值。来源字段可来自步骤二所选来源数据模块字段以及来源 FlowSpace 的订单基本信息字段；目标字段来自步骤二所选目标数据模块字段。  目标字段不可选择公式字段、系统字段和关联引用。目标字段类型必须与来源字段兼容，不兼容时不可选或保存时报错。  常见聚合规则：  | 目标字段类型 | 聚合规则 | | --- | --- | | 文本或富文本 | 取第一、取最后、去重拼接、全部拼接 | | 数字 | 取第一、取最后、求和、平均值、最大值、最小值、计数、非空计数 | | 百分比、汇率、评分 | 取第一、取最后、平均值、最大值、最小值 | | 日期时间 | 取第一、取最后、最早日期、最晚日期 | | 单选、成员单选、协作单选 | 取第一、取最后、出现次数最多、出现次数最少 | | 多选、成员多选、协作多选 | 取第一、取最后、取并集、取交集 | | 图片、附件 | 取第一、取最后、合并全部、合并去重 | | 定位、地址、签名 | 取第一、取最后 |  当来源为子表字段、目标为非子表字段时，聚合规则还需支持 `取首行` 和 `取尾行`。  ### 6.2 子表字段映射  目标为子表字段时，必须先选择目标子表，再在该子表下添加字段映射。一个目标子表对应一套子表行写入规则，不同目标子表可配置不同规则。  子表写入必须记录关联键，便于后续来源变化时识别应更新的目标行。设计和测试时需区分新增行、更新已有行、来源行删除、目标行被删除、关联键冲突等场景。  ### 6.3 手动修改与后续更新  字段可配置关联后是否允许手动修改：  | 配置 | 规则 | | --- | --- | | 允许 | 引用后仍可通过手输方式修改 | | 不允许 | 只有引用来源数据后字段才不可手动输入；未引用前按原字段状态 |  字段可配置来源变化响应方式：  | 策略 | 规则 | | --- | --- | | 不更新 | 建立关系后不因来源变化自动回写目标字段 | | 每次变更都更新 | 来源数据变更时，按执行版本和字段级策略同步更新目标数据 |  ## 7. 目标侧引用  在目标数据创建或编辑弹窗右上角展示 `从其他 FlowSpace 引用数据`。展示条件包括目标 FlowSpace 存在启用方案、目标模块匹配、目标操作匹配、当前数据状态允许操作、用户具备目标创建或编辑权限。  点击入口后打开引用弹窗。若同一目标数据存在多个来源方案，顶部先选择互通方案；只有一个可用方案时默认选中。来源数据列表展示订单标识、工单名称和来源模块字段，子表字段可展开。  确认引用后：  1. 按字段映射写入目标字段。 2. 目标侧被数据围栏限制不可见字段也可写入，只是当前用户不可见。 3. 保存目标数据时，后端重新校验方案状态、执行版本、来源数据、目标数据状态、权限和字段可写性。 4. 建立来源数据与目标数据关系。 5. 在目标模块展示 `FS 关联` 标识。 6. 来源侧至少保留后端关系和日志。  引用不改变目标创建或编辑流程：原有必填、处理人、采集人、批复人、状态流转、字段格式和权限校验仍按目标模块原逻辑执行。  ## 8. 关联关系展示  引用成功后，相关数据模块展示关联信息。  | 模块 | 展示位置 | | --- | --- | | 订单基本信息 | 订单详情顶部关联信息区展示 `FS 关联` 标识和来源摘要 | | 工单 | 工单详情或工单卡片展示关联标识 | | 工单批复 | 批复区域展示关联标识 | | 里程碑批复 | 批复区域展示关联标识 |  来源为主表单时，来源标识为订单标识；来源为里程碑批复时，来源标识为订单标识、里程碑名称和批复；来源为工单时，来源标识为订单标识、里程碑名称和工单名称。  有权限查看来源数据时可点击跳转到来源数据详情；无权限时提示 `暂无权限`；来源数据被删除或失效时展示 `来源数据已失效`，并保留关系快照。  ## 9. 来源变化后的更新  来源订单基本信息字段编辑、来源工单采集字段提交或编辑、工单批复字段提交或编辑、里程碑批复字段提交或编辑、来源子表行新增编辑删除，以及来源字段由资源库同步、自动化、外部 API 或公式触发变化时，都需要触发后续更新判断。  更新规则：  1. 已建立关系的数据继续按执行时绑定的方案版本展示和后续更新。 2. 方案配置变更不会立即影响已建立关系；用户重新编辑目标数据并重新引用时，才按最新版本处理。 3. 目标对象已完成、已取消、已批复、字段锁定、只读、资源库持续同步、公式计算或无写入权限时，跳过更新并记录原因。 4. 多来源关系中任一来源变化时，重新读取关系组内所有有效来源数据，按执行版本聚合规则重新计算目标字段。 5. 来源数据失效不参与后续聚合，目标已写入值是否清空需按异常策略处理。  ## 10. 日志与审计  FlowSpace 数据互通至少包含三类审计记录：  | 日志类型 | 记录内容 | | --- | --- | | 互通方案操作日志 | 方案配置层面的创建、编辑、保存草稿、发布、启用、停用、删除草稿和快照 | | 互通执行日志 | 某次引用、写入、后续同步、手动刷新、失败、跳过、取消关联等执行结果 | | 业务模块日志 | 订单跟踪记录、工单动态、里程碑批复动态和对应历史记录中的业务数据变化 |  互通方案操作日志只记录方案配置变化，不记录具体哪条订单引用了数据。引用执行成功或失败不写入方案操作日志，应写入互通执行日志。  业务模块文案口径：  | 场景 | 文案 | | --- | --- | | 建立仅关联 | `$操作人 通过 FlowSpace 互通方案「$方案名称」建立与 $来源FlowSpace / $来源数据标识 的关联，使用版本 $版本号` | | 引用并写入 | `$操作人 通过 FlowSpace 互通方案「$方案名称」引用 $来源FlowSpace / $来源数据标识，并写入 $字段数量 个字段，使用版本 $版本号` | | 来源变更自动更新目标 | `系统根据 FlowSpace 互通方案「$方案名称」$版本号，自动更新来自 $来源数据标识 的关联字段` | | 手动刷新 | `$操作人 手动刷新 FlowSpace 互通字段，来源 $来源数据标识，使用版本 $版本号` | | 跳过更新 | `FlowSpace 互通更新跳过：$原因` |  历史记录需写入前后值，标记操作来源为 `FlowSpace 互通`，并记录方案 ID、方案版本 ID、关系 ID、来源数据 ID 和目标数据 ID。子表需记录行级新增、编辑、删除或跳过。  ## 11. 兼容与互斥  | 能力 | 规则 | | --- | --- | | 资源库同步字段 | 目标字段若处于资源库持续同步中，不允许作为目标写入字段 | | 公式字段 | 目标公式字段不可直接写入，可作为来源字段读取计算结果 | | 自动化 | 自动化和 FlowSpace 互通同时写入同一字段时，自动化执行同人工执行规则；不可手动写入字段执行失败 | | 手动编辑 | 按字段的关联后是否允许手动修改和来源变化响应方式处理 | | 订单关联、翻单、工单互用 | 展示上可同时存在多个关联标识，日志分别记录，不互相替代 |  ## 12. 待确认问题  - 资源库同步和 FlowSpace 互通同时作用于同一目标字段时，是否能支持最后一次引用覆盖以及后续更新的单字段关系。 - 方案停用后，已建立关系是否继续响应来源数据变更；建议继续响应，除非关系被取消。 - 来源子表行被删除时，目标子表行是删除、标记失效还是保留快照；建议首期保留快照并标记来源失效。 - 数据围栏与敏感字段变化后，历史已写入值是否需要回溯遮蔽。 - 是否支持取消 FS 关联，以及取消后目标字段保留、清空或转为普通值的规则。 - 关联标识、来源摘要、方案版本是否需要支持导出。 - 自动化、资源库同步、FlowSpace 互通同时写入同一字段时的全局优先级是否需要配置化。", "domain": "贸易端", "module": "功能模块详情", "tags": "FlowSpace;数据互通;字段映射;数据同步;审计日志", "sources": [{"title": "【贸易端】FlowSpace 数据互通", "version": "v2.9", "product_side": "贸易端", "module": "贸易端", "last_write_time": "2026-09-04T10:47:46"}]}, {"path": "docs/10-功能模块详情/FlowSpace数据移交.md", "title": "FlowSpace数据移交", "folder": "docs/10-功能模块详情", "text": " # FlowSpace 数据移交  ## 1. 功能定位  FlowSpace 数据移交用于在员工离职、成员被移出 FlowSpace、业务板块调整或岗位变更时，将当前 FlowSpace 内与原成员相关的业务角色数据移交给其他成员，避免订单、里程碑和工单任务无人负责，并延续历史资料的查看与处理责任。  本期仅支持单一 FlowSpace 内的数据移交，不支持跨 FlowSpace 移交；不迁移订单创建人、订单编辑人、工单创建人、里程碑创建人等历史创建或编辑角色；自动化配置不参与移交，仅在执行结果中提示用户自行检查。  ## 2. 可移交数据  | 数据类型 | 角色类型 | 接收成员规则 | | --- | --- | --- | | 订单负责人 | 单一负责人 | 仅可配置一名接收成员 | | 里程碑负责人 | 单一负责人 | 仅可配置一名接收成员 | | 工单采集人 | 任务处理人 | 可配置多名接收成员 | | 工单批复人 | 任务处理人 | 可配置多名接收成员 | | 里程碑批复人 | 任务处理人 | 可配置多名接收成员 |  全状态数据均可进入移交范围。订单、里程碑、工单无论处于进行中、已完成、已取消、已终止等状态，只要原成员仍在对应角色中，就可被纳入移交，以保证历史资料的可见性和后续追溯。  任务处理人类数据移交时，需要保留原任务中除移交成员外的其他处理人，并加入新的接收成员。示例：原处理人为张三、李四，将张三移交给王五、赵六后，处理人变为李四、王五、赵六。  订单系统字段需要增加订单负责人，默认值为订单创建人；系统内已有订单需要清洗为订单创建人。订单/工单列表的字段配置、筛选、排序、模糊搜索和列统计均需要支持订单负责人字段。订单负责人也会进入自动化条件、标签条件和自定义权限条件。  里程碑负责人可选择协作团队下成员。协作成员成为里程碑负责人后，沿用当前负责人规则，拥有该订单对应里程碑下的相关操作权限。  ## 3. 成员范围  | 操作团队 | 可移交原成员范围 | 可选接收成员范围 | | --- | --- | --- | | 主团队 | 主团队成员数据、各协作团队成员数据，无论成员是否已移出当前 FlowSpace | 当前 FlowSpace 内的主团队成员、各协作团队成员 | | 协作团队 | 本协作团队下成员数据，无论成员是否已移出当前 FlowSpace | 当前 FlowSpace 内的本协作团队成员 |  数据移交有独立入口。移交时可见其管理范围内的成员数据，但不改变执行人在订单列表中的日常可见数据范围。  ## 4. 权限与入口  数据移交入口位于当前 FlowSpace 的 `FlowSpace 管理 > 数据移交`。拥有数据移交权限的成员可看到入口，页面包含 `发起移交` 和 `移交记录` 两个页签。  需要新增以下权限点：  | 权限对象 | 权限点 | 控制范围 | | --- | --- | --- | | 内部 FlowSpace 业务角色 | 数据移交 | 在当前 FlowSpace 内发起数据移交、查看移交记录 | | 协作 FlowSpace 自建角色 | 数据移交 | 在本协作团队可管理范围内发起数据移交、查看移交记录 |  ## 5. 移交流程  发起移交采用四步流程：  1. 选择移交成员及其需要移交的数据。 2. 配置接收成员。 3. 确认并执行。 4. 查看执行结果。  选择原成员后，页面展示可移交数据类型卡片，默认全选。每个卡片展示本次已选择数量和该类数据总数；点击数量可打开数据选择弹窗，预览、筛选并勾选具体数据。  预览与筛选规则：  - 订单负责人仅展示订单负责人为该成员的订单。 - 里程碑负责人仅展示里程碑负责人为该成员的订单。 - 工单采集人仅展示工单采集人包含该成员的工单，并剔除里程碑互用自其他订单的工单。 - 工单批复人仅展示工单批复人包含该成员的工单，并剔除里程碑互用自其他订单的工单。 - 里程碑批复人仅展示里程碑批复人包含该成员的里程碑，并剔除里程碑互用自其他订单的工单。  确认执行前必须校验：已选择原成员、至少存在 1 条待移交数据、每个已选数据类型均已配置接收成员、移交原因已选择、接收成员仍在当前 FlowSpace 且未被冻结/停用/失效、当前执行人拥有数据移交权限，并防止重复提交。  移交原因为必填单选：员工离职、岗位变更、业务板块调整、其他。选择“其他”时必须填写原因说明或备注。  配置接收成员时，订单负责人和里程碑负责人只能单选当前 FlowSpace 内的具体主团队成员或协作团队成员，不可配置协作团队负责人。工单采集人、工单批复人和里程碑批复人可配置多名内部成员、协作成员或协作团队负责人。  确认页需要展示原成员信息、移交数据汇总、数据预览与变更对比、移交原因和备注。任务处理人类数据的移交后列表必须展示最终处理人：原处理人被标识为移除，新接收人被标识为新增，未变化成员保留。  ## 6. 执行结果与失败原因  执行结果分为全部成功、部分成功、全部失败，并展示计划处理数、成功数、失败数。失败数量大于 0 时，可查看失败明细。  常见失败原因包括：  - 订单已删除。 - 执行期间原负责人或原处理人已被其他成员修改。 - 执行期间接收人已被移出 FlowSpace。 - 里程碑不存在。 - 工单已删除。 - 执行期间里程碑已被其他订单互用。  ## 7. 移交记录  移交记录列表支持按原成员、执行状态、执行人、执行时间筛选。每个团队进入移交记录页面时，仅查看本团队操作的移交记录。  记录列表字段包括：操作 ID、原成员、接收成员、移交原因、执行状态、执行数据、执行人和执行时间。详情页展示原成员摘要、执行结果、移交原因、备注、各类型执行结果、失败数据和成功数据。  ## 8. 通知、日志与权限影响  移交成功后，需要给每个接收成员发送一条待处理类消息通知，站内和邮件同步发送；原负责人或原处理人不发送移交通知。  移交成功后，需要在相关业务动态中记录移交行为：  | 移交类型 | 记录模块 | 记录口径 | | --- | --- | --- | | 订单负责人 | 订单跟踪记录 | `$执行人 已将订单负责人从 $原负责人 移交给 $新负责人。移交原因：XXXX。备注：xxxx` | | 里程碑负责人 | 订单跟踪记录 | `$执行人 已将 $里程碑 负责人从 $原负责人 移交给 $新负责人。移交原因：XXXX。备注：xxxx` | | 工单采集人 | 工单动态 | `$执行人 已将工单任务从 $原处理人 移交给 $新处理人。移交原因：XXXX。备注：xxxx` | | 工单批复人 | 工单动态 | `$执行人 已将工单批复任务从 $原处理人 移交给 $新处理人。移交原因：XXXX。备注：xxxx` | | 里程碑批复人 | 里程碑批复动态 | `$执行人 已将里程碑批复任务从 $原处理人 移交给 $新处理人。移交原因：XXXX。备注：xxxx` |  权限影响：  - 订单负责人移交后，新订单负责人不会默认获得订单可见或操作权限；是否获得订单数据权限，取决于自定义权限条件是否配置了订单负责人。 - 里程碑负责人移交后，新里程碑负责人拥有对应订单下相关里程碑的所有操作权限。 - 工单采集人、工单批复人、里程碑批复人移交后，新处理人获得对应任务处理权限。 - 工单采集任务仅移交原处理人可编辑的表单，不移交整个工单。 - 历史数据状态不因移交发生变化。  ## 9. 待移交提醒  当当前 FlowSpace 中存在已移出 FlowSpace 且仍持有可移交数据的成员时，拥有数据移交权限的成员进入 FlowSpace 后，在顶部展示提醒条：`有 x 名成员存在待移交数据，请前往处理`。  提醒操作：  | 操作 | 说明 | | --- | --- | | 立即处理 | 进入 `FlowSpace 管理 > 数据移交`，并自动定位到发起移交页签 | | 无需移交，不再提醒 | 二次确认后，当前用户不再收到本次提醒中的成员提示 | | 关闭 | 仅关闭当前提醒，下次进入 FlowSpace 时再次出现 |  不再提醒仅针对当前用户。当同一成员重新加入 FlowSpace 后再次被移除，或出现新的已移出成员时，需要重新触发提醒规则。  成员移除时也需要提示待移交风险：  - 在 FlowSpace 设置中删除成员时，如果操作人拥有数据移交权限且该成员存在待移交数据，弹窗提示是否前往移交。 - 在团队设置中删除成员时，如果该成员在多个 FlowSpace 中存在待移交数据，提示对应 FlowSpace 名称；点击名称可跳转到对应 FlowSpace 的数据移交页面。  ## 10. 自动化配置提示  本期自动化配置不参与移交。当原成员可能存在自动化配置相关负责人、执行人或通知人时，在执行结果页提示用户需要到自动化中单独检查并调整。该提示不阻断数据移交流程。  ## 11. 待确认问题  - 订单负责人默认不直接赋予订单权限，需通过自定义权限条件配置；移交后命中该条件的列表可见范围和权限缓存是否需要立即刷新，仍需结合权限服务实现确认。", "domain": "贸易端", "module": "FlowSpace", "tags": "FlowSpace;数据移交;订单负责人;里程碑负责人;工单处理人", "sources": [{"title": "【贸易端】FS 数据移交", "version": "v2.8", "product_side": "贸易端", "module": "贸易端", "last_write_time": "2026-09-04T10:47:56"}]}, {"path": "docs/10-功能模块详情/PDF与批量导入导出.md", "title": "PDF与批量导入导出", "folder": "docs/10-功能模块详情", "text": " # PDF与批量导入导出  ## 1. 功能定位  批量导入导出用于将订单、工单、资源库数据与本地 Excel、CSV、PDF 文件流转。导入导出必须同时遵守模板字段配置、组件校验、权限、数据围栏、对象状态、历史记录和进程中心规则。  ## 2. 业务模板中的 PDF 导入设置  业务模板可配置 PDF 导入：  - PDF 导入开关默认关闭。 - 当前暂支持指定 PDF 模板。 - 可配置 PDF 附件是否导入到主表单附件字段。 - 贸易端支持上传多份 PDF 文件导入。 - 模板发布和同步至 FlowSpace 时，PDF 导入设置也属于同步内容。  ## 3. 订单 Excel 导入  | 步骤 | 规则 | | --- | --- | | 上传文件 | 支持 `.xls`、`.xlsx`、`.csv`；拖拽不支持格式时提示 | | 导入设置 | 选择工作表、匹配系统字段、设置过滤重复字段、字段格式、日期格式 | | 导入数据 | 分为新增和覆盖；覆盖可选覆盖整行或覆盖有值 | | 执行导入 | 在进程中心显示导入任务，完成后提示成功或失败 | | 导入记录 | 仅能查看本人导入记录，下载文件增加导入执行结果 |  订单导入支持 999 行订单数。订单 ID、成员邮箱、地址不区分大小写，其余控件区分大小写。  ## 4. 订单 PDF 导入  PDF 导入与 Excel 导入主要差异：  - 仅支持 `.pdf` 文件，可上传多份。 - 无需选择工作表。 - 导入文件字段展示运营端配置需导入的字段。 - 无需手动匹配系统字段。 - 过滤重复数据设置与 Excel 分别记忆。 - 识别多份 PDF 的订单数据后，归类为新增或覆盖，后续操作同 Excel 导入。  ## 5. 工单导入  | 规则 | 说明 | | --- | --- | | 权限入口 | 有任意里程碑导入权限的用户可见工单导入按钮 | | 里程碑选择 | 只能选择当前用户有工单导入权限的里程碑 | | 模板字段 | 订单识别字段 + 工单采集字段 | | 匹配订单 | 仅在当前用户有导入工单权限的订单范围内匹配 | | 新增 | 匹配到订单的数据可作为新工单导入 | | 覆盖 | 对有采集权限的已有工单可覆盖采集部分内容 | | 未匹配 | 未匹配到订单的数据仅可查看，不可导入 |  新增工单成功后，工单采集人为导入成员；批复人默认跟随运营端配置，未配置时取导入成员。若此前未创建里程碑批复，则同步创建。  ## 6. 资源库导入导出  资源库导入支持工作表选择、字段匹配、重复数据识别、新增、覆盖整行、覆盖有值、导入记录和进程中心。导入成功后，资源库数据历史记录增加导入人操作的新增或修改记录。  资源库导出可选择导出当前资源库或当前表数据。导出当前整个资源库时，仅导出当前用户有查看权限的表。  ## 7. 导入失败与校验  常见失败原因：  - 当前用户无导入权限。 - 未设置任何新增或覆盖数据。 - 同一条数据同时设为新增和覆盖。 - 覆盖未选择目标数据。 - 多行覆盖至同一条系统数据。 - 对象已完成、已取消或已删除。 - 必填项为空。 - 控件内容不符合输入规则。 - 单选/多选内容与选项值不一致。 - 日期格式与运营端配置不符。  如果必填项正好是当前用户被数据围栏限制不可见字段，则导入时不校验该字段。  ## 8. 导出规则  订单导出范围为当前用户权限内可见的订单、里程碑批复、里程碑工单数据。  导出内容：  - 订单信息，包括订单字段和各里程碑批复字段，需排除数据围栏不可见字段。 - 里程碑工单，按里程碑分 sheet。 - 字段修改次数统计。  导出内容无字段或无数据时，不执行导出并提示没有可导出的数据。  ## 9. 待确认问题  - PDF 字段整理目前仍引用外部资料，建议导出成本地来源。 - 订单、工单、资源库导入的字段类型支持范围需要沉淀为统一矩阵。 - 数据围栏对导入、导出、记录下载的影响需要继续验证。 ", "domain": "贸易端", "module": "功能模块详情", "tags": "导入;导出;PDF;Excel", "sources": [{"title": "【运营端】【模板中心】业务模版管理", "version": "v2.0.x", "product_side": "运营端", "module": "模板中心", "last_write_time": "2026-09-04T10:48:49"}, {"title": "【贸易端】【订单列表】订单导入、订单导出", "version": "v2.3.x", "product_side": "贸易端", "module": "订单列表", "last_write_time": "2026-09-04T10:48:17"}, {"title": "【贸易端】【订单列表】工单导入、导出", "version": "v2.3.x", "product_side": "贸易端", "module": "订单列表", "last_write_time": "2026-09-04T10:48:17"}, {"title": "【贸易端】【资源库】第一阶段", "version": "V2.4.x", "product_side": "贸易端", "module": "资源库", "last_write_time": "2026-09-04T10:48:14"}]}, {"path": "docs/10-功能模块详情/README.md", "title": "10 功能模块详情", "folder": "docs/10-功能模块详情", "text": "# 10 功能模块详情  本目录是面向产品成员、运营、研发和新成员的功能阅读入口。模块页负责说明范围和跳转，不复制业务对象、流程、权限和数据规则。  ## 页面  - [工作台](./工作台.md) - [FlowSpace](./FlowSpace.md) - [FlowSpace 数据移交](./FlowSpace数据移交.md) - [FlowSpace 数据互通](./FlowSpace数据互通.md) - [通用交互规范](./通用交互规范.md) - [业务模板](./业务模板.md) - [订单](./订单.md) - [工单与批复](./工单与批复.md) - [工单还原采集](./工单还原采集.md) - [工单表单互用与复制](./工单表单互用与复制.md) - [资源库](./资源库.md) - [资源库快捷创建引用数据](./资源库快捷创建引用数据.md) - [表单设计器](./表单设计器.md) - [实验室检验流程](./实验室检验流程.md) - [自动化](./自动化.md) - [消息通知](./消息通知.md) - [仪表盘与报表](./仪表盘与报表.md) - [设置与权限](./设置与权限.md) - [运营端](./运营端.md) - [贸易端](./贸易端.md) - [采集端](./采集端.md) - [采集端图片编辑](./采集端图片编辑.md) - [三端数据关系](./三端数据关系.md) - [账号与个人中心](./账号与个人中心.md)", "domain": "公共能力", "module": "功能模块详情", "tags": "10-功能模块详情;10 功能模块详情", "sources": [{"title": "【贸易端】【工作台】工作台、创建SCCS、SCCS分组", "version": "v2.0.x", "product_side": "贸易端", "module": "工作台", "last_write_time": "2026-09-04T10:48:46"}, {"title": "【贸易端】【账号】注册登录、忘记密码", "version": "v2.0.x", "product_side": "贸易端", "module": "账号", "last_write_time": "2026-09-04T10:48:52"}, {"title": "【运营端】【模板中心】业务模版管理", "version": "v2.0.x", "product_side": "运营端", "module": "模板中心", "last_write_time": "2026-09-04T10:48:49"}, {"title": "【贸易端】【自动化】一期", "version": "V2.4.x", "product_side": "贸易端", "module": "自动化", "last_write_time": "2026-09-04T10:48:09"}, {"title": "【贸易端】【资源库】第一阶段", "version": "V2.4.x", "product_side": "贸易端", "module": "资源库", "last_write_time": "2026-09-04T10:48:14"}]}, {"path": "docs/10-功能模块详情/三端数据关系.md", "title": "三端数据关系", "folder": "docs/10-功能模块详情", "text": "# 三端数据关系  ## 1. 总览  Linkincrease 的三端不是并列孤岛，而是围绕同一套业务对象形成配置、执行、监管和回流关系。  flowchart LR A[\"运营端<br/>模板、配置、监管、集成\"] --> B[\"贸易端<br/>团队、FlowSpace、订单、资源库、协作\"] B --> C[\"采集端<br/>任务、采集、批复、消息\"] C --> B B --> A  简化理解：  - 运营端定义和监管平台能力。 - 贸易端承载客户团队的业务运行。 - 采集端处理移动执行任务，并把结果回流贸易端。  ## 2. 数据主从关系  | 数据或能力 | 主维护端 | 使用端 | 说明 | | --- | --- | --- | --- | | 用户账号 | 运营端监管，用户自维护 | 贸易端、采集端 | 运营端可查看和管理账号状态；用户在个人中心维护个人信息 | | 团队 | 贸易端创建维护，运营端监管 | 贸易端、运营端、采集端 | 团队是业务归属单位；采集端通过团队切换查看任务 | | FlowSpace | 贸易端创建维护，运营端监管 | 贸易端、采集端、运营端 | FlowSpace 承载订单、工单、资源库应用、仪表盘和报告 | | 业务模板 | 运营端 | 贸易端 | 贸易端创建 FlowSpace 时使用运营端模板 | | 资源库模板 | 运营端 | 贸易端 | 贸易端创建团队资源库时使用运营端模板 | | 表单组件和显隐规则 | 运营端 | 贸易端、采集端 | 采集端任务详情页展示和填写规则受模板配置影响 | | 订单 | 贸易端 | 采集端、运营端 | 订单在贸易端创建和管理；采集端展示任务关联订单；运营端可监管数据 | | 里程碑 | 贸易端 | 采集端、运营端 | 里程碑定义订单流程节点和批复任务 | | 工单 | 贸易端 | 采集端、运营端 | 工单可在贸易端发起，在采集端移动填写和提交 | | 工单批复 | 贸易端 | 采集端、运营端 | 批复任务可在采集端处理，结果回流贸易端 | | 里程碑批复 | 贸易端 | 采集端、运营端 | 采集端可处理里程碑批复任务 | | 资源库数据 | 贸易端 | 贸易端、采集端、运营端 | 资源库数据可被订单或工单引用，运营端监管资源库数据 | | 自动化 | 贸易端配置，运营端监管 | 贸易端、运营端 | 自动化执行结果进入日志，部分动作影响订单、工单、资源库 | | 消息通知 | 贸易端和系统触发 | 贸易端、采集端 | 消息状态需要跨端一致 | | 仪表盘和报告 | 运营端配置或监管，贸易端使用 | 贸易端、运营端 | 权限控制决定查看和管理范围 | | 日志审计 | 系统记录 | 贸易端、运营端 | 设置、操作、动态、历史、系统执行均需要可追溯 |  ## 3. 核心数据流  ### 3.1 从模板到 FlowSpace  1. 运营端维护业务模板、资源库模板、表单组件、字段规则。 2. 贸易端在工作台选择模板创建 FlowSpace。 3. FlowSpace 生成订单、里程碑、工单、权限、仪表盘等业务空间。 4. 后续模板更新需要按同步规则影响已创建的 FlowSpace。  参考：[从模板到FlowSpace](../30-业务流程与产品流程图/从模板到FlowSpace.md)。  ### 3.2 从订单到移动采集  1. 贸易端创建或导入订单。 2. 贸易端在订单里程碑下创建工单、工单批复或里程碑批复。 3. 采集端按用户、团队、FlowSpace、任务状态展示待办任务。 4. 执行人员在采集端填写工单或提交批复。 5. 数据、动态、历史记录和任务状态回流贸易端。  参考：[工单采集与批复](../30-业务流程与产品流程图/工单采集与批复.md)、[移动端采集](../30-业务流程与产品流程图/移动端采集.md)。  ### 3.3 从资源库到业务表单  1. 运营端维护资源库模板。 2. 贸易端基于模板创建团队资源库。 3. FlowSpace 应用资源库数据范围。 4. 订单或工单字段引用资源库数据。 5. 资源库数据变更后，按引用和同步规则更新业务数据。 6. 系统记录资源库同步和字段变更历史。  参考：[资源库引用与同步](../30-业务流程与产品流程图/资源库引用与同步.md)。  ### 3.4 从协作到通知  1. 贸易端发起成员邀请、协作团队邀请、工单指派或邮件协作。 2. 系统按场景生成消息、实时通知、邮件或任务入口。 3. 贸易端和采集端展示未读、待办、关注、团队指派等状态。 4. 处理结果回流并更新任务状态、动态和日志。  参考：[消息中心与实时通知](../10-功能模块详情/消息中心与实时通知.md)、[邮件协作](../10-功能模块详情/邮件协作.md)。  ## 4. 权限边界  三端权限关系应按“平台监管、团队归属、FlowSpace 业务角色、协作方角色、数据围栏、资源权限、展示权限”分层理解。  | 层级 | 主要控制点 | | --- | --- | | 平台监管权限 | 运营端可查看和监管平台用户、团队、FlowSpace、资源库、软件和系统记录 | | 团队权限 | 贸易端团队拥有者、管理员、成员等角色控制团队设置和成员管理 | | FlowSpace 权限 | FlowSpace 业务角色控制订单、里程碑、工单、仪表盘、报告等操作 | | 协作权限 | 协作团队和协作方角色控制外部团队可见和可操作范围 | | 数据围栏 | 控制字段、标签、数据范围对不同成员或团队是否可见 | | 采集端权限 | 采集端按用户任务、编辑权限、指派权限决定按钮和表单状态 |  参考：[权限体系总表](../40-权限、安全与审计/权限体系总表.md)。  ## 5. 知识库维护规则  1. 涉及三端共有对象时，优先写入 `20-业务对象与数据模型/`。 2. 涉及跨端动作链路时，优先写入 `30-业务流程与产品流程图/`。 3. 涉及单端菜单、入口和页面职责时，写入 `10-功能模块详情/`。 4. 涉及权限边界时，必须同步引用或更新 `40-权限、安全与审计/`。 5. 涉及消息、日志、自动化、导入导出时，不要只写在页面说明里，应同步沉淀到对应横向能力目录。  ## 6. 来源  - `01-产品总览.md` - `03-功能地图.md` - `docs/10-功能模块详情/运营端.md` - `docs/10-功能模块详情/贸易端.md` - `docs/10-功能模块详情/采集端.md` - `docs/20-业务对象与数据模型/` - `docs/30-业务流程与产品流程图/` - `docs/40-权限、安全与审计/`", "domain": "公共能力", "module": "功能模块详情", "tags": "产品端;三端数据关系;数据流;权限;同步", "sources": []}, {"path": "docs/10-功能模块详情/业务模板.md", "title": "业务模板", "folder": "docs/10-功能模块详情", "text": "# 业务模板  本页是业务模板功能模块的阅读入口。  ## 模块范围  - 业务模板创建、复制、编辑、发布、停用、删除。 - 默认主表单、里程碑、里程碑挂载表单、工单表单、工单批复表单、里程碑批复表单。 - 模板同步到既有 FlowSpace 时的数据和权限影响。  ## 权威文档  - [业务模板](../20-业务对象与数据模型/业务模板.md) - [模板与实例关系](../20-业务对象与数据模型/模板与实例关系.md) - [字段、组件、子表、引用关系](../20-业务对象与数据模型/字段、组件、子表、引用关系.md) - [从模板到 FlowSpace](../30-业务流程与产品流程图/从模板到FlowSpace.md) ", "domain": "公共能力", "module": "功能模块详情", "tags": "10-功能模块详情;业务模板", "sources": [{"title": "【运营端】【模板中心】业务模版管理", "version": "v2.0.x", "product_side": "运营端", "module": "模板中心", "last_write_time": "2026-09-04T10:48:49"}, {"title": "【运营端】【业务模板】表单设计组件", "version": "v2.1.x", "product_side": "运营端", "module": "业务模板", "last_write_time": "2026-09-04T10:48:42"}, {"title": "【运营端】【业务模版】表单属性与显隐设置", "version": "v2.1.x", "product_side": "运营端", "module": "业务模版", "last_write_time": "2026-09-04T10:48:38"}, {"title": "【运营端】【模板中心】资源库模版管理", "version": "v2.3.x", "product_side": "运营端", "module": "模板中心", "last_write_time": "2026-09-04T10:48:13"}]}, {"path": "docs/10-功能模块详情/仪表盘与报表.md", "title": "仪表盘与报表", "folder": "docs/10-功能模块详情", "text": "# 仪表盘与报表  本页是仪表盘、报表、视图和分析能力的阅读入口。  ## 模块范围  - 仪表盘管理、仪表盘设计器、图表、筛选器、数据源。 - 报告管理、报告权限、订单报告、工单报告、第三方报告。 - 常用视图、视图设置、统计分析和数据权限边界。  ## 权威文档  - [仪表盘配置说明](../60-数据分析支持/仪表盘配置说明.md) - [报表权限](../60-数据分析支持/报表权限.md) - [分析场景](../60-数据分析支持/分析场景.md) - [仪表盘与报告权限](../40-权限、安全与审计/仪表盘与报告权限.md) ", "domain": "公共能力", "module": "功能模块详情", "tags": "10-功能模块详情;仪表盘与报表", "sources": [{"title": "【贸易端】【仪表盘】权限管理", "version": "V2.5.x", "product_side": "贸易端", "module": "仪表盘", "last_write_time": "2026-09-04T10:48:00"}, {"title": "【贸易端】报告权限", "version": "V2.5.x", "product_side": "贸易端", "module": "贸易端", "last_write_time": "2026-09-04T10:48:04"}, {"title": "【运营端】【SCCS管理】SCCS列表增加报告管理", "version": "V2.6.x", "product_side": "运营端", "module": "SCCS管理", "last_write_time": "2026-09-04T10:47:55"}, {"title": "【运营端】【SCCS列表-仪表盘】SCCS仪表盘管理", "version": "v2.3.x", "product_side": "运营端", "module": "SCCS列表-仪表盘", "last_write_time": "2026-09-04T10:48:09"}]}, {"path": "docs/10-功能模块详情/实验室检验流程.md", "title": "实验室检验流程", "folder": "docs/10-功能模块详情", "text": " # 实验室检验流程  ## 1. 功能定位  实验室检验流程用于在 Linkincrease 内打通“配置 - 预定 - 检测 - 批复 - 统计”的结构化业务闭环。运营端定义业务模板、资源库模板和行业组件规则；贸易端创建 FlowSpace、关联检测标准资源、维护套餐和项目，并组织检测业务；采集端执行实验室检测任务、录入结果并提交。  本能力不建设独立 LIMS，不覆盖实验室内部完整排程、设备、试剂和报告签发系统。首期重点是让检测套餐、项目、样品、执行结果、判定和金额等数据结构化，并可继续参与 Linkincrease 的关联引用、公式计算、报表、仪表盘、权限控制、动态、历史记录和批复流程。  最终结算规则仍需根据后续业务确认独立完善。  ## 2. 业务闭环  flowchart TD A[\"运营端配置实验室检测里程碑\"] --> B[\"运营端配置检测内容选择组件\"] A --> C[\"资源库模板配置检测项目/套餐套件\"] C --> D[\"贸易端维护检测项目与检测套餐\"] D --> E[\"FlowSpace 关联检测标准来源\"] E --> F[\"订单详情发起检测工单\"] F --> G[\"选择套餐或单项检测项目\"] G --> H[\"维护样品与检测范围\"] H --> I[\"生成检测执行任务\"] I --> J[\"贸易端或采集端录入检测结果\"] J --> K[\"工单批复/里程碑批复\"] K --> L[\"公式、报表、仪表盘和历史审计\"]  ## 3. 运营端模板配置  ### 3.1 实验室检测里程碑  业务模板中可新增一个实验室检测里程碑：  | 配置 | 规则 | | --- | --- | | 默认名称 | 实验室检测，可修改 | | 数量限制 | 同一业务模板最多一个 | | 添加校验 | 模板已包含实验室检测里程碑时，不允许重复添加 | | 里程碑属性 | 可编辑、可删除；工单批复不可关闭 | | 添加表单 | 实验室检测里程碑不展示普通“添加表单”入口 | | 批复类型 | 仅可选工单批复、里程碑批复 + 工单批复 |  删除实验室检测里程碑时，需同时删除该里程碑下固定表单，并清除模板内相关“检测内容选择”组件、初始内容来源、筛选规则和行业能力设置。  ### 3.2 固定表单组  实验室检测里程碑自动生成固定表单：  | 表单 | 表单类型 | 生成方式 | 规则 | | --- | --- | --- | --- | | 检测任务信息 | 工单表单 | 自动 | 普通可设计表单，可维护任务、负责人、审核人、实验室等基础信息 | | 检测标准与项目 | 工单表单 | 自动 | 不允许删除，不允许普通表单设计；通过检测内容选择设置管理 | | 样品与检测范围 | 工单表单 | 自动 | 维护样品、收样和样品与检测项目范围 | | 检测执行 | 工单表单 | 自动 | 录入检测结果、判定、特殊情况和临时判定条件 | | 检测报告 | 工单表单 | 自动 | 普通可设计表单，维护报告编号、日期、结论、备注和附件 | | 工单批复 | 工单批复表单 | 自动 | 不允许关闭 | | 里程碑批复 | 里程碑批复表单 | 按配置 | 可按既有表单设计能力配置 |  ### 3.3 检测内容选择组件  业务表单设计器新增行业组件：`检测内容选择`。当模板内存在实验室检测里程碑时，对应表单设计页展示该组件。  | 配置项 | 规则 | | --- | --- | | 允许选择检测套餐 | 默认开启，开启后贸易端可从已关联检测套餐库选择套餐 | | 允许添加单项检测项目 | 默认开启，开启后贸易端可从已关联检测项目库添加自选项目 | | 检测标准来源 | 系统自动关联当前模板唯一实验室检测能力 | | 筛选规则 | 仅当来源表单可能产生多条工单记录时展示 | | 条件配置 | 可按表单字段或固定值配置，字段类型和规则参照显隐或自动化 |  检测内容选择组件生成的数据需作为平台可用字段暴露，供公式、报表、仪表盘、批复和历史记录按权限使用。  ## 4. 资源库模板与检测标准  资源库模板表单设计器新增“实验室检测”行业组件分组，包含两个套件：`检测项目配置套件` 和 `检测套餐配置套件`。套件整体加入，成员整行展示；点击外框查看结构，点击成员配置属性。套件成员不能单独拖出、复制或删除。  ### 4.1 检测项目配置套件  检测项目配置套件用于提供检测项目分类和多方法方案结构。运营端配置分类、方法来源及展示规则；贸易端在项目记录中维护实际方法方案。  | 能力 | 规则 | | --- | --- | | 检测项目分类 | 支持通用检测、纺织服装或空白创建初始化；分类名称必填，同级不重名，最多三级 | | 分类编辑 | 支持新增一级、同级、子级，移动排序，删除节点及其子孙节点 | | 检测方法方案 | 必须关联当前资源库模板内一张资源表 | | 候选项展示字段 | 主展示必填，补充字段 1/2 选填，三个展示字段不得重复 | | 分组字段 | 选填；配置后按字段值分组，空值进入未分组 |  ### 4.2 检测套餐配置套件  检测套餐配置套件用于提供套餐项目组成和套餐整体价格能力。运营端只配置项目套件关联；贸易端维护套餐价格及明细。  | 能力 | 规则 | | --- | --- | | 套件组成 | 固定包含项目明细及内置套餐价格能力 | | 关联检测项目配置套件 | 必填、单选，候选项按资源表名称分组 | | 内置能力 | 自动取得项目分类、项目、方法方案、结果结构、判定方案、样品要求等 |  资源库表单列表顶部可展示“检测资源配置”引导。当前模板存在任一检测项目配置套件或检测套餐配置套件时展示；全部删除后隐藏。项目套件可独立完成，不强制添加套餐套件。  ## 5. 贸易端资源数据维护  ### 5.1 检测项目  贸易端在资源库中维护检测项目及其方法方案。  | 数据 | 规则 | | --- | --- | | 检测项目分类 | 必填，单选，当前仅允许选择末级分类 | | 方法方案列表 | 至少 1 个；支持添加、编辑、移除 | | 检测方法 | 必填，从项目套件配置的方法资源表选择已有记录 | | 结果项 | 至少 1 项；支持文本、数字、等级、枚举等结果类型 | | 数字结果范围 | 可配置最小值、最大值，仅用于录入校验 | | 等级值 | 至少 2 个不重复值，支持添加、改名、排序、删除、批量添加 | | 判定方案 | 至少 1 套；按结果项条件自动联动 |  新增结果项时，每套判定方案需同步生成该结果的条件项；允许删除的结果项被删除后，同步清理其判定条件。  ### 5.2 检测套餐  贸易端在资源库中维护检测套餐、套餐项目关系和套餐价格。  | 数据 | 规则 | | --- | --- | | 套餐项目 | 由检测项目、方法方案、判定方案组成 | | 适用样品 | 添加单项检测项目时默认全选全部样品，可调整 | | 重复校验 | 同一套餐内项目 + 方法方案 + 判定方案唯一 | | 价格 | 金额按运营端配置决定是否在业务流程中展示 |  ## 6. FlowSpace 检测标准关联  当业务模板包含实验室检测里程碑时，当前 FlowSpace 需要配置检测项目、检测套餐等标准数据来源。  只有当前 FlowSpace 包含实验室检测里程碑时，`FlowSpace 管理` 左侧业务模块才展示“实验室检测”。拥有“关联资源库”配置权限的成员进入订单列表时，系统检查实验室检测资源关联状态。  | 配置状态 | 是否可发起检测工单 | 规则 | | --- | --- | --- | | 待配置 | 否 | 从未配置、部分配置、字段映射不完整、套件或资源表被删除、来源失效 | | 已配置 | 是 | 套餐、项目数据源及必填映射全部有效 |  检测标准关联必须满足：  1. 套餐数据和检测项目数据两项固定关联均配置完整。 2. 套餐和项目必须选择同一个团队资源库中的套件实例。 3. 套餐名称、套餐项目明细、项目名称、项目分类、方法方案等必填映射完整。 4. 字段类型兼容。 5. 所选项目套件与套餐项目明细的关联一致。  除实验室检测里程碑固定的检测内容选择组件以外，只要表单内至少仍存在一个检测内容选择组件，就展示共用配置；不需要为每个检测内容组件重复配置套餐或项目来源。  ## 7. 订单详情检测流程  实验室检测工单采集包含检测任务信息、检测标准与项目、样品与检测范围、检测执行、检测报告等表单。  ### 7.1 检测标准与项目  用户可选择检测套餐，也可添加单项检测项目。无套餐时至少需要有一项自选检测项目。  | 数据组 | 操作规则 | 展示内容 | | --- | --- | --- | | 套餐数据 | 套餐下拉只展示关联配置中的套餐显示名称；更换套餐需弹出影响确认并重新生成套餐项目范围 | 套餐显示名称、检测项目数 | | 检测项目数据 | 添加或编辑单项时，检测项目、方法方案、判定方案、适用样品必填 | 检测项目名称、方法方案、判定方案、自选固定为 1 项 | | 检测金额 | 仅运营端开启显示价格时展示 | 各币种金额 |  修改项目信息会清空已有项目的录入数据，并需向用户明确提示。移除项目时也需确认影响。  ### 7.2 样品与检测范围  样品与检测范围用于维护实验室实际收到的样品，并建立“样品 x 检测项目”的执行范围。检测执行任务由该范围自动生成。  取消已有结果的项目范围时，需二次确认，并清除当前有效结果，历史记录保留。  ### 7.3 检测执行  检测执行根据检测标准与项目、样品与检测范围生成样品 x 结果项检测结果及判定。  检测判定状态包括：  | 状态 | 说明 | | --- | --- | | 待处理 | 尚未录入有效检测结果 | | 合格 | 所有需判定结果满足当前判定条件 | | 不合格 | 存在至少一个不合格结果 | | 无法判定 | 样品条件不满足、检测过程异常或其他原因导致无法给出正常判定 | | 未完成 | 没有不合格，但存在未完成结果，或没有一个需录入结果项 |  检测结果录入规则：  - 文本结果正常录入时必填，按方法方案配置人工判定。 - 数字结果需遵循结果项配置的精度、单位和允许录入范围。 - 等级和枚举结果读取项目配置的可选值。 - 超出录入范围时阻止保存并提示允许范围。 - 特殊情况可记录样品条件不满足、检测过程异常/结果无效、其他原因无法检测等，并将检测判定保存为无法判定。  临时判定条件可在检测执行中调整。调整后需展示临时状态标签，并清除当前生效的临时调整时恢复原判定规则。  ## 8. 工单批复与采集端  实验室检测工单批复用于对已提交的检测工单进行复核，包括查看检测内容、样品范围、检测结果汇总、逐条检测结果、检测报告信息和附件，并给出整体批复结论。  | 批复范围 | 规则 | | --- | --- | | 整体批复 | 批复结论必填，取值通过/不通过；批复意见非必填 | | 逐条检测结果批复 | 批复人可对每条检测结果选择接受或不接受，并填写独立批复意见 |  采集端与贸易端使用同一份检测工单数据。采集端任务详情页需支持查看任务、维护样品和范围、录入执行条件与检测结果，并在提交任务后同步贸易端。  ## 9. 平台联动  实验室检验数据需按 Linkincrease 既有平台能力参与：  - 关联引用：检测项目、套餐、样品和结果需保持结构化引用。 - 公式：检测汇总字段、金额、判定和数量可作为公式来源。 - 报表和仪表盘：检测内容明细、项目明细、样品明细、结果明细和汇总字段需进入分析数据。 - 权限：按 FlowSpace、资源库、表单字段、数据围栏和协作团队权限过滤。 - 动态和历史记录：套餐变更、项目范围变更、结果录入、特殊情况、批复和临时判定条件需可追溯。  ## 10. 待确认问题  - 实验室检验最终结算规则、报价口径和多币种金额是否进入首期闭环，仍需业务确认。 - 检测报告签发、实验室内部排程、设备、试剂和第三方 LIMS 对接是否独立成后续需求。 - 检测内容明细、检测项目明细、样品明细和检测结果明细进入 BI、报表和仪表盘时的字段级权限矩阵需要补齐。  ## 11. 来源需求  - `source:thoughts-v2-current/v2.8/运营端/【运营端】【表单设计】实验室检验流程.md`", "domain": "公共能力", "module": "模板表单与数据", "tags": "实验室检验;行业组件;检测套餐;检测项目;资源库", "sources": [{"title": "【运营端】【表单设计】实验室检验流程", "version": "v2.8", "product_side": "运营端", "module": "表单设计", "last_write_time": "2026-09-04T10:48:00"}]}, {"path": "docs/10-功能模块详情/工作台.md", "title": "工作台与FlowSpace入口", "folder": "docs/10-功能模块详情", "text": "# 工作台与FlowSpace入口  ## 定位  工作台是贸易端用户进入 Linkincrease 后的主入口，用于承载 FlowSpace 访问、创建 FlowSpace、FlowSpace 分组、常用视图、任务入口和订单日程等日常工作能力。  本页聚焦工作台作为“业务入口”的部分；订单日程、任务中心、常用视图的详细规则见同目录其他页面。  ## 核心能力  | 能力 | 说明 | |---|---| | FlowSpace列表 | 展示当前用户在当前团队可见的内部 FlowSpace 和协作 FlowSpace | | FlowSpace搜索 | 支持按 FlowSpace 名称模糊搜索 | | FlowSpace星标 | 用户可将常用 FlowSpace 标星，星标 FlowSpace 置顶展示 | | FlowSpace分组 | 团队级维护 FlowSpace 分组，影响工作台中的分组展示 | | 创建FlowSpace入口 | 有团队设置-创建 FlowSpace 权限的用户可从工作台进入模板中心并创建 FlowSpace | | 预留事务模块 | 工作台承载常用视图、任务中心、订单日程等事务入口 |  ## FlowSpace列表展示规则  每个 FlowSpace 至少展示 FlowSpace 名称。列表先区分用户可见范围，再按星标与创建时间排序。  | 类型 | 可见条件 | |---|---| | 内部FlowSpace | 用户拥有团队角色-内部 FlowSpace 管理权限，或已加入该内部 FlowSpace | | 协作FlowSpace | 用户拥有团队角色-协作 FlowSpace 管理权限，或已加入该协作 FlowSpace |  排序规则：  1. 星标 FlowSpace 排在非星标 FlowSpace 前。 2. 星标 FlowSpace 按标星时间倒序。 3. 非星标 FlowSpace 按 FlowSpace 创建时间倒序。 4. 星标状态按“当前用户 + 当前团队”存储。  ## 创建FlowSpace  创建 FlowSpace 从工作台入口进入，整体链路为：  flowchart LR A[\"工作台\"] --> B[\"模板中心\"] B --> C[\"模板预览\"] B --> D[\"创建FlowSpace\"] C --> D D --> E[\"创建成功并进入FlowSpace\"]  创建入口仅对有“团队设置-创建 FlowSpace”权限的用户展示。模板中心展示运营端已启用的业务模板，并按行业分类和发布时间倒序排序。  创建 FlowSpace 时的关键字段：  | 字段 | 规则 | |---|---| | FlowSpace名称 | 必填，限制 100 字符 | | FlowSpace编号 | 必填，限制 1-8 位大写英文，输入小写时自动转大写 | | 编号唯一性 | 同团队内 FlowSpace 编号不可重复 | | FlowSpace分组 | 可选择当前团队的 FlowSpace 分组，默认未分组 |  创建成功后：  1. 创建者默认成为该 FlowSpace 成员。 2. 创建者自动配置固定角色“业务管理员”。 3. FlowSpace 设置-业务角色列表自动生成固定角色“业务管理员”，拥有 FlowSpace 业务角色内全部权限。 4. FlowSpace 设置-更多设置默认生成部分预设订单作废原因。  ## FlowSpace分组  FlowSpace 分组用于在工作台组织用户可见的 FlowSpace。分组设置是团队级配置，对团队内所有成员生效，但每个成员只能看到自己有权限查看的 FlowSpace。  | 操作 | 规则 | |---|---| | 默认分组 | 未分组，不可编辑、不可删除 | | 新增分组 | 分组名称必填，限制 20 字符，新分组默认排在最上方 | | 编辑分组 | 可修改分组名称 | | 删除分组 | 删除后，该分组下 FlowSpace 移入未分组 | | 移入分组 | FlowSpace 可移动到除当前分组外的其他分组 | | 排序 | 分组可拖拽排序，FlowSpace 可拖拽移动 |  分组查看规则：  1. 固定展示“所有FlowSpace”tab，包含当前用户可见权限内所有 FlowSpace。 2. 可切换到某个细分分组。 3. 在“所有FlowSpace”tab 中可按分组显示，默认勾选。 4. 分组排序按分组设置中的顺序。 5. 每个分组内按星标、非星标和 FlowSpace 创建时间排序。 6. 当前用户无可见 FlowSpace 的分组隐藏。 7. 前端记住当前用户最后一次“按分组显示”勾选状态。  ## 关联页面  - [从模板到FlowSpace](../30-业务流程与产品流程图/从模板到FlowSpace.md) - [业务模板](../20-业务对象与数据模型/业务模板.md) - [团队权限](../40-权限、安全与审计/团队权限.md) - [订单日程与任务中心](../60-数据分析支持/数据来源说明.md) - [常用视图与视图设置](../60-数据分析支持/分析场景.md)  ## 来源  - `source:thoughts-v2-current/v2.0.x/贸易端/【贸易端】【工作台】工作台、创建SCCS、SCCS分组.md` ", "domain": "贸易端", "module": "功能模块详情", "tags": "工作台;FlowSpace;分组;创建FlowSpace", "sources": [{"title": "【贸易端】【工作台】工作台、创建SCCS、SCCS分组", "version": "v2.0.x", "product_side": "贸易端", "module": "工作台", "last_write_time": "2026-09-04T10:48:46"}]}, {"path": "docs/10-功能模块详情/工单与批复.md", "title": "工单与批复", "folder": "docs/10-功能模块详情", "text": "# 工单与批复  本页是工单、工单批复、里程碑批复相关能力的阅读入口。  ## 模块范围  - 在里程碑下创建工单，按里程碑挂载表单填写工单数据。 - 工单采集、工单批复、里程碑批复、指派处理人、终止采集。 - 采集端任务列表、任务详情、批复详情与消息通知。  ## 权威文档  - [工单与批复](../20-业务对象与数据模型/工单与批复.md) - [工单数据模型](../20-业务对象与数据模型/工单数据模型.md) - [工单还原采集](./工单还原采集.md) - [工单表单互用与复制](./工单表单互用与复制.md) - [工单采集与批复](../30-业务流程与产品流程图/工单采集与批复.md) - [移动端采集](../30-业务流程与产品流程图/移动端采集.md)", "domain": "公共能力", "module": "功能模块详情", "tags": "10-功能模块详情;工单与批复", "sources": [{"title": "【贸易端】【订单详情】工单&里程碑批复操作", "version": "v2.2.x", "product_side": "贸易端", "module": "订单详情", "last_write_time": "2026-09-04T10:48:34"}, {"title": "【贸易端】【工单视图】批量操作：批量发邮件协作、批量采集", "version": "v2.3.x", "product_side": "贸易端", "module": "工单视图", "last_write_time": "2026-09-04T10:48:18"}, {"title": "【贸易端】【订单列表】工单导入、导出", "version": "v2.3.x", "product_side": "贸易端", "module": "订单列表", "last_write_time": "2026-09-04T10:48:17"}, {"title": "【贸易端】【订单列表】工单视图", "version": "v2.3.x", "product_side": "贸易端", "module": "订单列表", "last_write_time": "2026-09-04T10:48:18"}, {"title": "【贸易端】【订单管理】工单互用功能", "version": "v2.3.x", "product_side": "贸  ## 3. 权限与状态  创建互用或执行复制时，执行人必须同时满足：  1. 具备源、目标订单及工单查看权限。 2. 具备源表单完整数据查看权限。 3. 具备目标表单采集权限。 4. 目标对象当前状态允许采集或编辑。  以下状态不得新建互用或复制：目标工单已批复、已终止、已删除，或所属订单/里程碑已完成、取消。  来源不要求可编辑；已提交、已批复、已终止，或所属订单/里程碑已完成、取消的历史工单可以作为来源，但删除对象不可作为来源。  ## 4. 创建互用  创建互用使用源表单最后一次服务端已保存版本，不读取页面未保存修改。确认后：  1. 按稳定字段 ID 使用源表单已保存数据整表覆盖目标。 2. 公式结果不直接互用，在目标工单重新计算。 3. 保存目标覆盖前后快照并建立唯一互用关系。 4. 目标表单立即转为只读，其他表单不受影响。 5. 目标当前显示的必填字段如果无法从来源或目标公式获得有效值，阻止创建。  来源确认后先形成“待提交互用”状态，需提交工单才正式建立互用关系。提交工单时由服务端重新校验；多个待提交互用表单中任一失败时，整次工单不落库。  ## 5. 复制数据  复制数据同样使用源表单当前已保存数据并整表覆盖目标。复制后：  - 不建立持续关系。 - 不复制工单级信息、批复、动态、历史或互用关系。 - 目标按普通表单处理，可在权限和状态允许时继续编辑。 - 源侧不展示被复制去向，也不增加源工单动态。 - 目标工单动态/历史保留复制来源和覆盖快照。  ## 6. 取消与修改互用  取消互用可从目标表单编辑态或源表单编辑态发起，操作者需具备目标表单采集权限或源表单采集权限。  取消时必须选择处理方式：  | 选项 | 结果 | | --- | --- | | 保留目标数据 | 保留最后一次同步后的业务有效值，并转为目标本地数据 | | 清空目标数据 | 清空该表单；需强提示可能造成必填字段为空 |  取消后源变化不再同步目标，不允许恢复互用建立前的数据。源、目标工单均记录取消动态；目标历史保存取消方式及取消前后快照；关系审计永久保留。  修改互用来源按“取消原关系 + 创建新关系”处理，需保存切换前后快照以及原、新关系信息。  ## 7. 同步、只读与业务有效值  源表单在贸易端、采集端、自动化、外部 API 或资源库同步中产生已保存数据变化时，同步至全部有效目标。同步范围包括普通字段、子表行、图片、附件、签名，以及同一表单 ID 下模板新增字段。  同步要求：  1. 使用源数据版本同步，记录目标最近同步版本、时间、状态及失败原因。 2. 同一“关系 ID + 源版本 + 目标 ID”只执行一次。 3. 失败任务按系统机制重试；部分目标失败不回滚其他成功目标。 4. 目标互用表单禁止用户导入、批量编辑、API 和自动化直接写入，只允许互用同步及目标公式计算写入。 5. 同步期间展示“同步中”；失败时保留最后成功版本并展示失败状态。  业务有效值的处理顺序为：同步源普通字段值 -> 计算目标公式 -> 判断目标显隐 -> 计算业务有效值和必填完整度 -> 记录动态/历史/执行日志 -> 触发目标自动化。  ## 8. 特殊组件与显隐  | 组件 | 同订单 | 跨订单 | | --- | --- | --- | | 普通字段、子表、图片、附件、签名 | 支持 | 支持 | | 订单内关联引用 | 支持 | 需按待确认策略处理 | | 公式 | 使用目标工单实际因子计算 | 使用目标订单、目标工单实际因子计算 | | 资源库关联 | 支持 | 支持，保留资源数据 ID |  字段显隐按各目标工单的数据上下文单独判断：  | 源字段 | 目标字段 | 目标业务有效值 | | --- | --- | --- | | 显示且有值 | 显示 | 同步源值，只读 | | 显示且有值 | 隐藏 | 空，不展示、不校验 | | 隐藏 | 显示 | 空且只读，不恢复源历史值 | | 隐藏 | 隐藏 | 空，不展示、不校验 |  ## 9. 批复、自动化与数据出口  - 目标工单包含互用表单时，批复确认区域需展示风险提示，说明批复后源数据或目标公式因子变化仍可能改变字段值、公式结果和字段显隐。 - 批复人必须确认已知晓风险后才能批复。 - 批复后已有关系继续同步，目标公式和显隐继续重新计算，作为现有批复锁定规则的特例。 - 互用同步及目标公式/显隐变化合并为一次目标订单数据变更，按最终业务有效值触发自动化。 - 自动化不得写入目标互用表单。 - 仪表盘与报告按目标订单、目标工单统计，不按来源去重。 - 互用目标可导出当前最新值；导入、批量编辑、API 不得覆盖有效互用表单。  ## 10. 日志、动态与审计  需要记录的事件包括：创建互用、数据同步、修改来源、取消互用、源工单删除导致解除关系、目标工单删除解除关系、复制覆盖。  源工单和目标工单动态应分别说明来源、去向、执行人、目标订单/工单、保留或清空方式。目标历史记录需保存覆盖前后快照、字段差异、源/目标版本和关系信息。  ## 11. 异常与测试重点  重点异常包括：无权限、不可见、当前工单自身、来源为互用目标、目标已有来源或去向、来源无保存版本、模板不匹配、条件并发变化、直接写入互用表单、同步失败、取消并清空。  测试重点覆盖同订单/跨订单、权限建立后丢失、无保存版本、未保存修改、已提交、已批复、已终止、空值、必填、子表、附件、签名、订单内关联引用、资源库、公式、显隐组合、一个源多个目标、部分失败、重试、并发、循环自动化、修改来源、取消保留/清空、删除源/目标，以及导入、批量编辑、API、自动化直接写入。  ## 12. 待确认问题  - 跨订单存在订单内关联引用时，首期是阻止整表互用，还是复制时跳过关联引用并复制其余字段，需要产品和研发确认。 - “有效来源数据”是否可完全按存在服务端已保存版本判断，需要研发确认现有表单版本能力。  ## 13. 来源需求  - `source:thoughts-v2-current/v2.8/贸易端/【贸易端】【工单】表单互用、表单复制.md`", "domain": "贸易端", "module": "功能模块详情", "tags": "工单;表单互用;表单复制;数据同步;审计", "sources": [{"title": "【贸易端】【工单】表单互用、表单复制", "version": "v2.8", "product_side": "贸易端", "module": "工单", "last_write_time": "2026-09-04T10:47:54"}]}, {"path": "docs/10-功能模块详情/工单还原采集.md", "title": "工单还原采集", "folder": "docs/10-功能模块详情", "text": " # 工单还原采集  ## 1. 功能定位  工单还原采集用于将已执行“终止采集”的工单恢复为可采集状态，解决误终止、业务重新启动或需要补交材料时只能新建工单、线下补充导致数据、处理人、动态、任务和补充结果分散的问题。  还原采集只解除工单的终止锁，不回滚业务数据，不清空字段、附件、图片、处理人、提交标识或历史记录。  ## 2. 适用条件  允许还原需同时满足：  1. 用户拥有当前里程碑的“还原采集”权限。 2. 用户可查看目标订单和工单，并命中订单权限范围。 3. 工单处于已终止采集状态。 4. 订单处于进行中。 5. 里程碑处于进行中。 6. 工单未批复、未删除。 7. 当前对象不是互用自其他订单的只读工单。  以下情况不允许还原：订单已完成、已取消或已删除；里程碑已完成或已取消；工单未终止、已批复或已删除；当前工单为互用自其他订单的只读实例；用户无权限、已离开 FlowSpace 或订单权限范围不命中。  订单或里程碑已结束时，用户需先按既有规则重启订单或重开里程碑，再还原工单。本功能不做级联重开。  ## 3. 权限设计  新增里程碑级权限点：`还原采集`。  | 角色 | 默认规则 | | --- | --- | | FlowSpace 业务管理员 | 默认拥有 | | 既有/新建自定义业务角色 | 默认不勾选，由管理员按需授权 | | 协作方角色 | 默认不勾选，由管理员按需授权 |  权限配置页中，“还原采集”应放在“终止采集”之后。勾选时需同时具备“查看订单基本信息”和“查看工单”。前端展示入口和接口提交均需校验权限、订单范围及最新状态。  ## 4. 贸易端交互  还原入口位于订单详情的工单操作区，与终止采集入口保持同一操作语境。工单已终止且用户满足还原条件时展示“还原采集”；无权限时隐藏。  确认弹窗需展示影响说明，并要求填写还原原因：  | 内容 | 规则 | | --- | --- | | 标题 | 还原采集 | | 影响提示 | 当前采集人可继续编辑；自动化和公式恢复后续合法更新；原因终止失效的邮件协作可继续提交 | | 还原原因 | 必填，1-200 字 | | 按钮 | 取消、确认还原 | | 重复提交 | 提交中禁止重复点击 |  成功后工单恢复为现有进行中或可采集状态，并按当前处理人、角色、数据围栏、表单显隐及父级状态重新计算编辑权限。  ## 5. 状态与数据规则  还原后允许再次终止。每次终止和还原均新增事件，不覆盖上一轮记录。  | 数据 | 还原规则 | | --- | --- | | 工单字段、子表、图片、附件 | 保留 | | 当前采集人、批复人、协作指派 | 保留 | | 表单显隐 | 编辑时按当前配置重新计算 | | 公式 | 按当前配置重新计算，不恢复终止时快照 | | 采集提交标识 | 保留，不重置 | | 工单完成度 | 按现有表单和提交记录重新计算，不清零 | | 字段更新时间/更新人 | 还原不属于字段编辑，不伪造字段修改记录 | | 终止与还原事件 | 操作人、时间、原因永久保留 |  如果原采集成员已失效或离开 FlowSpace，允许管理人员还原，但弹窗需提示需要修改处理人或执行数据移交。系统不得向失效成员生成可处理任务。  ## 6. 采集端与任务联动  还原后，采集端需重新拉取工单状态、处理人、表单权限、显隐和数据版本。再次提交新增采集历史，不覆盖原提交记录。  | 当前情况 | 还原后的归类 | | --- | --- | | 当前采集人未提交 | 我的任务-待处理 | | 当前采集人已提交 | 我的任务-已处理，但可继续编辑并再次提交 | | 协作团队未指派且用户有指派权限 | 团队任务-待指派 |  首页任务数、团队待办数、底部角标、FlowSpace 任务数、任务中心和搜索索引需同步刷新。提交标识不重置，因此已提交任务还原后归入“已处理”，不回到“待处理”。  已打开页面收到状态变化时需刷新；无实时能力时，下次进入、下拉刷新或提交前必须获取最新状态。  ## 7. 批量采集、邮件协作和自动化  批量采集：  - 还原工单重新参与可编辑工单数量计算。 - 已打开的批量采集弹窗不静默切换状态，刷新后再恢复目标行编辑。 - 提交前逐行校验最新订单、里程碑、工单、处理人和权限状态；目标行冲突不影响其他合法行。  邮件协作：  - 还原后，符合现有采集和表单权限的用户可重新发起邮件协作。 - 终止前已发出且因终止失效的邮件协作记录继续展示，可继续提交。 - 旧协作数据仍可查看，引用时继续校验当前团队、采集人和可编辑表单权限。  自动化和公式：  - 还原后，工单重新满足未批复、未终止的写入前提，后续新触发可正常执行。 - 不补跑终止期间错过的定时任务、到达时间任务、数据变更任务或通知。 - 还原动作不属于自动化数据变更条件。 - `TODAY` 次日计算或自动计算公式在还原后重算一次。 - 自动化、公式和用户提交同时写入时，均需通过数据版本校验。  ## 8. 动态、统计与审计  工单动态新增：`$操作人 还原了采集，工单可继续编辑`，并展示还原原因。系统执行日志仅记录还原后实际发生的公式或自动化执行。  统计口径：  - 还原后，当前任务从已完成或不可编辑转回进行中对应分组。 - 当前任务完成时间不再展示，原终止时间保留在历史事件中。 - 再次终止或批复时，当前完成时间取本轮首次进入不可编辑状态的时间。  ## 9. 异常提示  | 场景 | 提示 | | --- | --- | | 工单已被他人还原 | 工单已还原，请刷新页面 | | 工单已批复 | 工单已批复，无法还原采集 | | 订单已完成/取消 | 订单已完成/已取消，无法还原采集 | | 里程碑已完成/取消 | 里程碑已完成/已取消，无法还原采集 | | 无权限或权限被收回 | 暂无权限，请刷新页面 | | 网络或服务失败 | 还原失败，请稍后重试；保留已填写原因 |  失败时不得部分解除锁定，也不得产生成功动态或通知。  ## 10. 验收重点  - 有权限且状态合法时，填写原因可还原；字段、附件、处理人、提交标识和历史均保留。 - 无还原权限时不展示入口；接口拒绝且无副作用。 - 订单/里程碑结束、工单已批复/删除或为只读互用实例时拒绝还原并显示准确原因。 - 重复点击或网络重试只还原一次，只生成一条事件、动态和一组通知。 - 弹窗打开后状态或权限变化时，版本/权限校验失败并刷新到最新状态。 - 采集人未提交和已提交分别进入待处理、已处理，两种情况均按权限允许继续编辑。 - 还原后再次提交新增采集历史，不覆盖原提交记录。 - 批量采集刷新后计入可编辑数量，提交前逐行校验。 - 终止前邮件协作链接恢复可提交，且可新建协作链接。 - 后续自动化和公式新触发可执行，终止期间任务不补跑。  ## 11. 来源需求  - `source:thoughts-v2-current/v2.8/贸易端/【贸易端】工单终止还原为采集状态.md`", "domain": "贸易端", "module": "工单", "tags": "工单;终止采集;还原采集;状态流转;审计", "sources": [{"title": "【贸易端】工单终止还原为采集状态", "version": "v2.8", "product_side": "贸易端", "module": "贸易端", "last_write_time": "2026-09-04T10:47:53"}]}, {"path": "docs/10-功能模块详情/批量邮件协作.md", "title": "批量邮件协作", "folder": "docs/10-功能模块详情", "text": " # 批量邮件协作  ## 1. 功能定位  批量邮件协作用于在工单视图中对多条工单一次性发起邮件协作，减少重复操作。每个邮箱都会接收当前勾选工单的邮件协作，执行几条工单就收到几封邮件。  ## 2. 入口与适用范围  - 入口：贸易端工单视图批量操作。 - 对象：当前勾选的多条工单。 - 发送记录：与单条邮件协作共用最近 10 条发送邮箱记录。  ## 3. 配置内容  | 配置项 | 规则 | | --- | --- | | 收件邮箱 | 可输入多个邮箱 | | 邮件主题 | 同单个工单邮件协作 | | 备注 | 同单个工单邮件协作 | | 附件 | 可选择当前里程碑工单模板中的图片/附件字段；本地上传附件应用于所有工单 | | 协作内容设置 | 列出当前所选工单中所有表单，可分别设置显隐 | | 预览 | 查看发出后的协作内容 |  由于批量邮件涉及多个工单，选择模板附件字段时不立即带入附件，而是在发出时统一上传。  ## 4. 表单显隐与数据围栏  - 每行工单根据各自表单显隐、当前采集人是否可编辑进行展示。 - 可编辑表单发出后字段内容为空，供外部填写。 - 不可编辑表单发出后展示原工单最新数据。 - 订单基本信息按当前采集人的数据围栏控制，不可见字段对邮件协作者也不可见。  ## 5. 确定校验  | 校验 | 提示 | | --- | --- | | 邮箱格式不正确 | 邮箱格式不正确 | | 某工单可编辑表单全隐藏 | 至少保留一个可编辑模块 | | 采集人可编辑表单或可见表单变更 | 工单编辑权限已变更，请刷新页面 | | 指派权限被取消 | 暂无权限，请刷新页面 | | 订单删除 | 订单已删除，无法操作，请刷新页面 | | 里程碑完成或取消 | 里程碑已完成/已取消，无法操作，请刷新页面 | | 工单终止采集、已批复或删除 | 工单已终止采集/已批复/已删除，无法操作，请刷新页面 |  ## 6. 批量采集工单  同一批量操作需求中还包含批量采集工单。批量采集在编辑列表中直接修改可编辑工单字段，提交后触发与单条工单采集相同的动态、历史记录和消息通知。批量邮件协作则生成邮件协作任务，不直接提交工单采集数据。  批量采集入口标题为 `批量 + 运营端设置的当前里程碑工单采集按钮名称`，标题栏提示已选择数量和可编辑数量。可编辑工单指当前用户作为工单采集人，或协作团队未指派前具备指派权限的成员，且工单处于可采集状态。  编辑列表表头展示当前里程碑工单采集表单所有字段。每行按各自表单配置展示：隐藏表单放空；当前用户可采集表单展示输入框并可编辑；仅可查看表单展示对应值且不可编辑。表头操作可批量修改所有可编辑工单的字段值，列表操作可单独设置每个订单对应字段值。  特殊控件规则：  | 控件 | 规则 | | --- | --- | | 公式控件 | 根据计算因子实时计算 | | 显隐控件 | 满足显示条件时正常编辑；满足隐藏条件时显示为 `-`，不展示输入框 | | 关联资源库字段 | 显示引用资源库按钮，引用逻辑同单条订单编辑页面 |  编辑过程中若某一行对应的订单、里程碑或工单状态发生变化，只在对应工单行内提示并禁用该行输入，不影响其他工单编辑和提交。提交前需统一校验订单删除、采集人权限变更、订单完成或取消、里程碑完成或取消、工单终止采集、工单已批复和必填项为空等场景。  校验通过后，工单动态增加一条采集记录，历史记录增加一条采集记录，消息通知同单条工单采集，订单详情里程碑树重新计算工单采集完成状态。关闭批量编辑弹窗时，若内容已变更需提示是否保存数据。  ## 7. 待确认问题  - 批量邮件协作是否支持“所有对象共同接收同一封邮件”的新发送模式，需与单条邮件协作统一。 - 批量邮件发送失败的重试、部分成功和记录展示规则需补充。 ", "domain": "贸易端", "module": "功能模块详情", "tags": "邮件协作;批量操作;工单视图", "sources": [{"title": "【贸易端】【工单视图】批量操作：批量发邮件协作、批量采集", "version": "v2.3.x", "product_side": "贸易端", "module": "工单视图", "last_write_time": "2026-09-04T10:48:18"}]}, {"path": "docs/10-功能模块详情/消息中心与实时通知.md", "title": "消息中心与实时通知", "folder": "docs/10-功能模块详情", "text": " # 消息中心与实时通知  ## 1. 功能定位  消息中心用于汇总用户在所有团队下收到的待处理、通知、自动化、团队管理和账号类消息。实时通知用于在用户在线时弹出新消息提示；采集端还需要触发 APP 消息通知和首页未读红点。  ## 2. 贸易端消息中心  | 维度 | 规则 | | --- | --- | | 数据范围 | 展示当前用户在所有团队下的消息 | | 展示层级 | 一级按消息类型分组；二级展示该分组下所有消息 | | 排序 | 一级按重要程度：待处理、通知、自动化、团队管理、账号；二级按接收时间倒序 | | 时间范围 | 最多显示最近 3 个月消息 | | 筛选 | 全部/未读 tab；未读时只展示有未读的分类和消息 |  ## 3. 已读规则  - 点击二级消息后，该条消息变为已读。 - 若消息有跳转页面，则点击后打开对应页面。 - 如果消息来源不是当前团队，需要提示是否切换到对应团队；无论是否切换，点击即视为已读。 - 二级列表可将当前分类全部标记已读。 - 一级列表可将所有消息全部标记已读。  ## 4. 消息分类  | 类型 | 典型触发 | | --- | --- | | 待处理 | 创建工单通知采集人；创建工单通知协作团队对接人；指派工单采集、工单批复、里程碑批复 | | 通知 | 工单采集提交、工单批复提交、里程碑批复提交、动态中被 @、里程碑预警或延期 | | 自动化 | 自动化相关消息，原始资料中标注暂无，需要跟自动化通知合并确认 | | 团队管理 | 协作团队邀请、接受/拒绝、移出团队、加入/移出 FlowSpace、邀请成员加入团队 | | 账号 | 被邀请加入团队、被移出团队、被添加或移出 FlowSpace、权限或角色被修改、被设置为对接人 |  ## 5. 实时消息  | 设置 | 规则 | | --- | --- | | 实时通知开关 | 默认打开 | | 打开 | 用户在线且触发消息时，右下角弹出小窗 | | 关闭 | 不弹窗，只记录到消息列表并显示未读数量 | | 小窗计数 | 展示本次登录期间收到的未读消息，如“新消息：1/4” | | 点击查看 | 对应消息已读，小窗隐藏该已读消息 | | 关闭浏览器 | 下次登录不展示上次小窗消息，只展示新消息 |  ## 6. 采集端消息中心  采集端消息中心用于移动端任务处理场景。  - 对应团队有未读消息时，首页消息 icon 出现红点。 - 消息全部已读后，首页红点消失。 - 点击首页消息入口跳转消息中心页。 - 消息分类显示红点和未读数。 - 部分消息仅通知，部分消息点击可跳转页面。 - 手机未开启 APP 通知时，底部展示通知条；点击开启跳转手机通知设置页。 - 点击全部已读后，所有分类消息已读。  ## 7. 待确认问题  - 自动化消息分类当前资料标注“暂无”，但自动化执行支持站内通知，需要统一口径。 - 消息模板来源仍在外部链接中，建议导出为本地来源文件。 - 消息跳转时如果用户已失去权限，需统一提示“暂无权限”并保留已读状态。 ", "domain": "公共能力", "module": "功能模块详情", "tags": "消息;实时通知;采集端;贸易端", "sources": [{"title": "【贸易端】【消息中心】消息中心、实时消息", "version": "v2.1.x", "product_side": "贸易端", "module": "消息中心", "last_write_time": "2026-09-04T10:48:42"}, {"title": "【采集端】【消息中心】消息通知列表", "version": "v2.3.x", "product_side": "采集端", "module": "消息中心", "last_write_time": "2026-09-04T10:48:28"}]}, {"path": "docs/10-功能模块详情/消息通知.md", "title": "消息通知", "folder": "docs/10-功能模块详情", "text": "# 消息通知  本页是消息、实时通知、邮件协作相关功能的阅读入口。  ## 模块范围  - 消息中心、实时通知、未读状态、待处理提醒。 - 邮件协作、批量邮件协作、外部填写链接和邮件历史。 - 采集端、贸易端之间的任务与通知联动。  ## 权威文档  - [消息中心与实时通知](./消息中心与实时通知.md) - [邮件协作](./邮件协作.md) - [批量邮件协作](./批量邮件协作.md) - [FlowSpace 数据移交](./FlowSpace数据移交.md) - [动态与评论](../40-权限、安全与审计/动态与评论.md)", "domain": "公共能力", "module": "功能模块详情", "tags": "10-功能模块详情;消息通知", "sources": [{"title": "【贸易端】【消息中心】消息中心、实时消息", "version": "v2.1.x", "product_side": "贸易端", "module": "消息中心", "last_write_time": "2026-09-04T10:48:42"}, {"title": "【贸易端】【订单详情】邮件协作", "version": "v2.2.x", "product_side": "贸易端", "module": "订单详情", "last_write_time": "2026-09-04T10:48:28"}, {"title": "【贸易端】【工单视图】批量操作：批量发邮件协作、批量采集", "version": "v2.3.x", "product_side": "贸易端", "module": "工单视图", "last_write_time": "2026-09-04T10:48:18"}, {"title": "【运营端】【用户-SCCS管理】邮件协作列表", "version": "v2.3.x", "product_side": "运营端", "module": "用户-SCCS管理", "last_write_time": "2026-09-04T10:48:12"}, {"title": "【采集端】【消息中心】消息通知列表", "version": "v2.3.x", "product_side": "采集端", "module": "消息中心", "last_write_time": "2026-09-04T10:48:28"}]}, {"path": "docs/10-功能模块详情/自动化.md", "title": "自动化", "folder": "docs/10-功能模块详情", "text": "# 自动化  本页是自动化功能模块的阅读入口。  ## 模块范围  - 自动化触发条件、执行动作、通知、定时任务。 - 自动化对订单、工单、资源库和字段数据的写入影响。 - 自动化执行日志、失败记录和审计追溯。  ## 权威文档  - [自动化配置](./自动化配置.md) - [自动化执行](../30-业务流程与产品流程图/自动化执行.md) - [自动化与系统执行日志](../40-权限、安全与审计/自动化与系统执行日志.md) ", "domain": "公共能力", "module": "功能模块详情", "tags": "10-功能模块详情;自动化", "sources": [{"title": "【贸易端】【自动化】一期", "version": "V2.4.x", "product_side": "贸易端", "module": "自动化", "last_write_time": "2026-09-04T10:48:09"}, {"title": "【运营端】【SCCS管理】SCCS自动化记录", "version": "V2.4.x", "product_side": "运营端", "module": "SCCS管理", "last_write_time": "2026-09-04T10:48:04"}, {"title": "【贸易端】【自动化】二期：定时任务", "version": "V2.5.x", "product_side": "贸易端", "module": "自动化", "last_write_time": "2026-09-04T10:48:01"}]}, {"path": "docs/10-功能模块详情/自动化配置.md", "title": "自动化配置", "folder": "docs/10-功能模块详情", "text": " # 自动化配置  ## 1. 功能定位  自动化配置用于在 FlowSpace 内设置触发条件和执行操作，自动完成通知、创建工单、更新订单或批复数据等机械性工作。启用状态下才会执行。  ## 2. 自动化列表  自动化配置入口是否展示由运营端团队列表的功能权限配置控制。贸易端不再通过 FlowSpace 业务角色权限配置 `自动化配置` 权限点；业务管理员默认角色也不可绕过该规则直接获得自动化配置入口。  | 字段 | 说明 | | --- | --- | | 自动化名称 | 支持模糊搜索 | | 内容 | 展示触发条件和执行操作摘要 | | 状态 | 全部、启用、未启用 | | 执行日志 | 查看对应自动化已执行情况 | | 操作 | 编辑、删除 |  启用自动化时需要校验设置是否完善；未完善时提示前往设置。  ## 3. 配置结构  一个自动化包含：  - 1 个触发条件。 - 最多 5 个执行操作。 - 是否启用。 - 执行失败通知，可选择站内、邮件、短信。  自动化触发条件和执行操作只在同一订单内发生，不跨订单触发执行。  ## 4. 触发条件  | 条件 | 说明 | | --- | --- | | 新增数据时 | 订单基本信息、里程碑批复、里程碑工单新增后触发 | | 数据内容变更时 | 指定数据源字段变更时触发，可使用“变更时”条件 | | 到达记录中的时间时 | 到达数据源内日期字段的当时、之前或之后触发 | | 定时任务 | 按不重复、每天、每周、每月、每月第几个周几执行 |  数据源选择工单且满足条件使用该工单字段时，可设置工单范围为当前工单。  到达记录中的时间时，触发时间支持当时、之前、之后。之前/之后需要输入正整数，并选择分钟、小时、天、周、月、年等单位；当选择当时时，偏移输入隐藏。  ## 5. 执行操作  | 操作 | 说明 | | --- | --- | | 发送通知 | 通过 Linkincrease 消息或邮件通知成员、团队、角色或模板控件人员 | | 新增数据 | 自动新增里程碑工单，并设置处理人和默认值 | | 更新数据 | 更新订单基本信息、里程碑批复或工单字段 |  自动化按顺序执行。任一步失败，后续操作不执行，并根据失败通知配置通知相关对象。  ## 6. 发送通知  通知对象包括：  - FlowSpace 成员。 - FlowSpace 协作团队。 - 业务角色和协作方角色。 - 订单模板控件。 - 步骤一数据源角色。  通知对象可进一步包含主团队成员、协作团队负责人和成员、业务角色、协作方角色、订单模板中的成员/协作方控件，以及步骤一数据源中的创建人、更新人、负责人、发起人、采集人、批复人等角色。协作团队负责人和具体成员为同一人时需要去重通知。  通知渠道包括 Linkincrease 消息和邮件。邮件可配置分别发送，或让所有被通知对象同时接收同一封邮件。标题和正文可拼接模板字段；邮件可附带步骤一数据源中的图片或附件字段。  ## 7. 新增数据  新增数据当前主要用于创建工单。  配置项：  - 数据源。 - 工单名称，自定义或自动编号。 - 处理人，至少保留一个非隐藏表单，且至少设置一项采集人、工单批复人或里程碑批复人。 - 工单默认值；未设置处理人的采集表单中如果包含必填字段，必须设置默认值。  不执行场景包括订单已完成/取消、里程碑已完成/取消、里程碑互用自其他订单、处理人为空、必填默认值为空等。  ## 8. 更新数据  更新数据可选择订单基本信息、里程碑批复、工单。数据源为工单时，可选择所有记录或指定记录；指定记录需设置过滤条件。  不执行场景包括：  - 订单已完成或取消。 - 里程碑已完成或取消。 - 里程碑或工单互用自其他订单。 - 更新工单采集字段时，工单已批复或终止采集。  数据源为工单且更新指定记录时，过滤条件仅可使用工单范围字段。执行后，订单基本信息更新写入订单跟踪记录；里程碑批复更新写入里程碑批复动态；工单更新按采集和批复分别写入动态，操作人显示为自动化或系统身份。  ## 9. 状态写入限制  自动化可写入的前提是目标业务对象仍处于可流转状态。订单结束、里程碑结束、工单采集结束后，自动化不能绕过状态限制继续改写业务字段。完整状态矩阵见 [系统自动计算与更新规则](../30-业务流程与产品流程图/系统自动计算与更新规则.md)。  ## 10. 定时任务  定时周期：  - 不重复。 - 每天。 - 每周。 - 每月。 - 每月第几个周几。  设置的时间不存在时不执行，且不属于执行失败。  定时任务特殊规则：  - 通知对象仅保留 FlowSpace 成员、协作团队、业务角色、协作方角色 4 个分组。 - 新增工单时需增加订单筛选条件。 - 更新数据时需增加记录范围设置，过滤符合条件的数据。  ## 11. 待确认问题  - 部分成功目前为后续规划，当前状态是否只保留成功/失败需要与线上统一。 - 失败通知中的短信规则仍依赖外部模板。 - 自动化与资源库同步、API 同步同时更新同一字段时的优先级需要补规则。 ", "domain": "贸易端", "module": "功能模块详情", "tags": "自动化;定时任务;通知;执行动作", "sources": [{"title": "【贸易端】【自动化】一期", "version": "V2.4.x", "product_side": "贸易端", "module": "自动化", "last_write_time": "2026-09-04T10:48:09"}, {"title": "【贸易端】【自动化】二期：定时任务", "version": "V2.5.x", "product_side": "贸易端", "module": "自动化", "last_write_time": "2026-09-04T10:48:01"}, {"title": "【运营端】【团队列表-功能权限】自动化权限移至运营端管理", "version": "v2.8", "product_side": "运营端", "module": "团队列表-功能权限", "last_write_time": "2026-09-04T10:47:47"}]}, {"path": "docs/10-功能模块详情/表单设计器.md", "title": "表单设计器", "folder": "docs/10-功能模块详情", "text": "# 表单设计器  本页是表单设计器功能模块的阅读入口。  ## 模块范围  - 表单组件、字段属性、显隐设置、公式函数、子表、关联引用。 - 业务模板和资源库模板中的表单设计差异。 - 表单配置变更对既有 FlowSpace、订单、工单、资源库数据的影响。  ## 权威文档  - [表单设计组件](../20-业务对象与数据模型/表单设计组件.md) - [表单属性与显隐设置](../20-业务对象与数据模型/表单属性与显隐设置.md) - [公式函数](../20-业务对象与数据模型/公式函数.md) - [字段、组件、子表、引用关系](../20-业务对象与数据模型/字段、组件、子表、引用关系.md) ", "domain": "公共能力", "module": "功能模块详情", "tags": "10-功能模块详情;表单设计器", "sources": [{"title": "【运营端】【模板中心】业务模版管理", "version": "v2.0.x", "product_side": "运营端", "module": "模板中心", "last_write_time": "2026-09-04T10:48:49"}, {"title": "【运营端】【业务模板】表单设计组件", "version": "v2.1.x", "product_side": "运营端", "module": "业务模板", "last_write_time": "2026-09-04T10:48:42"}, {"title": "【运营端】【业务模版】表单属性与显隐设置", "version": "v2.1.x", "product_side": "运营端", "module": "业务模版", "last_write_time": "2026-09-04T10:48:38"}]}, {"path": "docs/10-功能模块详情/订单.md", "title": "订单", "folder": "docs/10-功能模块详情", "text": "# 订单  本页是订单功能模块的阅读入口。  ## 模块范围  - 订单创建、编辑、完成、取消、重启、导入、导出。 - 订单主表单数据、订单列表、订单详情、订单跟踪记录。 - 订单与里程碑、工单、批复、资源库引用、自动化、报表之间的关系。  ## 权威文档  - [订单](../20-业务对象与数据模型/订单.md) - [订单数据模型](../20-业务对象与数据模型/订单数据模型.md) - [订单生命周期](../30-业务流程与产品流程图/订单生命周期.md) - [订单复用关系](../30-业务流程与产品流程图/订单复用关系.md) - [订单跟踪记录](../40-权限、安全与审计/订单跟踪记录.md) ", "domain": "公共能力", "module": "功能模块详情", "tags": "10-功能模块详情;订单", "sources": [{"title": "【贸易端】【订单列表】视图设置", "version": "v2.2.x", "product_side": "贸易端", "module": "订单列表", "last_write_time": "2026-09-04T10:48:36"}, {"title": "【贸易端】【订单列表】订单列表查看：概览、详情", "version": "v2.2.x", "product_side": "贸易端", "module": "订单列表", "last_write_time": "2026-09-04T10:48:32"}, {" 订单管理", "last_write_time": "2026-09-04T10:48:22"}]}, {"path": "docs/10-功能模块详情/设置与权限.md", "title": "设置与权限", "folder": "docs/10-功能模块详情", "text": "# 设置与权限  本页是设置类能力和权限入口。  ## 模块范围  - 团队设置、FlowSpace 设置、协作 FlowSpace 设置、资源库设置。 - 角色、成员、数据围栏、字段可见性、操作日志。 - 设置变更后的快照、历史记录和审计追溯。  ## 权威文档  - [权限体系总表](../40-权限、安全与审计/权限体系总表.md) - [团队权限](../40-权限、安全与审计/团队权限.md) - [FlowSpace 业务角色权限](../40-权限、安全与审计/FlowSpace业务角色权限.md) - [数据围栏](../40-权限、安全与审计/数据围栏.md) - [操作日志](../40-权限、安全与审计/操作日志.md) ", "domain": "公共能力", "module": "功能模块详情", "tags": "10-功能模块详情;设置与权限", "sources": [{"title": "【贸易端】【操作日志】所有设置类功能", "version": "V2.4.x", "product_side": "贸易端", "module": "操作日志", "last_write_time": "2026-09-04T10:48:09"}, {"title": "系统自动执行的相关操作日志", "version": "V2.4.x", "product_side": "贸易端", "module": "贸易端", "last_write_time": "2026-09-04T10:48:06"}, {"title": "【贸易端】【个人中心】个人信息、切换语言、退出账号", "version": "v2.0.x", "product_side": "贸易端", "module": "个人中心", "last_write_time": "2026-09-04T10:48:45"}, {"title": "【贸易端】【团队设置】团队信息、角色、成员、协作团队管理", "version": "v2.0.x", "product_side": "贸易端", "module": "团队设置", "last_write_time": "2026-09-04T10:48:47"}, {"title": "【贸易端】【SCCS设置】", "version": "v2.1.x", "product_side": "贸易端", "module": "SCCS设置", "last_write_time": "2026-09-04T10:48:45"}, {"title": "【贸易端】【协作SCCS设置】", "version": "v2.1.x", "product_side": "贸易端", "module": "协作SCCS设置", "last_write_time": "2026-09-04T10:48:42"}, {"title": "【贸易端】【团队设置】邀请成 员_协作团队流程变更", "version": "v2.1.x", "product_side": "贸易端", "module": "团队设置", "last_write_time": "2026-09-04T10:48:42"}, {"title": "【采集端】【我的】个人中心页", "version": "v2.3.x", "product_side": "采集端", "module": "我的", "last_write_time": "2026-09-04T10:48:27"}]}, {"path": "docs/10-功能模块详情/账号与个人中心.md", "title": "账号与个人中心", "folder": "docs/10-功能模块详情", "text": "# 账号与个人中心  ## 1. 定位  账号与个人中心是 Linkincrease 用户进入平台和管理个人身份信息的基础能力，覆盖贸易端和采集端。  贸易端承担完整账号链路，包括注册、密码登录、验证码登录、忘记密码、个人信息、语言切换、团队切换和退出账号。采集端复用贸易端注册后的账号体系，支持邮箱密码登录、忘记密码、我的、修改密码、语言设置、检查更新和退出账号。  ## 2. 端侧边界  | 能力 | 贸易端 | 采集端 | | --- | --- | --- | | 注册 | 支持邮箱验证和个人信息填写 | 不支持注册，引导用户到 Linkincrease 电脑端注册 | | 密码登录 | 支持 | 支持 | | 验证码登录 | 支持 | 当前来源仅说明邮箱密码登录 | | 忘记密码 | 支持验证邮箱和重设密码 | 支持验证邮箱和重设密码 | | 个人信息 | 支持头像、姓名、性别、邮箱、手机号、重置密码 | 支持头像、姓名、邮箱、联系方式、个人信息编辑 | | 团队切换 | 支持我的团队、拥有者标识、团队码复制、创建团队 | 通过采集端首页团队切换查看对应任务 | | 多语言 | 支持跟随系统、简体中文、English | 同贸易端 | | 检查更新 | 不适用 | 支持 APP 版本检查、强制更新和可选更新 | | 退出账号 | 退出后回到登录页 | 需确认，确认后回到登录页 |  ## 3. 贸易端注册  贸易端注册分为两个步骤。  ### 3.1 邮箱验证  字段与规则：  | 字段 | 规则 | | --- | --- | | 邮箱 | 必填；格式需包含且仅包含一个 `@`，并至少包含一个 `.` | | 验证码 | 必填；发送到邮箱的 6 位数字验证码，最多输入 6 位 |  获取验证码规则：  - 点击前校验邮箱格式，无效提示 `请输入正确的邮箱地址`。 - 校验邮箱是否已注册，已注册提示 `您的邮箱已注册，请返回登录`。 - 点击后进入 60 秒倒计时，倒计时结束后才可再次获取。 - 注册验证码邮件模板来自“邮件、短信、通知规则及模板”中的注册验证码模板。  验证邮箱规则：  - 必填项为空时提示 `请输入xxx`。 - 验证码有效期为 5 分钟，超时提示 `验证码错误或已过期`。 - 邮箱与验证码不匹配时提示 `验证码错误或已过期`。 - 同一账号验证邮箱 6 次仍未成功时，限制 2 小时内再次验证，并提示 `验证失败次数已达上限，请2小时后重试。如遇问题，请邮件联系我们：support@Linkincrease.com`。 - 校验通过后进入个人信息填写。  ### 3.2 个人信息填写  字段与规则：  | 字段 | 规则 | | --- | --- | | 姓名 | 必填，限制 20 字符 | | 性别 | 单选：男、女 | | 手机号 | 数字输入，最多 15 字符 | | 设置密码 | 必填；6 到 16 位；必须同时包含字母和数字；可兼容特殊符号；不能包含空格 | | 确认密码 | 必填；必须与设置密码一致 |  提交校验顺序：  1. 必填校验。 2. 设置密码包含空格时提示 `密码请勿包含空格`。 3. 密码不符合规则时提示 `密码长度为6-16位，且必须同时包含字母与数字，兼容特殊符号`。 4. 两次密码不一致时提示 `两次输入的密码不一致，请重新输入`。 5. 校验通过后完成注册，提示 `注册成功`，并自动登录。  ## 4. 贸易端登录  ### 4.1 密码登录  字段与规则：  | 字段 | 规则 | | --- | --- | | 邮箱 | 必填 | | 密码 | 必填；默认密码输入框，可通过眼睛图标切换明文 | | 记住我 | 勾选后浏览器记住本次登录账号和密码，下次打开登录页默认填入 |  登录校验顺序：  1. 必填项未填时提示 `请输入xxx`。 2. 邮箱未注册时提示 `该邮箱尚未注册，请先注册账号`，可跳转注册页。 3. 密码错误时提示 `您的密码错误，请重新输入。或 重置密码`，可跳转忘记密码页。 4. 密码登录和验证码登录累计验证失败 6 次仍未成功时，限制 2 小时内再次登录。 5. 校验通过后，若用户已加入团队，进入上一次登录的团队工作台；若未加入团队，进入创建团队页面。  登录状态补充规则：  - 登录后 2 小时无任何操作，再次操作时退回密码登录页，并提示 `登录信息已失效，请重新登录`。 - 登录状态下多处登录时，当前账号被踢出并回到密码登录页，提示 `账号在异地登录，如非本人操作，建议修改密码`。  ### 4.2 验证码登录  字段与规则：  | 字段 | 规则 | | --- | --- | | 邮箱 | 必填 | | 验证码 | 必填；发送到邮箱的 6 位数字验证码 |  获取验证码规则：  - 邮箱未注册时提示 `该邮箱尚未注册，请先注册`，可跳转注册页。 - 点击后进入 60 秒倒计时。 - 当前浏览器获取验证码 6 次仍未进入下一步时，限制 2 小时内再次获取，并提示 `获取验证码次数已达上限，请稍后重试`。 - 连续输入 3 次错误密码后出现图形验证码，成功进入下一步后消失。  登录校验规则与密码登录共享失败次数限制。验证码有效期为 5 分钟，超时或不匹配提示 `验证码错误或已过期`。  ## 5. 忘记密码与修改密码  贸易端忘记密码分为验证邮箱和重设密码。  验证邮箱规则：  - 邮箱和验证码必填。 - 邮箱未注册时提示 `该邮箱尚未注册，请先注册`。 - 获取验证码后进入 60 秒倒计时。 - 验证码有效期为 5 分钟。 - 邮箱与验证码不匹配时提示 `验证码错误或已过期`。 - 验证失败 6 次后限制 2 小时内再次验证。 - 重置成功后，登录的验证失败次数清零。  重设密码规则：  - 密码规则同注册密码。 - 必填项为空提示 `请输入xxx`。 - 密码不符合规则提示 `密码长度为6-16位,且必须同时包含字母与数字,兼容特殊符号`。 - 两次密码不一致提示 `两次输入的密码不一致，请重新输入`。 - 校验通过后提示 `密码重置成功`，并自动登录。  采集端修改密码逻辑同忘记密码，但邮箱账号框不可编辑，并带入当前登录邮箱。修改成功后需要重新登录。  ## 6. 个人中心  ### 6.1 贸易端个人中心  个人信息包括：  - 头像：默认取姓名第一个字作为头像；点击可更换本地图片；若未上传自定义头像，修改姓名会同步修改默认头像。 - 姓名：可编辑。 - 性别：可编辑。 - 邮箱：当前账号，不可修改。 - 手机号：可编辑。 - 重置密码：修改当前账号密码。  我的团队包括：  - 展示当前用户加入的所有团队。 - 用户是拥有者时展示拥有者标识。 - 支持切换到对应团队。 - 团队码支持复制，成功后提示 `复制成功`。 - 支持创建新团队。  ### 6.2 采集端我的  采集端“我的”包括：  - 个人信息：头像、姓名、邮箱、联系方式。 - 个人信息编辑：姓名、性别、联系方式。 - 多语言设置：同贸易端。 - 修改密码：成功后重新登录。 - 帮助中心：跳转平台帮助中心。 - 联系成功经理：弹出企业微信二维码。 - 检查更新。 - 退出账号。  ## 7. 多语言  语言选项包括：  - 跟随系统。 - 简体中文。 - English。  默认选项为跟随系统。跟随系统表示跟随浏览器或系统语言设置。  语言设置有两个入口：  - 登录页面。 - 登录后的个人中心或采集端“我的”。  切换语言后，需要后端保存到账号，同时更新当前浏览器或 App 语言。简体中文和英文选项文案固定为 `简体中文` 和 `English`。  ## 8. 采集端登录与版本更新  采集端登录使用贸易端已注册邮箱和密码。  登录校验顺序：  1. 必填项未填提示 `请输入xxx`。 2. 邮箱未注册提示 `该邮箱尚未注册，请至Linkincrease电脑端注册`。 3. 校验码输入错误或失效提示 `校验码不正确或已失效`。 4. 密码错误提示 `您的密码错误，请重新输入。或 重置密码`。  采集端忘记密码通过后，进入密码重置页面。重置成功后提示 `密码重置成功`，返回密码登录页或 3 秒自动进入首页，具体行为需要后续产品确认统一。  采集端检查更新规则：  - 显示后台管理的最新 APP 版本号。 - 当前 APP 版本号小于最小支持版本号时，展示强制更新界面，更新包来自后台上传路径。 - 当前 APP 版本号大于等于最小支持版本号时，展示可选更新界面。 - 点击稍后更新关闭弹窗，24 小时后再提示。 - 点击马上更新下载后台最新安装包。  ## 9. 待确认问题  | 编号 | 问题 | 影响 | | --- | --- | --- | | A001 | 采集端忘记密码成功后是返回登录页，还是 3 秒自动进入首页，来源中存在两个描述 | 采集端账号体验和验收口径 | | A002 | 采集端是否未来支持验证码登录 | 采集端登录方式和安全策略 | | A003 | 登录页语言设置与登录后个人中心语言设置的优先级是否已有完整流程图本地化来源 | 多语言持久化逻辑 | | A004 | 邮件、短信、通知规则及模板未独立入库 | 注册、登录、重置密码邮件模板追溯 |  ## 10. 来源  - `source:thoughts-v2-current/v2.0.x/贸易端/【贸易端】【账号】注册登录、忘记密码.md` - `source:thoughts-v2-current/v2.0.x/贸易端/【贸易端】【个人中心】个人信息、切换语言、退出账号.md` - `source:thoughts-v2-current/v2.3.x/采集端/【采集端】【登录】邮箱_密码登录、忘记密码.md` - `source:thoughts-v2-current/v2.3.x/采集端/【采集端】【我的】个人中心页.md` - `docs/10-功能模块详情/贸易端.md` - `docs/10-功能模块详情/采集端.md` ", "domain": "公共能力", "module": "功能模块详情", "tags": "账号与个人中心;注册登录;忘记密码;多语言;检查更新", "sources": [{"title": "【贸易端】【账号】注册登录、忘记密码", "version": "v2.0.x", "product_side": "贸易端", "module": "账号", "last_write_time": "2026-09-04T10:48:52"}, {"title": "【贸易端】【个人中心】个人信息、切换语言、退出账号", "version": "v2.0.x", "product_side": "贸易端", "module": "个人中心", "last_write_time": "2026-09-04T10:48:45"}, {"title": "【采集端】【登录】邮箱_密码登录、忘记密码", "version": "v2.3.x", "product_side": "采集端", "module": "登录", "last_write_time": "2026-09-04T10:48:24"}, {"title": "【采集端】【我的】个人中心页", "version": "v2.3.x", "product_side": "采集端", "module": "我的", "last_write_time": "2026-09-04T10:48:27"}]}, {"path": "docs/10-功能模块详情/贸易端.md", "title": "贸易端", "folder": "docs/10-功能模块详情", "text": "# 贸易端  ## 1. 定位  贸易端是 Linkincrease 的客户业务协同主平台，面向客户团队、团队成员、协作团队和业务管理人员。  它承载团队、FlowSpace、订单、里程碑、工单、资源库、自动化、消息、仪表盘、报告和日志审计等核心业务。大部分日常业务创建、协作、查看、审批和数据复用都在贸易端完成。  ## 2. 核心职责  | 职责 | 说明 | | --- | --- | | 账号与个人设置 | 注册登录、忘记密码、个人信息、头像、语言、退出账号 | | 团队管理 | 创建团队、维护团队信息、角色、成员、协作团队 | | FlowSpace 工作空间 | 创建 FlowSpace、维护设置、成员、业务角色、数据围栏、协作 FlowSpace | | 订单执行 | 创建、编辑、导入、导出、查看、完成、取消、重启订单 | | 工单与批复 | 发起工单、采集、批复、指派、终止、评论和动态协作 | | 资源库 | 维护团队资源库、引用资源库数据、同步到 FlowSpace、分享资源库 | | 自动化 | 配置触发条件、执行动作、定时任务、执行日志 | | 协作通知 | 消息中心、实时通知、邮件协作、批量邮件协作 | | 展示分析 | 工作台、订单日程、任务中心、常用视图、仪表盘、报告 | | 日志审计 | 操作日志、订单跟踪记录、动态、历史记录、快照 |  ## 3. 主要模块  ### 3.1 账号与个人中心  贸易端账号能力包括注册登录、忘记密码、个人信息维护、头像、姓名、性别、邮箱、手机号、重置密码、语言切换和退出账号。  个人中心还需要展示当前用户加入的团队列表，并支持切换团队。若用户是团队拥有者，应展示拥有者标识。团队代码应支持复制。  语言切换通常包含跟随系统、简体中文、英文等选项，切换后需要保存到账户并更新当前浏览器语言。  ### 3.2 团队与协作团队  团队是贸易端业务归属的组织单位。用户先进入团队，再进入团队下的 FlowSpace、订单、资源库和仪表盘。  团队管理需要覆盖：  - 创建团队。 - 修改团队信息。 - 维护团队角色。 - 邀请成员。 - 管理协作团队。 - 记录成员邀请和协作邀请流程。  团队权限口径详见 [团队权限](../40-权限、安全与审计/团队权限.md)。  ### 3.3 工作台与 FlowSpace  工作台是贸易端进入业务的日常入口。它提供团队下 FlowSpace 列表、FlowSpace 分组、创建 FlowSpace、星标、排序和常用入口。  FlowSpace 是承载订单、里程碑、工单、资源库引用、自动化、仪表盘和报告的业务空间。FlowSpace 设置需要维护基本信息、成员、业务角色、协作团队、标签、数据围栏等。  FlowSpace 对象口径详见 [FlowSpace](../20-业务对象与数据模型/FlowSpace.md)。  ### 3.4 订单、里程碑、工单与批复  订单是 FlowSpace 下的主业务实体。里程碑是订单流程节点，工单是里程碑下的执行任务，批复是对工单或里程碑结果的确认动作。  贸易端负责订单的完整生命周期：  - 创建订单。 - 编辑订单。 - 导入和导出订单。 - 查看订单列表和详情。 - 管理里程碑计划。 - 发起和处理工单。 - 执行工单批复和里程碑批复。 - 完成、取消、重启订单。  相关口径详见 [订单](../20-业务对象与数据模型/订单.md)、[里程碑](../20-业务对象与数据模型/里程碑.md)、[工单与批复](../20-业务对象与数据模型/工单与批复.md)。  ### 3.5 资源库  资源库是团队级主数据管理能力。贸易端用于维护资源库表数据、将资源库应用到 FlowSpace、在订单或工单中引用资源库数据、查看编辑历史、管理资源库视图和分享资源库。  相关口径详见 [资源库](../20-业务对象与数据模型/资源库.md) 和 [资源库引用与同步](../30-业务流程与产品流程图/资源库引用与同步.md)。  ### 3.6 自动化、消息与邮件协作  贸易端支持自动化配置，包括触发条件、执行动作、通知动作和定时任务。自动化执行结果应进入执行日志。  协作通知能力包括：  - 站内消息中心。 - 在线实时消息。 - 邮件协作。 - 批量邮件协作。 - 任务相关提醒。  相关口径详见 [自动化配置](../10-功能模块详情/自动化配置.md)、[消息中心与实时通知](../10-功能模块详情/消息中心与实时通知.md)、[邮件协作](../10-功能模块详情/邮件协作.md)。  ## 4. 与其他产品端关系  | 关系 | 说明 | | --- | --- | | 来自运营端 | 业务模板、资源库模板、表单组件、仪表盘组件、报告入口、外部 API 配置等由运营端维护或监管 | | 同步到采集端 | 工单、工单批复、里程碑批复、任务状态、消息通知会同步到采集端 | | 回流自采集端 | 采集端提交的工单数据、批复数据、指派结果、评论或动态回流贸易端 |  ## 5. 知识库拆分建议  贸易端后续可继续拆成以下细页：  - 账号注册登录与个人中心。 - 团队创建与团队设置。 - 工作台和 FlowSpace 分组。 - FlowSpace 设置。 - 协作 FlowSpace 设置。 - 订单列表、订单详情、订单管理。 - 工单视图和批量操作。 - 资源库视图、分享和应用范围。 - 自动化一期、定时任务。 - 消息中心、邮件协作。  ## 6. 来源  - `source:thoughts-v2-current/v2.0.x/贸易端/【贸易端】【账号】注册登录、忘记密码.md` - `source:thoughts-v2-current/v2.0.x/贸易端/【贸易端】【个人中心】个人信息、切换语言、退出账号.md` - `source:thoughts-v2-current/v2.0.x/贸易端/【贸易端】【团队管理】创建团队.md` - `source:thoughts-v2-current/v2.0.x/贸易端/【贸易端】【团队设置】团队信息、角色、成员、协作团队管理.md` - `source:thoughts-v2-current/v2.0.x/贸易端/【贸易端】【工作台】工作台、创建SCCS、SCCS分组.md` - `source:thoughts-v2-current/v2.1.x/贸易端/【贸易端】【SCCS设置】.md` - `source:thoughts-v2-current/v2.2.x/贸易端/【贸易端】【订单详情】查看&操作.md` - `source:thoughts-v2-current/v2.2.x/贸易端/【贸易端】【订单详情】工单&里程碑批复操作.md` - `source:thoughts-v2-current/V2.4.x/贸易端/【贸易端】【资源库】第一阶段.md` - `source:thoughts-v2-current/V2.4.x/贸易端/【贸易端】【自动化】一期.md` - `03-功能地图.md`", "domain": "贸易端", "module": "功能模块详情", "tags": "产品端;贸易端;团队;FlowSpace;订单", "sources": [{"title": "【贸易端】【账号】注册登录、忘记密码", "version": "v2.0.x", "product_side": "贸易端", "module": "账号", "last_write_time": "2026-09-04T10:48:52"}, {"title": "【贸易端】【个人中心】个人信息、切换语言、退出账号", "version": "v2.0.x", "product_side": "贸易端", "module": "个人中心", "last_write_time": "2026-09-04T10:48:45"}, {"title": "【贸易端】【团队管理】创建团队", "version": "v2.0.x", "product_side": "贸易端", "module": "团队管理", "last_write_time": "2026-09-04T10:48:48"}, {"title": "【贸易端】【工作台】工作台、创建SCCS、SCCS分组", "version": "v2.0.x", "product_side": "贸易端", "module": "工作台", "last_write_time": "2026-09-04T10:48:46"}, {"title": "【贸易端】【订单详情】查看&操作", "version": "v2.2.x", "product_side": "贸易端", "module": "订单详情", "last_write_time": "2026-09-04T10:48:34"}]}, {"path": "docs/10-功能模块详情/资源库.md", "title": "资源库", "folder": "docs/10-功能模块详情", "text": "# 资源库  本页是资源库功能模块的阅读入口。  ## 模块范围  - 资源库模板、团队资源库、协作资源库、资源库数据管理。 - 资源库引用、同步、分享、权限、历史记录。 - 资源库数据作为 FlowSpace、订单、工单字段来源时的边界。  ## 权威文档  - [资源库](../20-业务对象与数据模型/资源库.md) - [资源库模板](../20-业务对象与数据模型/资源库模板.md) - [资源库数据模型](../20-业务对象与数据模型/资源库数据模型.md) - [资源库快捷创建引用数据](./资源库快捷创建引用数据.md) - [资源库引用与同步](../30-业务流程与产品流程图/资源库引用与同步.md) - [资源库权限](../40-权限、安全与审计/资源库权限.md) - [资源库数据围栏](../40-权限、安全与审计/资源库数据围栏.md)", "domain": "公共能力", "module": "功能模块详情", "tags": "10-功能模块详情;资源库", "sources": [{"title": "【贸易端】【资源库】第一阶段", "version": "V2.4.x", "product_side": "贸易端", "module": "资源库", "last_write_time": "2026-09-04T10:48:14"}, {"title": "【贸易端】【资源库】视图管理", "version": "V2.5.x", "product_side": "贸易端", "module": "资源库", "last_write_time": "2026-09-04T10:48:01"}, {"title": "【贸易端】【资源库】资源库分享", "version": "V2.5.x", "product_side": "贸易端", "module": "资源库", "last_write_time": "2026-09-04T10:48:03"}, {"title": "【运营端】【模板中心】资源库模版管理", "version": "v2.3.x", "product_side": "运营端", "module": "模板中心", "last_write_time": "2026-09-04T10:48:13"}, {"title": "【运营端】【用户-资源库管理】平台团队的资源库数据管理", "version": "v2.3.x", "product_side": "运营端", "module": "用户-资源库管理", "last_write_time": "2026-09-04T10:48:09"}, {"title": "【贸易端】【资源库】SCCS应用数据范围、数据编辑历史记录", "version": "v2.7", "product_side": "贸易端", "module": "资源库", "last_write_time": "2026-09-04T10:47:57"}]}, {"path": "docs/10-功能模块详情/资源库快捷创建引用数据.md", "title": "资源库快捷创建引用数据", "folder": "docs/10-功能模块详情", "text": " # 资源库快捷创建引用数据  ## 1. 功能定位  资源库快
