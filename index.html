捷创建引用数据用于在订单创建或编辑过程中，直接从资源库引用弹窗创建当前资源表的数据，并回到引用弹窗完成选择，缩短“发现资源库数据缺失 -> 创建资源数据 -> 完成订单引用”的路径。  快捷创建写入的是正式资源库数据，不是订单临时数据。即使后续取消订单，已创建的资源库数据仍保留。  ## 2. 使用入口  用户在订单表单中打开资源库引用弹窗时，如果当前选中的资源表有效，且当前用户拥有该表“创建数据”权限，则展示“添加资源数据”按钮。  按钮只作用于当前选中的资源表；切换资源表后立即重新计算权限。前端隐藏只用于交互，打开创建页和提交创建时服务端必须再次校验。  ## 3. 创建数据抽屉  点击“添加资源数据”后，在引用弹窗之上打开当前资源表的创建数据抽屉：  1. 复用当前资源表的创建表单、字段、组件和校验规则。 2. 保留订单草稿，以及引用弹窗中的资源表、搜索词、筛选、滚动位置和已选数据。 3. 抽屉底部提示：“保存后数据将直接写入资源库；即使取消订单，该数据仍会保留。” 4. 取消或关闭时不创建数据，并返回引用弹窗原状态。  ## 4. 创建成功后的引用规则  | 场景 | 规则 | | --- | --- | | 创建成功且可引用 | 刷新当前资源表列表，定位并自动选中新数据；存在二级引用页面时，自动选中并跳转到二级页面；提示“资源数据已创建，并已为你选中” | | 创建成功但不可引用 | 数据保留在资源库，不回滚；引用弹窗不选中该数据；提示检查数据范围 | | 用户确认引用 | 按既有单选、多选、字段回填、空值处理、成员/协作方过滤和二级引用规则回填订单字段 | | 订单取消或保存失败 | 不删除已快捷创建的资源库数据 |  创建资源数据本身不代表订单已引用；必须由用户在引用弹窗确认后，才按既有映射回填订单字段。  ## 5. 权限、数据范围与对象边界  | 维度 | 规则 | | --- | --- | | 写入对象 | 当前资源库 > 当前资源表 > 单条资源库数据 | | 可引用范围 | 已关联资源表、表有效性、表查看权限、用户数据范围、FlowSpace 应用范围及协作授权范围的交集 | | 资源库/资源表 | 复用现有对象，不新增结构；创建目标由引用弹窗当前资源表决定 | | 资源库模板 | 复用现有表单结构、组件和校验，无新增配置项 |  创建成功后按普通“创建资源库数据”写入历史，记录创建人、创建时间，并触发与普通资源库新增一致的既有事件。  ## 6. 空态与异常  | 场景 | 页面处理 | | --- | --- | | 无可引用数据且有创建权限 | 显示“暂无可引用数据”和“添加资源数据”入口 | | 无可引用数据且无创建权限 | 仅显示“暂无可引用数据”，不展示创建入口 | | 搜索无结果 | 显示“未找到匹配数据”；有权限时仍可创建，但不自动带入搜索词 | | 点击创建前权限被移除 | 提示“暂无权限，请联系管理员” | | 填写中权限被移除 | 提交失败，保留已填内容并提示无权限 | | 资源表被删除或失效 | 提交失败，关闭创建页并刷新可选资源表，提示重新选择 | | 协作授权被移除 | 提交失败，刷新资源表可选数据范围 | | 必填或格式错误 | 在对应字段就近提示，不提交 | | 网络或服务异常 | 保留表单内容，提示“创建失败，请稍后重试” | | 重复提交 | 首次提交后按钮进入加载态，不产生重复数据 | | 创建成功但列表刷新失败 | 提示“数据已创建，请刷新列表后选择”，允许手动刷新 |  ## 7. 验收重点  1. 有当前表创建权限时展示“添加资源数据”；无权限时不展示，接口也拒绝。 2. 切换不同资源表时，按钮按当前表权限实时显示或隐藏。 3. 创建抽屉复用当前资源表表单，表单校验失败时不提交。 4. 创建成功且可引用时，返回引用弹窗、刷新并自动选中新数据，但不直接写入订单。 5. 权限或资源表状态中途变化时，服务端拒绝提交并明确提示。 6. 创建成功但不可引用时，资源库数据不回滚、不选中，并提示检查数据范围。 7. 取消订单后，快捷创建成功的资源库数据仍保留。 8. 原引用能力回归：清除关联、手动修改、二级引用和同步策略不受影响。  ## 8. 来源需求  - `source:thoughts-v2-current/v2.8/贸易端/【贸易端】订单引用资源库页面快捷创建资源库数据.md`", "domain": "贸易端", "module": "功能模块详情", "tags": "资源库;订单;资源库引用;快捷创建;权限", "sources": [{"title": "【贸易端】订单引用资源库页面快捷创建资源库数据", "version": "v2.8", "product_side": "贸易端", "module": "贸易端", "last_write_time": "2026-09-04T10:47:51"}]}, {"path": "docs/10-功能模块详情/运营端.md", "title": "运营端", "folder": "docs/10-功能模块详情", "text": "# 运营端  ## 1. 定位  运营端是 Linkincrease 的平台级配置与监管后台，服务对象主要是平台运营、实施和管理人员。  它不直接承担日常订单执行，而是负责维护平台基础数据、模板能力、配置能力、监管能力和平台级审计入口。贸易端和采集端的很多业务能力，都来自运营端模板、组件、集成和平台配置的下发。  ## 2. 核心职责  | 职责 | 说明 | | --- | --- | | 平台用户监管 | 管理和查看用户账号、启用状态、激活状态、登录记录、所属团队、相关 FlowSpace | | 平台团队监管 | 查看团队基础信息、拥有者、成员、角色、协作邀请、团队关联 FlowSpace | | FlowSpace 数据监管 | 查看平台团队下 FlowSpace 列表、FlowSpace 数据详情、成员记录、协作团队、订单、工单、自动化记录 | | 资源库监管 | 查看团队资源库列表、资源库数据明细、模板来源、创建和更新记录 | | 模板中心 | 管理业务模板、资源库模板，并向贸易端创建 FlowSpace 和资源库提供标准模板 | | 表单与组件配置 | 维护表单组件、字段属性、显隐规则、公式、行业组件等配置底座 | | 仪表盘与报告 | 管理 FlowSpace 仪表盘、仪表盘设计器、第三方报告链接和报告相关数据表 | | 集成与系统能力 | 配置外部 API 集成、第三方数据引用、软件更新和系统级记录 |  ## 3. 主要模块  ### 3.1 用户管理  运营端用户管理用于监管平台用户账号。  常见列表字段包括 UID、账号邮箱、头像、姓名、拥有团队、加入团队、相关 FlowSpace、注册时间、最后登录时间、浏览器或终端版本、系统、设备、登录 IP、地区、账号状态。  常见筛选条件包括账号、姓名、账号状态、激活状态、创建时间、最后登录时间。  账号状态需要区分：  - `启用`：用户可正常登录并使用贸易端或采集端。 - `禁用`：用户不可登录，贸易端应展示禁用提示。 - `待激活`：已被邀请但尚未完成注册激活。  ### 3.2 团队管理  团队管理用于监管平台内客户团队及其协作关系。  常见列表字段包括团队名称、团队简称、团队代码、拥有者、成员数量、已邀请协作团队数量、参与外部团队数量、FlowSpace 数量、协作 FlowSpace 数量、创建时间。  团队详情通常包含：  - 团队基础信息。 - 成员信息。 - 角色列表。 - 本团队邀请的协作团队。 - 本团队参与的外部协作团队。 - 本团队自有 FlowSpace。 - 本团队参与的外部协作 FlowSpace。  邀请记录需要区分团队成员邀请和团队协作邀请，并记录操作人、被邀请方、邀请时间、处理状态等信息。  ### 3.3 FlowSpace 管理  FlowSpace 管理用于查看平台团队下的 FlowSpace 数据。  常见筛选条件包括 FlowSpace 编号、FlowSpace 名称、团队代码、团队名称、拥有者账号、拥有者姓名、创建人账号、创建人姓名、创建类型、模板行业、创建时间、模板更新时间。  列表常见字段包括 FlowSpace 编号、名称、所属团队、团队代码、团队拥有者、成员数量、协作团队数量、订单数量、模板名称、模板类型、模板行业、创建人、创建时间、模板更新人、模板更新时间。  常见操作入口包括：  - 查看 FlowSpace 数据详情。 - 修改模板。 - 复制到模板库。 - 进入仪表盘管理。 - 查看订单、工单、操作记录、成员管理记录。  ### 3.4 资源库管理  资源库管理用于监管团队资源库及其数据明细。  常见筛选条件包括资源库名称、团队代码、团队名称、创建人账号、创建人姓名、模板名称、创建类型、模板行业、创建时间、更新时间。  列表常见字段包括资源库名称、所属团队、团队代码、模板名称、模板类型、模板行业、创建人、创建时间、更新人、模板更新时间。  资源库数据详情通常需要支持按资源库、团队、创建人检索，并展示资源库名称、团队、模板、表单名称、创建人、创建时间、更新人、更新时间等信息。  ### 3.5 设置与软件管理  设置模块沉淀平台级软件管理能力，包括软件版本、更新记录、安装包、更新日志和相关操作记录。  该模块属于系统运维与审计能力的一部分，应与 [系统与集成执行日志](../40-权限、安全与审计/系统与集成执行日志.md) 互相引用。  ## 4. 与其他产品端关系  | 关系 | 说明 | | --- | --- | | 运营端到贸易端 | 运营端配置模板、组件、仪表盘、报告、集成能力；贸易端在团队和 FlowSpace 场景中使用这些能力 | | 运营端到采集端 | 运营端不直接驱动采集端任务，但通过模板、字段、表单组件和流程配置影响采集端任务详情页的展示与填写 | | 运营端到公共能力 | 权限、日志、自动化、外部 API、报告、仪表盘等能力需要在公共能力页沉淀统一口径 |  ## 5. 知识库拆分建议  运营端后续可继续拆成以下细页：  - 用户管理。 - 团队管理。 - FlowSpace 数据管理。 - 资源库数据管理。 - 邮件协作监管。 - 自动化记录。 - 外部 API 集成配置。 - 报告管理。 - 软件管理。  ## 6. 来源  - `source:thoughts-v2-current/v2.1.x/运营端/【运营端】【用户-用户管理】平台用户数据管理.md` - `source:thoughts-v2-current/v2.1.x/运营端/【运营端】【用户-团队管理】平台团队数据管理.md` - `source:thoughts-v2-current/v2.1.x/运营端/【运营端】【用户-SCCS管理】平台团队的SCCS数据管理.md` - `source:thoughts-v2-current/v2.3.x/运营端/【运营端】【用户-SCCS管理】邮件协作列表.md` - `source:thoughts-v2-current/v2.3.x/运营端/【运营端】【用户-资源库管理】平台团队的资源库数据管理.md` - `source:thoughts-v2-current/V2.4.x/运营端/【运营端】【设置-软件管理】软件相关信息与记录管理.md` - `03-功能地图.md`", "domain": "运营端", "module": "功能模块详情", "tags": "产品端;运营端;平台监管;模板;软件管理", "sources": [{"title": "【运营端】【用户-用户管理】平台用户数据管理", "version": "v2.1.x", "product_side": "运营端", "module": "用户-用户管理", "last_write_time": "2026-09-04T10:48:37"}, {"title": "【运营端】【用户-团队管理】平台团队数据管理", "version": "v2.1.x", "product_side": "运营端", "module": "用户-团队管理", "last_write_time": "2026-09-04T10:48:37"}, {"title": "【运营端】【用户-SCCS管理】平台团队的SCCS数据管理", "version": "v2.1.x", "product_side": "运营端", "module": "用户-SCCS管理", "last_write_time": "2026-09-04T10:48:35"}, {"title": "【运营端】【用户-资源库管理】平台团队的资源库数据管理", "version": "v2.3.x", "product_side": "运营端", "module": "用户-资源库管理", "last_write_time": "2026-09-04T10:48:09"}, {"title": "【运营端】【设置-软件管理】软件相关信息与记录管理", "version": "V2.4.x", "product_side": "运营端", "module": "设置-软件管理", "last_write_time": "2026-09-04T10:48:05"}]}, {"path": "docs/10-功能模块详情/通用交互规范.md", "title": "通用交互规范", "folder": "docs/10-功能模块详情", "text": " # 通用交互规范  ## 1. 功能定位  本页沉淀跨模块复用的通用交互规则。若具体需求未另行说明，头像展示、提示弹窗、查询按钮、排序、弹窗遮罩和模糊搜索等基础交互按本页执行。  ## 2. 头像展示  ### 工单/批复任务查看状态  - 头像叠放展示。 - 超过 3 个处理人时，多出部分以 `+数字` 表示。 - 鼠标移入可查看成员信息或协作团队信息。 - 成员信息展示姓名和邮箱。 - 协作团队信息展示全称和简称。 - 协作成员头像展示协作标识，同时成员信息展示所属团队全称和简称。 - 工单任务已提交时，头像展示已提交标识。  ### 设置类页面查看状态  - 头像不做收起，有几个成员或协作团队则显示几个。 - 一行显示不下时换行展示。 - 每个姓名标签最大宽度以当前列宽为限；一个名字一行显示不下时，末尾展示省略号。  ### 设置类页面编辑状态  选中后输入框内展示：  - 成员：头像和姓名；未注册成员展示 `未注册` 标识。 - 协作团队：头像和简称。  下拉列表中展示：  - 成员：头像和姓名；未注册成员展示 `未注册` 标识。 - 协作团队：头像、全称和简称。  ## 3. 提示  | 场景 | 规则 | | --- | --- | | 编辑数据校验空提示 | 文案为 `请输入$字段名称` | | 删除提示 | 标题为 `删除$删除内容`；说明为 `确定要删除$删除内容【$被删除对象名称】` | | 数据编辑时取消提示 | `提交` 表示提交当前内容校验；`不提交` 表示关闭弹窗；`取消` 表示关闭提示并返回继续编辑 |  ## 4. 按钮与排序  设置类页面查询条件中：  - `重置`：还原回默认查询条件，同时刷新列表。 - `查询`：按设定条件筛选列表。  无特殊说明时，列表数据均按新增时间倒序展示。  ## 5. 弹窗遮罩  | 弹窗类型 | 遮罩交互 | | --- | --- | | 数据编辑类弹窗 | 点击遮罩不可关闭弹窗 | | 提示类弹窗 | 点击遮罩可关闭弹窗 |  ## 6. 搜索  | 场景 | 规则 | | --- | --- | | 业务数据模糊搜索 | 点击 `查询` 或按 `Enter` 键进行筛选 | | 设置类模糊搜索 | 输入后延迟 1.2 秒实时筛选 |", "domain": "公共能力", "module": "功能模块详情", "tags": "通用交互;头像;提示;弹窗;搜索", "sources": [{"title": "通用说明（持续更新）", "version": "common", "product_side": "公共能力", "module": "", "last_write_time": "2026-09-04T10:47:44"}]}, {"path": "docs/10-功能模块详情/邮件协作.md", "title": "邮件协作", "folder": "docs/10-功能模块详情", "text": " # 邮件协作  ## 1. 功能定位  邮件协作用于把工单采集任务通过邮件继续下发给平台外邮箱收集数据，解决工单采集只支持一级协作时的外部询价、填报和资料收集问题。邮件协作数据可回流到原工单，并可被工单采集人引用。  ## 2. 数据共享范围  同一工单内，邮件协作数据以团队为单位共享。  - 同团队内任一采集人发出的邮件协作，同团队可查看该工单的成员均可查看。 - 同团队采集成员可引用这些邮件协作数据。 - 引用时仅填充当前用户可编辑的表单或子表。  ## 3. 邮件协作列表  | 标签页 | 内容 | | --- | --- | | 邮件协作 | 当前用户所处团队在该工单中发出的邮件协作数据 | | 历史记录 | 邮件协作者提交数据的历史快照 |  固定字段包括序号、备注、附件、邮件发出人和时间、填写人邮箱、更新时间。其余字段为当前工单所有非隐藏表单字段；发出邮件协作时若隐藏某些表单，对应字段置空置灰。  ## 4. 创建邮件协作  创建条件：  - 工单处于可采集状态。 - 当前用户在当前团队作为当前工单采集人。 - 协作团队未指派前，对接人或有工单指派权限成员也可创建。  配置内容：  - 模块显隐设置，至少保留一个可编辑表单。 - 接收邮箱，可输入多个邮箱，并记住最近 10 条发送记录。 - 邮件主题、备注、附件。 - 右侧预览页面按显隐设置展示。  订单基本信息按当前发出邮件协作成员的数据围栏展示；不可见字段对邮件协作者也不可见。  ## 5. 邮件填写与失效  邮件内有两个链接：  - 填写当前邮件协作的链接。 - 查看当前邮箱参与的所有邮件协作列表链接。  失效或不可提交场景：  - 邮件协作被删除，链接失效。 - 原工单被删除，链接失效。 - 原工单已批复、已终止采集。 - 里程碑已完成或已取消。  提交后，需要通知原工单中该邮件协作发出团队下的所有采集人。  ## 6. 邮件协作方列表  邮件协作者可通过“查看我的所有邮件协作”链接查看当前邮箱接收的所有邮件协作工单。  规则：  - 未注册用户跳转注册并自动填入邮箱。 - 已注册用户跳转登录并自动填入邮箱。 - 邮箱验证信息有效期 7 天，前端本地缓存。 - 状态包括可处理、已完成、已失效。 - 支持按最近发起、最近更新排序。  ## 7. 引用数据  | 引用方式 | 规则 | | --- | --- | | 整行引用 | 将某条邮件协作数据覆盖填充到当前工单，填充后仍可修改 | | 子表引用 | 仅覆盖对应子表控件，其余控件不影响 |  引用权限：当前采集处理人可引用本团队发出的邮件协作。子表不可编辑时，提示当前子表不可编辑，无法引用数据。  ## 8. 运营端邮件协作列表  运营端 FlowSpace 管理中可查看邮件协作列表，支持主题、发起人、投递状态、邮件状态、更新时间等筛选。详情页和历史记录同贸易端查看效果。  投递状态包含成功、无效地址、垃圾邮件、失败；若贸易端重发，投递状态和邮件状态以最新发出的邮件为准。  ## 9. 待确认问题  - 邮件协作模板仍引用外部“邮件、短信、通知规则及模板”，需要导出。 - 邮件发送“分别发送”与“共同接收同一封邮件”的最终产品规则需补入。 - 邮件协作填写页切换语言和最后提交时间的更新项需要进一步拆明细。 ", "domain": "贸易端", "module": "功能模块详情", "tags": "邮件协作;工单;外部协作;数据引用", "sources": [{"title": "【贸易端】【订单详情】邮件协作", "version": "v2.2.x", "product_side": "贸易端", "module": "订单详情", "last_write_time": "2026-09-04T10:48:28"}, {"title": "【运营端】【用户-SCCS管理】邮件协作列表", "version": "v2.3.x", "product_side": "运营端", "module": "用户-SCCS管理", "last_write_time": "2026-09-04T10:48:12"}]}, {"path": "docs/10-功能模块详情/采集端.md", "title": "采集端", "folder": "docs/10-功能模块详情", "text": "# 采集端  ## 1. 定位  采集端是 Linkincrease 的移动执行入口，面向需要在移动场景中查看任务、填写工单、提交批复、处理指派和接收消息的执行人员。  采集端不是完整后台，它聚焦“我需要处理什么、在哪里处理、处理后如何同步回贸易端”。因此知识库中采集端应优先围绕任务列表、任务详情、采集提交、批复提交、消息提醒和个人中心沉淀。  ## 2. 核心职责  | 职责 | 说明 | | --- | --- | | 登录与账号 | 邮箱密码登录、忘记密码、账号状态校验 | | 首页概览 | 展示我的任务、团队待指派任务、我关注、FlowSpace 任务统计 | | 任务列表 | 按进行中、已完成、我发起、我关注、团队指派等维度查看任务 | | 任务搜索 | 搜索工单、工单批复、里程碑批复任务 | | 任务详情 | 查看工单详情、工单批复详情、里程碑批复详情 | | 移动采集 | 填写工单表单、引用第三方数据、处理子表、提交数据 | | 图片采集与编辑 | 拍照、相册多选、图片预览、标注、脱敏、上传和失败重试 | | 批复处理 | 提交工单批复和里程碑批复 | | 指派处理 | 在具备权限时处理协作工单或批复的指派 | | 消息中心 | 接收任务、评论、协作、系统相关消息 | | 我的 | 查看个人信息和基础账号入口 |  ## 3. 主要模块  ### 3.1 登录  采集端登录与贸易端账号体系保持一致，通常使用邮箱和密码登录，并支持忘记密码。  账号状态、禁用状态、待激活状态等应与平台账号规则一致。若账号被禁用，应阻止登录并提示用户。  ### 3.2 首页  首页展示任务相关数据和 FlowSpace 相关任务数据。常见区域包括：  - 我的任务。 - 团队待指派任务。 - 我关注。 - FlowSpace 任务统计。 - 团队切换入口。 - 底部导航。  FlowSpace 统计需要展示该团队下与当前用户相关的订单数、任务数、里程碑任务数、待办数等。若 FlowSpace 来自外部协作，需要展示协作标识和所属团队信息。  首页需要支持下拉刷新；页面较长时可出现返回顶部入口；点击头像或名称进入个人中心；点击待办、团队指派、我关注等入口跳转到任务列表对应标签页。  ### 3.3 任务列表  任务列表按不同状态和业务维度展示任务，至少包含：  - 进行中任务。 - 已完成任务。 - 我发起任务。 - 我关注任务。 - 团队指派任务。  进行中任务需要区分待办和已处理。任务类型包括工单、工单批复、里程碑批复。任务列表应排除互用产生的工单，仅展示正常创建的工单。  常见筛选和排序包括：  - 任务状态标签。 - 任务排序：最新发起、最近发起等。 - FlowSpace 范围：全部或指定 FlowSpace，多选。 - 订单状态：全部、进行中、已完成、已取消等。  列表需要支持下拉刷新、上拉加载更多、标签切换、进入任务搜索页、点击任务进入详情、关注和取消关注。  ### 3.4 任务详情  任务详情覆盖三类页面：  - 工单详情页。 - 工单批复详情页。 - 里程碑批复详情页。  工单详情页需要展示基础信息，包括里程碑状态、订单标识、FlowSpace 名称、里程碑名称、发起人、发起时间、采集人、最新采集时间、批复人、最新批复时间、工单完成度、可编辑模块、所属团队等。  工单表单需要按可编辑和不可编辑状态展示。若用户具有编辑权限且工单可编辑，则展示提交按钮；若无权限或不可编辑，则隐藏提交按钮。  采集端任务详情还需要处理：  - 未提交修改返回时的保存提示。 - 服务端任务更新后的冲突提示。 - 指派按钮显隐。 - 第三方数据引用入口。 - 工单终止标签。 - 工单动态。 - 子表引用、添加、保存、继续添加、继续关联。 - 子表行数据切换和未保存提示。 - 图片拍照、相册多选、大图预览、编辑、删除、上传状态和失败重试。  工单批复详情页以工单批复为第一标签，其他逻辑与工单详情页保持一致。里程碑批复详情页需要展示里程碑批复表单、该里程碑下的工单和工单批复、订单信息。  ### 3.5 图片采集与编辑  工单、工单批复和里程碑批复中的图片组件支持拍照和相册多选。拍照后先进入单图预览，可直接使用、编辑或重拍；相册多选后直接加入图片组件，不强制逐张确认。  图片编辑支持方框、文字、马赛克、撤销、清空和重新编辑。编辑结果与原图合成为新图片并替换当前图片，不新增图片数量。图片未上传完成时不允许提交表单，上传失败时保留本地图片并提供重新上传。  详细规则见 [采集端图片编辑](./采集端图片编辑.md)。  ### 3.6 消息中心与我的  采集端消息中心承接任务、评论、协作、系统相关消息，并与贸易端消息状态保持一致。需要支持未读提示和 App 通知入口。  我的页面用于展示个人中心信息，通常承接头像、姓名、账号相关信息、退出或账号管理入口。  ## 4. 与其他产品端关系  | 关系 | 说明 | | --- | --- | | 来自贸易端 | 任务、工单、批复、指派、订单和 FlowSpace 信息从贸易端同步到采集端 | | 回流贸易端 | 采集提交、批复提交、评论、动态、指派结果回写贸易端 | | 受运营端配置影响 | 表单组件、字段显隐、第三方数据引用、模板规则由运营端配置，并在采集端任务详情中体现 |  ## 5. 知识库拆分建议  采集端后续可继续拆成以下细页：  - 登录与账号状态。 - 首页任务统计。 - 任务列表。 - 任务搜索。 - 工单详情。 - 工单批复详情。 - 里程碑批复详情。 - 图片采集与编辑。 - 消息中心。 - 我的。  ## 6. 来源  - `source:thoughts-v2-current/v2.3.x/采集端/【采集端】【登录】邮箱_密码登录、忘记密码.md` - `source:thoughts-v2-current/v2.3.x/采集端/【采集端】【首页】任务相关数据展示.md` - `source:thoughts-v2-current/v2.3.x/采集端/【采集端】【任务列表】工单、工单批复、里程碑批复任务列表.md` - `source:thoughts-v2-current/v2.3.x/采集端/【采集端】【任务搜索页】工单、工单批复、里程碑批复任务搜索.md` - `source:thoughts-v2-current/v2.3.x/采集端/【采集端】【任务详情页】工单、工单批复、里程碑批复详情页.md` - `source:thoughts-v2-current/v2.3.x/采集端/【采集端】【消息中心】消息通知列表.md` - `source:thoughts-v2-current/v2.3.x/采集端/【采集端】【我的】个人中心页.md` - `source:thoughts-v2-current/v2.7/采集端/采集端图片编辑功能.md` - `docs/30-业务流程与产品流程图/移动端采集.md`", "domain": "采集端", "module": "功能模块详情", "tags": "产品端;采集端;移动端采集;任务;消息;图片编辑", "sources": [{"title": "【采集端】【登录】邮箱_密码登录、忘记密码", "version": "v2.3.x", "product_side": "采集端", "module": "登录", "last_write_time": "2026-09-04T10:48:24"}, {"title": "【采集端】【首页】任务相关数据展示", "version": "v2.3.x", "product_side": "采集端", "module": "首页", "last_write_time": "2026-09-04T10:48:24"}, {"title": "【采集端】【任务列表】工单、工单批复、里程碑批复任务列表", "version": "v2.3.x", "product_side": "采集端", "module": "任务列表", "last_write_time": "2026-09-04T10:48:25"}, {"title": "【采集端】【任务详情页】工单、工单批复、里程碑批复详情页", "version": "v2.3.x", "product_side": "采集端", "module": "任务详情页", "last_write_time": "2026-09-04T10:48:26"}, {"title": "【采集端】【消息中心】消息通知列表", "version": "v2.3.x", "product_side": "采集端", "module": "消息中心", "last_write_time": "2026-09-04T10:48:28"}, {"title": "采集端图片编辑功能", "version": "v2.7", "product_side": "采集端", "module": "采集端", "last_write_time": "2026-09-04T10:47:57"}]}, {"path": "docs/10-功能模块详情/采集端图片编辑.md", "title": "采集端图片编辑", "folder": "docs/10-功能模块详情", "text": " # 采集端图片编辑  ## 1. 功能定位  采集端图片编辑用于现场采集人员在提交工单、工单批复或里程碑批复前，对图片组件中的照片进行标记和脱敏处理。  适用图片来源包括现场拍照和相册选择。每次只编辑一张图片；相册支持多选，但选择后不强制逐张预览或编辑。  ## 2. 功能范围  | 优先级 | 能力 | | --- | --- | | P0 | 拍照预览、相册多选、大图预览、方框标注、文字标注、马赛克、撤销、清空标注、保存编辑、取消编辑、重新编辑、删除图片 | | P1 | 自由画笔、箭头标注、重做 |  第三方组件和具体技术选型由开发调研确定，不属于当前产品规则。  ## 3. 上传与预览流程  ### 3.1 拍照  1. 用户点击图片上传区域并选择拍照。 2. 拍照完成后进入单图预览。 3. 用户可直接使用、编辑图片或重新拍摄。 4. 编辑完成后返回预览页，确认使用后加入图片组件并进入上传流程。 5. 返回且放弃当前照片时，需要提示用户确认。  ### 3.2 相册多选  - 最大可选数量为“图片组件最大数量减去当前已有图片数量”。 - 选择完成后直接加入图片组件，不逐张进入预览页。 - 图片顺序与相册选择结果保持一致。 - 每张图片独立显示上传状态。 - 用户可点击任意图片进入大图预览、编辑或删除。  ### 3.3 大图预览  - 支持左右滑动切换图片，并展示当前位置，如 `2/5`。 - 图片可编辑时展示编辑和删除操作。 - 图片不可编辑时仅允许查看和切换，不展示编辑、删除操作。  ## 4. 编辑规则  | 工具 | 规则 | | --- | --- | | 方框标注 | 支持拖动生成、调整位置和大小、选中删除；默认使用醒目的红色 | | 文字标注 | 点击图片位置输入文字，支持移动、修改和删除；单条文字建议最多 100 个字符 | | 马赛克 | 支持连续涂抹；必须合成到最终图片，输出后不可通过取消图层恢复遮挡区域 | | 撤销 | 新增、移动、修改或删除标注均记为一次操作；无可撤销内容时按钮置灰 | | 清空标注 | 清除当前图片全部标注，但保留原图片；执行前二次确认 |  编辑页采用全屏结构，至少包含返回、当前图片、工具栏、撤销、清空和完成。  ## 5. 保存、取消与重新编辑  ### 5.1 保存编辑  点击完成后：  1. 将原图片和全部标注合成为一张新图片。 2. 使用编辑后的图片替换当前图片。 3. 保持图片数量和排列位置不变。 4. 将编辑后的图片进入上传或重新上传流程。  编辑图片不视为新增图片，不占用新的图片数量。  ### 5.2 取消编辑  - 未产生编辑时，返回可直接退出。 - 存在未保存编辑时，提示“当前编辑内容尚未保存，是否放弃？”。 - 用户可继续编辑或放弃编辑。 - 放弃后恢复进入编辑页之前的图片。  ### 5.3 重新编辑  表单提交前可以再次编辑已选择图片。重新编辑以当前图片为基础，保存后替换当前图片，不影响其他图片。  ## 6. 上传状态与提交限制  图片上传状态包括：  - 待上传。 - 上传中。 - 上传成功。 - 上传失败。  规则：  - 编辑已上传成功的图片时，需要重新上传编辑后的图片并替换原图片。 - 新图片替换成功前保留原图片，避免上传失败导致图片丢失。 - 图片编辑期间暂停当前图片的上传或替换。 - 图片未上传完成时，不允许提交表单。 - 上传失败时保留本地图片，并提供重新上传入口。  ## 7. 权限与状态  - 图片编辑入口受图片组件和任务当前是否可编辑控制。 - 工单、工单批复或里程碑批复不可编辑时，仅允许查看图片。 - 图片数量达到组件配置上限时，不允许继续添加图片。 - 图片编辑只改变当前图片文件，不改变表单内其他图片的数量和顺序。  ## 8. 待确认问题  - 方框、文字和马赛克是否支持颜色、线条粗细或画笔粗细配置。 - P1 的自由画笔、箭头标注和重做能力是否纳入首期发布。 - 弱网或离线场景下，图片编辑结果、上传队列和重新上传如何持久化。 - 图片压缩、尺寸、格式、文件大小和 EXIF 信息的处理规则。  ## 9. 来源  - `source:thoughts-v2-current/v2.7/采集端/采集端图片编辑功能.md`", "domain": "采集端", "module": "功能模块详情", "tags": "采集端;图片组件;图片编辑;拍照;相册多选;马赛克;上传", "sources": [{"title": "采集端图片编辑功能", "version": "v2.7", "product_side": "采集端", "module": "采集端", "last_write_time": "2026-09-04T10:47:57"}]}, {"path": "docs/10-功能模块详情/验货组件流程.md", "title": "验货组件流程", "folder": "docs/10-功能模块详情", "text": " # 验货组件流程  ## 1. 功能定位  验货组件流程基于 Linkincrease 低代码平台，在里程碑工单中提供可配置、可生成、可采集、可统计的尺寸检验行业组件。组件兼顾平台灵活性和尺寸检验固定计算逻辑：运营端配置组件结构，贸易端维护组合、套装结构、检验规格并生成样本测量记录，采集端完成现场录入、保存和任务提交。  提交后的明细及统计结果可供贸易端、公式、报表和仪表盘使用。  ## 2. 核心术语  | 术语 | 定义 | | --- | --- | | 组合 | 由一个或两个业务维度形成的抽样分组，例如红色 / M；名称来自实际配置，不固定为颜色、尺码 | | 抽样基数 | 某组合的订单或业务数量；单件组合按件，套装组合按套 | | 样本形态 | 每个组合的抽样单位类型，取值为单件或套装 | | 套件 | 一套中可独立记录检验项目的对象，例如 Top、Bottom | | 记录对象 | 检验规格的归属，包括单件规格、按套记录或具体套件 | | 按套记录 | 每个抽样套只记录一次的检验项目集合，可为空 | | 检验项目 | 需要测量和判定的一项规格；允许同名，使用稳定 `part_id` 区分 | | 样本单位 | 组合中的一个抽样编号，对外显示 `#1`、`#2` | | 测量项次 | 一个样本单位、一个记录对象、一个检验项目形成的一条主测量记录 | | 补充测量 | 主测量之外的复核数据，默认不参与主统计 | | 任务草稿 | 采集端点击保存后写入、但尚未通过提交任务同步到服务器正式版本的数据 |  ## 3. 运营端配置  ### 3.1 尺寸检验组件  尺寸检验属于行业组件，可在运营端业务模板或资源库模板的表单设计器中添加。组件不可拖入子表或布局组件内部，一个表单允许添加多个实例。  组件内置组合明细、记录对象检验规格、样本测量记录及补充测量的数据结构和计算逻辑。运营端只配置结构和属性。  | 配置项 | 规则 | | --- | --- | | 组合明细标题 | 必填，默认组合明细 | | 维度一名称 | 必填，默认颜色；仅为示例，可改为任意业务名称 | | 维度二名称 | 必填，默认尺码；仅为示例，可改为任意业务名称 | | 检验规格标题 | 必填，默认检验规格 | | 检验项目列名 | 必填，默认项目名称 | | 上偏差、下偏差列名 | 必填 | | 样本测量记录标题 | 必填，默认样本测量记录 | | 计划样本量 | 可选择数字或公式数字类型组件；为空时不自动分配 | | 关联数据 | 可关联独立组合明细或其他尺寸检验组件的组合明细 | | 国际化 | 可配置组合明细、检验规格、项目名称、偏差列和测量记录标题 |  计划样本量和关联数据的可选来源需按组件所在表单层级过滤：主表单可选主表单和里程碑批复；里程碑批复可选所有里程碑批复表单和主表单；工单表单、工单批复表单可选同一里程碑所有表单、主表单和所有里程碑批复表单。当前组件已被其他组件作为关联数据时，隐藏关联设置并展示被关联状态。  ### 3.2 可用字段  尺寸检验组件需作为平台可用字段暴露，供公式、条件、报表和仪表盘按权限使用。  | 分组 | 字段或子表 | | --- | --- | | 组合明细 | 子表 | | 检验规格 | 子表，需包含记录对象字段 | | 样本测量记录 | 子表 | | 补充测量 | 子表 | | 项次统计 | 应检项次、已检项次、待检项次、合格项次、不合格项次、无法判定项次 | | 样本单位统计 | 待录入、录入中、已完成、整样合格、整样不合格 |  ### 3.3 独立组合明细组件  独立组合明细同属行业组件，只维护组合结构、抽样基数、样本形态、套件清单和样本量，不展示检验规格、生成样本记录、测量统计和补充测量。关联引用时，来源结构只读，本组件是否允许独立维护样本量取运营端配置。  ## 4. 贸易端 FlowSpace 应用  flowchart TD A[\"维护组合明细\"] --> B[\"维护套装设置\"] B --> C[\"填写检验规格与记录对象\"] C --> D[\"生成样本测量记录\"] D --> E[\"Web 录入或采集端录入\"] E --> F[\"计算项次统计和样本单位统计\"] E --> G[\"新增补充测量\"]  ### 4.1 组合明细  组合明细表格列名由运营端配置。  | 字段 | 规则 | | --- | --- | | 维度一 | 默认取运营端配置值，必填 | | 维度二 | 2D 时显示并必填；1D 时隐藏 | | 抽样基数 | 正整数，单件按件、套装按套 | | 样本形态 | 单选，单件或套装，默认单件 | | 基数占比 | 当前行抽样基数 / 全部行抽样基数，显示 1 位小数 | | 样本量 | 非负整数，可由计划样本量自动分配，也可手工修改 |  1D 切换为 2D 时显示维度二列；2D 切换为 1D 时固定保留维度一。1D、2D 均允许维度值相同的组合行重复存在。表格支持从 Excel 直接粘贴多行多列，超出当前行数时自动追加行。  样本量自动分配采用确定性整数算法，使自动分配总量尽可能等于有效计划样本量。计划值为空时不自动分配，各行样本量由用户填写。  ### 4.2 关联模式  组合明细关联其他组件时，来源、维度模式和名称、组合行、抽样基数、样本形态、套件设置均只读。当前尺寸组件可独立维护样本量和检验规格。进入可编辑状态时加载来源最新版本。  ### 4.3 套装设置  当至少一条组合的样本形态为套装时显示套装设置。  | 操作 | 规则 | | --- | --- | | 新增套件 | 套件名称必填且不能重复 | | 重命名 | 修改显示名称，不修改 `member_id`，已有规格和测量记录仍能关联 | | 删除套件 | 套件下没有配置检验规则时可删除；已有检验规格时需先复制或删除项目 | | 适用范围 | 同一组件内全部套装组合使用同一套件清单 |  ### 4.4 检验规格与记录对象  系统根据组合结构自动生成记录对象 Tab。  | 组合场景 | 记录对象 | | --- | --- | | 仅单件 | 单件规格 | | 存在套装 | 按套记录和每个具体套件 | | 单件与套装混合 | 单件规格、按套记录、具体套件 |  检验项目字段包括项目名称、下偏差、上偏差和动态规格值。项目名称必填，允许同名；下偏差、上偏差和标准值均非必填，填写时最多 1 位小数；下偏差需小于等于 0，上偏差需大于等于 0，标准值需大于等于 0。  动态规格列 2D 时按维度二生成，1D 时按维度一生成。检验规格支持表格粘贴、删除项目、选中项目批量复制到其他有效记录对象。  单件与套装混合时，记录对象按组合样本形态决定是否适用。例如 S 为单件、M/L 为套装时，单件规格只对 S 可编辑，按套记录和具体套件只对 M/L 可编辑。不可适用的规格单元格置灰禁用；当组合从适用变为不适用时，系统需清空该单元格已填值且不保留隐藏值；当组合从不适用变为适用时，单元格恢复可编辑，默认空白且允许继续保持空白。  ### 4.5 Excel 模板下载与导入  模板包含 `00_填写说明`、`01_组合配置`、`02_检验规格`。用户下载当前组件专属模板后填写，再上传 `.xlsx` 文件。  导入流程：  1. 前端校验扩展名、文件大小、加密、宏和模板标识。 2. 服务端校验 Sheet、表头、必填、数据类型、1 位小数、组合、套件、记录对象、稳定 ID 和动态规格完整性。 3. 一次性返回全部错误，每条包含 Sheet、行号、列名、原值、原因和修改建议。 4. 存在阻断错误时整份文件不落库；仅有警告时允许用户确认继续。 5. 已有数据时，导入后清空已有数据。  关联模式下载模板时，`01_组合配置` 中的来源结构作为只读参考并带出来源版本，不允许通过导入修改维度、组合、抽样基数、样本形态和套件清单，只允许导入当前组件可维护的样本量与检验规格。  `00_填写说明` 需说明填写顺序、术语、阻断规则和警告规则。阻断错误包括：上偏差填写后不满足大于等于 0 且最多 1 位小数、下偏差填写后不满足小于等于 0 且最多 1 位小数、适用规格值填写后不满足大于等于 0 且最多 1 位小数、在不适用规格列填写值、填写 `N/A` 或其他非数字文本。标准值、上偏差或下偏差为空不阻断导入，仅作为警告；警告需预估受影响测量记录数，并提示这些记录录入实测值后将显示为 `无法判定`。  ## 5. 样本测量记录  生成样本测量记录前需完成组合明细、套件和检验规格校验。阻止条件包括没有组合行、样本量合计为 0、维度值未填写、抽样基数或样本量非法、存在单件但无单件检验项目、存在套装但所有套装记录对象均无项目、偏差或标准值格式错误、在不适用规格列存在值、套件名称为空或重复等。上偏差、下偏差或标准值为空不阻断生成，仅提示参考数据不完整。  生成公式：  | 场景 | 记录数 | | --- | --- | | 单件组合 | 该组合样本量 × 单件规格项目数 | | 套装组合 | 该组合样本量 × 按套记录项目数和各具体套件项目数之和 |  生成确认弹窗需展示本次抽样单位总数、按组合的样本量和记录对象项目数、本次主测量记录总数。当参考数据不完整时，弹窗额外展示警告：`参考数据未完整：预计有{无法自动判定记录数}条测量记录无法自动判定。仍可生成和录入；录入后显示“无法判定”，不计入合格或不合格。`  确认生成后，新生成且未填写实测值的主测量记录保持 `待录入`，不得因参考数据缺失预先标记为 `无法判定`。生成成功提示 `已生成{测量记录数}条测量记录`。  生成后贸易端仍可逐条录入和修改测量值。样本测量记录包含样本号、组合、记录对象、检验项目、标准值、允许范围、实测值、偏差值和判定。标准值存在时，偏差值为 `实测值 - 标准值`；标准值为空时偏差值显示 `--`。支持按组合、记录对象、样本号、项目、录入状态筛选。  ## 6. 统计规则  ### 6.1 判定规则  | 指标 | 公式 | | --- | --- | | 合格下限 | 标准值 + 下偏差 | | 合格上限 | 标准值 + 上偏差 | | 偏差值 | 标准值存在时为实测值 - 标准值；标准值为空时显示 `--` |  判定取值包括 `待录入`、`合格`、`不合格`、`无法判定`。未填写实测值时为待录入，不得将空值按 0 判定。填写实测值且标准值、上偏差、下偏差均完整时，实测值在闭区间 `[合格下限, 合格上限]` 内为合格，否则为不合格；填写实测值但参考数据不完整时为无法判定。标准值或偏差更新后，对保留的实测值重新计算偏差和判定。  ### 6.2 测量项次统计  | 指标 | 计算口径 | | --- | --- | | 应检项次 | 当前有效主测量记录总数，不包含补充测量 | | 已检项次 | 已填写有效实测值的主测量记录数 | | 待检项次 | 应检项次 - 已检项次 | | 合格项次 | 已检记录中判定合格的数量 | | 不合格项次 | 已检记录中判定不合格的数量 | | 无法判定项次 | 已填写实测值但标准值、上偏差或下偏差不完整的主测量记录数 | | 项次完成率 | 已检项次 / 应检项次 | | 项次合格率 | 合格项次 / 已检项次；已检为 0 时显示 `--` |  关系校验：`应检项次 = 已检项次 + 待检项次`，`已检项次 = 合格项次 + 不合格项次 + 无法判定项次`。补充测量不进入主项次统计。  ### 6.3 样本单位统计  一个样本单位的应检范围为该组合全部适用记录对象的主测量项目。待录入表示一个应检主项目都未填写；录入中表示已填写至少一个但未填写全部；已完成表示全部应检主项目均已填写；整样合格表示已完成且全部主项目合格；整样不合格表示已完成且至少一个主项目不合格；无法判定抽样单位表示已完成、无不合格项次、且至少一个主项目无法判定。  样本单位统计关系：`完整录入 = 合格抽样单位 + 不合格抽样单位 + 无法判定抽样单位`。未完整录入的样本单位不计为整样合格或整样不合格。  配置更新如果影响已生成测量记录，需按是否能通过稳定 ID 安全匹配已有记录分成两类处理。  | 类型 | 适用场景 | 用户选择 | 数据处理 | | --- | --- | --- | --- | | 更新测量配置 | 新增组合、样本量增加、新增检验项目、修改名称、修改标准值或偏差值等，原记录仍可通过 `combo_id`、`part_id` 等稳定 ID 匹配 | 默认保留实测值并更新；也可清空实测值并重新生成 | 保留可匹配记录的实测值，补充新增记录，按最新标准重新计算偏差、判定和统计 | | 需要重新生成测量记录 | 删除或改变原记录结构，无法安全匹配已有记录，例如删除组合、减少样本量、删除检验项目、将项目转移到其他记录对象 | 不展示保留选项，必须清空并重新生成 | 清空主测量记录和补充测量，按最新配置重新生成，重置筛选并重新计算统计 |  清空重生成确认文案为：`继续后将清空当前{已录入数}项实测值和{补测数量}条补充测量，并根据最新配置重新生成{重新生成记录数}条主测量记录。此操作不可撤销。` 当无补充测量时隐藏补测数量。  ## 7. 补充测量  补充测量从具体主测量记录发起，用于复核或异常分析，默认不参与主统计。主测量未录入时不允许补测，提示先录入主测量值。补充测量仅作为报告和异常分析参考，不影响应检、已检、待检、合格、不合格、无法判定、完成率或主合格率。  新增补充测量弹窗固定带入组合、记录对象、来源样本号、检验项目、标准值和允许范围。用户填写补测原因、补测数量、补测值和备注；每个补测值生成一条独立补测记录。  补充测量规则：  | 场景 | 处理 | | --- | --- | | 新增、编辑或删除补测 | 不改变应检、已检、待检、合格、不合格、完成率及主合格率 | | 修改标准值或偏差值并保留实测值 | 保留补测值，按最新标准重新计算偏差和参考结果 | | 清空并重新生成测量记录 | 主测量记录与补测记录一并清空 | | 来源主测量值被修改 | 补测记录继续保留，来源样本号不变 | | 来源主测量记录被删除 | 对应补测记录随重新生成一并清空 |  补充测量列表中的偏差值为 `补测值 - 标准值`；标准值为空时显示 `--`。参考结果在参考数据完整时显示范围内或超出范围，在标准值、上偏差或下偏差不完整时显示 `无法判定`。  ## 8. 采集端应用  尺寸检验组件在采集端任务详情页中作为独立组件展示。组件标题、维度名称、记录对象名称等内容读取运营端及贸易端配置，不固定使用颜色、尺码、部位等行业文案。  任务详情展示组件标题、保存状态、整体预览入口、项次统计、测量进度、筛选 Tab 和组合卡片。同一任务存在多个尺寸检验组件时，每个组件独立显示保存状态。项次统计和组合卡片需展示 `无法判定项次`；完整录入口径只判断应检主项目是否已录入，不因参考数据缺失而降级为未完成。  组合卡片按组合明细行聚合。套装中的按套记录和具体套件属于同一张组合卡片，不拆成多张卡片。组合状态分为待录入、录入中、已完成和暂无项目；绿色进度条只表示录入完成，不表示全部合格。  测量录入页包含返回、标题、组合信息、保存状态、记录对象 Tab、工具区、测量矩阵、补充测量和底部操作。保存后写入任务待提交草稿，不立即同步服务端；只有任务详情页提交任务后才同步贸易端。  整体预览需汇总展示应检、待检、合格、不合格、无法判定和待检项次，筛选项包括全部、不合格、无法判定、未完成。测量录入页的即时判定取值为范围内、超出范围、无法判定、未录入：实测值为空时为未录入；实测值已填但参考数据不完整时为无法判定；实测值已填且参考数据完整时，根据是否落在允许范围内显示范围内或超出范围。  返回录入页时需统一执行未保存检查：无未保存修改直接返回，有未保存修改则弹出 `保存本次修改？`，用户可选择保存后返回、不保存并返回或继续录入。  ## 9. 待确认问题  - 采集端和贸易端同时编辑同一尺寸检验组件时，冲突检测、覆盖和提示策略需结合离线能力进一步明确。 - 尺寸检验组件字段进入公式、条件、报表和仪表盘时，字段级权限、子表展开方式和统计口径需要形成矩阵。 - 补充测量是否需要在报告导出、仪表盘和异常筛选中作为可选数据源，需要后续确认。", "domain": "公共能力", "module": "模板表单与数据", "tags": "验货;尺寸检验;组合明细;行业组件", "sources": [{"title": "【运营端】【表单设计】尺寸检验组件流程梳理", "version": "v2.8", "product_side": "运营端", "module": "表单设计", "last_write_time": "2026-09-04T10:47:54"}, {"title": "【运营端】【业务模板】表单设计组件", "version": "v2.1.x", "product_side": "运营端", "module": "业务模板", "last_write_time": "2026-09-04T10:48:42"}]}, {"path": "docs/20-业务对象与数据模型/FlowSpace.md", "title": "FlowSpace", "folder": "docs/20-业务对象与数据模型", "text": " # FlowSpace  > 命名说明：FlowSpace（流空间）是 SCCS 的新名称。为了让英文名更容易被直接理解，知识库正文统一使用 FlowSpace；历史来源文档中的 SCCS 仅作为原始文件名和追溯标识保留。  ## 1. 功能定位  FlowSpace 是 Linkincrease 贸易端的核心业务空间，用于承载某类供应链协作业务。FlowSpace 通常由运营端业务模板创建，运行态包含订单、里程碑、工单、批复、成员、角色、协作团队、数据围栏、标签、自动化、仪表盘、报告和资源库关联。  ## 2. 使用对象与入口  | 使用对象 | 入口 | 说明 | | --- | --- | --- | | 团队成员 | 工作台 FlowSpace 列表 | 查看、进入、创建或管理本团队 FlowSpace | | 团队管理员 | FlowSpace 设置 | 管理基本信息、角色、成员、协作团队、数据围栏 | | 协作团队成员 | 协作 FlowSpace | 在被授权范围内参与订单、工单和批复 | | 运营人员 | 运营端 FlowSpace 管理 | 查看平台团队的 FlowSpace 数据、自动化记录、仪表盘、报告等 |  ## 3. 核心对象  | 对象 | 说明 | | --- | --- | | FlowSpace 基本信息 | 名称、图标、来源模板、描述等基础信息 | | FlowSpace 成员 | 被加入当前 FlowSpace 的团队成员 | | FlowSpace 业务角色 | 主团队成员在 FlowSpace 内的业务权限集合 | | 协作团队 | 被主团队邀请参与当前 FlowSpace 的外部团队 | | 协作 FlowSpace 角色 | 协作团队在 FlowSpace 内的权限集合 | | 数据围栏 | 控制成员可见订单、里程碑、工单、字段、标签等数据范围 | | 里程碑计划 | FlowSpace 内订单流程节点的默认计划配置 | | 标签设置 | 根据条件展示在订单或里程碑中的业务标签 | | 更多设置 | 订单标识、订单取消原因等 FlowSpace 级业务设置 |  ## 4. 业务流程  flowchart TD A[\"运营端发布业务模板\"] --> B[\"贸易端选择模板创建 FlowSpace\"] B --> C[\"设置 FlowSpace 基本信息\"] C --> D[\"配置业务角色、成员、协作团队\"] D --> E[\"配置数据围栏、里程碑计划、标签、更多设置\"] E --> F[\"创建订单并进入业务执行\"] F --> G[\"自动化、仪表盘、报告、资源库关联持续生效\"]  ## 5. 权限规则  FlowSpace 权限由团队权限、FlowSpace 业务角色、协作 FlowSpace 角色、数据围栏共同决定。  | 权限域 | 作用 | | --- | --- | | 团队权限 | 决定是否可创建 FlowSpace、进入团队设置、管理团队级资源 | | FlowSpace 业务角色 | 决定主团队成员可操作哪些订单、里程碑、工单、仪表盘等 | | 协作 FlowSpace 角色 | 决定协作团队成员可查看和处理哪些业务数据 | | 数据围栏 | 决定用户可见的数据范围和字段范围 |  判断入口是否展示时，前端可结合权限、对象状态和成员关系；提交时必须服务端再次校验。  ## 6. 状态与限制  当前资料重点描述 FlowSpace 运行态设置，尚未形成完整 FlowSpace 生命周期状态机。已确认限制：  - 创建 FlowSpace 依赖运营端已发布且对当前团队可见的业务模板。 - FlowSpace 内角色、成员、协作团队变更会影响后续订单、里程碑、工单可见性和可操作性。 - 数据围栏变更会影响字段、标签、订单、里程碑、工单等展示范围。 - 订单标识、取消原因等更多设置会影响订单列表、订单详情和状态操作展示。  ## 7. 字段、表单与校验  FlowSpace 继承业务模板中的主表单、里程碑、工单表单、批复表单等结构。运行态可调整的配置包括：  - 业务角色和协作方角色。 - 数据围栏。 - FlowSpace 成员和协作团队。 - 里程碑计划。 - 标签设置。 - 订单标识。 - 订单取消原因。  ## 8. 通知、日志与审计  FlowSpace 设置类操作需要进入操作日志。涉及成员、协作团队、权限变化时，后续应补充消息通知规则。  已知日志范围：  - FlowSpace 设置操作日志。 - 协作 FlowSpace 设置操作日志。 - 自动化执行日志。 - 系统自动执行日志中与 FlowSpace 相关的自动化、公式、资源库同步动作。  ## 9. 异常与提示  需要从原始需求继续抽取的提示包括：  - 无权限操作。 - 成员或协作团队被移除后的业务处理限制。 - 数据围栏变化后的可见性变化。 - 模板或字段变更对运行态 FlowSpace 的影响。  ## 10. 来源需求  - `source:thoughts-v2-current/v2.1.x/贸易端/【贸易端】【SCCS设置】.md` - `source:thoughts-v2-current/v2.1.x/贸易端/【贸易端】【协作SCCS设置】.md` - `source:thoughts-v2-current/v2.0.x/贸易端/【贸易端】【工作台】工作台、创建SCCS、SCCS分组.md` - `source:thoughts-v2-current/V2.5.x/贸易端/【贸易端】【仪表盘】权限管理.md` - `source:thoughts-v2-current/V2.5.x/贸易端/【贸易端】报告权限.md` - `source:thoughts-v2-current/v2.0.x/运营端/【运营端】【模板中心】业务模版管理.md`  ## 11. 待确认问题  - FlowSpace 与 FlowSpace 是否完全同义，还是存在历史命名与产品边界差异。 - FlowSpace 删除、停用、归档等生命周期状态是否已有完整规则。 - 模板同步至已创建 FlowSpace 时的冲突处理和历史数据影响。", "domain": "公共能力", "module": "业务对象与数据模型", "tags": "10-功能模块详情;FlowSpace", "sources": []}, {"path": "docs/20-业务对象与数据模型/FlowSpace数据层级.md", "title": "FlowSpace数据层级", "folder": "docs/20-业务对象与数据模型", "text": " # FlowSpace 数据层级  ## 1. 页面定位  本页用于说明 FlowSpace 从“运营端业务模板配置态”到“贸易端业务运行态”的数据层级关系，并明确订单、里程碑、工单、批复、子表、资源库引用、自动化、仪表盘和日志追溯之间的数据边界。  当前知识库已在业务模板、FlowSpace、订单、工单与批复、资源库等页面分别描述相关对象。本页将这些对象统一成权威数据层级，用于后续判断新增功能影响范围、字段归属、数据写入位置、资源库同步边界、仪表盘数据源、自动化更新和日志追溯。  > 重要：任何涉及 FlowSpace 数据新增、字段写入、批量导入、资源库引用、自动化更新、统计分析、权限控制或审计追溯的需求，都必须先判断目标数据处于本页定义的哪一层级。  ## 2. 总体层级  FlowSpace 数据可以分为两层：  | 层级 | 说明 | 典型对象 | | --- | --- | --- | | 配置态 | 运营端业务模板定义业务结构，决定未来 FlowSpace 中能创建什么数据、有哪些表单、字段和批复规则 | 业务模板、主表单、里程碑、工单表单、工单批复表单、里程碑批复表单、表单组件 | | 运行态 | 贸易端团队基于已发布模板创建 FlowSpace 后，围绕订单执行产生真实业务数据 | FlowSpace、订单、订单主表单数据、里程碑、工单、工单采集数据、工单批复数据、里程碑批复数据、动态、历史、跟踪记录 |  flowchart TD A[\"运营端业务模板\"] --> B[\"主表单：订单基本信息结构\"] A --> C[\"里程碑结构\"] C --> D[\"里程碑下的工单表单结构\"] D --> E[\"工单采集字段与子表\"] D --> F[\"工单批复表单：可选\"] C --> G[\"里程碑批复表单：可选\"] A --> H[\"发布模板\"] H --> I[\"贸易端基于模板创建 FlowSpace\"] I --> J[\"FlowSpace 内创建订单\"] J --> K[\"填写订单主表单数据\"] J --> L[\"按里程碑创建工单\"] L --> M[\"填写工单采集数据\"] M --> N[\"工单批复数据：可选\"] L --> O[\"里程碑批复数据：当前里程碑唯一，可选\"]  ## 3. 业务模板配置态  业务模板是 FlowSpace 的结构来源。模板创建和设计过程决定运行态的数据容器。  | 配置对象 | 规则 | | --- | --- | | 业务模板 | 可创建 FlowSpace 的模板，发布且对团队可见后，贸易端才能使用 | | 主表单 | 默认存在且有且仅有一个，用于定义订单基本信息 | | 里程碑 | 一个模板可配置多个里程碑，用于定义订单流程阶段 | | 工单表单 | 挂载在里程碑下；一个里程碑下可包含多个表单，用于定义工单采集数据 | | 工单批复表单 | 开启工单批复后存在，是独立批复表单 | | 里程碑批复表单 | 开启里程碑批复后存在，是独立批复表单 | | 表单组件 | 构成字段、布局、子表、引用、公式和成员/协作方选择能力 |  ### 3.1 模板设计流程  flowchart LR A[\"创建业务模板\"] --> B[\"添加主表单\"] B --> C[\"创建若干里程碑\"] C --> D[\"里程碑下挂载工单表单\"] D --> E[\"拖拽组件并设计字段\"] E --> F{\"是否开启工单批复\"} F -->|是| G[\"设计工单批复表单\"] F -->|否| H[\"跳过工单批复表单\"] G --> I{\"是否开启里程碑批复\"} H --> I I -->|是| J[\"设计里程碑批复表单\"] I -->|否| K[\"跳过里程碑批复表单\"] J --> L[\"发布模板\"] K --> L  ### 3.2 组件与字段类型  | 组件类型 | 组件 | | --- | --- | | 布局组件 | 模块分组、分割线、标签页、子表 | | 基础组件 | 单行文本、多行文本、数字、百分比、单选、多选、日期时间、图片、附件、定位、地址、富文本、评级、空白占位 | | 高级组件 | 关联引用、公式组件、FlowSpace 成员单选、FlowSpace 成员多选、FlowSpace 协作单选、FlowSpace 协作多选、签名、汇率 |  子表是数据层级中的特殊容器：一个主表单、工单表单、工单批复表单或里程碑批复表单可以包含子表组件；子表内部有自己的列字段和多行数据。  > 重要：设计字段映射、批量导入、自动化更新、仪表盘数据源、报告数据源或历史记录时，必须区分“表单字段”和“子表行字段”。子表字段不能简单等同于父表单字段。  ## 4. FlowSpace 运行态  团队使用业务模板创建 FlowSpace 后，模板结构被应用为运行态业务结构。  | 运行态对象 | 来源 | 数据含义 | | --- | --- | --- | | FlowSpace | 已发布业务模板 | 某类业务协作空间 | | 订单 | FlowSpace 内创建 | 业务主实体 | | 订单主表单数据 | 业务模板主表单 | 订单基本信息 | | 里程碑 | 业务模板里程碑配置 | 订单流程阶段 | | 工单 | 订单某个里程碑下创建 | 一次具体执行任务 | | 工单采集数据 | 当前里程碑下的工单表单 | 处理人填写的执行数据 | | 工单批复数据 | 工单批复表单 | 对单个工单采集结果的审核或确认 | | 里程碑批复数据 | 里程碑批复表单 | 对当前里程碑阶段结果的审核或确认 |  ### 4.1 订单与主表单  FlowSpace 内新建订单时，用户填写主表单内容，形成订单基本信息。主表单字段受以下规则影响：  - 字段类型、必填、格式和默认值。 - 订单标识设置。 - 数据围栏的字段可见范围。 - 资源库引用字段。 - 公式字段自动更新。 - 自动化或后续同步对字段的更新限制。  ### 4.2 里程碑与工单  订单创建后，会按照模板中的里程碑结构进入业务执行。用户可在不同里程碑下按需创建工单。  | 关系 | 说明 | | --- | --- | | 一个订单 | 包含多个里程碑 | | 一个里程碑 | 可创建多个工单 | | 一个工单 | 对应一次工单采集数据 | | 一个工单 | 若模板开启工单批复，则对应一个工单批复 | | 一个里程碑 | 若模板开启里程碑批复，则当前里程碑仅有一个里程碑批复 |  创建工单时，如果模板开启工单批复，需要设置工单批复处理人。若模板开启里程碑批复，通常在创建当前里程碑下第一个工单时设置里程碑批复处理人；当前里程碑下仅存在一份里程碑批复数据。  ## 5. 数据基数与身份  设计任何数据写入、同步、导入导出、统计分析或审计能力时，必须明确每类数据的身份粒度。  | 数据对象 | 基数 | 建议身份粒度 | | --- | --- | --- | | FlowSpace | 团队内多个 | FlowSpace ID | | 订单 | FlowSpace 内多个 | 订单 ID | | 订单主表单字段 | 每个订单一组 | 订单 ID + 字段 ID | | 订单主表单子表行 | 每个订单可多行 | 订单 ID + 子表 ID + 行 ID | | 里程碑 | 每个订单多个 | 订单 ID + 里程碑 ID | | 里程碑批复 | 每个里程碑最多一份 | 订单 ID + 里程碑 ID + 批复 ID | | 里程碑批复子表行 | 每份批复可多行 | 批复 ID + 子表 ID + 行 ID | | 工单 | 每个里程碑多个 | 工单 ID | | 工单采集字段 | 每个工单一组或多表单 | 工单 ID + 表单 ID + 字段 ID | | 工单子表行 | 每个工单可多行 | 工单 ID + 子表 ID + 行 ID | | 工单批复 | 每个工单最多一份 | 工单 ID + 批复 ID | | 工单批复子表行 | 每份批复可多行 | 批复 ID + 子表 ID + 行 ID |  ## 6. 资源库数据层级  资源库是团队级标准化数据池，与 FlowSpace 运行态数据不同。  | 层级 | 对象 | 说明 | | --- | --- | --- | | 资源库配置态 | 资源库模板 | 运营端定义资源库表结构和字段 | | 团队主数据态 | 资源库 | 贸易端团队基于资源库模板创建 | | 表结构 | 资源库表 | 一个资源库可包含多张表 | | 记录数据 | 资源库数据 | 表中的单条记录 | | 应用关系 | FlowSpace 应用资源库 | FlowSpace 允许引用哪些资源库表和字段 | | 业务快照 | 订单/工单/批复字段引用结果 | 引用后在业务数据中展示、保存或同步 |  flowchart TD A[\"运营端资源库模板\"] --> B[\"贸易端创建资源库\"] B --> C[\"资源库表\"] C --> D[\"资源库数据\"] D --> E[\"FlowSpace 应用资源库\"] E --> F[\"订单 / 工单 / 批复字段引用\"] D --> G{\"资源库数据变更\"} G --> H[\"按策略同步到已引用字段\"] G --> I[\"历史业务数据保留文本或快照\"]  资源库引用、自动化、公式和人工编辑都可能写入订单、工单、批复或子表字段。后续设计新增功能时，应明确字段来源类型：  | 字段来源 | 说明 | 对新增功能的影响 | | --- | --- | --- | | 手动录入 | 用户直接填写 | 可被人工修改冲突规则保护 | | 资源库引用但不同步 | 引用后保存文本或快照 | 可作为普通业务数据使用，但需提示来源 | | 资源库同步中 | 资源库变化会持续写入字段 | 不应被其他自动写入机制随意覆盖 | | 禁止手动修改 | 字段只能通过资源库或系统机制更新 | 不应被人工、导入或自动化绕过写入 | | 自动化写入 | 自动化更新数据字段 | 需与自动化执行日志和字段冲突规则关联 | | 公式计算 | 由公式组件根据因子自动计算 | 不应被普通编辑直接覆盖 | | 系统同步写入 | 由系统同步、批量操作或后续数据类能力写入 | 必须记录来源、目标、操作人或系统程序、写入时间和日志 | | FlowSpace 互通 | 来源 FlowSpace 数据通过互通方案写入目标 FlowSpace 字段或子表 | 必须记录方案版本、来源数据、目标数据、关联键、字段策略和后续更新结果 |  ## 7. 数据层级对产品能力的影响  FlowSpace 数据层级是多个产品能力的前置判断依据。新增能力不能只说“更新字段”或“同步数据”，必须明确写入的是哪一类对象、哪一层表单、哪一个字段或哪一行子表。  ### 7.1 常见产品能力与数据层级  | 能力 | 必须识别的数据层级 | | --- | --- | | 新建订单 | 订单主表单、订单主表单子表、订单标识字段、资源库引用字段 | | 创建工单 | 目标订单、目标里程碑、工单表单、工单处理人、工单批复处理人、里程碑批复处理人 | | 工单采集 | 工单表单字段、工单子表行、处理人、采集状态、动态和历史 | | 工单批复 | 工单批复表单、工单批复子表、批复人、批复状态、动态和历史 | | 里程碑批复 | 里程碑批复表单、里程碑批复子表、里程碑状态、批复人 | | 资源库引用 | 资源库、资源库表、资源库数据、FlowSpace 应用资源库、目标业务字段 | | 资源库同步 | 已引用字段、同步策略、历史快照、系统执行日志 | | FlowSpace 数据互通 | 来源 FlowSpace、目标 FlowSpace、互通方案版本、字段映射、子表关联键、来源变化响应方式 | | 自动化 | 触发数据源、目标数据源、执行动作、字段可写性、执行日志 | | 导入导出 | 导入模板字段、目标表单字段、子表行、失败原因、导入记录 | | 仪表盘和报告 | 数据源类型、字段范围、子表展开方式、权限和数据围栏 | | 日志审计 | 操作对象、字段层级、变更前后值、操作人或系统程序 |  ### 7.2 数据写入位置  | 写入位置 | 说明 | 关键限制 | | --- | --- | | 订单主表单字段 | 订单级主数据 | 受订单状态、订单权限、数据围栏、资源库引用、公式字段影响 | | 订单主表单子表行 | 订单级明细数据 | 需区分新增行、更新行、删除行和行级历史 | | 工单表单字段 | 一次工单采集数据 | 受工单状态、采集人、表单权限和里程碑状态影响 | | 工单子表行 | 工单采集明细 | 需记录行级变化和来源 | | 工单批复字段 | 单个工单审核结论 | 受工单批复状态、批复人和批复表单配置影响 | | 工单批复子表行 | 工单审核明细 | 需记录行级历史和批复状态 | | 里程碑批复字段 | 当前里程碑阶段结论 | 每个里程碑最多一份，需要结合里程碑状态 | | 里程碑批复子表行 | 阶段结论明细 | 需记录行级历史和里程碑批复状态 |  ### 7.3 FlowSpace 数据互通写入边界  FlowSpace 数据互通同时涉及来源读取、目标写入和关联关系维护。新增或复核互通能力时，必须先明确来源数据和目标数据分别位于哪一层级，再判断字段映射、子表行写入、权限、数据围栏和日志。  | 场景 | 数据层级要求 | | --- | --- | | 仅关联 | 建立来源数据与目标数据关系，不写入目标字段；仍需记录来源、目标、方案版本和关系快照 | | 关联并写入普通字段 | 目标字段必须是目标模块可写字段，不能是公式字段、系统字段或不允许被互通写入的字段 | | 关联并写入子表 | 必须记录目标子表、目标行、来源行和关联键，不得只记录父对象 ID | | 来源变化后更新 | 按执行版本和字段级策略判断是否更新，目标状态、字段锁定、资源库持续同步、公式和权限不允许时跳过并记录原因 | | 多来源聚合 | 多条来源数据写入一个目标字段时，必须按目标字段类型选择聚合规则 | | 来源失效 | 来源数据删除、归档或不可引用时保留关系快照，目标是否更新或失效标记按方案和异常规则处理 |  > 重要：写入工单、工单批复、里程碑批复时，不得绕过处理人、状态和权限校验；写入子表时，不得只记录父对象 ID，还应记录子表 ID 和行 ID。  ## 8. 设计新增功能时的必查清单  凡是新增功能涉及 FlowSpace 数据、字段映射、数据同步、资源库引用、自动化、仪表盘、导入导出或日志追溯，都应检查：  1. 目标字段属于订单主表单、工单表单、工单批复、里程碑批复还是子表行。 2. 目标对象当前状态是否允许写入。 3. 当前用户是否具备来源查看权限和目标写入权限。 4. 数据围栏是否隐藏了来源字段或目标字段。 5. 字段是否来自资源库引用、资源库同步、公式、自动化、系统同步或人工录入。 6. 子表行是否需要记录行级来源、目标关系和关联键。 7. 写入后是否需要历史记录、动态、跟踪记录、系统执行日志或同步日志。 8. 模板字段被删除、类型变化、必填变化时，历史数据如何保留。 9. 是否可能形成多源覆盖、重复写入或系统自动更新冲突。 10. 是否需要异常中心、同步日志、历史记录、动态或人工确认流程。  ## 9. 待确认问题  | 问题 | 影响 | | --- | --- | | 创建第一个工单时设置里程碑批复处理人的完整规则是否已覆盖所有场景 | 影响里程碑批复生成和指派 | | 工单批复后是否允许字段被资源库同步、自动化或其他系统同步继续更新 | 影响字段锁定和冲突处理 | | 资源库同步、自动化、公式和系统同步同时作用于同一字段时的最终优先级 | 影响数据一致性和日志解释 | | 模板同步至已创建 FlowSpace 后，字段新增、删除、类型变化如何处理 | 影响历史数据、表单展示和自动化配置 | | 子表行删除、来源数据删除时，目标子表行是否删除、失效标记还是保留快照 | 影响追溯和历史展示 | | FlowSpace 互通、资源库同步、自动化同时写入同一字段时的优先级是否配置化 | 影响多系统写入一致性 |  ## 10. 来源需求  - `source:thoughts-v2-current/v2.0.x/运营端/【运营端】【模板中心】业务模版管理.md` - `source:thoughts-v2-current/v2.1.x/运营端/【运营端】【业务模板】表单设计组件.md` - `source:thoughts-v2-current/v2.1.x/运营端/【运营端】【业务模版】表单属性与显隐设置.md` - `source:thoughts-v2-current/v2.2.x/贸易端/【贸易端】【订单详情】查看&操作.md` - `source:thoughts-v2-current/v2.2.x/贸易端/【贸易端】【订单详情】工单&里程碑批复操作.md` - `source:thoughts-v2-current/V2.4.x/贸易端/【贸易端】【资源库】第一阶段.md` - `source:thoughts-v2-current/v2.9/贸易端/【贸易端】FlowSpace 数据互通.md`", "domain": "公共能力", "module": "业务对象与数据模型", "tags": "FlowSpace;数据层级;业务模板;订单;工单;批复;资源库;数据管理", "sources": [{"title": "【运营端】【模板中心】业务模版管理", "version": "v2.0.x", "product_side": "运营端", "module": "模板中心", "last_write_time": "2026-09-04T10:48:49"}, {"title": "【运营端】【业务模板】表单设计组件", "version": "v2.1.x", "product_side": "运营端", "module": "业务模板", "last_write_time": "2026-09-04T10:48:42"}, {"title": "【贸易端】【订单详情】查看&操作", "version": "v2.2.x", "product_side": "贸易端", "module": "订单详情", "last_write_time": "2026-09-04T10:48:34"}, {"title": "【贸易端】【订单详情】工单&里程碑批复操作", "version": "v2.2.x", "product_side": "贸易端", "module": "订单详情", "last_write_time": "2026-09-04T10:48:34"}, {"title": "【贸易端】【资源库】第一阶段", "version": "V2.4.x", "product_side": "贸易端", "module": "资源库", "last_write_time": "2026-09-04T10:48:14"}, {"title": "【贸易端】FlowSpace 数据互通", "version": "v2.9", "product_side": "贸易端", "module": "贸易端", "last_write_time": "2026-09-04T10:47:46"}]}, {"path": "docs/20-业务对象与数据模型/README.md", "title": "20 业务对象与数据模型", "folder": "docs/20-业务对象与数据模型", "text": "# 20 业务对象与数据模型  本目录是 Linkincrease 业务对象、数据层级、模板实例关系、字段组件和资源引用的权威规则层。  ## 页面  - [FlowSpace](./FlowSpace.md) - [FlowSpace 数据层级](./FlowSpace数据层级.md) - [业务模板](./业务模板.md) - [模板与实例关系](./模板与实例关系.md) - [订单](./订单.md) - [订单数据模型](./订单数据模型.md) - [里程碑](./里程碑.md) - [工单与批复](./工单与批复.md) - [工单数据模型](./工单数据模型.md) - [资源库](./资源库.md) - [资源库模板](./资源库模板.md) - [资源库数据模型](./资源库数据模型.md) - [团队与协作团队](./团队与协作团队.md) - [表单设计组件](./表单设计组件.md) - [表单属性与显隐设置](./表单属性与显隐设置.md) - [通用条件规则](./通用条件规则.md) - [公式函数](./公式函数.md) - [字段、组件、子表、引用关系](./字段、组件、子表、引用关系.md)", "domain": "公共能力", "module": "业务对象与数据模型", "tags": "20-业务对象与数据模型;20 业务对象与数据模型", "sources": []}, {"path": "docs/20-业务对象与数据模型/业务模板.md", "title": "业务模板", "folder": "docs/20-业务对象与数据模型", "text": " # 业务模板  ## 1. 功能定位  业务模板是运营端配置的 FlowSpace 创建模板，用于定义订单主表单、里程碑、工单采集表单、工单批复表单、里程碑批复表单、订单标识、PDF 导入、预览数据、第三方数据对接等配置。  ## 2. 使用对象与入口  | 使用对象 | 入口 | 说明 | | --- | --- | --- | | 运营人员 | 运营端 > 模板中心 > 业务模板 | 创建、编辑、设计、发布、复制和同步业务模板 | | 贸易端团队 | 贸易端模板中心 | 基于可见且已发布的业务模板创建 FlowSpace | | 实施人员 | 模板设计与预览数据 | 模拟业务流程和检查模板配置 |  ## 3. 核心对象  | 对象 | 说明 | | --- | --- | | 模板基础信息 | 名称、图标、创建类型、所属行业、描述、备注等 | | 主表单 | 订单级主数据表单，模板默认携带 | | 里程碑 | 订单流程节点 | | 里程碑批复表单 | 需要里程碑批复时存在 | | 工单采集表单 | 里程碑下的执行数据表单 | | 工单批复表单 | 需要工单批复时存在 | | 订单标识设置 | 贸易端订单展示标识默认配置 | | 预览数据 | 用于模板中心模拟模板使用效果 | | PDF 导入设置 | 定制场景下的 PDF 字段映射 | | 发布态模板 | 贸易端可见和可创建 FlowSpace 的模板版本 |  ## 4. 业务流程  flowchart TD A[\"添加业务模板\"] --> B[\"配置基础信息\"] B --> C[\"设计主表单、里程碑、表单和批复\"] C --> D[\"配置订单标识、PDF导入、第三方配置\"] D --> E[\"录入预览数据\"] E --> F[\"发布模板\"] F --> G[\"贸易端模板中心可见\"] G --> H[\"团队创建 FlowSpace\"] C --> I[\"复制模板\"] C --> J[\"同步至已创建 FlowSpace 的未发布模板\"]  ## 5. 权限规则  当前需求主要描述运营端模板管理能力，完整运营端角色权限尚未沉淀。已确认：  - 只有运营端有模板中心权限的人员可管理业务模板。 - 模板可见范围控制贸易端哪些团队可见。 - 模板启用不等于贸易端可见，需启用且已发布。  ## 6. 状态与限制  | 状态 | 说明 | 限制 | | --- | --- | --- | | 未发布 | 创建后尚未发布 | 即使启用，贸易端仍不可见 | | 已发布 | 已形成可用版本 | 贸易端可在模板中心使用 | | 已编辑 | 当前编辑内容与已发布内容不一致 | 需要提示发布 | | 只读模式 | 默认进入设计时不可编辑 | 需开启编辑开关才能修改 | | 启用/未启用 | 模板启用状态 | 影响贸易端是否可见，但需结合发布状态 |  ## 7. 字段、表单与校验  基础信息：  - 模板名称必填，限制 100 字符。 - 模板图标必填。 - 创建类型必填。 - 所属行业必填。 - 模板描述、备注限制 200 字符。  设计规则：  - 创建模板后默认带主表单。 - 里程碑名称必填，限制 100 字符。 - 表单名称必填，限制 100 字符。 - 里程碑可设置是否需要批复。 - 需要批复后才可设计对应批复表单。 - 可设置默认工单批复人和默认里程碑批复人。 - 可设置部分文案国际化。  ## 8. 通知、日志与审计  需要记录：  - 模板新增、编辑、删除。 - 可见范围设置。 - 表单设计变更。 - 发布记录。 - 复制记录。 - 同步至 FlowSpace 记录。  ## 9. 异常与提示  已知提示：  - 选择部分可见团队时，至少选择一个团队。 - 模板未发布时，即使启用，贸易端不可见。 - 同步至 FlowSpace 需谨慎处理已有业务数据。  ## 10. 来源需求  - `source:thoughts-v2-current/v2.0.x/运营端/【运营端】【模板中心】业务模版管理.md` - `source:thoughts-v2-current/v2.1.x/运营端/【运营端】【业务模板】表单设计组件.md` - `source:thoughts-v2-current/v2.1.x/运营端/【运营端】【业务模版】表单属性与显隐设置.md` - `source:thoughts-v2-current/v2.3.x/运营端/【运营端】【模板设计】里程碑增加第三方数据对接.md`  ## 11. 待确认问题  - 运营端模板管理权限模型。 - 模板同步至 FlowSpace 时的字段删除、字段新增和业务数据保留完整规则。 - 定制模板、用户自建模板后续是否纳入当前知识库。", "domain": "公共能力", "module": "业务对象与数据模型", "tags": "10-功能模块详情;业务模板", "sources": []}, {"path": "docs/20-业务对象与数据模型/公式函数.md", "title": "公式函数", "folder": "docs/20-业务对象与数据模型", "text": " # 公式函数  ## 1. 功能定位  公式函数用于表单字段的自动计算，可服务于订单、工单、批复、资源库、验货组件和统计分析。公式组件可输出数字、百分比、文本或日期等类型，并在相关因子变化后自动更新。  ## 2. 基础规则  | 规则 | 说明 | | --- | --- | | 空值定义 | `null`、`undefined`、空字符串统一视为空值 | | 布尔值 | 条件判断目前仅支持小写 `true`、`false` | | 变量来源 | 通常来自当前表单或允许引用的数据源字段 | | 子表计算 | 支持对子表数组字段进行求和、计数、条件统计和去重 |  ## 3. 函数分类  | 分类 | 函数 | | --- | --- | | 文本函数 | CONCATENATE、TEXTJOIN、LEFT、RIGHT、SEARCH | | 数学函数 | SUM、AVERAGE、MAX、MIN、CEILING、FLOOR、INT、SUMIF、SUMIFS、COUNTIF、COUNTIFS、COUNTA、UNIQUE | | 逻辑函数 | IF、IFS、AND、OR | | 时间函数 | DAYS、WORKDAY、DATEDIF、NETWORKDAYS、YEAR、MONTH、DAY、HOUR、TODAY、NOW、MINUTE、SECOND |  ## 4. 常用函数规则  | 函数 | 用途 | 空值处理 | | --- | --- | --- | | CONCATENATE | 合并多个文本 | 空值视为空字符串 | | TEXTJOIN | 按分隔符合并文本 | 可设置是否忽略空值 | | SUM | 求和 | 忽略空值 | | AVERAGE | 平均值 | 忽略空值 | | MAX/MIN | 最大/最小值 | 忽略空值 | | SUMIF/SUMIFS | 按一个或多个条件求和 | 条件区域空值忽略，求和区域空值按 0 | | COUNTIF/COUNTIFS | 条件计数 | 可专门计算空值 | | IF/IFS | 条件判断 | 条件空值按 false | | AND/OR | 逻辑判断 | 空值按 false | | DAYS/DATEDIF | 日期差 | 日期参数为空时返回错误 | | TODAY | 返回当天日期 | 用于自动更新“今天” |  ## 5. TODAY 自动更新  当公式组件内含 TODAY 函数时，贸易端展示需要每天自动更新到当天。  当公式中直接包含 `TODAY`，或公式变量因子引用的其他公式中包含 `TODAY` 时，该公式视为 TODAY 公式。TODAY 公式默认进入系统自动计算范围，即使未开启普通公式自动计算，也会随日期变化自动重新计算。  不更新场景：  - 订单已完成。 - 订单已取消。 - 里程碑已完成。 - 里程碑已取消。  ## 6. 自动更新与日志  公式因子发生变更后，相关公式字段需要同步更新。系统自动执行日志中需要记录公式自动更新，并在对应业务模块留下可追溯记录，例如订单跟踪记录、工单/里程碑批复动态、主表单或批复历史记录。  未开启自动计算时，公式只在用户编辑当前表单期间实时计算，提交后固化。开启自动计算后，公式成为系统自动写入能力，需要按照公式所在数据源判断是否允许更新：订单主表单、里程碑批复表单、工单采集表单和工单批复表单分别遵守订单、里程碑、工单状态限制。  资源库表单公式变量只来自当前表单，按普通表单编辑逻辑处理：用户编辑资源库记录时实时计算，提交后固化，不纳入公式自动计算状态限制表。  ## 7. 与组件的关系  - 文本、数字、百分比、日期等组件可通过公式计算默认值。 - 公式组件可被其他组件作为关联数据源。 - 公式显示类型影响显隐设置、导入校验、导出和展示格式。 - API 写入触发字段后，也会触发相关公式字段自动计算。  ## 8. 待确认问题  - NOW、MINUTE、SECOND 是否已正式上线，原始资料中部分标注为后期考虑。 - 公式错误值如何在贸易端、导出、报告中展示，需要补统一规则。 - 公式自动更新失败是否需要重试、告警或单独日志页。  ", "domain": "公共能力", "module": "业务对象与数据模型", "tags": "公式;函数;自动计算", "sources": [{"title": "系统自动执行的相关操作日志", "version": "V2.4.x", "product_side": "贸易端", "module": "贸易端", "last_write_time": "2026-09-04T10:48:06"}, {"title": "平台自动计算、更新规则说明", "version": "common", "product_side": "未识别", "module": "", "last_write_time": "2026-09-04T10:47:43"}]}, {"path": "docs/20-业务对象与数据模型/团队与协作团队.md", "title": "团队与协作团队", "folder": "docs/20-业务对象与数据模型", "text": " # 团队与协作团队  ## 1. 功能定位  团队是 Linkincrease 贸易端的组织归属单位，用于承载团队成员、团队角色、FlowSpace、资源库和协作团队关系。协作团队是与当前团队建立协作关系的外部团队，可进一步加入具体 FlowSpace 参与业务执行。  ## 2. 使用对象与入口  | 使用对象 | 入口 | 说明 | | --- | --- | --- | | 普通用户 | 创建团队引导、切换团队 | 首次或非首次创建团队、进入已加入团队 | | 团队管理员 | 团队设置 | 管理团队信息、角色、成员、协作团队 | | 被邀请成员 | 邮件邀请链接 | 注册或登录后加入团队 | | 协作团队管理员 | 团队设置 > 协作团队 > 邀请我的 | 接受或拒绝协作邀请 |  ## 3. 核心对象  | 对象 | 说明 | | --- | --- | | 团队 | 客户在贸易端创建的组织单位 | | 团队码 | 团队唯一识别码，可用于邀请协作团队 | | 团队成员 | 加入团队的用户，包括已邀请未加入成员 | | 拥有者 | 固定角色，有且只有一名成员，默认为团队创建者 | | 团队管理员 | 固定角色，拥有团队角色内全部权限，权限不可删改但成员可调整 | | 自定义团队角色 | 团队自定义权限集合 | | 协作团队 | 被当前团队邀请参与协作的外部团队 | | 协作邀请 | 团队间建立协作关系的申请记录 |  ## 4. 业务流程  ### 4.1 团队成员邀请  flowchart TD A[\"管理员输入邮箱并选择团队角色\"] --> B[\"发送邀请邮件\"] B --> C{\"被邀请人是否已注册\"} C -->|未注册| D[\"完成注册并填写个人信息\"] C -->|已注册| E[\"登录\"] D --> F[\"确认加入团队\"] E --> F F --> G[\"加入团队并切换到该团队\"]  ### 4.2 协作团队邀请  flowchart TD A[\"邀请方输入目标团队码\"] --> B[\"识别目标团队名称\"] B --> C[\"向目标团队有团队设置权限的成员发送邀请\"] C --> D[\"目标团队进入邀请我的列表\"] D --> E{\"接受或拒绝\"} E -->|接受| F[\"建立协作团队关系\"] E -->|拒绝| G[\"邀请记录移除或标记拒绝\"]  ## 5. 权限规则  | 操作 | 权限要求 | 说明 | | --- | --- | --- | | 打开团队设置 | 有团队设置权限 | 团队设置入口和邀请成员快捷入口受该权限控制 | | 创建/编辑/删除团队角色 | 有团队设置权限 | 固定角色不可删除 | | 邀请成员 | 有团队设置权限 | 可为成员预设团队角色 | | 删除成员 | 有团队设置权限 | 拥有者不可删除 | | 设置成员角色 | 有团队设置权限 | 同一成员多个角色权限叠加 | | 邀请协作团队 | 有团队设置权限 | 需输入对方团队码 | | 删除协作团队 | 有团队设置权限 | 同步影响其参与的 FlowSpace |  ## 6. 状态与限制  | 场景 | 规则 | | --- | --- | | 成员已邀请未加入 | 团队成员列表展示未加入标识，可重新邀请 | | 邮件链接失效 | 成员被删除或协作团队被删除后，点击邀请链接提示链接已失效 | | 成员已加入团队 | 再次点击邀请链接提示已加入该团队 | | 删除成员 | 从团队移除，同时从其参与的 FlowSpace 中同步删除 | | 唯一对接人限制 | 成员作为协作 FlowSpace 唯一对接人时，需先设置其他对接人 | | 删除协作团队 | 从团队移除，同时从其参与的 FlowSpace 中同步删除 |  ## 7. 字段、表单与校验  | 字段 | 规则 | | --- | --- | | 团队角色名称 | 必填，限制 100 字符 | | 成员邮箱 | 需包含且仅包含一个 `@`，并包含至少一个 `.` | | 团队码 | 邀请协作团队时限制输入 6 位，输入后识别团队名称 | | 团队成员搜索 | 支持姓名、邮箱、移动电话模糊搜索 | | 协作团队搜索 | 支持团队名称、简称、团队码模糊搜索 |  ## 8. 通知、日志与审计  需要沉淀：  - 邀请成员邮件。 - 邀请协作团队邮件。 - 团队角色创建、编辑、删除日志。 - 团队成员邀请、删除、角色设置日志。 - 协作团队邀请、接受、拒绝、删除日志。 - 成员被移出团队后的系统提示。  ## 9. 异常与提示  已知提示：  - 链接已失效。 - 您已加入该团队。 - 您已被移出该团队。如有疑问，请联系团队管理员。 - 唯一对接人场景需先设置其他对接人。  ## 10. 来源需求  - `source:thoughts-v2-current/v2.0.x/贸易端/【贸易端】【团队管理】创建团队.md` - `source:thoughts-v2-current/v2.0.x/贸易端/【贸易端】【团队设置】团队信息、角色、成员、协作团队管理.md` - `source:thoughts-v2-current/v2.1.x/贸易端/【贸易端】【团队设置】邀请成 员_协作团队流程变更.md`  ## 11. 待确认问题  - 删除团队成员后的任务批量移交规则。 - 删除协作团队后的任务批量移交规则。 - 团队拥有者移交的完整入口和校验规则。", "domain": "贸易端", "module": "业务对象与数据模型", "tags": "团队;协作团队;团队角色;成员", "sources": [{"title": "【贸易端】【团队管理】创建团队", "version": "v2.0.x", "product_side": "贸易端", "module": "团队管理", "last_write_time": "2026-09-04T10:48:48"}, {"title": "【贸易端】【团队设置】团队信息、角色、成员、协作团队管理", "version": "v2.0.x", "product_side": "贸易端", "module": "团队设置", "last_write_time": "2026-09-04T10:48:47"}, {"title": "【贸易端】【团队设置】邀请成 员_协作团队流程变更", "version": "v2.1.x", "product_side": "贸易端", "module": "团队设置", "last_write_time": "2026-09-04T10:48:42"}]}, {"path": "docs/20-业务对象与数据模型/字段、组件、子表、引用关系.md", "title": "字段、组件、子表、引用关系", "folder": "docs/20-业务对象与数据模型", "text": "# 字段、组件、子表、引用关系  本页用于统一说明表单设计中的字段、组件、子表和关联引用关系。  ## 基础规则  | 对象 | 说明 | 设计关注点 | | --- | --- | --- | | 组件 | 表单设计器中的可拖拽控件 | 类型、校验、展示、交互、权限 | | 字段 | 组件在数据层形成的存储单元 | 字段类型、字段来源、是否可写 | | 子表 | 表单内的一组明细行数据 | 必须区分子表字段和子表行 | | 关联引用 | 从资源库或其他数据对象引用信息 | 必须区分引用关系、显示字段和写入目标 | | 公式 | 基于字段计算结果 | 必须说明触发时机、更新范围和日志 |  ## 设计检查  1. 新增字段要说明所属对象层级：订单、工单、批复、资源库或子表行。 2. 子表需求要说明行的创建、编辑、删除、排序、导入导出和历史记录。 3. 引用关系要说明来源对象、展示字段、同步方式、断链处理和权限边界。 4. 工单采集表单互用或复制时，需区分“整表覆盖”“持续同步关系”和“本地复制数据”；互用目标表单只读，复制目标按普通表单继续编辑。 5. 资源库引用支持在订单引用弹窗中快捷创建资源库数据，但创建资源数据不等于完成订单引用，需用户确认后才回填订单字段。 6. 字段级可见性需要区分 FlowSpace 数据围栏和资源库数据围栏；资源库数据围栏隐藏列时，不应返回隐藏字段名、字段值、统计结果、导入导出字段或外部分享字段。  ## 关联文档  - [表单设计组件](./表单设计组件.md) - [表单属性与显隐设置](./表单属性与显隐设置.md) - [公式函数](./公式函数.md) - [FlowSpace 数据层级](./FlowSpace数据层级.md) - [工单表单互用与复制](../10-功能模块详情/工单表单互用与复制.md) - [资源库快捷创建引用数据](../10-功能模块详情/资源库快捷创建引用数据.md) - [资源库数据围栏](../40-权限、安全与审计/资源库数据围栏.md)", "domain": "公共能力", "module": "业务对象与数据模型", "tags": "20-业务对象与数据模型;字段、组件、子表、引用关系", "sources": []}, {"path": "docs/20-业务对象与数据模型/工单与批复.md", "title": "工单与批复", "folder": "docs/20-业务对象与数据模型", "text": " # 工单与批复  ## 1. 功能定位  工单是里程碑下的具体执行任务，用于收集、处理和确认业务数据。批复分为工单批复和里程碑批复，是否存在取决于运营端业务模板配置。  ## 2. 使用对象与入口  | 使用对象 | 入口 | 说明 | | --- | --- | --- | | 主团队 FlowSpace 成员 | 订单详情 | 创建工单、设置处理人、查看动态、执行批复或管理操作 | | 协作团队成员 | 订单详情、采集端任务 | 指派、采集、批复其权限范围内的任务 | | 采集端用户 | 任务列表、任务详情 | 移动端处理工单采集、工单批复、里程碑批复 |  ## 3. 核心对象  | 对象 | 说明 | | --- | --- | | 工单 | 里程碑下的一次具体任务 | | 工单采集表单 | 处理人填写执行数据的表单 | | 工单批复 | 对工单采集结果进行确认 | | 里程碑批复 | 对里程碑阶段结果进行确认 | | 采集人 | 负责填写工单采集表单的人或协作团队 | | 工单批复人 | 负责确认工单采集结果的人或协作团队 | | 里程碑批复人 | 负责确认里程碑结果的人或协作团队 | | 指派人 | 协作团队中有权限将任务指派给具体成员的人 |  ## 4. 业务流程  flowchart TD A[\"创建工单\"] --> B[\"设置采集人、工单批复人、里程碑批复人\"] B --> C{\"处理人为协作团队负责人?\"} C -->|是| D[\"协作方指派具体成员\"] C -->|否| E[\"处理人直接处理\"] D --> E E --> F[\"提交工单采集\"] F --> G{\"需要工单批复?\"} G -->|是| H[\"提交工单批复\"] G -->|否| I[\"工单完成采集链路\"] H --> I I --> J{\"需要里程碑批复?\"} J -->|是| K[\"提交里程碑批复\"] J -->|否| L[\"推进里程碑\"] K --> L  ## 5. 权限规则  | 操作 | 权限要求 | 状态限制 | | --- | --- | --- | | 创建工单 | 有当前里程碑创建工单权限 | 订单进行中；里程碑未开始或进行中 | | 采集指派 | 协作方有对应里程碑工单指派权限 | 工单未终止、未批复；里程碑未完成/取消 | | 工单采集 | 当前工单采集人或协作方未指派前负责人/对接人 | 工单未终止、未批复；里程碑未完成/取消 | | 工单批复 | 当前工单批复人或对应协作方有权限成员 | 依模板配置和状态限制 | | 里程碑批复 | 当前里程碑批复人或对应协作方有权限成员 | 依模板配置和状态限制 | | 修改处理人 | 主团队或协作团队有对应权限成员 | 对象状态允许处理 | | 终止采集 | 有终止采集权限 | 工单未批复、未终止 | | 还原采集 | 有当前里程碑还原采集权限，且可查看目标订单和工单 | 工单已终止采集；订单、里程碑进行中；工单未批复、未删除；非跨订单互用只读实例 | | 删除工单 | 有删除工单权限 | 对象状态允许删除 |  ## 6. 状态与限制  工单采集、批复、指派操作在以下场景通常不可执行：  - 订单已删除。 - 订单已完成。 - 订单已取消。 - 里程碑已完成。 - 里程碑已取消。 - 工单已终止采集。 - 工单已批复。 - 工单已删除。 - 当前处理人或可编辑表单权限已变化。 - 多人并发提交后当前页面未刷新。  工单采集人、工单批复人和里程碑批复人可通过 FlowSpace 数据移交转给新的处理人。移交后历史数据状态不变；工单采集任务仅移交原处理人可编辑的表单，不移交整个工单。  已终止采集的工单在满足权限和状态条件时可执行还原采集。还原只解除终止锁，不回滚业务数据；字段、子表、图片、附件、处理人、提交标识和历史记录保留，表单显隐、公式、任务归类和可编辑权限按当前配置重新计算。还原后允许再次终止，每轮终止和还原都需要保留独立事件。  ## 7. 字段、表单与校验  创建工单时：  - 一次最多创建 10 条工单。 - 工单名称限制 50 字符，默认按创建顺序编号。 - 至少保留一个非隐藏表单。 - 采集人、工单批复人、里程碑批复人按模板配置校验。 - 未设置采集人的表单需校验必填项。 - 表单字段按运营端配置进行类型、必填、格式校验。  采集时：  - 当前采集人可编辑自己负责的表单，其余表单只读。 - 多人并发时，如其他人已提交，需要提示刷新后再提交。 - 提交后更新头像提交标识、动态、历史记录和完成度。 - 工单采集表单支持“互用”和“复制”两种整表复用。互用建立持续同步关系，目标表单只读；复制只覆盖源表单当前已保存数据，目标后续按普通表单继续编辑。 - 表单互用/复制仅限同一 FlowSpace，源、目标需属于同一里程碑模板 ID 和同一工单采集表单模板 ID；首期不支持工单批复表单和里程碑批复表单。 - 互用目标表单禁止导入、批量编辑、API 和自动化直接写入；同步后按目标工单公式和字段显隐重新计算业务有效值。  ## 8. 通知、日志与审计  需要记录和通知的事件包括：  - 创建工单。 - 采集指派。 - 工单采集提交。 - 工单批复指派与提交。 - 里程碑批复指派与提交。 - 修改处理人。 - 终止采集。 - 还原采集。 - 删除工单。 - 自动化创建或更新工单。 - 工单采集人、工单批复人、里程碑批复人移交。 - 工单表单互用关系创建、同步、修改、取消、源工单删除解除关系、目标工单删除解除关系和复制覆盖。  通知渠道包括站内消息、邮件，部分资料中也提到短信模板，需要补充来源。  ## 9. 异常与提示  需统一沉淀的提示：  - 暂无权限，请联系管理员。 - 订单已删除，无法操作，请刷新页面。 - 订单已完成/已取消，无法操作，请刷新页面。 - 里程碑已完成/已取消，无法操作，请刷新页面。 - 工单已终止采集/已批复/已删除，无法操作，请刷新页面。 - 工单编辑权限已变更，请刷新页面。 - 某成员已修改数据，请刷新。 - 至少保留一个模块。 - 请设置处理人。 - 请输入指定字段。  ## 10. 来源需求  - `source:thoughts-v2-current/v2.2.x/贸易端/【贸易端】【订单详情】工单&里程碑批复操作.md` - `source:thoughts-v2-current/v2.2.x/贸易端/【贸易端】【订单详情】查看&操作.md` - `source:thoughts-v2-current/v2.3.x/贸易端/【贸易端】【工单视图】批量操作：批量发邮件协作、批量采集.md` - `source:thoughts-v2-current/v2.3.x/采集端/【采集端】【任务详情页】工单、工单批复、里程碑批复详情页.md` - `source:thoughts-v2-current/v2.3.x/采集端/【采集端】【任务列表】工单、工单批复、里程碑批复任务列表.md` - `source:thoughts-v2-current/v2.8/贸易端/【贸易端】FS 数据移交.md` - `source:thoughts-v2-current/v2.8/贸易端/【贸易端】【工单】表单互用、表单复制.md` - `source:thoughts-v2-current/v2.8/贸易端/【贸易端】工单终止还原为采集状态.md`  ## 11. 待确认问题  - 工单批复后是否允许部分字段继续被自动化或资源库同步更新。 - 跨订单工单表单互用遇到订单内关联引用时，首期阻止整表互用还是复制时跳过关联引用仍需确认。 - 采集端与贸易端在所有状态限制上的提示是否完全一致。", "domain": "贸易端", "module": "工单", "tags": "工单;采集;工单批复;里程碑批复;指派", "sources": [{"title": "【贸易端】【订单详情】工单&里程碑批复操作", "version": "v2.2.x", "product_side": "贸易端", "module": "订单详情", "last_write_time": "2026-09-04T10:48:34"}, {"title": "【贸易端】【订单详情】查看&操作", "version": "v2.2.x", "product_side": "贸易端", "module": "订单详情", "last_write_time": "2026-09-04T10:48:34"}, {"title": "【采集端】【任务详情页】工单、工单批复、里程碑批复详情页", "version": "v2.3.x", "product_side": "采集端", "module": "任务详情页", "last_write_time": "2026-09-04T10:48:26"}, {"title": "【贸易端】FS 数据移交", "version": "v2.8", "product_side": "贸易端", "module": "贸易端", "last_write_time": "2026-09-04T10:47:56"}, {"title": "【贸易端】【工单】表单互用、表单复制", "version": "v2.8", "product_side": "贸易端", "module": "工单", "last_write_time": "2026-09-04T10:47:54"}, {"title": "【贸易端】工单终止还原为采集状态", "version": "v2.8", "product_side": "贸易端", "module": "贸易端", "last_write_time": "2026-09-04T10:47:53"}]}, {"path": "docs/20-业务对象与数据模型/工单数据模型.md", "title": "工单数据模型", "folder": "docs/20-业务对象与数据模型", "text": "# 工单数据模型  工单数据模型用于说明工单、工单批复、里程碑批复在 FlowSpace 中的层级和基数关系。  ## 数据位置  | 数据层级 | 说明 | 关键约束 | | --- | --- | --- | | 里程碑 | 工单所属阶段 | 工单必须挂在具体里程碑下 | | 工单 | 里程碑下的执行记录 | 同一里程碑可创建多个工单 | | 工单表单字段 | 工单填写内容 | 来自当前里程碑挂载的表单 | | 工单批复 | 对单个工单的批复数据 | 开启后每个工单对应一个工单批复 | | 里程碑批复 | 对当前里程碑的批复数据 | 开启后当前里程碑仅有一个里程碑批复 |  ## 关联文档  - [工单与批复](./工单与批复.md) - [FlowSpace 数据层级](./FlowSpace数据层级.md) - [工单采集与批复](../30-业务流程与产品流程图/工单采集与批复.md) ", "domain": "公共能力", "module": "业务对象与数据模型", "tags": "20-业务对象与数据模型;工单数据模型", "sources": []}, {"path": "docs/20-业务对象与数据模型/模板与实例关系.md", "title": "模板与实例关系", "folder": "docs/20-业务对象与数据模型", "text": "# 模板与实例关系  本页用于统一说明配置态模板与运行态数据之间的关系。  ## 核心关系  | 配置态 | 运行态 | 说明 | | --- | --- | --- | | 业务模板 | FlowSpace | 业务模板决定可创建 FlowSpace 的基础结构 | | 默认主表单 | 订单主表单 | 默认主表单有且仅有一个，用于订单主数据 | | 里程碑 | 订单里程碑 | 里程碑决定订单执行阶段 | | 里程碑挂载表单 | 工单表单 | 工单创建时填写当前里程碑下的表单数据 | | 工单批复表单 | 工单批复 | 开启后每个工单对应一个工单批复 | | 里程碑批复表单 | 里程碑批复 | 开启后当前里程碑仅有一个里程碑批复 |  ## 设计原则  1. 模板定义结构，实例承载业务数据。 2. 模板变更影响既有实例时，必须说明同步范围、历史数据保留方式和不可逆影响。 3. 运行态数据写入必须先判断目标层级，不能只按页面入口判断。  ## 关联文档  - [业务模板](./业务模板.md) - [FlowSpace 数据层级](./FlowSpace数据层级.md) - [从模板到 FlowSpace](../30-业务流程与产品流程图/从模板到FlowSpace.md) ", "domain": "公共能力", "module": "业务对象与数据模型", "tags": "20-业务对象与数据模型;模板与实例关系", "sources": []}, {"path": "docs/20-业务对象与数据模型/表单属性与显隐设置.md", "title": "表单属性与显隐设置", "folder": "docs/20-业务对象与数据模型", "text": " # 表单属性与显隐设置  ## 1. 功能定位  表单属性用于配置表单名称、描述和国际化；显隐设置用于根据条件动态显示或隐藏字段。显隐规则直接影响贸易端和采集端的数据录入、必填校验、导入保存和服务端数据。  ## 2. 表单属性  | 字段 | 是否必填 | 限制 | | --- | --- | --- | | 表单名称 | 必填 | 100 字符 | | 表单名称国际化 | 非必填 | 100 字符 | | 描述 | 非必填 | 200 字符 |  ## 3. 显隐设置定义  显隐设置表示：当满足某些条件时，才显示指定字段。未满足条件时，指定字段隐藏。  核心规则：  - 子表和子表内组件不可作为条件字段。 - 条件中已使用的字段，不可再作为显示指定字段。 - 不同显隐规则中的显示指定字段不可重复。 - 本表单若有子表，子表作为一个大组件参与显示字段设置。  ## 4. 可参与条件的数据源  | 当前表单 | 可参与条件的字段 | | --- | --- | | 主表单 | 主表单字段、里程碑批复字段 | | 工单表单 | 主表单字段、同一里程碑所有表单，不含工单批复表单 | | 工单批复表单 | 主表单字段、同一里程碑所有表单、本工单批复表单 | | 里程碑批复表单 | 主表单字段、本里程碑批复字段 |  里程碑所有表单指工单表单和工单批复表单。  ## 5. 条件字段类型与运算符  | 字段类型 | 运算符 | | --- | --- | | 单行文本、多行文本、单选、多选、定位 | 等于、不等于、包含、不包含、为空、不为空 | | 数字、评级、百分比 | 等于、不等于、小于等于、大于等于、为空、不为空 | | 成员 | 为空、不为空 | | 日期 | 等于、早于、晚于、在范围内、为空、不为空 | | 公式 | 根据公式显示类型使用对应运算符 |  当运算符选择“为空/不为空”时，不显示后续条件值输入。  显隐设置中的条件字段和条件值匹配应复用 [通用条件规则](./通用条件规则.md)。如果本页与通用条件规则存在差异，以具体显隐设置来源需求为准，并在待确认问题中记录差异。  ## 6. 条件值来源  | 来源 | 规则 | | --- | --- | | 自定义 | 根据前方字段类型展示对应输入框；选项字段可选择选项值 | | 其他字段 | 可选同类型数据源字段，但需排除当前条件中的目标字段 |  条件支持同时增加“或”和“且”。  ## 7. 贸易端应用  - 隐藏后的组件所在整行如果无其他显示内容，需要自动上移，不保留整行空白。 - 隐藏组件的数据应清空，不验证必填。 - 隐藏组件数据不保存至服务端。 - 导入时，显隐判断为隐藏的字段即使有导入值，也应导入为空。  ## 8. 变更与删除提示  - 表单内容发生变更，未保存返回或关闭页面时，需要提示保存。 - 删除控件时需要关键操作提示。 - 显隐规则中涉及的字段被删除或变更时，需要避免产生不可见但仍参与判断的悬挂规则。 - 已设为条件的字段在运营端被删除时，条件配置中显示为已删除样式并增加提示。  ## 9. 待确认问题  - 显隐设置是否影响导出、报告、仪表盘统计口径。 - 多条显隐规则同时命中同一字段时目前禁止重复设置，后续是否允许优先级模式。 - 历史数据中已保存的隐藏字段值清空时机，需要与线上逻辑核对。 ", "domain": "运营端", "module": "业务对象与数据模型", "tags": "表单;显隐设置;条件规则", "sources": [{"title": "【运营端】【业务模版】表单属性与显隐设置", "version": "v2.1.x", "product_side": "运营端", "module": "业务模版", "last_write_time": "2026-09-04T10:48:38"}]}, {"path": "docs/20-业务对象与数据模型/表单设计组件.md", "title": "表单设计组件", "folder": "docs/20-业务对象与数据模型", "text": " # 表单设计组件  ## 1. 功能定位  表单设计组件是 Linkincrease 低代码配置能力的基础。运营端通过布局组件、基础组件、高级组件和行业组件配置业务模板、资源库模板、工单、批复、里程碑批复等表单结构，贸易端和采集端按配置展示、校验和保存数据。  ## 2. 组件分类  | 分类 | 组件 | | --- | --- | | 布局组件 | 模块分组、分割线、子表 | | 基础组件 | 单行文本、多行文本、数字、百分比、单选、多选、图片、附件、日期、评级、定位、地址、富文本、空白占位 | | 高级组件 | 关联引用、公式、成员单选、成员多选、协作方单选、协作方多选、签名、汇率 | | 行业组件 | 尺寸检验、组合明细、检测内容选择、检测项目配置套件、检测套餐配置套件等 |  资源库模板组件与业务模板组件整体相似，但资源库模板中的成员/协作方组件面向团队内成员和团队协作方；业务模板中的成员/协作方组件面向 FlowSpace 内参与成员和协作方。  行业组件不是单纯字段控件，通常包含内置数据结构、生成逻辑、统计口径和端到端流程。尺寸检验组件沉淀抽样、规格、测量记录和补充测量；实验室检验组件沉淀检测内容选择、检测项目配置套件、检测套餐配置套件、样品范围、检测执行和批复链路。  ## 3. 通用属性  | 属性 | 规则 | | --- | --- | | 标题 | 多数组件必填，限制 100 字符 | | 提示描述 | 非必填，通常限制 100 字符 | | 输入框提示 | 文本、数字、日期等输入型组件可配置 | | 必填项 | 默认不勾选；提交时按组件规则校验 | | 国际化 | 可配置标题、提示描述、输入框提示、单位、按钮名称等 | | 布局 | 影响贸易端展示宽度和排列 |  ## 4. 布局组件  | 组件 | 关键规则 | | --- | --- | | 模块分组 | 基础组件和高级组件可拖入分组；修改分组布局时，需要提示是否同步修改分组内组件宽度 | | 分割线 | 用于表单视觉分隔，支持标题、提示描述和国际化 | | 子表 | 可拖入基础组件和高级组件，但排除关联引用；子表必填时，贸易端至少需要一行数据 |  子表内字段必填时，对应表单提交也需要校验。子表支持单元格编辑、新增行、复制组件、关联字段管理等能力。  ## 5. 基础组件要点  | 组件 | 关键规则 | | --- | --- | | 单行文本/多行文本 | 可配置默认值，支持关联已有数据或通过公式计算 | | 数字 | 支持单位、小数位数、千分符等展示规则 | | 百分比 | 支持单位和小数位数，数字与百分比互相关联时需换算 | | 单选/多选 | 选项需要支持贸易端显示和导入校验 | | 图片 | 可限制最大上传数量和单图最大大小 | | 附件 | 可限制最大数量、单文件大小和文件类型 | | 日期 | 支持多种手动输入和粘贴格式，按控件展示格式截取或补全 | | 定位 | 调取设备定位并记录位置 | | 地址 | 运营端精度变更后，贸易端已有数据按格式截取或补空 | | 富文本 | 支持富文本内容录入，导入时通常只处理文字部分 |  ## 6. 高级组件要点  | 组件 | 关键规则 | | --- | --- | | 关联引用 | 可引用组件和子表；可设置引用按钮名称、关联字段、布局和国际化 | | 公式 | 设置函数与变量，自动计算并展示值 | | 成员单选/多选 | 业务模板中选择 FlowSpace 内成员；资源库模板中选择团队内成员 | | 协作方单选/多选 | 业务模板中选择 FlowSpace 内协作方；资源库模板中选择团队协作方 | | 签名 | 支持 Web 和移动端绘制，账号维度可保存一个签名供下次使用 | | 汇率 | 支持固定汇率或实时汇率，用户填写金额和币种，基准汇率不可改 |  ## 7. 资源库双向关联  资源库模板的关联引用组件支持双向关联：  - 表单 A 的关联引用设置双向关联后，表单 B 末尾新增双向关联组件。 - 双向关联开启后，允许关联多条自动开启且不可关闭。 - 表单 B 的双向关联组件可修改位置、标题、提示、自定义按钮、显示字段、布局和国际化。 - 删除表单 B 的双向关联组件，会关闭表单 A 对应关联引用的双向关联。 - 双向关联数据也支持贸易端资源库被订单详情使用。  ## 8. 默认值与数据源  文本、数字、百分比、日期等组件可通过“关联已有数据”或“公式计算”设置默认值。不同表单可选数据源不同：  - 主表单变量来自主表单。 - 里程碑批复变量来自所有里程碑批复表单和主表单。 - 工单表单变量来自同一里程碑所有表单、主表单、所有里程碑批复表单。 - 工单批复表单变量来自同一里程碑所有表单、主表单、所有里程碑批复表单。 - 子表内组件可额外关联当前子表其他字段。  ## 9. 贸易端应用原则  - 按运营端配置展示、校验和保存。 - 组件默认值应用于创建或导入订单、工单、批复等场景。 - 运营端组件显示格式变更后，贸易端已有数据按新格式截取或补全展示。 - 导入、导出、资源库引用、第三方 API 写入都必须遵循组件类型和校验规则。  ## 10. 待确认问题  - 业务模板与资源库模板组件差异需要继续沉淀成字段级清单。 - 各组件在导入、导出、报告、仪表盘中的展示和可用性需要补完整矩阵。 - 行业组件已包含尺寸检验和实验室检验，后续每新增一个复杂行业组件都应单独拆页，并补齐内置数据结构、端到端流程、权限、统计和验收清单。  ", "domain": "运营端", "module": "模板表单与数据", "tags": "表单;组件;业务模板;资源库模板", "sources": [{"title": "【运营端】【业务模板】表单设计组件", "version": "v2.1.x", "product_side": "运营端", "module": "业务模板", "last_write_time": "2026-09-04T10:48:42"}, {"title": "【运营端】【表单设计】尺寸检验组件流程梳理", "version": "v2.8", "product_side": "运营端", "module": "表单设计", "last_write_time": "2026-09-04T10:47:54"}, {"title": "【运营端】【表单设计】实验室检验流程", "version": "v2.8", "product_side": "运营端", "module": "表单设计", "last_write_time": "2026-09-04T10:48:00"}]}, {"path": "docs/20-业务对象与数据模型/订单.md", "title": "订单", "folder": "docs/20-业务对象与数据模型", "text": " # 订单  ## 1. 功能定位  订单是 FlowSpace 中的业务主实体，承载订单基本信息、里程碑、工单、批复、历史记录、动态和跟踪记录。订单由运营端模板定义结构，由贸易端团队在 FlowSpace 中创建和流转。  ## 2. 使用对象与入口  | 使用对象 | 入口 | 说明 | | --- | --- | --- | | FlowSpace 成员 | 订单列表 | 查看、创建、编辑、删除、导入导出订单 | | FlowSpace 成员 | 订单详情 | 查看订单基本信息、里程碑、工单、批复和跟踪记录 | | 协作成员 | 订单详情或任务入口 | 在授权范围内查看和处理相关任务 | | 采集端用户 | 任务详情 | 查看与任务相关的订单信息 |  ## 3. 核心对象  | 对象 | 说明 | | --- | --- | | 订单基本信息 | 订单主表单数据 | | 订单标识 | 用于在列表、详情、面包屑中展示订单身份的字段 | | 里程碑 | 订单流程阶段 | | 工单 | 里程碑下的执行任务 | | 里程碑批复 | 对里程碑阶段结果进行确认 | | 工单批复 | 对工单采集结果进行确认 | | 跟踪记录 | 订单级关键节点记录 | | 历史记录 | 表单数据编辑历史 | | 订单负责人 | 订单系统字段，默认等于订单创建人；用于数据移交，也可作为自定义权限、自动化和标签条件字段 |  ## 4. 业务流程  stateDiagram-v2 [*] --> 进行中: 创建订单 进行中 --> 已完成: 完成订单 进行中 --> 已取消: 取消订单 已完成 --> 进行中: 重启订单 已取消 --> 进行中: 重启订单  订单执行主线：  flowchart TD A[\"创建订单\"] --> B[\"生成订单基本信息和里程碑\"] B --> C[\"创建工单或处理里程碑批复\"] C --> D[\"工单采集、工单批复\"] D --> E[\"里程碑推进\"] E --> F{\"订单是否结束\"} F -->|否| C F -->|是| G[\"完成或取消订单\"] G --> H[\"保留历史、动态、跟踪记录\"]  ## 5. 权限规则  订单相关入口和操作受 FlowSpace 业务角色、协作方角色、数据围栏、订单状态共同影响。  | 操作 | 权限要求 | 额外限制 | | --- | --- | --- | | 查看订单 | 有订单查看权限且满足数据围栏 | 隐藏不可见字段和标签 | | 创建订单 | 有创建订单权限 | 需满足表单必填和字段校验 | | 编辑订单 | 有编辑订单权限 | 已完成、已取消时受限 | | 删除订单 | 有删除订单权限 | 需处理关联工单和历史记录展示 | | 完成/取消/重启订单 | 有修改订单状态权限 | 仅特定状态可执行 | | 查看跟踪记录 | 有查看跟踪记录权限 | 按订单维度展示 |  ## 6. 状态与限制  | 状态 | 说明 | 关键限制 | | --- | --- | --- | | 进行中 | 订单正常流转 | 可编辑、可取消、可完成，可推进里程碑和工单 | | 已完成 | 订单结束 | 订单不可编辑和取消；里程碑与工单处理动作受限 | | 已取消 | 订单取消 | 保存取消时的取消原因文本；业务处理动作受限 |  完成订单后：  - 订单状态变更为已完成。 - 进行中的里程碑变更为已完成，其余里程碑状态按需求规则保持。 - 里程碑不可创建工单、不可修改状态、不可互用。 - 工单不可采集、批复、指派、修改处理人、发邮件协作、终止采集、删除。 - 跟踪记录增加操作记录。  取消订单后：  - 需要选择取消原因。 - 取消原因来自 FlowSpace 设置中的订单取消原因预设。 - 历史订单展示取消时保存的文本，不随后续预设变更而改变。  ## 7. 字段、表单与校验  订单基本信息由业务模板主表单决定。展示和编辑时需要同时考虑：  - 字段类型和必填校验。 - 数据围栏对字段可见性的控制。 - 订单标识字段。 - 订单负责人字段；订单/工单列表的字段配置、筛选、排序、模糊搜索和列统计均需支持该字段。订单负责人默认不直接赋予订单可见或操作权限，需通过自定义权限条件配置后才影响数据范围。 - 子表模式展示：切换到子表模式时选择并展开一个子表；模板未配置子表时隐藏或提示无可展开子表；子表模式不支持排序和翻页。 - 资源库引用字段。 - 资源库引用字段在引用弹窗中可按当前资源表创建权限提供快捷创建资源数据入口；快捷创建写入正式资源库数据，订单取消或保存失败不回滚该资源库数据。 - 公式字段自动更新。  ## 8. 通知、日志与审计  订单相关审计包括：  - 创建、编辑、删除订单。 - 完成、取消、重启订单。 - 订单导入导出记录。 - 跟踪记录。 - 历史记录。 - 自动化对订单基本信息的更新记录。 - 订单负责人数据移交成功后，需要写入订单跟踪记录。  ## 9. 异常与提示  需要统一沉淀的异常包括：  - 无权限。 - 订单已删除。 - 订单状态已变更。 - 订单已完成或已取消导致无法操作。 - 字段必填或格式错误。 - 数据围栏变化导致字段不可见。  ## 10. 来源需求  - `source:thoughts-v2-current/v2.2.x/贸易端/【贸易端】【订单列表】订单列表查看：概览、详情.md` - `source:thoughts-v2-current/v2.2.x/贸易端/【贸易端】【订单列表】订单增删改.md` - `source:thoughts-v2-current/v2.3.x/贸易端/【贸易端】【订单列表】订单导入、订单导出.md` - `source:thoughts-v2-current/v2.3.x/贸易端/【贸易端】【订单列表】视图模式：子表.md` - `source:thoughts-v2-current/v2.8/贸易端/【贸易端】订单引用资源库页面快捷创建资源库数据.md` - `source:thoughts-v2-current/v2.2.x/贸易端/【贸易端】【订单详情】查看&操作.md` - `source:thoughts-v2-current/v2.2.x/贸易端/【贸易端】【订单详情】视图模式：看板、表格.md` - `source:thoughts-v2-current/v2.8/贸易端/【贸易端】FS 数据移交.md`  ## 11. 待确认问题  - 订单完成、取消、重启后，对邮件协作、互用、自动化是否存在例外场景。 - 删除订单后，采集端已打开任务页面如何实时提示。 - 订单关联和 FlowSpace 关联是否需要进入订单核心页，还是拆为复用关系页。 - 订单负责人默认不直接赋予订单权限，需通过自定义权限条件配置；数据移交后命中该条件的列表可见范围和权限缓存是否需要立即刷新仍需确认。", "domain": "贸易端", "module": "订单", "tags": "订单;生命周期;订单详情;状态", "sources": [{"title": "【贸易端】【订单列表】订单列表查看：概览、详情", "version": "v2.2.x", "product_side": "贸易端", "module": "订单列表", "last_write_time": "2026-09-04T10:48:32"}, {"title": "【贸易端】【订单列表】订单增删改", "version": "v2.2.x", "product_side": "贸易端", "module": "订单列表", "last_write_time": "2026-09-04T10:48:34"}, {"title": "【贸易端】【订单详情】查看&操作", "version": "v2.2.x", "product_side": "贸易端", "module": "订单详情", "last_write_time": "2026-09-04T10:48:34"}, {"title": "【贸易端】【订单列表】订单导入、订单导出", "version": "v2.3.x", "product_side": "贸易端", "module": "订单列表", "last_write_time": "2026-09-04T10:48:17"}, {"title": "【贸易端】【订单列表】视图模式：子表", "version": "v2.3.x", "product_side": "贸易端", "module": "订单列表", "last_write_time": "2026-09-04T10:48:15"}, {"title": "【贸易端】订单引用资源库页面快捷创建资源库数据", "version": "v2.8", "product_side": "贸易端", "module": "贸易端", "last_write_time": "2026-09-04T10:47:51"}, {"title": "【贸易端】FS 数据移交", "version": "v2.8", "product_side": "贸易端", "module": "贸易端", "last_write_time": "2026-09-04T10:47:56"}]}, {"path": "docs/20-业务对象与数据模型/订单数据模型.md", "title": "订单数据模型", "folder": "docs/20-业务对象与数据模型", "text": "# 订单数据模型  订单数据模型用于说明订单在 FlowSpace 运行态中的数据位置、字段来源和关联对象。  ## 数据位置  | 数据层级 | 说明 | 关键约束 | | --- | --- | --- | | FlowSpace | 订单所属业务空间 | 决定可用模板、业务角色、权限和数据围栏 | | 订单 | FlowSpace 下的主业务记录 | 承载主表单数据和订单状态 | | 主表单字段 | 创建订单时填写的订单信息 | 来自业务模板默认主表单 | | 里程碑 | 订单下的阶段节点 | 由业务模板配置生成 | | 工单 | 里程碑下的执行记录 | 与订单关联，不替代订单主数据 | | 跟踪记录 | 订单关键操作记录 | 用于审计和回溯 |  ## 关联文档  - [订单](./订单.md) - [FlowSpace 数据层级](./FlowSpace数据层级.md) - [订单生命周期](../30-业务流程与产品流程图/订单生命周期.md) - [订单跟踪记录](../40-权限、安全与审计/订单跟踪记录.md) ", "domain": "公共能力", "module": "业务对象与数据模型", "tags": "20-业务对象与数据模型;订单数据模型", "sources": []}, {"path": "docs/20-业务对象与数据模型/资源库.md", "title": "资源库", "folder": "docs/20-业务对象与数据模型", "text": " # 资源库  ## 1. 功能定位  资源库是团队级标准化数据池，用于管理物料、供应商、客户等基础数据，并将这些数据应用到 FlowSpace 订单和表单字段中。  ## 2. 使用对象与入口  | 使用对象 | 入口 | 说明 | | --- | --- | --- | | 团队成员 | 贸易端资源库 | 创建、查看、维护资源库数据 | | 资源库管理员 | 资源库设置 | 管理资源库基础信息、角色、权限、成员 | | FlowSpace 成员 | 订单表单中的资源库引用字段 | 引用资源库数据 | | 运营人员 | 运营端资源库管理、资源库模板 | 配置模板、查看团队资源库数据 |  ## 3. 核心对象  | 对象 | 说明 | | --- | --- | | 资源库模板 | 运营端配置的资源库结构 | | 资源库 | 团队基于模板创建的数据池 | | 资源库表 | 资源库下的数据表 | | 资源库数据 | 资源库表中的单条记录 | | 资源库角色 | 控制资源库设置和表数据权限 | | 协作方角色 | 控制协作团队可见资源表、可操作权限和数据范围 | | 资源库视图 | 组织表数据查看方式 | | 资源库分享 | 对单条或整表数据进行外链或授权分享 | | FlowSpace 应用资源库 | 将资源库表和字段应用到 FlowSpace 表单 | | 资源库数据围栏 | 按成员或协作团队限制资源表列级可见范围 |  ## 4. 业务流程  flowchart TD A[\"运营端配置资源库模板\"] --> B[\"贸易端从模板中心选择模板\"] B --> C[\"创建资源库\"] C --> D[\"设置基础信息、成员角色、协作方角色\"] D --> E[\"按表配置权限、数据范围、FlowSpace应用范围\"] E --> F[\"维护资源库数据\"] F --> G[\"授权协作资源库或开启资源库分享\"] E --> H[\"FlowSpace关联资源库\"] H --> I[\"订单、工单、批复字段引用资源库数据\"] F --> J[\"资源库数据变更\"] J --> K[\"按同步策略更新已引用字段或保留历史数据\"] I --> L[\"引用弹窗内快捷创建资源库数据\"]  ## 5. 权限规则  | 权限域 | 权限点 | | --- | --- | | 团队角色 | 创建资源库、删除资源库、资源库管理 | | 资源库角色 | 资源库设置、查看数据、创建数据、编辑数据、删除数据、导入、导出、批量操作 | | 表权限 | 按资源库表配置查看、编辑、删除、导入导出等权限 | | 数据范围 | 控制成员可见或可操作的数据范围 | | 数据围栏 | 控制成员或协作团队不可查看的资源表列 | | FlowSpace 应用范围 | 控制 FlowSpace 引用资源库数据时使用所有数据或按用户权限过滤 | | 分享权限 | 控制外链、只读、可编辑、密码、失效等能力 |  资源库应用到 FlowSpace 时，最终可引用数据由资源表有效性、资源库表权限、数据范围、FlowSpace 应用范围、协作授权范围共同决定；列级可见性还需叠加资源库数据围栏。  ## 6. 状态与限制  已确认规则：  - 删除资源库为假删。 - 删除资源库后，各 FlowSpace 下可见表同时被删除。 - 新订单不可再引用已删除资源库或已删除资源库数据。 - 历史订单中已引用的数据需保留文本或快照。 - 资源库名称在当前团队内不可重复。 - 资源库管理员为固定角色，默认包含创建资源库的成员。 - FlowSpace 关联资源库时，资源库表最多可多选 5 个。 - 同一订单字段不可在同一模块内被多组资源库关联关系重复使用。 - 分享者失去数据或表查看权限后，分享链接失效，重新获得权限后也需要重新分享。  ## 7. 字段、表单与校验  资源库数据表单由资源库模板决定。字段规则包括：  - 必填校验。 - 字段类型校验。 - 关联引用字段。 - 图片、附件、日期、数字、百分比等组件规则。 - 导入模板字段校验。 - 资源库引用在订单表单中的展示和历史保留。 - 订单资源库引用弹窗可按当前资源表创建权限展示“添加资源数据”，创建成功后刷新并定位新数据；创建资源数据不代表订单已引用，需用户确认后才回填订单字段。 - 资源库引用在工单、工单批复、里程碑批复中的展示和同步边界。 - 数据围栏隐藏列时，列表、详情、编辑、视图、搜索、统计、附件、历史、导入、导出和外部分享均不得返回隐藏列名、列值或统计结果。  ## 8. 通知、日志与审计  资源库需要沉淀的记录包括：  - 创建、编辑、删除资源库。 - 创建、编辑、删除资源库角色。 - 创建、编辑、删除协作方角色。 - FlowSpace 应用数据范围变更。 - FlowSpace 关联资源库配置变更。 - 创建、编辑、删除资源库数据。 - 导入导出记录。 - 批量编辑和批量下载记录。 - 数据编辑历史。 - 资源库同步造成订单侧字段变化时，订单侧不新增普通操作记录；资源库数据历史记录保留变更来源。 - 快捷创建资源库数据按普通“创建资源库数据”写入历史，并触发与普通资源库新增一致的既有事件。  ## 9. 异常与提示  需要统一沉淀：  - 请输入资源库名称。 - 已存在相同的资源库名称，请修改。 - 暂无权限，请联系管理员。 - 必填项为空时提示请输入对应字段。 - 删除后的数据不可继续引用。 - 导入失败原因和失败记录下载。  ## 10. 来源需求  - `source:thoughts-v2-current/V2.4.x/贸易端/【贸易端】【资源库】第一阶段.md` - `source:thoughts-v2-current/V2.5.x/贸易端/【贸易端】【资源库】资源库分享.md` - `source:thoughts-v2-current/V2.5.x/贸易端/【贸易端】【资源库】视图管理.md` - `source:thoughts-v2-current/v2.7/贸易端/【贸易端】【资源库】SCCS应用数据范围、数据编辑历史记录.md` - `source:thoughts-v2-current/V2.4.x/贸易端/【贸易端】【操作日志】所有设置类功能.md` - `source:thoughts-v2-current/v2.3.x/运营端/【运营端】【模板中心】资源库模版管理.md` - `source:thoughts-v2-current/v2.8/贸易端/【贸易端】订单引用资源库页面快捷创建资源库数据.md` - `source:thoughts-v2-current/v2.8/贸易端/【贸易端】资源库数据围栏.md` - `missing-current-source/【运营端】【资源库模版】表单设计组件.md`  ## 11. 待确认问题  - 资源库同步与自动化更新同一字段时的优先级。 - 资源库数据编辑历史的字段级快照范围。 - 工单、工单批复、里程碑批复完成或锁定后，资源库同步是否仍可更新对应字段。 ", "domain": "贸易端", "module": "业务对象与数据模型", "tags": "资源库;资源库模板;FlowSpace引用;资源库分享;协作资源库;同步", "sources": [{"title": "【贸易端】【资源库】第一阶段", "version": "V2.4.x", "product_side": "贸易端", "module": "资源库", "last_write_time": "2026-09-04T10:48:14"}, {"title": "【贸易端】【资源库】资源库分享", "version": "V2.5.x", "product_side": "贸易端", "module": "资源库", "last_write_time": "2026-09-04T10:48:03"}, {"title": "【贸易端】【资源库】视图管理", "version": "V2.5.x", "product_side": "贸易端", "module": "资源库", "last_write_time": "2026-09-04T10:48:01"}, {"title": "【贸易端】【资源库】SCCS应用数据范围、数据编辑历史记录", "version": "v2.7", "product_side": "贸易端", "module": "资源库", "last_write_time": "2026-09-04T10:47:57"}, {"title": "【贸易端】【操作日志】所有设置类功能", "version": "V2.4.x", "product_side": "贸易端", "module": "操作日志", "last_write_time": "2026-09-04T10:48:09"}, {"title": "【贸易端】订单引用资源库页面快捷创建资源库数据", "version": "v2.8", "product_side": "贸易端", "module": "贸易端", "last_write_time": "2026-09-04T10:47:51"}, {"title": "【贸易端】资源库数据围栏", "version": "v2.8", "product_side": "贸易端", "module": "贸易端", "last_write_time": "2026-09-04T10:47:47"}]}, {"path": "docs/20-业务对象与数据模型/资源库数据模型.md", "title": "资源库数据模型", "folder": "docs/20-业务对象与数据模型", "text": "# 资源库数据模型  资源库数据模型用于说明资源库模板、团队资源库、协作资源库和引用数据之间的关系。  ## 数据位置  | 数据层级 | 说明 | 关键约束 | | --- | --- | --- | | 资源库模板 | 运营端配置资源库结构 | 决定资源库表单、字段和组件 | | 团队资源库 | 团队内维护的主数据集合 | 可被 FlowSpace、订单、工单引用 | | 协作资源库 | 通过分享或协作开放的数据集合 | 受资源库权限和数据范围控制 | | 资源库记录 | 资源库中的具体数据行 | 可被字段引用、同步或记录历史 | | 引用字段 | FlowSpace 运行数据中的资源库引用 | 必须区分引用关系和写入目标 |  ## 关联文档  - [资源库](./资源库.md) - [资源库模板](./资源库模板.md) - [资源库引用与同步](../30-业务流程与产品流程图/资源库引用与同步.md) - [资源库权限](../40-权限、安全与审计/资源库权限.md) ", "domain": "公共能力", "module": "业务对象与数据模型", "tags": "20-业务对象与数据模型;资源库数据模型", "sources": []}, {"path": "docs/20-业务对象与数据模型/资源库模板.md", "title": "资源库模板", "folder": "docs/20-业务对象与数据模型", "text": " # 资源库模板  ## 1. 功能定位  资源库模板是运营端配置的资源库创建模板，用于定义团队资源库的分组、表单、字段、预览数据和发布版本。贸易端团队基于可见且已发布的资源库模板创建资源库。  ## 2. 使用对象与入口  | 使用对象 | 入口 | 说明 | | --- | --- | --- | | 运营人员 | 运营端 > 模板中心 > 资源库模板 | 创建、编辑、设计、发布、复制和同步资源库模板 | | 贸易端团队 | 贸易端资源库模板中心 | 基于模板创建资源库 | | 实施人员 | 预览数据 | 模拟资源库数据结构和展示 |  ## 3. 核心对象  | 对象 | 说明 | | --- | --- | | 模板基础信息 | 名称、图标、创建类型、所属行业、描述、备注 | | 分组 | 资源库模板中的结构节点 | | 表单 | 分组下的数据表结构 | | 表单字段 | 资源库数据字段 | | 预览数据 | 用于模板中心模拟资源库使用效果 | | 发布态模板 | 贸易端可见和可用于创建资源库的模板版本 | | 同步至团队资源库 | 将模板变更同步到已创建的团队资源库 |  ## 4. 业务流程  flowchart TD A[\"添加资源库模板\"] --> B[\"配置基础信息\"] B --> C[\"添加分组\"] C --> D[\"添加表单并设计字段\"] D --> E[\"录入预览数据\"] E --> F[\"发布模板\"] F --> G[\"贸易端资源库模板中心可见\"] G --> H[\"团队创建资源库\"] D --> I[\"复制模板\"] D --> J[\"同步至团队资源库\"]  ## 5. 权限规则  当前需求主要描述运营端模板管理能力。已确认：  - 只有运营端有模板管理权限的人员可管理资源库模板。 - 系统模板可设置可见团队。 - 模板启用且已发布后，贸易端才可见。  ## 6. 状态与限制  | 状态 | 说明 | 限制 | | --- | --- | --- | | 未发布 | 创建后尚未发布 | 即使启用，贸易端仍不可见 | | 已发布 | 形成可用版本 | 贸易端可使用 | | 只读模式 | 默认查看设计 | 需开启编辑才能修改 | | 启用/未启用 | 模板启用状态 | 需结合发布状态判断贸易端可见性 |  ## 7. 字段、表单与校验  基础信息：  - 模板名称必填，限制 100 字符。 - 模板图标必填。 - 创建类型必填。 - 所属行业必填。 - 模板描述、备注限制 200 字符。  设计规则：  - 创建资源库模板后默认无分组、无表单。 - 分组名称必填，限制 100 字符，需支持国际化。 - 表单名称必填，限制 100 字符，需支持国际化。 - 分组下可创建多个表单。 - 表单设计组件规则引用资源库模板表单设计组件。 - 预览数据按贸易端资源库数据操作逻辑录入。  ## 8. 通知、日志与审计  需要记录：  - 资源库模板新增、编辑、删除。 - 可见范围设置。 - 分组和表单设计变更。 - 发布记录。 - 复制记录。 - 同步至团队资源库记录。  ## 9. 异常与提示  已知提示：  - 选择部分可见团队时，至少选择一个团队。 - 同步至团队资源库需谨慎，以免影响资源库数据展示。 - 与模板有关联的控件更新后，对应业务数据不可被清空。  ## 10. 来源需求  - `source:thoughts-v2-current/v2.3.x/运营端/【运营端】【模板中心】资源库模版管理.md` - `missing-current-source/【运营端】【资源库模版】表单设计组件.md` - `source:thoughts-v2-current/V2.4.x/贸易端/【贸易端】【资源库】第一阶段.md`  ## 11. 待确认问题  - 模板同步至团队资源库时字段删除、字段新增和历史数据保留规则。 - 资源库模板与业务模板的表单组件差异清单。 - 定制模板、用户自建模板是否纳入近期范围。 ", "domain": "运营端", "module": "业务对象与数据模型", "tags": "资源库模板;资源库;模板中心;表单设计", "sources": [{"title": "【运营端】【模板中心】资源库模版管理", "version": "v2.3.x", "product_side": "运营端", "module": "模板中心", "last_write_time": "2026-09-04T10:48:13"}]}, {"path": "docs/20-业务对象与数据模型/通用条件规则.md", "title": "通用条件规则", "folder": "docs/20-业务对象与数据模型", "text": " # 通用条件规则  ## 1. 功能定位  通用条件规则用于统一显隐设置、自动化、标签设置、自定义权限、视图筛选等功能中的条件配置口径。未做特别说明时，可设置条件的字段类型、运算符和值来源以本页为准。  协作团队在主团队 FlowSpace 内设置条件时，协作方控件仅可选择本团队。  ## 2. 可作为条件的字段  可设置条件的字段控件包括：  - 单行文字、多行文字。 - 数字、百分比、评级。 - 单选、多选。 - 定位、地址。 - 日期。 - 成员控件，包括内部成员、协作团队的单选/多选控件；系统字段中的各类操作人也属于成员控件。 - 图片、附件。 - 显示类型为以上类型的公式字段。 - 关联引用中的以上类型字段。 - 子表内以上类型字段。  ## 3. 运算符  | 字段类型 | 运算符 | | --- | --- | | 单行文字、多行文字、单选、多选、定位、成员控件、地址 | 等于、不等于、包含、不包含、为空、不为空 | | 数字、评级、百分比 | 等于、不等于、小于等于、大于等于、为空、不为空 | | 日期 | 等于、早于、晚于、在范围内、为空、不为空 | | 图片、附件 | 为空、不为空 | | 任意字段类型 | 变更时；仅自动化条件支持 |  当运算符选择 `变更时`、`为空`、`不为空` 时，不再展示条件值来源和条件值字段。  ## 4. 条件值来源  条件值来源分为 `其他字段` 和 `自定义`。  选择 `其他字段` 时，可选字段范围包括：  - 系统字段：订单基本信息分组下的系统字段、各里程碑分组下的系统字段。 - 表单字段：订单基本信息、各里程碑批复字段；具体业务功能可按页面范围继续收窄。 - 自定义标签：FlowSpace 设置中添加的主表单和各里程碑标签字段。  选择 `自定义` 时，根据条件字段类型输入或选择对应类型的数据。  ## 5. 其他字段匹配规则  | 当前条件字段类型 | 可选择的其他字段类型 | | --- | --- | | 单行文本、多行文本、定位、地址 | 单行文本、多行文本、数字、百分比、单选、多选、定位、日期、评级、地址，以及关联引用或公式中的这些控件 | | 单选 | 单行文本、多行文本、数字、百分比、单选、定位、日期、评级、关联引用单条数据、公式中的这些控件 | | 多选 | 单行文本、多行文本、数字、百分比、单选、多选、定位、日期、评级、关联引用、公式中的这些控件 | | 成员单选 | 成员单选 | | 成员多选 | 成员单选、成员多选 | | 协作方单选 | 协作方单选 | | 协作方多选 | 协作方单选、协作方多选 | | 日期 | 日期；公式型日期需按日期精度自动补零或截断 | | 数字、百分比、评级 | 数字、百分比、评级，或对应公式字段 | | 其余控件 | 同类型控件，或显示为对应类型的公式控件 |  选择其他字段时，需要过滤当前条件字段本身。  ## 6. 工单字段条件  当条件字段来自工单内字段时，需要展示 `任意工单` / `所有工单` 规则：  | 规则 | 说明 | | --- | --- | | 任意工单 | 订单中任意工单的该字段满足设定规则，即符合条件 | | 所有工单 | 订单中所有工单的该字段均满足设定规则，才符合条件 |  ## 7. 字段删除后的展示  当已被设为条件的字段在运营端被删除时，条件配置中需要将该字段展示为已删除样式，并增加相关提示。该规则用于避免条件仍在运行但配置页面无法识别字段来源。  ## 8. 适用功能  本页规则可被以下能力复用：  - 表单显隐设置。 - 自动化触发条件和执行条件。 - 标签设置条件。 - 自定义权限中的订单范围条件。 - 视图筛选和报表条件中需要复用的字段匹配口径。", "domain": "公共能力", "module": "业务对象与数据模型", "tags": "自定义条件;条件规则;字段类型;运算符", "sources": [{"title": "【通用】自定义条件", "version": "common", "product_side": "公共能力", "module": "", "last_write_time": "2026-09-04T10:47:45"}]}, {"path": "docs/20-业务对象与数据模型/里程碑.md", "title": "里程碑", "folder": "docs/20-业务对象与数据模型", "text": " # 里程碑  ## 1. 功能定位  里程碑是订单流程中的阶段节点，用于承载阶段计划、负责人、标签、里程碑批复和工单。里程碑结构来自业务模板，运行态计划和状态在 FlowSpace 与订单中生效。  ## 2. 使用对象与入口  | 使用对象 | 入口 | 说明 | | --- | --- | --- | | 运营人员 | 业务模板设计 | 配置里程碑名称、批复设置、表单、按钮文案等 | | FlowSpace 管理员 | FlowSpace 设置 > 里程碑计划 | 配置计划起止时间计算规则 | | FlowSpace 成员 | 订单详情 | 查看里程碑、创建工单、完成/取消/重启里程碑 | | 协作成员 | 订单详情或采集端任务 | 在授权范围内处理里程碑相关批复或工单 |  ## 3. 核心对象  | 对象 | 说明 | | --- | --- | | 里程碑模板 | 业务模板中定义的流程节点 | | 里程碑实例 | 某个订单中的具体里程碑 | | 里程碑计划 | 计划开始、计划结束、计划耗时及其计算规则 | | 里程碑负责人 | 负责当前订单下对应里程碑的成员，可选择已加入当前 FlowSpace 的主团队成员或协作团队成员 | | 里程碑状态 | 未开始、进行中、已完成、已取消 | | 里程碑批复 | 对阶段结果进行确认的批复数据 | | 里程碑标签 | 根据条件展示在里程碑上的业务标记 | | 里程碑互用 | 将里程碑数据复用于其他订单 |  ## 4. 业务流程  stateDiagram-v2 [*] --> 未开始: 创建订单 未开始 --> 进行中: 创建首个工单或状态推进 进行中 --> 已完成: 完成里程碑 未开始 --> 已取消: 取消里程碑 进行中 --> 已取消: 取消里程碑 已完成 --> 进行中: 重启里程碑 已取消 --> 进行中: 重启里程碑  ## 5. 权限规则  | 操作 | 权限要求 | 状态限制 | | --- | --- | --- | | 查看里程碑 | 有里程碑下任意工单查看权限或里程碑批复查看权限 | 受数据围栏影响 | | 创建工单 | 有当前里程碑创建工单权限 | 里程碑未开始或进行中，订单进行中 | | 修改里程碑状态 | 有当前里程碑修改状态权限 | 按状态机限制 | | 里程碑批复 | 当前批复人或有对应权限成员 | 依模板配置和状态限制 | | 修改处理人 | 有修改处理人权限 | 仅进行中相关对象 | | 里程碑互用 | 有里程碑互用权限 | 已完成/已取消等状态下受限 |  里程碑负责人选择协作成员后，该成员拥有该订单对应里程碑下的所有操作权限。里程碑负责人也可在 FlowSpace 数据移交中作为单一负责人类角色移交，仅可配置一名接收成员。  ## 6. 状态与限制  | 状态 | 说明 | 关键限制 | | --- | --- | --- | | 未开始 | 订单创建后尚未推进 | 可创建工单，可取消 | | 进行中 | 已开始执行 | 可创建工单、采集、批复、完成或取消 | | 已完成 | 阶段结束 | 不可创建工单、采集、批复、指派；可按权限重启 | | 已取消 | 阶段取消 | 不可创建工单、采集、批复、指派；可按权限重启 |  计划标签：  - 实际开始与计划开始对比可展示延迟或提前。 - 实际完成与计划结束对比可展示延迟或提前。 - 数据围栏会影响里程碑标签和字段展示。  ## 7. 字段、表单与校验  里程碑计划设置：  - 计划开始或计划结束可基于主表单日期字段、其他里程碑实际开始/结束时间计算。 - 可设置当天、之前、之后和正整数天数。 - 计划耗时只允许正整数。 - 计划开始和计划结束互推公式： - 计划结束时间 = 计划开始时间 + 计划耗时 - 1 - 计划开始时间 = 计划结束时间 - 计划耗时 + 1 - 任一时间设置不为空时，其余字段需完整，否则提示请完善时间设置。  模板属性：  - 里程碑名称必填，限制 100 字符。 - 可配置是否需要里程碑批复、工单批复。 - 可配置默认批复人。 - 可配置创建工单按钮、工单采集按钮文案。 - 支持部分内容国际化。  ## 8. 通知、日志与审计  需要记录：  - 里程碑状态变更。 - 里程碑批复创建、指派、提交、修改处理人。 - 里程碑互用和取消互用。 - 里程碑计划配置变更。 - 自动化更新里程碑相关数据。 - 里程碑负责人数据移交成功后，需要写入订单跟踪记录。  ## 9. 异常与提示  已知提示方向：  - 里程碑已完成，不可创建/编辑/处理工单。 - 里程碑已取消，不可创建/编辑/处理工单。 - 里程碑已重启，可继续创建或编辑。 - 请完善时间设置。 - 暂无权限，请联系管理员。  ## 10. 来源需求  - `source:thoughts-v2-current/v2.1.x/贸易端/【贸易端】【SCCS设置】.md` - `source:thoughts-v2-current/v2.2.x/贸易端/【贸易端】【订单详情】查看&操作.md` - `source:thoughts-v2-current/v2.2.x/贸易端/【贸易端】【订单详情】工单&里程碑批复操作.md` - `source:thoughts-v2-current/v2.3.x/贸易端/【贸易端】【订单管理】里程碑互用功能.md` - `source:thoughts-v2-current/v2.0.x/运营端/【运营端】【模板中心】业务模版管理.md` - `source:thoughts-v2-current/v2.8/贸易端/【贸易端】FS 数据移交.md`  ## 11. 待确认问题  - 重启里程碑后状态应还原为进行中还是完成/取消前状态。 - 订单完成时，未开始和已取消里程碑是否保持原状态的完整规则。 - 里程碑互用状态限制需要从互用需求继续细化。", "domain": "贸易端", "module": "里程碑", "tags": "里程碑;计划;状态;里程碑批复", "sources": [{"title": "【贸易端】【SCCS设置】", "version": "v2.1.x", "product_side": "贸易端", "module": "SCCS设置", "last_write_time": "2026-09-04T10:48:45"}, {"title": "【贸易端】【订单详情】查看&操作", "version": "v2.2.x", "product_side": "贸易端", "module": "订单详情", "last_write_time": "2026-09-04T10:48:34"}, {"title": "【贸易端】【订单详情】工单&里程碑批复操作", "version": "v2.2.x", "product_side": "贸易端", "module": "订单详情", "last_write_time": "2026-09-04T10:48:34"}, {"title": "【贸易端】【订单管理】里程碑互用功能", "version": "v2.3.x", "product_side": "贸易端", "module": "订单管理", "last_write_time": "2026-09-04T10:48:22"}, {"title": "【贸易端】FS 数据移交", "version": "v2.8", "product_side": "贸易端", "module": "贸易端", "last_write_time": "2026-09-04T10:47:56"}]}, {"path": "docs/30-业务流程与产品流程图/README.md", "title": "30 业务流程与产品流程图", "folder": "docs/30-业务流程与产品流程图", "text": "# 30 业务流程与产品流程图  本目录用于沉淀端到端业务流程、状态流转、跨端协作路径和 Mermaid 流程图索引。  ## 页面  - [从模板到 FlowSpace](./从模板到FlowSpace.md) - [订单生命周期](./订单生命周期.md) - [工单采集与批复](./工单采集与批复.md) - [资源库引用与同步](./资源库引用与同步.md) - [跨团队协作](./跨团队协作.md) - [流程图索引](./流程图索引.md) - [自动化执行](./自动化执行.md) - [移动端采集](./移动端采集.md) - [订单复用关系](./订单复用关系.md) ", "domain": "公共能力", "module": "业务流程与产品流程图", "tags": "30-业务流程与产品流程图;30 业务流程与产品流程图", "sources": []}, {"path": "docs/30-业务流程与产品流程图/从模板到FlowSpace.md", "title": "从模板到FlowSpace", "folder": "docs/30-业务流程与产品流程图", "text": " # 从模板到 FlowSpace  ## 1. 流程定位  本流程描述运营端业务模板如何成为贸易端可使用的 FlowSpace，并在 FlowSpace 运行态中继续配置成员、角色、数据围栏、里程碑计划、标签和更多业务设置。  ## 2. 流程图  flowchart TD A[\"运营端创建业务模板\"] --> B[\"配置基础信息\"] B --> C[\"设计主表单、里程碑、工单表单、批复表单\"] C --> D[\"配置订单标识、PDF导入、第三方配置、预览数据\"] D --> E[\"发布模板\"] E --> F{\"模板是否启用且已发布\"} F -->|是| G[\"贸易端模板中心可见\"] F -->|否| H[\"贸易端不可见\"] G --> I[\"团队使用模板创建 FlowSpace\"] I --> J[\"FlowSpace 设置成员、角色、协作团队、数据围栏\"] J --> K[\"配置里程碑计划、标签、订单标识、取消原因\"] K --> L[\"进入订单业务执行\"]  ## 3. 阶段说明  | 阶段 | 关键动作 | 结果 | | --- | --- | --- | | 模板创建 | 添加业务模板，配置名称、图标、创建类型、行业、描述、备注 | 生成未发布模板 | | 模板设计 | 设计主表单、里程碑、工单表单、批复表单 | 确定 FlowSpace 的业务结构 | | 模板发布 | 发布模板并设置可见范围 | 贸易端可见的前置条件 | | FlowSpace 创建 | 贸易端团队选择模板创建 FlowSpace | 生成业务空间 | | FlowSpace 运行态设置 | 设置角色、成员、数据围栏、计划、标签、更多设置 | 形成可执行业务环境 |  ## 4. 权限规则  - 运营端模板管理权限决定谁可创建、编辑、发布、复制和同步业务模板。 - 模板可见范围决定哪些团队可在贸易端模板中心看到模板。 - 贸易端团队角色中的“创建 FlowSpace”权限决定谁可创建 FlowSpace。 - FlowSpace 创建后，FlowSpace 内业务权限由 FlowSpace 业务角色和协作方角色控制。  ## 5. 状态与限制  | 对象 | 状态 | 规则 | | --- | --- | --- | | 业务模板 | 未发布 | 即使启用，贸易端也不可见 | | 业务模板 | 已发布 | 可按可见范围在贸易端展示 | | 业务模板 | 已编辑 | 与已发布版本不一致，需要提示发布 | | FlowSpace | 已创建 | 基于创建时模板生成运行态结构 | | FlowSpace 模板同步 | 同步至未发布状态的 FlowSpace 模板 | 需谨慎处理字段关联和业务数据 |  ## 6. 数据与表单影响  模板定义以下内容：  - 订单主表单。 - 里程碑。 - 工单采集表单。 - 工单批复表单。 - 里程碑批复表单。 - 订单标识默认配置。 - PDF 导入设置。 - 第三方数据对接配置。 - 预览数据。  同步至 FlowSpace 时，需确认新增字段、删除字段、字段关联关系和历史业务数据保留规则。  ## 7. 日志与追溯  需要记录：  - 模板创建、编辑、删除。 - 模板发布。 - 模板可见范围设置。 - 模板复制。 - 同步至 FlowSpace。 - FlowSpace 创建。 - FlowSpace 设置变更。  ## 8. 待确认问题  - 业务模板同步至已创建 FlowSpace 时，字段删除后的历史业务数据如何保留。 - FlowSpace 内模板是否存在发布态/未发布态的完整状态机。 - 用户自建模板和定制模板是否纳入当前流程。  ## 9. 来源需求  - `source:thoughts-v2-current/v2.0.x/运营端/【运营端】【模板中心】业务模版管理.md` - `source:thoughts-v2-current/v2.0.x/贸易端/【贸易端】【工作台】工作台、创建SCCS、SCCS分组.md` - `source:thoughts-v2-current/v2.1.x/贸易端/【贸易端】【SCCS设置】.md`", "domain": "公共能力", "module": "业务流程与产品流程图", "tags": "业务模板;FlowSpace;模板发布;模板同步", "sources": [{"title": "【运营端】【模板中心】业务模版管理", "version": "v2.0.x", "product_side": "运营端", "module": "模板中心", "last_write_time": "2026-09-04T10:48:49"}, {"title": "【贸易端】【工作台】工作台、创建SCCS、SCCS分组", "version": "v2.0.x", "product_side": "贸易端", "module": "工作台", "last_write_time": "2026-09-04T10:48:46"}, {"title": "【贸易端】【SCCS设置】", "version": "v2.1.x", "product_side": "贸易端", "module": "SCCS设置", "last_write_time": "2026-09-04T10:48:45"}]}, {"path": "docs/30-业务流程与产品流程图/工单采集与批复.md", "title": "工单采集与批复", "folder": "docs/30-业务流程与产品流程图", "text": " # 工单采集与批复  ## 1. 流程定位  本流程描述工单从创建、设置处理人、协作方指派、采集提交、工单批复，到里程碑批复的执行链路。  ## 2. 流程图  flowchart TD A[\"创建工单\"] --> B[\"设置采集人、工单批复人、里程碑批复人\"] B --> C{\"采集人为协作团队负责人模式\"} C -->|是| D[\"协作方有指派权限成员指派具体成员\"] C -->|否| E[\"采集人直接处理\"] D --> E E --> F[\"提交工单采集\"] F --> G{\"模板是否需要工单批复\"} G -->|是| H[\"工单批复人提交批复\"] G -->|否| I[\"工单采集链路结束\"] H --> I I --> J{\"模板是否需要里程碑批复\"} J -->|是| K[\"里程碑批复人提交批复\"] J -->|否| L[\"进入里程碑推进\"] K --> L  ## 3. 阶段说明  | 阶段 | 关键规则 | | --- | --- | | 创建工单 | 里程碑未开始或进行中，且用户有创建工单权限 | | 设置处理人 | 可选择成员、协作团队负责人或具体协作成员 | | 采集指派 | 协作方负责人模式下，由有指派权限成员指派具体成员 | | 工单采集 | 采集人填写可编辑表单并提交 | | 工单批复 | 模板需要工单批复时执行 | | 里程碑批复 | 模板需要里程碑批复时执行 |  ## 4. 权限与状态限制  不可处理的典型场景：  - 订单已删除。 - 订单已完成或已取消。 - 里程碑已完成或已取消。 - 工单已终止采集。 - 工单已批复。 - 工单已删除。 - 采集人或可编辑表单权限已变化。 - 多人并发提交后当前页面未刷新。  ## 5. 表单与校验  创建工单时：  - 一次最多创建 10 条。 - 至少保留一个非隐藏表单。 - 工单名称必填，默认自动编号。 - 采集人、工单批复人、里程碑批复人按模板要求校验。 - 未设置采集人的表单需要校验必填字段。  采集提交时：  - 当前用户只可编辑自己负责的表单。 - 必填项和字段格式按运营端配置校验。 - 其他人提交后，当前页面需刷新才能继续提交。  ## 6. 通知与日志  | 事件 | 通知/记录 | | --- | --- | | 创建工单 | 通知采集处理成员或协作团队负责人；写入工单动态 | | 采集指派 | 通知被指派成员；写入工单动态 | | 采集提交 | 通知发起人或批复人；写入动态和历史记录 | | 工单批复 | 写入工单批复动态和历史记录 | | 里程碑批复 | 写入里程碑批复动态和历史记录 | | 终止采集 | 写入动态 | | 自动化创建工单 | 操作人为机器人，写入动态和跟踪记录 |  ## 7. 待确认问题  - 终止采集是否可恢复。 - 工单批复后，自动化或资源库同步是否仍可更新采集字段。 - 采集端与贸易端的全部提示文案是否一致。  ## 8. 来源需求  - `source:thoughts-v2-current/v2.2.x/贸易端/【贸易端】【订单详情】工单&里程碑批复操作.md` - `source:thoughts-v2-current/v2.3.x/采集端/【采集端】【任务详情页】工单、工单批复、里程碑批复详情页.md` - `source:thoughts-v2-current/v2.3.x/采集端/【采集端】【任务列表】工单、工单批复、里程碑批复任务列表.md`", "domain": "贸易端", "module": "业务流程与产品流程图", "tags": "工单;采集;批复;指派", "sources": [{"title": "【贸易端】【订单详情】工单&里程碑批复操作", "version": "v2.2.x", "product_side": "贸易端", "module": "订单详情", "last_write_time": "2026-09-04T10:48:34"}, {"title": "【采集端】【任务详情页】工单、工单批复、里程碑批复详情页", "version": "v2.3.x", "product_side": "采集端", "module": "任务详情页", "last_write_time": "2026-09-04T10:48:26"}]}, {"path": "docs/30-业务流程与产品流程图/流程图索引.md", "title": "流程图索引", "folder": "docs/30-业务流程与产品流程图", "text": "# 流程图索引  本页用于集中索引业务流程图和可复用 Mermaid 代码。  ## 当前流程入口  - [从模板到 FlowSpace](./从模板到FlowSpace.md) - [订单生命周期](./订单生命周期.md) - [工单采集与批复](./工单采集与批复.md) - [资源库引用与同步](./资源库引用与同步.md) - [跨团队协作](./跨团队协作.md) - [自动化执行](./自动化执行.md) - [移动端采集](./移动端采集.md) - [订单复用关系](./订单复用关系.md)  ## 维护规则  1. Mermaid 代码保留在文档中，站点提供预览能力。 2. 流程图必须说明起点、终点、关键判断和异常分支。 3. 图形更新后同步检查对应业务对象、权限、日志和数据模型页面。 ", "domain": "公共能力", "module": "业务流程与产品流程图", "tags": "30-业务流程与产品流程图;流程图索引", "sources": []}, {"path": "docs/30-业务流程与产品流程图/移动端采集.md", "title": "移动端采集", "folder": "docs/30-业务流程与产品流程图", "text": " # 移动端采集  ## 1. 流程定位  移动端采集是采集端承接贸易端任务的执行流程，主要用于查看和处理工单、工单批复、里程碑批复任务，并支持首页统计、任务列表、搜索、详情、消息和个人中心。  ## 2. 流程图  flowchart TD A[\"登录采集端\"] --> B[\"进入首页\"] B --> C[\"查看我的任务、团队待指派、我关注、FlowSpace待办\"] C --> D[\"进入任务列表\"] D --> E{\"任务类型\"} E -->|工单| F[\"进入工单详情并采集\"] E -->|工单批复| G[\"进入工单批复详情并批复\"] E -->|里程碑批复| H[\"进入里程碑批复详情并批复\"] F --> K{\"图片组件是否需要上传\"} K -->|拍照| L[\"拍照预览：使用、编辑或重拍\"] K -->|相册| M[\"多选图片并加入组件\"] L --> N[\"标注、脱敏并上传图片\"] M --> N N --> I[\"图片上传完成后提交或关注任务\"] G --> I H --> I I --> J[\"同步贸易端任务状态和数据\"]  ## 3. 首页  首页展示：  - 我的任务。 - 团队待指派任务。 - 我关注任务。 - FlowSpace 任务数据。 - 团队切换列表中的待办数量。 - 底部导航任务待办数。  FlowSpace 数据：  - 订单：该团队下需要我处理的任务对应订单数。 - 任务：该团队下需要我处理的任务数。 - 里程碑数字：对应里程碑需要我处理的任务数。 - 待办数：进行中的待办工单、里程碑批复、工单批复。 - 外部协作标识：非本团队 FlowSpace 需展示协作标识和所属团队信息。  ## 4. 任务列表  | 列表 | 规则 | | --- | --- | | 进行中任务 | 包含待办和已处理任务 | | 已完成任务 | 里程碑完成/取消、工单已批复、工单终止采集等 | | 我发起任务 | 发起人为本人的工单或批复 | | 团队指派任务 | 有指派权限的待指派、已指派、已完成任务 | | 我关注任务 | 本人关注的任务 |  任务需排除互用自的工单，仅展示正常创建的工单。  ## 5. 待办与已处理判断  进行中待办：  - 里程碑批复：里程碑进行中且处理人未提交。 - 工单批复：里程碑进行中且处理人未提交。 - 工单：里程碑进行中、无工单批复、未终止，且处理人未提交。 - 协作工单/批复指派：可编辑、未提交、未指派、且有指派权限。  进行中已处理：  - 里程碑批复：里程碑进行中且处理人已提交。 - 工单批复：里程碑进行中且处理人已提交。 - 工单：里程碑进行中、无工单批复、未终止，且处理人已提交。 - 协作工单/批复指派：可编辑、有指派权限，且已提交或已指派。  ## 6. 操作规则  - 支持下拉刷新、上拉加载更多。 - 多 Tab 点击切换。 - 超过两屏高度出现返回顶部按钮。 - 搜索跳转任务搜索页。 - 点击任务进入对应详情页。 - 点击关注后进入我关注列表。 - 点击团队名称可切换团队，切换后任务列表同步切换。  ## 7. 图片采集与上传  - 图片组件适用于工单、工单批复和里程碑批复。 - 拍照完成后进入单图预览，可直接使用、编辑或重拍。 - 相册支持多选，选择数量不超过组件剩余可上传数量。 - 图片编辑支持方框、文字、马赛克、撤销、清空和重新编辑。 - 编辑后的图片替换当前图片，数量和顺序不变。 - 每张图片独立展示待上传、上传中、上传成功或上传失败状态。 - 编辑已上传图片时，重新上传成功前保留原图片。 - 图片未上传完成时不允许提交表单；上传失败时保留本地图片并允许重新上传。  详细规则见 [采集端图片编辑](../10-功能模块详情/采集端图片编辑.md)。  ## 8. 与贸易端同步  采集端处理的工单、工单批复、里程碑批复数据需与贸易端实时同步。采集端状态限制应与贸易端保持一致：  - 订单已完成/取消时不可继续处理。 - 里程碑已完成/取消时不可继续处理。 - 工单已终止或已批复时不可继续采集。 - 权限变化后跳转或提交需提示暂无权限或刷新。  ## 9. 待确认问题  - 采集端是否完整覆盖贸易端所有状态限制和提示文案。 - 离线或弱网场景是否支持草稿或重试。 - 采集端任务关注、搜索、消息之间的数据同步频率。 - 弱网或离线场景下图片编辑结果和上传队列是否持久化。  ## 10. 来源需求  - `source:thoughts-v2-current/v2.3.x/采集端/【采集端】【首页】任务相关数据展示.md` - `source:thoughts-v2-current/v2.3.x/采集端/【采集端】【任务列表】工单、工单批复、里程碑批复任务列表.md` - `source:thoughts-v2-current/v2.3.x/采集端/【采集端】【任务详情页】工单、工单批复、里程碑批复详情页.md` - `source:thoughts-v2-current/v2.3.x/采集端/【采集端】【任务搜索页】工单、工单批复、里程碑批复任务搜索.md` - `source:thoughts-v2-current/v2.7/采集端/采集端图片编辑功能.md`", "domain": "采集端", "module": "业务流程与产品流程图", "tags": "采集端;任务;工单;批复;图片上传;图片编辑", "sources": [{"title": "【采集端】【首页】任务相关数据展示", "version": "v2.3.x", "product_side": "采集端", "module": "首页", "last_write_time": "2026-09-04T10:48:24"}, {"title": "【采集端】【任务列表】工单、工单批复、里程碑批复任务列表", "version": "v2.3.x", "product_side": "采集端", "module": "任务列表", "last_write_time": "2026-09-04T10:48:25"}, {"title": "【采集端】【任务详情页】工单、工单批复、里程碑批复详情页", "version": "v2.3.x", "product_side": "采集端", "module": "任务详情页", "last_write_time": "2026-09-04T10:48:26"}, {"title": "【采集端】【任务搜索页】工单、工单批复、里程碑批复任务搜索", "version": "v2.3.x", "product_side": "采集端", "module": "任务搜索页", "last_write_time": "2026-09-04T10:48:26"}, {"title": "采集端图片编辑功能", "version": "v2.7", "product_side": "采集端", "module": "采集端", "last_write_time": "2026-09-04T10:47:57"}]}, {"path": "docs/30-业务流程与产品流程图/系统自动计算与更新规则.md", "title": "系统自动计算与更新规则", "folder": "docs/30-业务流程与产品流程图", "text": " # 系统自动计算与更新规则  ## 1. 功能定位  系统自动计算与更新规则用于统一约束自动化、公式自动计算、TODAY 公式、定时任务等系统写入行为。系统自动能力不能绕过订单、里程碑、工单等业务对象的状态限制。  ## 2. 自动化写入状态  | 自动化动作 | 可写入或可执行状态 | 不可写入或不执行状态 | 说明 | | --- | --- | --- | --- | | 发送通知 | 自动化启用、触发条件命中、通知对象有效 | 自动化未启用、配置不完整、触发数据失效 | 通知不改业务数据，但需要记录自动化执行日志 | | 新增工单 | 订单进行中；里程碑未开始或进行中 | 订单已完成、已取消、已删除；里程碑已完成、已取消；里程碑互用自其他订单；处理人为空；必填默认值为空 | 当前自动化新增数据主要用于创建里程碑工单 | | 更新订单基本信息 | 订单进行中 | 订单已完成、已取消、已删除 | 更新后写入订单历史或跟踪记录，操作人显示为自动化或系统身份 | | 更新里程碑批复字段 | 订单进行中；里程碑进行中 | 订单已完成、已取消、已删除；里程碑已完成、已取消；里程碑互用自其他订单 | 里程碑批复没有批复锁定状态，不按批复是否提交拦截 | | 更新工单采集字段 | 订单进行中；里程碑未开始或进行中；工单未批复、未终止采集 | 订单已完成、已取消、已删除；里程碑已完成、已取消；工单已批复、已终止采集、已删除；工单互用自其他订单 | 工单采集字段限制最强，工单结束后不应继续自动改写采集数据 | | 更新工单批复字段 | 订单进行中；里程碑进行中 | 订单已完成、已取消、已删除；里程碑已完成、已取消；工单已删除；工单互用自其他订单 | 工单批复没有批复锁定状态，不按批复是否提交拦截 | | 定时任务新增或更新 | 命中订单筛选或记录范围，且目标对象状态允许 | 设置时间不存在；对象状态不允许；记录范围未命中 | 时间不存在时不执行，且不算执行失败 |  ## 3. 公式自动计算  | 公式所在数据源 | 未开启自动计算 | 开启自动计算后的可更新状态 | 开启自动计算后的不可更新状态 | 日志与动态 | | --- | --- | --- | --- | --- | | 订单主表单 | 用户编辑订单主表单时实时计算，提交后固化 | 订单进行中 | 订单已完成、已取消、已删除 | 写入订单主表单历史记录；必要时写系统自动执行日志 | | 里程碑批复表单 | 用户编辑里程碑批复时实时计算，提交后固化 | 订单进行中；里程碑进行中 | 订单已完成、已取消、已删除；里程碑已完成、已取消 | 写入里程碑批复动态或历史记录；操作人显示系统或公式自动计算 | | 工单采集表单 | 用户编辑工单采集表单时实时计算，提交后固化 | 订单进行中；里程碑未开始或进行中；工单未批复、未终止采集 | 订单已完成、已取消、已删除；里程碑已完成、已取消；工单已批复、已终止采集、已删除 | 写入工单动态或采集历史记录；操作人显示系统或公式自动计算 | | 工单批复表单 | 用户编辑工单批复表单时实时计算，提交后固化 | 订单进行中；里程碑进行中 | 订单已完成、已取消、已删除；里程碑已完成、已取消；工单已删除 | 写入工单批复动态或历史记录；操作人显示系统或公式自动计算 |  未开启自动计算时，公式只在用户编辑当前表单期间实时计算，提交后不再随变量变化更新。开启自动计算后，公式变成系统自动写入能力，需要按公式所在数据源判断是否允许更新。  ## 4. TODAY 特殊规则  当公式中直接包含 `TODAY`，或公式变量因子引用的其他公式中包含 `TODAY` 时，该公式视为 TODAY 公式。TODAY 公式默认进入系统自动计算范围，即使未开启普通公式自动计算，也会随日期变化自动重新计算。  ## 5. 资源库公式  资源库表单公式变量只来自当前表单，没有跨表单变量，因此不存在变量变更后系统自动重算并回写的实际意义。资源库公式按普通表单编辑逻辑处理：用户编辑资源库记录时实时计算，提交后固化，不纳入公式自动计算状态限制表。  ## 6. 统一规则  - 自动化可写入的前提是目标业务对象仍处于可流转状态。 - 订单结束、里程碑结束、工单采集结束后，自动化、公式自动计算、TODAY 公式和定时任务都不能绕过状态限制继续改写业务字段。 - 通知类动作不改业务数据，但仍需记录自动化执行日志。 - 设置时间不存在
