  <style>
    :root {
      --bg:#fbfaf8; --panel:#fff; --soft:#f7f6f3; --hover:#f1f0ee;
      --text:#2f3437; --muted:#787774; --faint:#a8a29e;
      --line:#e7e2dc; --line-strong:#d8d1c8; --accent:#6b5f4b;
      --accent-soft:#eee9df; --code:#f3f0eb; --focus:#9b8b72;
      --shadow:0 18px 50px rgba(47,52,55,.08);
    }
    * { box-sizing:border-box; }
    html { min-height:100%; }
    body { min-height:100%; margin:0; color:var(--text); background:var(--bg); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif; letter-spacing:0; }
    header { position:fixed; inset:0 auto 0 0; z-index:3; width:292px; height:100vh; display:flex; flex-direction:column; gap:14px; padding:14px 12px; background:var(--soft); border-right:1px solid var(--line); }
    header h1 { display:flex; align-items:center; gap:10px; min-height:38px; margin:0; padding:4px 8px; font-size:15px; line-height:1.2; font-weight:650; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    header h1::before { content:"L"; width:24px; height:24px; display:grid; place-items:center; flex:0 0 auto; border:1px solid var(--line-strong); border-radius:6px; background:var(--panel); color:var(--accent); font-family:Georgia,"Times New Roman",serif; font-weight:700; font-size:15px; }
    #search { width:100%; height:34px; padding:7px 10px; border:1px solid transparent; border-radius:6px; color:var(--text); background:var(--hover); outline:none; font-size:14px; }
    #search:focus { background:var(--panel); border-color:var(--focus); box-shadow:0 0 0 3px rgba(155,139,114,.14); }
    main { display:grid; grid-template-columns:292px minmax(0,1fr); min-height:100vh; }
    nav { position:fixed; inset:100px auto 0 0; z-index:4; width:292px; overflow:auto; padding:0 14px 18px; scrollbar-width:thin; scrollbar-color:var(--line-strong) transparent; }
    nav::before { content:"页面目录"; display:block; padding:4px 8px 8px; color:var(--muted); font-size:12px; font-weight:650; }
    nav a { display:grid; gap:2px; padding:6px 8px; margin:1px 0; color:var(--text); text-decoration:none; border-radius:6px; font-size:14px; line-height:1.35; }
    nav a:hover { background:var(--hover); }
    nav a.active { background:var(--accent-soft); color:#3d392f; font-weight:620; }
    nav .doc-title, nav .folder { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    nav .folder { display:block; color:var(--muted); font-size:12px; margin-top:1px; }
    .meta { position:sticky; top:0; z-index:2; grid-column:2; height:48px; display:flex; align-items:center; padding:0 52px; color:var(--muted); font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; background:rgba(251,250,248,.86); border-bottom:1px solid rgba(231,226,220,.72); backdrop-filter:blur(14px); }
    article { grid-column:2; width:min(100%, 940px); margin:0 auto; padding:44px 52px 88px; background:var(--bg); }
    article h1, article h2, article h3, article h4 { color:var(--text); line-height:1.25; letter-spacing:0; scroll-margin-top:72px; }
    article h1 { margin:0 0 22px; font-family:Georgia,"Times New Roman","Songti SC",serif; font-size:40px; font-weight:700; }
    article h2 { margin:38px 0 14px; padding-top:6px; border-top:1px solid var(--line); font-size:23px; font-weight:680; }
    article h3 { margin:26px 0 10px; font-size:18px; font-weight:680; }
    article h4 { margin:22px 0 8px; font-size:16px; font-weight:650; }
    article p, article li { color:var(--text); font-size:15px; line-height:1.78; }
    article p { margin:10px 0; }
    article ul, article ol { padding-left:1.45em; margin:10px 0 16px; }
    article li + li { margin-top:4px; }
    article a { color:#6f5f43; text-decoration:underline; text-decoration-color:#d7c7aa; text-underline-offset:3px; }
    article blockquote { margin:18px 0; padding:2px 0 2px 16px; color:var(--muted); border-left:3px solid var(--line-strong); }
    article table { display:block; width:100%; margin:18px 0 24px; overflow:auto; border-collapse:collapse; font-size:14px; }
    article th, article td { min-width:120px; border:1px solid var(--line); padding:8px 10px; vertical-align:top; line-height:1.55; background:var(--panel); }
    article th { color:#4f4a43; background:var(--soft); font-weight:650; }
    article code { padding:2px 5px; border-radius:4px; background:var(--code); color:#5c4b35; font-size:.92em; }
    article pre { margin:18px 0; padding:16px; overflow:auto; border:1px solid var(--line); border-radius:8px; background:#282522; color:#f7f3ec; }
    article pre code { padding:0; background:transparent; color:inherit; }
    article .mermaid {
      margin:20px 0 26px;
      padding:18px;
      overflow:auto;
      border:1px solid var(--line);
      border-radius:8px;
      background:var(--panel);
    }
    article .mermaid svg { max-width:100%; height:auto; }
    .empty-state { margin:10px 8px; padding:12px; color:var(--muted); border:1px dashed var(--line-strong); border-radius:8px; font-size:13px; line-height:1.5; }
    @media (max-width:900px) {
      header { position:sticky; top:0; width:100%; height:auto; padding:12px 14px; border-right:0; border-bottom:1px solid var(--line); }

      nav { position:relative; inset:auto; width:100%; max-height:36vh; padding:8px 14px 12px; border-bottom:1px solid var(--line); background:var(--soft); }

      article { padding:30px 20px 72px; }
      article h1 { font-size:31px; }
      article h2 { font-size:21px; }
    }

    const docs = [{"path": "00-知识库维护规范.md", "title": "知识库维护规范", "folder": ".", "text": "# 知识库维护规范  ## 1. 知识库定位  本知识库用于沉淀 Linkincrease 的当前产品共识。原始需求文档、会议纪要、原型和临时讨论可以作为来源，但不能直接等同于知识库结论。  知识库正文应回答：  - 这个对象或功能是什么。 - 谁使用它。 - 入口在哪里。 - 业务流程是什么。 - 权限和状态限制是什么。 - 数据、表单、通知、日志如何流转。 - 结论来自哪些需求文档。  ## 2. 内容入库原则  | 原则 | 说明 | | --- | --- | | 可追溯 | 每个结论都应能追溯到需求文档、评审结论或线上行为 | | 去重复 | 同一规则跨多份需求出现时，只保留一处权威定义 | | 按对象归并 | 优先按 FlowSpace、订单、里程碑、工单、资源库等业务对象组织 | | 权限单列 | 权限规则不混在页面说明里，需要沉淀到权限章节 | | 状态单列 | 状态枚举、状态变更、状态限制需要统一维护 | | 不确定不硬写 | 未确认内容进入问题池，确认后再合入正式页面 |  ## 3. 推荐页面模板  # 功能或对象名称  ## 1. 功能定位 ## 2. 使用对象与入口 ## 3. 核心对象 ## 4. 业务流程 ## 5. 权限规则 ## 6. 状态与限制 ## 7. 字段、表单与校验 ## 8. 通知、日志与审计 ## 9. 异常提示 ## 10. 来源需求 ## 11. 待确认问题  ## 4. 更新流程  1. 将新增或更新需求同步到 `最新需求源（source:thoughts-v2-current）`；维护人本地目录由 `LINKINCREASE_SOURCE_PATH` 指定。 2. 运行 `python scripts\\scan_source_manifest.py` 更新 `metadata/source-manifest.csv` 和 `metadata/source-diff.csv`。 3. 在 [05-需求文档来源台账.md](./05-需求文档来源台账.md) 中登记来源和归属模块。 4. 判断该需求是新增对象、补充规则、调整权限、调整状态，还是修正文案。 5. 更新对应知识页。 6. 如果影响核心术语，同步更新 [02-核心概念词典.md](./02-核心概念词典.md)。 7. 如果影响功能边界，同步更新 [03-功能地图.md](./03-功能地图.md)。 8. 如果有冲突或待确认项，记录到 [99-待办与问题池.md](./99-待办与问题池.md)。  ## 5. 冲突处理规则  | 冲突类型 | 处理方式 | | --- | --- | | 新旧需求冲突 | 标出两份来源，优先找产品确认，不自行猜测 | | 页面描述与权限描述冲突 | 以权限矩阵或最新权限需求为准，待确认前进入问题池 | | 贸易端与采集端行为不一致 | 分别记录端差异，不强行统一 | | 运营端配置与贸易端运行态冲突 | 分别记录“配置态”和“运行态”，再确认转换规则 | | 状态限制不一致 | 统一沉淀到状态章节，来源页保留引用 |  ## 6. 命名规范  - 业务对象使用统一名称：FlowSpace、订单、里程碑、工单、资源库、业务模板、资源库模板。 - 原需求中出现“模版”和“模板”时，知识库正文统一使用“模板”，文件名保留原样。 - 原需求中出现 SCCS 时，知识库正文统一映射为 FlowSpace（流空间）；来源文件名、`source:` 引用和导出文件名保留原始 SCCS，以便追溯。 - 更名原因：FlowSpace 比 SCCS 更直观，英文名称可直接联想到业务“流”与协作“空间”，降低新成员理解成本。 - 文档标题尽量使用“对象 + 主题”，例如 `订单-生命周期与状态规则.md`。  ## 7. 质量检查  每次更新后检查：  - 是否能从 README 入口找到该内容。 - 是否已登记来源。 - 是否有权限、状态、通知、日志遗漏。 - 是否把临时待确认内容写成了确定结论。 - 是否与核心概念词典和功能地图保持一致。"}, {"path": "01-产品总览.md", "title": "01-产品总览", "folder": ".", "text": "﻿# 产品总览  ## 1. 产品定位  Linkincrease 是面向供应链协作场景的业务协同平台。平台以 FlowSpace 为核心业务空间，围绕订单、里程碑、工单、资源库、协作团队、自动化、消息通知和移动采集，连接品牌方、供应商、验货/采集人员、运营人员等多类参与者，支撑从模板配置到业务执行、数据沉淀、追踪审计的完整闭环。  ## 2. 产品端组成  | 产品端 | 使用对象 | 核心定位 | 关键关系 | | --- | --- | --- | --- | | 运营端 | 平台运营、实施、管理人员 | 配置和监管平台基础能力，包括用户、团队、FlowSpace、业务模板、资源库模板、表单组件、仪表盘、报告、外部 API 和软件记录 | 配置能力下发到贸易端；查看平台级数据 | | 贸易端 | B 端客户团队和协作团队 | 业务协同主平台，承载团队、FlowSpace、订单、里程碑、工单、资源库、自动化、消息和仪表盘 | 由运营端模板创建 FlowSpace；与采集端实时同步任务和数据 | | 采集端 | 移动端执行人员、协作成员 | 移动场景下的任务查看、工单采集、工单批复、里程碑批复和消息处理入口 | 与贸易端订单、工单、批复任务双向同步 |  ## 3. 核心业务闭环  flowchart TD A[\"运营端配置业务模板 / 资源库模板 / 表单组件\"] --> B[\"贸易端团队创建 FlowSpace\"] B --> C[\"FlowSpace 设置角色、成员、协作团队、数据围栏\"] C --> D[\"创建订单并生成里程碑计划\"] D --> E[\"创建、指派、采集、批复工单\"] E --> F[\"里程碑批复与状态推进\"] F --> G[\"订单完成、取消、重启或继续流转\"] B --> H[\"资源库提供标准数据\"] H --> D E --> I[\"采集端移动处理任务\"] D --> J[\"自动化、消息、日志、仪表盘、报告沉淀过程数据\"]  ## 4. 平台能力分层  | 能力层 | 说明 | 代表模块 | | --- | --- | --- | | 账号与组织层 | 管理用户身份、团队归属、团队成员、协作团队和个人设置 | 注册登录、个人中心、团队管理、团队设置 | | 模板与配置层 | 定义业务结构、表单字段、里程碑、批复、资源库和可见范围 | 运营端模板中心、业务模板、资源库模板、表单设计组件 | | 业务执行层 | 承载供应链协作的核心执行过程 | FlowSpace、订单、里程碑、工单、批复、采集 | | 主数据层 | 管理可被 FlowSpace 引用的标准化业务数据 | 资源库、资源库分享、资源库视图、资源库历史 | | 协作与权限层 | 控制不同团队、角色、成员在业务中的可见与可操作范围 | 团队角色、FlowSpace 业务角色、协作方角色、数据围栏、仪表盘权限、报告权限 | | 自动化与通知层 | 将机械性操作、消息推送和异常通知自动化 | 自动化、定时任务、消息中心、实时消息、邮件协作 | | 追踪与审计层 | 记录用户操作、系统操作和业务过程变化 | 操作日志、动态、历史记录、跟踪记录、系统自动执行日志 | | 数据展示层 | 对订单、任务、仪表盘、报告和运营数据进行聚合展示 | 工作台、常用视图、订单日程、仪表盘、报告 |  ## 5. 核心业务对象关系  erDiagram USER ||--o{ TEAM_MEMBER : joins TEAM ||--o{ TEAM_MEMBER : contains TEAM ||--o{ FlowSpace : owns TEAM ||--o{ RESOURCE_LIBRARY : owns FlowSpace ||--o{ FlowSpace_MEMBER : contains FlowSpace ||--o{ ORDER : contains FlowSpace ||--o{ AUTOMATION : configures FlowSpace ||--o{ DASHBOARD : presents ORDER ||--o{ MILESTONE : contains MILESTONE ||--o{ WORK_ORDER : contains MILESTONE ||--o| MILESTONE_APPROVAL : may_have WORK_ORDER ||--o| WORK_ORDER_APPROVAL : may_have WORK_ORDER ||--o{ COLLECTION_FORM : contains RESOURCE_LIBRARY ||--o{ RESOURCE_TABLE : contains RESOURCE_TABLE ||--o{ RESOURCE_RECORD : contains RESOURCE_RECORD ||--o{ ORDER : referenced_by  ## 6. 当前知识库重点  1. 以 FlowSpace、订单、里程碑、工单为主线梳理业务执行链路。 2. 将团队权限、FlowSpace 权限、协作方权限、资源库权限和数据围栏拆开描述，避免混淆。 3. 将资源库、自动化、消息通知、日志审计作为横向能力，分别沉淀规则。 4. 将运营端模板能力与贸易端实际执行能力对应起来，形成“配置项 -> 运行态行为”的知识结构。"}, {"path": "02-核心概念词典.md", "title": "02-核心概念词典", "folder": ".", "text": "﻿# 核心概念词典  本词典用于统一 Linkincrease 内部术语。除非已有新评审结论覆盖，否则需求文档、原型、研发沟通优先沿用本页定义。  ## 1. 产品与组织  | 术语 | 定义 | 关键规则 | | --- | --- | --- | | Linkincrease | 面向供应链协作的业务平台总称 | 包含运营端、贸易端、采集端 | | 运营端 | 平台管理和配置后台 | 管理用户、团队、FlowSpace、模板、资源库模板、软件记录等 | | 贸易端 | 客户团队进行业务协同的主平台 | 承载团队、FlowSpace、订单、资源库、自动化、消息等 | | 采集端 | 移动端任务处理入口 | 面向工单采集、工单批复、里程碑批复和消息查看 | | 团队 | 贸易端客户创建的组织单位 | 一个账号可加入多个团队；团队拥有 FlowSpace 和资源库 | | 团队成员 | 加入团队的用户 | 可拥有一个或多个团队角色 | | 团队角色 | 团队级权限集合 | 控制团队设置、资源库、创建 FlowSpace 等能力 | | 协作团队 | 与主团队建立协作关系的外部团队 | 可被邀请加入团队协作或 FlowSpace 协作 | | 对接人/负责人 | 协作团队内承担接收、指派、处理任务的成员角色 | 在工单和批复指派中用于承接协作方任务 |  ## 2. FlowSpace 与订单流程  > 命名口径：FlowSpace 中文可理解为“流空间”，是 SCCS 的新名称。知识库正文统一使用 FlowSpace；历史需求、来源文件名和 `source:` 引用中保留 SCCS 原名，用于追溯。  | 术语 | 定义 | 关键规则 | | --- | --- | --- | | FlowSpace | 供应链协作空间，是订单流程运行的业务容器 | 由业务模板创建；包含成员、角色、协作团队、订单、仪表盘、自动化等 | | FlowSpace 分组 | 工作台中对 FlowSpace 的组织方式 | 用于团队内管理多个 FlowSpace | | FlowSpace 业务角色 | FlowSpace 内控制业务操作范围的角色 | 控制订单、里程碑、工单、仪表盘等业务权限 | | 协作 FlowSpace 角色 | 协作团队在 FlowSpace 中的权限角色 | 分为协作方自建角色和主团队授权角色等场景 | | 数据围栏 | 控制成员可见数据范围和字段范围的机制 | 影响订单、里程碑、工单、标签、表单字段等展示 | | 订单 | FlowSpace 中的业务主实体 | 包含订单基本信息、多个里程碑、工单、批复和跟踪记录 | | 订单主表单 | 订单级主数据表单 | 由运营端业务模板定义；用于订单基本信息 | | 订单标识 | 用于替代默认订单 ID 的展示字段 | 可由模板设置默认值，也可在 FlowSpace 设置中调整 | | 订单状态 | 订单生命周期状态 | 通常包括进行中、已完成、已取消 | | 里程碑 | 订单流程节点 | 承载阶段计划、负责人、状态、批复和工单 | | 里程碑状态 | 里程碑生命周期状态 | 通常包括未开始、进行中、已完成、已取消 | | 工单 | 里程碑下的具体执行任务 | 包含采集表单、工单批复、处理人、状态和动态 | | 工单采集 | 处理人填写工单采集表单的过程 | 可在贸易端和采集端处理 | | 工单批复 | 对工单采集结果进行确认或审核 | 仅在模板配置需要工单批复时存在 | | 里程碑批复 | 对里程碑阶段结果进行确认或审核 | 每个里程碑最多一份里程碑批复数据 | | 处理人 | 被指定执行采集、工单批复或里程碑批复的人 | 可为团队成员、协作成员或协作团队负责人 |  ## 3. 复用与关联  | 术语 | 定义 | 关键规则 | | --- | --- | --- | | 订单翻单 | 基于历史订单复制或复用内容创建新订单 | 强调从旧订单快速生成新订单 | | 订单关联 | 建立订单之间的关系 | 默认只建立关系，不自动同步字段 | | FlowSpace 关联 | FlowSpace 之间建立业务关联 | 用于跨 FlowSpace 数据和流程协作，具体规则以后续需求为准 | | 里程碑互用 | 将某个订单的里程碑复用到其他订单 | 需要保留来源、目标和取消互用规则 | | 工单互用 | 将某个工单复用于其他订单或里程碑 | 需要处理互用来源、目标、权限和状态限制 |  ## 4. 资源库  | 术语 | 定义 | 关键规则 | | --- | --- | --- | | 资源库 | 团队级标准化数据池 | 用于管理物料、供应商、客户等基础数据 | | 资源库模板 | 创建资源库的数据结构模板 | 由运营端配置，贸易端基于模板创建资源库 | | 资源库表 | 资源库下的结构化数据表 | 每个资源库可包含多张表 | | 资源库数据 | 资源库表中的单条业务记录 | 支持增删改查、导入、导出、批量操作 | | 资源库角色 | 资源库内权限集合 | 控制查看、创建、编辑、删除、导入、导出、数据范围等 | | 资源库引用 | FlowSpace 订单字段引用资源库数据 | 历史已引用数据需要保留快照或文本 | | 资源库同步 | 资源库数据变化后同步到已引用字段 | 需要处理手动修改、权限变化和来源冲突 | | 资源库分享 | 通过外链或授权方式共享资源库数据 | 涉及只读、可编辑、密码、失效等规则 |  ## 5. 模板与表单  | 术语 | 定义 | 关键规则 | | --- | --- | --- | | 业务模板 | 可创建 FlowSpace 的模板 | 包含主表单、里程碑、工单表单、批复表单、订单标识等 | | 模板中心 | 运营端管理业务模板和资源库模板的模块 | 控制模板列表、可见范围、发布、复制、同步 | | 表单设计器 | 配置表单布局、字段和显隐规则的工具 | 运营端业务模板、资源库模板、仪表盘等多处复用 | | 表单组件 | 构成表单的控件 | 包含布局、基础、高级、成员、协作方、公式、关联引用等组件 | | 公式函数 | 表单公式字段使用的函数体系 | 影响模板配置、字段计算和系统自动更新日志 | | 显隐设置 | 表单字段或组件的条件展示规则 | 需要与权限、数据围栏、必填校验共同判断 | | 验货组件 | 面向尺寸检验、组合明细等验货场景的专用组件 | 覆盖运营端配置、贸易端应用和采集端应用 |  ## 6. 自动化、通知与日志  | 术语 | 定义 | 关键规则 | | --- | --- | --- | | 自动化 | 在 FlowSpace 内基于触发条件执行机械性操作的配置 | 包含触发条件、最多多个执行动作、启用状态和执行日志 | | 定时任务 | 按记录中的时间或周期触发自动化操作 | 自动化二期能力 | | 触发条件 | 自动化开始执行的判断条件 | 包含新增数据、数据变更、到达记录时间等 | | 执行动作 | 自动化满足条件后执行的动作 | 包含发送通知、新增数据、更新数据等 | | 消息中心 | 站内消息和实时消息展示入口 | 覆盖任务、团队、账号、资源库、自动化、导入导出等事件 | | 邮件协作 | 在订单详情或工单场景中通过邮件推进协作 | 支持单个和批量发邮件协作 | | 操作日志 | 设置类、资源库、系统自动执行等行为的审计记录 | 用于追踪谁在何时做了什么 | | 动态 | 订单、里程碑、工单或批复内部的过程记录 | 面向业务执行过程查看 | | 历史记录 | 表单数据编辑历史 | 面向字段级或数据级变更追踪 | | 跟踪记录 | 订单级关键节点记录 | 记录订单状态、里程碑、工单、自动化等关键业务动作 |"}, {"path": "03-功能地图.md", "title": "03-功能地图", "folder": ".", "text": "﻿# 功能地图  ## 1. 运营端  | 一级模块 | 二级能力 | 说明 | | --- | --- | --- | | 用户管理 | 用户列表、用户详情 | 查看平台用户基础信息、拥有团队、加入团队、关联 FlowSpace | | 团队管理 | 团队列表、团队详情、成员信息、角色列表、协作邀请记录 | 平台视角管理团队数据和邀请记录 | | FlowSpace 管理 | FlowSpace 列表、FlowSpace 数据详情、成员记录、邮件协作列表、自动化记录 | 平台视角查看和管理团队 FlowSpace 数据 | | FlowSpace 仪表盘 | 仪表盘列表、仪表盘管理 | 运营端管理 FlowSpace 仪表盘 | | 模板中心 | 业务模板管理、资源库模板管理 | 创建、编辑、复制、发布、分配、同步模板 | | 模板设计 | 表单设计组件、表单属性、显隐设置、里程碑第三方数据对接 | 定义业务模板和资源库模板的结构 | | 资源库管理 | 团队资源库列表、资源库数据明细 | 平台视角查看团队资源库数据 | | 设置 | 软件更新管理、软件更新记录 | 管理软件版本信息和记录 | | 集成与报告 | 外部 API 集成配置、报告管理 | 支撑外部系统对接和报告能力 |  ## 2. 贸易端  | 一级模块 | 二级能力 | 说明 | | --- | --- | --- | | 账号与个人 | 注册登录、忘记密码、个人信息、语言切换、退出账号 | 用户身份与个人设置 | | 团队 | 创建团队、团队信息、团队角色、成员管理、协作团队管理、邀请流程 | 团队级组织和协作关系管理 | | 工作台 | FlowSpace 列表、创建 FlowSpace、FlowSpace 分组、订单日程、任务中心、常用视图 | 团队用户进入业务的首页 | | FlowSpace 设置 | 基本信息、业务角色、协作方角色、数据围栏、成员、协作团队、里程碑计划、标签、更多设置 | FlowSpace 级业务配置 | | 协作 FlowSpace 设置 | 协作方角色、主团队角色、协作成员、权限设置 | 协作团队参与 FlowSpace 时的权限与成员管理 | | 订单列表 | 订单查看、增删改、导入导出、视图设置、子表视图、工单视图、批量操作 | 订单级数据管理入口 | | 订单详情 | 详情查看、看板/表格模式、工单创建、采集、批复、里程碑批复、邮件协作、历史、动态、跟踪记录 | 订单执行主场景 | | 订单管理 | 订单翻单、订单关联、里程碑互用、工单互用 | 业务复用和关系管理 | | 资源库 | 创建资源库、资源库设置、资源库数据、视图管理、分享、FlowSpace 应用数据范围、数据编辑历史 | 团队主数据管理 | | 自动化 | 自动化列表、触发条件、执行动作、执行日志、定时任务 | FlowSpace 内自动执行业务动作 | | 消息与协作 | 消息中心、实时消息、邮件协作、批量邮件协作 | 业务通知和跨团队沟通 | | 日志与审计 | 设置类操作日志、资源库日志、系统自动执行日志 | 追踪配置和系统动作 | | 仪表盘与报告 | 仪表盘权限、报告权限 | 数据展示和权限控制 |  ## 3. 采集端  | 一级模块 | 二级能力 | 说明 | | --- | --- | --- | | 登录 | 邮箱密码登录、忘记密码 | 移动端账号入口 | | 首页 | 我的任务、团队待指派、我关注、FlowSpace 入口、任务数据展示 | 移动端任务聚合 | | 任务列表 | 进行中、已完成、我发起、团队指派、我关注、操作入口 | 工单、工单批复、里程碑批复任务列表 | | 任务搜索 | 从任务列表进入搜索页 | 搜索工单和批复任务 | | 任务详情 | 工单详情、工单批复详情、里程碑批复详情、订单信息 | 移动端处理和查看任务 | | 消息中心 | 首页消息入口、消息列表 | 查看移动端通知 | | 我的 | 个人信息、多语言、修改密码、帮助中心、联系成功经理、检查更新、退出账号 | 个人设置和支持入口 |  ## 4. 公共横向能力  | 能力 | 覆盖范围 | 需要沉淀的规则 | | --- | --- | --- | | 权限体系 | 团队、FlowSpace、协作 FlowSpace、资源库、仪表盘、报告 | 权限点、角色叠加、成员范围、协作方边界 | | 状态机 | 订单、里程碑、工单、批复、自动化、导入导出 | 状态枚举、状态变更入口、状态限制和异常提示 | | 表单体系 | 业务模板、资源库模板、订单、工单、批复、采集端 | 组件、校验、显隐、公式、默认值、移动端展示 | | 数据导入导出 | 订单、工单、资源库 | 模板下载、上传校验、记录、失败原因、权限 | | 消息通知 | 站内、实时、邮件、短信 | 触发事件、接收对象、模板、免打扰或屏蔽规则 | | 日志审计 | 操作日志、动态、历史记录、跟踪记录、系统日志 | 操作人、操作对象、快照、自动程序标识 | | 复用关系 | 订单翻单、订单关联、里程碑互用、工单互用、资源库引用 | 来源、目标、同步、取消、历史保留 |"}, {"path": "04-Linkincrease完整知识库架构与内容.md", "title": "Linkincrease 完整知识库架构与内容", "folder": ".", "text": "# Linkincrease 完整知识库架构与内容  本文基于 `最新需求源（source:thoughts-v2-current）` 中所有迭代需求重新整理，用于作为 Linkincrease 后续完整知识库的主体框架。它不是原始需求的简单汇总，而是按“产品对象、业务流程、权限边界、状态规则、数据流转、审计追溯”的方式重组。  ## 1. 知识库总架构  Linkincrease 知识库 ├─ 00 入门与维护 │  ├─ 产品总览 │  ├─ 核心概念词典 │  ├─ 功能地图 │  ├─ 需求来源台账 │  └─ 待办与问题池 ├─ 10 产品端说明 │  ├─ 运营端 │  ├─ 贸易端 │  └─ 采集端 ├─ 20 核心业务对象 │  ├─ 用户与账号 │  ├─ 团队与协作团队 │  ├─ FlowSpace │  ├─ 订单 │  ├─ 里程碑 │  ├─ 工单 │  ├─ 批复 │  └─ 资源库 ├─ 30 核心业务流程 │  ├─ 从模板到 FlowSpace │  ├─ 从订单创建到完成 │  ├─ 工单采集与批复 │  ├─ 跨团队协作 │  ├─ 资源库引用与同步 │  ├─ 自动化执行 │  └─ 移动端采集 ├─ 40 权限与安全 │  ├─ 团队权限 │  ├─ FlowSpace 业务权限 │  ├─ 协作方权限 │  ├─ 资源库权限 │  ├─ 数据围栏 │  ├─ 仪表盘权限 │  └─ 报告权限 ├─ 50 数据、表单与模板 │  ├─ 业务模板 │  ├─ 资源库模板 │  ├─ 表单设计组件 │  ├─ 表单属性与显隐 │  ├─ 公式函数 │  ├─ 验货组件 │  └─ PDF / 第三方数据对接 ├─ 60 协作、通知与自动化 │  ├─ 消息中心 │  ├─ 实时消息 │  ├─ 邮件协作 │  ├─ 自动化一期 │  ├─ 定时任务 │  └─ 外部 API 集成 ├─ 70 展示与分析 │  ├─ 工作台 │  ├─ 常用视图 │  ├─ 订单日程 │  ├─ 仪表盘 │  └─ 报告 └─ 80 日志、历史与审计 ├─ 操作日志 ├─ 动态 ├─ 历史记录 ├─ 跟踪记录 └─ 系统自动执行日志  ## 2. 产品端知识结构  ### 2.1 运营端  运营端是平台配置和监管中心，知识库中应按“配置对象”组织，而不是按页面名称堆叠。  | 知识主题 | 应沉淀内容 | 来源需求 | | --- | --- | --- | | 用户数据管理 | 用户列表筛选、用户详情、拥有团队、加入团队、关联 FlowSpace | `【运营端】【用户-用户管理】平台用户数据管理.md` | | 团队数据管理 | 团队列表、团队详情、成员、角色、协作邀请、参与外部协作 | `【运营端】【用户-团队管理】平台团队数据管理.md` | | FlowSpace 数据管理 | 平台团队的 FlowSpace 数据、成员、邮件协作、自动化记录、仪表盘、报告、外部 API | `【运营端】【用户-SCCS管理】平台团队的SCCS数据管理.md` 等 | | 资源库数据管理 | 团队资源库列表、资源库数据明细、权限边界 | `【运营端】【用户-资源库管理】平台团队的资源库数据管理.md` | | 业务模板 | 模板列表、创建类型、可见范围、设计、发布、复制、同步至 FlowSpace | `【运营端】【模板中心】业务模版管理.md` | | 资源库模板 | 模板列表、创建、编辑、表单设计、预览、发布 | `【运营端】【模板中心】资源库模版管理.md` | | 表单设计器 | 布局组件、基础组件、高级组件、属性、显隐、公式、成员/协作方组件 | `【运营端】【业务模板】表单设计组件.md`、`【运营端】【资源库模版】表单设计组件.md` | | 软件与平台设置 | 软件更新管理、更新记录 | `【运营端】【设置-软件管理】软件相关信息与记录管理.md` |  ### 2.2 贸易端  贸易端是 Linkincrease 的核心业务操作平台，知识库中应围绕用户实际完成的业务链路组织。  | 知识主题 | 应沉淀内容 | 来源需求 | | --- | --- | --- | | 账号与个人 | 注册、登录、忘记密码、个人资料、语言、退出 | `【贸易端】【账号】注册登录、忘记密码.md`、`【贸易端】【个人中心】...md` | | 团队与协作 | 创建团队、团队信息、角色、成员、协作团队、邀请流程变更 | `【贸易端】【团队管理】...md`、`【贸易端】【团队设置】...md` | | 工作台 | FlowSpace 列表、创建 FlowSpace、分组、订单日程、任务中心、常用视图 | `【贸易端】【工作台】...md` | | FlowSpace 设置 | 基本信息、业务角色、数据围栏、成员、协作团队、里程碑计划、标签、订单标识、取消原因 | `【贸易端】【SCCS设置】.md` | | 协作 FlowSpace 设置 | 协作团队参与 FlowSpace 后的角色、成员、权限管理 | `【贸易端】【协作SCCS设置】.md` | | 订单列表 | 订单查看、增删改、导入导出、视图设置、子表模式、工单视图、批量操作 | `【贸易端】【订单列表】*.md` | | 订单详情 | 订单详情布局、状态操作、里程碑、工单、批复、历史、跟踪、邮件协作 | `【贸易端】【订单详情】*.md` | | 订单复用 | 翻单、订单关联、里程碑互用、工单互用 | `【贸易端】【订单管理】*.md` | | 资源库 | 资源库创建、设置、数据管理、视图、分享、FlowSpace 应用、历史 | `【贸易端】【资源库】*.md` | | 自动化 | 自动化列表、触发条件、执行动作、日志、定时任务 | `【贸易端】【自动化】*.md` | | 消息与日志 | 消息中心、实时消息、设置类操作日志、系统自动日志 | `【贸易端】【消息中心】...md`、`【贸易端】【操作日志】...md` |  ### 2.3 采集端  采集端是移动执行入口，知识库中应按任务处理路径组织。  | 知识主题 | 应沉淀内容 | 来源需求 | | --- | --- | --- | | 登录 | 邮箱密码登录、忘记密码 | `【采集端】【登录】邮箱_密码登录、忘记密码.md` | | 首页 | 我的任务、团队待指派、我关注、FlowSpace 数据展示 | `【采集端】【首页】任务相关数据展示.md` | | 任务列表 | 进行中、已完成、我发起、团队指派、我关注、操作 | `【采集端】【任务列表】...md` | | 任务搜索 | 入口、搜索页规则 | `【采集端】【任务搜索页】...md` | | 任务详情 | 工单详情、工单批复详情、里程碑批复详情、订单信息 | `【采集端】【任务详情页】...md` | | 消息中心 | 首页入口、消息列表 | `【采集端】【消息中心】消息通知列表.md` | | 我的 | 个人信息、多语言、修改密码、帮助、联系成功经理、检查更新、退出账号 | `【采集端】【我的】个人中心页.md` |  ## 3. 核心业务对象  ### 3.1 用户、团队、协作团队  用户是跨团队身份，一个用户可加入多个团队；团队是贸易端业务归属单位，拥有 FlowSpace、资源库、团队角色和协作关系。协作团队不是团队的子组织，而是被主团队邀请参与业务协作的外部团队。  需要沉淀的知识点：  - 账号注册、登录、忘记密码、语言切换、退出账号。 - 首次创建团队与非首次创建团队的差异。 - 团队基础信息、角色、成员、邀请成员、未注册成员标识。 - 团队协作邀请的“我邀请的”和“邀请我的”两类视角。 - 协作团队被邀请到团队层和 FlowSpace 层后的权限差异。 - 团队角色权限与 FlowSpace 业务角色权限的边界。  ### 3.2 FlowSpace  FlowSpace 是贸易端核心业务空间，由运营端业务模板创建。一个 FlowSpace 通常包含订单主表单、多个里程碑、里程碑批复、工单采集表单、工单批复表单、成员、业务角色、协作团队、数据围栏、标签、自动化、仪表盘和资源库关联。  需要沉淀的知识点：  - FlowSpace 创建来源：运营端业务模板。 - FlowSpace 工作台展示、分组、搜索、排序和常用视图。 - FlowSpace 基本信息、编辑、删除或状态规则。 - FlowSpace 业务角色、协作方角色、成员、协作团队的配置关系。 - 数据围栏对字段、标签、订单、里程碑和工单可见性的影响。 - 里程碑计划、标签设置、订单标识、订单取消原因等更多设置。 - FlowSpace 与资源库、自动化、仪表盘、报告、外部 API 的关系。  ### 3.3 订单  订单是 FlowSpace 中的业务主实体。订单包含订单基本信息、多个里程碑、工单、批复、历史记录、动态和跟踪记录。  订单知识页应包含：  - 订单列表：概览、详情入口、视图设置、子表模式、工单视图。 - 订单新增、编辑、删除、批量编辑、状态修改。 - 订单导入、订单导出、导入记录和失败原因。 - 订单状态：进行中、已完成、已取消。 - 完成订单后的限制：订单不可编辑/取消，里程碑和工单相关操作受限。 - 取消订单后的规则：需要选择取消原因，历史订单保留取消时文本。 - 重启订单后的恢复规则。 - 订单详情结构：标题栏、左侧树、订单基本信息、里程碑信息、工单信息。 - 订单跟踪记录：记录订单和里程碑大节点操作。  ### 3.4 里程碑  里程碑是订单流程阶段。每个里程碑可包含里程碑批复和多个工单。  里程碑知识页应包含：  - 状态：未开始、进行中、已完成、已取消。 - 状态变更入口：订单详情、批量操作、自动化等。 - 计划时间、实际开始、实际完成、延迟/提前标签。 - 负责人、标签、数据围栏可见性。 - 创建工单的状态限制：仅未开始或进行中的里程碑可创建工单。 - 完成、取消、重启里程碑对工单、批复、互用的影响。 - 里程碑批复是否存在取决于运营端模板配置。 - 里程碑互用的来源、目标、取消和权限规则。  ### 3.5 工单  工单是里程碑下的具体执行任务，由工单采集和工单批复构成。一个里程碑可以有多份工单。  工单知识页应包含：  - 创建工单：最多一次创建 10 条；可复制工单；至少保留一个非隐藏表单。 - 工单名称：默认按创建顺序编号，支持修改，限制 50 字符。 - 表单权限：隐藏表单、非隐藏表单、采集人设置、未设置采集人的必填校验。 - 处理人：采集人、工单批复人、里程碑批复人；可选择成员、协作团队负责人或具体协作成员。 - 指派：协作团队负责人或有指派权限成员可将任务指派给本团队成员。 - 采集：采集人填写可编辑表单；多人并发时需要提示刷新。 - 工单批复：批复人审核采集结果。 - 终止采集：终止后不可继续采集。 - 删除工单：需受权限和状态限制。 - 动态和历史记录：记录创建、采集、批复、编辑、终止、删除等行为。  ### 3.6 资源库  资源库是团队级标准化数据池，用于管理基础数据并应用到 FlowSpace。  资源库知识页应包含：  - 资源库创建：从运营端资源库模板选择、预览、使用模板创建。 - 资源库列表：卡片、展开/收起、搜索、排序、空状态。 - 资源库设置：编辑名称、权限角色、成员、表权限。 - 资源库数据：创建、编辑、删除、查看、导入、导出、搜索、排序、批量编辑、批量下载文件。 - 资源库视图管理：不同用户或角色查看数据的视图组织方式。 - 资源库分享：单条或整表分享、密码、只读/可编辑、失效。 - FlowSpace 应用资源库：关联资源库、字段映射、引用数据、历史文本保留。 - 数据编辑历史：记录资源库数据变更，支持追溯。  ## 4. 核心流程  ### 4.1 从模板到 FlowSpace  flowchart LR A[\"运营端创建业务模板\"] --> B[\"配置主表单、里程碑、工单表单、批复表单\"] B --> C[\"配置订单标识、PDF导入、第三方数据对接、预览数据\"] C --> D[\"发布模板并设置可见范围\"] D --> E[\"贸易端模板中心选择模板\"] E --> F[\"创建 FlowSpace\"] F --> G[\"FlowSpace 设置成员、角色、数据围栏、标签、计划\"]  知识库中需要明确：模板发布前贸易端不可见；模板启用但未发布仍不可见；模板同步至 FlowSpace 属于独立能力，需要记录同步范围、冲突、已存在数据影响。  ### 4.2 从订单创建到完成  stateDiagram-v2 [*] --> 进行中: 创建订单 进行中 --> 已完成: 完成订单 进行中 --> 已取消: 取消订单 已完成 --> 进行中: 重启订单 已取消 --> 进行中: 重启订单  订单创建后进入进行中。订单完成或取消后，订单、里程碑、工单、批复的大部分编辑和处理动作被限制。重启订单将订单恢复到进行中，但需要保留历史操作记录和取消原因快照。  ### 4.3 工单采集与批复  flowchart TD A[\"创建工单\"] --> B[\"设置采集人 / 工单批复人 / 里程碑批复人\"] B --> C{\"协作团队负责人?\"} C -->|是| D[\"协作方指派具体成员\"] C -->|否| E[\"处理人直接采集\"] D --> E E --> F[\"提交采集\"] F --> G{\"需要工单批复?\"} G -->|是| H[\"工单批复\"] G -->|否| I[\"工单采集完成\"] H --> I I --> J{\"需要里程碑批复?\"} J -->|是| K[\"里程碑批复\"] J -->|否| L[\"推进里程碑状态\"] K --> L  需要单独沉淀：指派、采集、批复在订单已删除、订单已完成/取消、里程碑已完成/取消、工单已终止、工单已批复、工单已删除等状态下的限制和提示。  ### 4.4 跨团队协作  跨团队协作由两层关系组成：  - 团队层协作：主团队邀请协作团队，建立可参与业务的组织关系。 - FlowSpace 层协作：将协作团队加入具体 FlowSpace，并分配协作角色、成员、权限。  协作方在工单和批复中可能被选为“负责人/对接人”，也可能被直接选为具体成员。负责人模式需要协作团队内部再指派成员；具体成员模式则由被选中的成员直接处理。  ### 4.5 资源库引用与同步  flowchart LR A[\"运营端资源库模板\"] --> B[\"贸易端创建资源库\"] B --> C[\"维护资源库表数据\"] C --> D[\"FlowSpace 关联资源库\"] D --> E[\"订单字段引用资源库数据\"] C --> F{\"资源库数据变更\"} F --> G[\"按同步策略更新已引用字段\"] F --> H[\"历史订单保留引用快照或文本\"]  需要明确：删除资源库或资源库数据后，新订单不可再引用，被历史订单引用的数据仍需保留文本或快照。资源库同步与 FlowSpace/FlowSpace 数据互用写入需要互斥校验，避免同一字段被多来源覆盖。  ### 4.6 自动化执行  自动化由一个触发条件和多个执行动作组成。触发条件包括数据新增、数据内容变更、到达记录中的时间；执行动作包括发送通知、新增数据、更新数据。自动化只在同一订单内执行，不跨订单触发。  自动化知识页应沉淀：  - 自动化列表、启用状态、未完善设置提示。 - 触发条件的数据源、条件配置、字段选择范围。 - 执行动作的通知对象、通知渠道、标题内容拼接、附件。 - 新增工单的默认值、处理人、必填字段校验。 - 更新数据的记录范围、筛选条件、字段映射。 - 执行失败通知、执行顺序、后续动作是否继续执行。 - 执行日志列表和详情。 - 定时任务触发时的特殊执行记录。  ## 5. 权限与安全结构  权限知识库建议拆成独立章节，避免所有权限散落在页面说明中。  | 权限域 | 控制对象 | 典型权限点 | | --- | --- | --- | | 团队权限 | 团队设置、团队成员、团队角色、协作团队、资源库入口 | 创建资源库、删除资源库、资源库管理、邀请成员、设置角色 | | FlowSpace 业务权限 | 订单、里程碑、工单、批复、仪表盘、自动化 | 查看、创建、编辑、删除、状态修改、指派、采集、批复、互用、导入导出 | | 协作 FlowSpace 权限 | 协作团队在 FlowSpace 内的业务操作 | 协作方角色、协作成员、指派、处理、查看 | | 资源库权限 | 资源库设置、表数据、数据范围 | 查看、创建、编辑、删除、导入、导出、批量操作、分享 | | 数据围栏 | 订单、里程碑、工单、字段、标签 | 控制可见范围，不等于操作权限 | | 仪表盘权限 | FlowSpace 仪表盘 | 管理、查看、汇总查看 | | 报告权限 | 报告查看与管理 | 按需求中的报告权限点补充 |  权限判断建议沉淀为统一格式：  功能入口是否展示 = 角色权限 + 对象状态 + 数据围栏/数据范围 + 成员关系 提交是否成功 = 服务端再次校验权限 + 对象状态 + 数据版本 + 必填/格式规则  ## 6. 状态与限制  | 对象 | 状态 | 关键限制 | | --- | --- | --- | | 订单 | 进行中 | 可编辑、可完成、可取消，可推进里程碑和工单 | | 订单 | 已完成 | 不可编辑、不可取消；里程碑和工单处理动作受限 | | 订单 | 已取消 | 不可编辑；保留取消原因文本；可按权限重启 | | 里程碑 | 未开始 | 可创建工单；首次创建工单可变更为进行中 | | 里程碑 | 进行中 | 可创建工单、采集、批复、完成或取消 | | 里程碑 | 已完成 | 不可创建工单、不可采集/批复/指派；可按权限重启 | | 里程碑 | 已取消 | 不可创建工单、不可采集/批复/指派；可按权限重启 | | 工单 | 正常执行中 | 可采集、批复、指派、邮件协作、终止、删除，取决于权限 | | 工单 | 已终止采集 | 不可继续采集 | | 工单 | 已批复 | 采集和部分编辑动作受限 | | 自动化 | 启用 | 设置完整且满足条件时执行 | | 自动化 | 未启用 | 不执行 |  ## 7. 表单、数据与模板  表单体系是 Linkincrease 的底层配置能力，知识库需要把“运营端配置”和“贸易端/采集端运行态”对应起来。  | 主题 | 内容 | | --- | --- | | 布局组件 | 模块分组、分割线、空白占位等 | | 基础组件 | 单行文本、多行文本、数字、百分比、单选、多选、图片、附件、日期、评级、定位、地址、富文本等 | | 高级组件 | 关联引用、公式、成员单选/多选、协作方单选/多选、签名、汇率等 | | 表单属性 | 必填、限制、默认值、移动端布局、Web 布局、国际化 | | 显隐设置 | 条件展示、隐藏后的校验处理、与数据围栏的关系 | | 公式函数 | 可用函数、字段类型、系统自动更新日志 | | 验货组件 | 尺寸检验组件、组合明细、统计表、采集端应用 |  ## 8. 消息、通知与邮件协作  消息体系建议按事件源组织：  - 账号与团队事件：注册、邀请、加入、角色变更。 - FlowSpace 事件：成员变更、协作团队变更、权限变更。 - 订单事件：创建、编辑、完成、取消、重启、跟踪记录。 - 里程碑事件：状态变更、批复指派、批复提交。 - 工单事件：创建、采集指派、采集提交、批复指派、批复提交、终止、删除。 - 资源库事件：导入导出、分享、同步、数据变更。 - 自动化事件：执行成功、执行失败、定时任务触发。 - 邮件协作事件：单工单邮件协作、批量发邮件协作。  每类消息都应沉淀：触发条件、接收人、渠道、标题、正文、跳转链接、附件、是否去重、是否受屏蔽设置影响。  ## 9. 日志与审计  日志体系需要区分四类记录：  | 类型 | 记录对象 | 主要用途 | | --- | --- | --- | | 操作日志 | 团队设置、FlowSpace 设置、协作 FlowSpace 设置、资源库设置等 | 审计配置类操作 | | 动态 | 工单、里程碑批复、工单批复、采集过程 | 业务过程追踪 | | 历史记录 | 表单字段和数据编辑历史 | 数据变更追溯 | | 跟踪记录 | 订单级关键动作 | 串联订单从创建到完成的关键节点 | | 系统自动执行日志 | 公式自动更新、自动化更新、资源库同步更新 | 区分系统程序与人工操作 |  所有日志类文档建议统一字段：操作时间、操作人、操作对象、操作类型、变更前、变更后、来源模块、是否系统自动执行、关联订单/FlowSpace/资源库。  ## 10. 建议落库目录  如果后续要进一步拆分为多页知识库，建议按以下目录落地：  docs/ 00-入门/ 10-产品端/ 20-业务对象/ 30-业务流程/ 40-权限与安全/ 50-模板表单与数据/ 60-协作通知与自动化/ 70-展示分析/ 80-日志审计/ 90-来源与待办/  每个功能页建议使用统一模板：  # 功能名称  ## 1. 功能定位 ## 2. 入口与使用对象 ## 3. 核心对象 ## 4. 业务流程 ## 5. 权限规则 ## 6. 状态与限制 ## 7. 字段与表单规则 ## 8. 通知与日志 ## 9. 异常与提示 ## 10. 来源需求 ## 11. 待确认问题  ## 11. 优先补全顺序  1. 先补 `20-业务对象`：FlowSpace、订单、里程碑、工单、批复、资源库。 2. 再补 `40-权限与安全`：团队权限、FlowSpace 权限、协作方权限、资源库权限、数据围栏。 3. 再补 `30-业务流程`：订单生命周期、工单采集批复、资源库引用、自动化。 4. 最后补 `60-协作通知与自动化` 和 `80-日志审计`，把所有事件、消息、日志统一表格化。  这样可以先建立稳定的业务骨架，再逐步把每份迭代需求中的页面细节、交互提示和异常校验补进去。"}, {"path": "05-需求文档来源台账.md", "title": "需求文档来源台账", "folder": ".", "text": "# 需求文档来源台账  本台账用于记录 `最新需求源（source:thoughts-v2-current）` 中每份原始需求应归入知识库的哪个主题。后续新增或变更需求时，先运行来源扫描脚本，再更新本台账并合入对应知识页。  ## 1. 贸易端  | 原始需求文档 | 知识库归属 | | --- | --- | | `【贸易端】【账号】注册登录、忘记密码.md` | 账号与个人 / 用户身份 | | `【贸易端】【个人中心】个人信息、切换语言、退出账号.md` | 账号与个人 / 个人设置 | | `【贸易端】【团队管理】创建团队.md` | 团队与协作团队 / 创建团队 | | `【贸易端】【团队设置】团队信息、角色、成员、协作团队管理.md` | 团队与协作团队 / 团队设置 | | `【贸易端】【团队设置】邀请成 员_协作团队流程变更.md` | 团队与协作团队 / 邀请流程 | | `【贸易端】【工作台】工作台、创建SCCS、SCCS分组.md` | 工作台 / FlowSpace 入口与分组 | | `【贸易端】【工作台】订单日程、任务中心、常用视图.md` | 工作台 / 任务与日程 | | `【贸易端】【SCCS设置】.md` | FlowSpace / 设置、权限、数据围栏、成员、标签 | | `【贸易端】【协作SCCS设置】.md` | FlowSpace / 协作 FlowSpace 权限 | | `【贸易端】【仪表盘】权限管理.md` | 展示与分析 / 仪表盘权限 | | `【贸易端】报告权限.md` | 展示与分析 / 报告权限 | | `【贸易端】【订单列表】订单列表查看：概览、详情.md` | 订单 / 订单列表 | | `【贸易端】【订单列表】订单增删改.md` | 订单 / 增删改 | | `【贸易端】【订单列表】订单导入、订单导出.md` | 订单 / 导入导出 | | `【贸易端】【订单列表】工单导入、导出.md` | 工单 / 导入导出 | | `【贸易端】【订单列表】视图设置.md` | 订单 / 视图设置 | | `【贸易端】【订单列表】视图模式：子表.md` | 订单 / 子表视图 | | `【贸易端】【订单列表】工单视图.md` | 工单 / 工单视图 | | `【贸易端】【订单列表】批量操作.md` | 订单 / 批量操作 | | `【贸易端】【工单视图】批量操作：批量发邮件协作、批量采集.md` | 工单 / 批量操作与邮件协作 | | `【贸易端】【订单详情】查看&操作.md` | 订单详情 / 查看与状态操作 | | `【贸易端】【订单详情】视图模式：看板、表格.md` | 订单详情 / 看板与表格 | | `【贸易端】【订单详情】工单&里程碑批复操作.md` | 工单与批复 / 采集、批复、指派 | | `【贸易端】【订单详情】邮件协作.md` | 邮件协作 / 单工单协作 | | `【贸易端】【订单管理】订单翻单功能.md` | 订单复用 / 翻单 | | `【贸易端】【订单管理】订单关联功能.md` | 订单复用 / 订单关联 | | `【贸易端】【订单管理】里程碑互用功能.md` | 订单复用 / 里程碑互用 | | `【贸易端】【订单管理】工单互用功能.md` | 订单复用 / 工单互用 | | `【贸易端】【资源库】第一阶段.md` | 资源库 / 基础管理 | | `【贸易端】【资源库】资源库分享.md` | 资源库 / 分享 | | `【贸易端】【资源库】视图管理.md` | 资源库 / 视图管理 | | `【贸易端】【资源库】SCCS应用数据范围、数据编辑历史记录.md` | 资源库 / FlowSpace 应用与历史 | | `【贸易端】【自动化】一期.md` | 自动化 / 触发条件、动作、日志 | | `【贸易端】【自动化】二期：定时任务.md` | 自动化 / 定时任务 | | `【贸易端】【消息中心】消息中心、实时消息.md` | 消息通知 / 站内与实时消息 | | `【贸易端】【操作日志】所有设置类功能.md` | 日志审计 / 设置类操作日志 |  ## 2. 运营端  | 原始需求文档 | 知识库归属 | | --- | --- | | `【运营端】【用户-用户管理】平台用户数据管理.md` | 运营端 / 用户管理 | | `【运营端】【用户-团队管理】平台团队数据管理.md` | 运营端 / 团队管理 | | `【运营端】【用户-SCCS管理】平台团队的SCCS数据管理.md` | 运营端 / FlowSpace 数据管理 | | `【运营端】【用户-SCCS管理】邮件协作列表.md` | 运营端 / 邮件协作监管 | | `【运营端】【用户-资源库管理】平台团队的资源库数据管理.md` | 运营端 / 资源库数据管理 | | `【运营端】【SCCS列表-仪表盘】SCCS仪表盘管理.md` | 运营端 / 仪表盘管理 | | `【运营端】【SCCS管理】SCCS自动化记录.md` | 运营端 / 自动化记录 | | `【运营端】【SCCS管理】SCCS列表增加外部api集成配置.md` | 运营端 / 外部 API 集成 | | `【运营端】【SCCS管理】SCCS列表增加报告管理.md` | 运营端 / 报告管理 | | `【运营端】【模板中心】业务模版管理.md` | 模板 / 业务模板 | | `【运营端】【模板中心】资源库模版管理.md` | 模板 / 资源库模板 | | `【运营端】【业务模板】表单设计组件.md` | 表单 / 业务模板组件 | | `【运营端】【业务模版】表单属性与显隐设置.md` | 表单 / 属性与显隐 | | `【运营端】【资源库模版】表单设计组件.md` | 表单 / 资源库模板组件 | | `【运营端】【仪表盘】表单设计组件.md` | 表单 / 仪表盘组件 | | `【运营端】【模板设计】里程碑增加第三方数据对接.md` | 模板 / 第三方数据对接 | | `【运营端】【设置-软件管理】软件相关信息与记录管理.md` | 运营端 / 软件管理 |  ## 3. 采集端  | 原始需求文档 | 知识库归属 | | --- | --- | | `【采集端】【登录】邮箱_密码登录、忘记密码.md` | 采集端 / 登录 | | `【采集端】【首页】任务相关数据展示.md` | 采集端 / 首页 | | `【采集端】【任务列表】工单、工单批复、里程碑批复任务列表.md` | 采集端 / 任务列表 | | `【采集端】【任务搜索页】工单、工单批复、里程碑批复任务搜索.md` | 采集端 / 任务搜索 | | `【采集端】【任务详情页】工单、工单批复、里程碑批复详情页.md` | 采集端 / 任务详情 | | `【采集端】【消息中心】消息通知列表.md` | 采集端 / 消息中心 | | `【采集端】【我的】个人中心页.md` | 采集端 / 我的 |  ## 4. 公共能力  | 原始需求文档 | 知识库归属 | | --- | --- | | `公式函数.md` | 表单 / 公式函数 | | `系统自动执行的相关操作日志.md` | 日志审计 / 系统自动执行日志 | | `验货组件流程梳理.md` | 表单 / 验货组件 |  ## 5. 入库状态  | 状态 | 说明 | | --- | --- | | 已归类 | 已确定归属模块，可继续抽取规则 | | 待拆页 | 需要从综合文档拆成独立知识页 | | 待校验 | 需求中存在跨文档冲突或需要产品确认 |  当前所有原始需求已完成一级归类。已优先拆出 `产品端总纲`、`账号与个人中心`、`FlowSpace`、`订单`、`工单与批复`、`资源库`、`权限`、`模板表单与数据`、`协作通知与自动化`、`展示分析`、`日志审计`、`来源与待办` 等首批知识页。下一步建议继续拆 `运营端平台管理细页` 和 `采集端任务详情细页`。"}, {"path": "06-知识库工程架构.md", "title": "知识库工程架构", "folder": ".", "text": "# 知识库工程架构  本文定义 Linkincrease 知识库的底座架构，重点回答：资料放在哪里、用什么格式、如何标注元数据、如何检索、如何更新、如何备份、如何为后续 AI/RAG 或其他知识库系统迁移做准备。  ## 1. 总体分层  flowchart TD A[\"应用层：检索、查阅、引用、离线、导出\"] --> B[\"管理层：命名、更新、权限、备份、归档\"] B --> C[\"治理层：权威、草稿、待确认、废弃、历史\"] C --> D[\"元数据层：标签、分类、版本、权限、来源、索引\"] D --> E[\"内容层：文档、表格、图片、脚本、压缩包、外部链接快照\"] E --> F[\"存储层：本地目录、轻量数据库、统一文件格式\"] G[\"自动化层：扫描、索引、校验、备份、导出\"] --> D G --> F H[\"来源追溯层：原始需求、评审记录、外部资料\"] --> D H --> E  ## 2. 内容层  内容层保存知识库中的实体资料。内容应分为“原始资料”和“知识化资料”，二者不要混放。  | 内容类型 | 说明 | 推荐格式 | 示例 | | --- | --- | --- | --- | | 知识页 | 已整理、可阅读、可复用的知识库正文 | `.md` | `04-Linkincrease完整知识库架构与内容.md` | | 原始需求 | 从所思、Teambition、会议、产品评审导出的原始材料 | `.md`、`.docx`、`.pdf` | `source:thoughts-v2-current/v2.2.x/贸易端/【贸易端】【订单详情】查看&操作.md` | | 表格资料 | 权限矩阵、字段清单、导入模板、配置表 | `.xlsx`、`.csv` | `metadata/权限矩阵.xlsx` | | 图片截图 | 原型截图、流程截图、页面截图 | `.png`、`.jpg`、`.webp` | `assets/images/order-detail.png` | | 脚本工具 | 扫描、索引、导出、检查脚本 | `.ps1`、`.py`、`.js` | `scripts/build-index.ps1` | | 压缩包 | 一次性导出包、外部资料包、历史快照 | `.zip`、`.7z` | `archive/2026-05-需求文档导出.zip` | | 外部链接快照 | 对外部文档、钉钉表格、所思链接的本地备份 | `.md`、`.pdf`、`.html` | `sources/external/权限矩阵.md` |  内容层原则：  - 原始资料保留原貌，不直接修改。 - 知识页只沉淀当前共识，不堆完整需求原文。 - 图片和附件不要散落在正文同级目录，统一放入 `assets/`。 - 外部链接必须尽量做本地快照，避免链接失效后无法追溯。  ## 3. 元数据层  元数据层用于描述每份资料的分类、状态、版本、权限和索引信息。建议每篇 Markdown 知识页使用 YAML Front Matter。  ### 3.1 知识页元数据字段  --- title: 订单-生命周期与状态规则 type: knowledge domain: 贸易端 module: 订单 submodule: 生命周期 status: authoritative version: v1.0 owner: 产品 maintainer: Daren updated_at: 2026-05-22 permission: internal tags: - 订单 - 状态机 - 权限 source_files: - source:thoughts-v2-current/v2.2.x/贸易端/【贸易端】【订单详情】查看&操作.md - source:thoughts-v2-current/v2.2.x/贸易端/【贸易端】【订单列表】订单增删改.md related_docs: - 02-核心概念词典.md - 03-功能地图.md search_keywords: - 完成订单 - 取消订单 - 重启订单 ---  ### 3.2 推荐字段说明  | 字段 | 是否必填 | 说明 | | --- | --- | --- | | `title` | 是 | 文档标题 | | `type` | 是 | `knowledge`、`source`、`metadata`、`template`、`script`、`archive` | | `domain` | 是 | 运营端、贸易端、采集端、公共能力、知识库管理 | | `module` | 是 | FlowSpace、订单、工单、资源库、自动化等 | | `submodule` | 否 | 更细分主题 | | `status` | 是 | `authoritative`、`draft`、`pending`、`deprecated`、`archived` | | `version` | 是 | 知识页版本，不等同于产品版本 | | `owner` | 否 | 业务负责人 | | `maintainer` | 否 | 文档维护人 | | `updated_at` | 是 | 最近更新日期 | | `permission` | 是 | `public`、`internal`、`restricted`、`confidential` | | `tags` | 否 | 用于检索和聚类 | | `source_files` | 是 | 原始来源文件 | | `related_docs` | 否 | 相关知识页 | | `search_keywords` | 否 | 别名、旧称、常见搜索词 |  ### 3.3 元数据台账  除文档内元数据外，建议维护集中台账：  metadata/ documents.csv          # 所有知识页清单 sources.csv            # 原始资料来源清单 tags.csv               # 标签字典 permissions.csv        # 文档权限清单 glossary.csv           # 术语索引，可由词典生成 search-index.json      # 本地检索索引  ## 4. 存储层  建议把当前根目录逐步演进为以下结构：  Linkincrease知识库/ README.md 00-知识库维护规范.md 01-产品总览.md 02-核心概念词典.md 03-功能地图.md 04-Linkincrease完整知识库架构与内容.md 05-需求文档来源台账.md 06-知识库工程架构.md 99-待办与问题池.md docs/ 00-入门/ 10-产品端/ 20-业务对象/ 30-业务流程/ 40-权限与安全/ 50-模板表单与数据/ 60-协作通知与自动化/ 70-展示分析/ 80-日志审计/ 90-来源与待办/ 最新需求源（source:thoughts-v2-current）/ sources/ external/ exported/ snapshots/ assets/ images/ files/ diagrams/ metadata/ scripts/ exports/ archive/ backups/ templates/  ### 4.1 目录职责  | 目录 | 用途 | | --- | --- | | 根目录 | 放总览、入口、核心规范和当前主干文档 | | `docs/` | 后续拆分后的正式知识页 | | `最新需求源（source:thoughts-v2-current）` | 唯一最新需求源，由所思同步脚本维护 | | `sources/` | 外部系统导出、外部链接快照、补充来源 | | `assets/` | 图片、附件、流程图、可复用素材 | | `metadata/` | 元数据台账、标签字典、索引文件 | | `scripts/` | 自动化脚本 | | `exports/` | 对外导出包，如 HTML、PDF、RAG 数据包 | | `archive/` | 历史归档、废弃资料、旧版本快照 | | `backups/` | 定期备份包 | | `templates/` | 文档模板 |  ### 4.2 轻量数据库选择  短期可以只使用 Markdown + CSV + JSON。资料量变大后，可增加轻量数据库：  | 方案 | 适用场景 | | --- | --- | | CSV | 人工维护简单台账 | | JSON | 脚本生成检索索引、关系图谱 | | SQLite | 需要本地快速检索、条件过滤、版本记录 | | DuckDB | 需要分析大量 CSV、日志和导入导出数据 |  建议先从 `metadata/documents.csv` 和 `metadata/search-index.json` 开始，不急着引入数据库。  ## 5. 管理层  管理层负责让知识库长期不乱。  ### 5.1 命名规范  | 类型 | 命名建议 | 示例 | | --- | --- | --- | | 总览类 | `编号-主题.md` | `01-产品总览.md` | | 业务对象页 | `对象-主题.md` | `订单-生命周期与状态规则.md` | | 流程页 | `流程-主题.md` | `流程-工单采集与批复.md` | | 权限页 | `权限-对象.md` | `权限-FlowSpace业务角色.md` | | 来源资料 | 保留原文件名 | `【贸易端】【订单详情】查看&操作.md` | | 图片 | `模块-场景-序号.png` | `order-detail-left-tree-01.png` | | 导出包 | `YYYY-MM-DD-主题.zip` | `2026-05-22-需求文档导出.zip` |  ### 5.2 更新机制  flowchart LR A[\"新增或变更需求\"] --> B[\"同步到 2.0需求文档 或 sources\"] B --> C[\"登记来源台账\"] C --> D[\"判断影响范围\"] D --> E[\"更新知识页\"] E --> F[\"更新元数据\"] F --> G[\"更新索引\"] G --> H[\"必要时备份和导出\"]  ### 5.3 权限划分  | 权限等级 | 说明 | 示例 | | --- | --- | --- | | `public` | 可对外或跨团队公开 | 产品介绍、公开 FAQ | | `internal` | 公司内部可见 | 大多数产品知识页 | | `restricted` | 限产品、研发、运营等特定团队 | 权限矩阵、未发布规划 | | `confidential` | 高敏感内容 | 客户资料、商业合同、账号密钥 |  原则：  - 默认 `internal`。 - 原始需求一般为 `internal` 或 `restricted`。 - 客户数据、账号密钥、生产配置不得进入普通知识库正文。 - 如果需要记录敏感信息，只记录索引和位置，不记录明文。  ### 5.4 备份策略  | 备份类型 | 频率 | 内容 | | --- | --- | --- | | 快速备份 | 每次大改前 | 根目录文档、metadata | | 日备份 | 每天或每次批量导入后 | 全量知识库 | | 月归档 | 每月 | 全量压缩包、来源快照 | | 发布快照 | 每次对外导出或交付前 | docs、metadata、exports |  备份目录建议：  backups/ 2026-05-22-before-restructure.zip 2026-05-22-after-restructure.zip  ## 6. 治理层  治理层用于区分内容可信度和生命周期。  | 状态 | 含义 | 处理方式 | | --- | --- | --- | | `authoritative` | 当前权威结论 | 可被引用、导出、用于培训 | | `draft` | 草稿 | 可协作编辑，但不作为最终口径 | | `pending` | 待确认 | 进入问题池，不写成确定结论 | | `deprecated` | 已废弃 | 保留历史，不作为当前规则 | | `archived` | 历史归档 | 只用于追溯 |  知识库首页和索引默认只展示 `authoritative` 与必要的 `draft`；`pending`、`deprecated`、`archived` 需要单独标识。  ## 7. 应用层  应用层定义知识库怎么被使用。  | 使用场景 | 实现方式 | | --- | --- | | 本地全文检索 | 使用编辑器搜索、`rg`、本地索引 JSON | | 快速查阅 | README、功能地图、概念词典、目录页 | | 引用复用 | 每页维护来源、相关文档和稳定标题 | | 离线查阅 | Markdown 原文 + 图片本地化 + 导出 HTML/PDF | | 需求追溯 | 来源台账 + `source_files` 元数据 | | 培训交付 | 从权威页导出产品手册或培训资料 | | AI/RAG 准备 | 统一 Markdown、元数据、切片、索引 |  ### 7.1 检索索引建议  本地索引可以生成 JSON：  { \"id\": \"order-lifecycle\", \"title\": \"订单-生命周期与状态规则\", \"path\": \"docs/20-业务对象/订单-生命周期与状态规则.md\", \"domain\": \"贸易端\", \"module\": \"订单\", \"tags\": [\"订单\", \"状态\", \"权限\"], \"keywords\": [\"完成订单\", \"取消订单\", \"重启订单\"], \"updated_at\": \"2026-05-22\", \"permission\": \"internal\" }  ### 7.2 AI/RAG 切片建议  后续如果用于 RAG，建议按以下规则切片：  - 按二级标题或三级标题切片，不按固定字数硬切。 - 每个切片保留 `title`、`module`、`source_files`、`permission`。 - 权限为 `restricted` 或 `confidential` 的内容单独建索引。 - 原始需求和权威知识页分开索引，回答时优先引用权威页。  ## 8. 自动化层  自动化层用于降低维护成本。  | 脚本 | 功能 | | --- | --- | | `scan-sources` | 扫描 `最新需求源（source:thoughts-v2-current）` 和 `sources/`，生成来源清单 | | `build-documents-csv` | 提取 Markdown 元数据，生成 `documents.csv` | | `build-search-index` | 生成 `search-index.json` | | `check-links` | 检查本地链接、图片链接、外部链接 | | `check-metadata` | 检查必填元数据是否缺失 | | `backup` | 打包备份 | | `export-html` | 导出可离线浏览的 HTML | | `export-rag` | 生成 RAG 导入包 |  建议优先实现三个脚本：  1. 扫描来源文档，生成 `metadata/sources.csv`。 2. 扫描知识页，生成 `metadata/documents.csv`。 3. 生成全文检索索引 `metadata/search-index.json`。  ## 9. 来源追溯层  来源追溯层解决“这个结论从哪里来”的问题。  每条正式知识结论至少应该能追溯到以下一种来源：  - 原始需求文档。 - 评审纪要。 - 权限矩阵或配置表。 - 原型截图。 - 线上产品行为。 - 产品负责人确认记录。  来源追溯建议：  知识页正文只写当前结论 来源需求列在文末 复杂规则在来源台账中做映射 外部链接必须尽量导出本地快照 待确认内容放入问题池  ## 10. 当前缺口与下一步  当前已具备：  - 知识库入口。 - 产品总览。 - 核心概念词典。 - 功能地图。 - 完整产品知识架构。 - 需求来源台账。 - 待办与问题池。  下一步建议补齐：  1. `metadata/documents.csv`：登记所有知识页元数据。 2. `metadata/sources.csv`：登记所有原始需求来源。 3. `docs/20-业务对象/`：拆出 FlowSpace、订单、里程碑、工单、资源库。 4. `docs/40-权限与安全/`：拆出完整权限体系。 5. `scripts/`：增加扫描和索引脚本。"}, {"path": "99-待办与问题池.md", "title": "待办与问题池", "folder": ".", "text": "# 待办与问题池  本页记录尚未确认、需要拆页、需要补充来源或存在跨文档冲突的 模板到FlowSpace.md)、[订单生命周期](./docs/30-业务流程/订单生命周期.md)、[工单采集与批复](./docs/30-业务流程/工单采集与批复.md)、[跨团队协作](./docs/30-业务流程/跨团队协作.md)、[资源库引用与同步](./docs/30-业务流程/资源库引用与同步.md)、[自动化执行](./docs/30-业务流程/自动化执行.md)、[移动端采集](./docs/30-业务流程/移动端采集.md)、[订单复用关系](./docs/30-业务流程/订单复用关系.md)。 9. 要查权限边界，先读 [权限体系总表](./docs/40-权限与安全/权限体系总表.md)，再按场景进入 [团队权限](./docs/40-权限与安全/团队权限.md)、[FlowSpace业务角色权限](./docs/40-权限与安全/FlowSpace业务角色权限.md)、[协作FlowSpace权限](./docs/40-权限与安全/协作FlowSpace权限.md)、[数据围栏](./docs/40-权限与安全/数据围栏.md)、[资源库权限](./docs/40-权限与安全/资源库权限.md)、[仪表盘与报告权限](./docs/40-权限与安全/仪表盘与报告权限.md)。 10. 要理解配置底座，读 [表单设计组件](./docs/50-模板表单与数据/表单设计组件.md)、[表单属性与显隐设置](./docs/50-模板表单与数据/表单属性与显隐设置.md)、[公式函数](./docs/50-模板表单与数据/公式函数.md)、[PDF与批量导入导出](./docs/50-模板表单与数据/PDF与批量导入导出.md)、[第三方数据对接](./docs/50-模板表单与数据/第三方数据对接.md)、[验货组件流程](./docs/50-模板表单与数据/验货组件流程.md)。 11. 要理解协作通知与自动化，读 [消息中心与实时通知](./docs/60-协作通知与自动化/消息中心与实时通知.md)、[邮件协作](./docs/60-协作通知与自动化/邮件协作.md)、[批量邮件协作](./docs/60-协作通知与自动化/批量邮件协作.md)、[自动化配置](./docs/60-协作通知与自动化/自动化配置.md)、[自动化与系统执行日志](./docs/60-协作通知与自动化/自动化与系统执行日志.md)。 12. 要理解展示分析，读 [工作台与FlowSpace入口](./docs/70-展示分析/工作台与FlowSpace入口.md)、[订单日程与任务中心](./docs/70-展示分析/订单日程与任务中心.md)、[常用视图与视图设置](./docs/70-展示分析/常用视图与视图设置.md)、[仪表盘管理与设计器](./docs/70-展示分析/仪表盘管理与设计器.md)、[报告管理与权限](./docs/70-展示分析/报告管理与权限.md)。 13. 要理解日志审计，读 [设置操作日志](./docs/80-日志审计/设置操作日志.md)、[订单跟踪记录](./docs/80-日志审计/订单跟踪记录.md)、[动态与评论](./docs/80-日志审计/动态与评论.md)、[历史记录与快照](./docs/80-日志审计/历史记录与快照.md)、[系统与集成执行日志](./docs/80-日志审计/系统与集成执行日志.md)。 14. 要管理来源与问题，读 [来源入库状态](./docs/90-来源与待办/来源入库状态.md)、[待确认问题](./docs/90-来源与待办/待确认问题.md)、[外部链接快照清单](./docs/90-来源与待办/外部链接快照清单.md)、[版本变更记录](./docs/90-来源与待办/版本变更记录.md)。 15. 要系统理解完整产品，读 [04-Linkincrease完整知识库架构与内容.md](./04-Linkincrease完整知识库架构与内容.md)。 16. 要追溯原始需求依据，查 [05-需求文档来源台账.md](./05-需求文档来源台账.md)、[metadata/sources.csv](./metadata/sources.csv)、[metadata/source-manifest.csv](./metadata/source-manifest.csv) 和 `最新需求源（source:thoughts-v2-current）`。 17. 要规划本地存储、元数据、检索、备份和后续 AI/RAG 导入，查 [06-知识库工程架构.md](./06-知识库工程架构.md)。  ## 当前资料来源  本次整理主要依据 `最新需求源（source:thoughts-v2-current）` 中的 60 余份迭代需求文档，覆盖：  - 贸易端：账号、个人中心、团队、工作台、FlowSpace、订单列表、订单详情、订单管理、资源库、自动化、消息、日志、仪表盘、报告权限。 - 运营端：用户/团队/FlowSpace/资源库数据管理、模板中心、业务模板、资源库模板、表单设计器、仪表盘、第三方数据对接、外部 API、报告管理、软件管理。 - 采集端：首页、任务列表、任务搜索、任务详情、消息中心、我的、登录。 - 公共能力：公式函数、系统自动执行日志、验货组件流程。  ## 使用原则  1. 需求原文不等于知识库结论。原文用于追溯，知识库正文用于沉淀当前共识。 2. 同一能力跨多份需求出现时，以业务对象和流程归并，而不是按迭代时间重复记录。 3. 权限、状态、通知、日志、导入导出、协作边界必须单独沉淀，不隐藏在页面说明里。 4. 不确定内容进入 [99-待办与问题池.md](./99-待办与问题池.md)，确认后再合入正式页面。"}, {"path": "docs/00-入门/README.md", "title": "README", "folder": "docs/00-入门", "text": "﻿# 00 入门  入门目录用于帮助新成员快速理解 Linkincrease。  建议阅读顺序：  1. 根目录 `README.md` 2. 根目录 `01-产品总览.md` 3. 根目录 `02-核心概念词典.md` 4. 根目录 `03-功能地图.md` 5. [迭代需求设计工作流.md](./迭代需求设计工作流.md) 6. `docs/20-业务对象/` 中的 FlowSpace、订单、工单与批复、资源库  ## 已沉淀页面  - [迭代需求设计工作流.md](./迭代需求设计工作流.md)  后续可将根目录总览类文档复制或拆分到本目录。"}, {"path": "docs/00-入门/迭代需求设计工作流.md", "title": "迭代需求设计工作流", "folder": "docs/00-入门", "text": "# 迭代需求设计工作流  ## 定位  本页说明如何在新增迭代需求设计时复用 Linkincrease 知识库。目标不是把知识库当资料仓库，而是让它参与需求设计前的背景检索、设计中的规则补全、设计后的影响范围检查和最终入库。  本流程已蒸馏为本地 Codex Skill：`linkincrease-requirement-design`。在其他文件夹进行迭代功能设计或需求文档编写时，可以直接要求使用该 Skill。  适用场景：  - 新增功能需求。 - 调整已有功能规则。 - 补充权限、状态、通知、日志、导入导出等细节。 - 将其他文件夹中的需求设计同步沉淀到知识库。  ## 1. 需求设计前：查背景  开始写需求前，先确认该需求属于哪个产品端、业务对象和流程节点。  | 要确认的问题 | 优先查看 | |---|---| | 这个需求属于哪个端 | [../../03-功能地图.md](../../03-功能地图.md)、[../10-产品端/运营端.md](../10-产品端/运营端.md)、[../10-产品端/贸易端.md](../10-产品端/贸易端.md)、[../10-产品端/采集端.md](../10-产品端/采集端.md) | | 涉及哪些核心对象 | [../../02-核心概念词典.md](../../02-核心概念词典.md)、[../20-业务对象/FlowSpace.md](../20-业务对象/FlowSpace.md)、[../20-业务对象/订单.md](../20-业务对象/订单.md)、[../20-业务对象/工单与批复.md](../20-业务对象/工单与批复.md)、[../20-业务对象/资源库.md](../20-业务对象/资源库.md) | | 处于哪条业务流程 | [../30-业务流程/从模板到FlowSpace.md](../30-业务流程/从模板到FlowSpace.md)、[../30-业务流程/订单生命周期.md](../30-业务流程/订单生命周期.md)、[../30-业务流程/工单采集与批复.md](../30-业务流程/工单采集与批复.md)、[../30-业务流程/跨团队协作.md](../30-业务流程/跨团队协作.md) | | 是否已有类似历史需求 | [../../05-需求文档来源台账.md](../../05-需求文档来源台账.md)、[../../metadata/source-manifest.csv](../../metadata/source-manifest.csv)、`最新需求源（source:thoughts-v2-current）` |  建议向知识库提问：  基于当前知识库，帮我梳理这个需求涉及哪些已有模块、对象、流程和权限。  ## 2. 需求设计中：补齐规则  写需求正文时，至少检查以下维度。  | 维度 | 需要写清楚 | |---|---| | 产品端 | 运营端、贸易端、采集端分别是否有入口或影响 | | 用户角色 | 平台运营、团队管理员、普通成员、协作团队成员、采集人员等 | | 业务对象 | FlowSpace、订单、里程碑、工单、资源库、模板、报告、仪表盘等 | | 入口 | 菜单、列表、详情、设置页、弹窗、移动端页面 | | 操作 | 查看、新增、编辑、删除、批量、导入、导出、复制、同步 | | 权限 | 团队权限、FlowSpace 业务角色、协作 FlowSpace 角色、资源库权限、数据围栏 | | 状态限制 | 进行中、已完成、已取消、已删除、停用、失效等状态下能否操作 | | 数据影响 | 新老数据、历史快照、字段默认值、同步范围、冲突处理 | | 通知协作 | 站内消息、实时消息、邮件、短信、任务中心、指派规则 | | 日志审计 | 操作日志、动态、历史记录、跟踪记录、系统执行日志 | | 异常提示 | 无权限、数据不存在、状态不允许、导入失败、同步失败等 | | 导入导出 | 模板、字段、失败原因、权限、数据范围、异步任务 |  建议向知识库提问：  帮我检查这份需求是否遗漏权限、状态、通知、日志、导入导出、历史数据影响。  ## 3. 需求设计后：做影响范围检查  需求初稿完成后，用知识库做一次影响范围复盘。  | 检查项 | 说明 | |---|---| | 术语是否统一 | 使用 [../../02-核心概念词典.md](../../02-核心概念词典.md) 中的标准名称，例如 FlowSpace | | 是否影响功能地图 | 新增入口或模块时，需要更新 [../../03-功能地图.md](../../03-功能地图.md) | | 是否影响对象页 | 新规则应回填到对应业务对象页 | | 是否影响流程页 | 流程变化应回填到 `docs/30-业务流程/` | | 是否影响权限页 | 权限变化应回填到 `docs/40-权限与安全/` | | 是否影响通知和自动化 | 通知、邮件、任务、自动化变化应回填到 `docs/60-协作通知与自动化/` | | 是否影响日志审计 | 日志、历史记录、跟踪记录应回填到 `docs/80-日志审计/` | | 是否存在待确认问题 | 不确定项进入 [../../99-待办与问题池.md](../../99-待办与问题池.md) |  建议向知识库提问：  基于知识库帮我做这份需求的影响范围分析，并列出需要同步更新的知识页。  ## 4. 需求确认后：同步入库  当需求评审确认后，按以下步骤沉淀。  1. 将最终需求文件放入当前迭代需求设计文件夹。 2. 如该需求也属于最新需求源，将文件同步到 `最新需求源（source:thoughts-v2-current）`。 3. 运行 `python scripts\\scan_source_manifest.py` 更新来源清单。 4. 更新 [../../05-需求文档来源台账.md](../../05-需求文档来源台账.md) 的归属模块。 5. 将确认后的规则写入对应知识页。 6. 更新 `metadata/documents.csv`、`metadata/sources.csv`、`metadata/search-index.json` 中的相关记录。 7. 如有未决问题，更新 [../../99-待办与问题池.md](../../99-待办与问题池.md) 和 [../90-来源与待办/待确认问题.md](../90-来源与待办/待确认问题.md)。 8. 如是较大迭代，更新 [../90-来源与待办/版本变更记录.md](../90-来源与待办/版本变更记录.md)。  ## 5. 推荐提问模板  ### 新需求启动  我准备设计一个新需求：{一句话描述}。 请基于 Linkincrease 知识库，帮我梳理背景、相关模块、已有规则、可能影响范围和设计注意事项。  ### 需求补漏  这是我的需求草稿：{文件路径或内容}。 请基于知识库检查是否遗漏权限、状态、通知、日志、导入导出、历史数据、异常提示和多端差异。  ### 需求冲突检查  请对比这份新需求和知识库已有规则，找出可能冲突、重复或需要产品确认的点。  ### 需求入库  这份需求已确认，请把它同步进 Linkincrease 知识库：更新来源台账、相关知识页、metadata 和待确认问题。  ## 6. 输出物建议  每个迭代需求设计完成后，建议至少形成以下内容：  | 输出物 | 用途 | |---|---| | 需求正文 | 给产品、研发、测试评审 | | 影响范围清单 | 明确会改哪些页面、接口、权限、数据和日志 | | 权限与状态矩阵 | 降低研发和测试理解成本 | | 异常提示清单 | 统一前端提示和测试断言 | | 测试关注点 | 提前覆盖边界场景 | | 知识库更新清单 | 确保确认后的规则沉淀回知识库 |  ## 7. 设计原则  1. 新需求不要只写页面交互，要补齐对象、流程、权限、状态、数据和日志。 2. 能复用已有概念时，不新增同义词。 3. 需求原文用于评审，知识库用于沉淀最终共识。 4. 不确定项不硬写成结论，先进入问题池。 5. 每次迭代结束，都要把确认后的新规则同步回知识库。"}, {"path": "docs/10-产品端/README.md", "title": "10 产品端", "folder": "docs/10-产品端", "text": "# 10 产品端  本目录按产品端沉淀 Linkincrease 的端侧定位、职责边界、主要模块和跨端数据关系。  ## 页面  | 页面 | 用途 | | --- | --- | | [运营端](./运营端.md) | 平台配置、模板、监管、集成、软件管理和运营后台能力总览 | | [贸易端](./贸易端.md) | 客户团队业务协同主平台能力总览 | | [采集端](./采集端.md) | 移动任务、采集、批复、消息和个人中心能力总览 | | [三端数据关系](./三端数据关系.md) | 梳理运营端、贸易端、采集端之间的数据主从、流转和权限边界 | | [账号与个人中心](./账号与个人中心.md) | 统一注册、登录、忘记密码、个人信息、多语言、退出账号和采集端我的 |  ## 维护原则  1. 单端菜单和入口写在本目录。 2. 跨端共同对象写入 `20-业务对象/`。 3. 跨端流程写入 `30-业务流程/`。 4. 权限、日志、通知、自动化、导入导出等横向能力应同步写入对应目录。"}, {"path": "docs/10-产品端/三端数据关系.md", "title": "三端数据关系", "folder": "docs/10-产品端", "text": "﻿# 三端数据关系  ## 1. 总览  Linkincrease 的三端不是并列孤岛，而是围绕同一套业务对象形成配置、执行、监管和回流关系。  flowchart LR A[\"运营端<br/>模板、配置、监管、集成\"] --> B[\"贸易端<br/>团队、FlowSpace、订单、资源库、协作\"] B --> C[\"采集端<br/>任务、采集、批复、消息\"] C --> B B --> A  简化理解：  - 运营端定义和监管平台能力。 - 贸易端承载客户团队的业务运行。 - 采集端处理移动执行任务，并把结果回流贸易端。  ## 2. 数据主从关系  | 数据或能力 | 主维护端 | 使用端 | 说明 | | --- | --- | --- | --- | | 用户账号 | 运营端监管，用户自维护 | 贸易端、采集端 | 运营端可查看和管理账号状态；用户在个人中心维护个人信息 | | 团队 | 贸易端创建维护，运营端监管 | 贸易端、运营端、采集端 | 团队是业务归属单位；采集端通过团队切换查看任务 | | FlowSpace | 贸易端创建维护，运营端监管 | 贸易端、采集端、运营端 | FlowSpace 承载订单、工单、资源库应用、仪表盘和报告 | | 业务模板 | 运营端 | 贸易端 | 贸易端创建 FlowSpace 时使用运营端模板 | | 资源库模板 | 运营端 | 贸易端 | 贸易端创建团队资源库时使用运营端模板 | | 表单组件和显隐规则 | 运营端 | 贸易端、采集端 | 采集端任务详情页展示和填写规则受模板配置影响 | | 订单 | 贸易端 | 采集端、运营端 | 订单在贸易端创建和管理；采集端展示任务关联订单；运营端可监管数据 | | 里程碑 | 贸易端 | 采集端、运营端 | 里程碑定义订单流程节点和批复任务 | | 工单 | 贸易端 | 采集端、运营端 | 工单可在贸易端发起，在采集端移动填写和提交 | | 工单批复 | 贸易端 | 采集端、运营端 | 批复任务可在采集端处理，结果回流贸易端 | | 里程碑批复 | 贸易端 | 采集端、运营端 | 采集端可处理里程碑批复任务 | | 资源库数据 | 贸易端 | 贸易端、采集端、运营端 | 资源库数据可被订单或工单引用，运营端监管资源库数据 | | 自动化 | 贸易端配置，运营端监管 | 贸易端、运营端 | 自动化执行结果进入日志，部分动作影响订单、工单、资源库 | | 消息通知 | 贸易端和系统触发 | 贸易端、采集端 | 消息状态需要跨端一致 | | 仪表盘和报告 | 运营端配置或监管，贸易端使用 | 贸易端、运营端 | 权限控制决定查看和管理范围 | | 日志审计 | 系统记录 | 贸易端、运营端 | 设置、操作、动态、历史、系统执行均需要可追溯 |  ## 3. 核心数据流  ### 3.1 从模板到 FlowSpace  1. 运营端维护业务模板、资源库模板、表单组件、字段规则。 2. 贸易端在工作台选择模板创建 FlowSpace。 3. FlowSpace 生成订单、里程碑、工单、权限、仪表盘等业务空间。 4. 后续模板更新需要按同步规则影响已创建的 FlowSpace。  参考：[从模板到FlowSpace](../30-业务流程/从模板到FlowSpace.md)。  ### 3.2 从订单到移动采集  1. 贸易端创建或导入订单。 2. 贸易端在订单里程碑下创建工单、工单批复或里程碑批复。 3. 采集端按用户、团队、FlowSpace、任务状态展示待办任务。 4. 执行人员在采集端填写工单或提交批复。 5. 数据、动态、历史记录和任务状态回流贸易端。  参考：[工单采集与批复](../30-业务流程/工单采集与批复.md)、[移动端采集](../30-业务流程/移动端采集.md)。  ### 3.3 从资源库到业务表单  1. 运营端维护资源库模板。 2. 贸易端基于模板创建团队资源库。 3. FlowSpace 应用资源库数据范围。 4. 订单或工单字段引用资源库数据。 5. 资源库数据变更后，按引用和同步规则更新业务数据。 6. 系统记录资源库同步和字段变更历史。  参考：[资源库引用与同步](../30-业务流程/资源库引用与同步.md)。  ### 3.4 从协作到通知  1. 贸易端发起成员邀请、协作团队邀请、工单指派或邮件协作。 2. 系统按场景生成消息、实时通知、邮件或任务入口。 3. 贸易端和采集端展示未读、待办、关注、团队指派等状态。 4. 处理结果回流并更新任务状态、动态和日志。  参考：[消息中心与实时通知](../60-协作通知与自动化/消息中心与实时通知.md)、[邮件协作](../60-协作通知与自动化/邮件协作.md)。  ## 4. 权限边界  三端权限关系应按“平台监管、团队归属、FlowSpace 业务角色、协作方角色、数据围栏、资源权限、展示权限”分层理解。  | 层级 | 主要控制点 | | --- | --- | | 平台监管权限 | 运营端可查看和监管平台用户、团队、FlowSpace、资源库、软件和系统记录 | | 团队权限 | 贸易端团队拥有者、管理员、成员等角色控制团队设置和成员管理 | | FlowSpace 权限 | FlowSpace 业务角色控制订单、里程碑、工单、仪表盘、报告等操作 | | 协作权限 | 协作团队和协作方角色控制外部团队可见和可操作范围 | | 数据围栏 | 控制字段、标签、数据范围对不同成员或团队是否可见 | | 采集端权限 | 采集端按用户任务、编辑权限、指派权限决定按钮和表单状态 |  参考：[权限体系总表](../40-权限与安全/权限体系总表.md)。  ## 5. 知识库维护规则  1. 涉及三端共有对象时，优先写入 `20-业务对象/`。 2. 涉及跨端动作链路时，优先写入 `30-业务流程/`。 3. 涉及单端菜单、入口和页面职责时，写入 `10-产品端/`。 4. 涉及权限边界时，必须同步引用或更新 `40-权限与安全/`。 5. 涉及消息、日志、自动化、导入导出时，不要只写在页面说明里，应同步沉淀到对应横向能力目录。  ## 6. 来源  - `01-产品总览.md` - `03-功能地图.md` - `docs/10-产品端/运营端.md` - `docs/10-产品端/贸易端.md` - `docs/10-产品端/采集端.md` - `docs/20-业务对象/` - `docs/30-业务流程/` - `docs/40-权限与安全/`"}, {"path": "docs/10-产品端/账号与个人中心.md", "title": "账号与个人中心", "folder": "docs/10-产品端", "text": "﻿# 账号与个人中心  ## 1. 定位  账号与个人中心是 Linkincrease 用户进入平台和管理个人身份信息的基础能力，覆盖贸易端和采集端。  贸易端承担完整账号链路，包括注册、密码登录、验证码登录、忘记密码、个人信息、语言切换、团队切换和退出账号。采集端复用贸易端注册后的账号体系，支持邮箱密码登录、忘记密码、我的、修改密码、语言设置、检查更新和退出账号。  ## 2. 端侧边界  | 能力 | 贸易端 | 采集端 | | --- | --- | --- | | 注册 | 支持邮箱验证和个人信息填写 | 不支持注册，引导用户到 Linkincrease 电脑端注册 | | 密码登录 | 支持 | 支持 | | 验证码登录 | 支持 | 当前来源仅说明邮箱密码登录 | | 忘记密码 | 支持验证邮箱和重设密码 | 支持验证邮箱和重设密码 | | 个人信息 | 支持头像、姓名、性别、邮箱、手机号、重置密码 | 支持头像、姓名、邮箱、联系方式、个人信息编辑 | | 团队切换 | 支持我的团队、拥有者标识、团队码复制、创建团队 | 通过采集端首页团队切换查看对应任务 | | 多语言 | 支持跟随系统、简体中文、English | 同贸易端 | | 检查更新 | 不适用 | 支持 APP 版本检查、强制更新和可选更新 | | 退出账号 | 退出后回到登录页 | 需确认，确认后回到登录页 |  ## 3. 贸易端注册  贸易端注册分为两个步骤。  ### 3.1 邮箱验证  字段与规则：  | 字段 | 规则 | | --- | --- | | 邮箱 | 必填；格式需包含且仅包含一个 `@`，并至少包含一个 `.` | | 验证码 | 必填；发送到邮箱的 6 位数字验证码，最多输入 6 位 |  获取验证码规则：  - 点击前校验邮箱格式，无效提示 `请输入正确的邮箱地址`。 - 校验邮箱是否已注册，已注册提示 `您的邮箱已注册，请返回登录`。 - 点击后进入 60 秒倒计时，倒计时结束后才可再次获取。 - 注册验证码邮件模板来自“邮件、短信、通知规则及模板”中的注册验证码模板。  验证邮箱规则：  - 必填项为空时提示 `请输入xxx`。 - 验证码有效期为 5 分钟，超时提示 `验证码错误或已过期`。 - 邮箱与验证码不匹配时提示 `验证码错误或已过期`。 - 同一账号验证邮箱 6 次仍未成功时，限制 2 小时内再次验证，并提示 `验证失败次数已达上限，请2小时后重试。如遇问题，请邮件联系我们：support@Linkincrease.com`。 - 校验通过后进入个人信息填写。  ### 3.2 个人信息填写  字段与规则：  | 字段 | 规则 | | --- | --- | | 姓名 | 必填，限制 20 字符 | | 性别 | 单选：男、女 | | 手机号 | 数字输入，最多 15 字符 | | 设置密码 | 必填；6 到 16 位；必须同时包含字母和数字；可兼容特殊符号；不能包含空格 | | 确认密码 | 必填；必须与设置密码一致 |  提交校验顺序：  1. 必填校验。 2. 设置密码包含空格时提示 `密码请勿包含空格`。 3. 密码不符合规则时提示 `密码长度为6-16位，且必须同时包含字母与数字，兼容特殊符号`。 4. 两次密码不一致时提示 `两次输入的密码不一致，请重新输入`。 5. 校验通过后完成注册，提示 `注册成功`，并自动登录。  ## 4. 贸易端登录  ### 4.1 密码登录  字段与规则：  | 字段 | 规则 | | --- | --- | | 邮箱 | 必填 | | 密码 | 必填；默认密码输入框，可通过眼睛图标切换明文 | | 记住我 | 勾选后浏览器记住本次登录账号和密码，下次打开登录页默认填入 |  登录校验顺序：  1. 必填项未填时提示 `请输入xxx`。 2. 邮箱未注册时提示 `该邮箱尚未注册，请先注册账号`，可跳转注册页。 3. 密码错误时提示 `您的密码错误，请重新输入。或 重置密码`，可跳转忘记密码页。 4. 密码登录和验证码登录累计验证失败 6 次仍未成功时，限制 2 小时内再次登录。 5. 校验通过后，若用户已加入团队，进入上一次登录的团队工作台；若未加入团队，进入创建团队页面。  登录状态补充规则：  - 登录后 2 小时无任何操作，再次操作时退回密码登录页，并提示 `登录信息已失效，请重新登录`。 - 登录状态下多处登录时，当前账号被踢出并回到密码登录页，提示 `账号在异地登录，如非本人操作，建议修改密码`。  ### 4.2 验证码登录  字段与规则：  | 字段 | 规则 | | --- | --- | | 邮箱 | 必填 | | 验证码 | 必填；发送到邮箱的 6 位数字验证码 |  获取验证码规则：  - 邮箱未注册时提示 `该邮箱尚未注册，请先注册`，可跳转注册页。 - 点击后进入 60 秒倒计时。 - 当前浏览器获取验证码 6 次仍未进入下一步时，限制 2 小时内再次获取，并提示 `获取验证码次数已达上限，请稍后重试`。 - 连续输入 3 次错误密码后出现图形验证码，成功进入下一步后消失。  登录校验规则与密码登录共享失败次数限制。验证码有效期为 5 分钟，超时或不匹配提示 `验证码错误或已过期`。  ## 5. 忘记密码与修改密码  贸易端忘记密码分为验证邮箱和重设密码。  验证邮箱规则：  - 邮箱和验证码必填。 - 邮箱未注册时提示 `该邮箱尚未注册，请先注册`。 - 获取验证码后进入 60 秒倒计时。 - 验证码有效期为 5 分钟。 - 邮箱与验证码不匹配时提示 `验证码错误或已过期`。 - 验证失败 6 次后限制 2 小时内再次验证。 - 重置成功后，登录的验证失败次数清零。  重设密码规则：  - 密码规则同注册密码。 - 必填项为空提示 `请输入xxx`。 - 密码不符合规则提示 `密码长度为6-16位,且必须同时包含字母与数字,兼容特殊符号`。 - 两次密码不一致提示 `两次输入的密码不一致，请重新输入`。 - 校验通过后提示 `密码重置成功`，并自动登录。  采集端修改密码逻辑同忘记密码，但邮箱账号框不可编辑，并带入当前登录邮箱。修改成功后需要重新登录。  ## 6. 个人中心  ### 6.1 贸易端个人中心  个人信息包括：  - 头像：默认取姓名第一个字作为头像；点击可更换本地图片；若未上传自定义头像，修改姓名会同步修改默认头像。 - 姓名：可编辑。 - 性别：可编辑。 - 邮箱：当前账号，不可修改。 - 手机号：可编辑。 - 重置密码：修改当前账号密码。  我的团队包括：  - 展示当前用户加入的所有团队。 - 用户是拥有者时展示拥有者标识。 - 支持切换到对应团队。 - 团队码支持复制，成功后提示 `复制成功`。 - 支持创建新团队。  ### 6.2 采集端我的  采集端“我的”包括：  - 个人信息：头像、姓名、邮箱、联系方式。 - 个人信息编辑：姓名、性别、联系方式。 - 多语言设置：同贸易端。 - 修改密码：成功后重新登录。 - 帮助中心：跳转平台帮助中心。 - 联系成功经理：弹出企业微信二维码。 - 检查更新。 - 退出账号。  ## 7. 多语言  语言选项包括：  - 跟随系统。 - 简体中文。 - English。  默认选项为跟随系统。跟随系统表示跟随浏览器或系统语言设置。  语言设置有两个入口：  - 登录页面。 - 登录后的个人中心或采集端“我的”。  切换语言后，需要后端保存到账号，同时更新当前浏览器或 App 语言。简体中文和英文选项文案固定为 `简体中文` 和 `English`。  ## 8. 采集端登录与版本更新  采集端登录使用贸易端已注册邮箱和密码。  登录校验顺序：  1. 必填项未填提示 `请输入xxx`。 2. 邮箱未注册提示 `该邮箱尚未注册，请至Linkincrease电脑端注册`。 3. 校验码输入错误或失效提示 `校验码不正确或已失效`。 4. 密码错误提示 `您的密码错误，请重新输入。或 重置密码`。  采集端忘记密码通过后，进入密码重置页面。重置成功后提示 `密码重置成功`，返回密码登录页或 3 秒自动进入首页，具体行为需要后续产品确认统一。  采集端检查更新规则：  - 显示后台管理的最新 APP 版本号。 - 当前 APP 版本号小于最小支持版本号时，展示强制更新界面，更新包来自后台上传路径。 - 当前 APP 版本号大于等于最小支持版本号时，展示可选更新界面。 - 点击稍后更新关闭弹窗，24 小时后再提示。 - 点击马上更新下载后台最新安装包。  ## 9. 待确认问题  | 编号 | 问题 | 影响 | | --- | --- | --- | | A001 | 采集端忘记密码成功后是返回登录页，还是 3 秒自动进入首页，来源中存在两个描述 | 采集端账号体验和验收口径 | | A002 | 采集端是否未来支持验证码登录 | 采集端登录方式和安全策略 | | A003 | 登录页语言设置与登录后个人中心语言设置的优先级是否已有完整流程图本地化来源 | 多语言持久化逻辑 | | A004 | 邮件、短信、通知规则及模板未独立入库 | 注册、登录、重置密码邮件模板追溯 |  ## 10. 来源  - `source:thoughts-v2-current/v2.0.x/贸易端/【贸易端】【账号】注册登录、忘记密码.md` - `source:thoughts-v2-current/v2.0.x/贸易端/【贸易端】【个人中心】个人信息、切换语言、退出账号.md` - `source:thoughts-v2-current/v2.3.x/采集端/【采集端】【登录】邮箱_密码登录、忘记密码.md` - `source:thoughts-v2-current/v2.3.x/采集端/【采集端】【我的】个人中心页.md` - `docs/10-产品端/贸易端.md` - `docs/10-产品端/采集端.md` "}, {"path": "docs/10-产品端/贸易端.md", "title": "贸易端", "folder": "docs/10-产品端", "text": "﻿# 贸易端  ## 1. 定位  贸易端是 Linkincrease 的客户业务协同主平台，面向客户团队、团队成员、协作团队和业务管理人员。  它承载团队、FlowSpace、订单、里程碑、工单、资源库、自动化、消息、仪表盘、报告和日志审计等核心业务。大部分日常业务创建、协作、查看、审批和数据复用都在贸易端完成。  ## 2. 核心职责  | 职责 | 说明 | | --- | --- | | 账号与个人设置 | 注册登录、忘记密码、个人信息、头像、语言、退出账号 | | 团队管理 | 创建团队、维护团队信息、角色、成员、协作团队 | | FlowSpace 工作空间 | 创建 FlowSpace、维护设置、成员、业务角色、数据围栏、协作 FlowSpace | | 订单执行 | 创建、编辑、导入、导出、查看、完成、取消、重启订单 | | 工单与批复 | 发起工单、采集、批复、指派、终止、评论和动态协作 | | 资源库 | 维护团队资源库、引用资源库数据、同步到 FlowSpace、分享资源库 | | 自动化 | 配置触发条件、执行动作、定时任务、执行日志 | | 协作通知 | 消息中心、实时通知、邮件协作、批量邮件协作 | | 展示分析 | 工作台、订单日程、任务中心、常用视图、仪表盘、报告 | | 日志审计 | 操作日志、订单跟踪记录、动态、历史记录、快照 |  ## 3. 主要模块  ### 3.1 账号与个人中心  贸易端账号能力包括注册登录、忘记密码、个人信息维护、头像、姓名、性别、邮箱、手机号、重置密码、语言切换和退出账号。  个人中心还需要展示当前用户加入的团队列表，并支持切换团队。若用户是团队拥有者，应展示拥有者标识。团队代码应支持复制。  语言切换通常包含跟随系统、简体中文、英文等选项，切换后需要保存到账户并更新当前浏览器语言。  ### 3.2 团队与协作团队  团队是贸易端业务归属的组织单位。用户先进入团队，再进入团队下的 FlowSpace、订单、资源库和仪表盘。  团队管理需要覆盖：  - 创建团队。 - 修改团队信息。 - 维护团队角色。 - 邀请成员。 - 管理协作团队。 - 记录成员邀请和协作邀请流程。  团队权限口径详见 [团队权限](../40-权限与安全/团队权限.md)。  ### 3.3 工作台与 FlowSpace  工作台是贸易端进入业务的日常入口。它提供团队下 FlowSpace 列表、FlowSpace 分组、创建 FlowSpace、星标、排序和常用入口。  FlowSpace 是承载订单、里程碑、工单、资源库引用、自动化、仪表盘和报告的业务空间。FlowSpace 设置需要维护基本信息、成员、业务角色、协作团队、标签、数据围栏等。  FlowSpace 对象口径详见 [FlowSpace](../20-业务对象/FlowSpace.md)。  ### 3.4 订单、里程碑、工单与批复  订单是 FlowSpace 下的主业务实体。里程碑是订单流程节点，工单是里程碑下的执行任务，批复是对工单或里程碑结果的确认动作。  贸易端负责订单的完整生命周期：  - 创建订单。 - 编辑订单。 - 导入和导出订单。 - 查看订单列表和详情。 - 管理里程碑计划。 - 发起和处理工单。 - 执行工单批复和里程碑批复。 - 完成、取消、重启订单。  相关口径详见 [订单](../20-业务对象/订单.md)、[里程碑](../20-业务对象/里程碑.md)、[工单与批复](../20-业务对象/工单与批复.md)。  ### 3.5 资源库  资源库是团队级主数据管理能力。贸易端用于维护资源库表数据、将资源库应用到 FlowSpace、在订单或工单中引用资源库数据、查看编辑历史、管理资源库视图和分享资源库。  相关口径详见 [资源库](../20-业务对象/资源库.md) 和 [资源库引用与同步](../30-业务流程/资源库引用与同步.md)。  ### 3.6 自动化、消息与邮件协作  贸易端支持自动化配置，包括触发条件、执行动作、通知动作和定时任务。自动化执行结果应进入执行日志。  协作通知能力包括：  - 站内消息中心。 - 在线实时消息。 - 邮件协作。 - 批量邮件协作。 - 任务相关提醒。  相关口径详见 [自动化配置](../60-协作通知与自动化/自动化配置.md)、[消息中心与实时通知](../60-协作通知与自动化/消息中心与实时通知.md)、[邮件协作](../60-协作通知与自动化/邮件协作.md)。  ## 4. 与其他产品端关系  | 关系 | 说明 | | --- | --- | | 来自运营端 | 业务模板、资源库模板、表单组件、仪表盘组件、报告入口、外部 API 配置等由运营端维护或监管 | | 同步到采集端 | 工单、工单批复、里程碑批复、任务状态、消息通知会同步到采集端 | | 回流自采集端 | 采集端提交的工单数据、批复数据、指派结果、评论或动态回流贸易端 |  ## 5. 知识库拆分建议  贸易端后续可继续拆成以下细页：  - 账号注册登录与个人中心。 - 团队创建与团队设置。 - 工作台和 FlowSpace 分组。 - FlowSpace 设置。 - 协作 FlowSpace 设置。 - 订单列表、订单详情、订单管理。 - 工单视图和批量操作。 - 资源库视图、分享和应用范围。 - 自动化一期、定时任务。 - 消息中心、邮件协作。  ## 6. 来源  - `source:thoughts-v2-current/v2.0.x/贸易端/【贸易端】【账号】注册登录、忘记密码.md` - `source:thoughts-v2-current/v2.0.x/贸易端/【贸易端】【个人中心】个人信息、切换语言、退出账号.md` - `source:thoughts-v2-current/v2.0.x/贸易端/【贸易端】【团队管理】创建团队.md` - `source:thoughts-v2-current/v2.0.x/贸易端/【贸易端】【团队设置】团队信息、角色、成员、协作团队管理.md` - `source:thoughts-v2-current/v2.0.x/贸易端/【贸易端】【工作台】工作台、创建SCCS、SCCS分组.md` - `source:thoughts-v2-current/v2.1.x/贸易端/【贸易端】【SCCS设置】.md` - `source:thoughts-v2-current/v2.2.x/贸易端/【贸易端】【订单详情】查看&操作.md` - `source:thoughts-v2-current/v2.2.x/贸易端/【贸易端】【订单详情】工单&里程碑批复操作.md` - `source:thoughts-v2-current/V2.4.x/贸易端/【贸易端】【资源库】第一阶段.md` - `source:thoughts-v2-current/V2.4.x/贸易端/【贸易端】【自动化】一期.md` - `03-功能地图.md` "}, {"path": "docs/10-产品端/运营端.md", "title": "运营端", "folder": "docs/10-产品端", "text": "﻿# 运营端  ## 1. 定位  运营端是 Linkincrease 的平台级配置与监管后台，服务对象主要是平台运营、实施和管理人员。  它不直接承担日常订单执行，而是负责维护平台基础数据、模板能力、配置能力、监管能力和平台级审计入口。贸易端和采集端的很多业务能力，都来自运营端模板、组件、集成和平台配置的下发。  ## 2. 核心职责  | 职责 | 说明 | | --- | --- | | 平台用户监管 | 管理和查看用户账号、启用状态、激活状态、登录记录、所属团队、相关 FlowSpace | | 平台团队监管 | 查看团队基础信息、拥有者、成员、角色、协作邀请、团队关联 FlowSpace | | FlowSpace 数据监管 | 查看平台团队下 FlowSpace 列表、FlowSpace 数据详情、成员记录、协作团队、订单、工单、自动化记录 | | 资源库监管 | 查看团队资源库列表、资源库数据明细、模板来源、创建和更新记录 | | 模板中心 | 管理业务模板、资源库模板，并向贸易端创建 FlowSpace 和资源库提供标准模板 | | 表单与组件配置 | 维护表单组件、字段属性、显隐规则、公式、行业组件等配置底座 | | 仪表盘与报告 | 管理 FlowSpace 仪表盘、仪表盘设计器、第三方报告链接和报告相关数据表 | | 集成与系统能力 | 配置外部 API 集成、第三方数据引用、软件更新和系统级记录 |  ## 3. 主要模块  ### 3.1 用户管理  运营端用户管理用于监管平台用户账号。  常见列表字段包括 UID、账号邮箱、头像、姓名、拥有团队、加入团队、相关 FlowSpace、注册时间、最后登录时间、浏览器或终端版本、系统、设备、登录 IP、地区、账号状态。  常见筛选条件包括账号、姓名、账号状态、激活状态、创建时间、最后登录时间。  账号状态需要区分：  - `启用`：用户可正常登录并使用贸易端或采集端。 - `禁用`：用户不可登录，贸易端应展示禁用提示。 - `待激活`：已被邀请但尚未完成注册激活。  ### 3.2 团队管理  团队管理用于监管平台内客户团队及其协作关系。  常见列表字段包括团队名称、团队简称、团队代码、拥有者、成员数量、已邀请协作团队数量、参与外部团队数量、FlowSpace 数量、协作 FlowSpace 数量、创建时间。  团队详情通常包含：  - 团队基础信息。 - 成员信息。 - 角色列表。 - 本团队邀请的协作团队。 - 本团队参与的外部协作团队。 - 本团队自有 FlowSpace。 - 本团队参与的外部协作 FlowSpace。  邀请记录需要区分团队成员邀请和团队协作邀请，并记录操作人、被邀请方、邀请时间、处理状态等信息。  ### 3.3 FlowSpace 管理  FlowSpace 管理用于查看平台团队下的 FlowSpace 数据。  常见筛选条件包括 FlowSpace 编号、FlowSpace 名称、团队代码、团队名称、拥有者账号、拥有者姓名、创建人账号、创建人姓名、创建类型、模板行业、创建时间、模板更新时间。  列表常见字段包括 FlowSpace 编号、名称、所属团队、团队代码、团队拥有者、成员数量、协作团队数量、订单数量、模板名称、模板类型、模板行业、创建人、创建时间、模板更新人、模板更新时间。  常见操作入口包括：  - 查看 FlowSpace 数据详情。 - 修改模板。 - 复制到模板库。 - 进入仪表盘管理。 - 查看订单、工单、操作记录、成员管理记录。  ### 3.4 资源库管理  资源库管理用于监管团队资源库及其数据明细。  常见筛选条件包括资源库名称、团队代码、团队名称、创建人账号、创建人姓名、模板名称、创建类型、模板行业、创建时间、更新时间。  列表常见字段包括资源库名称、所属团队、团队代码、模板名称、模板类型、模板行业、创建人、创建时间、更新人、模板更新时间。  资源库数据详情通常需要支持按资源库、团队、创建人检索，并展示资源库名称、团队、模板、表单名称、创建人、创建时间、更新人、更新时间等信息。  ### 3.5 设置与软件管理  设置模块沉淀平台级软件管理能力，包括软件版本、更新记录、安装包、更新日志和相关操作记录。  该模块属于系统运维与审计能力的一部分，应与 [系统与集成执行日志](../80-日志审计/系统与集成执行日志.md) 互相引用。  ## 4. 与其他产品端关系  | 关系 | 说明 | | --- | --- | | 运营端到贸易端 | 运营端配置模板、组件、仪表盘、报告、集成能力；贸易端在团队和 FlowSpace 场景中使用这些能力 | | 运营端到采集端 | 运营端不直接驱动采集端任务，但通过模板、字段、表单组件和流程配置影响采集端任务详情页的展示与填写 | | 运营端到公共能力 | 权限、日志、自动化、外部 API、报告、仪表盘等能力需要在公共能力页沉淀统一口径 |  ## 5. 知识库拆分建议  运营端后续可继续拆成以下细页：  - 用户管理。 - 团队管理。 - FlowSpace 数据管理。 - 资源库数据管理。 - 邮件协作监管。 - 自动化记录。 - 外部 API 集成配置。 - 报告管理。 - 软件管理。  ## 6. 来源  - `source:thoughts-v2-current/v2.1.x/运营端/【运营端】【用户-用户管理】平台用户数据管理.md` - `source:thoughts-v2-current/v2.1.x/运营端/【运营端】【用户-团队管理】平台团队数据管理.md` - `source:thoughts-v2-current/v2.1.x/运营端/【运营端】【用户-SCCS管理】平台团队的SCCS数据管理.md` - `source:thoughts-v2-current/v2.3.x/运营端/【运营端】【用户-SCCS管理】邮件协作列表.md` - `source:thoughts-v2-current/v2.3.x/运营端/【运营端】【用户-资源库管理】平台团队的资源库数据管理.md` - `source:thoughts-v2-current/V2.4.x/运营端/【运营端】【设置-软件管理】软件相关信息与记录管理.md` - `03-功能地图.md` "}, {"path": "docs/10-产品端/采集端.md", "title": "采集端", "folder": "docs/10-产品端", "text": "﻿# 采集端  ## 1. 定位  采集端是 Linkincrease 的移动执行入口，面向需要在移动场景中查看任务、填写工单、提交批复、处理指派和接收消息的执行人员。  采集端不是完整后台，它聚焦“我需要处理什么、在哪里处理、处理后如何同步回贸易端”。因此知识库中采集端应优先围绕任务列表、任务详情、采集提交、批复提交、消息提醒和个人中心沉淀。  ## 2. 核心职责  | 职责 | 说明 | | --- | --- | | 登录与账号 | 邮箱密码登录、忘记密码、账号状态校验 | | 首页概览 | 展示我的任务、团队待指派任务、我关注、FlowSpace 任务统计 | | 任务列表 | 按进行中、已完成、我发起、我关注、团队指派等维度查看任务 | | 任务搜索 | 搜索工单、工单批复、里程碑批复任务 | | 任务详情 | 查看工单详情、工单批复详情、里程碑批复详情 | | 移动采集 | 填写工单表单、引用第三方数据、处理子表、提交数据 | | 批复处理 | 提交工单批复和里程碑批复 | | 指派处理 | 在具备权限时处理协作工单或批复的指派 | | 消息中心 | 接收任务、评论、协作、系统相关消息 | | 我的 | 查看个人信息和基础账号入口 |  ## 3. 主要模块  ### 3.1 登录  采集端登录与贸易端账号体系保持一致，通常使用邮箱和密码登录，并支持忘记密码。  账号状态、禁用状态、待激活状态等应与平台账号规则一致。若账号被禁用，应阻止登录并提示用户。  ### 3.2 首页  首页展示任务相关数据和 FlowSpace 相关任务数据。常见区域包括：  - 我的任务。 - 团队待指派任务。 - 我关注。 - FlowSpace 任务统计。 - 团队切换入口。 - 底部导航。  FlowSpace 统计需要展示该团队下与当前用户相关的订单数、任务数、里程碑任务数、待办数等。若 FlowSpace 来自外部协作，需要展示协作标识和所属团队信息。  首页需要支持下拉刷新；页面较长时可出现返回顶部入口；点击头像或名称进入个人中心；点击待办、团队指派、我关注等入口跳转到任务列表对应标签页。  ### 3.3 任务列表  任务列表按不同状态和业务维度展示任务，至少包含：  - 进行中任务。 - 已完成任务。 - 我发起任务。 - 我关注任务。 - 团队指派任务。  进行中任务需要区分待办和已处理。任务类型包括工单、工单批复、里程碑批复。任务列表应排除互用产生的工单，仅展示正常创建的工单。  常见筛选和排序包括：  - 任务状态标签。 - 任务排序：最新发起、最近发起等。 - FlowSpace 范围：全部或指定 FlowSpace，多选。 - 订单状态：全部、进行中、已完成、已取消等。  列表需要支持下拉刷新、上拉加载更多、标签切换、进入任务搜索页、点击任务进入详情、关注和取消关注。  ### 3.4 任务详情  任务详情覆盖三类页面：  - 工单详情页。 - 工单批复详情页。 - 里程碑批复详情页。  工单详情页需要展示基础信息，包括里程碑状态、订单标识、FlowSpace 名称、里程碑名称、发起人、发起时间、采集人、最新采集时间、批复人、最新批复时间、工单完成度、可编辑模块、所属团队等。  工单表单需要按可编辑和不可编辑状态展示。若用户具有编辑权限且工单可编辑，则展示提交按钮；若无权限或不可编辑，则隐藏提交按钮。  采集端任务详情还需要处理：  - 未提交修改返回时的保存提示。 - 服务端任务更新后的冲突提示。 - 指派按钮显隐。 - 第三方数据引用入口。 - 工单终止标签。 - 工单动态。 - 子表引用、添加、保存、继续添加、继续关联。 - 子表行数据切换和未保存提示。  工单批复详情页以工单批复为第一标签，其他逻辑与工单详情页保持一致。里程碑批复详情页需要展示里程碑批复表单、该里程碑下的工单和工单批复、订单信息。  ### 3.5 消息中心与我的  采集端消息中心承接任务、评论、协作、系统相关消息，并与贸易端消息状态保持一致。需要支持未读提示和 App 通知入口。  我的页面用于展示个人中心信息，通常承接头像、姓名、账号相关信息、退出或账号管理入口。  ## 4. 与其他产品端关系  | 关系 | 说明 | | --- | --- | | 来自贸易端 | 任务、工单、批复、指派、订单和 FlowSpace 信息从贸易端同步到采集端 | | 回流贸易端 | 采集提交、批复提交、评论、动态、指派结果回写贸易端 | | 受运营端配置影响 | 表单组件、字段显隐、第三方数据引用、模板规则由运营端配置，并在采集端任务详情中体现 |  ## 5. 知识库拆分建议  采集端后续可继续拆成以下细页：  - 登录与账号状态。 - 首页任务统计。 - 任务列表。 - 任务搜索。 - 工单详情。 - 工单批复详情。 - 里程碑批复详情。 - 消息中心。 - 我的。  ## 6. 来源  - `source:thoughts-v2-current/v2.3.x/采集端/【采集端】【登录】邮箱_密码登录、忘记密码.md` - `source:thoughts-v2-current/v2.3.x/采集端/【采集端】【首页】任务相关数据展示.md` - `source:thoughts-v2-current/v2.3.x/采集端/【采集端】【任务列表】工单、工单批复、里程碑批复任务列表.md` - `source:thoughts-v2-current/v2.3.x/采集端/【采集端】【任务搜索页】工单、工单批复、里程碑批复任务搜索.md` - `source:thoughts-v2-current/v2.3.x/采集端/【采集端】【任务详情页】工单、工单批复、里程碑批复详情页.md` - `source:thoughts-v2-current/v2.3.x/采集端/【采集端】【消息中心】消息通知列表.md` - `source:thoughts-v2-current/v2.3.x/采集端/【采集端】【我的】个人中心页.md` - `docs/30-业务流程/移动端采集.md` "}, {"path": "docs/20-业务对象/FlowSpace.md", "title": "FlowSpace", "folder": "docs/20-业务对象", "text": "﻿--- title: FlowSpace type: knowledge domain: 贸易端 module: FlowSpace submodule: 核心业务空间 status: authoritative version: v0.1 owner: 产品 maintainer: Daren updated_at: 2026-05-26 permission: internal tags: - FlowSpace - 业务空间 - 订单 - 权限 source_files: - source:thoughts-v2-current/v2.1.x/贸易端/【贸易端】【SCCS设置】.md - source:thoughts-v2-current/v2.1.x/贸易端/【贸易端】【协作SCCS设置】.md - source:thoughts-v2-current/v2.0.x/贸易端/【贸易端】【工作台】工作台、创建SCCS、SCCS分组.md - source:thoughts-v2-current/v2.0.x/运营端/【运营端】【模板中心】业务模版管理.md related_docs: - ../../02-核心概念词典.md - ../../03-功能地图.md - ../40-权限与安全/权限体系总表.md search_keywords: - FlowSpace - 业务空间 - FlowSpace设置 - 协作FlowSpace ---  # FlowSpace  > 命名说明：FlowSpace（流空间）是 SCCS 的新名称。为了让英文名更容易被直接理解，知识库正文统一使用 FlowSpace；历史来源文档中的 SCCS 仅作为原始文件名和追溯标识保留。  ## 1. 功能定位  FlowSpace 是 Linkincrease 贸易端的核心业务空间，用于承载某类供应链协作业务。FlowSpace 通常由运营端业务模板创建，运行态包含订单、里程碑、工单、批复、成员、角色、协作团队、数据围栏、标签、自动化、仪表盘、报告和资源库关联。  ## 2. 使用对象与入口  | 使用对象 | 入口 | 说明 | | --- | --- | --- | | 团队成员 | 工作台 FlowSpace 列表 | 查看、进入、创建或管理本团队 FlowSpace | | 团队管理员 | FlowSpace 设置 | 管理基本信息、角色、成员、协作团队、数据围栏 | | 协作团队成员 | 协作 FlowSpace | 在被授权范围内参与订单、工单和批复 | | 运营人员 | 运营端 FlowSpace 管理 | 查看平台团队的 FlowSpace 数据、自动化记录、仪表盘、报告等 |  ## 3. 核心对象  | 对象 | 说明 | | --- | --- | | FlowSpace 基本信息 | 名称、图标、来源模板、描述等基础信息 | | FlowSpace 成员 | 被加入当前 FlowSpace 的团队成员 | | FlowSpace 业务角色 | 主团队成员在 FlowSpace 内的业务权限集合 | | 协作团队 | 被主团队邀请参与当前 FlowSpace 的外部团队 | | 协作 FlowSpace 角色 | 协作团队在 FlowSpace 内的权限集合 | | 数据围栏 | 控制成员可见订单、里程碑、工单、字段、标签等数据范围 | | 里程碑计划 | FlowSpace 内订单流程节点的默认计划配置 | | 标签设置 | 根据条件展示在订单或里程碑中的业务标签 | | 更多设置 | 订单标识、订单取消原因等 FlowSpace 级业务设置 |  ## 4. 业务流程  flowchart TD A[\"运营端发布业务模板\"] --> B[\"贸易端选择模板创建 FlowSpace\"] B --> C[\"设置 FlowSpace 基本信息\"] C --> D[\"配置业务角色、成员、协作团队\"] D --> E[\"配置数据围栏、里程碑计划、标签、更多设置\"] E --> F[\"创建订单并进入业务执行\"] F --> G[\"自动化、仪表盘、报告、资源库关联持续生效\"]  ## 5. 权限规则  FlowSpace 权限由团队权限、FlowSpace 业务角色、协作 FlowSpace 角色、数据围栏共同决定。  | 权限域 | 作用 | | --- | --- | | 团队权限 | 决定是否可创建 FlowSpace、进入团队设置、管理团队级资源 | | FlowSpace 业务角色 | 决定主团队成员可操作哪些订单、里程碑、工单、仪表盘等 | | 协作 FlowSpace 角色 | 决定协作团队成员可查看和处理哪些业务数据 | | 数据围栏 | 决定用户可见的数据范围和字段范围 |  判断入口是否展示时，前端可结合权限、对象状态和成员关系；提交时必须服务端再次校验。  ## 6. 状态与限制  当前资料重点描述 FlowSpace 运行态设置，尚未形成完整 FlowSpace 生命周期状态机。已确认限制：  - 创建 FlowSpace 依赖运营端已发布且对当前团队可见的业务模板。 - FlowSpace 内角色、成员、协作团队变更会影响后续订单、里程碑、工单可见性和可操作性。 - 数据围栏变更会影响字段、标签、订单、里程碑、工单等展示范围。 - 订单标识、取消原因等更多设置会影响订单列表、订单详情和状态操作展示。  ## 7. 字段、表单与校验  FlowSpace 继承业务模板中的主表单、里程碑、工单表单、批复表单等结构。运行态可调整的配置包括：  - 业务角色和协作方角色。 - 数据围栏。 - FlowSpace 成员和协作团队。 - 里程碑计划。 - 标签设置。 - 订单标识。 - 订单取消原因。  ## 8. 通知、日志与审计  FlowSpace 设置类操作需要进入操作日志。涉及成员、协作团队、权限变化时，后续应补充消息通知规则。  已知日志范围：  - FlowSpace 设置操作日志。 - 协作 FlowSpace 设置操作日志。 - 自动化执行日志。 - 系统自动执行日志中与 FlowSpace 相关的自动化、公式、资源库同步动作。  ## 9. 异常与提示  需要从原始需求继续抽取的提示包括：  - 无权限操作。 - 成员或协作团队被移除后的业务处理限制。 - 数据围栏变化后的可见性变化。 - 模板或字段变更对运行态 FlowSpace 的影响。  ## 10. 来源需求  - `source:thoughts-v2-current/v2.1.x/贸易端/【贸易端】【SCCS设置】.md` - `source:thoughts-v2-current/v2.1.x/贸易端/【贸易端】【协作SCCS设置】.md` - `source:thoughts-v2-current/v2.0.x/贸易端/【贸易端】【工作台】工作台、创建SCCS、SCCS分组.md` - `source:thoughts-v2-current/V2.5.x/贸易端/【贸易端】【仪表盘】权限管理.md` - `source:thoughts-v2-current/V2.5.x/贸易端/【贸易端】报告权限.md` - `source:thoughts-v2-current/v2.0.x/运营端/【运营端】【模板中心】业务模版管理.md`  ## 11. 待确认问题  - FlowSpace 与 FlowSpace 是否完全同义，还是存在历史命名与产品边界差异。 - FlowSpace 删除、停用、归档等生命周期状态是否已有完整规则。 - 模板同步至已创建 FlowSpace 时的冲突处理和历史数据影响。 "}, {"path": "docs/20-业务对象/README.md", "title": "README", "folder": "docs/20-业务对象", "text": "﻿# 20 业务对象  本目录沉淀 Linkincrease 的核心业务对象。对象页是知识库的主骨架，流程、权限、表单、消息、日志都应能回挂到这些对象。  当前页面：  - [团队与协作团队.md](./团队与协作团队.md) - [FlowSpace.md](./FlowSpace.md) - [订单.md](./订单.md) - [里程碑.md](./里程碑.md) - [工单与批复.md](./工单与批复.md) - [资源库.md](./资源库.md) - [业务模板.md](./业务模板.md) - [资源库模板.md](./资源库模板.md)  后续补充：  - 用户与账号 - 订单复用关系 - 自动化 - 消息"}, {"path": "docs/20-业务对象/业务模板.md", "title": "业务模板", "folder": "docs/20-业务对象", "text": "﻿--- title: 业务模板 type: knowledge domain: 运营端 module: 业务模板 submodule: FlowSpace创建模板 status: authoritative version: v0.1 owner: 产品 maintainer: Daren updated_at: 2026-05-25 permission: internal tags: - 业务模板 - 模板中心 - 表单设计 - FlowSpace source_files: - source:thoughts-v2-current/v2.0.x/运营端/【运营端】【模板中心】业务模版管理.md - source:thoughts-v2-current/v2.1.x/运营端/【运营端】【业务模板】表单设计组件.md - source:thoughts-v2-current/v2.1.x/运营端/【运营端】【业务模版】表单属性与显隐设置.md related_docs: - ./FlowSpace.md - ./里程碑.md - ./工单与批复.md search_keywords: - 模板中心 - 业务模版 - 表单设计 - 模板发布 - 同步至FlowSpace ---  # 业务模板  ## 1. 功能定位  业务模板是运营端配置的 FlowSpace 创建模板，用于定义订单主表单、里程碑、工单采集表单、工单批复表单、里程碑批复表单、订单标识、PDF 导入、预览数据、第三方数据对接等配置。  ## 2. 使用对象与入口  | 使用对象 | 入口 | 说明 | | --- | --- | --- | | 运营人员 | 运营端 > 模板中心 > 业务模板 | 创建、编辑、设计、发布、复制和同步业务模板 | | 贸易端团队 | 贸易端模板中心 | 基于可见且已发布的业务模板创建 FlowSpace | | 实施人员 | 模板设计与预览数据 | 模拟业务流程和检查模板配置 |  ## 3. 核心对象  | 对象 | 说明 | | --- | --- | | 模板基础信息 | 名称、图标、创建类型、所属行业、描述、备注等 | | 主表单 | 订单级主数据表单，模板默认携带 | | 里程碑 | 订单流程节点 | | 里程碑批复表单 | 需要里程碑批复时存在 | | 工单采集表单 | 里程碑下的执行数据表单 | | 工单批复表单 | 需要工单批复时存在 | | 订单标识设置 | 贸易端订单展示标识默认配置 | | 预览数据 | 用于模板中心模拟模板使用效果 | | PDF 导入设置 | 定制场景下的 PDF 字段映射 | | 发布态模板 | 贸易端可见和可创建 FlowSpace 的模板版本 |  ## 4. 业务流程  flowchart TD A[\"添加业务模板\"] --> B[\"配置基础信息\"] B --> C[\"设计主表单、里程碑、表单和批复\"] C --> D[\"配置订单标识、PDF导入、第三方配置\"] D --> E[\"录入预览数据\"] E --> F[\"发布模板\"] F --> G[\"贸易端模板中心可见\"] G --> H[\"团队创建 FlowSpace\"] C --> I[\"复制模板\"] C --> J[\"同步至已创建 FlowSpace 的未发布模板\"]  ## 5. 权限规则  当前需求主要描述运营端模板管理能力，完整运营端角色权限尚未沉淀。已确认：  - 只有运营端有模板中心权限的人员可管理业务模板。 - 模板可见范围控制贸易端哪些团队可见。 - 模板启用不等于贸易端可见，需启用且已发布。  ## 6. 状态与限制  | 状态 | 说明 | 限制 | | --- | --- | --- | | 未发布 | 创建后尚未发布 | 即使启用，贸易端仍不可见 | | 已发布 | 已形成可用版本 | 贸易端可在模板中心使用 | | 已编辑 | 当前编辑内容与已发布内容不一致 | 需要提示发布 | | 只读模式 | 默认进入设计时不可编辑 | 需开启编辑开关才能修改 | | 启用/未启用 | 模板启用状态 | 影响贸易端是否可见，但需结合发布状态 |  ## 7. 字段、表单与校验  基础信息：  - 模板名称必填，限制 100 字符。 - 模板图标必填。 - 创建类型必填。 - 所属行业必填。 - 模板描述、备注限制 200 字符。  设计规则：  - 创建模板后默认带主表单。 - 里程碑名称必填，限制 100 字符。 - 表单名称必填，限制 100 字符。 - 里程碑可设置是否需要批复。 - 需要批复后才可设计对应批复表单。 - 可设置默认工单批复人和默认里程碑批复人。 - 可设置部分文案国际化。  ## 8. 通知、日志与审计  需要记录：  - 模板新增、编辑、删除。 - 可见范围设置。 - 表单设计变更。 - 发布记录。 - 复制记录。 - 同步至 FlowSpace 记录。  ## 9. 异常与提示  已知提示：  - 选择部分可见团队时，至少选择一个团队。 - 模板未发布时，即使启用，贸易端不可见。 - 同步至 FlowSpace 需谨慎处理已有业务数据。  ## 10. 来源需求  - `source:thoughts-v2-current/v2.0.x/运营端/【运营端】【模板中心】业务模版管理.md` - `source:thoughts-v2-current/v2.1.x/运营端/【运营端】【业务模板】表单设计组件.md` - `source:thoughts-v2-current/v2.1.x/运营端/【运营端】【业务模版】表单属性与显隐设置.md` - `source:thoughts-v2-current/v2.3.x/运营端/【运营端】【模板设计】里程碑增加第三方数据对接.md`  ## 11. 待确认问题  - 运营端模板管理权限模型。 - 模板同步至 FlowSpace 时的字段删除、字段新增和业务数据保留完整规则。 - 定制模板、用户自建模板后续是否纳入当前知识库。 "}, {"path": "docs/20-业务对象/团队与协作团队.md", "title": "团队与协作团队", "folder": "docs/20-业务对象", "text": "﻿--- title: 团队与协作团队 type: knowledge domain: 贸易端 module: 团队 submodule: 组织与协作关系 status: authoritative version: v0.1 owner: 产品 maintainer: Daren updated_at: 2026-05-25 permission: internal tags: - 团队 - 协作团队 - 团队角色 - 成员 source_files: - source:thoughts-v2-current/v2.0.x/贸易端/【贸易端】【团队管理】创建团队.md - source:thoughts-v2-current/v2.0.x/贸易端/【贸易端】【团队设置】团队信息、角色、成员、协作团队管理.md - source:thoughts-v2-current/v2.1.x/贸易端/【贸易端】【团队设置】邀请成 员_协作团队流程变更.md related_docs: - ./FlowSpace.md - ../40-权限与安全/权限体系总表.md search_keywords: - 创建团队 - 团队成员 - 团队角色 - 邀请成员 - 协作团队 ---  # 团队与协作团队  ## 1. 功能定位  团队是 Linkincrease 贸易端的组织归属单位，用于承载团队成员、团队角色、FlowSpace、资源库和协作团队关系。协作团队是与当前团队建立协作关系的外部团队，可进一步加入具体 FlowSpace 参与业务执行。  ## 2. 使用对象与入口  | 使用对象 | 入口 | 说明 | | --- | --- | --- | | 普通用户 | 创建团队引导、切换团队 | 首次或非首次创建团队、进入已加入团队 | | 团队管理员 | 团队设置 | 管理团队信息、角色、成员、协作团队 | | 被邀请成员 | 邮件邀请链接 | 注册或登录后加入团队 | | 协作团队管理员 | 团队设置 > 协作团队 > 邀请我的 | 接受或拒绝协作邀请 |  ## 3. 核心对象  | 对象 | 说明 | | --- | --- | | 团队 | 客户在贸易端创建的组织单位 | | 团队码 | 团队唯一识别码，可用于邀请协作团队 | | 团队成员 | 加入团队的用户，包括已邀请未加入成员 | | 拥有者 | 固定角色，有且只有一名成员，默认为团队创建者 | | 团队管理员 | 固定角色，拥有团队角色内全部权限，权限不可删改但成员可调整 | | 自定义团队角色 | 团队自定义权限集合 | | 协作团队 | 被当前团队邀请参与协作的外部团队 | | 协作邀请 | 团队间建立协作关系的申请记录 |  ## 4. 业务流程  ### 4.1 团队成员邀请  flowchart TD A[\"管理员输入邮箱并选择团队角色\"] --> B[\"发送邀请邮件\"] B --> C{\"被邀请人是否已注册\"} C -->|未注册| D[\"完成注册并填写个人信息\"] C -->|已注册| E[\"登录\"] D --> F[\"确认加入团队\"] E --> F F --> G[\"加入团队并切换到该团队\"]  ### 4.2 协作团队邀请  flowchart TD A[\"邀请方输入目标团队码\"] --> B[\"识别目标团队名称\"] B --> C[\"向目标团队有团队设置权限的成员发送邀请\"] C --> D[\"目标团队进入邀请我的列表\"] D --> E{\"接受或拒绝\"} E -->|接受| F[\"建立协作团队关系\"] E -->|拒绝| G[\"邀请记录移除或标记拒绝\"]  ## 5. 权限规则  | 操作 | 权限要求 | 说明 | | --- | --- | --- | | 打开团队设置 | 有团队设置权限 | 团队设置入口和邀请成员快捷入口受该权限控制 | | 创建/编辑/删除团队角色 | 有团队设置权限 | 固定角色不可删除 | | 邀请成员 | 有团队设置权限 | 可为成员预设团队角色 | | 删除成员 | 有团队设置权限 | 拥有者不可删除 | | 设置成员角色 | 有团队设置权限 | 同一成员多个角色权限叠加 | | 邀请协作团队 | 有团队设置权限 | 需输入对方团队码 | | 删除协作团队 | 有团队设置权限 | 同步影响其参与的 FlowSpace |  ## 6. 状态与限制  | 场景 | 规则 | | --- | --- | | 成员已邀请未加入 | 团队成员列表展示未加入标识，可重新邀请 | | 邮件链接失效 | 成员被删除或协作团队被删除后，点击邀请链接提示链接已失效 | | 成员已加入团队 | 再次点击邀请链接提示已加入该团队 | | 删除成员 | 从团队移除，同时从其参与的 FlowSpace 中同步删除 | | 唯一对接人限制 | 成员作为协作 FlowSpace 唯一对接人时，需先设置其他对接人 | | 删除协作团队 | 从团队移除，同时从其参与的 FlowSpace 中同步删除 |  ## 7. 字段、表单与校验  | 字段 | 规则 | | --- | --- | | 团队角色名称 | 必填，限制 100 字符 | | 成员邮箱 | 需包含且仅包含一个 `@`，并包含至少一个 `.` | | 团队码 | 邀请协作团队时限制输入 6 位，输入后识别团队名称 | | 团队成员搜索 | 支持姓名、邮箱、移动电话模糊搜索 | | 协作团队搜索 | 支持团队名称、简称、团队码模糊搜索 |  ## 8. 通知、日志与审计  需要沉淀：  - 邀请成员邮件。 - 邀请协作团队邮件。 - 团队角色创建、编辑、删除日志。 - 团队成员邀请、删除、角色设置日志。 - 协作团队邀请、接受、拒绝、删除日志。 - 成员被移出团队后的系统提示。  ## 9. 异常与提示  已知提示：  - 链接已失效。 - 您已加入该团队。 - 您已被移出该团队。如有疑问，请联系团队管理员。 - 唯一对接人场景需先设置其他对接人。  ## 10. 来源需求  - `source:thoughts-v2-current/v2.0.x/贸易端/【贸易端】【团队管理】创建团队.md` - `source:thoughts-v2-current/v2.0.x/贸易端/【贸易端】【团队设置】团队信息、角色、成员、协作团队管理.md` - `source:thoughts-v2-current/v2.1.x/贸易端/【贸易端】【团队设置】邀请成 员_协作团队流程变更.md`  ## 11. 待确认问题  - 删除团队成员后的任务批量移交规则。 - 删除协作团队后的任务批量移交规则。 - 团队拥有者移交的完整入口和校验规则。 "}, {"path": "docs/20-业务对象/工单与批复.md", "title": "工单与批复", "folder": "docs/20-业务对象", "text": "﻿--- title: 工单与批复 type: knowledge domain: 贸易端 module: 工单 submodule: 采集与批复 status: authoritative version: v0.1 owner: 产品 maintainer: Daren updated_at: 2026-05-25 permission: internal tags: - 工单 - 采集 - 工单批复 - 里程碑批复 - 指派 source_files: - source:thoughts-v2-current/v2.2.x/贸易端/【贸易端】【订单详情】工单&里程碑批复操作.md - source:thoughts-v2-current/v2.2.x/贸易端/【贸易端】【订单详情】查看&操作.md - source:thoughts-v2-current/v2.3.x/采集端/【采集端】【任务详情页】工单、工单批复、里程碑批复详情页.md related_docs: - ./订单.md - ./FlowSpace.md - ../40-权限与安全/权限体系总表.md search_keywords: - 创建工单 - 工单采集 - 工单批复 - 里程碑批复 - 终止采集 ---  # 工单与批复  ## 1. 功能定位  工单是里程碑下的具体执行任务，用于收集、处理和确认业务数据。批复分为工单批复和里程碑批复，是否存在取决于运营端业务模板配置。  ## 2. 使用对象与入口  | 使用对象 | 入口 | 说明 | | --- | --- | --- | | 主团队 FlowSpace 成员 | 订单详情 | 创建工单、设置处理人、查看动态、执行批复或管理操作 | | 协作团队成员 | 订单详情、采集端任务 | 指派、采集、批复其权限范围内的任务 | | 采集端用户 | 任务列表、任务详情 | 移动端处理工单采集、工单批复、里程碑批复 |  ## 3. 核心对象  | 对象 | 说明 | | --- | --- | | 工单 | 里程碑下的一次具体任务 | | 工单采集表单 | 处理人填写执行数据的表单 | | 工单批复 | 对工单采集结果进行确认 | | 里程碑批复 | 对里程碑阶段结果进行确认 | | 采集人 | 负责填写工单采集表单的人或协作团队 | | 工单批复人 | 负责确认工单采集结果的人或协作团队 | | 里程碑批复人 | 负责确认里程碑结果的人或协作团队 | | 指派人 | 协作团队中有权限将任务指派给具体成员的人 |  ## 4. 业务流程  flowchart TD A[\"创建工单\"] --> B[\"设置采集人、工单批复人、里程碑批复人\"] B --> C{\"处理人为协作团队负责人?\"} C -->|是| D[\"协作方指派具体成员\"] C -->|否| E[\"处理人直接处理\"] D --> E E --> F[\"提交工单采集\"] F --> G{\"需要工单批复?\"} G -->|是| H[\"提交工单批复\"] G -->|否| I[\"工单完成采集链路\"] H --> I I --> J{\"需要里程碑批复?\"} J -->|是| K[\"提交里程碑批复\"] J -->|否| L[\"推进里程碑\"] K --> L  ## 5. 权限规则  | 操作 | 权限要求 | 状态限制 | | --- | --- | --- | | 创建工单 | 有当前里程碑创建工单权限 | 订单进行中；里程碑未开始或进行中 | | 采集指派 | 协作方有对应里程碑工单指派权限 | 工单未终止、未批复；里程碑未完成/取消 | | 工单采集 | 当前工单采集人或协作方未指派前负责人/对接人 | 工单未终止、未批复；里程碑未完成/取消 | | 工单批复 | 当前工单批复人或对应协作方有权限成员 | 依模板配置和状态限制 | | 里程碑批复 | 当前里程碑批复人或对应协作方有权限成员 | 依模板配置和状态限制 | | 修改处理人 | 主团队或协作团队有对应权限成员 | 对象状态允许处理 | | 终止采集 | 有终止采集权限 | 工单未批复、未终止 | | 删除工单 | 有删除工单权限 | 对象状态允许删除 |  ## 6. 状态与限制  工单采集、批复、指派操作在以下场景通常不可执行：  - 订单已删除。 - 订单已完成。 - 订单已取消。 - 里程碑已完成。 - 里程碑已取消。 - 工单已终止采集。 - 工单已批复。 - 工单已删除。 - 当前处理人或可编辑表单权限已变化。 - 多人并发提交后当前页面未刷新。  ## 7. 字段、表单与校验  创建工单时：  - 一次最多创建 10 条工单。 - 工单名称限制 50 字符，默认按创建顺序编号。 - 至少保留一个非隐藏表单。 - 采集人、工单批复人、里程碑批复人按模板配置校验。 - 未设置采集人的表单需校验必填项。 - 表单字段按运营端配置进行类型、必填、格式校验。  采集时：  - 当前采集人可编辑自己负责的表单，其余表单只读。 - 多人并发时，如其他人已提交，需要提示刷新后再提交。 - 提交后更新头像提交标识、动态、历史记录和完成度。  ## 8. 通知、日志与审计  需要记录和通知的事件包括：  - 创建工单。 - 采集指派。 - 工单采集提交。 - 工单批复指派与提交。 - 里程碑批复指派与提交。 - 修改处理人。 - 终止采集。 - 删除工单。 - 自动化创建或更新工单。  通知渠道包括站内消息、邮件，部分资料中也提到短信模板，需要补充来源。  ## 9. 异常与提示  需统一沉淀的提示：  - 暂无权限，请联系管理员。 - 订单已删除，无法操作，请刷新页面。 - 订单已完成/已取消，无法操作，请刷新页面。 - 里程碑已完成/已取消，无法操作，请刷新页面。 - 工单已终止采集/已批复/已删除，无法操作，请刷新页面。 - 工单编辑权限已变更，请刷新页面。 - 某成员已修改数据，请刷新。 - 至少保留一个模块。 - 请设置处理人。 - 请输入指定字段。  ## 10. 来源需求  - `source:thoughts-v2-current/v2.2.x/贸易端/【贸易端】【订单详情】工单&里程碑批复操作.md` - `source:thoughts-v2-current/v2.2.x/贸易端/【贸易端】【订单详情】查看&操作.md` - `source:thoughts-v2-current/v2.3.x/贸易端/【贸易端】【工单视图】批量操作：批量发邮件协作、批量采集.md` - `source:thoughts-v2-current/v2.3.x/采集端/【采集端】【任务详情页】工单、工单批复、里程碑批复详情页.md` - `source:thoughts-v2-current/v2.3.x/采集端/【采集端】【任务列表】工单、工单批复、里程碑批复任务列表.md`  ## 11. 待确认问题  - 工单批复后是否允许部分字段继续被自动化或资源库同步更新。 - 终止采集后是否允许重启采集。 - 采集端与贸易端在所有状态限制上的提示是否完全一致。 "}, {"path": "docs/20-业务对象/订单.md", "title": "订单", "folder": "docs/20-业务对象", "text": "﻿--- title: 订单 type: knowledge domain: 贸易端 module: 订单 submodule: 生命周期与详情 status: authoritative version: v0.1 owner: 产品 maintainer: Daren updated_at: 2026-05-25 permission: internal tags: - 订单 - 生命周期 - 订单详情 - 状态 source_files: - source:thoughts-v2-current/v2.2.x/贸易端/【贸易端】【订单列表】订单列表查看：概览、详情.md - source:thoughts-v2-current/v2.2.x/贸易端/【贸易端】【订单列表】订单增删改.md - source:thoughts-v2-current/v2.2.x/贸易端/【贸易端】【订单详情】查看&操作.md - source:thoughts-v2-current/v2.3.x/贸易端/【贸易端】【订单列表】订单导入、订单导出.md related_docs: - ./FlowSpace.md - ./工单与批复.md - ../40-权限与安全/权限体系总表.md search_keywords: - 订单列表 - 订单详情 - 完成订单 - 取消订单 - 重启订单 ---  # 订单  ## 1. 功能定位  订单是 FlowSpace 中的业务主实体，承载订单基本信息、里程碑、工单、批复、历史记录、动态和跟踪记录。订单由运营端模板定义结构，由贸易端团队在 FlowSpace 中创建和流转。  ## 2. 使用对象与入口  | 使用对象 | 入口 | 说明 | | --- | --- | --- | | FlowSpace 成员 | 订单列表 | 查看、创建、编辑、删除、导入导出订单 | | FlowSpace 成员 | 订单详情 | 查看订单基本信息、里程碑、工单、批复和跟踪记录 | | 协作成员 | 订单详情或任务入口 | 在授权范围内查看和处理相关任务 | | 采集端用户 | 任务详情 | 查看与任务相关的订单信息 |  ## 3. 核心对象  | 对象 | 说明 | | --- | --- | | 订单基本信息 | 订单主表单数据 | | 订单标识 | 用于在列表、详情、面包屑中展示订单身份的字段 | | 里程碑 | 订单流程阶段 | | 工单 | 里程碑下的执行任务 | | 里程碑批复 | 对里程碑阶段结果进行确认 | | 工单批复 | 对工单采集结果进行确认 | | 跟踪记录 | 订单级关键节点记录 | | 历史记录 | 表单数据编辑历史 |  ## 4. 业务流程  stateDiagram-v2 [*] --> 进行中: 创建订单 进行中 --> 已完成: 完成订单 进行中 --> 已取消: 取消订单 已完成 --> 进行中: 重启订单 已取消 --> 进行中: 重启订单  订单执行主线：  flowchart TD A[\"创建订单\"] --> B[\"生成订单基本信息和里程碑\"] B --> C[\"创建工单或处理里程碑批复\"] C --> D[\"工单采集、工单批复\"] D --> E[\"里程碑推进\"] E --> F{\"订单是否结束\"} F -->|否| C F -->|是| G[\"完成或取消订单\"] G --> H[\"保留历史、动态、跟踪记录\"]  ## 5. 权限规则  订单相关入口和操作受 FlowSpace 业务角色、协作方角色、数据围栏、订单状态共同影响。  | 操作 | 权限要求 | 额外限制 | | --- | --- | --- | | 查看订单 | 有订单查看权限且满足数据围栏 | 隐藏不可见字段和标签 | | 创建订单 | 有创建订单权限 | 需满足表单必填和字段校验 | | 编辑订单 | 有编辑订单权限 | 已完成、已取消时受限 | | 删除订单 | 有删除订单权限 | 需处理关联工单和历史记录展示 | | 完成/取消/重启订单 | 有修改订单状态权限 | 仅特定状态可执行 | | 查看跟踪记录 | 有查看跟踪记录权限 | 按订单维度展示 |  ## 6. 状态与限制  | 状态 | 说明 | 关键限制 | | --- | --- | --- | | 进行中 | 订单正常流转 | 可编辑、可取消、可完成，可推进里程碑和工单 | | 已完成 | 订单结束 | 订单不可编辑和取消；里程碑与工单处理动作受限 | | 已取消 | 订单取消 | 保存取消时的取消原因文本；业务处理动作受限 |  完成订单后：  - 订单状态变更为已完成。 - 进行中的里程碑变更为已完成，其余里程碑状态按需求规则保持。 - 里程碑不可创建工单、不可修改状态、不可互用。 - 工单不可采集、批复、指派、修改处理人、发邮件协作、终止采集、删除。 - 跟踪记录增加操作记录。  取消订单后：  - 需要选择取消原因。 - 取消原因来自 FlowSpace 设置中的订单取消原因预设。 - 历史订单展示取消时保存的文本，不随后续预设变更而改变。  ## 7. 字段、表单与校验  订单基本信息由业务模板主表单决定。展示和编辑时需要同时考虑：  - 字段类型和必填校验。 - 数据围栏对字段可见性的控制。 - 订单标识字段。 - 子表模式展示。 - 资源库引用字段。 - 公式字段自动更新。  ## 8. 通知、日志与审计  订单相关审计包括：  - 创建、编辑、删除订单。 - 完成、取消、重启订单。 - 订单导入导出记录。 - 跟踪记录。 - 历史记录。 - 自动化对订单基本信息的更新记录。  ## 9. 异常与提示  需要统一沉淀的异常包括：  - 无权限。 - 订单已删除。 - 订单状态已变更。 - 订单已完成或已取消导致无法操作。 - 字段必填或格式错误。 - 数据围栏变化导致字段不可见。  ## 10. 来源需求  - `source:thoughts-v2-current/v2.2.x/贸易端/【贸易端】【订单列表】订单列表查看：概览、详情.md` - `source:thoughts-v2-current/v2.2.x/贸易端/【贸易端】【订单列表】订单增删改.md` - `source:thoughts-v2-current/v2.3.x/贸易端/【贸易端】【订单列表】订单导入、订单导出.md` - `source:thoughts-v2-current/v2.2.x/贸易端/【贸易端】【订单详情】查看&操作.md` - `source:thoughts-v2-current/v2.2.x/贸易端/【贸易端】【订单详情】视图模式：看板、表格.md`  ## 11. 待确认问题  - 订单完成、取消、重启后，对邮件协作、互用、自动化是否存在例外场景。 - 删除订单后，采集端已打开任务页面如何实时提示。 - 订单关联和 FlowSpace 关联是否需要进入订单核心页，还是拆为复用关系页。 "}, {"path": "docs/20-业务对象/资源库.md", "title": "资源库", "folder": "docs/20-业务对象", "text": "﻿--- title: 资源库 type: knowledge domain: 贸易端 module: 资源库 submodule: 主数据管理 status: authoritative version: v0.1 owner: 产品 maintainer: Daren updated_at: 2026-05-25 permission: internal tags: - 资源库 - 主数据 - 资源库模板 - FlowSpace引用 source_files: - source:thoughts-v2-current/V2.4.x/贸易端/【贸易端】【资源库】第一阶段.md - source:thoughts-v2-current/V2.5.x/贸易端/【贸易端】【资源库】资源库分享.md - source:thoughts-v2-current/V2.5.x/贸易端/【贸易端】【资源库】视图管理.md - source:thoughts-v2-current/v2.7/贸易端/【贸易端】【资源库】SCCS应用数据范围、数据编辑历史记录.md related_docs: - ./FlowSpace.md - ../40-权限与安全/权限体系总表.md search_keywords: - 团队资源库 - 资源库引用 - 资源库同步 - 资源库分享 ---  # 资源库  ## 1. 功能定位  资源库是团队级标准化数据池，用于管理物料、供应商、客户等基础数据，并将这些数据应用到 FlowSpace 订单和表单字段中。  ## 2. 使用对象与入口  | 使用对象 | 入口 | 说明 | | --- | --- | --- | | 团队成员 | 贸易端资源库 | 创建、查看、维护资源库数据 | | 资源库管理员 | 资源库设置 | 管理资源库基础信息、角色、权限、成员 | | FlowSpace 成员 | 订单表单中的资源库引用字段 | 引用资源库数据 | | 运营人员 | 运营端资源库管理、资源库模板 | 配置模板、查看团队资源库数据 |  ## 3. 核心对象  | 对象 | 说明 | | --- | --- | | 资源库模板 | 运营端配置的资源库结构 | | 资源库 | 团队基于模板创建的数据池 | | 资源库表 | 资源库下的数据表 | | 资源库数据 | 资源库表中的单条记录 | | 资源库角色 | 控制资源库设置和表数据权限 | | 资源库视图 | 组织表数据查看方式 | | 资源库分享 | 对单条或整表数据进行外链或授权分享 | | FlowSpace 应用资源库 | 将资源库表和字段应用到 FlowSpace 表单 |  ## 4. 业务流程  flowchart TD A[\"运营端配置资源库模板\"] --> B[\"贸易端从模板中心选择模板\"] B --> C[\"创建资源库\"] C --> D[\"设置资源库角色和表权限\"] D --> E[\"维护资源库数据\"] E --> F[\"FlowSpace 关联资源库\"] F --> G[\"订单字段引用资源库数据\"] E --> H[\"资源库数据变更\"] H --> I[\"按策略同步到已引用字段或保留历史快照\"]  ## 5. 权限规则  | 权限域 | 权限点 | | --- | --- | | 团队角色 | 创建资源库、删除资源库、资源库管理 | | 资源库角色 | 资源库设置、查看数据、创建数据、编辑数据、删除数据、导入、导出、批量操作 | | 表权限 | 按资源库表配置查看、编辑、删除、导入导出等权限 | | 数据范围 | 控制成员可见或可操作的数据范围 | | 分享权限 | 控制外链、只读、可编辑、密码、失效等能力 |  ## 6. 状态与限制  已确认规则：  - 删除资源库为假删。 - 删除资源库后，各 FlowSpace 下可见表同时被删除。 - 新订单不可再引用已删除资源库或已删除资源库数据。 - 历史订单中已引用的数据需保留文本或快照。 - 资源库名称在当前团队内不可重复。 - 资源库管理员为固定角色，默认包含创建资源库的成员。  ## 7. 字段、表单与校验  资源库数据表单由资源库模板决定。字段规则包括：  - 必填校验。 - 字段类型校验。 - 关联引用字段。 - 图片、附件、日期、数字、百分比等组件规则。 - 导入模板字段校验。 - 资源库引用在订单表单中的展示和历史保留。  ## 8. 通知、日志与审计  资源库需要沉淀的记录包括：  - 创建、编辑、删除资源库。 - 创建、编辑、删除资源库角色。 - 创建、编辑、删除资源库数据。 - 导入导出记录。 - 批量编辑和批量下载记录。 - 数据编辑历史。 - 资源库同步触发的系统自动执行日志。  ## 9. 异常与提示  需要统一沉淀：  - 请输入资源库名称。 - 已存在相同的资源库名称，请修改。 - 暂无权限，请联系管理员。 - 必填项为空时提示请输入对应字段。 - 删除后的数据不可继续引用。 - 导入失败原因和失败记录下载。  ## 10. 来源需求  - `source:thoughts-v2-current/V2.4.x/贸易端/【贸易端】【资源库】第一阶段.md` - `source:thoughts-v2-current/V2.5.x/贸易端/【贸易端】【资源库】资源库分享.md` - `source:thoughts-v2-current/V2.5.x/贸易端/【贸易端】【资源库】视图管理.md` - `source:thoughts-v2-current/v2.7/贸易端/【贸易端】【资源库】SCCS应用数据范围、数据编辑历史记录.md` - `source:thoughts-v2-current/v2.3.x/运营端/【运营端】【模板中心】资源库模版管理.md` - `missing-current-source/【运营端】【资源库模版】表单设计组件.md`  ## 11. 待确认问题  - 资源库同步与自动化更新同一字段时的优先级。 - 资源库分享的外部访问权限、密码和失效策略是否需要独立权限页。 - 资源库数据编辑历史的字段级快照范围。  "}, {"path": "docs/20-业务对象/资源库模板.md", "title": "资源库模板", "folder": "docs/20-业务对象", "text": "﻿--- title: 资源库模板 type: knowledge domain: 运营端 module: 资源库模板 submodule: 资源库创建模板 status: authoritative version: v0.1 owner: 产品 maintainer: Daren updated_at: 2026-05-25 permission: internal tags: - 资源库模板 - 资源库 - 模板中心 - 表单设计 source_files: - source:thoughts-v2-current/v2.3.x/运营端/【运营端】【模板中心】资源库模版管理.md - missing-current-source/【运营端】【资源库模版】表单设计组件.md related_docs: - ./资源库.md search_keywords: - 资源库模版 - 资源库模板 - 分组 - 资源库表单 - 同步至团队资源库 ---  # 资源库模板  ## 1. 功能定位  资源库模板是运营端配置的资源库创建模板，用于定义团队资源库的分组、表单、字段、预览数据和发布版本。贸易端团队基于可见且已发布的资源库模板创建资源库。  ## 2. 使用对象与入口  | 使用对象 | 入口 | 说明 | | --- | --- | --- | | 运营人员 | 运营端 > 模板中心 > 资源库模板 | 创建、编辑、设计、发布、复制和同步资源库模板 | | 贸易端团队 | 贸易端资源库模板中心 | 基于模板创建资源库 | | 实施人员 | 预览数据 | 模拟资源库数据结构和展示 |  ## 3. 核心对象  | 对象 | 说明 | | --- | --- | | 模板基础信息 | 名称、图标、创建类型、所属行业、描述、备注 | | 分组 | 资源库模板中的结构节点 | | 表单 | 分组下的数据表结构 | | 表单字段 | 资源库数据字段 | | 预览数据 | 用于模板中心模拟资源库使用效果 | | 发布态模板 | 贸易端可见和可用于创建资源库的模板版本 | | 同步至团队资源库 | 将模板变更同步到已创建的团队资源库 |  ## 4. 业务流程  flowchart TD A[\"添加资源库模板\"] --> B[\"配置基础信息\"] B --> C[\"添加分组\"] C --> D[\"添加表单并设计字段\"] D --> E[\"录入预览数据\"] E --> F[\"发布模板\"] F --> G[\"贸易端资源库模板中心可见\"] G --> H[\"团队创建资源库\"] D --> I[\"复制模板\"] D --> J[\"同步至团队资源库\"]  ## 5. 权限规则  当前需求主要描述运营端模板管理能力。已确认：  - 只有运营端有模板管理权限的人员可管理资源库模板。 - 系统模板可设置可见团队。 - 模板启用且已发布后，贸易端才可见。  ## 6. 状态与限制  | 状态 | 说明 | 限制 | | --- | --- | --- | | 未发布 | 创建后尚未发布 | 即使启用，贸易端仍不可见 | | 已发布 | 形成可用版本 | 贸易端可使用 | | 只读模式 | 默认查看设计 | 需开启编辑才能修改 | | 启用/未启用 | 模板启用状态 | 需结合发布状态判断贸易端可见性 |  ## 7. 字段、表单与校验  基础信息：  - 模板名称必填，限制 100 字符。 - 模板图标必填。 - 创建类型必填。 - 所属行业必填。 - 模板描述、备注限制 200 字符。  设计规则：  - 创建资源库模板后默认无分组、无表单。 - 分组名称必填，限制 100 字符，需支持国际化。 - 表单名称必填，限制 100 字符，需支持国际化。 - 分组下可创建多个表单。 - 表单设计组件规则引用资源库模板表单设计组件。 - 预览数据按贸易端资源库数据操作逻辑录入。  ## 8. 通知、日志与审计  需要记录：  - 资源库模板新增、编辑、删除。 - 可见范围设置。 - 分组和表单设计变更。 - 发布记录。 - 复制记录。 - 同步至团队资源库记录。  ## 9. 异常与提示  已知提示：  - 选择部分可见团队时，至少选择一个团队。 - 同步至团队资源库需谨慎，以免影响资源库数据展示。 - 与模板有关联的控件更新后，对应业务数据不可被清空。  ## 10. 来源需求  - `source:thoughts-v2-current/v2.3.x/运营端/【运营端】【模板中心】资源库模版管理.md` - `missing-current-source/【运营端】【资源库模版】表单设计组件.md` - `source:thoughts-v2-current/V2.4.x/贸易端/【贸易端】【资源库】第一阶段.md`  ## 11. 待确认问题  - 模板同步至团队资源库时字段删除、字段新增和历史数据保留规则。 - 资源库模板与业务模板的表单组件差异清单。 - 定制模板、用户自建模板是否纳入近期范围。  "}, {"path": "docs/20-业务对象/里程碑.md", "title": "里程碑", "folder": "docs/20-业务对象", "text": "﻿--- title: 里程碑 type: knowledge domain: 贸易端 module: 里程碑 submodule: 订单流程节点 status: authoritative version: v0.1 owner: 产品 maintainer: Daren updated_at: 2026-05-25 permission: internal tags: - 里程碑 - 计划 - 状态 - 里程碑批复 source_files: - source:thoughts-v2-current/v2.1.x/贸易端/【贸易端】【SCCS设置】.md - source:thoughts-v2-current/v2.2.x/贸易端/【贸易端】【订单详情】查看&操作.md - source:thoughts-v2-current/v2.2.x/贸易端/【贸易端】【订单详情】工单&里程碑批复操作.md - source:thoughts-v2-current/v2.3.x/贸易端/【贸易端】【订单管理】里程碑互用功能.md related_docs: - ./订单.md - ./工单与批复.md - ./FlowSpace.md search_keywords: - 里程碑计划 - 计划开始 - 计划结束 - 里程碑状态 - 里程碑互用 ---  # 里程碑  ## 1. 功能定位  里程碑是订单流程中的阶段节点，用于承载阶段计划、负责人、标签、里程碑批复和工单。里程碑结构来自业务模板，运行态计划和状态在 FlowSpace 与订单中生效。  ## 2. 使用对象与入口  | 使用对象 | 入口 | 说明 | | --- | --- | --- | | 运营人员 | 业务模板设计 | 配置里程碑名称、批复设置、表单、按钮文案等 | | FlowSpace 管理员 | FlowSpace 设置 > 里程碑计划 | 配置计划起止时间
