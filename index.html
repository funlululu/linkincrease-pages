<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Linkincrease 知识库</title>
  <base href="/linkincrease-pages/">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
  <style>
    :root {
      --bg:#f8faff; --panel:#fff; --soft:#f3f7fd; --hover:#eaf2ff;
      --text:#172033; --muted:#64748b; --faint:#94a3b8;
      --line:#dfe8f5; --line-strong:#c8d8ed; --accent:#0878dc;
      --accent-strong:#0566c2; --accent-soft:#e5f2ff; --code:#edf4fc; --focus:#3597ed;
      --shadow:0 18px 50px rgba(20,74,130,.09);
      --transition:color .16s ease, background-color .16s ease, border-color .16s ease, box-shadow .16s ease;
    }
    * { box-sizing:border-box; }
    html { min-height:100%; }
    body { min-height:100%; margin:0; color:var(--text); background:var(--bg); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif; letter-spacing:0; }
    .sidebar { position:fixed; inset:0 auto 0 0; z-index:3; width:292px; height:100vh; display:flex; flex-direction:column; background:var(--soft); border-right:1px solid var(--line); }
    header { flex:0 0 auto; display:flex; flex-direction:column; gap:14px; padding:14px 12px 12px; background:var(--soft); }
    header h1 { display:flex; align-items:center; gap:10px; min-height:38px; margin:0; padding:4px 8px; font-size:15px; line-height:1.2; font-weight:650; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    header h1::before { content:"L"; width:25px; height:25px; display:grid; place-items:center; flex:0 0 auto; border:1px solid rgba(255,255,255,.42); border-radius:7px; background:linear-gradient(145deg,#1591f2,#0568ca); color:#fff; box-shadow:0 5px 14px rgba(8,120,220,.22); font-family:Georgia,"Times New Roman",serif; font-weight:700; font-size:15px; }
    #search { width:100%; height:36px; padding:7px 11px; border:1px solid var(--line); border-radius:8px; color:var(--text); background:rgba(255,255,255,.72); outline:none; font-size:14px; transition:var(--transition); }
    #search:hover { border-color:var(--line-strong); background:var(--panel); }
    #search:focus { background:var(--panel); border-color:var(--focus); box-shadow:0 0 0 3px rgba(53,151,237,.14); }
    .sidebar-footer { flex:0 0 auto; border-top:1px solid var(--line); background:var(--soft); }
    .download-section { font-size:13px; }
    .download-section summary {
      display:flex; align-items:center; gap:6px; padding:10px 14px; cursor:pointer;
      color:var(--muted); list-style:none; user-select:none; transition:var(--transition);
    }
    .download-section summary::-webkit-details-marker { display:none; }
    .download-section summary:hover { color:var(--text); background:var(--hover); }
    .download-section summary::before { content:"▸"; font-size:11px; transition:transform .12s ease; }
    .download-section[open] summary::before { transform:rotate(90deg); }
    .download-section[open] summary { color:var(--text); }
    .download-actions { display:grid; gap:8px; padding:0 14px 12px; }
    .download-link { display:grid; gap:2px; padding:9px 10px; border:1px solid var(--line); border-radius:8px; color:var(--text); background:var(--panel); text-decoration:none; box-shadow:0 8px 24px rgba(20,74,130,.05); transition:var(--transition); }
    .download-link:hover { border-color:#a9c9eb; background:#fafdff; box-shadow:0 8px 24px rgba(8,120,220,.08); }
    .download-title { font-size:14px; font-weight:650; }
    .download-subtitle { color:var(--muted); font-size:12px; }
    main { display:grid; grid-template-columns:292px minmax(0,1fr); min-height:100vh; }
    nav { flex:1 1 auto; min-height:0; width:100%; overflow:auto; padding:4px 12px 18px; scrollbar-width:thin; scrollbar-color:var(--line-strong) transparent; }
    .nav-tree { display:grid; gap:3px; }
    .nav-group { margin:2px 0; }
    .nav-group.level-0 { margin:8px 0 10px; }
    .nav-group summary {
      display:grid;
      grid-template-columns:16px minmax(0, 1fr) auto;
      align-items:center;
      gap:6px;
      min-height:30px;
      padding:6px 8px;
      border-radius:8px;
      color:var(--muted);
      cursor:pointer;
      font-size:13px;
      font-weight:650;
      line-height:1.3;
      list-style:none;
      user-select:none;
    }
    .nav-group.level-0 > summary { min-height:36px; background:rgba(255,255,255,.72); border:1px solid var(--line); color:#26364f; font-weight:760; box-shadow:0 1px 0 rgba(15,39,70,.03); }
    .nav-group.level-1 > summary { color:#40536e; font-weight:700; }
    .nav-group.level-2 > summary,
    .nav-group.level-3 > summary,
    .nav-group.level-4 > summary { color:var(--muted); font-size:12px; font-weight:620; }
    .nav-group summary::-webkit-details-marker { display:none; }
    .nav-group summary:hover { background:var(--hover); color:var(--text); }
    .nav-caret { width:14px; height:14px; display:grid; place-items:center; color:#8ca0b8; transition:transform .14s ease, color .14s ease; }
    .nav-caret::before { content:"▸"; font-size:11px; line-height:1; }
    .nav-group[open] > summary .nav-caret { transform:rotate(90deg); color:var(--accent); }
    .nav-label { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .nav-count { min-width:22px; padding:1px 6px; border-radius:999px; background:#e9f0f9; color:#70849d; font-size:10px; font-weight:600; text-align:center; }
    .nav-items { margin:2px 0 4px 8px; padding-left:12px; border-left:1px solid var(--line); }
    .nav-group.level-0 > .nav-items { margin-left:12px; }
    nav a { position:relative; display:grid; gap:3px; padding:8px 30px 8px 12px; margin:2px 0; color:var(--text); text-decoration:none; border:1px solid transparent; border-radius:9px; font-size:14px; line-height:1.35; transition:var(--transition), transform .16s ease; }
    nav a::before { content:""; position:absolute; left:-13px; top:50%; width:8px; height:1px; background:var(--line); }
    nav a::after { content:""; position:absolute; right:12px; top:50%; width:6px; height:6px; border-radius:999px; background:transparent; transform:translateY(-50%) scale(.5); transition:background-color .16s ease, transform .16s ease, box-shadow .16s ease; }
    nav a:hover { background:rgba(234,242,255,.78); border-color:#d8e7f8; transform:translateX(1px); }
    nav a.active { background:linear-gradient(115deg,#edf6ff 0%,#e0efff 100%); border-color:#b9d9f7; color:#075fad; box-shadow:0 7px 18px rgba(8,120,220,.10), inset 0 1px 0 rgba(255,255,255,.82); }
    nav a.active::before { height:2px; background:#76b7ee; }
    nav a.active::after { background:var(--accent); transform:translateY(-50%) scale(1); box-shadow:0 0 0 4px rgba(8,120,220,.10); }
    nav .doc-title, nav .folder { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    nav .doc-title { font-size:13px; font-weight:560; letter-spacing:0; }
    nav a.active .doc-title { font-weight:700; }
    nav .folder { display:block; color:#8a9bb0; font-size:11px; margin-top:0; }
    nav a.active .folder { color:#5685b0; }
    .meta { position:sticky; top:0; z-index:2; grid-column:2; height:48px; display:flex; align-items:center; padding:0 52px; color:var(--muted); font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; background:rgba(248,250,255,.88); border-bottom:1px solid rgba(207,222,240,.78); backdrop-filter:blur(14px); }
    .kb-banner {
      position:relative;
      isolation:isolate;
      grid-column:2;
      width:min(calc(100% - 104px), 1120px);
      margin:28px auto 0;
      padding:24px;
      display:grid;
      grid-template-columns:minmax(280px,1fr) auto minmax(230px,280px);
      align-items:center;
      gap:24px;
      overflow:hidden;
      border:1px solid rgba(255,255,255,.18);
      border-radius:20px;
      color:#fff;
      background:
        radial-gradient(circle at 12% 0%,rgba(82,190,255,.34),transparent 34%),
        linear-gradient(118deg,#086fc9 0%,#0757a7 48%,#103660 100%);
      box-shadow:0 22px 56px rgba(8,73,134,.22),inset 0 1px 0 rgba(255,255,255,.16);
    }
    .kb-banner::after {
      content:"";
      position:absolute;
      z-index:-1;
      width:220px;
      height:220px;
      right:-90px;
      bottom:-135px;
      border:36px solid rgba(255,255,255,.07);
      border-radius:50%;
    }
    .kb-copy { min-width:0; }
    .kb-copy h2 { margin:0 0 8px; color:#fff; font-size:24px; line-height:1.2; font-weight:760; letter-spacing:-.02em; }
    .kb-copy p { max-width:560px; margin:0; color:rgba(236,247,255,.82); font-size:14px; line-height:1.65; }
    .kb-meta {
      min-width:128px;
      padding:12px 16px;
      display:grid;
      gap:5px;
      border-left:1px solid rgba(255,255,255,.22);
    }
    .kb-meta span { display:flex; align-items:center; gap:7px; color:rgba(225,242,255,.7); font-size:11px; font-weight:650; letter-spacing:.08em; }
    .kb-meta span::before { content:""; width:7px; height:7px; border-radius:50%; background:#70f0b5; box-shadow:0 0 0 4px rgba(112,240,181,.13); }
    .kb-meta strong { color:#fff; font-size:16px; line-height:1.25; font-weight:720; white-space:nowrap; }
    .kb-code {
      min-width:0;
      padding:11px 12px 12px;
      display:grid;
      gap:7px;
      border:1px solid rgba(255,255,255,.18);
      border-radius:12px;
      background:rgba(5,23,42,.52);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.08);
    }
    .kb-code span { color:rgba(225,242,255,.68); font-size:11px; line-height:1.2; }
    .kb-code code {
      display:block;
      padding:8px 10px;
      overflow:auto;
      border:1px solid rgba(147,207,255,.22);
      border-radius:8px;
      color:#f5fbff;
      background:#071b30;
      font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
      font-size:13px;
      font-weight:650;
      line-height:1.25;
      white-space:nowrap;
      text-shadow:0 1px 0 rgba(0,0,0,.24);
    }
    .kb-code code::before { content:"$ "; color:#71d8ff; }
    article { grid-column:2; width:min(100%, 940px); margin:0 auto; padding:44px 52px 88px; background:var(--bg); }
    article h1, article h2, article h3, article h4 { color:var(--text); line-height:1.25; letter-spacing:0; scroll-margin-top:72px; }
    article h1 { margin:0 0 22px; font-family:Georgia,"Times New Roman","Songti SC",serif; font-size:40px; font-weight:700; }
    article h2 { margin:38px 0 14px; padding-top:6px; border-top:1px solid var(--line); font-size:23px; font-weight:680; }
    article h3 { margin:26px 0 10px; font-size:18px; font-weight:680; }
    article h4 { margin:22px 0 8px; font-size:16px; font-weight:650; }
    article p, article li { color:var(--text); font-size:15px; line-height:1.78; }
    article p { margin:10px 0; }
    article ul, article ol { padding-left:1.45em; margin:10px 0 16px; }
    article li + li { margin-top:4px; }
    article a { color:var(--accent-strong); text-decoration:underline; text-decoration-color:#9bc9f1; text-underline-offset:3px; }
    article blockquote { margin:18px 0; padding:2px 0 2px 16px; color:var(--muted); border-left:3px solid var(--line-strong); }
    article table { display:block; width:100%; margin:18px 0 24px; overflow:auto; border-collapse:collapse; font-size:14px; }
    article th, article td { min-width:120px; border:1px solid var(--line); padding:8px 10px; vertical-align:top; line-height:1.55; background:var(--panel); }
    article th { color:#344761; background:var(--soft); font-weight:650; }
    article code { padding:2px 5px; border-radius:4px; background:var(--code); color:#075fad; font-size:.92em; }
    article pre { margin:18px 0; padding:16px; overflow:auto; border:1px solid #203b5b; border-radius:8px; background:#10243e; color:#edf6ff; }
    article pre code { padding:0; background:transparent; color:inherit; }
    .source-section {
      margin:40px 0 0;
      padding:18px 20px;
      border:1px solid var(--line);
      border-radius:10px;
      background:var(--panel);
    }
    .source-section summary {
      display:flex;
      align-items:center;
      gap:6px;
      cursor:pointer;
      font-size:14px;
      font-weight:650;
      color:var(--muted);
      list-style:none;
      user-select:none;
    }
    .source-section summary::-webkit-details-marker { display:none; }
    .source-section summary::before { content:"▸"; font-size:11px; transition:transform .14s ease; }
    .source-section[open] summary::before { transform:rotate(90deg); }
    .source-section[open] summary { color:var(--text); }
    .source-table { width:100%; margin:12px 0 0; border-collapse:collapse; font-size:13px; }
    .source-table th, .source-table td { border:1px solid var(--line); padding:6px 8px; text-align:left; }
    .source-table th { background:var(--soft); color:var(--muted); font-weight:650; font-size:12px; }
    .source-table td { color:var(--text); }
    .source-badge { display:inline-block; padding:1px 7px; border-radius:999px; background:var(--accent-soft); color:var(--accent); font-size:11px; font-weight:620; margin:1px 4px 1px 0; }
    .source-none { color:var(--faint); font-size:13px; padding:6px 0; }
    .mermaid-source { position:relative; margin:18px 0; }
    .mermaid-source pre { margin:0; padding-top:44px; }
    .mermaid-actions { position:absolute; top:8px; right:8px; display:flex; gap:8px; }
    .mermaid-preview-btn {
      height:28px;
      padding:0 10px;
      border:1px solid var(--line-strong);
      border-radius:6px;
      color:var(--text);
      background:var(--panel);
      cursor:pointer;
      font-size:13px;
    }
    .mermaid-preview-btn:hover { background:var(--hover); }
    .mermaid-modal {
      position:fixed;
      inset:0;
      z-index:20;
      display:none;
      background:rgba(12,31,56,.58);
    }
    .mermaid-modal.open { display:grid; grid-template-rows:auto minmax(0,1fr); }
    .mermaid-modal-bar {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:12px 16px;
      background:var(--panel);
      border-bottom:1px solid var(--line);
    }
    .mermaid-modal-title { color:var(--text); font-size:14px; font-weight:650; }
    .mermaid-close {
      height:32px;
      padding:0 12px;
      border:1px solid var(--line-strong);
      border-radius:6px;
      background:var(--panel);
      color:var(--text);
      cursor:pointer;
    }
    .mermaid-close:hover { background:var(--hover); }
    .mermaid-modal-body { min-width:0; overflow:auto; padding:24px; background:var(--bg); }
    .mermaid-modal-diagram {
      min-width:max-content;
      min-height:calc(100vh - 112px);
      display:grid;
      place-items:center;
      padding:24px;
      border:1px solid var(--line);
      border-radius:8px;
      background:var(--panel);
    }
    .mermaid-modal-diagram svg { max-width:none; height:auto; }
    .empty-state { margin:10px 8px; padding:12px; color:var(--muted); border:1px dashed var(--line-strong); border-radius:8px; font-size:13px; line-height:1.5; }
    @media (max-width:900px) {
      .sidebar { position:sticky; top:0; width:100%; height:auto; max-height:72vh; border-right:0; border-bottom:1px solid var(--line); }
      header { padding:12px 14px; }
      main { display:block; min-height:auto; }
      nav { max-height:36vh; padding:8px 14px 12px; background:var(--soft); }
      .meta { height:auto; padding:10px 20px; }
      .kb-banner { width:auto; margin:18px 16px 0; padding:20px; grid-template-columns:1fr; gap:18px; border-radius:16px; }
      .kb-meta { padding:12px 0 0; border-left:0; border-top:1px solid rgba(255,255,255,.2); }
      .kb-code { width:100%; }
      article { padding:30px 20px 72px; }
      article h1 { font-size:31px; }
      article h2 { font-size:21px; }
    }
  </style>
</head>

  <script>
    const docs = [{"path": "00-知识库维护规范.md", "title": "知识库维护规范", "folder": ".", "text": "# 知识库维护规范  ## 1. 知识库定位  本知识库用于沉淀 Linkincrease 的当前产品共识。原始需求文档、会议纪要、原型和临时讨论可以作为来源，但不能直接等同于知识库结论。  知识库正文应回答：  - 这个对象或功能是什么。 - 谁使用它。 - 入口在哪里。 - 业务流程是什么。 - 权限和状态限制是什么。 - 数据、表单、通知、日志如何流转。 - 结论来自哪些需求文档。  ## 2. 内容入库原则  | 原则 | 说明 | | --- | --- | | 可追溯 | 每个结论都应能追溯到需求文档、评审结论或线上行为 | | 去重复 | 同一规则跨多份需求出现时，只保留一处权威定义 | | 按对象归并 | 优先按 FlowSpace、订单、里程碑、工单、资源库等业务对象组织 | | 权限单列 | 权限规则不混在页面说明里，需要沉淀到权限章节 | | 状态单列 | 状态枚举、状态变更、状态限制需要统一维护 | | 不确定不硬写 | 未确认内容进入问题池，确认后再合入正式页面 |  ## 3. 推荐页面模板  # 功能或对象名称  ## 1. 功能定位 ## 2. 使用对象与入口 ## 3. 核心对象 ## 4. 业务流程 ## 5. 权限规则 ## 6. 状态与限制 ## 7. 字段、表单与校验 ## 8. 通知、日志与审计 ## 9. 异常提示 ## 10. 来源需求 ## 11. 待确认问题  ## 4. 更新流程  1. 将新增或更新需求同步到 `最新需求源（source:thoughts-v2-current）`；维护人本地目录由 `LINKINCREASE_SOURCE_PATH` 指定。 2. 运行 `python scripts\\scan_source_manifest.py` 更新 `metadata/source-manifest.csv` 和 `metadata/source-diff.csv`。 3. 在 [05-需求文档来源台账.md](./05-需求文档来源台账.md) 中登记来源和归属模块。 4. 判断该需求是新增对象、补充规则、调整权限、调整状态，还是修正文案。 5. 更新对应知识页。 6. 如果影响核心术语，同步更新 [02-核心概念词典.md](./02-核心概念词典.md)。 7. 如果影响功能边界，同步更新 [03-功能地图.md](./03-功能地图.md)。 8. 如果有冲突或待确认项，记录到 [99-待办与问题池.md](./99-待办与问题池.md)。  ## 5. 冲突处理规则  | 冲突类型 | 处理方式 | | --- | --- | | 新旧需求冲突 | 标出两份来源，优先找产品确认，不自行猜测 | | 页面描述与权限描述冲突 | 以权限矩阵或最新权限需求为准，待确认前进入问题池 | | 贸易端与采集端行为不一致 | 分别记录端差异，不强行统一 | | 运营端配置与贸易端运行态冲突 | 分别记录“配置态”和“运行态”，再确认转换规则 | | 状态限制不一致 | 统一沉淀到状态章节，来源页保留引用 |  ## 6. 命名规范  - 业务对象使用统一名称：FlowSpace、订单、里程碑、工单、资源库、业务模板、资源库模板。 - 原需求中出现“模版”和“模板”时，知识库正文统一使用“模板”，文件名保留原样。 - 原需求中出现 SCCS 时，知识库正文统一映射为 FlowSpace（流空间）；来源文件名、`source:` 引用和导出文件名保留原始 SCCS，以便追溯。 - 更名原因：FlowSpace 比 SCCS 更直观，英文名称可直接联想到业务“流”与协作“空间”，降低新成员理解成本。 - 文档标题尽量使用“对象 + 主题”，例如 `订单-生命周期与状态规则.md`。  ## 7. 质量检查  每次更新后检查：  - 是否能从 README 入口找到该内容。 - 是否已登记来源。 - 是否有权限、状态、通知、日志遗漏。 - 是否把临时待确认内容写成了确定结论。 - 是否与核心概念词典和功能地图保持一致。", "domain": "知识库管理", "module": "维护规范", "tags": "维护;入库;冲突处理", "sources": []}, {"path": "01-产品总览.md", "title": "01-产品总览", "folder": ".", "text": "﻿# 产品总览  ## 1. 产品定位  Linkincrease 是面向供应链协作场景的业务协同平台。平台以 FlowSpace 为核心业务空间，围绕订单、里程碑、工单、资源库、协作团队、自动化、消息通知和移动采集，连接品牌方、供应商、验货/采集人员、运营人员等多类参与者，支撑从模板配置到业务执行、数据沉淀、追踪审计的完整闭环。  ## 2. 产品端组成  | 产品端 | 使用对象 | 核心定位 | 关键关系 | | --- | --- | --- | --- | | 运营端 | 平台运营、实施、管理人员 | 配置和监管平台基础能力，包括用户、团队、FlowSpace、业务模板、资源库模板、表单组件、仪表盘、报告、外部 API 和软件记录 | 配置能力下发到贸易端；查看平台级数据 | | 贸易端 | B 端客户团队和协作团队 | 业务协同主平台，承载团队、FlowSpace、订单、里程碑、工单、资源库、自动化、消息和仪表盘 | 由运营端模板创建 FlowSpace；与采集端实时同步任务和数据 | | 采集端 | 移动端执行人员、协作成员 | 移动场景下的任务查看、工单采集、工单批复、里程碑批复和消息处理入口 | 与贸易端订单、工单、批复任务双向同步 |  ## 3. 核心业务闭环  flowchart TD A[\"运营端配置业务模板 / 资源库模板 / 表单组件\"] --> B[\"贸易端团队创建 FlowSpace\"] B --> C[\"FlowSpace 设置角色、成员、协作团队、数据围栏\"] C --> D[\"创建订单并生成里程碑计划\"] D --> E[\"创建、指派、采集、批复工单\"] E --> F[\"里程碑批复与状态推进\"] F --> G[\"订单完成、取消、重启或继续流转\"] B --> H[\"资源库提供标准数据\"] H --> D E --> I[\"采集端移动处理任务\"] D --> J[\"自动化、消息、日志、仪表盘、报告沉淀过程数据\"]  ## 4. 平台能力分层  | 能力层 | 说明 | 代表模块 | | --- | --- | --- | | 账号与组织层 | 管理用户身份、团队归属、团队成员、协作团队和个人设置 | 注册登录、个人中心、团队管理、团队设置 | | 模板与配置层 | 定义业务结构、表单字段、里程碑、批复、资源库和可见范围 | 运营端模板中心、业务模板、资源库模板、表单设计组件 | | 业务执行层 | 承载供应链协作的核心执行过程 | FlowSpace、订单、里程碑、工单、批复、采集 | | 主数据层 | 管理可被 FlowSpace 引用的标准化业务数据 | 资源库、资源库分享、资源库视图、资源库历史 | | 协作与权限层 | 控制不同团队、角色、成员在业务中的可见与可操作范围 | 团队角色、FlowSpace 业务角色、协作方角色、数据围栏、仪表盘权限、报告权限 | | 自动化与通知层 | 将机械性操作、消息推送和异常通知自动化 | 自动化、定时任务、消息中心、实时消息、邮件协作 | | 追踪与审计层 | 记录用户操作、系统操作和业务过程变化 | 操作日志、动态、历史记录、跟踪记录、系统自动执行日志 | | 数据展示层 | 对订单、任务、仪表盘、报告和运营数据进行聚合展示 | 工作台、常用视图、订单日程、仪表盘、报告 |  ## 5. 核心业务对象关系  erDiagram USER ||--o{ TEAM_MEMBER : joins TEAM ||--o{ TEAM_MEMBER : contains TEAM ||--o{ FlowSpace : owns TEAM ||--o{ RESOURCE_LIBRARY : owns FlowSpace ||--o{ FlowSpace_MEMBER : contains FlowSpace ||--o{ ORDER : contains FlowSpace ||--o{ AUTOMATION : configures FlowSpace ||--o{ DASHBOARD : presents ORDER ||--o{ MILESTONE : contains MILESTONE ||--o{ WORK_ORDER : contains MILESTONE ||--o| MILESTONE_APPROVAL : may_have WORK_ORDER ||--o| WORK_ORDER_APPROVAL : may_have WORK_ORDER ||--o{ COLLECTION_FORM : contains RESOURCE_LIBRARY ||--o{ RESOURCE_TABLE : contains RESOURCE_TABLE ||--o{ RESOURCE_RECORD : contains RESOURCE_RECORD ||--o{ ORDER : referenced_by  ## 6. 当前知识库重点  1. 以 FlowSpace、订单、里程碑、工单为主线梳理业务执行链路。 2. 将团队权限、FlowSpace 权限、协作方权限、资源库权限和数据围栏拆开描述，避免混淆。 3. 将资源库、自动化、消息通知、日志审计作为横向能力，分别沉淀规则。 4. 将运营端模板能力与贸易端实际执行能力对应起来，形成“配置项 -> 运行态行为”的知识结构。", "domain": "公共能力", "module": "产品总览", "tags": "产品;三端;业务闭环", "sources": []}, {"path": "02-核心概念词典.md", "title": "02-核心概念词典", "folder": ".", "text": "﻿# 核心概念词典  本词典用于统一 Linkincrease 内部术语。除非已有新评审结论覆盖，否则需求文档、原型、研发沟通优先沿用本页定义。  ## 1. 产品与组织  | 术语 | 定义 | 关键规则 | | --- | --- | --- | | Linkincrease | 面向供应链协作的业务平台总称 | 包含运营端、贸易端、采集端 | | 运营端 | 平台管理和配置后台 | 管理用户、团队、FlowSpace、模板、资源库模板、软件记录等 | | 贸易端 | 客户团队进行业务协同的主平台 | 承载团队、FlowSpace、订单、资源库、自动化、消息等 | | 采集端 | 移动端任务处理入口 | 面向工单采集、工单批复、里程碑批复和消息查看 | | 团队 | 贸易端客户创建的组织单位 | 一个账号可加入多个团队；团队拥有 FlowSpace 和资源库 | | 团队成员 | 加入团队的用户 | 可拥有一个或多个团队角色 | | 团队角色 | 团队级权限集合 | 控制团队设置、资源库、创建 FlowSpace 等能力 | | 协作团队 | 与主团队建立协作关系的外部团队 | 可被邀请加入团队协作或 FlowSpace 协作 | | 对接人/负责人 | 协作团队内承担接收、指派、处理任务的成员角色 | 在工单和批复指派中用于承接协作方任务 |  ## 2. FlowSpace 与订单流程  > 命名口径：FlowSpace 中文可理解为“流空间”，是 SCCS 的新名称。知识库正文统一使用 FlowSpace；历史需求、来源文件名和 `source:` 引用中保留 SCCS 原名，用于追溯。  | 术语 | 定义 | 关键规则 | | --- | --- | --- | | FlowSpace | 供应链协作空间，是订单流程运行的业务容器 | 由业务模板创建；包含成员、角色、协作团队、订单、仪表盘、自动化等 | | FlowSpace 分组 | 工作台中对 FlowSpace 的组织方式 | 用于团队内管理多个 FlowSpace | | FlowSpace 业务角色 | FlowSpace 内控制业务操作范围的角色 | 控制订单、里程碑、工单、仪表盘等业务权限 | | 协作 FlowSpace 角色 | 协作团队在 FlowSpace 中的权限角色 | 分为协作方自建角色和主团队授权角色等场景 | | 数据围栏 | 控制成员可见数据范围和字段范围的机制 | 影响订单、里程碑、工单、标签、表单字段等展示 | | 订单 | FlowSpace 中的业务主实体 | 包含订单基本信息、多个里程碑、工单、批复和跟踪记录 | | 订单主表单 | 订单级主数据表单 | 由运营端业务模板定义；用于订单基本信息 | | 订单标识 | 用于替代默认订单 ID 的展示字段 | 可由模板设置默认值，也可在 FlowSpace 设置中调整 | | 订单状态 | 订单生命周期状态 | 通常包括进行中、已完成、已取消 | | 里程碑 | 订单流程节点 | 承载阶段计划、负责人、状态、批复和工单 | | 里程碑状态 | 里程碑生命周期状态 | 通常包括未开始、进行中、已完成、已取消 | | 工单 | 里程碑下的具体执行任务 | 包含采集表单、工单批复、处理人、状态和动态 | | 工单采集 | 处理人填写工单采集表单的过程 | 可在贸易端和采集端处理 | | 工单批复 | 对工单采集结果进行确认或审核 | 仅在模板配置需要工单批复时存在 | | 里程碑批复 | 对里程碑阶段结果进行确认或审核 | 每个里程碑最多一份里程碑批复数据 | | 处理人 | 被指定执行采集、工单批复或里程碑批复的人 | 可为团队成员、协作成员或协作团队负责人 |  ## 3. 复用与关联  | 术语 | 定义 | 关键规则 | | --- | --- | --- | | 订单翻单 | 基于历史订单复制或复用内容创建新订单 | 强调从旧订单快速生成新订单 | | 订单关联 | 建立订单之间的关系 | 默认只建立关系，不自动同步字段 | | FlowSpace 关联 | FlowSpace 之间建立业务关联 | 用于跨 FlowSpace 数据和流程协作，具体规则以后续需求为准 | | 里程碑互用 | 将某个订单的里程碑复用到其他订单 | 需要保留来源、目标和取消互用规则 | | 工单互用 | 将某个工单复用于其他订单或里程碑 | 需要处理互用来源、目标、权限和状态限制 |  ## 4. 资源库  | 术语 | 定义 | 关键规则 | | --- | --- | --- | | 资源库 | 团队级标准化数据池 | 用于管理物料、供应商、客户等基础数据 | | 资源库模板 | 创建资源库的数据结构模板 | 由运营端配置，贸易端基于模板创建资源库 | | 资源库表 | 资源库下的结构化数据表 | 每个资源库可包含多张表 | | 资源库数据 | 资源库表中的单条业务记录 | 支持增删改查、导入、导出、批量操作 | | 资源库角色 | 资源库内权限集合 | 控制查看、创建、编辑、删除、导入、导出、数据范围等 | | 资源库引用 | FlowSpace 订单字段引用资源库数据 | 历史已引用数据需要保留快照或文本 | | 资源库同步 | 资源库数据变化后同步到已引用字段 | 需要处理手动修改、权限变化和来源冲突 | | 资源库分享 | 通过外链或授权方式共享资源库数据 | 涉及只读、可编辑、密码、失效等规则 |  ## 5. 模板与表单  | 术语 | 定义 | 关键规则 | | --- | --- | --- | | 业务模板 | 可创建 FlowSpace 的模板 | 包含主表单、里程碑、工单表单、批复表单、订单标识等 | | 模板中心 | 运营端管理业务模板和资源库模板的模块 | 控制模板列表、可见范围、发布、复制、同步 | | 表单设计器 | 配置表单布局、字段和显隐规则的工具 | 运营端业务模板、资源库模板、仪表盘等多处复用 | | 表单组件 | 构成表单的控件 | 包含布局、基础、高级、成员、协作方、公式、关联引用等组件 | | 公式函数 | 表单公式字段使用的函数体系 | 影响模板配置、字段计算和系统自动更新日志 | | 显隐设置 | 表单字段或组件的条件展示规则 | 需要与权限、数据围栏、必填校验共同判断 | | 验货组件 | 面向尺寸检验、组合明细等验货场景的专用组件 | 覆盖运营端配置、贸易端应用和采集端应用 |  ## 6. 自动化、通知与日志  | 术语 | 定义 | 关键规则 | | --- | --- | --- | | 自动化 | 在 FlowSpace 内基于触发条件执行机械性操作的配置 | 包含触发条件、最多多个执行动作、启用状态和执行日志 | | 定时任务 | 按记录中的时间或周期触发自动化操作 | 自动化二期能力 | | 触发条件 | 自动化开始执行的判断条件 | 包含新增数据、数据变更、到达记录时间等 | | 执行动作 | 自动化满足条件后执行的动作 | 包含发送通知、新增数据、更新数据等 | | 消息中心 | 站内消息和实时消息展示入口 | 覆盖任务、团队、账号、资源库、自动化、导入导出等事件 | | 邮件协作 | 在订单详情或工单场景中通过邮件推进协作 | 支持单个和批量发邮件协作 | | 操作日志 | 设置类、资源库、系统自动执行等行为的审计记录 | 用于追踪谁在何时做了什么 | | 动态 | 订单、里程碑、工单或批复内部的过程记录 | 面向业务执行过程查看 | | 历史记录 | 表单数据编辑历史 | 面向字段级或数据级变更追踪 | | 跟踪记录 | 订单级关键节点记录 | 记录订单状态、里程碑、工单、自动化等关键业务动作 |", "domain": "公共能力", "module": "术语", "tags": "术语;概念;词典", "sources": []}, {"path": "03-功能地图.md", "title": "03-功能地图", "folder": ".", "text": "﻿# 功能地图  ## 1. 运营端  | 一级模块 | 二级能力 | 说明 | | --- | --- | --- | | 用户管理 | 用户列表、用户详情 | 查看平台用户基础信息、拥有团队、加入团队、关联 FlowSpace | | 团队管理 | 团队列表、团队详情、成员信息、角色列表、协作邀请记录 | 平台视角管理团队数据和邀请记录 | | FlowSpace 管理 | FlowSpace 列表、FlowSpace 数据详情、成员记录、邮件协作列表、自动化记录 | 平台视角查看和管理团队 FlowSpace 数据 | | FlowSpace 仪表盘 | 仪表盘列表、仪表盘管理 | 运营端管理 FlowSpace 仪表盘 | | 模板中心 | 业务模板管理、资源库模板管理 | 创建、编辑、复制、发布、分配、同步模板 | | 模板设计 | 表单设计组件、表单属性、显隐设置、里程碑第三方数据对接 | 定义业务模板和资源库模板的结构 | | 资源库管理 | 团队资源库列表、资源库数据明细 | 平台视角查看团队资源库数据 | | 设置 | 软件更新管理、软件更新记录 | 管理软件版本信息和记录 | | 集成与报告 | 外部 API 集成配置、报告管理 | 支撑外部系统对接和报告能力 |  ## 2. 贸易端  | 一级模块 | 二级能力 | 说明 | | --- | --- | --- | | 账号与个人 | 注册登录、忘记密码、个人信息、语言切换、退出账号 | 用户身份与个人设置 | | 团队 | 创建团队、团队信息、团队角色、成员管理、协作团队管理、邀请流程 | 团队级组织和协作关系管理 | | 工作台 | FlowSpace 列表、创建 FlowSpace、FlowSpace 分组、订单日程、任务中心、常用视图 | 团队用户进入业务的首页 | | FlowSpace 设置 | 基本信息、业务角色、协作方角色、数据围栏、成员、协作团队、里程碑计划、标签、更多设置 | FlowSpace 级业务配置 | | 协作 FlowSpace 设置 | 协作方角色、主团队角色、协作成员、权限设置 | 协作团队参与 FlowSpace 时的权限与成员管理 | | 订单列表 | 订单查看、增删改、导入导出、视图设置、子表视图、工单视图、批量操作 | 订单级数据管理入口 | | 订单详情 | 详情查看、看板/表格模式、工单创建、采集、批复、里程碑批复、邮件协作、历史、动态、跟踪记录 | 订单执行主场景 | | 订单管理 | 订单翻单、订单关联、里程碑互用、工单互用 | 业务复用和关系管理 | | 资源库 | 创建资源库、资源库设置、资源库数据、视图管理、分享、FlowSpace 应用数据范围、数据编辑历史 | 团队主数据管理 | | 自动化 | 自动化列表、触发条件、执行动作、执行日志、定时任务 | FlowSpace 内自动执行业务动作 | | 消息与协作 | 消息中心、实时消息、邮件协作、批量邮件协作 | 业务通知和跨团队沟通 | | 日志与审计 | 设置类操作日志、资源库日志、系统自动执行日志 | 追踪配置和系统动作 | | 仪表盘与报告 | 仪表盘权限、报告权限 | 数据展示和权限控制 |  ## 3. 采集端  | 一级模块 | 二级能力 | 说明 | | --- | --- | --- | | 登录 | 邮箱密码登录、忘记密码 | 移动端账号入口 | | 首页 | 我的任务、团队待指派、我关注、FlowSpace 入口、任务数据展示 | 移动端任务聚合 | | 任务列表 | 进行中、已完成、我发起、团队指派、我关注、操作入口 | 工单、工单批复、里程碑批复任务列表 | | 任务搜索 | 从任务列表进入搜索页 | 搜索工单和批复任务 | | 任务详情 | 工单详情、工单批复详情、里程碑批复详情、订单信息 | 移动端处理和查看任务 | | 消息中心 | 首页消息入口、消息列表 | 查看移动端通知 | | 我的 | 个人信息、多语言、修改密码、帮助中心、联系成功经理、检查更新、退出账号 | 个人设置和支持入口 |  ## 4. 公共横向能力  | 能力 | 覆盖范围 | 需要沉淀的规则 | | --- | --- | --- | | 权限体系 | 团队、FlowSpace、协作 FlowSpace、资源库、仪表盘、报告 | 权限点、角色叠加、成员范围、协作方边界 | | 状态机 | 订单、里程碑、工单、批复、自动化、导入导出 | 状态枚举、状态变更入口、状态限制和异常提示 | | 表单体系 | 业务模板、资源库模板、订单、工单、批复、采集端 | 组件、校验、显隐、公式、默认值、移动端展示 | | 数据导入导出 | 订单、工单、资源库 | 模板下载、上传校验、记录、失败原因、权限 | | 消息通知 | 站内、实时、邮件、短信 | 触发事件、接收对象、模板、免打扰或屏蔽规则 | | 日志审计 | 操作日志、动态、历史记录、跟踪记录、系统日志 | 操作人、操作对象、快照、自动程序标识 | | 复用关系 | 订单翻单、订单关联、里程碑互用、工单互用、资源库引用 | 来源、目标、同步、取消、历史保留 |", "domain": "公共能力", "module": "功能地图", "tags": "功能;模块;三端", "sources": []}, {"path": "04-Linkincrease完整知识库架构与内容.md", "title": "Linkincrease 完整知识库架构与内容", "folder": ".", "text": "# Linkincrease 完整知识库架构与内容  本文基于 `最新需求源（source:thoughts-v2-current）` 中所有迭代需求重新整理，用于作为 Linkincrease 后续完整知识库的主体框架。它不是原始需求的简单汇总，而是按“产品对象、业务流程、权限边界、状态规则、数据流转、审计追溯”的方式重组。  ## 1. 知识库总架构  Linkincrease 知识库 ├─ 00 入门与维护 │  ├─ 产品总览 │  ├─ 核心概念词典 │  ├─ 功能地图 │  ├─ 需求来源台账 │  └─ 待办与问题池 ├─ 10 产品端说明 │  ├─ 运营端 │  ├─ 贸易端 │  └─ 采集端 ├─ 20 核心业务对象 │  ├─ 用户与账号 │  ├─ 团队与协作团队 │  ├─ FlowSpace │  ├─ 订单 │  ├─ 里程碑 │  ├─ 工单 │  ├─ 批复 │  └─ 资源库 ├─ 30 核心业务流程 │  ├─ 从模板到 FlowSpace │  ├─ 从订单创建到完成 │  ├─ 工单采集与批复 │  ├─ 跨团队协作 │  ├─ 资源库引用与同步 │  ├─ 自动化执行 │  └─ 移动端采集 ├─ 40 权限与安全 │  ├─ 团队权限 │  ├─ FlowSpace 业务权限 │  ├─ 协作方权限 │  ├─ 资源库权限 │  ├─ 数据围栏 │  ├─ 仪表盘权限 │  └─ 报告权限 ├─ 50 数据、表单与模板 │  ├─ 业务模板 │  ├─ 资源库模板 │  ├─ 表单设计组件 │  ├─ 表单属性与显隐 │  ├─ 公式函数 │  ├─ 验货组件 │  └─ PDF / 第三方数据对接 ├─ 60 协作、通知与自动化 │  ├─ 消息中心 │  ├─ 实时消息 │  ├─ 邮件协作 │  ├─ 自动化一期 │  ├─ 定时任务 │  └─ 外部 API 集成 ├─ 70 展示与分析 │  ├─ 工作台 │  ├─ 常用视图 │  ├─ 订单日程 │  ├─ 仪表盘 │  └─ 报告 └─ 80 日志、历史与审计 ├─ 操作日志 ├─ 动态 ├─ 历史记录 ├─ 跟踪记录 └─ 系统自动执行日志  ## 2. 产品端知识结构  ### 2.1 运营端  运营端是平台配置和监管中心，知识库中应按“配置对象”组织，而不是按页面名称堆叠。  | 知识主题 | 应沉淀内容 | 来源需求 | | --- | --- | --- | | 用户数据管理 | 用户列表筛选、用户详情、拥有团队、加入团队、关联 FlowSpace | `【运营端】【用户-用户管理】平台用户数据管理.md` | | 团队数据管理 | 团队列表、团队详情、成员、角色、协作邀请、参与外部协作 | `【运营端】【用户-团队管理】平台团队数据管理.md` | | FlowSpace 数据管理 | 平台团队的 FlowSpace 数据、成员、邮件协作、自动化记录、仪表盘、报告、外部 API | `【运营端】【用户-SCCS管理】平台团队的SCCS数据管理.md` 等 | | 资源库数据管理 | 团队资源库列表、资源库数据明细、权限边界 | `【运营端】【用户-资源库管理】平台团队的资源库数据管理.md` | | 业务模板 | 模板列表、创建类型、可见范围、设计、发布、复制、同步至 FlowSpace | `【运营端】【模板中心】业务模版管理.md` | | 资源库模板 | 模板列表、创建、编辑、表单设计、预览、发布 | `【运营端】【模板中心】资源库模版管理.md` | | 表单设计器 | 布局组件、基础组件、高级组件、属性、显隐、公式、成员/协作方组件 | `【运营端】【业务模板】表单设计组件.md`、`【运营端】【资源库模版】表单设计组件.md` | | 软件与平台设置 | 软件更新管理、更新记录 | `【运营端】【设置-软件管理】软件相关信息与记录管理.md` |  ### 2.2 贸易端  贸易端是 Linkincrease 的核心业务操作平台，知识库中应围绕用户实际完成的业务链路组织。  | 知识主题 | 应沉淀内容 | 来源需求 | | --- | --- | --- | | 账号与个人 | 注册、登录、忘记密码、个人资料、语言、退出 | `【贸易端】【账号】注册登录、忘记密码.md`、`【贸易端】【个人中心】...md` | | 团队与协作 | 创建团队、团队信息、角色、成员、协作团队、邀请流程变更 | `【贸易端】【团队管理】...md`、`【贸易端】【团队设置】...md` | | 工作台 | FlowSpace 列表、创建 FlowSpace、分组、订单日程、任务中心、常用视图 | `【贸易端】【工作台】...md` | | FlowSpace 设置 | 基本信息、业务角色、数据围栏、成员、协作团队、里程碑计划、标签、订单标识、取消原因 | `【贸易端】【SCCS设置】.md` | | 协作 FlowSpace 设置 | 协作团队参与 FlowSpace 后的角色、成员、权限管理 | `【贸易端】【协作SCCS设置】.md` | | 订单列表 | 订单查看、增删改、导入导出、视图设置、子表模式、工单视图、批量操作 | `【贸易端】【订单列表】*.md` | | 订单详情 | 订单详情布局、状态操作、里程碑、工单、批复、历史、跟踪、邮件协作 | `【贸易端】【订单详情】*.md` | | 订单复用 | 翻单、订单关联、里程碑互用、工单互用 | `【贸易端】【订单管理】*.md` | | 资源库 | 资源库创建、设置、数据管理、视图、分享、FlowSpace 应用、历史 | `【贸易端】【资源库】*.md` | | 自动化 | 自动化列表、触发条件、执行动作、日志、定时任务 | `【贸易端】【自动化】*.md` | | 消息与日志 | 消息中心、实时消息、设置类操作日志、系统自动日志 | `【贸易端】【消息中心】...md`、`【贸易端】【操作日志】...md` |  ### 2.3 采集端  采集端是移动执行入口，知识库中应按任务处理路径组织。  | 知识主题 | 应沉淀内容 | 来源需求 | | --- | --- | --- | | 登录 | 邮箱密码登录、忘记密码 | `【采集端】【登录】邮箱_密码登录、忘记密码.md` | | 首页 | 我的任务、团队待指派、我关注、FlowSpace 数据展示 | `【采集端】【首页】任务相关数据展示.md` | | 任务列表 | 进行中、已完成、我发起、团队指派、我关注、操作 | `【采集端】【任务列表】...md` | | 任务搜索 | 入口、搜索页规则 | `【采集端】【任务搜索页】...md` | | 任务详情 | 工单详情、工单批复详情、里程碑批复详情、订单信息 | `【采集端】【任务详情页】...md` | | 消息中心 | 首页入口、消息列表 | `【采集端】【消息中心】消息通知列表.md` | | 我的 | 个人信息、多语言、修改密码、帮助、联系成功经理、检查更新、退出账号 | `【采集端】【我的】个人中心页.md` |  ## 3. 核心业务对象  ### 3.1 用户、团队、协作团队  用户是跨团队身份，一个用户可加入多个团队；团队是贸易端业务归属单位，拥有 FlowSpace、资源库、团队角色和协作关系。协作团队不是团队的子组织，而是被主团队邀请参与业务协作的外部团队。  需要沉淀的知识点：  - 账号注册、登录、忘记密码、语言切换、退出账号。 - 首次创建团队与非首次创建团队的差异。 - 团队基础信息、角色、成员、邀请成员、未注册成员标识。 - 团队协作邀请的“我邀请的”和“邀请我的”两类视角。 - 协作团队被邀请到团队层和 FlowSpace 层后的权限差异。 - 团队角色权限与 FlowSpace 业务角色权限的边界。  ### 3.2 FlowSpace  FlowSpace 是贸易端核心业务空间，由运营端业务模板创建。一个 FlowSpace 通常包含订单主表单、多个里程碑、里程碑批复、工单采集表单、工单批复表单、成员、业务角色、协作团队、数据围栏、标签、自动化、仪表盘和资源库关联。  需要沉淀的知识点：  - FlowSpace 创建来源：运营端业务模板。 - FlowSpace 工作台展示、分组、搜索、排序和常用视图。 - FlowSpace 基本信息、编辑、删除或状态规则。 - FlowSpace 业务角色、协作方角色、成员、协作团队的配置关系。 - 数据围栏对字段、标签、订单、里程碑和工单可见性的影响。 - 里程碑计划、标签设置、订单标识、订单取消原因等更多设置。 - FlowSpace 与资源库、自动化、仪表盘、报告、外部 API 的关系。  ### 3.3 订单  订单是 FlowSpace 中的业务主实体。订单包含订单基本信息、多个里程碑、工单、批复、历史记录、动态和跟踪记录。  订单知识页应包含：  - 订单列表：概览、详情入口、视图设置、子表模式、工单视图。 - 订单新增、编辑、删除、批量编辑、状态修改。 - 订单导入、订单导出、导入记录和失败原因。 - 订单状态：进行中、已完成、已取消。 - 完成订单后的限制：订单不可编辑/取消，里程碑和工单相关操作受限。 - 取消订单后的规则：需要选择取消原因，历史订单保留取消时文本。 - 重启订单后的恢复规则。 - 订单详情结构：标题栏、左侧树、订单基本信息、里程碑信息、工单信息。 - 订单跟踪记录：记录订单和里程碑大节点操作。  ### 3.4 里程碑  里程碑是订单流程阶段。每个里程碑可包含里程碑批复和多个工单。  里程碑知识页应包含：  - 状态：未开始、进行中、已完成、已取消。 - 状态变更入口：订单详情、批量操作、自动化等。 - 计划时间、实际开始、实际完成、延迟/提前标签。 - 负责人、标签、数据围栏可见性。 - 创建工单的状态限制：仅未开始或进行中的里程碑可创建工单。 - 完成、取消、重启里程碑对工单、批复、互用的影响。 - 里程碑批复是否存在取决于运营端模板配置。 - 里程碑互用的来源、目标、取消和权限规则。  ### 3.5 工单  工单是里程碑下的具体执行任务，由工单采集和工单批复构成。一个里程碑可以有多份工单。  工单知识页应包含：  - 创建工单：最多一次创建 10 条；可复制工单；至少保留一个非隐藏表单。 - 工单名称：默认按创建顺序编号，支持修改，限制 50 字符。 - 表单权限：隐藏表单、非隐藏表单、采集人设置、未设置采集人的必填校验。 - 处理人：采集人、工单批复人、里程碑批复人；可选择成员、协作团队负责人或具体协作成员。 - 指派：协作团队负责人或有指派权限成员可将任务指派给本团队成员。 - 采集：采集人填写可编辑表单；多人并发时需要提示刷新。 - 工单批复：批复人审核采集结果。 - 终止采集：终止后不可继续采集。 - 删除工单：需受权限和状态限制。 - 动态和历史记录：记录创建、采集、批复、编辑、终止、删除等行为。  ### 3.6 资源库  资源库是团队级标准化数据池，用于管理基础数据并应用到 FlowSpace。  资源库知识页应包含：  - 资源库创建：从运营端资源库模板选择、预览、使用模板创建。 - 资源库列表：卡片、展开/收起、搜索、排序、空状态。 - 资源库设置：编辑名称、权限角色、成员、表权限。 - 资源库数据：创建、编辑、删除、查看、导入、导出、搜索、排序、批量编辑、批量下载文件。 - 资源库视图管理：不同用户或角色查看数据的视图组织方式。 - 资源库分享：单条或整表分享、密码、只读/可编辑、失效。 - FlowSpace 应用资源库：关联资源库、字段映射、引用数据、历史文本保留。 - 数据编辑历史：记录资源库数据变更，支持追溯。  ## 4. 核心流程  ### 4.1 从模板到 FlowSpace  flowchart LR A[\"运营端创建业务模板\"] --> B[\"配置主表单、里程碑、工单表单、批复表单\"] B --> C[\"配置订单标识、PDF导入、第三方数据对接、预览数据\"] C --> D[\"发布模板并设置可见范围\"] D --> E[\"贸易端模板中心选择模板\"] E --> F[\"创建 FlowSpace\"] F --> G[\"FlowSpace 设置成员、角色、数据围栏、标签、计划\"]  知识库中需要明确：模板发布前贸易端不可见；模板启用但未发布仍不可见；模板同步至 FlowSpace 属于独立能力，需要记录同步范围、冲突、已存在数据影响。  ### 4.2 从订单创建到完成  stateDiagram-v2 [*] --> 进行中: 创建订单 进行中 --> 已完成: 完成订单 进行中 --> 已取消: 取消订单 已完成 --> 进行中: 重启订单 已取消 --> 进行中: 重启订单  订单创建后进入进行中。订单完成或取消后，订单、里程碑、工单、批复的大部分编辑和处理动作被限制。重启订单将订单恢复到进行中，但需要保留历史操作记录和取消原因快照。  ### 4.3 工单采集与批复  flowchart TD A[\"创建工单\"] --> B[\"设置采集人 / 工单批复人 / 里程碑批复人\"] B --> C{\"协作团队负责人?\"} C -->|是| D[\"协作方指派具体成员\"] C -->|否| E[\"处理人直接采集\"] D --> E E --> F[\"提交采集\"] F --> G{\"需要工单批复?\"} G -->|是| H[\"工单批复\"] G -->|否| I[\"工单采集完成\"] H --> I I --> J{\"需要里程碑批复?\"} J -->|是| K[\"里程碑批复\"] J -->|否| L[\"推进里程碑状态\"] K --> L  需要单独沉淀：指派、采集、批复在订单已删除、订单已完成/取消、里程碑已完成/取消、工单已终止、工单已批复、工单已删除等状态下的限制和提示。  ### 4.4 跨团队协作  跨团队协作由两层关系组成：  - 团队层协作：主团队邀请协作团队，建立可参与业务的组织关系。 - FlowSpace 层协作：将协作团队加入具体 FlowSpace，并分配协作角色、成员、权限。  协作方在工单和批复中可能被选为“负责人/对接人”，也可能被直接选为具体成员。负责人模式需要协作团队内部再指派成员；具体成员模式则由被选中的成员直接处理。  ### 4.5 资源库引用与同步  flowchart LR A[\"运营端资源库模板\"] --> B[\"贸易端创建资源库\"] B --> C[\"维护资源库表数据\"] C --> D[\"FlowSpace 关联资源库\"] D --> E[\"订单字段引用资源库数据\"] C --> F{\"资源库数据变更\"} F --> G[\"按同步策略更新已引用字段\"] F --> H[\"历史订单保留引用快照或文本\"]  需要明确：删除资源库或资源库数据后，新订单不可再引用，被历史订单引用的数据仍需保留文本或快照。资源库同步与 FlowSpace/FlowSpace 数据互用写入需要互斥校验，避免同一字段被多来源覆盖。  ### 4.6 自动化执行  自动化由一个触发条件和多个执行动作组成。触发条件包括数据新增、数据内容变更、到达记录中的时间；执行动作包括发送通知、新增数据、更新数据。自动化只在同一订单内执行，不跨订单触发。  自动化知识页应沉淀：  - 自动化列表、启用状态、未完善设置提示。 - 触发条件的数据源、条件配置、字段选择范围。 - 执行动作的通知对象、通知渠道、标题内容拼接、附件。 - 新增工单的默认值、处理人、必填字段校验。 - 更新数据的记录范围、筛选条件、字段映射。 - 执行失败通知、执行顺序、后续动作是否继续执行。 - 执行日志列表和详情。 - 定时任务触发时的特殊执行记录。  ## 5. 权限与安全结构  权限知识库建议拆成独立章节，避免所有权限散落在页面说明中。  | 权限域 | 控制对象 | 典型权限点 | | --- | --- | --- | | 团队权限 | 团队设置、团队成员、团队角色、协作团队、资源库入口 | 创建资源库、删除资源库、资源库管理、邀请成员、设置角色 | | FlowSpace 业务权限 | 订单、里程碑、工单、批复、仪表盘、自动化 | 查看、创建、编辑、删除、状态修改、指派、采集、批复、互用、导入导出 | | 协作 FlowSpace 权限 | 协作团队在 FlowSpace 内的业务操作 | 协作方角色、协作成员、指派、处理、查看 | | 资源库权限 | 资源库设置、表数据、数据范围 | 查看、创建、编辑、删除、导入、导出、批量操作、分享 | | 数据围栏 | 订单、里程碑、工单、字段、标签 | 控制可见范围，不等于操作权限 | | 仪表盘权限 | FlowSpace 仪表盘 | 管理、查看、汇总查看 | | 报告权限 | 报告查看与管理 | 按需求中的报告权限点补充 |  权限判断建议沉淀为统一格式：  功能入口是否展示 = 角色权限 + 对象状态 + 数据围栏/数据范围 + 成员关系 提交是否成功 = 服务端再次校验权限 + 对象状态 + 数据版本 + 必填/格式规则  ## 6. 状态与限制  | 对象 | 状态 | 关键限制 | | --- | --- | --- | | 订单 | 进行中 | 可编辑、可完成、可取消，可推进里程碑和工单 | | 订单 | 已完成 | 不可编辑、不可取消；里程碑和工单处理动作受限 | | 订单 | 已取消 | 不可编辑；保留取消原因文本；可按权限重启 | | 里程碑 | 未开始 | 可创建工单；首次创建工单可变更为进行中 | | 里程碑 | 进行中 | 可创建工单、采集、批复、完成或取消 | | 里程碑 | 已完成 | 不可创建工单、不可采集/批复/指派；可按权限重启 | | 里程碑 | 已取消 | 不可创建工单、不可采集/批复/指派；可按权限重启 | | 工单 | 正常执行中 | 可采集、批复、指派、邮件协作、终止、删除，取决于权限 | | 工单 | 已终止采集 | 不可继续采集 | | 工单 | 已批复 | 采集和部分编辑动作受限 | | 自动化 | 启用 | 设置完整且满足条件时执行 | | 自动化 | 未启用 | 不执行 |  ## 7. 表单、数据与模板  表单体系是 Linkincrease 的底层配置能力，知识库需要把“运营端配置”和“贸易端/采集端运行态”对应起来。  | 主题 | 内容 | | --- | --- | | 布局组件 | 模块分组、分割线、空白占位等 | | 基础组件 | 单行文本、多行文本、数字、百分比、单选、多选、图片、附件、日期、评级、定位、地址、富文本等 | | 高级组件 | 关联引用、公式、成员单选/多选、协作方单选/多选、签名、汇率等 | | 表单属性 | 必填、限制、默认值、移动端布局、Web 布局、国际化 | | 显隐设置 | 条件展示、隐藏后的校验处理、与数据围栏的关系 | | 公式函数 | 可用函数、字段类型、系统自动更新日志 | | 验货组件 | 尺寸检验组件、组合明细、统计表、采集端应用 |  ## 8. 消息、通知与邮件协作  消息体系建议按事件源组织：  - 账号与团队事件：注册、邀请、加入、角色变更。 - FlowSpace 事件：成员变更、协作团队变更、权限变更。 - 订单事件：创建、编辑、完成、取消、重启、跟踪记录。 - 里程碑事件：状态变更、批复指派、批复提交。 - 工单事件：创建、采集指派、采集提交、批复指派、批复提交、终止、删除。 - 资源库事件：导入导出、分享、同步、数据变更。 - 自动化事件：执行成功、执行失败、定时任务触发。 - 邮件协作事件：单工单邮件协作、批量发邮件协作。  每类消息都应沉淀：触发条件、接收人、渠道、标题、正文、跳转链接、附件、是否去重、是否受屏蔽设置影响。  ## 9. 日志与审计  日志体系需要区分四类记录：  | 类型 | 记录对象 | 主要用途 | | --- | --- | --- | | 操作日志 | 团队设置、FlowSpace 设置、协作 FlowSpace 设置、资源库设置等 | 审计配置类操作 | | 动态 | 工单、里程碑批复、工单批复、采集过程 | 业务过程追踪 | | 历史记录 | 表单字段和数据编辑历史 | 数据变更追溯 | | 跟踪记录 | 订单级关键动作 | 串联订单从创建到完成的关键节点 | | 系统自动执行日志 | 公式自动更新、自动化更新、资源库同步更新 | 区分系统程序与人工操作 |  所有日志类文档建议统一字段：操作时间、操作人、操作对象、操作类型、变更前、变更后、来源模块、是否系统自动执行、关联订单/FlowSpace/资源库。  ## 10. 建议落库目录  如果后续要进一步拆分为多页知识库，建议按以下目录落地：  docs/ 00-入门/ 10-产品端/ 20-业务对象/ 30-业务流程/ 40-权限与安全/ 50-模板表单与数据/ 60-协作通知与自动化/ 70-展示分析/ 80-日志审计/ 90-来源与待办/  每个功能页建议使用统一模板：  # 功能名称  ## 1. 功能定位 ## 2. 入口与使用对象 ## 3. 核心对象 ## 4. 业务流程 ## 5. 权限规则 ## 6. 状态与限制 ## 7. 字段与表单规则 ## 8. 通知与日志 ## 9. 异常与提示 ## 10. 来源需求 ## 11. 待确认问题  ## 11. 优先补全顺序  1. 先补 `20-业务对象`：FlowSpace、订单、里程碑、工单、批复、资源库。 2. 再补 `40-权限与安全`：团队权限、FlowSpace 权限、协作方权限、资源库权限、数据围栏。 3. 再补 `30-业务流程`：订单生命周期、工单采集批复、资源库引用、自动化。 4. 最后补 `60-协作通知与自动化` 和 `80-日志审计`，把所有事件、消息、日志统一表格化。  这样可以先建立稳定的业务骨架，再逐步把每份迭代需求中的页面细节、交互提示和异常校验补进去。", "domain": "知识库管理", "module": "内容架构", "tags": "架构;内容;知识库", "sources": [{"title": "【贸易端】【个人中心】个人信息、切换语言、退出账号", "version": "v2.0.x", "product_side": "贸易端", "module": "个人中心", "last_write_time": "2026-09-04T10:48:45"}, {"title": "【贸易端】【团队管理】创建团队", "version": "v2.0.x", "product_side": "贸易端", "module": "团队管理", "last_write_time": "2026-09-04T10:48:48"}, {"title": "【贸易端】【团队设置】团队信息、角色、成员、协作团队管理", "version": "v2.0.x", "product_side": "贸易端", "module": "团队设置", "last_write_time": "2026-09-04T10:48:47"}, {"title": "【 ": "2026-09-04T10:47:43"}, {"title": "通用说明（持续更新）", "version": "common", "product_side": "公共能力", "module": "", "last_write_time": "2026-09-04T10:47:44"}]}, {"path": "06-知识库工程架构.md", "title": "知识库工程架构", "folder": ".", "text": "# 知识库工程架构  本文定义 Linkincrease 知识库的底座架构，重点回答：资料放在哪里、用什么格式、如何标注元数据、如何检索、如何更新、如何备份、如何为后续 AI/RAG 或其他知识库系统迁移做准备。  ## 1. 总体分层  flowchart TD A[\"应用层：检索、查阅、引用、离线、导出\"] --> B[\"管理层：命名、更新、权限、备份、归档\"] B --> C[\"治理层：权威、草稿、待确认、废弃、历史\"] C --> D[\"元数据层：标签、分类、版本、权限、来源、索引\"] D --> E[\"内容层：文档、表格、图片、脚本、压缩包、外部链接快照\"] E --> F[\"存储层：本地目录、轻量数据库、统一文件格式\"] G[\"自动化层：扫描、索引、校验、备份、导出\"] --> D G --> F H[\"来源追溯层：原始需求、评审记录、外部资料\"] --> D H --> E  ## 2. 内容层  内容层保存知识库中的实体资料。内容应分为“原始资料”和“知识化资料”，二者不要混放。  | 内容类型 | 说明 | 推荐格式 | 示例 | | --- | --- | --- | --- | | 知识页 | 已整理、可阅读、可复用的知识库正文 | `.md` | `04-Linkincrease完整知识库架构与内容.md` | | 原始需求 | 从所思、Teambition、会议、产品评审导出的原始材料 | `.md`、`.docx`、`.pdf` | `source:thoughts-v2-current/v2.2.x/贸易端/【贸易端】【订单详情】查看&操作.md` | | 表格资料 | 权限矩阵、字段清单、导入模板、配置表 | `.xlsx`、`.csv` | `metadata/权限矩阵.xlsx` | | 图片截图 | 原型截图、流程截图、页面截图 | `.png`、`.jpg`、`.webp` | `assets/images/order-detail.png` | | 脚本工具 | 扫描、索引、导出、检查脚本 | `.ps1`、`.py`、`.js` | `scripts/build-index.ps1` | | 压缩包 | 一次性导出包、外部资料包、历史快照 | `.zip`、`.7z` | `archive/2026-05-需求文档导出.zip` | | 外部链接快照 | 对外部文档、钉钉表格、所思链接的本地备份 | `.md`、`.pdf`、`.html` | `sources/external/权限矩阵.md` |  内容层原则：  - 原始资料保留原貌，不直接修改。 - 知识页只沉淀当前共识，不堆完整需求原文。 - 图片和附件不要散落在正文同级目录，统一放入 `assets/`。 - 外部链接必须尽量做本地快照，避免链接失效后无法追溯。  ## 3. 元数据层  元数据层用于描述每份资料的分类、状态、版本、权限和索引信息。建议每篇 Markdown 知识页使用 YAML Front Matter。  ### 3.1 知识页元数据字段  --- title: 订单-生命周期与状态规则 type: knowledge domain: 贸易端 module: 订单 submodule: 生命周期 status: authoritative version: v1.0 owner: 产品 maintainer: Daren updated_at: 2026-05-22 permission: internal tags: - 订单 - 状态机 - 权限 source_files: - source:thoughts-v2-current/v2.2.x/贸易端/【贸易端】【订单详情】查看&操作.md - source:thoughts-v2-current/v2.2.x/贸易端/【贸易端】【订单列表】订单增删改.md related_docs: - 02-核心概念词典.md - 03-功能地图.md search_keywords: - 完成订单 - 取消订单 - 重启订单 ---  ### 3.2 推荐字段说明  | 字段 | 是否必填 | 说明 | | --- | --- | --- | | `title` | 是 | 文档标题 | | `type` | 是 | `knowledge`、`source`、`metadata`、`template`、`script`、`archive` | | `domain` | 是 | 运营端、贸易端、采集端、公共能力、知识库管理 | | `module` | 是 | FlowSpace、订单、工单、资源库、自动化等 | | `submodule` | 否 | 更细分主题 | | `status` | 是 | `authoritative`、`draft`、`pending`、`deprecated`、`archived` | | `version` | 是 | 知识页版本，不等同于产品版本 | | `owner` | 否 | 业务负责人 | | `maintainer` | 否 | 文档维护人 | | `updated_at` | 是 | 最近更新日期 | | `permission` | 是 | `public`、`internal`、`restricted`、`confidential` | | `tags` | 否 | 用于检索和聚类 | | `source_files` | 是 | 原始来源文件 | | `related_docs` | 否 | 相关知识页 | | `search_keywords` | 否 | 别名、旧称、常见搜索词 |  ### 3.3 元数据台账  除文档内元数据外，建议维护集中台账：  metadata/ documents.csv          # 所有知识页清单 sources.csv            # 原始资料来源清单 tags.csv               # 标签字典 permissions.csv        # 文档权限清单 glossary.csv           # 术语索引，可由词典生成 search-index.json      # 本地检索索引  ## 4. 存储层  建议把当前根目录逐步演进为以下结构：  Linkincrease知识库/ README.md 00-知识库维护规范.md 01-产品总览.md 02-核心概念词典.md 03-功能地图.md 04-Linkincrease完整知识库架构与内容.md 05-需求文档来源台账.md 06-知识库工程架构.md 99-待办与问题池.md docs/ 00-入门/ 10-产品端/ 20-业务对象/ 30-业务流程/ 40-权限与安全/ 50-模板表单与数据/ 60-协作通知与自动化/ 70-展示分析/ 80-日志审计/ 90-来源与待办/ 最新需求源（source:thoughts-v2-current）/ sources/ external/ exported/ snapshots/ assets/ images/ files/ diagrams/ metadata/ scripts/ exports/ archive/ backups/ templates/  ### 4.1 目录职责  | 目录 | 用途 | | --- | --- | | 根目录 | 放总览、入口、核心规范和当前主干文档 | | `docs/` | 后续拆分后的正式知识页 | | `最新需求源（source:thoughts-v2-current）` | 唯一最新需求源，由所思同步脚本维护 | | `sources/` | 外部系统导出、外部链接快照、补充来源 | | `assets/` | 图片、附件、流程图、可复用素材 | | `metadata/` | 元数据台账、标签字典、索引文件 | | `scripts/` | 自动化脚本 | | `exports/` | 对外导出包，如 HTML、PDF、RAG 数据包 | | `archive/` | 历史归档、废弃资料、旧版本快照 | | `backups/` | 定期备份包 | | `templates/` | 文档模板 |  ### 4.2 轻量数据库选择  短期可以只使用 Markdown + CSV + JSON。资料量变大后，可增加轻量数据库：  | 方案 | 适用场景 | | --- | --- | | CSV | 人工维护简单台账 | | JSON | 脚本生成检索索引、关系图谱 | | SQLite | 需要本地快速检索、条件过滤、版本记录 | | DuckDB | 需要分析大量 CSV、日志和导入导出数据 |  建议先从 `metadata/documents.csv` 和 `metadata/search-index.json` 开始，不急着引入数据库。  ## 5. 管理层  管理层负责让知识库长期不乱。  ### 5.1 命名规范  | 类型 | 命名建议 | 示例 | | --- | --- | --- | | 总览类 | `编号-主题.md` | `01-产品总览.md` | | 业务对象页 | `对象-主题.md` | `订单-生命周期与状态规则.md` | | 流程页 | `流程-主题.md` | `流程-工单采集与批复.md` | | 权限页 | `权限-对象.md` | `权限-FlowSpace业务角色.md` | | 来源资料 | 保留原文件名 | `【贸易端】【订单详情】查看&操作.md` | | 图片 | `模块-场景-序号.png` | `order-detail-left-tree-01.png` | | 导出包 | `YYYY-MM-DD-主题.zip` | `2026-05-22-需求文档导出.zip` |  ### 5.2 更新机制  flowchart LR A[\"新增或变更需求\"] --> B[\"同步到 2.0需求文档 或 sources\"] B --> C[\"登记来源台账\"] C --> D[\"判断影响范围\"] D --> E[\"更新知识页\"] E --> F[\"更新元数据\"] F --> G[\"更新索引\"] G --> H[\"必要时备份和导出\"]  ### 5.3 权限划分  | 权限等级 | 说明 | 示例 | | --- | --- | --- | | `public` | 可对外或跨团队公开 | 产品介绍、公开 FAQ | | `internal` | 公司内部可见 | 大多数产品知识页 | | `restricted` | 限产品、研发、运营等特定团队 | 权限矩阵、未发布规划 | | `confidential` | 高敏感内容 | 客户资料、商业合同、账号密钥 |  原则：  - 默认 `internal`。 - 原始需求一般为 `internal` 或 `restricted`。 - 客户数据、账号密钥、生产配置不得进入普通知识库正文。 - 如果需要记录敏感信息，只记录索引和位置，不记录明文。  ### 5.4 备份策略  | 备份类型 | 频率 | 内容 | | --- | --- | --- | | 快速备份 | 每次大改前 | 根目录文档、metadata | | 日备份 | 每天或每次批量导入后 | 全量知识库 | | 月归档 | 每月 | 全量压缩包、来源快照 | | 发布快照 | 每次对外导出或交付前 | docs、metadata、exports |  备份目录建议：  backups/ 2026-05-22-before-restructure.zip 2026-05-22-after-restructure.zip  ## 6. 治理层  治理层用于区分内容可信度和生命周期。  | 状态 | 含义 | 处理方式 | | --- | --- | --- | | `authoritative` | 当前权威结论 | 可被引用、导出、用于培训 | | `draft` | 草稿 | 可协作编辑，但不作为最终口径 | | `pending` | 待确认 | 进入问题池，不写成确定结论 | | `deprecated` | 已废弃 | 保留历史，不作为当前规则 | | `archived` | 历史归档 | 只用于追溯 |  知识库首页和索引默认只展示 `authoritative` 与必要的 `draft`；`pending`、`deprecated`、`archived` 需要单独标识。  ## 7. 应用层  应用层定义知识库怎么被使用。  | 使用场景 | 实现方式 | | --- | --- | | 本地全文检索 | 使用编辑器搜索、`rg`、本地索引 JSON | | 快速查阅 | README、功能地图、概念词典、目录页 | | 引用复用 | 每页维护来源、相关文档和稳定标题 | | 离线查阅 | Markdown 原文 + 图片本地化 + 导出 HTML/PDF | | 需求追溯 | 来源台账 + `source_files` 元数据 | | 培训交付 | 从权威页导出产品手册或培训资料 | | AI/RAG 准备 | 统一 Markdown、元数据、切片、索引 |  ### 7.1 检索索引建议  本地索引可以生成 JSON：  { \"id\": \"order-lifecycle\", \"title\": \"订单-生命周期与状态规则\", \"path\": \"docs/20-业务对象与数据模型/订单-生命周期与状态规则.md\", \"domain\": \"贸易端\", \"module\": \"订单\", \"tags\": [\"订单\", \"状态\", \"权限\"], \"keywords\": [\"完成订单\", \"取消订单\", \"重启订单\"], \"updated_at\": \"2026-05-22\", \"permission\": \"internal\" }  ### 7.2 AI/RAG 切片建议  后续如果用于 RAG，建议按以下规则切片：  - 按二级标题或三级标题切片，不按固定字数硬切。 - 每个切片保留 `title`、`module`、`source_files`、`permission`。 - 权限为 `restricted` 或 `confidential` 的内容单独建索引。 - 原始需求和权威知识页分开索引，回答时优先引用权威页。  ## 8. 自动化层  自动化层用于降低维护成本。  | 脚本 | 功能 | | --- | --- | | `scan-sources` | 扫描 `最新需求源（source:thoughts-v2-current）` 和 `sources/`，生成来源清单 | | `build-documents-csv` | 提取 Markdown 元数据，生成 `documents.csv` | | `build-search-index` | 生成 `search-index.json` | | `check-links` | 检查本地链接、图片链接、外部链接 | | `check-metadata` | 检查必填元数据是否缺失 | | `backup` | 打包备份 | | `export-html` | 导出可离线浏览的 HTML | | `export-rag` | 生成 RAG 导入包 |  建议优先实现三个脚本：  1. 扫描来源文档，生成 `metadata/sources.csv`。 2. 扫描知识页，生成 `metadata/documents.csv`。 3. 生成全文检索索引 `metadata/search-index.json`。  ## 9. 来源追溯层  来源追溯层解决“这个结论从哪里来”的问题。  每条正式知识结论至少应该能追溯到以下一种来源：  - 原始需求文档。 - 评审纪要。 - 权限矩阵或配置表。 - 原型截图。 - 线上产品行为。 - 产品负责人确认记录。  来源追溯建议：  知识页正文只写当前结论 来源需求列在文末 复杂规则在来源台账中做映射 外部链接必须尽量导出本地快照 待确认内容放入问题池  ## 10. 当前缺口与下一步  当前已具备：  - 知识库入口。 - 产品总览。 - 核心概念词典。 - 功能地图。 - 完整产品知识架构。 - 需求来源台账。 - 待办与问题池。  下一步建议补齐：  1. `metadata/documents.csv`：登记所有知识页元数据。 2. `metadata/sources.csv`：登记所有原始需求来源。 3. `docs/20-业务对象与数据模型/`：拆出 FlowSpace、订单、里程碑、工单、资源库。 4. `docs/40-权限、安全与审计/`：拆出完整权限体系。 5. `scripts/`：增加扫描和索引脚本。", "domain": "知识库管理", "module": "工程架构", "tags": "元数据;存储;治理;自动化", "sources": []}, {"path": "99-待办与问题池.md", "title": "待办与问题池", "folder": ".", "text": "# 待办与问题池  本页记录尚未确认、需要拆页、需要补充来源或存在跨文档冲突的事项。  ## 1. 待拆知识页  | 优先级 | 页面 | 说明 | | --- | --- | --- | | P0 | FlowSpace-设置与成员权限 | 已创建首版：[docs/20-业务对象与数据模型/FlowSpace.md](./docs/20-业务对象与数据模型/FlowSpace.md)，后续继续拆设置与成员权限细页 | | P0 | 订单-生命周期与状态规则 | 已创建首版：[docs/20-业务对象与数据模型/订单.md](./docs/20-业务对象与数据模型/订单.md)，后续补批量操作和导入导出细节 | | P0 | 工单与批复-采集指派批复流程 | 已创建首版：[docs/20-业务对象与数据模型/工单与批复.md](./docs/20-业务对象与数据模型/工单与批复.md)，后续补完整按钮、异常和移动端差异 | | P0 | 资源库-数据管理与 FlowSpace
