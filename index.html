lowSpace、订单、工单、批复和数据分析的基础质量。运营配置模板时，应先理解客户业务，再落到表单和字段。  ## 设计原则  1. 先抽象稳定流程，再配置页面字段。 2. 主表单只放订单级或项目级主数据，不放高频过程记录。 3. 里程碑用于表达阶段，工单用于承载执行数据。 4. 批复表单用于记录处理人、结论、退回原因和确认时间。 5. 资源库引用用于复用供应商、工厂、物料、证书等主数据。 6. 子表用于明细行数据，不应用多个普通字段模拟明细。 7. 字段新增前先判断所属层级：订单、工单、批复、资源库、子表行。  ## 模板评审清单  | 检查项 | 标准 | | --- | --- | | 主表单 | 是否只有一个默认主表单，字段是否都是订单/项目级数据 | | 里程碑 | 阶段是否清晰，是否有负责人和计划时间 | | 工单表单 | 是否承载实际执行和采集数据 | | 批复表单 | 是否记录结论、处理人、退回原因和附件 | | 资源库引用 | 是否避免手填供应商、工厂、物料等主数据 | | 权限 | 是否考虑品牌方、供应商、服务商、现场人员的边界 | | 日志 | 关键变更是否能被历史记录或操作日志追溯 | | 数据分析 | 关键字段是否便于后续视图、仪表盘和报表统计 | ", "domain": "公共能力", "module": "运营支持知识", "tags": "运营支持知识;02-日常运营任务;模板配置;模板设计通用原则", "sources": []}, {"path": "docs/50-运营支持知识/02-日常运营任务/模板配置/订单管理类模板最佳实践.md", "title": "订单管理类模板最佳实践", "folder": "docs/50-运营支持知识/02-日常运营任务/模板配置", "text": "# 订单管理类模板最佳实践  订单管理类模板适合承载客户日常订单推进、供应商协同、生产进度、验货、出货和异常跟进。设计时要把订单本身、订单下的阶段任务、供应商可见范围、生产工厂引用关系拆清楚。  ## 推荐结构  | 层级 | 推荐内容 | | --- | --- | | 主表单 | 订单号、客户、供应商、产品、数量、交期、生产工厂、订单状态 | | 里程碑 | 订单确认、生产准备、生产中、验货、出货、结案 | | 工单 | 生产计划、物料确认、生产进度、验货安排、异常处理、出货资料 | | 工单批复 | 品牌方确认、跟单确认、验货结果确认 | | 资源库引用 | 供应商库、工厂库、物料库、客户库 |  ## 关键配置建议  - 生产工厂字段优先引用工厂资源库，并按供应商、准入状态、可用于订单状态过滤。 - 计划时间和负责人应配置在里程碑或工单中，用于工作台、订单日程和任务统计。 - 异常问题应形成工单或子表明细，避免只写在备注里。 - 验货和 CAP 如流程复杂，建议拆成独立 FlowSpace，并与订单建立引用关系。 - 订单状态不要只靠人工选择，能由关键工单、批复、自动化规则推导的状态应优先结构化。  ## 数据流转重点  1. 订单创建时，从供应商、工厂、产品等资源库带入基础信息。 2. 订单推进过程中，供应商只维护被授权的进度、附件、生产工厂报备等字段。 3. 验货、出货、异常、CAP 结果回写订单或资源库，成为后续风险判断依据。 4. 仪表盘按供应商、工厂、交期、订单状态、异常类型沉淀运营视图。  ## 验收要点  1. 订单创建后自动带出里程碑结构。 2. 供应商只能看到自己相关订单和被授权字段。 3. 生产工厂选择后能展示准入、验厂、CAP 风险信息。 4. 订单变更有历史记录或追踪记录。 5. 仪表盘能按供应商、工厂、状态、交期统计。", "domain": "公共能力", "module": "运营支持知识", "tags": "运营支持知识;02-日常运营任务;模板配置;订单管理类模板最佳实践", "sources": []}, {"path": "docs/50-运营支持知识/02-日常运营任务/模板配置/里程碑工单批复设置详解.md", "title": "里程碑工单批复设置详解", "folder": "docs/50-运营支持知识/02-日常运营任务/模板配置", "text": "# 里程碑工单批复设置详解  本页说明里程碑、工单、工单批复和里程碑批复的配置边界。  ## 基本关系  | 对象 | 作用 | 基数 | | --- | --- | --- | | 里程碑 | 表达订单或项目阶段 | 一个订单下多个里程碑 | | 工单 | 承载阶段下的执行任务和采集数据 | 一个里程碑下多个工单 | | 工单批复 | 审核单个工单的提交结果 | 每个工单可对应一个工单批复 | | 里程碑批复 | 审核整个里程碑阶段的结果 | 一个里程碑通常一个里程碑批复 |  ## 配置建议  - 如果每次提交都需要独立确认，用工单批复。 - 如果整个阶段完成后统一确认，用里程碑批复。 - 如果只是记录处理意见，不需要流程控制，可以用普通字段或动态评论。 - 工单批复处理人和里程碑批复处理人应在创建或触发时明确。  ## 常见误区  - 把里程碑当成任务明细使用，导致阶段过多。 - 把工单批复用于阶段总确认，导致多个工单结论难以汇总。 - 只配置批复字段，不配置处理人和通知，导致流程卡住。 ", "domain": "公共能力", "module": "运营支持知识", "tags": "运营支持知识;02-日常运营任务;模板配置;里程碑工单批复设置详解", "sources": []}, {"path": "docs/50-运营支持知识/02-日常运营任务/模板配置/验厂审核类模板配置指南.md", "title": "验厂审核类模板配置指南", "folder": "docs/50-运营支持知识/02-日常运营任务/模板配置", "text": "# 验厂审核类模板配置指南  验厂审核类模板用于品牌方、DAREN 服务商、QC 团队围绕工厂完成社会责任、质量、资质或现场审核。运营配置的重点不是“收集一份报告”，而是把审核计划、现场采集、报告结论、整改动作和工厂主数据连接起来。  ## 推荐结构  | 层级 | 推荐内容 | | --- | --- | | 主表单 | 验厂编号、工厂、供应商、审核类型、计划日期、服务商、审核状态 | | 里程碑 | 需求确认、排期、现场审核、报告提交、品牌方确认 | | 工单 | 审核计划、现场检查、问题记录、图片附件、报告上传 | | 批复 | 报告审核结论、是否通过、是否需要 CAP、退回原因 | | 资源库引用 | 工厂资源库、供应商资源库、证书/报告库 |  ## 字段建议  - 工厂字段应引用工厂资源库。 - 审核类型可配置为社会责任、质量、资质、复审、专项审核。 - 现场审核工单应支持图片、附件、签名、定位或地址。 - 报告结论应结构化，方便后续生成 CAP。 - 风险等级、审核有效期、下次复审日期应能回写工厂资源库。  ## 数据回写建议  验厂完成后，可将审核结论、最近验厂日期、报告附件、是否产生 CAP、风险等级同步回工厂资源库。订单管理流程选择生产工厂时，可以基于这些字段判断是否允许使用、是否需要提醒、是否需要品牌方二次确认。  ## 常见配置陷阱  - 只上传报告附件，没有结构化结论，后续无法统计风险。 - CAP 与验厂报告没有关联，整改闭环断裂。 - 供应商能看到品牌方内部审核意见，权限边界过宽。 - 审核有效期没有形成提醒规则，复审容易漏掉。", "domain": "公共能力", "module": "运营支持知识", "tags": "运营支持知识;02-日常运营任务;模板配置;验厂审核类模板配置指南", "sources": []}, {"path": "docs/50-运营支持知识/02-日常运营任务/模板配置/高级组件技巧.md", "title": "高级组件技巧", "folder": "docs/50-运营支持知识/02-日常运营任务/模板配置", "text": "# 高级组件技巧  本页沉淀表单高级组件在运营配置中的常见用法。  ## 关联引用  适合引用供应商、工厂、物料、客户、证书、报告等资源库数据。运营配置时要确认：  - 引用来源是否唯一。 - 是否需要按供应商、准入状态、权限范围过滤。 - 引用字段是否只展示，还是需要同步回写。  ## 公式组件  适合计算风险状态、有效期、逾期天数、CAP 未关闭数量等。配置前要确认：  - 依赖字段是否稳定。 - 触发更新时机是否明确。 - 公式结果是否会被仪表盘或自动化引用。  ## FlowSpace 成员组件  适合选择负责人、审核人、批复人、任务处理人。配置时要注意成员范围、协作方范围和离职/移除后的历史数据。  ## 子表  适合一对多明细，例如问题项、证书清单、整改项、出货批次。测试和运营都要关注新增、删除、导入导出和历史记录。 ", "domain": "公共能力", "module": "运营支持知识", "tags": "运营支持知识;02-日常运营任务;模板配置;高级组件技巧", "sources": []}, {"path": "docs/50-运营支持知识/02-日常运营任务/自动化与消息/消息中心运营技巧.md", "title": "消息中心运营技巧", "folder": "docs/50-运营支持知识/02-日常运营任务/自动化与消息", "text": "# 消息中心运营技巧  消息中心用于帮助用户及时处理任务、批复、协作、异常和系统提醒。  ## 运营配置建议  - 关键动作必须有明确接收人，例如审核人、负责人、供应商管理员。 - 消息文案应包含对象名称、任务类型、截止时间和入口。 - 对逾期任务设置多级提醒，避免只提醒一次。 - 对外部协作场景，要区分系统内消息和邮件通知。  ## 常见消息场景  | 场景 | 接收人 | | --- | --- | | 工厂申报提交 | 品牌方审核人 | | 工厂申报退回 | 供应商提交人 | | 订单工厂报备 | 品牌方跟单或审核人 | | 验厂任务派发 | DAREN 服务商或现场 QC | | CAP 逾期 | 责任人、供应商管理员、品牌方审核人 | ", "domain": "公共能力", "module": "运营支持知识", "tags": "运营支持知识;02-日常运营任务;自动化与消息;消息中心运营技巧", "sources": []}, {"path": "docs/50-运营支持知识/02-日常运营任务/自动化与消息/自动化规则配置食谱.md", "title": "自动化规则配置食谱", "folder": "docs/50-运营支持知识/02-日常运营任务/自动化与消息", "text": "# 自动化规则配置食谱  本页沉淀运营常用自动化配置场景。  ## 常用规则  | 场景 | 触发条件 | 执行动作 | | --- | --- | --- | | 工厂申报待补充 | 审核退回或资料不完整 | 通知供应商补充资料 | | 工厂准入通过 | 品牌方批复为通过 | 更新工厂资源库准入状态 | | 订单交期临近 | 距计划交期 N 天 | 通知负责人和供应商 | | CAP 逾期 | 截止日期已过且未关闭 | 通知责任人和品牌方审核人 | | 验厂报告提交 | 服务商上传报告 | 通知品牌方审核人 |  ## 配置注意  - 自动化写入字段前必须确认目标层级。 - 自动化通知前必须确认接收人范围。 - 关键状态变更要保留系统执行日志。 - 同一条件可能重复触发时，要设计去重或状态判断。 ", "domain": "公共能力", "module": "运营支持知识", "tags": "运营支持知识;02-日常运营任务;自动化与消息;自动化规则配置食谱", "sources": []}, {"path": "docs/50-运营支持知识/02-日常运营任务/自动化与消息/邮件协作配置与常见问题.md", "title": "邮件协作配置与常见问题", "folder": "docs/50-运营支持知识/02-日常运营任务/自动化与消息", "text": "# 邮件协作配置与常见问题  邮件协作适合外部人员无需完整登录系统，但需要提交资料、填写工单或补充附件的场景。  ## 适用场景  - 工厂联系人补充资质文件。 - 供应商提交生产进度或异常说明。 - 外部服务商上传验厂报告。 - 临时协作方提交整改证据。  ## 配置检查  | 项目 | 检查点 | | --- | --- | | 数据范围 | 邮件链接中是否只展示必要字段 | | 有效期 | 链接是否需要失效时间 | | 附件 | 是否允许上传附件、图片、签名 | | 通知 | 提交后是否通知品牌方或负责人 | | 历史 | 邮件填写记录是否可追溯 |  ## 常见问题  - 未收到邮件：检查邮箱、垃圾箱、发送记录、自动化执行日志。 - 链接打不开：检查链接有效期、权限和环境地址。 - 字段不可填写：检查表单属性、显隐规则和数据围栏。 ", "domain": "公共能力", "module": "运营支持知识", "tags": "运营支持知识;02-日常运营任务;自动化与消息;邮件协作配置与常见问题", "sources": []}, {"path": "docs/50-运营支持知识/02-日常运营任务/资源库运营/分享链接与外部协作安全规范.md", "title": "分享链接与外部协作安全规范", "folder": "docs/50-运营支持知识/02-日常运营任务/资源库运营", "text": "# 分享链接与外部协作安全规范  本页用于规范资源库分享、邮件协作、外部填写链接和协作团队参与方式。  ## 基本原则  1. 外部协作只开放完成任务所需的最小数据。 2. 不通过截图、转发表格替代系统权限。 3. 分享链接应关注有效期、访问范围和是否可编辑。 4. 协作团队进入 FlowSpace 前必须明确角色和数据围栏。  ## 检查清单  | 项目 | 检查点 | | --- | --- | | 链接有效期 | 是否需要过期时间 | | 数据范围 | 是否只包含必要字段和记录 | | 编辑权限 | 是否允许外部修改数据 | | 附件权限 | 是否可下载敏感资料 | | 日志追踪 | 是否能追踪外部提交或查看行为 | ", "domain": "公共能力", "module": "运营支持知识", "tags": "运营支持知识;02-日常运营任务;资源库运营;分享链接与外部协作安全规范", "sources": []}, {"path": "docs/50-运营支持知识/02-日常运营任务/资源库运营/数据导入导出操作手册.md", "title": "数据导入导出操作手册", "folder": "docs/50-运营支持知识/02-日常运营任务/资源库运营", "text": "# 数据导入导出操作手册  本页用于运营人员处理资源库、订单、工单等数据的导入导出。  ## 导入前检查  - 模板字段是否与 Excel 列一致。 - 必填字段是否完整。 - 单选、多选值是否在选项范围内。 - 日期、数字、百分比格式是否正确。 - 关联引用字段是否能匹配到资源库记录。 - 子表数据是否符合导入格式。  ## 导出前检查  - 当前账号是否有导出权限。 - 数据围栏是否影响导出范围。 - 是否需要脱敏客户、供应商、工厂信息。 - 是否包含附件或历史记录。  ## 常见失败原因  | 问题 | 可能原因 | | --- | --- | | 导入失败 | 必填缺失、格式不符、选项不存在、关联引用找不到 | | 导入成功但数据不完整 | 字段映射错误、隐藏字段未处理、权限过滤 | | 导出数据比页面少 | 数据围栏、筛选条件、权限范围不同 | | 附件丢失 | 附件字段不支持当前导入方式或文件链接不可访问 | ", "domain": "公共能力", "module": "运营支持知识", "tags": "运营支持知识;02-日常运营任务;资源库运营;数据导入导出操作手册", "sources": []}, {"path": "docs/50-运营支持知识/02-日常运营任务/资源库运营/资源库与FlowSpace同步策略.md", "title": "资源库与 FlowSpace 同步策略", "folder": "docs/50-运营支持知识/02-日常运营任务/资源库运营", "text": "# 资源库与 FlowSpace 同步策略  本页说明资源库主数据与 FlowSpace 流程数据之间如何同步。  ## 同步方向  | 方向 | 场景 | 注意事项 | | --- | --- | --- | | 资源库到 FlowSpace | 订单选择供应商、工厂、物料时带出信息 | 明确是只读引用还是复制字段 | | FlowSpace 到资源库 | 工厂准入通过后写入工厂库 | 保留审批记录和来源 FlowSpace | | FlowSpace 到 FlowSpace | 验厂报告生成 CAP 跟进 | 建议用关联字段或明确来源编号 | | 资源库状态反向影响 FlowSpace | 工厂暂停后订单侧提示风险 | 明确历史订单是否受影响 |  ## 运营建议  - 稳定资料放资源库，过程记录放 FlowSpace。 - 同步前明确来源、目标、触发条件、覆盖规则。 - 状态回写要有日志或历史记录。 - 关键结论不应只由自动化无痕更新。 ", "domain": "公共能力", "module": "运营支持知识", "tags": "运营支持知识;02-日常运营任务;资源库运营;资源库与FlowSpace同步策略", "sources": []}, {"path": "docs/50-运营支持知识/02-日常运营任务/资源库运营/资源库模板设计思路.md", "title": "资源库模板设计思路", "folder": "docs/50-运营支持知识/02-日常运营任务/资源库运营", "text": "# 资源库模板设计思路  资源库用于维护可复用主数据。外贸供应链场景中，供应商、工厂、物料、款式、证书、报告、问题项都适合资源库化。  ## 设计步骤  1. 判断数据是否会被多个 FlowSpace 或订单复用。 2. 判断数据是否有长期维护价值。 3. 判断是否需要权限、分享、历史记录和审计。 4. 设计字段、唯一标识、状态、附件、关联引用。 5. 设计与 FlowSpace 的引用和同步方式。  ## 常见资源库  | 资源库 | 核心字段 | | --- | --- | | 供应商库 | 名称、编码、等级、准入状态、联系人、关联工厂 | | 工厂库 | 名称、地址、所属供应商、准入状态、审核状态、CAP 状态 | | 物料库 | 物料编码、名称、规格、供应商、状态 | | 证书/报告库 | 类型、有效期、附件、关联工厂、审核结论 | | 问题项库 | 分类、风险等级、整改要求、适用标准 | ", "domain": "公共能力", "module": "运营支持知识", "tags": "运营支持知识;02-日常运营任务;资源库运营;资源库模板设计思路", "sources": []}, {"path": "docs/50-运营支持知识/03-业务场景案例库/业务场景总览.md", "title": "运营使用场景", "folder": "docs/50-运营支持知识/03-业务场景案例库", "text": "# 运营使用场景  本页用于帮助运营人员从外贸供应链行业场景出发，解释 Linkincrease 能解决什么问题，以及应该如何把客户业务映射到平台能力。  ## 行业问题到平台能力  | 行业问题 | 业务表现 | Linkincrease 支撑方式 | | --- | --- | --- | | 供应商与工厂资料分散 | 一级供应商清单、工厂资质、准入状态散落在 Excel、邮件和聊天记录中 | 用资源库维护供应商、工厂、资质、准入状态等主数据 | | 新工厂准入流程不可控 | 供应商提交工厂资料后，品牌方审批、补充资料、结果确认缺少统一流程 | 用 FlowSpace 设计工厂申报与准入流程，沉淀审批记录和资质附件 | | 订单生产工厂不透明 | 供应商接单后实际使用哪个工厂生产，品牌方难以及时掌握 | 在订单管理 FlowSpace 中让供应商按权限选择关联工厂，形成订单工厂报备数据 | | 未准入工厂临时使用风险高 | 订单执行中发现需要使用新工厂，但无法快速完成申报、审批、准入 | 从订单工厂报备引导到工厂申报 FlowSpace，准入通过后同步资源库 | | 社会责任验厂协同复杂 | 品牌方、供应商、工厂、DAREN 服务商之间的验厂任务、资料、审核结果难追踪 | 用独立 FlowSpace 承载验厂审核流程，工单派发给服务商和现场执行人员 | | CAP 整改闭环不完整 | 验厂报告中的改进项责任、期限、整改证据和复核结论难以闭环 | 用 CAP 跟进 FlowSpace 管理整改项、提交证据、品牌方或服务商复核 | | 管理层缺少全局视图 | 供应商数量、准入状态、订单使用工厂、验厂风险、CAP 进度无法联动分析 | 用仪表盘和报表跨资源库、订单、工单、批复汇总分析 |  ## 推荐场景方案  | 场景 | 适用客户 | 关键对象 | 方案入口 | | --- | --- | --- | --- | | 品牌方供应商与工厂准入协同 | 品牌方、采购团队、贸易公司 | 供应商、工厂、资质、准入申请、订单、验厂、CAP | [品牌方供应商与工厂准入协同方案](./外贸供应商治理/品牌方供应商与工厂准入协同方案.md) | | 订单全流程追踪 | 贸易公司、采购团队、Sourcing Agency | FlowSpace、订单、里程碑、工单、负责人、计划时间 | [订单](../../10-功能模块详情/订单.md)、[订单生命周期](../../30-业务流程与产品流程图/订单生命周期.md) | | 供应商协同管理 | 品牌方、采购团队、贸易公司 | 协作团队、数据围栏、供应商工单、邮件协作 | [多团队协同实战](./多团队协同实战.md)、[协作 FlowSpace 权限](../../40-权限、安全与审计/协作FlowSpace权限.md) | | QC 验货与整改闭环 | QC 服务商、品牌方、采购团队 | 验货工单、图片附件、签名、批复、质量异常、CAP | [品牌方 QC 验货协同方案](./品牌方QC验货协同方案.md) | | 工厂准入与审核整改 | 品牌方、贸易公司、采购团队 | 工厂、证书、审核报告、CAP、风险状态 | [工厂准入与审核整改方案](./工厂准入与审核整改方案.md) | | 出货单证收集与审批 | 贸易公司、品牌方、采购团队 | 出货计划、单证任务、附件、批复、出货状态 | [出货单证收集与审批方案](./出货单证收集与审批方案.md) | | 供应商绩效与风险看板 | 品牌方、采购团队、Sourcing Agency | 供应商、工厂、订单、验货、CAP、指标 | [供应商绩效与风险看板方案](./供应商绩效与风险看板方案.md) | | 订单异常与结案协同 | 贸易公司、品牌方、采购团队 | 订单变更、异常、索赔、结案检查 | [订单异常与结案协同方案](./订单异常与结案协同方案.md) | | 资源库标准化复用 | 贸易公司、品牌方、采购团队 | 供应商库、工厂库、物料库、款式库、证书库 | [资源库](../../10-功能模块详情/资源库.md)、[资源库引用与同步](../../30-业务流程与产品流程图/资源库引用与同步.md) |  ## 运营讲解顺序  1. 先问客户现在如何管理订单、供应商、工厂、验货、整改。 2. 区分哪些是长期主数据，哪些是流程中产生的一次性过程数据。 3. 把主数据放到资源库，把过程数据放到 FlowSpace、订单、工单和批复。 4. 用权限和数据围栏说明品牌方、供应商、工厂、服务商各自能看到什么、能填什么。 5. 用日志、历史记录、仪表盘说明过程可追溯、结果可分析。", "domain": "公共能力", "module": "运营支持知识", "tags": "运营支持知识;03-业务场景案例库;业务场景总览", "sources": []}, {"path": "docs/50-运营支持知识/03-业务场景案例库/供应商绩效与风险看板方案.md", "title": "供应商绩效与风险看板方案", "folder": "docs/50-运营支持知识/03-业务场景案例库", "text": "# 供应商绩效与风险看板方案  ## 客户现状  适用于客户已经在 Linkincrease 中沉淀了供应商、工厂、订单、验货、审核或 CAP 数据，希望进一步看供应商表现和风险的场景。常见问题是数据分散在多个 FlowSpace 和资源库中，管理层无法判断哪些供应商表现好、哪些需要复审或限制。  ## 业务目标  1. 明确供应商绩效和风险指标的管理用途。 2. 将订单、验货、审核、CAP 和资源库数据关联到供应商/工厂。 3. 形成可解释的看板，不做无法验证的黑箱评分。 4. 支持采购、质量、合规和管理层做运营动作。  ## 推荐配置  | 业务内容 | Linkincrease 配置 | | --- | --- | | 供应商/工厂主数据 | 供应商库、工厂库 | | 订单履约指标 | 订单 FlowSpace + 仪表盘 | | 质量指标 | 验货工单、质量异常、CAP | | 合规指标 | 审核 FlowSpace、证书有效期 | | 风险状态 | 资源库字段 + 人工评审 | | 改善计划 | 改善工单或 CAP | | 管理看板 | Tower 仪表盘、报告 |  ## 资源库设计  | 资源库 | 建议字段 | | --- | --- | | 供应商库 | 供应商等级、风险等级、准入状态、最近评审日期、改善状态 | | 工厂库 | 质量风险、审核状态、证书有效性、CAP 未关闭数量 | | 指标配置表 | 指标名称、口径、数据来源、责任人、刷新频率 |  ## FlowSpace / 模板设计  | 数据来源 | 建议沉淀 | | --- | --- | | 订单 FlowSpace | 准时交付、延期、异常、任务响应 | | 验货 FlowSpace | 验货结果、缺陷、复验、质量异常 | | 审核/CAP FlowSpace | 审核结果、CAP 关闭、逾期 | | 改善计划 FlowSpace | 改善措施、责任人、效果复核 |  ## 权限边界  | 角色 | 权限建议 | | --- | --- | | 管理层 | 查看汇总看板和趋势 | | 采购负责人 | 查看供应商维度绩效和改善计划 | | 质量/合规负责人 | 查看质量、审核、CAP 风险 | | 供应商 | 可选择性查看自身待改善事项，不看其他供应商 | | 产品成功/运营 | 维护指标口径和数据质量 |  ## 自动化提醒  - 证书、审核、CAP 到期或逾期提醒。 - 供应商风险等级变为高时提醒负责人。 - 改善计划到期未完成时提醒和升级。  ## 仪表盘指标  | 指标 | 用途 | | --- | --- | | 准时交付率 | 评估供应商交付稳定性 | | 验货通过率 | 评估质量稳定性 | | CAP 按期关闭率 | 评估整改执行力 | | 证书有效覆盖率 | 管理合规基础 | | 高风险供应商/工厂数 | 管理层优先关注 | | 改善计划完成率 | 评估行动效果 |  ## 上线步骤  1. 先确认看板用于什么决策。 2. 选择 3-5 个当前数据能支撑的指标。 3. 校验每个指标字段来源和权限。 4. 先做供应商/工厂维度看板。 5. 运行一个周期后再讨论综合评分和权重。  ## 验收标准  - 每个指标有口径、数据来源和责任人。 - 看板能下钻到对应订单、验货、审核或 CAP 记录。 - 风险状态变化有记录。 - 高风险事项能形成改善动作。  ## 能力边界  Linkincrease 可以做跨流程数据汇总和运营看板；复杂供应商评分模型、财务风险、产能负荷和外部数据需要先确认数据来源和产品边界。  ## 关联知识  - [供应商绩效与风险管理](../../55-外贸供应链行业知识/03-业务流程与单据/供应商绩效与风险管理.md) - [核心指标口径](../../60-数据分析支持/核心指标口径.md) - [跨 FlowSpace 数据整合实例](../04-监控与数据分析/跨FlowSpace数据整合实例.md)", "domain": "运营支持", "module": "运营支持知识", "tags": "客户方案;供应商绩效;风险;仪表盘;产品成功", "sources": []}, {"path": "docs/50-运营支持知识/03-业务场景案例库/出货单证收集与审批方案.md", "title": "出货单证收集与审批方案", "folder": "docs/50-运营支持知识/03-业务场景案例库", "text": "# 出货单证收集与审批方案  ## 客户现状  适用于贸易公司、品牌方或采购团队在订单出货前需要收集装箱资料、商业发票、装箱单、提单、原产地证、报关资料等文件，并进行内部或客户审批的场景。常见问题是资料靠邮件催，版本混乱，截止日期遗漏，出货状态和单证状态不同步。  ## 业务目标  1. 建立订单出货节点和单证任务。 2. 让供应商、工厂、货代和内部团队按责任提交资料。 3. 保留单证版本、批复和退回记录。 4. 通过看板追踪单证完整性和出货风险。  ## 推荐配置  | 业务内容 | Linkincrease 配置 | | --- | --- | | 出货计划 | 订单 FlowSpace 出货里程碑 | | 单证清单 | 单证工单或单证子表 | | 附件提交 | 附件字段、表单必填、工单提交 | | 单证审核 | 工单批复、退回原因 | | 截止提醒 | 自动化日期提醒 | | 出货看板 | 仪表盘：单证状态、逾期、出货计划 |  ## 资源库设计  | 资源库 | 建议字段 | | --- | --- | | 供应商库 | 供应商名称、联系人、默认单证责任人 | | 工厂库 | 工厂名称、联系人、出货资料提交责任 | | 单证类型库 | 单证名称、是否必需、责任方、审核方、提前天数 |  ## FlowSpace / 模板设计  | 模块 | 配置建议 | | --- | --- | | 订单主表单 | 订单号、客户、供应商、产品、计划出货日 | | 出货里程碑 | 出货批次、运输方式、截单日期、计划出货日 | | 单证工单 | 单证类型、附件、提交人、截止日、审核状态 | | 批复 | 通过、退回修改、暂缓出货 |  ## 权限边界  | 角色 | 权限建议 | | --- | --- | | 内部跟单 | 查看和催办全部订单单证 | | 供应商/工厂 | 只提交自己负责的单证和出货资料 | | 货代/服务商 | 只维护运输和提单相关资料 | | 客户/品牌方 | 只查看需其审核确认的文件 | | 管理层 | 查看出货和单证看板 |  ## 自动化提醒  - 单证截止日前提醒提交人。 - 退回修改时提醒原提交人。 - 出货日前仍有未通过单证时提醒订单负责人。 - 关键单证通过后提醒下一环节。  ## 仪表盘指标  | 指标 | 用途 | | --- | --- | | 单证未提交数 | 催办资料 | | 单证逾期数 | 识别出货风险 | | 单证一次通过率 | 评估资料质量 | | 出货计划延期数 | 管理交付风险 | | 待客户审核单证数 | 跟进客户确认 |  ## 上线步骤  1. 先确定客户必需单证清单。 2. 明确每类单证的提交人、审核人和截止日。 3. 配置订单出货里程碑和单证工单。 4. 用 2-3 个订单试跑提交、退回、通过。 5. 配置提醒和看板。 6. 将单证模板和命名规则写入 SOP。  ## 验收标准  - 每类必需单证都有责任人、截止日和状态。 - 附件版本和批复记录可追溯。 - 出货前能看出哪些单证未完成。 - 外部协作方只能看自己的任务和资料。  ## 能力边界  Linkincrease 管理单证协同、附件、审批和提醒；专业报关、清关、制裁筛查、信用证审单等需要客户或专业系统确认。  ## 关联知识  - [出货计划与单证协同](../../55-外贸供应链行业知识/03-业务流程与单据/出货计划与单证协同.md) - [订单生命周期](../../30-业务流程与产品流程图/订单生命周期.md) - [自动化配置](../../10-功能模块详情/自动化配置.md)", "domain": "运营支持", "module": "运营支持知识", "tags": "客户方案;出货;单证;审批;产品成功", "sources": []}, {"path": "docs/50-运营支持知识/03-业务场景案例库/品牌方QC验货协同方案.md", "title": "品牌方 QC 验货协同方案", "folder": "docs/50-运营支持知识/03-业务场景案例库", "text": "# 品牌方 QC 验货协同方案  ## 客户现状  适用于品牌方、贸易公司或 QC 服务商在订单执行中需要安排验货、现场采集、上传报告、确认放行和跟进质量异常的场景。典型问题是验货计划靠人工通知，现场图片和报告分散，验货结论无法和订单出货、质量异常、供应商表现联动。  ## 业务目标  1. 让验货计划、现场记录、报告和批复集中在订单流程中。 2. 让 QC、供应商、工厂和品牌方按权限协作。 3. 区分普通质量异常和需要 CAP 的正式整改闭环。 4. 形成验货进度、通过率、异常和逾期看板。  ## 推荐配置  | 业务内容 | Linkincrease 配置 | | --- | --- | | 验货计划 | 订单 FlowSpace 中增加验货里程碑 | | 现场采集 | 验货工单 + 采集端表单 + 图片/附件字段 | | 验货报告 | 工单附件或报告字段 | | 验货结论 | 工单批复或里程碑批复 | | 普通质量异常 | 异常跟进工单 | | 严重/重复/合规问题 | CAP FlowSpace 或 CAP 工单 | | 管理看板 | Tower 仪表盘：验货待办、逾期、通过率、异常关闭 |  ## 资源库设计  | 资源库 | 建议字段 | | --- | --- | | 工厂库 | 工厂名称、供应商、品类、准入状态、质量风险等级、最近验货日期 | | 供应商库 | 供应商名称、等级、联系人、质量表现、CAP 未关闭数量 | | 缺陷/问题分类库 | 缺陷类型、严重等级、责任方、是否需要 CAP |  ## FlowSpace / 模板设计  | 模块 | 配置建议 | | --- | --- | | 订单主表单 | 订单号、产品、数量、供应商、工厂、计划出货日 | | 验货里程碑 | 计划验货日、验货类型、验货员、状态 | | 验货工单 | 检查项、缺陷、照片、报告附件、结论 | | 异常跟进工单 | 问题描述、责任人、截止日、处理结果、复核结论 | | CAP 工单/FlowSpace | 根因、纠正措施、预防措施、证据、复核 |  ## 权限边界  | 角色 | 权限建议 | | --- | --- | | 品牌方质量负责人 | 查看全部验货和异常，批复结论 | | 跟单/订单负责人 | 查看订单相关验货、催办和协调 | | QC/验货员 | 只处理分派给自己的验货工单 | | 供应商/工厂 | 只查看自己订单和需整改问题，提交证据 | | 管理层 | 查看仪表盘，不参与编辑 |  ## 自动化提醒  - 验货计划日前提醒 QC 和订单负责人。 - 验货工单逾期未提交时提醒处理人。 - 异常/CAP 到期前提醒责任方。 - 严重异常或 CAP 逾期时提醒品牌方负责人。  ## 仪表盘指标  | 指标 | 用途 | | --- | --- | | 待验货订单数 | 安排 QC 资源 | | 验货逾期数 | 催办执行 | | 验货通过率 | 观察质量水平 | | 质量异常关闭周期 | 评价问题处理效率 | | CAP 未关闭数量 | 识别高风险供应商/工厂 |  ## 上线步骤  1. 选取一个订单模板和一个品类做试点。 2. 明确验货字段、缺陷分类和结论枚举。 3. 配置验货里程碑、工单、批复和权限。 4. 用 QC、供应商、品牌方三个测试账号验证。 5. 用 5-10 笔真实订单试运行。 6. 复盘字段、权限、提醒和看板后推广。  ## 验收标准  - 每个验货任务都有责任人、计划日、提交记录和结论。 - 验货报告、图片和批复可追溯。 - 供应商/工厂不能看到其他企业数据。 - 普通异常和 CAP 触发边界明确。 - 管理层能看到验货进度和异常状态。  ## 能力边界  Linkincrease 负责验货协同、证据收集、批复、提醒和看板；专业抽样规则、AQL 判定、实验室测试和完整 QMS 规则需要客户或专业系统确认。  ## 关联知识  - [QC 验货与质量异常](../../55-外贸供应链行业知识/03-业务流程与单据/QC验货与质量异常.md) - [验货组件流程](../../10-功能模块详情/验货组件流程.md) - [权限体系总表](../../40-权限、安全与审计/权限体系总表.md)", "domain": "运营支持", "module": "运营支持知识", "tags": "客户方案;QC;验货;质量异常;产品成功", "sources": []}, {"path": "docs/50-运营支持知识/03-业务场景案例库/外贸供应商治理/品牌方供应商与工厂准入协同方案.md", "title": "品牌方供应商与工厂准入协同方案", "folder": "docs/50-运营支持知识/03-业务场景案例库/外贸供应商治理", "text": "# 品牌方供应商与工厂准入协同方案  本方案面向品牌方管理一级供应商、工厂准入、订单工厂报备、社会责任验厂和 CAP 整改闭环的业务场景。它的目标是把供应商和工厂管理从分散表格升级为可配置、可协作、可追溯、可分析的低代码供应链管理模式。  ## 一句话方案  品牌方用资源库维护供应商与工厂主数据，用多个 FlowSpace 承载不同业务流程：工厂申报准入、订单工厂报备、社会责任验厂、CAP 整改跟进。流程中确认有效的数据可以同步回资源库，后续订单、验厂和整改继续引用同一套主数据。  ## 业务对象分层  | 层级 | 对象 | 建议承载方式 | 说明 | | --- | --- | --- | --- | | 主数据 | 一级供应商清单 | 资源库 | 品牌方长期维护，作为供应商身份、准入、评级、联系人、关联工厂的基础资料 | | 主数据 | 工厂清单 | 资源库 | 记录工厂基础信息、工厂资质、社会责任状态、准入状态、有效期、关联供应商 | | 主数据 | 工厂资质/证书 | 资源库或工厂资源库子表/附件字段 | 用于记录营业执照、认证、审计报告、有效期和附件 | | 流程数据 | 工厂申报流程 | FlowSpace1 | 供应商提交工厂申请，品牌方审批，确认后同步到工厂资源库 | | 流程数据 | 订单管理流程 | FlowSpace2 | 供应商在订单中选择关联工厂进行生产工厂报备，品牌方查看订单工厂生产情况 | | 流程数据 | 社会责任验厂审核 | FlowSpace3 | 品牌方发起给 DAREN 服务商或验厂团队，围绕工厂完成社会责任审核工单 | | 流程数据 | CAP 跟进 | FlowSpace4 | 根据资质报告或验厂报告中的改进项进行整改、提交证据、复核和关闭 |  ## 推荐资源库设计  ### 供应商资源库  | 字段 | 类型建议 | 用途 | | --- | --- | --- | | 供应商名称 | 单行文本 | 供应商主标识 | | 供应商编码 | 单行文本 | 与客户内部系统或历史数据对齐 | | 供应商等级 | 单选 | A/B/C 或客户自定义等级 | | 准入状态 | 单选 | 待准入、已准入、暂停、黑名单、退出 | | 供应商联系人 | 文本/成员/附件 | 业务联系人和协作联系人 | | 关联工厂 | 关联引用 | 关联工厂资源库中的工厂记录 | | 资质有效性 | 单选/公式 | 根据证书有效期、审核结论、CAP 状态辅助判断 | | 最近审核日期 | 日期 | 支持后续提醒和复审 | | 风险等级 | 单选 | 低、中、高或客户自定义 |  ### 工厂资源库  | 字段 | 类型建议 | 用途 | | --- | --- | --- | | 工厂名称 | 单行文本 | 工厂主标识 | | 工厂编码 | 单行文本 | 对接客户内部编号 | | 所属供应商 | 关联引用 | 关联供应商资源库 | | 工厂地址 | 地址/定位/文本 | 支持验厂、物流和区域分析 | | 工厂类型 | 多选 | 自有、外协、分包、指定工厂等 | | 准入状态 | 单选 | 申报中、已准入、待整改、暂停使用、禁用 | | 资质附件 | 附件 | 营业执照、认证证书、资质文件 | | 社会责任审核状态 | 单选 | 未审核、审核中、通过、待整改、不通过 | | 最近验厂日期 | 日期 | 支持复审提醒 | | CAP 未关闭数量 | 数字/公式 | 支持风险看板 | | 可用于订单 | 单选/布尔 | 控制订单报备时是否可选 |  ## FlowSpace1：工厂申报与准入流程  ### 目标  让供应商可以按品牌方要求提交工厂资料，品牌方完成资料审核、补充要求、准入确认，并将通过的数据沉淀到工厂资源库。  ### 角色  | 角色 | 权限建议 | | --- | --- | | 品牌方管理员 | 查看全部申报、审批、退回、准入确认、同步资源库 | | 品牌方审核人 | 查看分配给自己的申报和审核工单，填写审核结论 | | 一级供应商 | 创建或提交自己名下工厂申请，只查看自己相关数据 | | 工厂联系人 | 可通过协作或邮件补充资料，不应看到品牌方内部审核意见 |  ### 推荐流程  flowchart LR A[\"供应商提交工厂申报\"] --> B[\"品牌方资料初审\"] B --> C{\"资料是否完整\"} C -->|\"否\"| D[\"退回补充资料\"] D --> A C -->|\"是\"| E[\"资质审核/风险评估\"] E --> F{\"是否需要验厂\"} F -->|\"是\"| G[\"发起社会责任验厂 FlowSpace3\"] F -->|\"否\"| H[\"品牌方准入确认\"] G --> H H --> I{\"是否准入\"} I -->|\"通过\"| J[\"同步至工厂资源库\"] I -->|\"不通过\"| K[\"记录不通过原因\"]  ### 数据流转  | 阶段 | 数据写入位置 | 后续去向 | | --- | --- | --- | | 供应商提交申请 | FlowSpace1 订单主表单或申报工单 | 用于品牌方审批 | | 补充资质附件 | FlowSpace1 工单附件字段 | 审核通过后同步到工厂资源库 | | 品牌方审核意见 | FlowSpace1 工单批复或里程碑批复 | 作为准入审计依据 | | 准入结论 | FlowSpace1 批复字段 | 同步为工厂资源库的准入状态 | | 工厂基础信息 | 工厂资源库 | 后续订单管理 FlowSpace2 选择引用 |  ## FlowSpace2：订单管理与生产工厂报备  ### 目标  供应商在订单执行中按权限选择自己名下、已准入或允许申报中的工厂进行生产报备，品牌方能够按订单查看工厂使用情况和生产风险。  ### 推荐设计  | 位置 | 字段/工单 | 说明 | | --- | --- | --- | | 订单主表单 | 供应商、采购订单号、产品、交期、订单状态 | 订单主数据 | | 订单主表单或里程碑工单 | 生产工厂 | 关联引用工厂资源库，按供应商和准入状态过滤 | | 订单主表单或里程碑工单 | 是否使用未准入工厂 | 用于触发申报提醒或自动化 | | 里程碑 | 工厂报备确认 | 品牌方确认供应商选择的生产工厂 | | 工单 | 生产进度、现场照片、异常说明 | 供应商或工厂按权限提交 |  ### 数据流转  1. 品牌方或供应商创建订单，订单进入 FlowSpace2。 2. 供应商在订单中选择自己名下关联工厂。 3. 系统通过资源库引用带出工厂准入状态、资质有效期、社会责任审核状态、CAP 未关闭数量。 4. 如果工厂已准入，订单继续推进，品牌方可在订单详情、视图或仪表盘查看工厂使用情况。 5. 如果工厂未在资源库或未准入，供应商需进入 FlowSpace1 发起工厂申报。 6. FlowSpace1 准入通过后，工厂同步进资源库，FlowSpace2 订单再选择该工厂。  ### 订单内数据建议  | 数据 | 存放层级 | 原因 | | --- | --- | --- | | 订单号、产品、交期 | 订单主表单 | 订单级主数据 | | 生产工厂 | 订单字段或指定里程碑工单字段 | 如果整笔订单只有一个生产工厂，放订单主表单；如果不同批次/阶段可不同工厂，放里程碑工单 | | 工厂资质状态 | 资源库引用字段 | 避免在每个订单中重复维护 | | 生产进度 | 工单字段 | 属于过程数据，需要多次采集 | | 品牌方确认意见 | 工单批复或里程碑批复 | 需要保留审批结论和责任人 |  ## FlowSpace3：社会责任验厂审核  ### 目标  当工厂准入、复审、订单风险或品牌方要求触发社会责任审核时，品牌方可以把验厂需求发给 DAREN 服务商或验厂团队，形成可追踪的审核协同流程。  ### 推荐流程  flowchart LR A[\"品牌方发起验厂需求\"] --> B[\"DAREN服务商接收任务\"] B --> C[\"安排验厂计划\"] C --> D[\"现场审核工单\"] D --> E[\"上传报告和证据\"] E --> F[\"品牌方审核报告\"] F --> G{\"是否产生CAP\"} G -->|\"是\"| H[\"创建CAP跟进 FlowSpace4\"] G -->|\"否\"| I[\"更新工厂审核状态\"]  ### 数据流转  | 数据 | 存放层级 | 后续去向 | | --- | --- | --- | | 验厂需求 | FlowSpace3 订单主表单 | 作为一次验厂项目 | | 工厂信息 | 关联引用工厂资源库 | 保持与主数据一致 | | 审核计划 | 里程碑或工单字段 | 支持日程提醒 | | 现场审核记录 | 工单字段、图片、附件、签名 | 形成报告依据 | | 审核报告 | 工单附件或批复附件 | 同步或回填到工厂资源库 | | 审核结论 | 批复字段 | 更新工厂社会责任审核状态 |  ## FlowSpace4：CAP 整改跟进  ### 目标  将审核报告中的改进项拆成可跟踪、可提交证据、可复核关闭的整改任务。  ### 推荐数据结构  | 对象 | 字段建议 | 说明 | | --- | --- | --- | | CAP 订单主表单 | 工厂、来源报告、审核日期、责任供应商、总状态 | 一次 CAP 跟进项目 | | CAP 工单 | 问题项、风险等级、整改要求、责任人、截止日期 | 每个改进项一条或一组工单 | | 整改提交工单 | 整改说明、图片、附件、完成日期 | 供应商或工厂提交 | | 复核批复 | 复核结论、复核人、是否关闭、退回原因 | 品牌方或 DAREN 服务商确认 |  ### 数据流转  1. FlowSpace3 验厂报告形成 CAP 项。 2. CAP 项进入 FlowSpace4，可按问题项创建多个工单。 3. 供应商或工厂按权限提交整改证据。 4. 品牌方或 DAREN 服务商复核。 5. CAP 关闭后，工厂资源库更新 CAP 未关闭数量、风险等级、审核状态。 6. 未关闭 CAP 可在 FlowSpace2 订单报备时作为风险提示。  ## 跨 FlowSpace 数据关系  | 来源 | 目标 | 关系 | | --- | --- | --- | | FlowSpace1 工厂申报 | 工厂资源库 | 准入通过后同步工厂基础信息和资质 | | 工厂资源库 | FlowSpace2 订单管理 | 订单选择生产工厂时引用 | | 工厂资源库 | FlowSpace3 验厂审核 | 发起验厂时引用工厂资料 | | FlowSpace3 验厂审核 | 工厂资源库 | 审核结论和报告回写 | | FlowSpace3 验厂审核 | FlowSpace4 CAP 跟进 | 审核报告产生改进项 | | FlowSpace4 CAP 跟进 | 工厂资源库 | CAP 状态、未关闭数量、风险等级回写 | | 工厂资源库 | FlowSpace2 订单管理 | 订单执行中展示工厂风险和可用状态 |  ## 运营配置建议  1. 先建供应商资源库和工厂资源库，再设计准入、订单、验厂、CAP 四类 FlowSpace。 2. 工厂是否可用于订单，不应只靠人工判断，建议由准入状态、审核状态、CAP 状态共同决定。 3. 订单中选择工厂时，优先使用资源库关联引用，避免供应商手填工厂名称造成重复和错别字。 4. 未准入工厂不要直接进入订单生产，应该通过工厂申报流程形成准入记录。 5. DAREN 服务商参与验厂时，应作为协作团队或指定任务处理人进入 FlowSpace，而不是共享品牌方全部数据。 6. CAP 跟进要按问题项拆分责任和截止日期，避免整份报告只有一个总状态。  ## 可分析指标  | 指标 | 业务意义 | | --- | --- | | 已准入供应商数/工厂数 | 评估供应链基础资源规模 | | 待审核工厂数 | 评估品牌方准入处理压力 | | 订单使用未准入工厂次数 | 识别合规风险 | | 工厂社会责任审核通过率 | 评估供应链合规水平 | | CAP 未关闭数量 | 识别整改风险和供应商管理重点 | | CAP 平均关闭周期 | 评估整改效率 | | 高风险工厂关联订单数 | 支持品牌方优先干预 | ", "domain": "公共能力", "module": "运营支持知识", "tags": "运营支持知识;03-业务场景案例库;外贸供应商治理;品牌方供应商与工厂准入协同方案", "sources": []}, {"path": "docs/50-运营支持知识/03-业务场景案例库/外贸供应商治理/场景1：新工厂准入完整配置流程.md", "title": "场景1：新工厂准入完整配置流程", "folder": "docs/50-运营支持知识/03-业务场景案例库/外贸供应商治理", "text": "# 场景1：新工厂准入完整配置流程  ## 场景目标  品牌方需要让供应商申报可用工厂，经过资料审核、必要验厂、准入确认后，将合格工厂沉淀到资源库，供订单管理流程引用。  ## 推荐配置  | 对象 | 配置建议 | | --- | --- | | 工厂资源库 | 工厂名称、地址、所属供应商、准入状态、资质附件、审核状态、CAP 状态、可用于订单 | | 工厂申报 FlowSpace | 供应商提交申报，品牌方审核，必要时触发验厂 | | 验厂审核 FlowSpace | 服务商或审核团队执行现场审核，提交报告和结论 | | CAP FlowSpace | 对不符合项进行整改、复核和关闭 |  ## 流程  flowchart LR A[\"供应商提交工厂申报\"] --> B[\"品牌方资料初审\"] B --> C{\"资料是否完整\"} C -->|\"否\"| D[\"退回补充资料\"] D --> A C -->|\"是\"| E[\"风险评估\"] E --> F{\"是否需要验厂\"} F -->|\"是\"| G[\"发起验厂审核\"] G --> H{\"是否产生 CAP\"} H -->|\"是\"| I[\"CAP 整改闭环\"] H -->|\"否\"| J[\"准入确认\"] I --> J F -->|\"否\"| J J --> K[\"同步至工厂资源库\"]  ## 数据流转  1. 供应商在申报流程中提交工厂基础信息和资质附件。 2. 品牌方审核通过后，将稳定字段同步到工厂资源库。 3. 验厂结论、报告附件、风险等级、CAP 状态回写工厂资源库。 4. 订单流程选择生产工厂时，只允许选择满足准入条件的工厂。  ## 运营检查点  - 是否区分“申报中、已准入、待整改、暂停使用、禁用”等状态。 - 是否有未准入工厂的申报入口。 - 是否避免供应商直接修改已准入主数据。 - 是否能追溯准入依据、审核人和审核时间。", "domain": "公共能力", "module": "运营支持知识", "tags": "运营支持知识;03-业务场景案例库;外贸供应商治理;场景1：新工厂准入完整配置流程", "sources": []}, {"path": "docs/50-运营支持知识/03-业务场景案例库/外贸供应商治理/场景2：订单触发验厂的自动化配置.md", "title": "场景2：订单触发验厂的自动化配置", "folder": "docs/50-运营支持知识/03-业务场景案例库/外贸供应商治理", "text": "# 场景2：订单触发验厂的自动化配置  ## 场景目标  当订单选择的生产工厂存在审核过期、高风险、首次使用、未完成 CAP 等情况时，系统提醒品牌方，并按规则发起验厂审核流程。  ## 触发条件  | 条件 | 建议动作 | | --- | --- | | 工厂未验厂 | 创建验厂审核任务或提示品牌方确认 | | 最近验厂日期超过有效期 | 自动提醒或发起复审 | | 工厂风险等级为高 | 要求品牌方批复后才允许继续推进 | | CAP 未关闭 | 订单上展示风险提示，必要时阻断出货节点 | | 首次用于该供应商或客户订单 | 发起额外确认 |  ## 配置思路  1. 在订单主表单中引用工厂资源库。 2. 在工厂资源库中维护审核状态、最近审核日期、有效期、CAP 未关闭数量、风险等级。 3. 配置自动化规则：订单创建或生产工厂变更时读取工厂风险字段。 4. 对不同风险级别配置提醒、审批或新建验厂 FlowSpace。  ## 数据流转  flowchart LR A[\"订单选择生产工厂\"] --> B[\"读取工厂资源库风险字段\"] B --> C{\"是否触发验厂规则\"} C -->|\"否\"| D[\"订单继续推进\"] C -->|\"是\"| E[\"通知品牌方\"] E --> F[\"创建验厂审核流程\"] F --> G[\"验厂报告与结论\"] G --> H[\"回写工厂资源库\"] H --> I[\"订单风险状态更新\"]  ## 运营注意事项  - 自动创建流程前，要确认是否会产生重复验厂任务。 - 阻断规则要谨慎，优先使用“提醒 + 批复确认”，避免影响紧急订单。 - 验厂结果必须回写资源库，否则订单侧只能看到一次性流程结果。", "domain": "公共能力", "module": "运营支持知识", "tags": "运营支持知识;03-业务场景案例库;外贸供应商治理;场景2：订单触发验厂的自动化配置", "sources": []}, {"path": "docs/50-运营支持知识/03-业务场景案例库/外贸供应商治理/场景3：CAP整改闭环运营.md", "title": "场景3：CAP整改闭环运营", "folder": "docs/50-运营支持知识/03-业务场景案例库/外贸供应商治理", "text": "# 场景3：CAP整改闭环运营  ## 场景目标  CAP 用于跟进验厂报告、资质报告或订单异常中提出的改进项。运营需要确保每个问题项都有责任人、整改证据、复核结论和关闭记录。  ## 推荐对象  | 对象 | 说明 | | --- | --- | | CAP 主记录 | 关联工厂、供应商、来源报告、风险等级、整体状态 | | CAP 问题项 | 问题描述、分类、整改要求、截止日期、责任方 | | 整改工单 | 供应商或工厂提交整改说明、图片、附件 | | 复核批复 | 品牌方或服务商确认是否关闭 |  ## 标准流程  flowchart LR A[\"报告产生问题项\"] --> B[\"生成 CAP 记录\"] B --> C[\"分配整改责任人\"] C --> D[\"提交整改证据\"] D --> E[\"品牌方/服务商复核\"] E --> F{\"是否通过\"} F -->|\"否\"| G[\"退回继续整改\"] G --> D F -->|\"是\"| H[\"关闭问题项\"] H --> I[\"回写工厂风险状态\"]  ## 运营指标  - CAP 未关闭数量。 - 超期 CAP 数量。 - 高风险问题项数量。 - 供应商平均整改时长。 - 重复问题发生率。  ## 数据回写  CAP 关闭后，应回写工厂资源库的 CAP 状态、未关闭数量、最近关闭日期、风险等级变化。订单流程选择该工厂时，应能看到未关闭 CAP 对订单风险的影响。", "domain": "公共能力", "module": "运营支持知识", "tags": "运营支持知识;03-业务场景案例库;外贸供应商治理;场景3：CAP整改闭环运营", "sources": []}, {"path": "docs/50-运营支持知识/03-业务场景案例库/多团队协同实战.md", "title": "多团队协同实战", "folder": "docs/50-运营支持知识/03-业务场景案例库", "text": "# 多团队协同实战  Linkincrease 的多团队协同适合品牌方、供应商、工厂、DAREN 服务商、QC 或第三方机构共同推进同一业务对象。运营设计的核心是让不同角色在同一流程中看到该看的数据、完成该做的任务、留下可追溯记录。  ## 常见协同角色  | 角色 | 典型动作 | | --- | --- | | 品牌方 | 发起需求、审核资料、确认结果、查看全局仪表盘 | | 一级供应商 | 提交工厂、维护订单生产信息、提交整改证据 | | 工厂联系人 | 补充工厂资料、配合验厂、上传现场材料 | | DAREN 服务商 | 执行验厂、提交报告、复核整改 | | QC/现场人员 | 通过采集端提交图片、附件、定位、签名 |  ## 配置原则  - 品牌方拥有全局管理视角，供应商和工厂只看自身相关数据。 - 外部协作入口优先使用明确授权，不使用宽泛共享。 - 敏感字段如内部评分、价格、审核意见应单独控制可见性。 - 每个跨团队任务都要有负责人、截止时间、状态和通知。  ## 协同流程示例  flowchart LR A[\"品牌方发起订单\"] --> B[\"供应商维护生产信息\"] B --> C[\"工厂补充现场资料\"] C --> D[\"QC 提交验货结果\"] D --> E[\"品牌方批复\"] E --> F[\"异常进入 CAP\"] F --> G[\"服务商/供应商整改闭环\"]  ## 运营检查点  - 协作团队是否只被加入必要的 FlowSpace。 - 外部用户离职或项目结束后是否有移除机制。 - 消息通知是否覆盖关键任务节点。 - 仪表盘是否区分内部视图和客户/供应商视图。", "domain": "公共能力", "module": "运营支持知识", "tags": "运营支持知识;03-业务场景案例库;多团队协同实战", "sources": []}, {"path": "docs/50-运营支持知识/03-业务场景案例库/工厂准入与审核整改方案.md", "title": "工厂准入与审核整改方案", "folder": "docs/50-运营支持知识/03-业务场景案例库", "text": "# 工厂准入与审核整改方案  ## 客户现状  适用于品牌方、贸易公司或采购团队需要管理工厂申报、资质审核、社会责任审核、整改闭环和准入状态的场景。典型问题是工厂资料散落、审核报告难追踪、CAP 逾期没人管、准入状态和订单使用脱节。  ## 业务目标  1. 建立供应商、工厂、资质和审核报告的主数据。 2. 把工厂申报、审核、CAP 和复审拆成可追踪流程。 3. 让工厂风险状态可用于订单选择和管理看板。 4. 明确平台能力边界，避免把专业合规判断包装成系统自动结论。  ## 推荐配置  | 业务内容 | Linkincrease 配置 | | --- | --- | | 供应商/工厂档案 | 供应商库、工厂库、证书/报告库 | | 工厂申报 | 工厂准入 FlowSpace | | 社会责任审核 | 审核 FlowSpace 或审核里程碑 | | CAP 整改 | CAP FlowSpace 或 CAP 工单 | | 风险状态 | 工厂资源库字段 + 人工复核更新 | | 复审提醒 | 自动化日期提醒 | | 管理看板 | 工厂准入、审核、CAP、风险分布 |  ## 资源库设计  | 资源库 | 建议字段 | | --- | --- | | 供应商库 | 供应商编码、名称、等级、联系人、关联工厂、状态 | | 工厂库 | 工厂编码、名称、地址、所属供应商、准入状态、审核状态、风险等级、可用于订单 | | 证书/报告库 | 类型、编号、有效期、附件、关联工厂、审核结论 | | CAP 问题库 | 问题类型、等级、责任方、截止日、关闭状态 |  ## FlowSpace / 模板设计  | FlowSpace | 目标 | | --- | --- | | 工厂申报与准入 | 供应商提交工厂资料，品牌方审核并确认准入 | | 社会责任审核 | 品牌方或服务商执行审核、上传报告、形成结论 | | CAP 整改跟进 | 问题项拆分、整改证据、复核关闭 | | 订单管理 | 订单选择已准入或允许使用的工厂 |  ## 权限边界  | 角色 | 权限建议 | | --- | --- | | 品牌方管理员 | 管理全部工厂、审核和 CAP | | 品牌方审核人 | 查看分配范围内的审核任务和报告 | | 供应商 | 提交自己名下工厂资料和整改证据 | | 工厂联系人 | 只补充本工厂资料，不看品牌方内部评审 | | 审核服务商 | 只处理分派审核和复核任务 |  ## 自动化提醒  - 工厂资料待补充提醒供应商。 - 证书/报告到期前提醒品牌方和供应商。 - CAP 到期前提醒责任人，逾期提醒品牌方。 - 高风险工厂被订单引用时提醒订单负责人。  ## 仪表盘指标  | 指标 | 用途 | | --- | --- | | 待准入工厂数 | 管理审核积压 | | 审核到期工厂数 | 安排复审 | | CAP 逾期数 | 升级整改 | | 高风险工厂关联订单数 | 管控订单风险 | | 证书有效覆盖率 | 管理资质健康度 |  ## 上线步骤  1. 先清理供应商和工厂清单，定义唯一编码。 2. 建供应商库、工厂库、证书/报告字段。 3. 配置工厂准入流程和审核/CAP 流程。 4. 先用 3-5 个工厂试跑申报、审核、整改。 5. 确认工厂状态如何影响订单使用。 6. 上线复审提醒和风险看板。  ## 验收标准  - 工厂申报、审核、CAP 和状态变化可追溯。 - 供应商和工厂权限隔离。 - CAP 关闭有证据和复核记录。 - 风险状态和可用于订单字段有明确维护责任。  ## 能力边界  Linkincrease 可以承载准入、审核、整改、证据、状态和提醒；审核结论、合规等级和是否允许合作由客户或专业审核方负责。  ## 关联知识  - [社会责任审核与 CAP 整改](../../55-外贸供应链行业知识/03-业务流程与单据/社会责任审核与CAP整改.md) - [供应商开发、准入与生命周期管理](../../55-外贸供应链行业知识/03-业务流程与单据/供应商与工厂准入.md) - [品牌方供应商与工厂准入协同方案](./外贸供应商治理/品牌方供应商与工厂准入协同方案.md)", "domain": "运营支持", "module": "运营支持知识", "tags": "客户方案;工厂准入;审核;CAP;产品成功", "sources": []}, {"path": "docs/50-运营支持知识/03-业务场景案例库/订单异常与结案协同方案.md", "title": "订单异常与结案协同方案", "folder": "docs/50-运营支持知识/03-业务场景案例库", "text": "# 订单异常与结案协同方案  ## 客户现状  适用于贸易公司、品牌方或采购团队在订单执行中需要管理交期变更、质量异常、出货异常、索赔资料和结案检查的场景。常见问题是订单关键变更缺少记录，异常责任和期限不清，结案时才发现单证、验货或问题未关闭。  ## 业务目标  1. 让订单变更、异常、索赔和结案检查有记录、有责任、有复核。 2. 让普通异常、重大异常和 CAP 有清晰边界。 3. 出结案前能识别未完成任务、未关闭异常和缺失资料。 4. 管理层能看异常类型、处理周期和责任分布。  ## 推荐配置  | 业务内容 | Linkincrease 配置 | | --- | --- | | 订单变更 | 变更工单、批复、历史记录 | | 普通异常 | 异常跟进工单 | | 重大/重复质量问题 | CAP 工单或 CAP FlowSpace | | 索赔资料 | 索赔字段、附件、批复记录 | | 结案检查 | 结案里程碑/工单/视图 | | 异常看板 | Tower 仪表盘 |  ## 资源库设计  | 资源库 | 建议字段 | | --- | --- | | 异常类型库 | 类型、等级、默认责任方、是否可升级 CAP | | 供应商库 | 异常次数、索赔记录、风险状态 | | 工厂库 | 质量异常、复验记录、CAP 未关闭数量 |  ## FlowSpace / 模板设计  | 模块 | 配置建议 | | --- | --- | | 订单主表单 | 订单号、客户、供应商、工厂、交期、订单状态 | | 变更工单 | 变更类型、原值、新值、原因、影响、审批 | | 异常工单 | 异常类型、等级、责任人、期限、处理结果 | | 索赔工单 | 金额、责任方、证据附件、客户确认 | | 结案工单 | 未完成任务检查、未关闭异常、单证、验货、客户确认 |  ## 权限边界  | 角色 | 权限建议 | | --- | --- | | 订单负责人 | 管理订单异常、变更和结案 | | 品牌方/客户负责人 | 审批关键变更、索赔和结案 | | 供应商/工厂 | 只查看和处理自己责任范围内的异常 | | 质量/物流/财务 | 查看与自身专业范围相关的异常和证据 | | 管理层 | 查看异常看板和趋势 |  ## 自动化提醒  - 异常到期前提醒责任人。 - 高等级异常创建时提醒订单负责人和管理者。 - 结案前若存在未关闭异常，提醒订单负责人。 - 索赔资料待补充时提醒责任方。  ## 仪表盘指标  | 指标 | 用途 | | --- | --- | | 未关闭异常数 | 运营催办 | | 平均异常关闭周期 | 评估协同效率 | | 订单变更次数 | 评估订单稳定性 | | 索赔金额/件数 | 管理商业风险 | | 结案一次通过率 | 评估流程质量 |  ## 上线步骤  1. 梳理客户常见异常类型和升级规则。 2. 明确哪些订单字段变更需要审批。 3. 配置异常工单、变更工单和结案工单。 4. 用历史订单试跑 3 类异常。 5. 配置异常看板和结案检查视图。 6. 一个月后复盘异常分类和字段是否需要收敛。  ## 验收标准  - 每个异常有类型、责任人、期限、状态和证据。 - 关键变更有原因和审批记录。 - 结案前能识别未完成事项。 - 普通异常和 CAP 边界明确。  ## 能力边界  Linkincrease 可以承载订单异常协同、证据、批复、提醒和看板；合同责任、索赔金额、扣款和财务结算需客户专业流程确认。  ## 关联知识  - [订单变更、异常、索赔与结案](../../55-外贸供应链行业知识/03-业务流程与单据/订单变更异常索赔与结案.md) - [订单生命周期](../../30-业务流程与产品流程图/订单生命周期.md) - [工单与批复](../../10-功能模块详情/工单与批复.md)", "domain": "运营支持", "module": "运营支持知识", "tags": "客户方案;订单异常;索赔;结案;产品成功", "sources": []}, {"path": "docs/50-运营支持知识/03-业务场景案例库/订单翻单与关联实际用例.md", "title": "订单翻单与关联实际用例", "folder": "docs/50-运营支持知识/03-业务场景案例库", "text": "# 订单翻单与关联实际用例  订单翻单通常发生在客户重复采购、同款不同批次、同供应商持续生产或历史订单复用的场景。运营配置时，重点是复用历史结构，同时保留新订单的独立生命周期。  ## 适用场景  | 场景 | 配置重点 | | --- | --- | | 同款翻单 | 复用产品、供应商、工厂、关键工艺字段 | | 同供应商新批次 | 复用供应商和工厂，重新生成交期、数量、验货计划 | | 订单拆分生产 | 一个订单关联多个生产工厂或多个批次 | | 历史异常复盘 | 创建新订单时带出历史 CAP、验厂风险和质量异常 |  ## 推荐做法  1. 在订单模板中配置“关联历史订单”字段。 2. 将产品、工厂、供应商、验货报告、CAP 等作为可引用对象。 3. 翻单时只复制稳定字段，不复制状态、批复、历史工单结论。 4. 对被复制字段做人工确认，避免历史数据直接污染新订单。  ## 数据流转  flowchart LR A[\"选择历史订单\"] --> B[\"带出稳定字段\"] B --> C[\"运营/供应商确认新订单信息\"] C --> D[\"生成新订单里程碑\"] D --> E[\"引用工厂资源库风险信息\"] E --> F[\"推进生产、验货、出货\"]  ## 检查点  - 新订单是否拥有独立状态和独立工单。 - 历史异常是否作为风险提示，而不是自动变成新订单异常。 - 翻单后供应商权限是否仍按新订单范围计算。", "domain": "公共能力", "module": "运营支持知识", "tags": "运营支持知识;03-业务场景案例库;订单翻单与关联实际用例", "sources": []}, {"path": "docs/50-运营支持知识/04-监控与数据分析/Tower仪表盘配置指南.md", "title": "Tower 仪表盘配置指南", "folder": "docs/50-运营支持知识/04-监控与数据分析", "text": "# Tower 仪表盘配置指南  Tower 仪表盘用于把 FlowSpace、资源库、任务和状态转成运营可读的监控视图。运营人员不应只展示数量，而要围绕“风险、效率、交付、质量、协同”构建指标。  ## 推荐看板  | 看板 | 核心指标 | | --- | --- | | 订单交付看板 | 订单总数、延期订单、待验货、待出货、异常订单 | | 供应商治理看板 | 供应商数量、准入状态、风险等级、活跃订单数 | | 工厂风险看板 | 工厂准入状态、验厂有效期、CAP 未关闭数量 | | CAP 整改看板 | 未关闭项、超期项、高风险项、平均关闭时长 | | 运营任务看板 | 待处理任务、超期任务、按负责人统计 |  ## 配置步骤  1. 明确看板服务对象：运营、品牌方管理者、供应商协同负责人或测试验证人员。 2. 选择数据来源：订单 FlowSpace、工厂资源库、验厂 FlowSpace、CAP FlowSpace。 3. 统一状态口径：例如“延期”必须明确按计划交期还是里程碑截止日期计算。 4. 配置筛选维度：供应商、工厂、客户、订单状态、风险等级、时间范围。 5. 固定每日巡检视图，避免每次临时筛选。  ## 口径维护  指标发生变化时，应同步更新指标说明、数据来源、字段含义和更新时间。涉及业务决策的指标，必须能追溯到具体 FlowSpace 或资源库记录。", "domain": "公共能力", "module": "运营支持知识", "tags": "运营支持知识;04-监控与数据分析;Tower仪表盘配置指南", "sources": []}, {"path": "docs/50-运营支持知识/04-监控与数据分析/业务健康度每日巡检checklist.md", "title": "业务健康度每日巡检 checklist", "folder": "docs/50-运营支持知识/04-监控与数据分析", "text": "# 业务健康度每日巡检 checklist  本清单用于运营人员每日检查客户业务是否正常推进。适合客户上线初期、关键项目交付期、版本发布后观察期使用。  ## 每日巡检  | 检查项 | 关注问题 | | --- | --- | | 待处理任务 | 是否存在大量无人认领或超期任务 | | 订单交期 | 是否有临近交期但关键里程碑未完成的订单 | | 工厂准入 | 是否有订单使用未准入或高风险工厂 | | 验厂审核 | 是否有排期未确认、报告未提交、品牌方未批复 | | CAP 整改 | 是否有超期未关闭或反复退回的问题项 | | 自动化通知 | 关键提醒是否正常触发 | | 外部协作 | 供应商、工厂、服务商是否有权限异常反馈 |  ## 记录方式  - 每日记录异常数量、影响客户、责任人、处理动作和关闭时间。 - 对重复出现的问题，沉淀到问题排查手册或模板优化建议。 - 对影响配置规则的问题，更新 SOP 或模板配置指南。  ## 升级条件  以下情况应升级给产品或研发确认：  - 自动化规则按配置应触发但未触发。 - 权限配置正确但外部角色仍可见不应可见的数据。 - 数据同步后出现字段丢失、状态不一致或重复记录。 - 同类客户反复出现同一流程卡点。", "domain": "公共能力", "module": "运营支持知识", "tags": "运营支持知识;04-监控与数据分析;业务健康度每日巡检checklist", "sources": []}, {"path": "docs/50-运营支持知识/04-监控与数据分析/常用运营报表制作方法.md", "title": "常用运营报表制作方法", "folder": "docs/50-运营支持知识/04-监控与数据分析", "text": "# 常用运营报表制作方法  运营报表的价值在于稳定复用和口径一致。制作报表前，应先确定业务问题，再确定数据来源、字段口径和展示维度。  ## 常用报表  | 报表 | 数据来源 | 用途 | | --- | --- | --- | | 订单推进报表 | 订单 FlowSpace | 查看订单状态、交期风险、负责人 | | 供应商表现报表 | 供应商资源库、订单 FlowSpace | 比较交付、异常、整改效率 | | 工厂准入报表 | 工厂资源库、工厂申报 FlowSpace | 查看准入状态、审核进度 | | 验厂审核报表 | 验厂 FlowSpace | 查看排期、报告结论、服务商效率 | | CAP 整改报表 | CAP FlowSpace | 查看未关闭、超期、高风险问题 |  ## 制作步骤  1. 确认报表服务对象和使用频率。 2. 定义字段口径，尤其是状态、时间、风险等级。 3. 选择统计维度：供应商、工厂、客户、月份、负责人、业务类型。 4. 配置筛选条件和默认视图。 5. 验证报表数字是否能回溯到明细记录。  ## 维护规范  - 报表字段变更要记录原因。 - 指标口径变更要同步通知运营和客户。 - 不再使用的报表应归档，避免误用旧口径。", "domain": "公共能力", "module": "运营支持知识", "tags": "运营支持知识;04-监控与数据分析;常用运营报表制作方法", "sources": []}, {"path": "docs/50-运营支持知识/04-监控与数据分析/跨FlowSpace数据整合实例.md", "title": "跨 FlowSpace 数据整合实例", "folder": "docs/50-运营支持知识/04-监控与数据分析", "text": "# 跨 FlowSpace 数据整合实例  外贸供应链场景中，一个业务问题往往跨越多个 FlowSpace：订单、工厂申报、验厂审核、CAP 整改。运营需要把这些数据通过资源库和引用关系串起来。  ## 示例：订单工厂风险视图  | 数据来源 | 关键字段 | | --- | --- | | 订单管理 FlowSpace | 订单号、供应商、生产工厂、交期、订单状态 | | 工厂资源库 | 准入状态、风险等级、最近验厂日期、CAP 未关闭数量 | | 验厂审核 FlowSpace | 审核类型、报告结论、审核日期、服务商 | | CAP FlowSpace | 问题项、风险等级、关闭状态、截止日期 |  ## 整合逻辑  flowchart LR A[\"订单\"] --> B[\"引用生产工厂\"] B --> C[\"工厂资源库\"] C --> D[\"关联验厂记录\"] C --> E[\"关联 CAP 记录\"] D --> F[\"订单风险提示\"] E --> F  ## 运营价值  - 品牌方查看订单时可以同时看到工厂风险。 - 供应商选择工厂时可以被准入状态限制。 - 运营可以发现订单集中在哪些高风险工厂。 - CAP 未关闭时可以触发订单侧提醒或审批。  ## 注意事项  - 资源库字段应作为主数据入口，不要让每个 FlowSpace 各自维护一套工厂状态。 - 跨 FlowSpace 统计前，要先统一字段命名和状态枚举。 - 对外展示视图要剔除内部审核意见和敏感评分。", "domain": "公共能力", "module": "运营支持知识", "tags": "运营支持知识;04-监控与数据分析;跨FlowSpace数据整合实例", "sources": []}, {"path": "docs/50-运营支持知识/05-问题排查手册/数据与导入导出/Excel导入失败常见原因.md", "title": "Excel 导入失败常见原因", "folder": "docs/50-运营支持知识/05-问题排查手册/数据与导入导出", "text": "# Excel 导入失败常见原因  ## 常见原因  | 原因 | 说明 | | --- | --- | | 表头不匹配 | Excel 表头与系统字段名不一致 | | 必填字段为空 | 关键字段缺失，导致记录无法创建 | | 选项值不匹配 | 单选、多选字段的值不在系统选项内 | | 日期格式错误 | 日期时间字段格式不符合要求 | | 关联数据不存在 | 供应商、工厂、产品等引用对象无法匹配 | | 附件字段不支持直接导入 | 附件需要按系统支持方式上传 |  ## 排查步骤  1. 使用系统导出的模板重新填写。 2. 先导入 3 到 5 条样例数据验证字段。 3. 检查必填字段、选项值、日期格式和唯一编码。 4. 对关联引用字段，先确认资源库中已有目标记录。 5. 保存失败报告，逐行修复后再批量导入。  ## 运营建议  客户首次导入前，应先完成字段口径确认和小批量试导入。大批量导入必须保留原始文件和清洗后文件。", "domain": "公共能力", "module": "运营支持知识", "tags": "运营支持知识;05-问题排查手册;数据与导入导出;Excel导入失败常见原因", "sources": []}, {"path": "docs/50-运营支持知识/05-问题排查手册/数据与导入导出/资源库数据不同步.md", "title": "资源库数据不同步", "folder": "docs/50-运营支持知识/05-问题排查手册/数据与导入导出", "text": "# 资源库数据不同步  ## 常见原因  | 原因 | 说明 | | --- | --- | | 同步规则未配置 | FlowSpace 结果不会自动写入资源库 | | 触发条件未满足 | 只有审批通过、状态变更或字段完整时才同步 | | 字段映射缺失 | 流程字段和资源库字段没有对应关系 | | 重复匹配失败 | 没有唯一编码，导致无法判断新增还是更新 | | 权限不足 | 执行人无资源库写入权限 |  ## 排查步骤  1. 确认期望同步的来源 FlowSpace 和目标资源库。 2. 检查同步触发条件。 3. 检查字段映射和唯一匹配字段。 4. 对比源记录和目标资源库记录。 5. 记录不同步的具体字段和发生时间。  ## 运营建议  资源库同步必须设计唯一键，例如供应商编码、工厂编码、证书编号。没有唯一键的同步容易产生重复记录。", "domain": "公共能力", "module": "运营支持知识", "tags": "运营支持知识;05-问题排查手册;数据与导入导出;资源库数据不同步", "sources": []}, {"path": "docs/50-运营支持知识/05-问题排查手册/权限与成员管理/协作团队看不到数据.md", "title": "协作团队看不到数据", "folder": "docs/50-运营支持知识/05-问题排查手册/权限与成员管理", "text": "# 协作团队看不到数据  ## 常见原因  | 原因 | 说明 | | --- | --- | | 未加入协作团队 | 用户只在客户组织中，不在目标协作团队中 | | 未授权到 FlowSpace | 团队存在，但没有目标 FlowSpace 的访问权限 | | 数据围栏过滤 | 供应商、工厂、订单归属与用户不匹配 | | 视图筛选条件过窄 | 默认视图过滤了状态、负责人或时间范围 | | 字段权限限制 | 可见记录存在，但关键字段被隐藏 |  ## 排查步骤  1. 确认用户要看的对象：资源库记录、订单、工单、批复或仪表盘。 2. 检查用户团队、角色、协作范围。 3. 检查记录的供应商、工厂、负责人、协作团队字段。 4. 临时切换到全量视图排除筛选问题。 5. 检查字段权限，确认是否是“看得到记录但看不到内容”。  ## 记录要求  权限类问题要记录用户、角色、目标记录、期望可见范围和实际可见范围，方便后续形成权限测试矩阵。", "domain": "公共能力", "module": "运营支持知识", "tags": "运营支持知识;05-问题排查手册;权限与成员管理;协作团队看不到数据", "sources": []}, {"path": "docs/50-运营支持知识/05-问题排查手册/权限与成员管理/工单按钮灰化.md", "title": "工单按钮灰化", "folder": "docs/50-运营支持知识/05-问题排查手册/权限与成员管理", "text": "# 工单按钮灰化  ## 常见原因  | 原因 | 说明 | | --- | --- | | 当前角色无创建权限 | 用户没有该里程碑或表单的工单创建权限 | | 里程碑状态不允许 | 当前里程碑未开始、已关闭或被批复阻断 | | 模板未挂载表单 | 里程碑下没有可创建的工单表单 | | 前置批复未完成 | 工单批复或里程碑批复仍在处理中 | | 数据范围不匹配 | 协作团队用户不在该订单或 FlowSpace 授权范围内 |  ## 排查步骤  1. 确认用户角色和所在团队。 2. 检查当前 FlowSpace 模板中该里程碑是否挂载表单。 3. 查看当前订单或里程碑状态。 4. 检查是否存在未完成批复。 5. 使用同角色测试账号验证是否为个别用户权限问题。  ## 运营建议  将按钮灰化类问题沉淀为模板验收项。每次模板上线前，应分别用品牌方、供应商、服务商、现场人员角色验证按钮状态。", "domain": "公共能力", "module": "运营支持知识", "tags": "运营支持知识;05-问题排查手册;权限与成员管理;工单按钮灰化", "sources": []}, {"path": "docs/50-运营支持知识/05-问题排查手册/权限与成员管理/用户无法登录注册.md", "title": "用户无法登录注册", "folder": "docs/50-运营支持知识/05-问题排查手册/权限与成员管理", "text": "# 用户无法登录注册  ## 常见原因  | 现象 | 排查方向 | | --- | --- | | 收不到注册或邀请邮件 | 邮箱是否正确、邮件是否进垃圾箱、企业邮箱拦截 | | 登录后看不到团队 | 是否加入正确团队、是否被移除、是否使用了错误账号 | | 外部协作方无法访问 | 协作邀请是否过期、权限是否只授予到指定 FlowSpace | | 手机号或邮箱已被占用 | 是否已有历史账号，是否需要找回或合并 |  ## 排查步骤  1. 确认用户使用的邮箱、手机号、团队名称和登录环境。 2. 检查团队成员列表中是否存在该用户。 3. 检查用户是否被加入正确角色、协作团队或 FlowSpace。 4. 如涉及邮件，确认邮件服务、白名单和客户企业邮箱拦截情况。 5. 将无法复现的问题记录到客户问题处理台账。  ## 需要升级的信息  - 用户账号标识。 - 发生时间。 - 操作入口。 - 报错截图。 - 所属团队、角色和目标 FlowSpace。", "domain": "公共能力", "module": "运营支持知识", "tags": "运营支持知识;05-问题排查手册;权限与成员管理;用户无法登录注册", "sources": []}, {"path": "docs/50-运营支持知识/05-问题排查手册/模板与工单/工单无法提交采集.md", "title": "工单无法提交采集", "folder": "docs/50-运营支持知识/05-问题排查手册/模板与工单", "text": "# 工单无法提交采集  ## 常见原因  | 原因 | 说明 | | --- | --- | | 必填字段未完成 | 图片、附件、定位、签名等必填项未提交 | | 网络或附件上传失败 | 移动端弱网导致附件未完成上传 | | 工单状态已关闭 | 工单已提交、已批复或被管理员关闭 | | 账号权限不匹配 | 当前用户不是工单执行人或协作人员 | | 字段校验不通过 | 数字、日期、选项、公式字段校验失败 |  ## 排查步骤  1. 确认具体报错文案和提交入口。 2. 检查工单状态、执行人和用户权限。 3. 检查必填字段和附件上传状态。 4. 让用户保留草稿或截图，避免现场数据丢失。 5. 如为移动端问题，记录设备、系统版本、APP 版本和网络环境。  ## 运营建议  现场采集类工单要减少不必要必填项。图片、附件、定位等重字段应明确使用场景，避免现场人员无法提交。", "domain": "公共能力", "module": "运营支持知识", "tags": "运营支持知识;05-问题排查手册;模板与工单;工单无法提交采集", "sources": []}, {"path": "docs/50-运营支持知识/05-问题排查手册/模板与工单/批复流程卡住.md", "title": "批复流程卡住", "folder": "docs/50-运营支持知识/05-问题排查手册/模板与工单", "text": "# 批复流程卡住  ## 常见原因  | 原因 | 说明 | | --- | --- | | 批复人未配置 | 模板或实例中没有生成有效批复人 | | 批复人离职或无权限 | 批复人已被移除团队或无法访问记录 | | 前置工单未完成 | 批复依赖的工单未提交或被退回 | | 批复规则配置冲突 | 工单批复和里程碑批复顺序设计不清 | | 通知未触达 | 批复任务存在，但用户没有收到提醒 |  ## 排查步骤  1. 定位卡住的是工单批复还是里程碑批复。 2. 查看当前批复节点、批复人、批复状态。 3. 检查前置工单是否完成。 4. 检查批复人是否仍有访问权限。 5. 若通知未触达，转到自动化与通知排查。  ## 运营建议  批复流程应配置备用负责人或运营兜底机制。高风险客户模板上线前，需要用完整流程数据跑通一次。", "domain": "公共能力", "module": "运营支持知识", "tags": "运营支持知识;05-问题排查手册;模板与工单;批复流程卡住", "sources": []}, {"path": "docs/50-运营支持知识/05-问题排查手册/模板与工单/表单字段不显示或报错.md", "title": "表单字段不显示或报错", "folder": "docs/50-运营支持知识/05-问题排查手册/模板与工单", "text": "# 表单字段不显示或报错  ## 常见原因  | 原因 | 说明 | | --- | --- | | 字段被权限隐藏 | 当前角色无字段查看或编辑权限 | | 条件显示未满足 | 字段配置了显示条件，但前置字段值不匹配 | | 引用字段失效 | 关联资源库、字段或选项被删除或改名 | | 公式配置错误 | 公式引用不存在字段或数据类型不匹配 | | 模板版本不一致 | 当前 FlowSpace 使用旧模板，未同步最新配置 |  ## 排查步骤  1. 确认字段在哪个表单、哪个角色、哪个页面不显示。 2. 检查字段权限和条件显示规则。 3. 检查引用字段、公式字段和子表字段配置。 4. 对比模板版本和当前实例使用版本。 5. 用测试数据复现，记录触发条件。  ## 运营建议  复杂表单应建立字段清单，标注字段类型、来源、权限、显示条件和是否参与统计。模板变更后要保留版本记录。", "domain": "公共能力", "module": "运营支持知识", "tags": "运营支持知识;05-问题排查手册;模板与工单;表单字段不显示或报错", "sources": []}, {"path": "docs/50-运营支持知识/05-问题排查手册/测试常见问题FAQ.md", "title": "FAQ", "folder": "docs/50-运营支持知识/05-问题排查手册", "text": "# FAQ  本页用于沉淀运营对内和对客户解释 Linkincrease 外贸供应链方案时的常见问答。  ## 场景问答  | 问题 | 回答 | | --- | --- | | Linkincrease 是不是只做订单管理？ | 不是。订单管理是核心入口之一，但平台还支持供应商协同、工厂资源库、工厂准入、验厂审核、CAP 整改、自动化提醒、仪表盘分析和审计追溯。 | | 品牌方的一线供应商和实际生产工厂如何管理？ | 建议用供应商资源库管理一级供应商，用工厂资源库管理实际生产工厂，并通过关联字段建立供应商与工厂关系。 | | 供应商可以自己申报工厂吗？ | 可以。可以在工厂申报 FlowSpace 中开放供应商提交权限，品牌方进行资料审核和准入确认。 | | 订单里如何选择生产工厂？ | 推荐在订单字段或生产报备工单中引用工厂资源库，并按供应商、准入状态、风险状态过滤可选工厂。 | | 如果供应商要使用未准入工厂怎么办？ | 不建议直接在订单中手填。应先进入工厂申报与准入流程，品牌方确认后同步到工厂资源库，再回到订单中选择。 | | 社会责任验厂适合放在哪里？ | 建议作为独立 FlowSpace 承载。它可以引用工厂资源库，执行验厂计划、现场审核、报告提交和品牌方确认。 | | CAP 整改如何和验厂报告关联？ | 验厂报告产生的问题项可以进入 CAP 跟进 FlowSpace，每个整改项都有责任人、截止日期、证据和复核结论。 | | DAREN 服务商需要看到品牌方全部数据吗？ | 不需要。建议通过协作团队、任务指派和数据围栏，只开放验厂或 CAP 所需的数据。 | | 运营如何向客户解释资源库价值？ | 资源库不是普通表格，而是订单、工厂申报、验厂、CAP 和仪表盘都可以复用的主数据底座。 | | 为什么要拆多个 FlowSpace，而不是一个大流程？ | 工厂准入、订单管理、验厂审核、CAP 整改的生命周期、角色、权限和数据结果不同。拆开后更清晰，也更便于复用和分析。 | ", "domain": "公共能力", "module": "运营支持知识", "tags": "运营支持知识;05-问题排查手册;测试常见问题FAQ", "sources": []}, {"path": "docs/50-运营支持知识/05-问题排查手册/移动端/采集端无法登录或上传附件.md", "title": "采集端无法登录或上传附件", "folder": "docs/50-运营支持知识/05-问题排查手册/移动端", "text": "# 采集端无法登录或上传附件  ## 常见原因  | 现象 | 排查方向 | | --- | --- | | 无法登录 | 账号、密码、团队、网络、版本 | | 看不到任务 | 是否为执行人、是否加入协作团队、任务是否已关闭 | | 图片上传失败 | 网络不稳定、图片过大、权限未开启 | | 无法定位或拍照 | 手机权限未授权 | | 提交后数据缺失 | 附件未上传完成就退出页面 |  ## 排查步骤  1. 记录设备型号、系统版本、APP 版本和网络环境。 2. 确认用户账号是否可在 Web 端登录。 3. 检查用户是否为目标工单执行人或协作人员。 4. 检查相机、相册、定位权限。 5. 弱网环境下建议先减少单次上传附件数量。  ## 运营建议  现场采集前应给执行人员一页纸说明：登录入口、任务入口、必填项、附件上传完成标识、无法提交时的截图要求。", "domain": "公共能力", "module": "运营支持知识", "tags": "运营支持知识;05-问题排查手册;移动端;采集端无法登录或上传附件", "sources": []}, {"path": "docs/50-运营支持知识/05-问题排查手册/自动化与通知/自动化未触发分析.md", "title": "自动化未触发分析", "folder": "docs/50-运营支持知识/05-问题排查手册/自动化与通知", "text": "# 自动化未触发分析  ## 常见原因  | 原因 | 说明 | | --- | --- | | 触发事件不匹配 | 实际操作不是规则监听的创建、更新或状态变更 | | 条件不满足 | 字段值、状态、时间条件没有达到规则要求 | | 规则未启用 | 自动化被停用或未发布 | | 字段引用错误 | 规则引用字段被改名、删除或类型变更 | | 权限不足 | 自动化动作无法创建记录、更新字段或发送通知 |  ## 排查步骤  1. 明确期望触发的规则名称和动作。 2. 检查规则是否启用。 3. 对照触发记录的字段值和状态。 4. 查看是否有最近模板或字段变更。 5. 用一条测试记录手动复现。  ## 运营建议  自动化规则要有命名规范，例如“订单-工厂高风险-提醒品牌方”。每条规则应记录触发条件、动作、负责人和最后验证日期。", "domain": "公共能力", "module": "运营支持知识", "tags": "运营支持知识;05-问题排查手册;自动化与通知;自动化未触发分析", "sources": []}, {"path": "docs/50-运营支持知识/05-问题排查手册/自动化与通知/邮件未收到.md", "title": "邮件未收到", "folder": "docs/50-运营支持知识/05-问题排查手册/自动化与通知", "text": "# 邮件未收到  ## 常见原因  | 原因 | 说明 | | --- | --- | | 收件人邮箱错误 | 用户资料或协作邀请中的邮箱填写错误 | | 企业邮箱拦截 | 客户邮箱安全策略拦截系统邮件 | | 邮件进入垃圾箱 | 用户未检查垃圾邮件或广告邮件 | | 通知规则未触发 | 业务事件本身没有触发邮件动作 | | 用户关闭通知 | 用户个人通知设置关闭 |  ## 排查步骤  1. 确认邮件类型：注册、邀请、任务、批复、自动化通知。 2. 确认收件人邮箱和发送时间。 3. 检查对应业务事件是否已发生。 4. 让客户检查垃圾箱、拦截列表和企业邮箱网关。 5. 如多名用户同时未收到，记录时间段并升级排查。  ## 运营建议  客户上线前，应让 IT 将系统邮件域名加入白名单。关键节点不要只依赖邮件，可同时配置站内消息或任务提醒。", "domain": "公共能力", "module": "运营支持知识", "tags": "运营支持知识;05-问题排查手册;自动化与通知;邮件未收到", "sources": []}, {"path": "docs/50-运营支持知识/05-问题排查手册/问题排查总览.md", "title": "客户问题处理", "folder": "docs/50-运营支持知识/05-问题排查手册", "text": "# 客户问题处理  本页用于帮助运营人员排查外贸供应链客户在配置和使用 Linkincrease 时的常见问题。  ## 排查总路径  1. 先判断问题发生在哪个层级：资源库、FlowSpace、订单、里程碑、工单、批复、自动化、仪表盘。 2. 再判断数据来源：用户手填、资源库引用、流程审批、自动化写入、系统同步、导入数据。 3. 检查权限：用户是否属于正确团队、协作团队、FlowSpace 角色、数据围栏范围。 4. 检查状态：供应商、工厂、订单、工单、验厂、CAP 是否处于可操作状态。 5. 检查日志和历史：确认谁在什么时间改了什么数据。  ## 常见问题  | 问题 | 可能原因 | 处理建议 | | --- | --- | --- | | 供应商看不到工厂申报入口 | 未加入协作团队，或未配置创建/提交工单权限 | 检查协作 FlowSpace 权限和数据围栏 | | 订单里选不到某个工厂 | 工厂未进入资源库、未关联该供应商、准入状态不可用 | 检查工厂资源库和订单字段过滤规则 | | 工厂已申报但订单仍不能使用 | FlowSpace1 审批结论未同步资源库，或工厂状态未更新为可用 | 检查准入批复字段和资源库同步动作 | | 品牌方看不到供应商提交的资料 | 数据围栏、字段可见性或协作角色配置不正确 | 检查 FlowSpace 业务角色、协作方角色和字段权限 | | 验厂报告无法形成 CAP | 报告字段未结构化，或未配置 CAP 创建流程 | 建议把报告问题项拆成 CAP 工单字段 | | CAP 已关闭但订单仍提示高风险 | CAP 状态未回写工厂资源库，或风险公式未更新 | 检查资源库字段和公式/自动化执行日志 | | 仪表盘数据和订单列表不一致 | 指标口径、权限范围、刷新频率或数据源不同 | 对照核心指标口径和数据来源说明 |  ## 必查文档  - [FlowSpace 数据层级](../../20-业务对象与数据模型/FlowSpace数据层级.md) - [品牌方供应商与工厂准入协同方案](../03-业务场景案例库/外贸供应商治理/品牌方供应商与工厂准入协同方案.md) - [权限体系总表](../../40-权限、安全与审计/权限体系总表.md) - [历史记录与快照](../../40-权限、安全与审计/历史记录与快照.md) - [系统与集成执行日志](../../40-权限、安全与审计/系统与集成执行日志.md)", "domain": "公共能力", "module": "运营支持知识", "tags": "运营支持知识;05-问题排查手册;问题排查总览", "sources": []}, {"path": "docs/50-运营支持知识/06-运营规范与SOP/上线后30天价值复盘SOP.md", "title": "上线后 30 天价值复盘 SOP", "folder": "docs/50-运营支持知识/06-运营规范与SOP", "text": "# 上线后 30 天价值复盘 SOP  ## 目标  客户上线后 30 天内，通过真实使用数据、问题记录和客户反馈，判断方案是否跑通，并把经验沉淀为 FAQ、SOP、Skill、客户样本或产品需求候选。  ## 输入  - 上线方案和验收标准 - 试点客户、角色和业务范围 - 30 天内订单、工单、批复、自动化、仪表盘数据 - 客户反馈、群消息、问题排查记录  ## 复盘维度  | 维度 | 检查问题 | | --- | --- | | 使用范围 | 哪些角色实际使用，哪些没有使用？ | | 流程闭环 | 关键流程是否从发起到关闭跑通？ | | 数据质量 | 主数据、附件、状态、责任人是否完整？ | | 权限 | 是否出现看不到、误看到、不能操作的问题？ | | 自动化 | 提醒是否准确，是否有误触发或漏提醒？ | | 看板 | 指标是否能支持客户决策？ | | 价值 | 是否减少人工催办、提高可追溯、减少遗漏？ | | 知识沉淀 | 哪些可转成 FAQ、SOP、客户样本或需求？ |  ## 执行步骤  1. 收集 30 天内的客户反馈和问题记录。 2. 对照上线前验收标准，标记已达成、未达成和不可判断。 3. 将问题分类为配置问题、培训问题、产品能力缺口、数据质量问题、客户流程问题。 4. 输出优化清单：立即修、下周期优化、产品评审、暂不处理。 5. 将可复用内容沉淀到 `09-客户样本与方案复盘`。 6. 将稳定排查路径沉淀到 FAQ/SOP，将产品缺口进入需求池或待确认问题。  ## 输出格式  ## 客户与方案范围 ## 30 天使用情况 ## 已达成价值 ## 主要问题分类 ## 配置优化建议 ## 产品需求候选 ## 可沉淀知识资产 ## 后续跟进计划  ## 验收标准  - 至少沉淀 1 条客户样本或复盘记录。 - 至少识别 1 条可复用 FAQ、SOP、Skill 或待确认问题。 - 产品能力缺口不直接写入权威规则页，先进入需求池或待确认问题。", "domain": "运营支持", "module": "运营支持知识", "tags": "SOP;上线复盘;客户样本;价值复盘;产品成功", "sources": []}, {"path": "docs/50-运营支持知识/06-运营规范与SOP/客户访谈与方案评审SOP.md", "title": "客户访谈与方案评审 SOP", "folder": "docs/50-运营支持知识/06-运营规范与SOP", "text": "# 客户访谈与方案评审 SOP  ## 目标  帮助产品成功在输出客户方案前，先把客户行业场景、角色、对象、流程、权限、数据和能力边界问清楚，避免直接按功能清单堆方案。  ## 输入  - 客户原始诉求或会议纪要 - 客户类型、业务范围、现有工具 - 相关截图、表格、模板或历史方案 - 对应行业场景页和客户方案页  ## 执行步骤  1. 判断客户诉求属于哪个行业场景，例如准入、订单履约、验货、出货、绩效或异常结案。 2. 读取对应 `docs/55` 行业场景页，补齐专业诊断问题。 3. 区分主数据、流程数据、分析数据和客户私有规则。 4. 读取对应 `docs/50` 客户方案页，形成初步配置建议。 5. 校验产品权威页：对象、流程、权限、自动化、仪表盘和审计。 6. 标记支持度：L1 标准支持、L2 配置支持、L3 变通支持、L4 暂不支持、LX 待确认。 7. 形成方案评审稿，交由产品/实施/客户成功确认边界。  ## 访谈问题框架  | 维度 | 问题 | | --- | --- | | 业务目标 | 客户想减少什么成本、控制什么风险、看见什么结果？ | | 角色 | 谁发起、谁提交、谁审核、谁最终决策？ | | 对象 | 哪些是长期复用主数据，哪些是每次流程产生的数据？ | | 流程 | 从什么事件触发，到什么结果算完成？ | | 状态 | 有哪些状态、退回、重启、暂停、关闭规则？ | | 权限 | 外部供应商、工厂、服务商分别能看什么、填什么、改什么？ | | 指标 | 管理层用哪些指标做决策？ | | 边界 | 哪些必须客户或外部专业系统确认？ |  ## 输出格式  ## 客户背景 ## 行业场景判断 ## 当前流程与痛点 ## 主数据与流程数据 ## Linkincrease 推荐方案 ## 权限边界 ## 自动化与看板 ## 能力边界 ## 待确认问题 ## 下一步试点建议  ## 验收标准  - 方案引用了对应行业页和产品权威页。 - 没有把单个客户做法写成行业标准。 - 每个待确认能力都有责任人或确认方向。 - 客户可以理解“为什么这样配”，而不是只看到功能列表。", "domain": "运营支持", "module": "运营支持知识", "tags": "SOP;客户访谈;方案评审;能力边界;产品成功", "sources": []}, {"path": "docs/50-运营支持知识/06-运营规范与SOP/新客户上线标准流程.md", "title": "客户配置建议", "folder": "docs/50-运营支持知识/06-运营规范与SOP", "text": "# 客户配置建议  本页用于指导运营人员把外贸供应链客户的业务转成 Linkincrease 可落地配置。  ## 配置总原则  1. 先识别主数据：供应商、工厂、物料、款式、客户、证书、报告。 2. 再识别流程数据：申报、订单、验厂、整改、采集、批复。 3. 主数据进入资源库，流程数据进入 FlowSpace、订单、工单和批复。 4. 流程确认后的稳定结果再同步回资源库。 5. 权限设计必须围绕品牌方、供应商、工厂、服务商、现场执行人员的真实边界。  ## 外贸供应链客户配置顺序  | 步骤 | 配置内容 | 说明 | | --- | --- | --- | | 1 | 团队与角色 | 建品牌方团队，区分管理员、审核人、业务跟单、数据查看者 | | 2 | 协作团队 | 邀请供应商、DAREN 服务商、QC 或现场执行团队 | | 3 | 资源库模板 | 先配置供应商库、工厂库、证书/报告字段 | | 4 | 业务模板 | 配置工厂申报、订单管理、验厂审核、CAP 跟进 FlowSpace 模板 | | 5 | 权限与数据围栏 | 限制供应商只能查看和提交自己相关数据 | | 6 | 自动化与通知 | 逾期提醒、资料补充提醒、CAP 截止提醒、审核结果通知 | | 7 | 仪表盘与报表 | 准入状态、订单工厂使用、验厂结果、CAP 风险 | | 8 | 日志与历史 | 确认关键数据变更有记录，便于审计追溯 |  ## 资源库配置建议  | 资源库 | 建议字段 | 配置重点 | | --- | --- | --- | | 供应商库 | 名称、编码、等级、状态、联系人、关联工厂、风险等级 | 作为品牌方管理一级供应商的主数据 | | 工厂库 | 名称、地址、所属供应商、准入状态、资质附件、审核状态、CAP 状态 | 作为订单生产工厂选择和验厂 CAP 的基础 | | 证书/报告库 | 文件类型、有效期、来源、审核结论、关联工厂 | 如果证书和报告数量多，建议独立管理 | | 问题项库 | 问题分类、风险等级、整改要求、适用标准 | 用于 CAP 模板和验厂报告结构化 |  ## FlowSpace 配置建议  | FlowSpace | 核心目的 | 推荐设计 | | --- | --- | --- | | 工厂申报与准入 | 供应商提交工厂，品牌方审批 | 主表单记录申请，工单承载资料补充和审核，批复承载准入结论 | | 订单管理 | 管理采购订单与生产工厂报备 | 主表单记录订单，工单记录生产进度和异常，工厂字段引用工厂库 | | 社会责任验厂审核 | 品牌方发起验厂，服务商执行 | 主表单记录验厂项目，工单记录计划、现场审核、报告 | | CAP 整改跟进 | 跟进报告问题项整改 | 每个问题项形成工单，提交证据后批复关闭 |  ## 权限配置建议  | 角色 | 建议权限 | | --- | --- | | 品牌方管理员 | 全部资源库、全部 FlowSpace、模板、权限、仪表盘管理 | | 品牌方审核人 | 查看分配范围内的申报、订单、验厂、CAP，填写批复 | | 供应商管理员 | 维护自己供应商资料，提交自己名下工厂申报，查看自己相关订单 | | 工厂联系人 | 只补充自己工厂资料或提交被分配的整改证据 | | DAREN 服务商 | 查看被分配的验厂项目和 CAP 任务，不查看品牌方全部订单 | | 现场审核员/QC | 通过采集端完成现场工单、图片、附件、签名和结论提交 |  ## 关键配置检查  - 订单中的生产工厂字段是否引用工厂资源库。 - 工厂资源库是否记录准入状态、审核状态、CAP 状态。 - 供应商是否只能看到自己相关工厂和订单。 - 未准入工厂是否有清晰的申报入口。 - 验厂报告是否能产生 CAP 跟进任务。 - CAP 关闭状态是否能回到工厂资源库，供订单风险判断。 ", "domain": "公共能力", "module": "运营支持知识", "tags": "运营支持知识;06-运营规范与SOP;新客户上线标准流程", "sources": []}, {"path": "docs/50-运营支持知识/06-运营规范与SOP/模板版本管理与灰度发布规范.md", "title": "模板版本管理与灰度发布规范", "folder": "docs/50-运营支持知识/06-运营规范与SOP", "text": "# 模板版本管理与灰度发布规范  模板变更会影响后续 FlowSpace 实例、字段口径、权限和报表统计。运营不能直接在生产模板上随意调整，应建立版本、验证和发布流程。  ## 版本命名  建议使用：  `模块/客户/场景 + 版本号 + 日期 + 变更类型`  示例：  - 订单管理模板 v1.2 2026-05-29 字段优化 - 工厂准入模板 v2.0 2026-05-29 流程重构  ## 发布流程  flowchart LR A[\"收集变更需求\"] --> B[\"评估影响范围\"] B --> C[\"复制模板形成草稿版本\"] C --> D[\"配置字段、权限、自动化、仪表盘\"] D --> E[\"测试账号验收\"] E --> F{\"是否通过\"} F -->|\"否\"| D F -->|\"是\"| G[\"灰度到测试客户或新实例\"] G --> H[\"观察问题并确认发布\"]  ## 必查项  - 字段是否影响历史数据。 - 选项值是否影响报表口径。 - 权限是否影响外部协作方可见范围。 - 自动化是否会重复触发。 - 新旧模板实例是否需要迁移。  ## 变更记录  每次发布应记录变更原因、变更内容、影响模块、验证人员、发布时间、回滚方案和后续观察结果。", "domain": "公共能力", "module": "运营支持知识", "tags": "运营支持知识;06-运营规范与SOP;模板版本管理与灰度发布规范", "sources": []}, {"path": "docs/50-运营支持知识/06-运营规范与SOP/每周知识库复盘流程.md", "title": "每周知识库复盘流程", "folder": "docs/50-运营支持知识/06-运营规范与SOP", "text": "# 每周知识库复盘流程  ## 1. 目标  每周将新增需求、客户问题、配置经验、项目复盘和待确认事项转成可检索、可复用、可追溯的知识资产，避免知识停留在聊天记录、临时文档或个人经验中。  ## 2. 复盘输入  - 本周新增或修改的需求文档 - 客户问题、实施记录、售前方案和培训反馈 - 新增或修改的知识库页面 - Git 提交记录和未提交变更 - 待确认问题和来源台账  ## 3. 复盘步骤  1. 检查 Git 状态，确认没有临时目录、生成产物或无关文件进入提交。 2. 检查新增 Markdown 是否已登记到 `metadata/documents.csv`。 3. 从本周客户问题中提炼 FAQ、问题排查路径或 SOP。 4. 从本周跑通的方案中提炼 Skill 或更新现有 Skill。 5. 检查待确认问题是否有结论、责任人或状态变化。 6. 检查已上线方案是否应匿名沉淀到 `09-客户样本与方案复盘`。 7. 检查旧文档是否需要标记为 `deprecated`、`historical` 或移动到 archive。 8. 运行链接检查或静态站点生成，确认入口可访问。  ## 4. AI 复盘提示词  请帮我做 Linkincrease 知识库周复盘： 1. 检查本周新增/修改内容哪些应该补 metadata。 2. 找出可以沉淀成 FAQ、SOP、Skill 的客户问题或项目经验。 3. 检查待确认问题是否可以关闭、更新状态或补充责任人。 4. 找出可能过期、冲突或重复的知识页。 5. 检查已试点客户方案是否应进入 `09-客户样本与方案复盘`。 6. 输出建议修改清单，按 P0/P1/P2 排序。  ## 5. 验收标准  - Git 状态只包含本周需要提交的知识库变更。 - 新增页面都有 metadata。 - 至少沉淀一条 FAQ、SOP、Skill 或待确认问题处理记录。 - 已试点的客户方案至少沉淀一条匿名样本、踩坑或不可外推边界。 - 不确定内容没有写入权威规则页。 - 入口索引和相关页面链接可正常访问。  ## 6. 关联文档  - [知识库维护规范](../../../00-知识库维护规范.md) - [待确认问题](../../90-版本历史与来源治理/待确认问题.md) - [版本变更记录](../../90-版本历史与来源治理/版本变更记录.md)", "domain": "运营支持", "module": "运营支持知识", "tags": "SOP;知识库复盘;运营规范", "sources": []}, {"path": "docs/50-运营支持知识/06-运营规范与SOP/运营数据备份与清理策略.md", "title": "运营数据备份与清理策略", "folder": "docs/50-运营支持知识/06-运营规范与SOP", "text": "# 运营数据备份与清理策略  运营数据包括资源库、FlowSpace 记录、工单、批复、附件、报表和配置文档。备份与清理要兼顾客户业务连续性、审计追溯和数据最小化。  ## 备份对象  | 对象 | 建议频率 | | --- | --- | | 资源库主数据 | 上线前、批量导入前、重大变更前 | | 模板配置说明 | 每次模板发布后 | | 关键报表口径 | 指标变更前后 | | 客户上线配置清单 | 首次上线后和每次大版本调整后 | | 问题处理台账 | 每周或每月归档 |  ## 清理原则  - 不清理仍用于审计、追溯、统计的业务记录。 - 测试数据应与正式数据区分，客户上线后及时清理测试记录。 - 清理前确认是否影响报表、自动化、引用关系和历史记录。 - 外部协作成员离开项目后，应移除权限而不是删除业务记录。  ## 操作建议  1. 清理前导出影响范围内的数据。 2. 记录清理条件、数量、执行人和验证结果。 3. 对客户可见数据清理，应取得客户确认。 4. 清理后检查仪表盘和关键流程是否正常。", "domain": "公共能力", "module": "运营支持知识", "tags": "运营支持知识;06-运营规范与SOP;运营数据备份与清理策略", "sources": []}, {"path": "docs/50-运营支持知识/06-运营规范与SOP/高风险操作审批流程.md", "title": "高风险操作审批流程", "folder": "docs/50-运营支持知识/06-运营规范与SOP", "text": "# 高风险操作审批流程  高风险操作指可能影响大量客户数据、权限边界、自动化动作或生产业务推进的操作。运营人员执行前应进行评估和审批。  ## 高风险操作清单  | 操作 | 风险 | | --- | --- | | 批量导入或覆盖资源库 | 可能产生重复、错误或覆盖主数据 | | 删除字段、选项、表单 | 可能影响历史记录、报表和自动化 | | 修改权限角色 | 可能导致外部用户越权或无法协作 | | 启用自动化批量创建记录 | 可能产生大量重复任务 | | 关闭或迁移模板 | 可能影响进行中的 FlowSpace | | 删除协作团队成员 | 可能导致工单、批复无人处理 |  ## 审批流程  1. 操作人提交操作目的、范围、影响对象和预计时间。 2. 负责人确认是否影响客户生产业务。 3. 如影响外部客户，应提前通知客户或选择低峰期。 4. 执行前备份可导出的关键数据。 5. 执行后验证核心流程、权限和报表。 6. 记录操作结果和异常处理。  ## 最低记录要求  - 操作人。 - 操作时间。 - 操作范围。 - 审批人。 - 回滚方案。 - 验证结果。", "domain": "公共能力", "module": "运营支持知识", "tags": "运营支持知识;06-运营规范与SOP;高风险操作审批流程", "sources": []}, {"path": "docs/50-运营支持知识/07-资料库/产品功能更新日志（运营视角）.md", "title": "产品功能更新日志（运营视角）", "folder": "docs/50-运营支持知识/07-资料库", "text": "# 产品功能更新日志（运营视角）  本页用于从运营视角记录产品能力变化，帮助运营判断客户配置、培训材料、SOP 和问题排查手册是否需要同步更新。  ## 记录模板  | 日期 | 功能变化 | 影响模块 | 运营影响 | 是否需要更新资料 | | --- | --- | --- | --- | --- | | 2026-05-29 | 运营支持知识结构优化 | 知识库 | 运营资料按上手、配置、场景、排查、SOP 重组 | 是 |  ## 运营关注点  - 新能力是否会改变客户配置建议。 - 字段、权限、状态、自动化是否影响既有模板。 - 是否需要补充测试验收标准。 - 是否需要更新培训材料和 FAQ。 - 是否需要在仪表盘中增加新指标。  ## 维护规范  每次产品版本发布后，运营应至少检查一次本页，并将影响沉淀到对应的模板指南、问题排查或 SOP 文档中。", "domain": "公共能力", "module": "运营支持知识", "tags": "运营支持知识;07-资料库;产品功能更新日志（运营视角）", "sources": []}, {"path": "docs/50-运营支持知识/07-资料库/外部培训资料链接汇总.md", "title": "外部培训资料链接汇总", "folder": "docs/50-运营支持知识/07-资料库", "text": "# 外部培训资料链接汇总  本页用于汇总可对外使用的培训资料、演示材料和客户交付材料。公开站点中只记录可分享内容，不记录内部敏感链接、私有 Token 或个人本地路径。  ## 资料分类  | 分类 | 适用对象 | 内容建议 | | --- | --- | --- | | 新客户培训 | 客户管理员、运营负责人 | 产品概览、角色权限、模板配置、仪表盘 | | 供应商培训 | 外部供应商 | 登录、订单协同、工厂申报、资料提交 | | 工厂/现场人员培训 | 工厂联系人、QC | 采集端登录、工单提交、附件上传 | | 管理层汇报 | 品牌方管理者 | 供应商治理、工厂风险、订单交付、CAP 闭环 |  ## 收录规范  - 资料名称要能看出主题和版本。 - 标注适用角色、适用客户、更新时间和维护人。 - 过期资料要归档，不应继续作为培训入口。 - 对外资料应避免出现内部测试地址、账号、个人路径和未确认功能。  ## 待补充  后续可将官网介绍、客户演示脚本、行业场景方案、培训视频链接按客户类型继续补齐。", "domain": "公共能力", "module": "运营支持知识", "tags": "运营支持知识;07-资料库;外部培训资料链接汇总", "sources": []}, {"path": "docs/50-运营支持知识/07-资料库/运营常用脚本工具.md", "title": "运营常用脚本工具", "folder": "docs/50-运营支持知识/07-资料库", "text": "# 运营常用脚本工具  本页用于记录运营在知识库维护、站点生成、数据检查中常用的本地脚本和命令。公开站点中不要写入个人本地路径、账号、Token 或客户敏感数据。  ## 知识库站点  | 用途 | 命令 | | --- | --- | | 生成静态站点 | `python scripts/build_static_site.py` | | 检查敏感信息 | 使用搜索工具检查本地盘符、访问令牌前缀、客户敏感词等不应公开发布的内容 | | 查看 Git 状态 | `git status --short` |  ## 文档维护  | 用途 | 建议 | | --- | --- | | 新增文档 | 放入对应编号目录，并更新入口页或索引页 | | 删除旧文档 | 同步清理 metadata 和站点索引 | | Mermaid 图表 | 保留源码，并在站点中使用预览能力查看大图 | | 来源说明 | 写业务来源和确认状态，不写个人电脑路径 |  ## 安全提醒  - 不要把 Personal Access Token 写入文档、脚本或提交记录。 - 不要把客户内部文件路径写入公开站点。 - 公开站点只发布已脱敏、可共享的知识内容。", "domain": "公共能力", "module": "运营支持知识", "tags": "运营支持知识;07-资料库;运营常用脚本工具", "sources": []}, {"path": "docs/50-运营支持知识/08-工作技能/FlowSpace与资源库模板设计.md", "title": "Skill：FlowSpace 与资源库模板设计", "folder": "docs/50-运营支持知识/08-工作技能", "text": "# Skill：FlowSpace 与资源库模板设计  ## 适用场景  将客户稳定主数据和重复业务流程设计成资源库模板、业务模板、FlowSpace、里程碑、工单、批复和自动化时使用。  ## 输入  - 业务场景和流程节点 - 稳定主数据对象 - 需要采集、审批、同步和统计的字段 - 内外部角色和权限边界 - 是否需要移动端采集、附件、图片、批量导入导出或报表  ## 必读知识页  - [FlowSpace 数据层级](../../20-业务对象与数据模型/FlowSpace数据层级.md) - [资源库模板](../../20-业务对象与数据模型/资源库模板.md) - [业务模板](../../20-业务对象与数据模型/业务模板.md) - [字段、组件、子表、引用关系](../../20-业务对象与数据模型/字段、组件、子表、引用关系.md) - [模板设计通用原则](../02-日常运营任务/模板配置/模板设计通用原则.md)  ## 执行步骤  1. 区分稳定主数据和流程过程数据。 2. 将供应商、工厂、产品、证书、报告等稳定对象放入资源库。 3. 将订单履约、工厂准入、验厂、QC、CAP 等重复流程设计成业务模板。 4. 为每个流程阶段设计里程碑、工单、批复和状态限制。 5. 设计字段来源、引用关系、写回规则、自动化和日志。 6. 校验角色权限、外部协作和数据围栏。 7. 输出模板验收清单和试点数据清单。  ## 输出格式  ## 业务目标 ## 资源库设计 ## FlowSpace / 业务模板设计 ## 里程碑、工单与批复 ## 字段与数据流转 ## 权限与数据围栏 ## 自动化与通知 ## 仪表盘与报表 ## 验收清单 ## 风险与待确认  ## 验收标准  - 主数据和流程数据边界清楚。 - 每个字段知道来源、写入位置和是否可更新。 - 外部协作对象只能看到应看到的数据。 - 配置方案能支持试点数据跑通。  ## 常见坑  - 把一次性流程做成资源库字段，导致主数据膨胀。 - 把稳定主数据重复放进每个订单，后续同步困难。 - 自动化写入和资源库同步写入同一字段时未定义优先级。  ## 关联文档  - [资源库与 FlowSpace 同步策略](../02-日常运营任务/资源库运营/资源库与FlowSpace同步策略.md) - [里程碑工单批复设置详解](../02-日常运营任务/模板配置/里程碑工单批复设置详解.md)", "domain": "运营支持", "module": "运营支持知识", "tags": "Skill;工作技能;产品成功;AI协作", "sources": []}, {"path": "docs/50-运营支持知识/08-工作技能/README.md", "title": "08 工作技能", "folder": "docs/50-运营支持知识/08-工作技能", "text": "# 08 工作技能  本目录沉淀面向产品成功、实施配置、运营支持和需求设计的可复用工作 Skill。Skill 不是产品规则本身，而是把一次次跑通的工作方法整理成可复用流程，供人和 AI Agent 在相似任务中调用。  ## Skill 列表  | Skill | 适用场景 | | --- | --- | | [客户场景诊断](./客户场景诊断.md) | 客户描述模糊、只说想提效或想管理供应链时，用于还原业务问题并映射平台能力 | | [新客户上线方案](./新客户上线方案.md) | 为品牌方、贸易公司、采购团队、QC 服务商等客户设计上线计划 | | [需求文档入库](./需求文档入库.md) | 将新需求、评审结论或来源文档同步进知识库 | | [权限与数据可见问题排查](./权限与数据可见问题排查.md) | 用户看不到数据、按钮灰化、无法操作或协作团队权限异常 | | [FlowSpace 与资源库模板设计](./FlowSpace与资源库模板设计.md) | 将客户业务流程拆成资源库、业务模板、里程碑、工单和批复 | | [运营专业方案设计](./运营专业方案设计.md) | 基于外贸供应链专业场景和 Linkincrease 能力映射输出客户方案 |  ## 使用原则  1. 先判断任务是否匹配 Skill 的适用场景。 2. 执行前先阅读 Skill 中列出的必读知识页。 3. Skill 输出的是工作方法和交付结构，不替代权威产品规则。 4. 遇到产品规则不确定时，登记到待确认问题，不直接写成结论。", "domain": "运营支持", "module": "运营支持知识", "tags": "Skill;工作技能;产品成功;AI协作", "sources": []}, {"path": "docs/50-运营支持知识/08-工作技能/客户场景诊断.md", "title": "Skill：客户场景诊断", "folder": "docs/50-运营支持知识/08-工作技能", "text": "# Skill：客户场景诊断  ## 适用场景  客户只描述“想提效”“想管供应商”“想看进度”“想自动化”，但尚未说清楚真实业务流程、角色边界、数据来源和成功标准时使用。  ## 输入  - 客户类型：品牌方、贸易公司、采购团队、Sourcing Agency、QC 服务商或混合模式 - 当前流程：现有系统、Excel、邮件、微信、人工协作方式 - 主要角色：内部团队、供应商、工厂、服务商、QC、管理层 - 痛点描述：效率、质量、交期、协同、数据、审计或成本 - 期望结果：要减少什么、看见什么、自动化什么、控制什么风险  ## 必读知识页  - [产品能力地图](../../00-产品总览与规划/产品能力地图.md) - [FlowSpace 数据层级](../../20-业务对象与数据模型/FlowSpace数据层级.md) - [权限体系总表](../../40-权限、安全与审计/权限体系总表.md) - [客户场景诊断清单](../../55-外贸供应链行业知识/07-产品成功应用/客户场景诊断清单.md) - [平台能力边界表达规范](../../55-外贸供应链行业知识/07-产品成功应用/平台能力边界表达规范.md)  ## 执行步骤  1. 还原客户当前业务流程，明确从哪个事件开始，到哪个结果结束。 2. 标记流程中的角色、系统、文件、表格、消息和审批节点。 3. 将痛点分成效率问题、协同问题、数据问题、权限问题、质量风险和管理可视化问题。 4. 判断哪些是产品能力可直接覆盖，哪些需要配置方案，哪些需要产品确认。 5. 将稳定主数据映射到资源库，将重复流程映射到业务模板和 FlowSpace。 6. 输出客户待确认问题，不把假设写成确定结论。  ## 输出格式  ## 客户背景 ## 当前流程 ## 角色与协作关系 ## 关键痛点 ## Linkincrease 能力映射 ## 推荐配置方向 ## 待确认问题 ## 下一步资料清单  ## 验收标准  - 已区分真实痛点和表面诉求。 - 已识别主数据、流程数据和分析数据。 - 已列出角色与权限边界。 - 已明确哪些能力可配置、哪些需要产品确认。  ## 常见坑  - 客户说“提效”，实际问题是责任边界不清。 - 客户想自动化，但基础数据不完整。 - 客户把行业习惯当成产品规则，需要单独标注为客户实践。  ## 关联文档  - [业务方案输出模板](../../55-外贸供应链行业知识/07-产品成功应用/业务方案输出模板.md) - [业务场景总览](../03-业务场景案例库/业务场景总览.md)", "domain": "运营支持", "module": "运营支持知识", "tags": "Skill;工作技能;产品成功;AI协作", "sources": []}, {"path": "docs/50-运营支持知识/08-工作技能/新客户上线方案.md", "title": "Skill：新客户上线方案", "folder": "docs/50-运营支持知识/08-工作技能", "text": "# Skill：新客户上线方案  ## 适用场景  为新客户设计 Linkincrease 上线计划、配置清单、数据准备、培训安排和 Go-live 验收时使用。  ## 输入  - 客户类型与上线范围 - 参与角色和组织结构 - 需要上线的业务场景 - 现有主数据和历史数据 - 权限边界和外部协作范围 - 期望上线时间与试点范围  ## 必读知识页  - [新客户上线标准流程](../06-运营规范与SOP/新客户上线标准流程.md) - [资源库模板设计思路](../02-日常运营任务/资源库运营/资源库模板设计思路.md) - [模板设计通用原则](../02-日常运营任务/模板配置/模板设计通用原则.md) - [权限体系总表](../../40-权限、安全与审计/权限体系总表.md) - [Tower 仪表盘配置指南](../04-监控与数据分析/Tower仪表盘配置指南.md)  ## 执行步骤  1. 确认上线目标和首批业务范围，避免一次性覆盖全部复杂场景。 2. 先设计团队、角色、协作团队和数据围栏。 3. 准备资源库模板和初始主数据。 4. 设计业务模板、里程碑、工单、批复和自动化通知。 5. 配置运营视图和管理仪表盘。 6. 安排角色测试、试点数据、培训和 Go-live 检查。 7. 上线后 30 天复盘使用率、异常、价值和待优化项。  ## 输出格式  ## 客户背景假设 ## 上线范围 ## 配置清单 ## 数据准备 ## 权限验证 ## 培训安排 ## Go-live 检查 ## 30 天价值复盘 ## 风险与待确认  ## 验收标准  - 上线范围清晰，试点边界明确。 - 资源库、模板、权限、自动化、报表都有配置项。 - 每类角色都有验证路径。 - Go-live 前有可执行检查清单。  ## 常见坑  - 先做流程，后补主数据，导致数据重复和权限混乱。 - 外部供应商、工厂账号提前开放，但数据围栏未验证。 - 仪表盘只做展示，没有对应运营动作。  ## 关联文档  - [业务健康度每日巡检 checklist](../04-监控与数据分析/业务健康度每日巡检checklist.md) - [模板版本管理与灰度发布规范](../06-运营规范与SOP/模板版本管理与灰度发布规范.md)", "domain": "运营支持", "module": "运营支持知识", "tags": "Skill;工作技能;产品成功;AI协作", "sources": []}, {"path": "docs/50-运营支持知识/08-工作技能/权限与数据可见问题排查.md", "title": "Skill：权限与数据可见问题排查", "folder": "docs/50-运营支持知识/08-工作技能", "text": "# Skill：权限与数据可见问题排查  ## 适用场景  用户无法登录、看不到数据、按钮灰化、无法提交、无法指派、协作团队看不到 FlowSpace 或工单时使用。  ## 输入  - 用户账号、团队、角色和协作团队身份 - 操作路径和目标记录 - 期望结果与实际结果 - 截图、报错、时间点和环境 - 最近是否调整模板、成员、权限、数据围栏或状态  ## 必读知识页  - [权限体系总表](../../40-权限、安全与审计/权限体系总表.md) - [团队权限](../../40-权限、安全与审计/团队权限.md) - [协作 FlowSpace 权限](../../40-权限、安全与审计/协作FlowSpace权限.md) - [数据围栏](../../40-权限、安全与审计/数据围栏.md) - [问题排查总览](../05-问题排查手册/问题排查总览.md)  ## 执行步骤  1. 先确认用户是否能登录，以及所属团队和角色是否正确。 2. 确认目标记录是否存在，是否属于用户可见的数据范围。 3. 检查协作团队、FlowSpace 角色、工单指派和状态限制。 4. 检查模板字段、按钮条件、批复规则和自动化规则是否影响操作。 5. 查询动态、历史记录、操作日志或系统执行日志，区分配置问题和产品缺陷。 6. 输出临时处理、根因修复和是否需要沉淀 FAQ。  ## 输出格式  ## 问题分类 ## 已知信息 ## 优先排查路径 ## 可能原因 ## 临时处理 ## 根因修复 ## 是否沉淀知识库  ## 验收标准  - 能说明问题属于权限、数据围栏、状态、模板配置还是系统异常。 - 有明确复现路径和验证账号。 - 临时处理和永久修复分开。 - 复发问题进入 FAQ 或排查手册。  ## 常见坑  - 只看团队角色，漏看协作团队角色。 - 只看按钮权限，漏看订单、里程碑、工单状态。 - 只问截图，不追踪目标记录的数据归属。  ## 关联文档  - [协作团队看不到数据](../05-问题排查手册/权限与成员管理/协作团队看不到数据.md) - [工单按钮灰化](../05-问题排查手册/权限与成员管理/工单按钮灰化.md)", "domain": "运营支持", "module": "运营支持知识", "tags": "Skill;工作技能;产品成功;AI协作", "sources": []}, {"path": "docs/50-运营支持知识/08-工作技能/运营专业方案设计.md", "title": "Skill：运营专业方案设计", "folder": "docs/50-运营支持知识/08-工作技能", "text": "# Skill：运营专业方案设计  ## 适用场景  产品成功需要基于外贸供应链专业场景，为客户输出 Linkincrease 业务方案、配置建议、能力边界和上线计划时使用。  ## 输入  - 客户原始诉求、会议纪要或群消息 - 客户类型：品牌方、贸易公司、采购团队、Sourcing Agency、供应商、工厂、服务商 - 业务场景：准入、订单履约、验货、审核/CAP、出货单证、绩效风险、异常结案等 - 当前资料：Excel、截图、表单、历史方案、现有系统  ## 必读知识页  - [运营专业知识建设路线图](../../55-外贸供应链行业知识/运营专业知识建设路线图.md) - [供应链必备知识地图](../../55-外贸供应链行业知识/供应链必备知识地图.md) - 对应 `docs/55-外贸供应链行业知识/03-业务流程与单据/` 场景页 - 对应 `docs/50-运营支持知识/03-业务场景案例库/` 客户方案页 - [平台能力边界表达规范](../../55-外贸供应链行业知识/07-产品成功应用/平台能力边界表达规范.md)  ## 执行步骤  1. 先识别客户问题属于哪个行业场景，不要直接从功能模块开始。 2. 从行业页抽取角色、对象、流程、状态、风险和指标。 3. 从客户方案页抽取推荐资源库、FlowSpace、权限、自动化和看板。 4. 回到产品权威页确认能力边界。 5. 标记支持度：L1、L2、L3、L4、LX。 6. 输出客户方案，并列出需要客户确认和产品确认的问题。 7. 若方案已试点，补充到客户样本与方案复盘。  ## 输出格式  ## 客户场景判断 ## 行业业务理解 ## Linkincrease 推荐方案 ## 资源库设计 ## FlowSpace / 模板设计 ## 权限边界 ## 自动化与仪表盘 ## 能力边界 ## 上线步骤 ## 验收标准 ## 待确认问题  ## 验收标准  - 方案同时包含行业理解和平台落地方式。 - 不把行业通行做法直接说成产品已支持能力。 - 不把普通异常默认升级为 CAP。 - 有明确的上线试点范围和验收标准。  ## 常见坑  - 只讲功能，不解释客户业务为什么需要这样配。 - 只讲行业，不说明 Linkincrease 怎么落地。 - 指标没有数据来源和管理动作。 - 客户样本没有匿名化就直接入库。  ## 关联文档  - [客户访谈与方案评审 SOP](../06-运营规范与SOP/客户访谈与方案评审SOP.md) - [上线后 30 天价值复盘 SOP](../06-运营规范与SOP/上线后30天价值复盘SOP.md)", "domain": "运营支持", "module": "运营支持知识", "tags": "Skill;运营专业方案;产品成功;AI协作", "sources": []}, {"path": "docs/50-运营支持知识/08-工作技能/需求文档入库.md", "title": "Skill：需求文档入库", "folder": "docs/50-运营支持知识/08-工作技能", "text": "# Skill：需求文档入库  ## 适用场景  将新需求、评审结论、客户反馈、历史文档或线上行为同步进知识库时使用。  ## 输入  - 来源文件或来源链接 - 需求所属模块 - 是否已确认 - 影响对象：功能、业务对象、流程、权限、状态、字段、通知、日志或报表 - 与旧规则的差异  ## 必读知识页  - [知识库维护规范](../../../00-知识库维护规范.md) - [需求文档来源台账](../../../05-需求文档来源台账.md) - [迭代需求设计工作流](../../00-产品总览与规划/迭代需求设计工作流.md) - [来源入库状态](../../90-版本历史与来源治理/来源入库状态.md) - [待确认问题](../../90-版本历史与来源治理/待确认问题.md)  ## 执行步骤  1. 登记来源，确认来源权威性、版本和状态。 2. 判断需求影响范围，定位对应权威知识页。 3. 对比旧规则，识别新增、修改、废弃、冲突和待确认项。 4. 更新正文，不把来源原文直接复制成结论。 5. 更新 `metadata/documents.csv`、来源台账、版本记录和待确认问题。 6. 如影响 AI 使用入口或 Skill，更新 `AGENTS.md` 或相关 Skill。  ## 输出格式  ## 来源信息 ## 影响范围 ## 需更新页面 ## 规则变更摘要 ## 冲突与待确认 ## Metadata 更新 ## 验证结果  ## 验收标准  - 每个新增结论可追溯到来源。 - 不确定内容进入待确认问题。 - 权威规则页、入口索引和 metadata 保持一致。 - 修改后没有 Markdown 断链。  ## 常见坑  - 把客户临时实践写成产品规则。 - 只更新功能页，漏掉权限、状态、日志或报表影响。 - 更新正文后忘记同步 metadata。  ## 关联文档  - [版本变更记录](../../90-版本历史与来源治理/版本变更记录.md) - [历史产品文档评估](../../90-版本历史与来源治理/历史产品文档评估.md)", "domain": "运营支持", "module": "运营支持知识", "tags": "Skill;工作技能;产品成功;AI协作", "sources": []}, {"path": "docs/50-运营支持知识/09-客户样本与方案复盘/README.md", "title": "09 客户样本与方案复盘", "folder": "docs/50-运营支持知识/09-客户样本与方案复盘", "text": "# 09 客户样本与方案复盘  本目录用于沉淀匿名客户样本、方案试点记录、上线复盘和可复用经验。它补足行业知识和 SOP 的“真实经验层”，帮助产品成功知道哪些方案真的跑通过、哪些只是理论建议。  ## 使用原则  1. 必须匿名化客户名称、人员、账号、合同、报价和敏感数据。 2. 原始聊天或会议纪要不直接入库，先提炼为结构化样本。 3. 单个客户做法不能外推为行业标准，只能标记为客户样本。 4. 可复用结论需要说明适用边界。 5. 产品规则缺口进入需求池或待确认问题，不直接改权威页。  ## 页面  - [客户样本记录模板](./客户样本记录模板.md)  ## 样本分类  | 类型 | 说明 | 去向 | | --- | --- | --- | | 成功配置样本 | 已在客户侧跑通的配置方案 | 本目录 + 对应场景方案页 | | 问题复盘样本 | 上线或使用中踩坑 | 本目录 + FAQ/SOP | | 需求信号样本 | 多个客户反复出现的产品缺口 | 本目录 + 需求池 | | 能力边界样本 | 客户期望超出当前平台能力 | 本目录 + 待确认问题 |  ## 每周复盘入口  每周从客户群消息、项目复盘、上线问题中提取：  客户类型 业务场景 原始问题 实际配置方案 上线效果 踩坑 可复用结论 不能外推的部分", "domain": "运营支持", "module": "运营支持知识", "tags": "客户样本;方案复盘;匿名化;产品成功", "sources": []}, {"path": "docs/50-运营支持知识/09-客户样本与方案复盘/客户样本记录模板.md", "title": "客户样本记录模板", "folder": "docs/50-运营支持知识/09-客户样本与方案复盘", "text": "# 客户样本记录模板  复制本模板记录匿名客户样本。不要保留客户真实名称、联系人、账号、合同、报价、私有数据或未脱敏截图。  ## 基本信息  | 字段 | 内容 | | --- | --- | | 样本编号 |  | | 记录日期 |  | | 客户类型 | 品牌方 / 贸易公司 / 采购团队 / Sourcing Agency / 供应商 / 工厂 / 服务商 | | 业务场景 |  | | 对应行业页 |  | | 对应方案页 |  | | 状态 | 草稿 / 已验证 / 已复盘 / 已废弃 |  ## 原始问题摘要  用 3-5 句话概括客户原始问题。只保留业务事实，不复制敏感聊天原文。  ## 业务背景  - 当前流程： - 参与角色： - 现有工具： - 主要痛点： - 成功标准：  ## 实际配置方案  | 配置项 | 实际做法 | 说明 | | --- | --- | --- | | 资源库 |  |  | | FlowSpace / 模板 |  |  | | 工单 / 批复 |  |  | | 权限 / 数据围栏 |  |  | | 自动化 / 通知 |  |  | | 仪表盘 / 报表 |  |  |  ## 上线效果  | 观察项 | 结果 | | --- | --- | | 是否跑通主流程 |  | | 是否减少人工催办 |  | | 是否改善数据完整性 |  | | 是否形成管理看板 |  | | 客户反馈 |  |  ## 踩坑与修正  | 问题 | 原因 | 修正方式 | 是否可复用 | | --- | --- | --- | --- |  ## 可复用结论  -  ## 不能外推的部分  -  ## 后续沉淀动作  - [ ] 是否更新 FAQ/SOP - [ ] 是否更新客户方案页 - [ ] 是否进入需求池 - [ ] 是否进入待确认问题 - [ ] 是否需要产品/研发/测试确认", "domain": "运营支持", "module": "运营支持知识", "tags": "客户样本;模板;复盘;匿名化;产品成功", "sources": []}, {"path": "docs/50-运营支持知识/README.md", "title": "50 运营支持知识", "folder": "docs/50-运营支持知识", "text": "# 50 运营支持知识  请从 [index.md](./index.md) 进入运营支持知识目录。  ## 阅读入口  - [运营支持知识索引](./index.md) - [业务场景总览](./03-业务场景案例库/业务场景总览.md) - [运营专业方案设计](./08-工作技能/运营专业方案设计.md) - [客户样本与方案复盘](./09-客户样本与方案复盘/README.md)", "domain": "公共能力", "module": "运营支持知识", "tags": "运营支持知识", "sources": []}, {"path": "docs/50-运营支持知识/index.md", "title": "50 运营支持知识", "folder": "docs/50-运营支持知识", "text": "# 50 运营支持知识  本目录面向产品运营、客户成功、实施配置、售前方案和培训支持，沉淀 Linkincrease 在外贸供应链行业中的运营方法、场景方案和问题排查资产。  Linkincrease 当前重点服务贸易企业、品牌方、采购团队、QC 服务商和 Sourcing Agency。运营支持知识不只解释功能怎么用，更要说明客户的真实业务问题如何拆成资源库、FlowSpace、订单、工单、批复、自动化、权限和数据分析。  ## 目录  | 分区 | 内容 | | --- | --- | | [01 新人上手](./01-新人上手/运营端概览与各模块地图.md) | 运营新人快速理解产品、模块、术语和第一天任务 | | [02 日常运营任务](./02-日常运营任务/模板配置/模板设计通用原则.md) | 模板配置、资源库运营、自动化消息、工作台任务管理 | | [03 业务场景案例库](./03-业务场景案例库/业务场景总览.md) | 外贸供应商治理、订单翻单、多团队协同等场景方案 | | [04 监控与数据分析](./04-监控与数据分析/Tower仪表盘配置指南.md) | Tower 仪表盘、跨 FlowSpace 数据、巡检和运营报表 | | [05 问题排查手册](./05-问题排查手册/问题排查总览.md) | 权限、模板、工单、导入导出、自动化、移动端问题排查 | | [06 运营规范与 SOP](./06-运营规范与SOP/新客户上线标准流程.md) | 新客户上线、模板版本、灰度发布、高风险操作、数据备份 | | [07 资料库](./07-资料库/运营常用脚本工具.md) | 运营工具、功能更新日志、外部培训资料 | | [08 工作技能](./08-工作技能/README.md) | 客户场景诊断、新客户上线、需求入库、权限排查、模板设计等可复用工作 Skill | | [09 客户样本与方案复盘](./09-客户样本与方案复盘/README.md) | 匿名客户样本、方案复盘、踩坑和可复用经验 |  ## 使用原则  1. 先讲行业问题，再映射 Linkincrease 能力。 2. 先识别主数据，再设计流程数据。 3. 先确定品牌方、供应商、工厂、服务商的权限边界，再配置 FlowSpace。 4. 所有场景方案都要说清楚数据如何进入资源库、如何在订单中被引用、如何在工单和批复中流转、如何被审计和分析。 5. 涉及数字化阶段、系统边界、主数据治理、预警和 Linkincrease 定位时，先查 [56 数字供应链专项知识](../56-数字供应链专项知识/README.md)。 6. 运营经验不能覆盖权威产品规则；涉及功能边界时，应回到业务对象、业务流程、权限、安全审计和数据分析目录校验。 7. 已跑通的高频工作方法应沉淀到 [08 工作技能](./08-工作技能/README.md)，并在周复盘中持续更新。 8. 已试点或上线的客户方案，应匿名沉淀到 [09 客户样本与方案复盘](./09-客户样本与方案复盘/README.md)，标清可复用结论和不能外推的边界。", "domain": "公共能力", "module": "运营支持知识", "tags": "运营支持知识", "sources": []}, {"path": "docs/55-外贸供应链行业知识/01-行业角色与商业关系/README.md", "title": "01 行业角色与商业关系", "folder": "docs/55-外贸供应链行业知识/01-行业角色与商业关系", "text": "# 01 行业角色与商业关系  本分区定义外贸供应链参与方、商业关系、责任边界和信息交换关系。  优先建设：  - 品牌方、进口商与采购团队。 - 贸易公司与 Sourcing Agency。 - 一级供应商、工厂与分包工厂。 - QC、审核、物流和其他服务商。 - 角色在供应商准入、订单履约、验货和整改中的职责变化。 ", "domain": "外贸供应链行业知识", "module": "行业知识", "tags": "外贸供应链;行业知识;产品成功", "sources": []}, {"path": "docs/55-外贸供应链行业知识/02-业务对象与主数据/README.md", "title": "02 业务对象与主数据", "folder": "docs/55-外贸供应链行业知识/02-业务对象与主数据", "text": "# 02 业务对象与主数据  本分区定义外贸供应链中的稳定主数据、过程数据及对象关系。  优先建设：  - 供应商与工厂。 - 产品、款式、SKU 与物料。 - 客户订单、采购订单与生产批次。 - 证书、审核报告、问题项与 CAP。 - 对象唯一标识、生命周期、归属和历史快照。  对象定义应与 [FlowSpace 数据层级](../../20-业务对象与数据模型/FlowSpace数据层级.md) 对照，但行业对象不等同于 Linkincrease 系统对象。 ", "domain": "外贸供应链行业知识", "module": "行业知识", "tags": "外贸供应链;行业知识;产品成功", "sources": []}, {"path": "docs/55-外贸供应链行业知识/03-业务流程与单据/QC验货与质量异常.md", "title": "QC 验货与质量异常", "folder": "docs/55-外贸供应链行业知识/03-业务流程与单据", "text": "# QC 验货与质量异常  ## 1. 业务定义  QC 验货与质量异常是品牌方、贸易公司、采购团队或第三方服务商在生产、出货前后对产品质量进行检查、记录、判定和跟进处理的过程。它关注“检查什么、谁检查、发现问题如何判定、是否放行、异常如何关闭”。  本页重点覆盖成品检验、过程抽检、装运前验货、质量异常记录和复验协同；不直接替代专业 QMS、实验室测试或完整质量标准体系。  ## 2. 适用客户与前提  | 客户类型 | 适用方式 | | --- | --- | | 品牌方 | 管理供应商/工厂验货计划、结果、放行和质量风险 | | 贸易公司 | 跟踪订单验货进度、异常、复验和客户确认 | | Sourcing Agency | 协调品牌方、工厂、QC 服务商和内部采购团队 | | QC 服务商 | 接收验货任务、现场采集记录、上传报告和证据 |  前提是客户已经有基本验货节点、判定标准、责任人和放行规则；若客户没有明确质量标准，Linkincrease 只能承载协同和记录，不能自动判定专业质量结论。  ## 3. 参与角色与责任  | 角色 | 主要责任 | 提供的数据 | 做出的决策 | | --- | --- | --- | --- | | 品牌方/客户质量负责人 | 定义验货要求和放行规则 | 检验标准、缺陷等级、放行要求 | 放行、拒收、复验、让步接收 | | 供应商/工厂 | 配合验货、提交整改和复验资料 | 生产批次、现场照片、整改证据 | 是否接受整改和复验安排 | | QC/验货员 | 执行现场检查并记录证据 | 检查记录、图片、缺陷、报告 | 给出检验结论或建议 | | 贸易/跟单人员 | 协调订单、工厂和客户确认 | 订单、交期、出货计划 | 是否推进下一节点 | | 产品成功/实施 | 将验货流程配置为平台模板 | 字段、工单、权限、报表 | 判断平台配置方案 |  ## 4. 核心业务对象  | 对象 | 定义 | 关键字段 | 与其他对象的关系 | | --- | --- | --- | --- | | 验货计划 | 一次验货安排 | 订单、工厂、验货类型、计划日期、验货员 | 关联订单、工厂和验货工单 | | 验货工单 | 现场执行和结果记录单元 | 检查项、缺陷、图片、结论、附件 | 可由采集端提交 | | 缺陷/问题项 | 验货发现的不符合事项 | 缺陷等级、数量、位置、照片、责任方 | 可触发复验或整改任务 | | 验货报告 | 验货结果汇总 | 报告编号、结论、附件、签名 | 作为放行或整改依据 | | 质量异常 | 需要后续跟进的质量问题 | 等级、责任人、期限、处理状态 | 严重或重复问题可升级为 CAP | | 复验记录 | 对整改后结果的再次验证 | 复验日期、结果、证据 | 关闭异常或继续处理 |  ## 5. 标准业务流程  flowchart LR A[\"订单到达验货节点\"] --> B[\"创建验货计划\"] B --> C[\"分派 QC/验货员\"] C --> D[\"现场采集检查记录\"] D --> E[\"上传照片、附件和报告\"] E --> F{\"是否发现质量异常?\"} F -- \"否\" --> G[\"放行或进入下一节点\"] F -- \"是\" --> H[\"记录缺陷和异常\"] H --> I{\"是否需要正式整改闭环?\"} I -- \"普通异常\" --> J[\"跟进处理/复验\"] I -- \"重大或重复问题\" --> K[\"创建 CAP/整改闭环\"] J --> L[\"复核并关闭\"] K --> L  ## 6. 状态与业务规则  | 对象 | 状态或规则 | 进入条件 | 允许操作 | 退出条件 | | --- | --- | --- | --- | --- | | 验货计划 | 待安排 | 订单进入验货节点 | 指派验货员、调整日期 | 确认验货安排 | | 验货计划 | 执行中 | 已分派人员 | 现场填写、上传附件 | 提交验货结果 | | 验货结果 | 待确认 | 报告已提交 | 批复、退回补充、要求复验 | 放行、拒收或整改 | | 质量异常 | 待处理 | 验货发现问题 | 指派责任人、填写措施 | 提交处理结果 | | 质量异常 | 待复核 | 责任方提交证据 | 复核、退回、关闭 | 复核通过或退回 | | CAP | 整改中 | 严重、重复或合规相关问题 | 提交根因、纠正预防措施、证据 | 复核关闭 |  普通缺陷不等于 CAP。只有需要根因、纠正措施、预防措施、责任人、期限、证据和复核闭环时，才建议使用 CAP。  ## 7. 异常、风险与控制措施  | 风险或异常 | 业务影响 | 识别方式 | 控制措施 | | --- | --- | --- | --- | | 验货计划未及时安排 | 出货延误或漏验 | 订单节点临近但无验货任务 | 自动化提醒、待办看板 | | 现场证据不完整 | 质量结论难以复核 | 图片、附件、签名缺失 | 表单必填、附件校验、退回补充 | | 缺陷等级和结论混乱 | 放行决策失真 | 结论与缺陷严重度不一致 | 标准化缺陷字段和批复规则 | | 异常未关闭即出货 | 客户投诉或索赔 | 未关闭异常关联出货节点 | 出货前检查未关闭问题 | | 把所有异常都做 CAP | 流程过重，运营负担高 | CAP 数量异常膨胀 | 设置 CAP 触发边界 |  ## 8. 管理指标  | 指标 | 用途 | 建议口径 | 数据来源 | 管理动作 | | --- | --- | --- | --- | --- | | 验货准时完成率 | 判断验货执行效率 | 准时完成验货数/应完成验货数 | 验货计划、工单 | 调整排期和提醒 | | 验货通过率 | 判断批次质量水平 | 通过或放行验货数/已完成验货数 | 验货结论 | 识别高风险工厂/品类 | | 缺陷数量和等级分布 | 判断质量问题类型 | 按缺陷等级、品类、工厂统计 | 缺陷字段/子表 | 优先整改高频缺陷 | | 复验率 | 判断一次通过能力 | 需要复验批次数/已验货批次数 | 验货结果 | 优化生产前控制 | | 质量异常关闭周期 | 判断处理效率 | 关闭时间减发现时间 | 异常/CAP 工单 | 催办和升级 |  ## 9. Linkincrease 能力映射  | 行业需求或规则 | Linkincrease 对象或能力 | 数据、状态或权限影响 | 支持度 | 推荐方案 | | --- | --- | --- | --- | --- | | 创建验货计划 | FlowSpace、里程碑、工单 | 需要订单、工厂、计划日期、验货员 | L2 | 在订单 FlowSpace 中设置验货里程碑和验货工单 | | 现场采集记录 | 采集端、表单组件、附件、图片编辑 | 需要移动端提交、附件权限和离线/上传规则 | L2 | 将检查项、照片、签名配置为工单字段 | | 缺陷记录 | 工单字段、子表、问题库 | 需要缺陷等级、数量、照片和责任方 | L2/LX | 简单场景用工单字段，复杂缺陷库待产品确认 | | 验货结论 | 批复、状态、报告附件 | 需要放行/拒收/复验状态和审批记录 | L2 | 用工单批复或里程碑批复承载结论 | | 质量异常跟进 | 工单、异常字段、自动化 | 需要责任人、期限、处理状态 | L2 | 普通异常用跟进工单，不默认 CAP | | CAP 整改闭环 | 独立 FlowSpace 或 CAP 工单 | 需要根因、纠正预防、证据、复核 | L2 | 仅严重、重复、合规相关问题使用 CAP | | 管理看板 | 仪表盘、报告 | 需要统一指标口径和数据权限 | L2/LX | 先做验货进度和异常看板，复杂质量绩效待确认 |  ## 10. 测试关注点  | 类别 | 需要验证的内容 | | --- | --- | | 主流程 | 创建计划、分派、采集、提交、批复、关闭 | | 权限 | QC 只能看分派任务，供应商/工厂只能看自己相关问题 | | 状态 | 退回补充、复验、拒收、让步接收、CAP 升级 | | 数据 | 图片附件、缺陷子表、报告附件、历史快照 | | 异常 | 网络中断、附件上传失败、人员变更、验货日期变更 | | 审计 | 提交、退回、批复、结论变更和系统提醒记录 |  ## 11. 产品差距与需求候选  | 差距 | 业务影响 | 当前替代方案 | 建议优先级 | 去向 | | --- | --- | --- | --- | --- | | 缺陷库和 AQL/抽样规则尚未形成通用产品模型 | 难以做专业质量统计 | 用工单字段或子表记录 | P1 调研 | 产品维护区评估 | | 验货结论对出货节点的强校验规则待确认 | 可能出现异常未关闭仍出货 | SOP 检查和仪表盘提醒 | P0 调研 | 待确认问题 | | 跨订单质量绩效指标口径待验证 | 难以形成可靠供应商质量评分 | 导出分析或 Tower 自定义 | P1 | 数据分析支持 |  ## 12. 产品成功应用  ### 客户识别信号  - 客户说验货计划、现场照片、报告和批复都散在聊天和 Excel。 - 客户无法追踪某批货是否验过、是否放行、是否有未关闭问题。 - 客户希望 QC 服务商或工厂按权限提交资料。 - 客户想看工厂/供应商质量表现，但指标口径不清。  ### 重点诊断问题  - 验货是订单级、批次级、出货级还是工厂级？ - 谁安排验货，谁现场执行，谁确认结论？ - 缺陷是否需要按等级、数量、图片和责任方记录？ - 质量异常什么时候只是普通跟进，什么时候必须 CAP？ - 验货结论是否影响出货、付款或订单结案？  ### 方案输出入口  - 对应运营方案：[品牌方 QC 验货协同方案](../../50-运营支持知识/03-业务场景案例库/品牌方QC验货协同方案.md) - 需要说明的平台边界：Linkincrease 可承载验货协同、证据、批复、提醒和看板；专业抽样规则、实验室测试和完整 QMS 需单独确认。  ## 13. 来源与可信度  | 来源 | 类型 | 证据等级 | 支撑结论 | 版本或日期 | | --- | --- | --- | --- | --- | | Linkincrease 验货组件、采集端、工单和批复知识页 | 内部产品知识 | 不适用 | 平台能力映射 | 当前版本 | | 订单管理类模板最佳实践 | 内部配置实践 | E3 | 验货节点与订单协同 | 当前版本 | | 行业常见 QC 实践 | 待补充来源 | E4 | 缺陷、复验、放行和异常处理 | 待验证 |  ## 14. 待确认问题  - [ ] 产品确认验货结论是否支持对出货/结案节点做强校验。 - [ ] 产品成功补充至少 2 个客户的验货字段、角色和报告样本。 - [ ] 数据分析确认验货通过率、复验率和缺陷统计的字段口径。  ## 15. 关联知识  - 产品权威规则：[验货组件流程](../../10-功能模块详情/验货组件流程.md)、[采集端](../../10-功能模块详情/采集端.md)、[工单与批复](../../10-功能模块详情/工单与批复.md) - 权限审计：[权限体系总表](../../40-权限、安全与审计/权限体系总表.md) - 数据分析：[核心指标口径](../../60-数据分析支持/核心指标口径.md)", "domain": "外贸供应链行业知识", "module": "行业知识", "tags": "QC;验货;质量异常;CAP;产品成功", "sources": []}, {"path": "docs/55-外贸供应链行业知识/03-业务流程与单据/README.md", "title": "03 业务流程与单据", "folder": "docs/55-外贸供应链行业知识/03-业务流程与单据", "text": "# 03 业务流程与单据  本分区按端到端业务场景沉淀参与角色、业务对象、流程阶段、单据、状态、异常和控制点。  ## 场景  ### P0 核心协同场景  - [供应商开发、准入与生命周期管理](./供应商与工厂准入.md) - [采购订单履约与交期跟踪](./采购订单履约与交期跟踪.md) - [生产进度与异常协同](./生产进度与异常协同.md) - [QC 验货与质量异常](./QC验货与质量异常.md) - [社会责任审核与 CAP 整改](./社会责任审核与CAP整改.md) - [出货计划与单证协同](./出货计划与单证协同.md) - [供应商绩效与风险管理](./供应商绩效与风险管理.md) - [订单变更、异常、索赔与结案](./订单变更异常索赔与结案.md)  ### P1 扩展场景  - 询价、报价、比价与定点（待评估） - 样品开发与确认（待评估） - 需求预测与采购计划（待评估） - 物料准备与齐套管理（待评估） - 国际物流与到货跟踪（待评估） - 报关、清关与贸易合规（待评估） - 对账、付款与结算（待评估） - 退货、返工与召回（待评估）  场景优先级依据 Linkincrease 当前产品定位、已有能力和客户推广价值确定，不代表 P1 场景在供应链业务中不重要。", "domain": "外贸供应链行业知识", "module": "行业知识", "tags": "外贸供应链;行业知识;产品成功", "sources": []}, {"path": "docs/55-外贸供应链行业知识/03-业务流程与单据/供应商与工厂准入.md", "title": "供应商开发、准入与生命周期管理", "folder": "docs/55-外贸供应链行业知识/03-业务流程与单据", "text": "# 供应商开发、准入与生命周期管理  ## 1. 业务定义  供应商开发、准入与生命周期管理是品牌方、采购团队或贸易企业识别潜在合作方，评估商业和供应能力，批准合作，并在后续订单中持续评价、复审、暂停或淘汰供应商和实际生产工厂的过程。  供应商准入关注商业合作主体及履约能力，工厂准入关注实际生产场所、生产能力、质量和合规风险。两者可能合并执行，也可能分别审批。本页不把单个客户的审批层级视为统一行业标准。  当前页面重点详细展开“准入、审核、整改和持续维护”。寻源、询报价、样品或试单、商务谈判、绩效和淘汰只定义其与准入的关系，后续可拆为独立场景。  ## 1.1 在端到端供应链中的位置  flowchart LR A[\"需求与采购计划\"] --> B[\"供应商寻源和初筛\"] B --> C[\"资料、能力和风险评估\"] C --> D[\"样品/试单/审核\"] D --> E[\"准入和定点决策\"] E --> F[\"订单履约\"] F --> G[\"交付、质量和协同绩效\"] G --> H{\"继续合作?\"} H -->|是| I[\"分级、复审和扩大合作\"] H -->|有条件| J[\"整改、限制或暂停\"] H -->|否| K[\"退出或淘汰\"] I --> F J --> G  准入不是供应商管理的终点。没有订单履约、质量、交付和风险数据回流，准入状态会逐渐失去管理意义。  ## 2. 适用客户与前提  | 客户类型 | 典型诉求 | | --- | --- | | 品牌方、进口商 | 识别实际生产工厂，控制质量、社会责任和供应链风险 | | 贸易公司 | 建立可复用供应商和工厂档案，降低跟单与审厂成本 | | 采购团队、Sourcing Agency | 统一多个项目和客户的供应商开发、评价与审批过程 | | 一级供应商 | 申报自身及合作工厂，提交资质并跟进补充要求 | | QC 或审核服务商 | 执行现场审核、提交报告并验证整改结果 |  该场景通常依赖明确的准入标准、资料清单、审批责任人、有效期规则和退出机制。  ## 3. 参与角色与责任  | 角色 | 主要责任 | 提供的数据 | 做出的决策 | | --- | --- | --- | --- | | 品牌方或采购负责人 | 制定准入要求并承担最终业务决策 | 准入标准、风险等级、审批意见 | 通过、条件通过、驳回、暂停或退出 | | 供应商 | 提交企业和合作工厂资料，响应补充要求 | 企业信息、联系人、证照、工厂关系 | 确认申报内容和整改计划 | | 工厂 | 提交生产场所、产能、质量和合规资料 | 工厂档案、证书、设备、产能、审核材料 | 确认现场信息和整改证据 | | QC 或审核服务商 | 执行文件审核或现场审核 | 审核记录、问题项、报告和建议 | 给出专业结论，不一定承担最终准入决策 | | 产品成功或实施人员 | 将客户规则配置为可执行流程 | 模板、角色、字段、权限和报表方案 | 判断配置方案，不替代客户业务审批 |  ## 4. 核心业务对象  | 对象 | 定义 | 关键字段 | 与其他对象的关系 | | --- | --- | --- | --- | | 供应商 | 与采购方建立商业合作关系的组织 | 编码、名称、区域、类别、联系人、状态、风险等级 | 可关联一个或多个工厂 | | 工厂 | 实际承担生产活动的场所或法人主体 | 编码、地址、产品类别、产能、证书、审核状态 | 归属或服务于供应商，可参与订单生产 | | 准入申请 | 一次新增、变更或重新准入请求 | 申请类型、申请人、对象、提交时间、当前状态 | 关联供应商、工厂和审批记录 | | 证书与资质 | 支撑合法经营、质量或合规判断的材料 | 类型、编号、签发机构、生效日、失效日、附件 | 关联供应商或工厂 | | 审核记录 | 对资料、现场或能力进行核验的过程记录 | 审核类型、审核人、日期、结论、报告 | 可产生问题项和 CAP | | 问题项与 CAP | 对不符合项的整改要求和闭环记录 | 等级、责任人、期限、证据、复核结论 | 来源于审核，关闭后影响准入结果 | | 寻源或候选记录 | 供应商正式准入前的发现、接触和初步筛选记录 | 来源、品类、地区、能力、联系人、初筛结果 | 通过初筛后可发起准入 | | 评价与绩效记录 | 对供应商或工厂在订单中的表现进行周期评价 | 交付、质量、成本、协同、合规、评价周期 | 影响等级、复审、业务分配和退出 |  供应商和工厂应有稳定唯一标识。名称、地址或联系人变化不应产生无法识别的重复主体。  ## 4.1 典型评价维度  | 维度 | 关注内容 | 常见证据 | | --- | --- | --- | | 商务 | 价格、付款条件、报价响应和合同接受能力 | 报价、合同、沟通记录 | | 产品与技术 | 品类经验、开发能力、规格理解和样品表现 | 产品清单、样品、技术评审 | | 产能与交付 | 设备、人员、产能、旺季负荷和历史交付 | 产能资料、生产计划、订单绩效 | | 质量 | 质量体系、过程控制、缺陷和验货表现 | 体系证书、审核和验货报告 | | 合规 | 合法经营、社会责任、环境和客户特定要求 | 证照、证书、审核报告 | | 财务与连续性 | 财务稳定性、关键依赖和中断风险 | 信用资料、风险调查、业务连续性计划 | | 协同 | 数据及时性、问题响应、整改和跨团队配合 | 任务、消息、CAP 和历史记录 |  不同品类和客户的权重不同。行业知识应沉淀评价框架，不应假设存在统一评分公式。  ## 5. 标准业务流程  flowchart LR A[\"发起供应商或工厂申报\"] --> B[\"提交基础资料与资质\"] B --> C[\"资料完整性检查\"] C -->|不完整| D[\"退回补充\"] D --> B C -->|完整| E[\"风险评估或审核\"] E --> F{\"存在需整改问题?\"} F -->|是| G[\"创建 CAP 并提交整改证据\"] G --> H[\"复核整改结果\"] H --> E F -->|否| I[\"准入审批\"] I --> J[\"写入供应商/工厂主数据\"] J --> K[\"持续监控、到期复审或退出\"]  典型控制点：  1. 发起前检查主体是否已经存在，避免重复建档。 2. 资料完整不等于满足准入要求，需要区分完整性检查和业务审批。 3. 审核机构的专业结论与品牌方的最终商业决策可以分离。 4. 条件通过时需要记录条件、责任人、期限和后续复核。 5. 准入后仍需管理证书到期、信息变更、风险升级和退出。  ## 6. 状态与业务规则  以下状态是建议模型，不代表所有客户必须采用相同枚举。  | 对象 | 状态或规则 | 进入条件 | 允许操作 | 退出条件 | | --- | --- | --- | --- | --- | | 准入申请 | 草稿 | 已创建但未正式提交 | 编辑、补充、删除 | 提交申请 | | 准入申请 | 待补充 | 资料不完整或审核要求补件 | 补充资料、重新提交 | 完整性检查通过 | | 准入申请 | 审核中 | 资料完整，进入文件或现场审核 | 审核、记录问题、发起 CAP | 进入审批或退回补充 | | 准入申请 | 整改中 | 存在需要关闭的问题项 | 提交证据、复核、调整期限 | 问题关闭或审批终止 | | 准入申请 | 待审批 | 已达到客户设定的审批条件 | 审批、退回 | 通过、条件通过或驳回 | | 主体 | 已准入 | 审批通过且满足生效条件 | 被新业务引用、持续维护 | 暂停、失效、退出或重新评估 | | 主体 | 条件准入 | 允许有限合作但仍有未完成条件 | 按限制被引用、继续整改 | 转正式准入或暂停 | | 主体 | 暂停/退出 | 风险、过期、违规或合作终止 | 查看历史、整改或重新申请 | 恢复或重新准入 |  建议区分“申请状态”和“供应商/工厂主数据状态”，避免一次申请的结束状态覆盖主体长期生命周期。  ## 7. 异常、风险与控制措施  | 风险或异常 | 业务影响 | 识别方式 | 控制措施 | | --- | --- | --- | --- | | 同一供应商或工厂重复申报 | 档案、审核和订单数据分裂 | 名称、统一编码、地址或证照重复 | 发起前查重，设置唯一标识和合并机制 | | 供应商申报的实际工厂不透明 | 未准入工厂参与生产 | 订单工厂与已申报关系不一致 | 订单关联已准入工厂，新增工厂触发准入 | | 证书过期仍被使用 | 合规风险和审核失真 | 到期日、状态和订单引用检查 | 到期预警、失效状态、新业务引用限制 | | 条件准入缺少后续跟踪 | 临时例外长期化 | 条件、责任人或期限缺失 | 将条件转为有期限任务或 CAP | | 审核问题未闭环 | 风险持续存在 | CAP 状态、逾期天数、复核结果 | 明确责任、证据、复核和升级机制 | | 历史审批记录被覆盖 | 无法审计当时决策依据 | 资料和结论仅保留当前值 | 保存申请、批复、附件和变更历史 |  ## 8. 管理指标  | 指标 | 用途 | 建议口径 | 数据来源 | 管理动作 | | --- | --- | --- | --- | --- | | 平均准入周期 | 判断流程效率 | 准入生效时间减首次正式提交时间 | 准入申请、审批记录 | 定位补件、审核和审批瓶颈 | | 首次资料完整率 | 判断申报质量 | 首次提交即通过完整性检查的申请数/首次提交申请数 | 申请和退回记录 | 优化资料清单和供应商培训 | | 准入通过率 | 判断对象质量及标准严苛程度 | 通过或条件通过申请数/完成审批申请数 | 审批结果 | 分析供应商来源和驳回原因 | | CAP 按期关闭率 | 判断整改执行力 | 期限内关闭 CAP 数/应关闭 CAP 数 | CAP、期限和复核记录 | 催办、升级或调整合作等级 | | 有效证书覆盖率 | 判断资质维护健康度 | 关键证书有效的主体数/应具备证书的主体数 | 主体和证书档案 | 到期提醒、暂停新增业务 |  正式进入仪表盘前，应在数据分析支持区补充字段口径和统计范围。  ## 9. 产品研发映射  | 行业需求或规则 | 产品对象或能力 | 数据、状态或权限影响 | 支持度 | 产品依据 | | --- | --- | --- | --- | --- | | 供应商、工厂和证书需要长期维护并跨流程复用 | 资源库 | 需要主体唯一标识、对象关联、有效期和历史变更 | L2 | [资源库](../../20-业务对象与数据模型/资源库.md) | | 一次准入申请需要经历补件、审核、整改和审批 | 业务模板、FlowSpace、订单、里程碑、工单、批复 | 需要区分申请状态、任务状态和主体长期状态 | L2 | [从模板到 FlowSpace](../../30-业务流程与产品流程图/从模板到FlowSpace.md) | | 供应商、工厂和服务商需要参与同一流程 | 协作团队、业务角色、处理人 | 需要验证组织关系、处理人变化和协作方退出后的规则 | L2 | [协作 FlowSpace 权限](../../40-权限、安全与审计/协作FlowSpace权限.md) | | 不同参与方只能查看和填写职责范围内的数据 | 角色权限、数据围栏、表单显隐 | 字段可见、数据可见和操作权限需要组合判断 | L2 | [权限体系总表](../../40-权限、安全与审计/权限体系总表.md) | | 准入通过后应形成可复用主数据 | 资源库写入或同步 | 需要明确触发条件、字段映射、重复判断、覆盖和失败处理 | LX | [资源库引用与同步](../../30-业务流程与产品流程图/资源库引用与同步.md) | | 证书到期和整改期限需要主动提醒 | 日期字段、自动化、消息通知 | 需要验证时间触发、通知对象、重复提醒和失败日志 | L2 | [自动化](../../10-功能模块详情/自动化.md) | | 管理层需要查看准入、审核和整改进度 | 仪表盘、报告、跨 FlowSpace 数据 | 需要统一指标口径、统计范围和数据权限 | L2 | [Tower 仪表盘配置指南](../../50-运营支持知识/04-监控与数据分析/Tower仪表盘配置指南.md) | | 申请、审批和资料变化必须可追溯 | 动态、历史记录、操作日志 | 需要区分人工操作、业务过程和系统写入记录 | L1/L2 | [历史记录与快照](../../40-权限、安全与审计/历史记录与快照.md) |  “审批完成后自动写入资源库”的具体触发、字段映射和冲突处理需要依据当前产品规则进一步确认，因此暂记为 LX。  ## 10. 测试关注点  | 类别 | 需要验证的内容 | | --- | --- | | 主流程 | 申报、补件、审核、CAP、审批、主数据沉淀是否形成完整闭环 | | 权限 | 品牌方、供应商、工厂、服务商只能查看和处理职责范围内的数据 | | 状态 | 已驳回、已暂停、已退出、条件准入和证书失效后的操作限制 | | 数据 | 重复主体、资源库引用、历史快照、申请数据与主数据之间的一致性 | | 异常 | 处理人离职、协作团队退出、附件失效、自动化失败、并发编辑 | | 审计 | 提交、退回、补充、审核、批复、状态变化和系统写入是否可追溯 |  可结合 [测试支持](../../45-测试支持/README.md) 中的权限矩阵、数据校验和异常边界继续拆分测试用例。  ## 11. 产品差距与需求候选  | 差距 | 业务影响 | 当前替代方案 | 建议优先级 | 去向 | | --- | --- | --- | --- | --- | | 准入通过后写入资源库的规则和冲突策略待确认 | 可能需要重复录入，或覆盖已有主体数据 | 人工复核后维护资源库 | P0 调研 | [待研究问题](../99-待研究问题/README.md) | | 主体重复识别和合并机制尚未形成行业方案 | 供应商、工厂档案可能重复 | 配置唯一编码并人工查重 | P1 | 产品维护区评估 | | 条件准入、暂停、退出的通用状态模型待验证 | 不同客户模板难以复用 | 按客户定制状态字段和流程 | P1 调研 | [待研究问题](../99-待研究问题/README.md) |  以上为需求候选和调研项，不代表已经进入产品计划。  ## 12. 产品成功应用  ### 客户识别信号  客户出现以下情况时，可以优先使用本场景知识：  - 供应商、工厂和证书分散在多个 Excel、邮件或聊天记录中。 - 品牌方无法确认订单实际使用的生产工厂。 - 新工厂申报、资料补充、审核和审批缺少统一进度。 - 审核问题和 CAP 整改无法持续跟踪。 - 证书过期、条件准入和工厂退出主要依靠人工记忆。  ### 重点诊断问题  - 客户是否分别管理供应商和工厂，两者是什么关系？ - 谁发起准入、谁检查资料、谁审核、谁最终批准？ - 存在哪些准入类型和状态，是否允许条件准入或临时使用？ - 哪些证书、报告和信息有有效期？ - 审核发现问题后，是否必须完成 CAP 才能准入？ - 准入结果如何影响新订单选择供应商或工厂？ - 历史订单是否必须保留当时的主体信息和审批依据？  ### 方案输出入口  - 使用 [客户场景诊断清单](../07-产品成功应用/客户场景诊断清单.md) 补齐客户现状。 - 使用 [平台能力边界表达规范](../07-产品成功应用/平台能力边界表达规范.md) 标记 L1 至 L4 和 LX。 - 参考 [品牌方供应商与工厂准入协同方案](../../50-运营支持知识/03-业务场景案例库/外贸供应商治理/品牌方供应商与工厂准入协同方案.md) 设计配置方案。 - 使用 [业务方案输出模板](../07-产品成功应用/业务方案输出模板.md) 形成客户交付内容。  ## 13. 来源与可信度  | 来源 | 类型 | 证据等级 | 支撑结论 | 版本或日期 | | --- | --- | --- | --- | --- | | [品牌方供应商与工厂准入协同方案](../../50-运营支持知识/03-业务场景案例库/外贸供应商治理/品牌方供应商与工厂准入协同方案.md) | 内部场景方案 | E3 | 角色、对象、FlowSpace 组合和客户配置方式 | 当前版本 | | [业务场景总览](../../50-运营支持知识/03-业务场景案例库/业务场景总览.md) | 内部场景总结 | E3 | 行业问题到产品能力的初步映射 | 当前版本 | | 产品业务对象、流程和权限权威页 | 内部产品知识 | 不适用 | Linkincrease 当前产品能力 | 当前版本 |  当前版本主要基于内部场景方案建立结构，尚需补充标准、更多客户样本和行业专家确认，不能视为完整行业标准。  ## 14. 待确认问题  - [ ] 由产品成功归纳不同客户的准入层级、状态和审批角色，验证是否可以形成三至五种稳定模式。 - [ ] 由产品确认准入结果自动写入资源库时的触发条件、字段映射、重复数据和覆盖规则。 - [ ] 由测试补充证书失效、协作关系变化、并发处理和自动化失败的完整异常用例。 - [ ] 补充至少一个 E1 或 E2 来源，校正当前主要来自内部方案的行业描述。  ## 15. 关联知识  - 客户配置方案：[品牌方供应商与工厂准入协同方案](../../50-运营支持知识/03-业务场景案例库/外贸供应商治理/品牌方供应商与工厂准入协同方案.md) - 产品权威规则：[资源库](../../20-业务对象与数据模型/资源库.md)、[FlowSpace](../../20-业务对象与数据模型/FlowSpace.md)、[权限体系总表](../../40-权限、安全与审计/权限体系总表.md) - 测试支持：[测试支持价值](../../45-测试支持/测试支持价值.md) - 数据分析：[核心指标口径](../../60-数据分析支持/核心指标口径.md) - 产品维护：[竞品分析](../../70-产品维护知识/竞品分析.md)、[需求池](../../70-产品维护知识/需求池.md) - 产品成功应用：[客户场景诊断清单](../07-产品成功应用/客户场景诊断清单.md)、[业务方案输出模板](../07-产品成功应用/业务方案输出模板.md)", "domain": "外贸供应链行业知识", "module": "行业知识", "tags": "外贸供应链;行业知识;产品成功", "sources": []}, {"path": "docs/55-外贸供应链行业知识/03-业务流程与单据/供应商绩效与风险管理.md", "title": "供应商绩效与风险管理", "folder": "docs/55-外贸供应链行业知识/03-业务流程与单据", "text": "# 供应商绩效与风险管理  ## 1. 业务定义  供应商绩效与风险管理是基于供应商、工厂在准入、订单履约、质量、交付、协同、合规和整改中的表现，形成评价、分级、预警、复审和业务调整的过程。  本页关注绩效和风险的业务建模与平台承载方式，不替代完整 SRM、财务风控或专业 ESG 尽调系统。  ## 2. 适用客户与前提  | 客户类型 | 适用方式 | | --- | --- | | 品牌方/采购团队 | 建立供应商分级、风险预警和业务分配依据 | | 贸易公司 | 评估供应商协同、交付和质量表现 | | Sourcing Agency | 为多客户、多品类供应商池做运营管理 | | 供应商 | 查看自身协同问题和待改进事项 |  前提是客户已经有稳定的订单、验货、审核或协同数据来源；没有数据来源时，只能先做资料完整性和流程执行看板。  ## 3. 参与角色与责任  | 角色 | 主要责任 | 提供的数据 | 做出的决策 | | --- | --- | --- | --- | | 采购/供应商管理负责人 | 定义评价维度和分级规则 | 权重、等级、复审规则 | 分级、暂停、扩大合作 | | 质量/合规负责人 | 提供质量和合规结果 | 验货、审核、CAP | 风险升级或限制 | | 跟单/运营 | 提供交付和协同数据 | 延期、任务响应、异常 | 流程改进建议 | | 供应商/工厂 | 提供整改和解释 | 证据、原因、计划 | 承诺改善 | | 产品成功/实施 | 配置数据来源和仪表盘 | 资源库、FlowSpace、指标 | 判断可实现口径 |  ## 4. 核心业务对象  | 对象 | 定义 | 关键字段 | 与其他对象的关系 | | --- | --- | --- | --- | | 供应商绩效档案 | 某周期供应商表现汇总 | 周期、交付、质量、协同、合规、等级 | 关联供应商资源库 | | 风险记录 | 某个风险事件或风险状态 | 类型、等级、原因、影响、责任人 | 可来自订单、验货、审核、CAP | | 指标口径 | 绩效计算规则 | 分子、分母、时间范围、排除项 | 支撑仪表盘 | | 改善计划 | 针对低绩效或高风险的行动 | 措施、责任人、期限、证据 | 可形成工单或 CAP | | 供应商等级 | 业务分层结果 | A/B/C、观察、暂停、禁用 | 影响准入、订单选择和复审 |  ## 5. 标准业务流程  flowchart LR A[\"收集订单/质量/合规/协同数据\"] --> B[\"计算或人工评估指标\"] B --> C[\"形成供应商绩效和风险视图\"] C --> D{\"是否触发风险或低绩效?\"} D -- \"否\" --> E[\"维持等级和复审周期\"] D -- \"是\" --> F[\"发起改善计划或复审\"] F --> G[\"跟进措施和证据\"] G --> H[\"复核效果并调整等级\"]  ## 6. 状态与业务规则  | 对象 | 状态或规则 | 进入条件 | 允许操作 | 退出条件 | | --- | --- | --- | --- | --- | | 绩效周期 | 数据收集中 | 周期开始 | 补充数据、校验口径 | 周期结束 | | 绩
