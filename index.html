效周期 | 待评审 | 数据汇总完成 | 评审、调整、确认 | 等级发布 | | 风险记录 | 待处理 | 触发风险规则 | 指派责任、提交措施 | 进入验证 | | 改善计划 | 进行中 | 低绩效或高风险 | 提交证据、延期、升级 | 复核通过 | | 供应商等级 | 已生效 | 评审确认 | 查看、引用、复审 | 下周期调整 |  ## 7. 异常、风险与控制措施  | 风险或异常 | 业务影响 | 识别方式 | 控制措施 | | --- | --- | --- | --- | | 指标口径不清 | 排名和决策失真 | 同一指标多种算法 | 在 `docs/60` 固化口径 | | 数据来源不稳定 | 看板不可信 | 缺字段、缺状态、手工补录 | 先做字段治理和必填规则 | | 将一次异常外推成长期风险 | 误伤供应商关系 | 单一事件影响等级 | 设置周期和复核机制 | | 等级不影响业务动作 | 看板变成展示 | 等级发布后无后续措施 | 绑定复审、限制、改善计划 | | 客户自定义权重差异大 | 通用方案难复用 | 各客户评分表不同 | 沉淀维度，不固化统一权重 |  ## 8. 管理指标  | 指标 | 用途 | 建议口径 | 数据来源 | 管理动作 | | --- | --- | --- | --- | --- | | 准时交付率 | 判断交付表现 | 准时完成订单/应完成订单 | 订单、里程碑 | 调整供应分配 | | 验货通过率 | 判断质量稳定性 | 通过验货/完成验货 | 验货工单 | 质量改进 | | CAP 按期关闭率 | 判断整改执行力 | 按期关闭 CAP/应关闭 CAP | CAP 工单 | 风险升级 | | 资料完整率 | 判断协同基础 | 完整关键资料主体/应维护主体 | 资源库 | 补齐主数据 | | 任务响应及时率 | 判断协同效率 | 按时完成任务/应完成任务 | 工单 | 培训或升级 | | 高风险事件数 | 判断供应风险 | 周期内高风险事件 | 风险记录 | 暂停、复审、备选 |  ## 9. Linkincrease 能力映射  | 行业需求或规则 | Linkincrease 对象或能力 | 数据、状态或权限影响 | 支持度 | 推荐方案 | | --- | --- | --- | --- | --- | | 维护供应商/工厂基础档案 | 资源库 | 主体唯一标识、等级、风险状态 | L2 | 供应商库/工厂库作为主数据 | | 汇总订单履约表现 | 跨 FlowSpace 数据、仪表盘 | 订单状态、计划/实际日期 | L2/LX | 先做可用字段看板，复杂 OTIF 待确认 | | 汇总质量和 CAP 表现 | 验货工单、CAP FlowSpace | 验货结论、CAP 状态和周期 | L2 | 质量和整改指标看板 | | 风险预警 | 自动化、消息、仪表盘 | 风险等级、逾期、证书到期 | L2 | 设置到期和逾期提醒 | | 供应商分级 | 资源库字段、人工评审 | 等级、原因、有效期、审批记录 | L2/LX | 首版建议人工评审后维护等级 | | 改善计划 | 工单或 FlowSpace | 措施、责任人、期限、证据 | L2 | 低绩效触发改善工单 |  ## 10. 测试关注点  | 类别 | 需要验证的内容 | | --- | --- | | 主流程 | 数据汇总、评审、等级发布、改善跟进 | | 权限 | 管理层、采购、供应商、服务商的指标可见边界 | | 状态 | 等级生效、暂停、观察、改善中、恢复 | | 数据 | 指标来源、去重、周期、历史快照 | | 异常 | 数据缺失、字段口径变化、人工调整 | | 审计 | 等级调整、风险变更、改善关闭记录 |  ## 11. 产品差距与需求候选  | 差距 | 业务影响 | 当前替代方案 | 建议优先级 | 去向 | | --- | --- | --- | --- | --- | | 供应商评分权重和综合得分模型未固化 | 难以跨客户复用 | 客户自定义字段 + 仪表盘 | P1 | 产品维护区评估 | | 跨 FlowSpace 指标口径依赖配置质量 | 看板可靠性受限 | 先做核心字段规范 | P0 | 数据分析支持 | | 风险等级自动更新规则待确认 | 自动化可能误判 | 人工评审后更新 | P1 | 待确认问题 |  ## 12. 产品成功应用  ### 客户识别信号  - 客户想知道哪些供应商表现好、哪些高风险。 - 客户已有订单、验货、CAP 数据，但无法联动分析。 - 客户想按供应商等级、风险、证书状态筛选订单或工厂。  ### 重点诊断问题  - 客户是否已有稳定数据来源？ - 绩效用于什么决策：分配订单、复审、暂停、谈判还是培训？ - 哪些指标必须精确计算，哪些可以先作为运营观察？ - 是否允许人工评审调整等级？  ### 方案输出入口  - 对应运营方案：[供应商绩效与风险看板方案](../../50-运营支持知识/03-业务场景案例库/供应商绩效与风险看板方案.md) - 能力边界：平台可以汇总流程数据和资源库状态；复杂评分模型和外部财务/产能风险需确认数据来源。  ## 13. 来源与可信度  | 来源 | 类型 | 证据等级 | 支撑结论 | 版本或日期 | | --- | --- | --- | --- | --- | | 跨 FlowSpace 数据整合实例 | 内部配置实践 | E3 | 跨流程指标和看板 | 当前版本 | | 供应链必备知识地图 | 行业总纲 | E4 | 供应商绩效维度 | 当前版本 | | 客户绩效评价样本 | 待补充 | E3 | 指标、权重和等级 | 待收集 |  ## 14. 待确认问题  - [ ] 收集至少 2 个客户供应商评分表或供应商月报样本。 - [ ] 数据分析确认首批可稳定落地的供应商绩效指标。 - [ ] 产品确认供应商等级是否应支持自动变更或仅人工评审。  ## 15. 关联知识  - 数据分析：[核心指标口径](../../60-数据分析支持/核心指标口径.md) - 运营方案：[跨 FlowSpace 数据整合实例](../../50-运营支持知识/04-监控与数据分析/跨FlowSpace数据整合实例.md) - 产品对象：[资源库](../../20-业务对象与数据模型/资源库.md)", "domain": "外贸供应链行业知识", "module": "行业知识", "tags": "供应商绩效;风险管理;指标;仪表盘;产品成功", "sources": []}, {"path": "docs/55-外贸供应链行业知识/03-业务流程与单据/出货计划与单证协同.md", "title": "出货计划与单证协同", "folder": "docs/55-外贸供应链行业知识/03-业务流程与单据", "text": "# 出货计划与单证协同  ## 1. 业务定义  出货计划与单证协同是围绕订单或出货批次安排发货时间、装运方式、关键截止节点，并收集、审核和归档商业发票、装箱单、提单、原产地证、保险单、报关资料等单证的过程。  本页关注协同、资料收集、审批和追踪；不替代专业货代系统、报关系统或贸易合规判断。  ## 2. 适用客户与前提  | 客户类型 | 适用方式 | | --- | --- | | 贸易公司 | 跟踪出货计划、工厂资料和客户单证确认 | | 品牌方/进口商 | 管理供应商出货资料、到港风险和单证完整性 | | Sourcing Agency | 协调供应商、工厂、货代、客户和内部团队 | | 供应商/工厂 | 提交出货信息、箱唛、装箱资料和附件 |  前提是客户明确出货节点、单证清单、责任人、截止日期和审核规则。  ## 3. 参与角色与责任  | 角色 | 主要责任 | 提供的数据 | 做出的决策 | | --- | --- | --- | --- | | 跟单/物流协调 | 维护出货计划和节点 | 出货日期、方式、货代、状态 | 是否推进单证审核 | | 供应商/工厂 | 提交出货和包装资料 | 箱数、重量、体积、装箱单、照片 | 确认资料准确 | | 货代/服务商 | 提供运输和单证信息 | 订舱、提单、截单、船期 | 运输安排建议 | | 客户/品牌方 | 审核关键单证和放行 | 审核意见、修改要求 | 放行、退回修改 | | 产品成功/实施 | 配置出货协同流程 | 模板、字段、权限和提醒 | 判断配置方案 |  ## 4. 核心业务对象  | 对象 | 定义 | 关键字段 | 与其他对象的关系 | | --- | --- | --- | --- | | 出货计划 | 一次发货安排 | 订单、批次、预计出货日、运输方式 | 关联订单和单证任务 | | 出货批次 | 一笔订单的一次或多次发货 | 批次数量、箱数、重量、体积 | 可关联多个单证 | | 单证任务 | 单证收集和审核任务 | 单证类型、责任人、截止日、状态 | 关联出货计划 | | 单证附件 | 具体文件 | 文件类型、版本、提交人、审核结果 | 作为审计资料 | | 异常记录 | 出货或单证问题 | 原因、影响、责任人、处理状态 | 可影响出货放行 |  ## 5. 标准业务流程  flowchart LR A[\"订单进入出货准备\"] --> B[\"创建出货计划/批次\"] B --> C[\"分派单证任务\"] C --> D[\"供应商/工厂  ## 12. 产品成功应用  ### 客户识别信号  - 客户说出货资料、装箱单、发票、提单等文件靠邮件催。 - 客户不知道某个订单是否可以出货、单证是否齐全。 - 客户存在分批出货、延期、退回修改和客户审核。  ### 重点诊断问题  - 出货是订单级还是批次级？ - 需要收集哪些单证，谁提交，谁审核？ - 哪些日期需要提醒？ - 单证审核是否影响出货放行？ - 是否需要和货代、ERP 或报关系统协同？  ### 方案输出入口  - 对应运营方案：[出货单证收集与审批方案](../../50-运营支持知识/03-业务场景案例库/出货单证收集与审批方案.md) - 能力边界：平台管理协同、附件、审批和提醒，不替代专业报关、清关或运输执行系统。  ## 13. 来源与可信度  | 来源 | 类型 | 证据等级 | 支撑结论 | 版本或日期 | | --- | --- | --- | --- | --- | | 订单管理类模板最佳实践 | 内部配置实践 | E3 | 出货节点、附件和批复配置 | 当前版本 | | 外贸供应链全景与端到端业务地图 | 行业总纲 | E4 | 出货与单证在链路中的位置 | 当前版本 | | 外贸单证协同行业实践 | 待补充来源 | E4 | 单证清单和出货流程 | 待验证 |  ## 14. 待确认问题  - [ ] 产品确认出货批次在订单、工单、子表或独立 FlowSpace 中的推荐模式。 - [ ] 产品成功补充客户常见单证清单和审核责任样本。 - [ ] 数据分析确认出货准时率和单证完整性的口径。  ## 15. 关联知识  - 产品权威规则：[订单](../../10-功能模块详情/订单.md)、[工单与批复](../../10-功能模块详情/工单与批复.md)、[自动化](../../10-功能模块详情/自动化.md) - 业务流程：[订单生命周期](../../30-业务流程与产品流程图/订单生命周期.md)", "domain": "外贸供应链行业知识", "module": "行业知识", "tags": "出货;单证;附件;审批;产品成功", "sources": []}, {"path": "docs/55-外贸供应链行业知识/03-业务流程与单据/生产进度与异常协同.md", "title": "生产进度与异常协同", "folder": "docs/55-外贸供应链行业知识/03-业务流程与单据", "text": "# 生产进度与异常协同  ## 1. 业务定义  生产进度与异常协同是采购方、贸易公司、供应商和工厂围绕采购订单或生产批次，管理生产准备、开工、过程进展、完工、偏差、纠正措施和预计恢复时间的过程。  该场景关注跨组织的信息透明和责任协同，回答：  - 订单是否具备开工条件。 - 当前实际完成了什么，而不是主观填报了多少百分比。 - 哪个阶段偏离计划，会不会影响验货和出货。 - 异常由谁负责、采取什么措施、何时恢复。 - 计划和承诺是否需要正式调整。  Linkincrease适合承载计划、任务、进度证据、异常、通知和审计，不等同于MES的工序排程、设备控制、工时采集和实时产量管理。  ## 1.1 在端到端供应链中的位置  flowchart LR A[\"采购订单确认\"] --> B[\"生产准备\"] B --> C[\"物料与产前条件确认\"] C --> D[\"开工与过程生产\"] D --> E[\"完工与待验货\"] E --> F[\"验货、整改和出货\"] B --> G[\"异常识别\"] C --> G D --> G E --> G G --> H[\"影响评估与责任分配\"] H --> I[\"纠正措施与恢复计划\"] I --> B I --> C I --> D I --> E  ## 2. 适用客户与前提  | 客户类型 | 典型诉求 | | --- | --- | | 品牌方、进口商 | 查看关键订单生产风险，提前干预可能延期或质量异常 | | 贸易公司、跟单团队 | 统一供应商和工厂进度填报，减少反复催问 | | 采购团队、Sourcing Agency | 跨供应商比较计划达成和异常响应 | | 供应商 | 汇总工厂执行情况，对采购方提供可信承诺 | | 工厂 | 按阶段提交物料、开工、产量、完工和现场异常 | | QC 或现场人员 | 核实现场进度、质量状态和待验货条件 |  落地前需要明确：  - 跟踪对象是订单、订单行还是生产批次。 - 是否需要物料级齐套和工序级进度。 - 进度由谁填报、谁确认、多久更新一次。 - 哪些数据必须提供照片、附件、数量或现场核实。 - 哪些异常会影响交期、质量或出货。  ## 3. 参与角色与责任  | 角色 | 主要责任 | 提供的数据 | 做出的决策 | | --- | --- | --- | --- | | 采购方或品牌方 | 明确订单要求、优先级和升级规则 | 要求交期、质量标准、变更 | 是否接受恢复计划或调整承诺 | | 跟单或采购人员 | 建立计划、催办、识别偏差和组织升级 | 阶段计划、沟通、影响判断 | 是否发起变更、验货或管理升级 | | 供应商 | 对整体履约承诺负责 | 生产安排、预计日期、异常和措施 | 提交恢复计划、协调工厂资源 | | 工厂计划或生产人员 | 执行并反馈实际生产 | 物料、开工、产量、完工、现场证据 | 调整生产安排和现场措施 | | QC 或现场人员 | 核实进度或质量事实 | 现场检查、照片、检验记录 | 提供专业核实结论 | | 管理者 | 处理跨订单和高风险问题 | 风险汇总、资源负荷、异常趋势 | 资源协调、优先级和供应商决策 |  ## 4. 核心业务对象  | 对象 | 定义 | 关键字段 | 关系 | | --- | --- | --- | --- | | 生产计划 | 对生产准备、开工、产出和完工的时间及数量安排 | 计划日期、数量、负责人、版本 | 来源于订单或订单行 | | 生产批次 | 一次相对独立的生产安排 | 批次号、产品、数量、工厂、计划 | 可对应一个或多个订单行 | | 生产阶段 | 用于管理生产过程的业务节点 | 阶段、计划起止、完成标准 | 包含进度任务 | | 进度记录 | 某次填报或核实的实际执行事实 | 日期、状态、完成数量、预计完成日、证据 | 关联阶段或批次 | | 物料或产前条件 | 开工前必须满足的条件 | 物料、样品、工艺、设备、包装、批准状态 | 影响是否允许开工 | | 异常 | 偏离计划、标准或承诺的事件 | 类型、发现时间、影响、等级、责任人、状态 | 影响订单、阶段或批次 | | 纠正或恢复措施 | 为消除异常影响采取的行动 | 措施、负责人、截止时间、预计恢复时间 | 关联异常 | | 变更记录 | 对订单或生产计划的正式调整 | 原值、新值、原因、批准和生效时间 | 可能由异常触发 |  ## 4.1 进度记录与当前状态  进度记录是多次发生的过程事实；当前状态是根据最新有效记录形成的视图。两者不能混为一个反复覆盖的字段。  建议保留：  - 每次填报的时间和填报人。 - 本次完成数量和累计完成数量。 - 当前阶段。 - 最新预计完成时间。 - 附件或现场证据。 - 审核或确认状态。 - 与上次填报相比的变化。  ## 5. 生产层级与粒度  | 粒度 | 适用情况 | 优点 | 风险 | | --- | --- | --- | --- | | 订单级 | 产品单一、周期短、一次生产 | 配置简单 | 容易掩盖订单行差异 | | 订单行级 | 多产品、不同交期或不同工厂 | 可准确跟踪产品明细 | 数据量和任务量增加 | | 生产批次级 | 分批生产、分批验货或分批出货 | 贴近真实执行 | 需要批次与订单行关系 | | 工序级 | 关键工序决定交期或质量 | 可定位瓶颈 | 更接近MES范围，维护成本高 |  Linkincrease应优先覆盖订单、订单行或关键生产批次的协同。若客户要求设备、工位、工时和工序级实时数据，应评估MES集成或外部数据接入。  ## 6. 标准业务流程  flowchart TD A[\"订单和生产要求确认\"] --> B[\"建立生产计划\"] B --> C[\"确认工厂、物料和产前条件\"] C --> D{\"满足开工条件?\"} D -->|否| E[\"记录缺口和责任人\"] E --> F[\"补齐物料、样品或批准\"] F --> C D -->|是| G[\"确认开工\"] G --> H[\"按周期提交实际产量和进度证据\"] H --> I{\"与计划存在偏差?\"} I -->|否| J[\"继续生产并更新预计完工时间\"] J --> K{\"达到完工标准?\"} K -->|否| H K -->|是| L[\"提交完工和待验货信息\"] I -->|是| M[\"创建异常并评估影响\"] M --> N[\"分配责任人和纠正措施\"] N --> O{\"影响订单承诺?\"} O -->|是| P[\"升级、变更评审和重排计划\"] O -->|否| Q[\"按恢复计划执行\"] P --> Q Q --> H  ## 6.1 推荐阶段  | 阶段 | 完成标准示例 | 典型证据 | | --- | --- | --- | | 生产计划确认 | 工厂、数量、计划日期和责任人已确认 | 生产计划、排期或确认记录 | | 物料准备 | 关键物料齐套或缺口有明确计划 | 物料清单、到料日期、照片 | | 产前确认 | 样品、规格、工艺和包装要求已批准 | 批准记录、样品或文件版本 | | 已开工 | 满足客户定义的真实开工条件 | 开工日期、首件或现场照片 | | 生产中 | 按约定频率提交数量、阶段和预计完成日 | 产量、进度、图片、说明 | | 已完工 | 完成约定数量并达到待验货条件 | 完工数量、日期、包装状态 | | 待验货 | 货物和资料满足验货安排条件 | 验货申请、地点、数量 |  “已开工”和“已完工”的行业定义必须由客户确认，不能只依赖人工选择状态。  ## 7. 进度模型  ## 7.1 进度表达方式  | 表达方式 | 适用场景 | 注意事项 | | --- | --- | --- | | 阶段状态 | 高层管理和跨组织协同 | 需要明确阶段完成标准 | | 完成数量/目标数量 | 可量化生产 | 注意不良、返工和单位换算 | | 完成百分比 | 管理摘要 | 应由数量或阶段推导，避免主观填写 | | 实际日期 | 开工、完工和提交事实 | 不能被计划日期覆盖 | | 预计完成日期 | 前瞻性判断 | 每次变化应保留历史和原因 | | 证据附件 | 现场核实 | 需要时间、来源和权限 |  ## 7.2 计划、实际与预测  建议区分：  - 基准计划：首次批准的生产计划。 - 当前计划：经过批准调整后的执行计划。 - 实际结果：真实发生的开工、产量和完工。 - 最新预测：根据当前情况预计的完成日期。  最新预测晚于基准计划不一定代表批准延期；是否修改对外承诺仍需业务决策。  ## 7.3 更新频率  更新频率可按风险和阶段设置：  - 长周期低风险订单：每周或关键节点更新。 - 临近交付订单：每日更新。 - 高风险或已延期订单：按恢复计划频率更新。 - 关键现场事件：发生后立即更新。  要求所有订单高频填报会增加无效工作，频率应服务于管理决策。  ## 8. 异常管理模型  异常不是普通评论或备注，应具备独立生命周期。  ## 8.1 异常分类  | 类别 | 示例 | | --- | --- | | 订单与技术 | 规格、数量、样品、包装或批准变化 | | 物料 | 缺料、来料延期、来料不合格、替代料待批 | | 产能与计划 | 排期冲突、产能不足、人员不足、插单 | | 设备与工艺 | 设备故障、模具问题、工艺不稳定 | | 质量 | 过程缺陷、返工、测试不通过、良率不足 | | 协作 | 信息未确认、处理人缺失、审批等待 | | 外部事件 | 停电、天气、政策、运输或不可抗力 |  ## 8.2 严重程度  | 等级 | 判断示例 | 管理动作 | | --- | --- | --- | | 一般 | 不影响当前订单承诺，可在阶段内解决 | 责任人跟进并按期关闭 | | 重要 | 可能影响关键阶段、质量或成本 | 通知采购方并提交恢复计划 | | 严重 | 已影响交期、质量放行或关键客户 | 管理升级、变更评审和每日跟踪 | | 紧急 | 可能造成重大损失、合规或停产风险 | 立即升级并启动应急方案 |  具体分级标准应结合客户品类、订单价值和影响定义。  ## 8.3 异常生命周期  stateDiagram-v2 [*] --> 已发现 已发现 --> 分析中 分析中 --> 处理中 处理中 --> 待验证 待验证 --> 已关闭 待验证 --> 处理中: 验证不通过 已发现 --> 已取消: 非异常或重复记录  每个异常至少记录：  - 发现时间、发现人和影响对象。 - 异常类型、描述和证据。 - 对数量、质量、计划和交付的影响。 - 责任人、措施和截止时间。 - 最新预计恢复时间。 - 是否需要订单变更或客户确认。 - 验证结果和关闭依据。  ## 9. 生产异常与CAP的边界  | 类型 | 关注点 | 适合的处理方式 | | --- | --- | --- | | 即时生产异常 | 恢复当前订单执行 | 异常任务、恢复措施、升级 | | 质量不合格 | 控制不合格品和放行 | 返工、复验、批复 | | CAP | 解决系统性根因并防止重复发生 | 根因、纠正、预防、验证 | | 订单变更 | 正式调整商业或交付承诺 | 变更申请、影响分析、批准 |  并非所有生产异常都需要CAP。重复、高风险或暴露系统性问题的异常，才适合进一步进入CAP。  ## 10. 异常、风险与控制措施  | 风险或异常 | 业务影响 | 识别方式 | 控制措施 | | --- | --- | --- | --- | | 进度长期不更新 | 风险发现滞后 | 超过规定时间无有效记录 | 定时提醒和升级 | | 主观百分比与实际数量不一致 | 管理  | 工序级实时生产控制 | 外部MES或API集成 | 设备、工时、工序和实时产量不属于当前协同模型 | L4/集成 | [集成方案](../../80-架构与技术方案/集成方案.md) |  ## 12.1 关键产品边界  - Linkincrease可以收集计划、阶段、数量、预计日期和证据，但不默认验证工厂填报是否与现场设备数据一致。 - 周期性进度适合使用多工单、子表明细或独立进度对象，推荐方式需要结合更新频率和统计要求。 - 动态和评论用于沟通，不应替代异常的类型、责任、期限、措施和状态。 - 自动化可提醒和更新字段，但复杂计划重排、产能平衡和关键路径计算需要另行评估。 - 生产工序、设备状态、工时、在制品和实时产量通常属于MES边界。  ## 13. 测试关注点  | 类别 | 需要验证的内容 | | --- | --- | | 主流程 | 生产计划、产前确认、开工、进度提交、完工和待验货 | | 多次记录 | 新增进度、累计数量、修改历史和最新状态汇总 | | 数量 | 0、负数、超订单量、单位变化、不良和返工数量 | | 日期 | 基准、当前计划、预测和实际日期的修改与延期判断 | | 权限 | 品牌方、供应商、工厂和QC的字段、附件和异常可见范围 | | 异常 | 创建、分派、升级、措施、验证、退回和关闭 | | 协作 | 处理人离职、协作团队退出、评论@和通知链接 | | 自动化 | 重复提醒、异常超期、计划更新冲突和执行失败 | | 状态 | 阶段完成、订单完成或取消后进度和异常是否还能处理 | | 审计 | 进度、预测日期、异常、措施和状态变化均可追溯 | | 集成 | 外部数据重复、延迟、乱序、失败和人工修正冲突 |  ## 14. 产品差距与需求候选  | 差距 | 业务影响 | 当前替代方案 | 建议优先级 | 去向 | | --- | --- | --- | --- | --- | | 周期性生产进度缺少统一对象模型 | 不同模板的数据结构和统计方式不一致 | 多工单或子表记录 | P0调研 | [待研究问题](../99-待研究问题/README.md) | | 异常缺少跨场景通用状态和字段规范 | 难以形成统一看板和测试资产 | 使用异常工单模板 | P0规范 | 行业知识和模板规范 | | 计划、预测和实际日期的变化规则未统一 | 无法准确判断延期和恢复 | 配置独立字段并人工复核 | P0调研 | 数据和产品评审 | | 缺少原生产计划与当前计划对比视图 | 难以衡量计划稳定性 | 历史记录或导出分析 | P1 | 产品维护区评估 | | 工厂产能和订单负荷缺少标准模型 | 无法跨订单预测产能冲突 | 外部数据或人工看板 | P1/集成 | 产品边界评估 |  ## 15. 产品成功应用  ### 客户识别信号  - 跟单人员每天通过群消息逐个询问生产进度。 - 供应商只提交“完成百分比”，但无法说明产量和预计完工日。 - 物料、样品或批准未完成，订单却已经显示生产中。 - 生产异常分散在聊天和邮件中，没有责任人和恢复计划。 - 管理层直到临近出货才发现延期。 - 多个订单集中在同一工厂，但无法看到风险聚集。  ### 重点诊断问题  - 客户按订单、订单行、生产批次还是工序跟踪？ - 生产过程有哪些关键节点，各节点如何判定完成？ - 是否需要物料齐套、样品批准和产前会等开工前置条件？ - 进度多久更新一次，由供应商还是工厂填报？ - 进度必须包含哪些数量、日期、照片或附件？ - 哪些异常需要立即升级，如何划分严重程度？ - 异常是否需要恢复措施、订单变更或CAP？ - 是否已有ERP或MES，哪些数据需要集成？ - 管理层需要按订单、供应商还是工厂查看哪些指标？  ### 方案输出入口  - 结合 [采购订单履约与交期跟踪](./采购订单履约与交期跟踪.md) 确定订单和交期主线。 - 参考 [订单管理类模板最佳实践](../../50-运营支持知识/02-日常运营任务/模板配置/订单管理类模板最佳实践.md) 设计里程碑和工单。 - 使用 [平台能力边界表达规范](../07-产品成功应用/平台能力边界表达规范.md) 说明MES、产能和计划重排边界。 - 使用 [业务方案输出模板](../07-产品成功应用/业务方案输出模板.md) 形成客户方案。  ## 16. 来源与可信度  | 来源 | 类型 | 证据等级 | 支撑结论 | 版本或日期 | | --- | --- | --- | --- | --- | | [订单管理类模板最佳实践](../../50-运营支持知识/02-日常运营任务/模板配置/订单管理类模板最佳实践.md) | 内部配置实践 | E3 | 生产计划、进度、异常和协作配置 | 当前版本 | | [工单与批复](../../20-业务对象与数据模型/工单与批复.md)等产品权威页 | 内部产品知识 | 不适用 | 任务、采集、批复、权限和状态边界 | 当前版本 | | [采购订单履约与交期跟踪](./采购订单履约与交期跟踪.md) | 行业场景 | E1/E3组合 | 订单、计划、交期和变更主线 | 当前版本 | | ASCM SCOR Digital Standard | 国际行业框架 | E1 | 生产转化和履约过程范围 | 当前公开版本 |  当前页面已形成生产协同的基础模型，但物料齐套、产能、工序和MES集成仍需结合具体客户与品类验证。  ## 17. 待确认问题  - [ ] 由产品确认周期性进度推荐使用多工单、子表还是独立FlowSpace。 - [ ] 由产品和测试定义累计产量、返工、不良和超量填报的通用校验规则。 - [ ] 由产品成功收集不同品类客户的生产节点、更新频率和证据要求。 - [ ] 确认异常与CAP之间的升级条件和数据关联方式。 - [ ] 评估ERP/MES进度数据进入Linkincrease后的去重、覆盖和人工修正规则。  ## 18. 关联知识  - 上游场景：[采购订单履约与交期跟踪](./采购订单履约与交期跟踪.md) - 产品规则：[里程碑](../../20-业务对象与数据模型/里程碑.md)、[工单与批复](../../20-业务对象与数据模型/工单与批复.md) - 协作规则：[动态与评论](../../40-权限、安全与审计/动态与评论.md) - 运营方案：[订单管理类模板最佳实践](../../50-运营支持知识/02-日常运营任务/模板配置/订单管理类模板最佳实践.md) - 测试支持：[异常场景与边界值库](../../45-测试支持/异常场景与边界值库.md) - 产品成功应用：[客户场景诊断清单](../07-产品成功应用/客户场景诊断清单.md)", "domain": "外贸供应链行业知识", "module": "行业知识", "tags": "外贸供应链;行业知识;产品成功", "sources": []}, {"path": "docs/55-外贸供应链行业知识/03-业务流程与单据/社会责任审核与CAP整改.md", "title": "社会责任审核与 CAP 整改", "folder": "docs/55-外贸供应链行业知识/03-业务流程与单据", "text": "# 社会责任审核与 CAP 整改  ## 1. 业务定义  社会责任审核与 CAP 整改用于评估工厂在劳工、健康安全、环境、管理体系和客户合规要求方面的表现，并对发现的不符合项进行整改、证据提交、复核和关闭。  本页关注审核协同和整改闭环，不替代专业审核标准、法规判断或第三方认证结论。  ## 2. 适用客户与前提  | 客户类型 | 适用方式 | | --- | --- | | 品牌方 | 管理工厂审核计划、报告、风险和整改闭环 | | 贸易公司/Sourcing Agency | 协调品牌方、工厂和审核服务商 | | 供应商/工厂 | 提交资料、接受审核、提交整改证据 | | 审核服务商 | 执行审核、提交报告、复核整改 |  前提是客户已经明确审核标准、审核频率、问题等级、整改要求和最终决策责任。  ## 3. 参与角色与责任  | 角色 | 主要责任 | 提供的数据 | 做出的决策 | | --- | --- | --- | --- | | 品牌方合规/采购负责人 | 定义审核要求和准入/暂停规则 | 审核标准、风险等级、复审规则 | 通过、条件通过、暂停、退出 | | 工厂 | 提交资料和整改证据 | 证书、制度、照片、整改说明 | 承诺整改计划 | | 审核服务商 | 执行现场或文件审核 | 审核记录、问题项、报告 | 给出专业建议 | | 供应商 | 协调工厂整改 | 责任人、计划、补充证据 | 确认整改执行 | | 产品成功/实施 | 设计审核和 CAP 配置方案 | 模板、权限、仪表盘 | 判断平台边界 |  ## 4. 核心业务对象  | 对象 | 定义 | 关键字段 | 与其他对象的关系 | | --- | --- | --- | --- | | 审核计划 | 一次审核安排 | 工厂、审核类型、日期、审核方 | 关联工厂资源库 | | 审核报告 | 审核结果文档和结论 | 结论、等级、报告附件、有效期 | 可写回工厂资源库 | | 不符合项 | 审核发现的问题 | 类别、等级、描述、证据 | 可生成 CAP 项 | | CAP 项 | 针对不符合项的整改闭环 | 根因、纠正措施、预防措施、责任人、期限、证据、复核结论 | 关联审核报告和工厂 | | 风险状态 | 工厂当前合规风险 | 等级、原因、有效期、限制 | 影响订单或准入使用 |  ## 5. 标准业务流程  flowchart LR A[\"触发审核\"] --> B[\"安排审核计划\"] B --> C[\"执行文件/现场审核\"] C --> D[\"上传报告和不符合项\"] D --> E{\"是否需整改?\"} E -- \"否\" --> F[\"更新工厂审核状态\"] E -- \"是\" --> G[\"创建 CAP 整改项\"] G --> H[\"工厂提交原因、措施和证据\"] H --> I[\"品牌方/服务商复核\"] I --> J{\"复核通过?\"} J -- \"否\" --> H J -- \"是\" --> K[\"关闭 CAP 并更新风险状态\"]  ## 6. 状态与业务规则  | 对象 | 状态或规则 | 进入条件 | 允许操作 | 退出条件 | | --- | --- | --- | --- | --- | | 审核 | 待安排 | 达到准入、复审或风险触发条件 | 指派服务商、确认日期 | 审核开始 | | 审核 | 报告待确认 | 审核已完成 | 上传/批复报告 | 结论确认 | | CAP | 待提交计划 | 不符合项需整改 | 填根因、纠正/预防措施 | 计划提交 | | CAP | 整改中 | 计划已确认 | 提交证据、延期申请 | 提交复核 | | CAP | 待复核 | 工厂提交证据 | 通过、退回、补充 | 关闭或退回 | | 工厂风险 | 有条件/暂停 | 严重问题或逾期未关闭 | 限制订单、升级审批 | CAP 关闭或重新评估 |  ## 7. 异常、风险与控制措施  | 风险或异常 | 业务影响 | 识别方式 | 控制措施 | | --- | --- | --- | --- | | CAP 没有根因和预防措施 | 整改流于形式 | 只提交照片或描述 | 表单必填根因/纠正/预防 | | 审核结论和准入状态脱节 | 高风险工厂继续被使用 | 工厂状态未更新 | 审核结论回写资源库 | | 整改逾期未升级 | 合规风险持续 | CAP 逾期 | 自动化提醒和升级 | | 报告有效期失效 | 复审漏做 | 有效期字段到期 | 到期提醒和复审计划 | | 把所有审核问题都强制 CAP | 运营过重 | 低风险建议项过多 | 按等级设置 CAP 触发规则 |  ## 8. 管理指标  | 指标 | 用途 | 建议口径 | 数据来源 | 管理动作 | | --- | --- | --- | --- | --- | | 审核完成率 | 看审核计划执行 | 已完成审核/计划审核 | 审核 FlowSpace | 催办服务商或工厂 | | 审核通过率 | 判断工厂合规水平 | 通过/完成审核 | 审核结论 | 分析风险来源 | | CAP 按期关闭率 | 判断整改执行力 | 按期关闭 CAP/应关闭 CAP | CAP 工单 | 催办和升级 | | 平均 CAP 关闭周期 | 判断整改效率 | 关闭时间减创建时间 | CAP 状态历史 | 优化整改流程 | | 高风险工厂数 | 管理供应链风险 | 高风险状态工厂数 | 工厂资源库 | 限制订单或复审 |  ## 9. Linkincrease 能力映射  | 行业需求或规则 | Linkincrease 对象或能力 | 数据、状态或权限影响 | 支持度 | 推荐方案 | | --- | --- | --- | --- | --- | | 审核计划协同 | FlowSpace、里程碑、工单 | 工厂、服务商、计划时间、任务处理人 | L2 | 建审核 FlowSpace | | 审核报告提交 | 附件、批复、资源库引用 | 报告附件、审核结论、有效期 | L2 | 报告作为工单附件并回写工厂库 | | 不符合项拆分 | 工单、子表、问题库 | 问题等级、责任人、期限 | L2/LX | 首版用 CAP 工单，复杂问题库待确认 | | CAP 闭环 | 独立 FlowSpace/工单、批复、自动化 | 根因、措施、证据、复核、关闭 | L2 | 按问题项创建 CAP 跟进 | | 工厂风险更新 | 资源库、自动化、仪表盘 | 风险等级、限制、有效期 | L2/LX | 关键状态人工复核后更新 | | 合规看板 | 仪表盘、报告 | 审核完成、CAP 逾期、高风险工厂 | L2 | 建审核与 CAP 看板 |  ## 10. 测试关注点  | 类别 | 需要验证的内容 | | --- | --- | | 主流程 | 审核计划、报告、CAP、复核、关闭 | | 权限 | 服务商、工厂、供应商、品牌方的数据隔离 | | 状态 | 条件通过、暂停、逾期、关闭、退回 | | 数据 | 报告附件、问题项、证据和资源库回写 | | 异常 | 延期、复核不通过、服务商变更、报告撤回 | | 审计 | 审核结论、CAP 关闭和风险等级变化 |  ## 11. 产品差距与需求候选  | 差距 | 业务影响 | 当前替代方案 | 建议优先级 | 去向 | | --- | --- | --- | --- | --- | | 审核标准和问题库未形成统一产品模型 | 难以跨客户复用问题分类 | 模板自定义字段 | P1 | 产品维护区评估 | | CAP 与工厂可用状态的强联动规则待确认 | 高风险工厂管控可能依赖人工 | 仪表盘提醒 + 人工状态维护 | P0 调研 | 待确认问题 | | 复杂合规标准版本管理待确认 | 不同客户标准差异大 | 附件和自定义字段 | P2 | 待研究 |  ## 12. 产品成功应用  ### 客户识别信号  - 客户说审核报告、整改照片、复核结论散落在邮件和聊天里。 - 客户无法知道哪些工厂审核过期或 CAP 逾期。 - 客户希望服务商和工厂只看到自己相关任务。  ### 重点诊断问题  - 审核是准入触发、周期复审、订单触发还是风险触发？ - 哪些问题必须 CAP，哪些只是观察项？ - CAP 关闭后是否影响工厂准入或订单使用？ - 谁拥有最终合规决策权？  ### 方案输出入口  - 对应运营方案：[工厂准入与审核整改方案](../../50-运营支持知识/03-业务场景案例库/工厂准入与审核整改方案.md) - 能力边界：平台承载流程、证据、复核、状态和看板，不替代专业合规判断。  ## 13. 来源与可信度  | 来源 | 类型 | 证据等级 | 支撑结论 | 版本或日期 | | --- | --- | --- | --- | --- | | 品牌方供应商与工厂准入协同方案 | 内部场景方案 | E3 | 审核、CAP、工厂状态联动 | 当前版本 | | 供应商与工厂准入行业页 | 内部行业样板 | E3 | 准入、审核、整改关系 | 当前版本 | | 社会责任审核行业实践 | 待补充来源 | E4 | 审核和 CAP 通用闭环 | 待验证 |  ## 14. 待确认问题  - [ ] 补充客户常用审核类型、问题等级和 CAP 字段样本。 - [ ] 产品确认 CAP 关闭是否可自动影响工厂风险状态。 - [ ] 确认不同审核报告有效期和复审提醒的通用配置模式。  ## 15. 关联知识  - 行业页：[供应商开发、准入与生命周期管理](./供应商与工厂准入.md) - 运营方案：[品牌方供应商与工厂准入协同方案](../../50-运营支持知识/03-业务场景案例库/外贸供应商治理/品牌方供应商与工厂准入协同方案.md) - 产品权威规则：[资源库](../../20-业务对象与数据模型/资源库.md)、[自动化](../../10-功能模块详情/自动化.md)", "domain": "外贸供应链行业知识", "module": "行业知识", "tags": "社会责任审核;CAP;整改;工厂风险;产品成功", "sources": []}, {"path": "docs/55-外贸供应链行业知识/03-业务流程与单据/订单变更异常索赔与结案.md", "title": "订单变更、异常、索赔与结案", "folder": "docs/55-外贸供应链行业知识/03-业务流程与单据", "text": "# 订单变更、异常、索赔与结案  ## 1. 业务定义  订单变更、异常、索赔与结案覆盖采购订单执行过程中发生的交期、数量、规格、工厂、价格、质量、出货和责任问题，以及这些问题如何记录、确认、处理、追责和关闭。  本页关注协同和审计闭环，不替代法务索赔、财务结算或合同系统。  ## 2. 适用客户与前提  | 客户类型 | 适用方式 | | --- | --- | | 贸易公司 | 处理订单执行中的延期、变更、客户投诉和结案 | | 品牌方/采购团队 | 管理供应商责任、质量异常和结案条件 | | Sourcing Agency | 协调供应商、工厂、客户和服务商处理异常 | | 供应商/工厂 | 提交原因、措施、证据和结果确认 |  前提是客户能够区分订单正常进度、普通异常、重大异常、索赔和结案条件。  ## 3. 参与角色与责任  | 角色 | 主要责任 | 提供的数据 | 做出的决策 | | --- | --- | --- | --- | | 跟单/订单负责人 | 记录和推进变更异常 | 变更原因、影响、处理结果 | 是否升级或关闭 | | 采购/客户负责人 | 确认商业影响 | 客户要求、责任判断 | 是否接受变更或索赔 | | 供应商/工厂 | 说明原因和改善措施 | 原因、计划、证据 | 是否承担责任 | | 质量/物流/财务 | 提供专业影响判断 | 缺陷、出货、费用数据 | 是否放行、扣款或补偿 | | 产品成功/实施 | 配置异常闭环和结案规则 | 模板、状态、权限、看板 | 判断平台边界 |  ## 4. 核心业务对象  | 对象 | 定义 | 关键字段 | 与其他对象的关系 | | --- | --- | --- | --- | | 订单变更 | 对订单关键字段的调整 | 变更类型、原值、新值、原因、审批 | 关联订单和历史记录 | | 异常记录 | 执行过程中需跟进的问题 | 类型、等级、责任方、影响、状态 | 可关联工单、附件和 CAP | | 索赔记录 | 涉及费用、补偿或责任追溯的事项 | 金额、币种、责任方、证据、结论 | 关联订单和异常 | | 结案检查 | 订单关闭前的核验 | 未完成任务、未关闭异常、单证、验货 | 决定是否结案 | | 处理措施 | 对异常的行动 | 措施、责任人、期限、证据 | 可作为工单 |  ## 5. 标准业务流程  flowchart LR A[\"订单执行中出现变化或问题\"] --> B[\"记录变更/异常\"] B --> C[\"评估影响和责任\"] C --> D{\"是否需要审批或升级?\"} D -- \"否\" --> E[\"执行处理措施\"] D -- \"是\" --> F[\"发起批复/升级\"] F --> E E --> G{\"是否涉及索赔?\"} G -- \"是\" --> H[\"登记索赔和证据\"] G -- \"否\" --> I[\"复核处理结果\"] H --> I I --> J{\"是否满足结案条件?\"} J -- \"否\" --> E J -- \"是\" --> K[\"订单结案并归档\"]  ## 6. 状态与业务规则  | 对象 | 状态或规则 | 进入条件 | 允许操作 | 退出条件 | | --- | --- | --- | --- | --- | | 变更 | 待确认 | 关键字段需要调整 | 提交原因、附件、审批 | 通过或驳回 | | 异常 | 待处理 | 订单出现延期、质量、资料或责任问题 | 指派、补充、处理 | 提交复核 | | 异常 | 待复核 | 处理措施完成 | 通过、退回、升级 | 关闭或继续处理 | | 索赔 | 待协商 | 涉及费用或责任 | 补证、确认金额、审批 | 确认或撤销 | | 订单 | 待结案 | 主要流程完成 | 检查未完成事项 | 结案或退回处理 |  ## 7. 异常、风险与控制措施  | 风险或异常 | 业务影响 | 识别方式 | 控制措施 | | --- | --- | --- | --- | | 订单字段直接改掉无记录 | 历史责任无法追溯 | 缺少变更原因和审批 | 使用历史记录、变更工单或批复 | | 异常无责任人和期限 | 问题长期悬挂 | 异常状态无推进 | 必填责任人/期限，自动提醒 | | 索赔证据不完整 | 商业谈判被动 | 缺少照片、报告、邮件、费用 | 附件和证据清单 | | 未关闭异常就结案 | 风险遗漏 | 结案前存在未关闭事项 | 结案检查清单 | | 普通异常过度 CAP 化 | 流程过重 | 所有问题都要求根因预防 | 设置 CAP 升级边界 |  ## 8. 管理指标  | 指标 | 用途 | 建议口径 | 数据来源 | 管理动作 | | --- | --- | --- | --- | --- | | 订单变更次数 | 判断订单稳定性 | 周期内变更记录数 | 历史记录/变更工单 | 分析变更原因 | | 异常关闭率 | 判断问题处理效率 | 已关闭异常/总异常 | 异常工单 | 催办和复盘 | | 平均异常关闭周期 | 判断协同效率 | 关闭时间减创建时间 | 异常状态 | 优化责任分派 | | 索赔金额和件数 | 判断商业风险 | 按供应商/品类/原因统计 | 索赔记录 | 供应商谈判 | | 结案一次通过率 | 判断流程质量 | 首次检查通过订单/待结案订单 | 结案检查 | 补流程控制 |  ## 9. Linkincrease 能力映射  | 行业需求或规则 | Linkincrease 对象或能力 | 数据、状态或权限影响 | 支持度 | 推荐方案 | | --- | --- | --- | --- | --- | | 记录订单变更 | 历史记录、工单、批复 | 原值、新值、原因、审批 | L2/LX | 重要变更建议用工单/批复保留原因 | | 异常处理闭环 | 工单、状态、自动化 | 类型、责任人、期限、证据 | L2 | 建异常处理工单 | | 索赔资料归档 | 附件、批复、字段 | 金额、责任方、证据、结论 | L2/LX | 首版用附件和审批记录 | | 结案检查 | 里程碑、工单、批复、视图 | 未完成任务、未关闭异常 | L2/LX | 建结案工单或结案前检查视图 | | 异常升级 CAP | CAP FlowSpace/工单 | 根因、纠正预防、复核 | L2 | 仅重大、重复或质量合规问题升级 | | 异常看板 | 仪表盘、报告 | 异常类型、状态、关闭周期 | L2 | 建异常运营看板 |  ## 10. 测试关注点  | 类别 | 需要验证的内容 | | --- | --- | | 主流程 | 变更、异常、索赔、复核、结案 | | 权限 | 供应商、工厂、内部团队、客户的可见和可操作边界 | | 状态 | 驳回、升级、撤销、关闭、重开 | | 数据 | 历史值、附件证据、金额、责任方 | | 异常 | 并发修改、人员离职、附件缺失、结案回退 | | 审计 | 变更原因、审批、关闭和结案记录 |  ## 11. 产品差距与需求候选  | 差距 | 业务影响 | 当前替代方案 | 建议优先级 | 去向 | | --- | --- | --- | --- | --- | | 订单关键字段变更审批模型待统一 | 不同客户规则差异大 | 工单/批复记录重要变更 | P1 | 产品维护区评估 | | 结案前强校验规则待确认 | 可能遗漏未关闭问题 | 视图/SOP 检查 | P0 调研 | 待确认问题 | | 索赔金额与财务系统边界待明确 | 财务闭环不完整 | 附件和字段记录 | P2 | 集成或财务边界评估 |  ## 12. 产品成功应用  ### 客户识别信号  - 客户说订单经常变更但追不清责任。 - 客户说质量、交期、单证异常处理靠人工催。 - 客户想知道订单能不能结案，但未完成事项散落多处。  ### 重点诊断问题  - 哪些变化必须审批，哪些只需记录？ - 异常分几类，谁负责，如何关闭？ - 什么情况下进入索赔或 CAP？ - 订单结案前必须满足哪些条件？  ### 方案输出入口  - 对应运营方案：[订单异常与结案协同方案](../../50-运营支持知识/03-业务场景案例库/订单异常与结案协同方案.md) - 能力边界：平台承载协同、证据和审计；商业索赔金额确认、合同责任和财务处理需客户专业流程确认。  ## 13. 来源与可信度  | 来源 | 类型 | 证据等级 | 支撑结论 | 版本或日期 | | --- | --- | --- | --- | --- | | 订单生命周期 | 内部产品知识 | 不适用 | 订单流程与状态基础 | 当前版本 | | 生产进度与异常协同 | 行业场景 | E3 | 异常处理和升级 | 当前版本 | | 客户订单异常实践 | 待补充 | E3/E4 | 变更、索赔、结案规则 | 待收集 |  ## 14. 待确认问题  - [ ] 产品确认订单结案前是否支持配置未关闭任务/异常强校验。 - [ ] 产品成功补充客户常见异常分类和索赔字段样本。 - [ ] 数据分析确认异常关闭周期和结案一次通过率口径。  ## 15. 关联知识  - 行业页：[采购订单履约与交期跟踪](./采购订单履约与交期跟踪.md)、[生产进度与异常协同](./生产进度与异常协同.md) - 产品规则：[订单生命周期](../../30-业务流程与产品流程图/订单生命周期.md)、[工单与批复](../../10-功能模块详情/工单与批复.md)", "domain": "外贸供应链行业知识", "module": "行业知识", "tags": "订单变更;异常;索赔;结案;产品成功", "sources": []}, {"path": "docs/55-外贸供应链行业知识/03-业务流程与单据/采购订单履约与交期跟踪.md", "title": "采购订单履约与交期跟踪", "folder": "docs/55-外贸供应链行业知识/03-业务流程与单据", "text": "# 采购订单履约与交期跟踪  ## 1. 业务定义  采购订单履约与交期跟踪是采购方、贸易公司、供应商和工厂围绕已确认采购订单，持续管理订单要求、阶段计划、责任人、进度、异常、质量放行、出货和结案的过程。  场景目标不是收集一个笼统的“完成百分比”，而是让各方基于相同订单、交期和阶段事实协作，尽早发现偏差，并形成可追溯的承诺、调整和处理记录。  本页重点覆盖采购订单确认后到出货或结案前的履约协同。需求预测、询报价、精细生产排程、库存核算、运输执行和财务结算属于相邻场景，只说明接口关系。  ## 1.1 在端到端供应链中的位置  flowchart LR A[\"需求、询价与定点\"] --> B[\"合同/采购订单确认\"] B --> C[\"生产准备\"] C --> D[\"生产与进度跟踪\"] D --> E[\"质量检验与放行\"] E --> F[\"出货准备与交付\"] F --> G[\"收货、结算与绩效\"] D --> H[\"异常与订单变更\"] H --> C H --> D H --> E H --> F  采购订单是商业承诺和履约跟踪的主线，但实际业务可能按照订单行、生产批次或出货批次分阶段执行。  ## 2. 适用客户与前提  | 客户类型 | 典型诉求 | | --- | --- | | 品牌方、进口商 | 查看供应商和工厂执行进度，提前识别延期、质量和出货风险 | | 贸易公司 | 协调客户订单、采购订单、供应商、工厂和物流节点 | | 采购团队、Sourcing Agency | 统一多供应商订单跟踪方式，减少邮件和表格催办 | | 供应商 | 接收订单要求、提交计划和进度、反馈异常与出货资料 | | 工厂 | 提交生产准备、生产进度、完工和质量数据 | | QC 或服务商 | 接收验货任务、提交结果并支持出货放行决策 |  实施该场景前，客户至少应明确：  - 跟踪对象是客户订单、采购订单、订单行还是生产批次。 - 谁承诺交期，谁维护计划，谁确认延期和出货。 - 各阶段需要提交什么证据。 - 哪些异常需要升级、审批或变更订单。  ## 3. 参与角色与责任  | 角色 | 主要责任 | 提供的数据 | 做出的决策 | | --- | --- | --- | --- | | 采购方或品牌方 | 确认订单要求、优先级和关键变更 | 订单、规格、请求交期、质量和交付要求 | 接受承诺、批准变更、放行或取消 | | 贸易公司或跟单人员 | 统筹订单计划、催办、异常和跨方沟通 | 计划、节点、沟通和风险信息 | 升级异常、调整协作计划 | | 供应商 | 承担商务履约和对采购方的承诺 | 承诺交期、生产安排、进度、异常、出货资料 | 接受订单、提出变更和补救方案 | | 工厂 | 执行生产并反馈实际进度 | 物料、开工、产量、完工、质量和现场异常 | 确认生产计划和纠偏措施 | | QC 或验货人员 | 执行检验和提交专业结论 | 验货计划、样本、缺陷、报告 | 给出检验结论，不一定承担商业放行 | | 物流或单证人员 | 准备出货计划和资料 | 订舱、截单、装柜、单证和运输节点 | 确认出货安排和资料完整性 | | 管理者 | 监控交付、风险和供应商表现 | 仪表盘和异常汇总 | 资源协调、风险升级和供应商决策 |  专业结论与商业决策需要分离。例如，QC提交验货结果，是否让步放行仍可能由品牌方决定。  ## 4. 核心业务对象与层级  | 对象 | 定义 | 关键字段 | 关系 | | --- | --- | --- | --- | | 客户订单或销售订单 | 客户对品牌方或贸易公司的需求承诺 | 客户、产品、数量、要求交期 | 可拆成多个采购订单 | | 采购订单 | 采购方向供应商发出的采购承诺 | PO号、供应商、币种、条款、订单日期、状态 | 包含一个或多个订单行 | | 订单行 | 采购订单中的产品和数量明细 | 产品/SKU、规格、数量、单价、交期 | 可拆成生产或出货批次 | | 生产工厂 | 实际执行生产的场所 | 工厂、准入状态、风险状态 | 关联供应商和订单 | | 履约计划 | 围绕订单建立的阶段和时间安排 | 阶段、负责人、计划起止时间 | 关联订单或订单行 | | 生产批次 | 一次具体生产安排 | 批次、数量、计划、实际产出 | 来源于一个或多个订单行 | | 出货批次 | 一次具体发运安排 | 批次、数量、计划出货日、实际出货日 | 可合并或拆分订单行 | | 进度记录 | 某阶段或任务的实际执行事实 | 状态、数量、日期、证据、填报人 | 关联阶段、任务或批次 | | 异常记录 | 对交期、质量、物料或协作偏差的结构化记录 | 类型、影响、责任人、措施、预计恢复时间 | 影响订单、阶段或批次 | | 订单变更 | 对已确认要求的正式调整 | 变更项、原值、新值、原因、批准人 | 影响计划、成本、质量和交付 |  ## 4.1 层级选择原则  | 业务情况 | 推荐跟踪层级 | | --- | --- | | 一个订单只有一个产品和一次交付 | 订单级 | | 一个订单包含多个产品或不同交期 | 订单行级 | | 同一产品分多次生产 | 生产批次级 | | 多个订单合并出货或一个订单分批出货 | 出货批次级 |  如果只在订单头维护一个进度和交期，可能掩盖部分订单行或批次已经延期的事实。  ## 5. 日期与交期口径  交期管理必须先统一日期含义，不能把所有日期都叫“交期”。  | 日期 | 业务含义 | 典型责任方 | | --- | --- | --- | | 请求交期 | 采购方希望完成或交付的日期 | 采购方 | | 供应商承诺交期 | 供应商评估后承诺的完成或交付日期 | 供应商 | | 当前计划日期 | 根据实际情况更新后的执行计划 | 跟单、供应商或工厂 | | 计划开工/完工日 | 生产阶段计划日期 | 工厂 | | 计划验货日 | 预计达到可验货条件的日期 | 供应商、工厂、QC | | 计划出货日 | 预计完成交货或装运的日期 | 供应商、物流 | | 实际完工日 | 实际达到完工标准的日期 | 工厂 | | 实际出货日 | 实际完成约定出货动作的日期 | 物流或供应商 | | 实际交付日 | 按约定地点完成交付的日期 | 由贸易条件和业务定义决定 |  不同贸易条件下“交付”发生的地点和风险转移节点可能不同。指标页面必须说明使用计划出货、实际出货、到港还是签收日期。  ## 5.1 基准日期与当前计划  建议同时保留：  - 原始请求日期：采购方最初要求。 - 原始承诺日期：供应商首次正式承诺。 - 当前承诺或计划日期：经批准调整后的最新日期。 - 实际日期：真实完成时间。  只覆盖原始日期会导致无法衡量承诺变化和真实延期；只保留原始日期又不维护当前计划，会让执行视图失去可操作性。  ## 6. 标准业务流程  flowchart TD A[\"创建或导入采购订单\"] --> B[\"供应商确认订单和交期\"] B --> C{\"能否满足要求?\"} C -->|否| D[\"提出交期、数量或条件变更\"] D --> E[\"采购方评审和确认\"] E --> B C -->|是| F[\"建立履约计划和责任人\"] F --> G[\"生产准备：工厂、物料、产前确认\"] G --> H[\"生产执行和阶段进度提交\"] H --> I{\"出现偏差或异常?\"} I -->|是| J[\"记录影响、措施和预计恢复时间\"] J --> K{\"是否需要订单变更或升级?\"} K -->|是| L[\"变更审批并重排计划\"] L --> H K -->|否| H I -->|否| M[\"达到验货条件\"] M --> N[\"验货、整改或放行\"] N --> O{\"允许出货?\"} O -->|否| P[\"返工、复验或让步审批\"] P --> N O -->|是| Q[\"出货资料和出货确认\"] Q --> R[\"订单结案和绩效回流\"]  ## 6.1 推荐阶段  | 阶段 | 目标 | 典型任务或证据 | | --- | --- | --- | | 订单确认 | 确认产品、数量、价格、交期和要求 | 订单确认、差异反馈、承诺日期 | | 生产准备 | 确认工厂、物料、样品和生产条件 | 工厂报备、物料齐套、产前确认 | | 生产中 | 获取可信生产进度和异常 | 开工、产量、照片、预计完工日 | | 验货与整改 | 判断质量是否满足放行条件 | 验货安排、报告、返工、复验 | | 出货准备 | 准备订舱、装箱和贸易资料 | 订舱、装箱单、发票、出货审批 | | 出货与结案 | 确认实际出货并沉淀结果 | 实际出货日、数量、异常、绩效 |  具体阶段应随品类、交付周期和客户管理方式调整，不应把模板阶段视为统一行业标准。  ## 7. 业务状态模型  需要区分三类状态：  | 状态层 | 说明 | 示例 | | --- | --- | --- | | 平台订单状态 | Linkincrease对象是否仍允许业务处理 | 进行中、已完成、已取消 | | 业务履约状态 | 采购订单当前所处业务阶段 | 待确认、生产准备、生产中、待验货、待出货、已出货、已结案 | | 风险或健康状态 | 是否存在影响履约的偏差 | 正常、预警、延期、高风险、阻塞 |  业务履约状态和风险状态应通过字段、里程碑、标签、公式或仪表盘表达，不能直接假设平台订单状态已经覆盖全部行业状态。  ## 7.1 阶段状态  | 阶段状态 | 含义 | | --- | --- | | 未开始 | 前置条件未满足或尚未到计划时间 | | 进行中 | 阶段已经启动并持续执行 | | 已完成 | 阶段完成标准已满足 | | 已取消 | 阶段不再执行，并保留原因 | | 阻塞 | 行业建议状态，可通过标签或字段表达；平台是否需要原生状态应另行评估 |  ## 8. 进度与延期判断  ## 8.1 进度证据  进度不能只有主观百分比，建议同时记录：  - 当前阶段和状态。 - 已完成数量与目标数量。 - 实际开始、完成或提交日期。 - 现场照片、报告、附件或系统数据。 - 填报人、填报时间和确认人。 - 下一步计划和预计完成时间。  ## 8.2 延期分类  | 类型 | 判断示例 | 管理动作 | | --- | --- | --- | | 阶段延期 | 当前日期超过阶段计划结束日且未完成 | 催办、升级、重排后续计划 | | 承诺延期 | 最新预计交付日晚于供应商承诺日 | 供应商提出恢复计划 | | 客户要求延期 | 最新预计交付日晚于采购方请求日 | 评估业务影响和替代方案 | | 已实际延期 | 实际交付日晚于目标日期 | 记录原因、影响和绩效 | | 潜在延期 | 关键前置任务延迟但最终交付日尚未变化 | 提前预警并采取纠偏措施 |  ## 8.3 延期原因  建议结构化分类：  - 订单或规格变更。 - 样品或确认延迟。 - 原材料短缺或质量问题。 - 产能、设备、人员或排期问题。 - 生产质量和返工。 - 验货、审核或审批等待。 - 物流、单证、报关或外部事件。 - 客户原因、供应商原因、工厂原因或不可抗力。  延期原因不能只用于事后统计，还应关联责任人、恢复措施和预计恢复时间。  ## 9. 订单变更与影响分析  | 变更类型 | 可能影响 | | --- | --- | | 产品、规格或包装 | 样品、物料、工艺、质量标准和单证 | | 数量 | 物料、产能、生产批次、出货批次和金额 | | 交期 | 生产计划、验货、订舱、运输和客户承诺 | | 供应商或工厂 | 准入、产能、质量、成本和合规风险 | | 价格或付款条件 | 合同、发票、审批和结算 | | 运输或贸易条件 | 成本、责任、风险、单据和交付日期口径 |  订单变更至少应记录：  1. 原值和新值。 2. 变更原因和提出人。 3. 影响范围。 4. 批准人和生效时间。 5. 是否需要重排阶段计划。 6. 是否通知供应商、工厂、QC和物流。  ## 10. 异常、风险与控制措施  | 风险或异常 | 业务影响 | 识别方式 | 控制措施 | | --- | --- | --- | --- | | 订单要求版本不一致 | 按旧规格或旧交期执行 | 订单、附件和沟通记录版本冲突 | 保留变更历史和生效版本 | | 供应商确认不及时 | 采购方无法判断是否能按期履约 | 超过确认时限仍无承诺 | 自动提醒、升级和替代评估 | | 进度填报缺少证据 | 管理层看到的进度不可信 | 只有百分比，无日期、数量或附件 | 定义阶段完成标准和必填证据 | | 未准入或高风险工厂生产 | 质量和合规风险 | 订单工厂与资源库状态不符 | 限制选择、风险提示或审批 | | 关键阶段延期未传导 | 后续验货和出货计划失真 | 前置阶段延期但后续计划未调整 | 影响分析、重排和通知 | | 订单变更未同步 | 工厂、QC或物流按旧要求执行 | 变更后相关任务仍使用旧数据 | 变更审批、版本和通知机制 | | 验货不通过仍出货 | 客诉、返工和索赔风险 | 验货结论与出货状态不一致 | 放行批复、阻断或例外审批 | | 分批交付被订单总状态掩盖 | 部分数量延期或缺失 | 订单头已完成但批次未完成 | 按订单行和出货批次跟踪 | | 完成订单过早 | 后续任务和资料无法继续处理 | 仍有未完成任务时完成订单 | 完成前校验或运营检查清单 |  ## 11. 管理指标  | 指标 | 用途 | 建议口径 | 数据来源 | 管理动作 | | --- | --- | --- | --- | --- | | 订单确认及时率 | 判断供应商响应效率 | 时限内确认订单数/应确认订单数 | 订单和确认任务 | 催办或调整供应商协同规则 | | 准时出货率 | 判断按计划完成出货能力 | 按期实际出货订单或批次数/应出货订单或批次数 | 计划和实际出货日 | 分析延期原因和供应商表现 | | OTIF | 判断是否按时足量交付 | 按约定日期且满足约定数量的交付数/应交付数 | 订单行、批次和实际交付 | 用于供应商绩效和采购决策 | | 平均延期天数 | 判断延期严重程度 | 延期对象的实际或预计日期减目标日期 | 日期字段 | 识别重点订单和系统性瓶颈 | | 阶段计划达成率 | 判断过程计划可靠性 | 按期完成阶段数/应完成阶段数 | 里程碑计划与实际时间 | 优化计划和提前预警 | | 异常关闭周期 | 判断问题响应效率 | 异常关闭时间减异常创建时间 | 异常工单 | 升级超期问题 | | 变更次数与影响订单数 | 判断需求稳定性 | 统计正式变更及受影响对象 | 历史和变更记录 | 改善前端确认和版本治理 | | 验货后准时出货率 | 判断质量环节对交付影响 | 验货完成后按期出货批次数/应出货批次数 | 验货和出货数据 | 协调QC、返工和物流计划 |  OTIF、准时出货和准时交付必须明确统计层级、目标日期、允许偏差、足量标准、分批规则和取消订单处理。  ## 12. 产品研发映射  | 行业需求或规则 | 产品对象或能力 | 数据、状态或权限影响 | 支持度 | 产品依据 | | --- | --- | --- | --- | --- | | 采购订单作为履约主记录 | FlowSpace订单、主表单 | 需要明确订单头与订单行/批次的数据层级 | L2 | [订单](../../20-业务对象与数据模型/订单.md) | | 按阶段管理计划和实际时间 | 里程碑、里程碑计划 | 可承载阶段计划、状态、负责人和提前/延迟标签 | L2 | [里程碑](../../20-业务对象与数据模型/里程碑.md) | | 供应商、工厂、QC提交进度和证据 | 工单、采集端、附件 | 需要按角色控制可编辑表单和处理人 | L2 | [工单与批复](../../20-业务对象与数据模型/工单与批复.md) | | 对验货、出货和关键变更做确认 | 工单批复、里程碑批复 | 专业结论和商业放行可能需要不同批复 | L2 | [工单与批复](../../20-业务对象与数据模型/工单与批复.md) | | 引用供应商、工厂、产品和风险信息 | 资源库、关联引用 | 需要历史快照、状态过滤和同步边界 | L2/LX | [资源库引用与同步](../../30-业务流程与产品流程图/资源库引用与同步.md) | | 交期临近、延期和异常自动提醒 | 自动化、消息通知 | 需要日期触发、条件判断、通知对象和失败日志 | L2 | [自动化执行](../../30-业务流程与产品流程图/自动化执行.md) | | 展示履约状态和风险 | 字段、标签、公式、仪表盘 | 业务状态和风险状态不能直接等同平台订单状态 | L2 | [订单生命周期](../../30-业务流程与产品流程图/订单生命周期.md) | | 保存订单变更和执行依据 | 历史记录、跟踪记录、动态、日志 | 需要区分字段变更、关键业务事件和系统更新 | L1/L2 | [订单跟踪记录](../../40-权限、安全与审计/订单跟踪记录.md) | | 支持订单行、生产批次和出货批次 | 子表、工单、关联FlowSpace或独立对象 | 通用对象模型和跨层状态汇总尚待评估 | LX | [字段、组件、子表、引用关系](../../20-业务对象与数据模型/字段、组件、子表、引用关系.md) | | 计算OTIF和订单绩效 | 仪表盘、报告、跨FlowSpace数据 | 需要明确日期、数量、批次、去重和权限口径 | LX | [核心指标口径](../../60-数据分析支持/核心指标口径.md) |  ## 12.1 关键产品边界  - 平台订单状态当前为进行中、已完成、已取消，不等于采购订单的完整履约状态。 - 里程碑计划可支持阶段日期，但复杂依赖关系、自动重排和关键路径能力需另行评估。 - Linkincrease适合收集和协同生产进度，不等同于MES的实时产量和工序控制。 - Linkincrease适合管理出货准备和单据协同，不等同于TMS、货代或报关系统。 - 订单行、生产批次、出货批次的通用建模方式尚未形成产品权威规则。  ## 13. 测试关注点  | 类别 | 需要验证的内容 | | --- | --- | | 主流程 | 创建订单、生成阶段、供应商确认、进度提交、验货、出货和完成订单 | | 数据层级 | 订单头、订单行、生产批次、出货批次之间的数量和状态汇总 | | 日期 | 请求、承诺、当前计划、实际日期及跨时区、空值和修改后的判断 | | 权限 | 品牌方、供应商、工厂、QC、物流只能查看和编辑授权范围 | | 状态 | 平台订单状态、里程碑状态、业务状态和风险状态之间不互相覆盖 | | 变更 | 数量、交期、产品、工厂变化后的计划、任务、通知和历史记录 | | 异常 | 处理人变化、协作方退出、并发提交、附件失效、自动化失败 | | 完成限制 | 完成或取消订单后，工单、批复、邮件和自动化行为符合产品规则 | | 指标 | 分批出货、部分交付、取消、重启和变更订单的统计口径 | | 审计 | 承诺、进度、异常、变更、验货放行和出货确认均可追溯 |  ## 14. 产品差距与需求候选  | 差距 | 业务影响 | 当前替代方案 | 建议优先级 | 去向 | | --- | --- | --- | --- | --- | | 订单行、生产批次和出货批次缺少统一模型 | 分批生产和交付难以准确汇总 | 使用子表、工单或拆分订单 | P0调研 | [待研究问题](../99-待研究问题/README.md) | | 原始承诺日期、当前计划和实际日期缺少统一口径 | 延期和供应商绩效可能失真 | 在模板中配置独立字段并保留历史 | P0调研 | 数据分析和产品评审 | | 阶段延期后缺少通用计划重排机制 | 后续验货和出货计划需要人工调整 | 自动提醒后由跟单人员调整 | P1 | 产品维护区评估 | | 业务履约状态与平台订单状态容易混淆 | 状态设计和测试结论不一致 | 使用独立业务状态字段和标签 | P0规范 | 产品知识和模板规范 | | OTIF和分批交付统计能力待验证 | 无法形成可靠绩效看板 | 导出或外部分析 | P1 | 数据分析和产品评审 |  以上为调研和需求候选，不代表已进入产品计划。  ## 15. 产品成功应用  ### 客户识别信号  - 客户通过Excel、邮件或群消息逐单催生产和出货。 - 同一个订单在采购方、供应商和工厂之间存在不同交期。 - 管理层只能看到最终延期，无法提前识别阶段风险。 - 供应商填报“完成80%”，但缺少数量、日期和证据。 - 订单变更后，工厂、QC或物流仍按旧要求执行。 - 分批生产或出货时，订单总状态无法反映剩余数量。  ### 重点诊断问题  - 客户主要跟踪客户订单、采购订单、订单行还是生产批次？ - 请求交期、供应商承诺交期和实际交付日分别是什么？ - 订单经过哪些固定阶段，每个阶段如何判定完成？ - 谁提交生产进度，需要哪些数量、日期、图片或报告证据？ - 哪些异常需要升级，谁负责提出和确认恢复计划？ - 订单变更由谁批准，如何通知所有受影响角色？ - 验货结论和商业出货放行是否由不同角色完成？ - 是否存在分批生产、分批验货、分批出货或合并出货？ - 客户希望用哪些指标评价订单和供应商？  ### 方案输出入口  - 使用 [客户场景诊断清单](../07-产品成功应用/客户场景诊断清单.md) 补齐业务现状。 - 参考 [订单管理类模板最佳实践](../../50-运营支持知识/02-日常运营任务/模板配置/订单管理类模板最佳实践.md) 设计配置。 - 使用 [平台能力边界表达规范](../07-产品成功应用/平台能力边界表达规范.md) 说明订单行、批次、计划重排和指标边界。 - 使用 [业务方案输出模板](../07-产品成功应用/业务方案输出模板.md) 形成客户方案。  ## 16. 来源与可信度  | 来源 | 类型 | 证据等级 | 支撑结论 | 版本或日期 | | --- | --- | --- | --- | --- | | [订单](../../20-业务对象与数据模型/订单.md)及订单相关权威页 | 内部产品知识 | 不适用 | Linkincrease订单、里程碑、工单、状态和权限边界 | 当前版本 | | [订单管理类模板最佳实践](../../50-运营支持知识/02-日常运营任务/模板配置/订单管理类模板最佳实践.md) | 内部配置实践 | E3 | 订单阶段、资源库引用、协作和仪表盘方案 | 当前版本 | | [外贸供应链全景与端到端业务地图](../外贸供应链全景与端到端业务地图.md) | 行业知识总纲 | E1/E3组合 | 场景在端到端供应链中的位置和系统边界 | 当前版本 | | ASCM SCOR Digital Standard | 国际行业框架 | E1 | 订单、寻源、生产和履约过程范围 | 当前公开版本 |  当前版本已经形成行业模型和产品映射，但日期口径、订单行/批次模型和OTIF规则仍需结合客户样本与产品能力验证。  ## 17. 待确认问题  - [ ] 由产品确认订单行、生产批次和出货批次在Linkincrease中的推荐建模方式。 - [ ] 由产品和数据团队定义请求交期、承诺交期、计划出货、实际出货和实际交付的标准字段口径。 - [ ] 由测试补充分批交付、订单变更、重启和跨角色并发的异常用例。 - [ ] 由产品成功收集至少三类客户的订单阶段、交期口径和异常升级方式。 - [ ] 确认完成订单前是否需要通用的未完成任务、未放行验货或未出货数量检查。  ## 18. 关联知识  - 全景总纲：[外贸供应链全景与端到端业务地图](../外贸供应链全景与端到端业务地图.md) - 产品规则：[订单](../../20-业务对象与数据模型/订单.md)、[里程碑](../../20-业务对象与数据模型/里程碑.md)、[工单与批复](../../20-业务对象与数据模型/工单与批复.md) - 运营方案：[订单管理类模板最佳实践](../../50-运营支持知识/02-日常运营任务/模板配置/订单管理类模板最佳实践.md) - 测试支持：[数据流转与校验规则](../../45-测试支持/数据流转与校验规则.md) - 数据分析：[核心指标口径](../../60-数据分析支持/核心指标口径.md) - 产品成功应用：[客户场景诊断清单](../07-产品成功应用/客户场景诊断清单.md)、[业务方案输出模板](../07-产品成功应用/业务方案输出模板.md) ", "domain": "外贸供应链行业知识", "module": "行业知识", "tags": "外贸供应链;行业知识;产品成功", "sources": []}, {"path": "docs/55-外贸供应链行业知识/04-质量合规与风险/README.md", "title": "04 质量合规与风险", "folder": "docs/55-外贸供应链行业知识/04-质量合规与风险", "text": "# 04 质量合规与风险  本分区沉淀质量检验、审核合规、整改闭环和供应链风险控制知识。  优先建设：  - 验货类型、缺陷分类和结果判定。 - 社会责任审核及报告。 - CAP 问题、责任、期限、证据和复核。 - 证书有效期、预警和失效控制。 - 供应商、工厂和订单风险识别。 ", "domain": "外贸供应链行业知识", "module": "行业知识", "tags": "外贸供应链;行业知识;产品成功", "sources": []}, {"path": "docs/55-外贸供应链行业知识/05-供应链指标/README.md", "title": "05 供应链指标", "folder": "docs/55-外贸供应链行业知识/05-供应链指标", "text": "# 05 供应链指标  本分区解释指标的行业含义、管理目的和常见计算方式。  指标进入 Linkincrease 仪表盘或报告前，还需要在 [60 数据分析支持](../../60-数据分析支持/README.md) 明确系统字段、数据来源、统计范围、刷新频率和权限。  优先建设：  - OTIF 与准时交付率。 - 验货通过率与缺陷率。 - CAP 按期关闭率。 - 准入周期和审核通过率。 - 供应商绩效及风险评分。 ", "domain": "外贸供应链行业知识", "module": "行业知识", "tags": "外贸供应链;行业知识;产品成功", "sources": []}, {"path": "docs/55-外贸供应链行业知识/06-行业到产品研发映射/README.md", "title": "06 行业到产品研发映射", "folder": "docs/55-外贸供应链行业知识/06-行业到产品研发映射", "text": "# 06 行业到产品研发映射  本分区面向产品、测试和研发，集中维护行业场景与 Linkincrease 业务对象、产品能力、数据规则、测试重点和产品差距之间的关系。  这里的映射用于帮助产品研发理解“行业为什么需要这项能力”以及“产品模型是否足以承载真实业务”。客户配置和业务方案应继续进入运营支持知识，不能用推荐方案覆盖已确认产品规则。  ## 通用映射  | 行业业务概念 | Linkincrease 承载方式 | | --- | --- | | 稳定、可复用的主数据 | 资源库 | | 重复执行的业务流程 | 业务模板、FlowSpace | | 一次业务实例 | 订单 | | 流程阶段 | 里程碑 | | 资料提交、现场执行或协作任务 | 工单 | | 审核、确认或放行决策 | 工单批复、里程碑批复 | | 外部企业参与 | 协作团队 | | 业务职责 | FlowSpace 业务角色 | | 数据可见范围 | 数据围栏、资源库数据范围 | | 提醒和数据更新 | 自动化、消息通知 | | 经营监控 | 仪表盘、报告 | | 过程追溯 | 动态、历史记录、操作日志 |  ## 场景矩阵  | 场景 | 主要配置对象 | 当前重点支持度 | 行业知识 | 客户方案 | | --- | --- | --- | --- | --- | | 供应商开发、准入与生命周期管理 | 供应商库、工厂库、准入 FlowSpace、审核工单、批复 | L2 配置支持，部分 LX | [行业页](../03-业务流程与单据/供应商与工厂准入.md) | [配置方案](../../50-运营支持知识/03-业务场景案例库/外贸供应商治理/品牌方供应商与工厂准入协同方案.md) | | 采购订单履约与交期跟踪 | 订单、里程碑、工单、自动化、仪表盘 | L2配置支持，批次和指标部分LX | [行业页](../03-业务流程与单据/采购订单履约与交期跟踪.md) | [订单管理最佳实践](../../50-运营支持知识/02-日常运营任务/模板配置/订单管理类模板最佳实践.md) | | 生产进度与异常协同 | 里程碑、工单、处理人、通知、异常记录 | L2配置支持，产能和MES部分L3/L4 | [行业页](../03-业务流程与单据/生产进度与异常协同.md) | [订单管理最佳实践](../../50-运营支持知识/02-日常运营任务/模板配置/订单管理类模板最佳实践.md) | | QC 验货与质量异常 | 验货工单、采集端、附件、批复、异常工单、CAP | L2 配置支持，缺陷库和强校验部分 LX | [行业页](../03-业务流程与单据/QC验货与质量异常.md) | [配置方案](../../50-运营支持知识/03-业务场景案例库/品牌方QC验货协同方案.md) | | 社会责任审核与 CAP | 审核 FlowSpace、问题项、CAP FlowSpace、复核批复、工厂风险 | L2 配置支持，工厂状态强联动部分 LX | [行业页](../03-业务流程与单据/社会责任审核与CAP整改.md) | [配置方案](../../50-运营支持知识/03-业务场景案例库/工厂准入与审核整改方案.md) | | 出货计划与单证协同 | 出货里程碑、资料工单、附件、批复、通知 | L2 配置支持，出货批次模型部分 LX | [行业页](../03-业务流程与单据/出货计划与单证协同.md) | [配置方案](../../50-运营支持知识/03-业务场景案例库/出货单证收集与审批方案.md) | | 供应商绩效与风险管理 | 资源库、跨 FlowSpace 数据、仪表盘、报告、改善工单 | L2 配置支持，综合评分模型部分 LX | [行业页](../03-业务流程与单据/供应商绩效与风险管理.md) | [配置方案](../../50-运营支持知识/03-业务场景案例库/供应商绩效与风险看板方案.md) | | 订单变更、异常、索赔与结案 | 订单、历史记录、工单、附件、批复、结案检查 | L2 配置支持，结案强校验和索赔财务边界部分 LX | [行业页](../03-业务流程与单据/订单变更异常索赔与结案.md) | [配置方案](../../50-运营支持知识/03-业务场景案例库/订单异常与结案协同方案.md) |  具体能力的支持度以场景知识页为准。产品行为发生变化时，应先更新产品权威页，再复核本矩阵。行业知识发现的差距只有经过产品评审后，才能进入正式需求和产品计划。", "domain": "外贸供应链行业知识", "module": "行业知识", "tags": "外贸供应链;行业知识;产品成功", "sources": []}, {"path": "docs/55-外贸供应链行业知识/07-产品成功应用/README.md", "title": "07 产品成功应用", "folder": "docs/55-外贸供应链行业知识/07-产品成功应用", "text": "# 07 产品成功应用  本分区帮助产品成功经理在不改变产品权威规则的前提下，使用行业知识完成客户沟通、场景诊断、能力边界判断和业务方案输出。  产品成功是本知识库的重要使用者，但不是行业知识层的唯一或主要维护目标。产品能力边界必须引用产品权威页；无法确认的能力不得对客户承诺。  ## 使用路径  识别客户类型和业务场景 -> 使用行业知识理解角色、对象、流程和风险 -> 使用诊断清单补齐客户现状 -> 对照产品能力边界 -> 引用运营支持区的配置方案 -> 输出客户业务方案及待确认事项  ## 应用资产  | 资产 | 用途 | 状态 | | --- | --- | --- | | [客户场景诊断清单](./客户场景诊断清单.md) | 帮助产品成功收集输出方案所需的最小信息 | 第一版 | | [平台能力边界表达规范](./平台能力边界表达规范.md) | 统一标准支持、配置支持、变通支持和暂不支持的对外表达 | 第一版 | | [业务方案输出模板](./业务方案输出模板.md) | 将客户现状转成业务目标、流程、配置、边界和实施步骤 | 第一版 |  ## 推荐使用顺序  1. 先用 [运营专业知识建设路线图](../运营专业知识建设路线图.md) 判断客户问题属于哪个 P0 场景。 2. 读取对应行业场景页，理解角色、对象、流程、状态、风险和指标。 3. 读取 `docs/50-运营支持知识/03-业务场景案例库` 的客户方案页，形成配置方案。 4. 使用 [平台能力边界表达规范](./平台能力边界表达规范.md) 标记 L1、L2、L3、L4、LX。 5. 方案试点后，沉淀到 `docs/50-运营支持知识/09-客户样本与方案复盘`。  ## 内容边界  | 内容 | 引用位置 | | --- | --- | | 行业角色、对象、流程、风险和指标 | 本目录的 `01` 至 `05` | | 产品现有功能、权限、状态和数据规则 | 产品权威目录 `10`、`20`、`30`、`40` | | 行业到产品研发和测试的映射 | [06 行业到产品研发映射](../06-行业到产品研发映射/README.md) | | 客户配置、上线和场景方案 | [50 运营支持知识](../../50-运营支持知识/README.md) | | 产品差距、反馈和需求候选 | [70 产品维护知识](../../70-产品维护知识/README.md) |", "domain": "外贸供应链行业知识", "module": "行业知识", "tags": "外贸供应链;行业知识;产品成功", "sources": []}, {"path": "docs/55-外贸供应链行业知识/07-产品成功应用/业务方案输出模板.md", "title": "业务方案输出模板", "folder": "docs/55-外贸供应链行业知识/07-产品成功应用", "text": "# 业务方案输出模板  本模板用于产品成功根据客户诊断结果输出业务方案。它引用产品规则，但不替代产品需求文档、详细配置清单或实施项目计划。  # 客户名称或项目名称：业务方案  ## 1. 客户背景与方案范围  - 客户类型： - 当前业务模式： - 本期场景： - 不在本期范围：  ## 2. 现状与核心问题  | 现状 | 业务影响 | 优先级 | | --- | --- | --- |  ## 3. 业务目标  明确希望改善的业务结果、管理动作和衡量指标。  ## 4. 角色与职责  | 角色 | 所属组织 | 主要职责 | 数据范围 | 审批或决策 | | --- | --- | --- | --- | --- |  ## 5. 目标业务流程  说明流程触发、阶段、任务、审批、异常和结束条件。  ## 6. 业务对象与数据设计  | 业务对象 | 主数据或过程数据 | 关键字段 | 数据来源 | 关联关系 | | --- | --- | --- | --- | --- |  ## 7. Linkincrease 方案  | 业务需求 | 产品对象或能力 | 推荐配置 | 支持等级 | 产品依据 | | --- | --- | --- | --- | --- |  ## 8. 权限与外部协作  说明团队、业务角色、协作团队、处理人和数据围栏。  ## 9. 通知、审计与分析  说明提醒、自动化、历史记录、日志、仪表盘和指标。  ## 10. 平台能力边界  | 能力 | 支持等级 | 当前限制 | 替代方案 | 待确认事项 | | --- | --- | --- | --- | --- |  ## 11. 实施与试点建议  分为数据准备、配置、角色测试、试点、培训、上线和复盘。  ## 12. 验收标准  以可执行的场景、输入、操作、预期结果和异常结果描述。  ## 13. 预期业务价值  将价值绑定到客户决策、流程效率、风险控制或数据可见性。  ## 14. 客户待确认事项  - [ ] 业务规则： - [ ] 角色和权限： - [ ] 数据来源： - [ ] 能力边界： ", "domain": "外贸供应链行业知识", "module": "行业知识", "tags": "外贸供应链;行业知识;产品成功", "sources": []}, {"path": "docs/55-外贸供应链行业知识/07-产品成功应用/客户场景诊断清单.md", "title": "客户场景诊断清单", "folder": "docs/55-外贸供应链行业知识/07-产品成功应用", "text": "# 客户场景诊断清单  本清单用于产品成功在输出业务方案前收集最小必要信息。具体场景还应补充对应行业知识页中的专业问题。  ## 1. 客户与业务范围  - 客户属于品牌方、贸易公司、采购团队、Sourcing Agency、供应商、工厂还是服务商？ - 本次希望解决哪个业务场景，明确不包含哪些相邻流程？ - 涉及哪些组织、地区、产品类别和业务规模？ - 当前主要使用 Excel、邮件、聊天工具、ERP、PLM、QMS 还是其他系统？  ## 2. 角色与协作  - 谁发起业务，谁提交数据，谁审核，谁最终决策？ - 哪些参与方属于客户内部，哪些属于外部企业？ - 外部企业是否需要自行指派成员？ - 各角色分别能看什么、填什么、修改什么和审批什么？  ## 3. 业务对象与数据  - 需要长期维护并复用的主数据有哪些？ - 每次流程执行产生哪些过程数据？ - 主体、订单、任务、报告和问题项之间如何关联？ - 是否有唯一编码、历史快照、附件、有效期和版本要求？ - 数据来自人工录入、导入、其他系统还是现场采集？  ## 4. 流程与状态  - 流程由什么事件触发，何时视为完成？ - 经过哪些阶段、任务、审核和例外处理？ - 有哪些状态，状态由谁改变？ - 哪些步骤可以退回、重启、取消或跳过？ - 逾期、驳回、信息不完整和人员变化时如何处理？  ## 5. 通知、审计与分析  - 哪些事件需要通知谁，通过什么渠道？ - 哪些操作必须保留历史和审计记录？ - 管理层需要看哪些待办、风险和结果指标？ - 指标用于做什么决策，数据从哪里产生？  ## 6. 平台边界确认  - 哪些需求可由标准功能直接满足？ - 哪些需要模板、资源库、权限、自动化或仪表盘配置？ - 哪些需要人工操作或外部系统配合？ - 哪些能力尚未确认，不能在现场承诺？ - 客户是否接受当前替代方案及其操作成本？  ## 7. 方案输出前检查  - [ ] 已区分客户原话、行业通行做法和推荐方案。 - [ ] 已引用产品权威规则确认能力边界。 - [ ] 已明确主数据、过程数据和系统间数据来源。 - [ ] 已列出角色、权限、状态、异常和审计要求。 - [ ] 已标记暂不支持、待确认和需要产品评审的内容。 - [ ] 已明确试点范围、验收标准和后续扩展范围。 ", "domain": "外贸供应链行业知识", "module": "行业知识", "tags": "外贸供应链;行业知识;产品成功", "sources": []}, {"path": "docs/55-外贸供应链行业知识/07-产品成功应用/平台能力边界表达规范.md", "title": "平台能力边界表达规范", "folder": "docs/55-外贸供应链行业知识/07-产品成功应用", "text": "# 平台能力边界表达规范  本规范用于产品成功、售前和实施人员准确表达 Linkincrease 能力，避免把行业建议、配置方案或需求候选说成现有产品能力。  ## 表达分级  | 等级 | 内部判断 | 推荐表达 | 必须说明 | | --- | --- | --- | --- | | L1 完全支持 | 标准功能直接满足 | “平台当前标准支持……” | 使用入口和适用条件 | | L2 配置支持 | 通过现有配置组合实现 | “可以通过……配置实现，方案需要结合贵司规则设计。” | 配置范围、实施工作和验收条件 | | L3 变通支持 | 需要人工步骤或外部工具 | “当前可以采用……作为过渡方案，但存在……限制。” | 操作成本、风险和不满足部分 | | L4 暂不支持 | 无法形成可接受闭环 | “当前版本尚不支持该能力。” | 不虚构发布日期，可记录需求评估 | | LX 待确认 | 产品规则或技术可行性未核实 | “这项能力需要进一步确认，我们会明确边界后回复。” | 待确认问题、责任人和回复结论 |  ## 禁止表达  - 不把“理论上可以”说成“已经支持”。 - 不把客户定制方案说成标准产品能力。 - 不把自动化、同步、权限或数据隔离能力在未验证时作口头承诺。 - 不承诺未经产品确认的版本范围和上线日期。 - 不用行业术语掩盖产品边界。  ## 边界记录表  | 客户需求 | 场景 | 支持等级 | 产品依据 | 推荐方案 | 限制 | 待确认项 | | --- | --- | --- | --- | --- | --- | --- |  产品依据应链接到产品权威页。L3、L4、LX 项应进入方案的“能力边界与风险”章节。 ", "domain": "外贸供应链行业知识", "module": "行业知识", "tags": "外贸供应链;行业知识;产品成功", "sources": []}, {"path": "docs/55-外贸供应链行业知识/08-行业知识来源/README.md", "title": "08 行业知识来源", "folder": "docs/55-外贸供应链行业知识/08-行业知识来源", "text": "# 08 行业知识来源  本分区登记书籍、法规、标准、客户实践、专家访谈、竞品材料和公开文章。来源登记不代表其中所有观点已经成为知识库结论。  ## 来源台账  | 来源名称 | 来源类型 | 主题 | 证据等级 | 版本或日期 | 状态 | 备注 | | --- | --- | --- | --- | --- | --- | --- | | Linkincrease 已确认产品规则 | 内部产品知识 | | 产品、研发、测试 | 采购订单履约 | 待研究 | | 完成订单前是否需要未完成任务、未放行质量或剩余数量校验 | 产品规则 | 产品、测试 | 采购订单履约 | 待确认 | | 周期性生产进度应使用多工单、子表还是独立进度对象 | 产品与数据模型 | 产品、研发、测试 | 生产进度 | 待研究 | | 累计产量、合格数量、不良、返工和超量的通用校验规则 | 行业与产品规则 | 产品、测试、产品成功 | 生产进度 | 待研究 | | 生产异常与CAP之间的升级条件和数据关联方式 | 流程与数据 | 产品、测试、产品成功 | 生产异常 | 待确认 | | ERP/MES进度数据与人工填报冲突时的来源优先级 | 集成与审计 | 产品、研发、测试 | 生产进度 | 待评估 | | 是否需要跨订单的工厂产能和负荷模型 | 产品边界 | 产品、产品成功、研发 | 生产计划 | 待评估 |", "domain": "外贸供应链行业知识", "module": "行业知识", "tags": "外贸供应链;行业知识;产品成功", "sources": []}, {"path": "docs/55-外贸供应链行业知识/README.md", "title": "55 外贸供应链行业知识", "folder": "docs/55-外贸供应链行业知识", "text": "# 55 外贸供应链行业知识  本目录沉淀能够映射到 Linkincrease 产品研发、测试验收和客户业务方案的外贸供应链知识。知识库整体仍以产品研发知识为主体，本目录负责补充行业业务依据，并尽可能为产品成功提供可复用的应用出口。  它不是书摘库，也不直接定义 Linkincrease 产品规则，而是连接行业业务、产品模型、测试场景、产品差距和客户方案的中间知识层。  ## 建设目标  每项知识都应形成以下转化链路：  行业事实与通行做法 -> 行业角色、对象、流程、规则、风险和指标 -> 产品对象、数据、权限、状态和测试映射 -> 产品支持度、差距和需求候选 -> 产品成功的客户诊断、能力边界和业务方案  无法进入上述链路的资料，只登记为来源或待读材料，不直接扩写为正式知识页。  ## 目录  在进入具体分区前，建议先阅读：  - [运营专业知识建设路线图](./运营专业知识建设路线图.md) - [外贸供应链全景与端到端业务地图](./外贸供应链全景与端到端业务地图.md) - [供应链必备知识地图](./供应链必备知识地图.md)  | 分区 | 内容 | | --- | --- | | [01 行业角色与商业关系](./01-行业角色与商业关系/README.md) | 品牌方、贸易公司、供应商、工厂、服务商等角色及责任边界 | | [02 业务对象与主数据](./02-业务对象与主数据/README.md) | 供应商、工厂、产品、订单、证书、报告等业务对象及关系 | | [03 业务流程与单据](./03-业务流程与单据/README.md) | 准入、采购、订单履约、验货、出货等流程与单据 | | [04 质量合规与风险](./04-质量合规与风险/README.md) | 质量检验、审核、CAP、证书和供应链风险 | | [05 供应链指标](./05-供应链指标/README.md) | 交付、质量、合规、整改和供应商绩效指标 | | [06 行业到产品研发映射](./06-行业到产品研发映射/README.md) | 行业场景与产品对象、规则、测试和差距的映射 | | [07 产品成功应用](./07-产品成功应用/README.md) | 客户诊断、能力边界判断和业务方案输出 | | [08 行业知识来源](./08-行业知识来源/README.md) | 书籍、标准、客户实践、访谈和竞品材料的来源登记 | | [99 待研究问题](./99-待研究问题/README.md) | 尚未验证、存在分歧或需要专家确认的问题 |  ## 与其他知识分区的边界  | 内容 | 归属 | | --- | --- | | 行业为什么这样运作、有哪些角色、对象和规则 | 本目录 `01` 至 `05` | | 行业知识如何支持产品模型、测试和差距判断 | 本目录 `06` | | 产品成功如何使用行业知识诊断客户和输出方案 | 本目录 `07` | | 客户如何使用 Linkincrease 配置并上线 | [50 运营支持知识](../50-运营支持知识/README.md) | | 供应链数字化成熟度、系统边界、数据治理和协同平台能力 | [56 数字供应链专项知识](../56-数字供应链专项知识/README.md) | | Linkincrease 已确认的功能、权限、状态和数据规则 | `10`、`20`、`30`、`40` 等产品权威目录 | | 竞品差异、客户反馈、需求候选和产品决策 | [70 产品维护知识](../70-产品维护知识/README.md) | | 指标的产品数据来源和报表口径 | [60 数据分析支持](../60-数据分析支持/README.md) |  行业通行做法不能直接写成产品已支持能力；单个客户的做法也不能直接写成行业标准。  ## 支持度分级  | 等级 | 定义 | 处理方式 | | --- | --- | --- | | L1 完全支持 | 标准功能可直接完成主要业务目标 | 引用产品权威页并给出配置入口 | | L2 配置支持 | 通过模板、资源库、权限、自动化等组合配置实现 | 沉淀可复用配置方案 | | L3 变通支持 | 需要人工步骤、外部工具或明显妥协 | 记录替代方案、限制和风险 | | L4 暂不支持 | 缺少关键能力，无法形成可接受闭环 | 进入产品维护区评估需求 | | LX 待确认 | 产品能力或行业规则尚未核实 | 进入待研究问题，不做确定结论 |  支持度按具体业务能力判断，不给整个场景只打一个笼统等级。  ## 证据等级  | 等级 | 来源 | 使用要求 | | --- | --- | --- | | E1 | 法规、国际标准、正式行业标准、官方规则 | 记录名称、版本、发布日期和适用范围 | | E2 | 多个客户实践、内部行业专家确认、稳定行业惯例 | 说明样本范围和确认人/确认时间 | | E3 | 单个客户实践、项目方案或竞品观察 | 明确标记为个案，不外推为通用规则 | | E4 | 书籍、文章、培训材料或待验证观点 | 只能作为研究线索，需进一步验证 |  ## 页面质量门槛  正式行业知识页至少需要：  1. 明确适用客户和业务边界。 2. 说明角色、对象、流程、状态或规则。 3. 至少有一个可追溯来源。 4. 完成 Linkincrease 能力映射。 5. 列出测试关注点。 6. 区分行业事实、推荐方案和产品现状。 7. 将不确定内容放入待确认问题。  ## 首批场景  | 优先级 | 场景 | 状态 | | --- | --- | --- | | P0 | [供应商开发、准入与生命周期管理](./03-业务流程与单据/供应商与工厂准入.md) | 第一版，待补来源 | | P0 | [采购订单履约与交期跟踪](./03-业务流程与单据/采购订单履约与交期跟踪.md) | 第一版，待客户样本验证 | | P0 | [生产进度与异常协同](./03-业务流程与单据/生产进度与异常协同.md) | 第一版，待客户样本验证 | | P0 | [QC 验货与质量异常](./03-业务流程与单据/QC验货与质量异常.md) | 第一版，待客户样本验证 | | P0 | [社会责任审核与 CAP 整改](./03-业务流程与单据/社会责任审核与CAP整改.md) | 第一版，待客户样本验证 | | P0 | [出货计划与单证协同](./03-业务流程与单据/出货计划与单证协同.md) | 第一版，待客户样本验证 | | P0 | [供应商绩效与风险管理](./03-业务流程与单据/供应商绩效与风险管理.md) | 第一版，待指标口径验证 | | P0 | [订单变更、异常、索赔与结案](./03-业务流程与单据/订单变更异常索赔与结案.md) | 第一版，待客户样本验证 | | P1 | 询价、报价、比价与定点 | 待评估 | | P1 | 样品开发与确认 | 待评估 | | P1 | 需求预测与采购计划 | 待评估 | | P1 | 物料准备与齐套管理 | 待评估 | | P1 | 国际物流与到货跟踪 | 待评估 | | P1 | 报关、清关与贸易合规 | 待评估 | | P1 | 对账、付款与结算 | 待评估 | | P1 | 退货、返工与召回 | 待评估 |  ## 维护流程  1. 从客户高频问题、产品需求、测试场景或行业研究中选题。 2. 在 [行业知识来源](./08-行业知识来源/README.md) 登记来源。 3. 使用 [行业知识页面模板](./行业知识页面模板.md) 提炼业务模型。 4. 在场景页中完成产品能力和测试映射。 5. 产品确认对象模型和能力边界，测试补充异常和边界，研发核对数据与实现约束。 6. 产品成功验证行业知识能否用于客户诊断和方案输出。 7. 将配置方案同步到 `50`，差距和需求候选同步到 `70`。 8. 定期复核来源版本、产品支持度和失效内容。", "domain": "外贸供应链行业知识", "module": "行业知识", "tags": "外贸供应链;行业知识;产品成功", "sources": []}, {"path": "docs/55-外贸供应链行业知识/供应链必备知识地图.md", "title": "供应链必备知识地图", "folder": "docs/55-外贸供应链行业知识", "text": "# 供应链必备知识地图  本页定义产品、测试、研发和产品成功理解外贸供应链时需要掌握的知识范围。目标不是培养每个人成为采购、生产、物流或关务专家，而是建立能够正确识别业务对象、流程、规则、风险、系统边界和产品机会的共同基础。  ## 1. 掌握层级  | 层级 | 要求 | | --- | --- | | L0 识别 | 知道术语和业务环节是什么，能够识别客户正在讨论的场景 | | L1 理解 | 能说明角色、对象、流程、状态、风险和主要单据 | | L2 建模 | 能将业务拆成主数据、流程数据、权限、状态、任务和指标 | | L3 方案 | 能结合 Linkincrease 能力边界输出配置或产品方案 |  产品和测试应至少达到重点场景的 L2；负责场景方案的产品成功应达到 L2 至 L3；研发至少需要理解所开发模块对应场景的 L1 至 L2。  ## 2. 供应链全局与运营模型  必须掌握：  - 供应链从需求、计划、采购、生产、质量到交付和结算的端到端关系。 - 信息流、实物流和资金流的区别及相互影响。 - 计划、订单、寻源、生产、履约、退货和治理等过程域。 - 供应链优化中的成本、交期、质量、库存、风险和服务水平权衡。 - 局部效率提升可能造成全链路问题，例如赶工提高成本、库存降低造成缺料风险。  产品价值：  - 避免把供应链理解成单一订单列表。 - 判断一个需求属于协同、主数据、专业执行还是分析能力。 - 识别 Linkincrease 与 ERP、MES、WMS、TMS、QMS、PLM 等系统的边界。  ## 3. 组织、角色与商业关系  必须掌握：  - 品牌方、进口商、客户、贸易公司、采购办公室和 Sourcing Agency 的区别。 - 供应商、工厂、分包工厂之间可能是一对多、多对多或动态关系。 - QC、审核、实验室、货代、承运人、报关行和仓库的职责。 - 商业责任、执行责任、审核责任和最终决策责任可以属于不同角色。 - 同一企业在不同业务中可能承担不同角色。  产品价值：  - 支撑组织、协作团队、业务角色、处理人和数据围栏设计。 - 避免把供应商账号、工厂主体和联系人混为同一对象。  ## 4. 业务对象与主数据  必须掌握：  - 客户、供应商、工厂、产品、款式、SKU、物料、证书和服务商等主数据。 - 询价、报价、合同、订单、订单行、生产批次、出货批次等过程对象。 - 主数据与交易快照的区别：历史订单不能随主数据变化而失真。 - 唯一标识、版本、有效期、归属、状态和对象关系。 - 主表与明细、一对多、多对多、引用与复制的区别。  产品价值：  - 支撑资源库、FlowSpace、订单、工单和字段引用的数据建模。 - 识别重复主体、历史快照、同步覆盖和跨流程关联风险。  ## 5. 计划、订单与变更  必须掌握：  - 预测、销售订单、采购计划、采购订单和生产计划之间的关系。 - 订单头与订单行、产品数量、价格、交期和交付批次。 - 订单确认、变更、拆分、合并、取消、重启和结案。 - 请求交期、承诺交期、计划完成日、实际完成日和出货日的区别。 - 订单变更对物料、生产、质量、物流、成本和付款的连锁影响。  产品价值：  - 支撑订单生命周期、里程碑、批量操作、历史记录和变更审计设计。 - 建立延期、准时交付和 OTIF 等指标的正确时间口径。  ## 6. 采购与供应商管理  必须掌握：  - 供应市场调查、供应商寻源、RFI/RFQ、报价、比价、谈判和定点。 - 供应商与工厂准入、试单、分级、绩效、复审、暂停和淘汰。 - 商务、产能、交付、质量、成本、财务、合规和协同评价维度。 - 单一来源、多来源、备选供应商和供应集中度风险。 - 供应商承诺与实际生产工厂执行之间的责任关系。  产品价值：  - 支撑供应商生命周期、询报价、审批、绩效和风险场景设计。  ## 7. 产品开发、物料与生产  必须掌握：  - 产品、款式、SKU、规格、BOM、物料和包装要求。 - 样品类型、样品版本、确认意见和量产转换。 - 产能、生产计划、物料齐套、开工、完工和生产批次。 - 关键生产节点、进度百分比和异常上报不等于真实产出。 - 规格或订单变更对物料、工艺和生产计划的影响。  产品价值：  - 支撑样品开发、生产里程碑、进度采集、版本和异常协同设计。 - 明确 Linkincrease 可做过程协同，但不一定承担精细生产排程和库存核算。  ## 8. 质量管理与合规  必须掌握：  - 来料检验、过程检验、成品检验、装运前验货等质量环节。 - 检验标准、抽样、AQL、严重/主要/次要缺陷及结果判定。 - 不合格、返工、复验、让步接收、拒收和放行。 - 工厂审核、社会责任审核、证书、测试报告和有效期。 - CAP 的问题、根因、纠正措施、预防措施、责任人、期限、证据和复核。 - 产品批次、供应商和工厂的追溯关系。  产品价值：  - 支撑验货组件、工单、批复、问题库、CAP、附件和审计设计。  ## 9. 外贸交易条件、物流与单据  必须掌握：  - Incoterms 用于划分交付地点、责任、成本和风险，但不替代完整销售合同。 - 运输方式、订舱、截单、装柜、开船、到港、清关和交付等节点。 - 商业发票、装箱单、提单、原产地证、保险单、报关资料等常见单据。 - 订单、出货批次、箱、运输单和贸易单据之间的数量与关联关系。 - 报关、清关、制裁、出口管制和目的国要求具有专业性和地区差异。  产品价值：  - 支撑出货节点、单据收集、截止时间、协作任务和异常提醒。 - 明确 Linkincrease 可以管理协同和资料，但不应默认替代专业报关或运输执行系统。  ## 10. 付款、成本与结算  必须掌握：  - 预付款、赊销、信用证、托收等常见付款安排的基本差异。 - 订单金额、费用、税费、运费、保险、索赔和退款。 - 订单、收货、验货、发票和付款之间需要核对。 - 汇率、信用、单据不符和付款延迟风险。  产品价值：  - 帮助识别资金字段、审批、单据和状态需求。 - 明确财务记账、资金支付和信用证专业处理通常属于外部系统边界。  ## 11. 风险、韧性与负责任供应链  必须掌握：  - 供应中断、产能、质量、交付、物流、信用、汇率、合规和地缘风险。 - 风险发生概率、影响、暴露订单、应对措施和责任人。 - 供应商分层、多来源、备选方案和业务连续性。 - 人权、劳工、环境、反腐败等供应链尽职调查的基本逻辑。 - 风险监控不能只保存一个静态等级，应关联证据、时间和业务影响。  产品价值：  - 支撑风险字段、预警、审批、仪表盘、审计和供应商治理设计。  ## 12. 指标与决策  必须掌握：  - 交付：OTIF、准时交付率、延期天数、订单周期。 - 质量：验货通过率、缺陷率、返工率、投诉和质量成本。 - 供应商：准入周期、报价响应、交付、质量、协同和风险评分。 - 整改：CAP 按期关闭率、平均关闭周期、重复问题率。 - 计划：预测准确率、计划达成率、产能负荷和缺料影响。 - 物流：准时出货、准时到货、运输异常和单据准确率。  每个指标都必须回答：  1. 用于什么管理决策。 2. 统计对象和时间范围是什么。 3. 分子、分母和排除项是什么。 4. 数据来自哪里，由谁维护。 5. 指标异常后采取什么动作。  ## 13. 建议学习和建设顺序  | 阶段 | 知识重点 | 对应场景 | | --- | --- | --- | | 第一阶段 | 角色、主数据、订单、交期、质量、风险 | 准入、订单跟踪、验货、CAP | | 第二阶段 | 寻源、样品、生产、出货和单据 | 询报价、样品开发、生产协同、出货协同 | | 第三阶段 | 计划、库存、物流、结算和韧性 | 预测、齐套、运输、对账、供应链风险 |  首批建设应优先选择与 Linkincrease 产品能力和现有客户问题联系最紧密的场景，再逐步扩展到需要外部系统集成的领域。  ## 14. 参考入口  - [ASCM SCOR Digital Standard](https://www.ascm.org/corporate-solutions/standards-tools/scor-ds/) - [ICC Incoterms® Rules](https://iccwbo.org/business-solutions/incoterms-rules/) - [WTO Trade Facilitation](https://wto.org/tradefacilitation) - [OECD Due Diligence for Responsible Business Conduct](https://www.oecd.org/en/topics/due-diligence-for-responsible-business-conduct.html)  正式专题页仍需结合具体品类、国家或地区法规、客户实践和产品规则补充来源。", "domain": "外贸供应链行业知识", "module": "行业知识", "tags": "外贸供应链;行业知识;产品成功", "sources": []}, {"path": "docs/55-外贸供应链行业知识/外贸供应链全景与端到端业务地图.md", "title": "外贸供应链全景与端到端业务地图", "folder": "docs/55-外贸供应链行业知识", "text": "# 外贸供应链全景与端到端业务地图  本页是外贸供应链行业知识的总纲，用于帮助产品、测试、研发和产品成功从端到端视角理解各业务环节之间的关系。它不要求 Linkincrease 覆盖供应链的全部环节，而是为产品定位、能力边界、场景设计和客户方案提供共同业务坐标。  ## 1. 外贸供应链的范围  外贸供应链连接市场需求、产品开发、供应商、工厂、采购订单、生产、质量、跨境交付和资金结算。  可以将完整链路概括为：  flowchart LR A[\"市场需求与销售机会\"] --> B[\"预测与采购计划\"] B --> C[\"供应商寻源、评估与准入\"] C --> D[\"询价、报价、比价与定点\"] D --> E[\"产品/样品开发与确认\"] E --> F[\"合同与采购订单\"] F --> G[\"物料准备与生产计划\"] G --> H[\"生产进度与异常协同\"] H --> I[\"质量检验与整改\"] I --> J[\"出货计划、订舱与单证\"] J --> K[\"报关、运输、清关与交付\"] K --> L[\"对账、付款与结案\"] L --> M[\"绩效、风险、复盘与复购\"] M --> B  供应商治理、质量合规、数据管理、风险控制和绩效分析贯穿全链路，不是独立于订单之外的一次性工作。  ## 2. 端到端过程域  本知识库使用七个过程域组织供应链场景。该划分参考供应链运营的通用过程思想，并结合外贸业务进行了本地化表达。  | 过程域 | 核心问题 | 典型业务 | | --- | --- | --- | | 治理与协同 | 谁参与、按什么规则协作、如何控制风险 | 组织角色、权限、标准、合规、主数据、绩效 | | 计划 | 未来需要什么、何时需要、需要多少 | 需求预测、采购计划、交付计划、产能和资源计划 | | 订单与交易 | 买卖双方承诺了什么 | 询报价、合同、订单、价格、数量、交期、付款和变更 | | 寻源与采购 | 向谁采购、供应能力是否可信 | 寻源、准入、定点、供应商分配、采购执行 | | 产品与生产 | 如何把需求转成可交付产品 | 样品、BOM、物料、生产计划、进度、异常 | | 质量与合规 | 产品和生产过程是否满足要求 | 检验、验货、审核、证书、CAP、追溯和召回 | | 履约与逆向 | 如何完成跨境交付并处理异常 | 订舱、单证、报关、运输、收货、索赔、退货和结案 |  ## 3. 贯穿全链路的业务主线  ### 3.1 需求到订单  将市场需求、销售预测或客户订单转成采购需求和供应计划。主要风险是需求变化、数据版本不一致、计划与产能脱节。  ### 3.2 供应商到工厂  选择商业合作主体并识别实际生产场所。主要风险是供应商和工厂关系不透明、未经批准的分包、能力与订单不匹配。  ### 3.3 订单到生产  把合同或采购订单中的产品、数量、交期和质量要求转成生产计划。主要风险是物料不齐、产能不足、变更未同步和进度失真。  ### 3.4 生产到质量放行  通过过程控制、检验和验货判断产品能否进入下一阶段或出货。主要风险是标准不一致、抽检结论失真、问题未整改和未经授权放行。  ### 3.5 出货到交付  将订单转成出货批次、运输和贸易单据，完成报关、运输、清关和收货。主要风险是单据不一致、责任边界不清、延误、短装、破损和清关异常。  ### 3.6 交付到结算和复购  核对订单、出货、收货、质量和发票数据，完成付款、索赔、绩效评价和后续采购决策。  ## 4. 关键角色与责任链  | 角色 | 主要责任 | | --- | --- | | 品牌方、进口商、客户 | 提出需求和标准，做出采购、质量放行和商业决策 | | 贸易公司、采购办公室、Sourcing Agency | 寻源、议价、订单协调、供应商和交付管理 | | 供应商 | 承担商务履约责任，协调工厂、物料、质量和交付 | | 工厂、分包工厂 | 承担实际生产、过程质量和现场合规责任 | | QC、审核或实验室 | 执行检验、验货、审核、测试并提供专业结论 | | 货代、承运人、仓库 | 承担订舱、仓储、运输和交接 | | 报关行、海关及监管机构 | 承担申报、查验、放行和监管 | | 财务、银行、保险机构 | 承担信用、付款、融资、保险和索赔处理 |  同一组织可能承担多个角色。知识库应按业务责任建模，不能只按企业名称判断权限和数据归属。  ## 5. 核心业务对象  | 对象域 | 典型对象 | | --- | --- | | 组织与关系 | 客户、供应商、工厂、分包工厂、服务商、组织关系 | | 产品与物料 | 产品、款式、SKU、规格、BOM、物料、包装 | | 交易与订单 | 询价、报价、合同、销售订单、采购订单、订单行、变更 | | 计划与生产 | 需求、采购计划、产能、生产计划、生产批次、进度 | | 质量与合规 | 检验标准、验货、缺陷、测试、审核、证书、CAP | | 物流与单据 | 出货批次、订舱、装箱单、发票、提单、原产地证、报关单 | | 资金与绩效 | 应付、付款、索赔、成本、绩效、风险和供应商等级 |  这些行业对象不能机械地一一对应为 Linkincrease 系统对象。产品设计应先判断对象是稳定主数据、流程实例、阶段、任务、决策还是分析结果。  ## 6. 信息流、实物流与资金流  供应链不能只按流程节点理解，还需要同时观察三类流：  | 流 | 内容 | 常见问题 | | --- | --- | --- | | 信息流 | 预测、订单、规格、状态、证书、报告、单据 | 信息延迟、版本不一致、重复录入、权限不清 | | 实物流 | 物料、在制品、成品、样品、退货 | 数量差异、批次失联、延误、破损和库存不准 | | 资金流 | 价格、预付款、尾款、费用、索赔、退款 | 条件不清、单据不匹配、汇率和信用风险 |  Linkincrease 当前更适合承载跨组织信息流、任务协同、过程留痕、主数据复用和管理分析。涉及库存核算、生产排程、运输执行、报关申报或财务记账时，应明确与 ERP、MES、WMS、TMS、报关或财务系统的边界。  ## 7. 外贸供应链典型场景地图  ### P0：与 Linkincrease 当前能力高度相关  | 场景 | 主要业务价值 | 关键对象 | | --- | --- | --- | | 供应商开发、准入与生命周期管理 | 建立可信供应网络并控制合作风险 | 供应商、工厂、证书、审核、状态 | | 采购订单履约与交期跟踪 | 提升订单进度透明度和按期交付能力 | 订单、里程碑、任务、交期、异常 | | 生产进度与异常协同 | 让供应商、工厂和采购方及时协同 | 生产计划、进度、物料、异常、责任人 | | QC 验货与质量异常 | 结构化收集检验结果并控制放行 | 检验标准、验货、缺陷、批复 | | 社会责任审核与 CAP 整改 | 形成审核、整改、复核闭环 | 审核、报告、问题项、CAP | | 出货计划与单证协同 | 降低出货资料缺失和节点延误 | 出货批次、订舱、单证、截止时间 | | 供应商绩效与风险管理 | 用历史履约结果支持采购决策 | 交付、质量、协同、合规、风险 | | 订单变更、异常、索赔与结案 | 控制变更影响并保留责任依据 | 变更、异常、损失、索赔、结案 |  ### P1：重要但需要明确产品边界  | 场景 | 常见系统边界 | | --- | --- | | 询价、报价、比价与定点 | 需要价格权限、版本、币种、税费和商业审批 | | 样品开发与确认 | 需要样品版本、评审意见、规格和量产转换 | | 需求预测与采购计划 | 可能依赖 ERP、销售和库存数据 | | 物料准备与齐套管理 | 可能依赖 BOM、库存、采购和生产系统 | | 国际物流与到货跟踪 | 可能依赖货代、承运人或 TMS 数据 | | 报关、清关与贸易合规 | 可能依赖专业申报和合规系统 | | 对账、付款和结算 | 可能依赖 ERP、财务和银行系统 | | 退货、返工和召回 | 需要批次追溯、库存和财务处理 |  ## 8. 与 Linkincrease 的定位关系  Linkincrease 不需要成为覆盖全部供应链交易和执行的单体系统。更适合重点解决：  - 跨企业、跨团队和跨角色的流程协同。 - 供应商、工厂、产品、证书和问题项等主数据复用。 - 订单、里程碑、工单和批复驱动的过程管理。 - 外部参与者的数据采集、任务处理和审核。 - 权限、数据围栏、历史记录和审计追溯。 - 自动提醒、状态联动、仪表盘和业务分析。  产品设计和客户方案都应明确：  1. 哪些数据以 Linkincrease 为主。 2. 哪些数据来自外部系统。 3. 哪些环节由 Linkincrease 协同，但不负责专业执行或财务核算。 4. 哪些结果需要回写资源库或其他系统。  ## 9. 阅读路径  1. 先读本页建立端到端全景。 2. 阅读 [供应链必备知识地图](./供应链必备知识地图.md) 掌握各知识域的最低要求。 3. 进入 [业务流程与单据](./03-业务流程与单据/README.md) 查看具体场景。 4. 进入 [行业到产品研发映射](./06-行业到产品研发映射/README.md) 判断产品对象、规则和差距。 5. 产品成功进入 [产品成功应用](./07-产品成功应用/README.md) 完成客户诊断和方案输出。  ## 10. 参考框架  - [ASCM SCOR Digital Standard](https://www.ascm.org/corporate-solutions/standards-tools/scor-ds/)：用于校验供应链端到端过程域。 - [ICC Incoterms® Rules](https://iccwbo.org/business-solutions/incoterms-rules/)：用于理解货物交付中的任务、成本和风险分配。 - [WTO Trade Facilitation](https://wto.org/tradefacilitation)：用于界定货物移动、放行、清关和过境流程的知识范围。 - [OECD Due Diligence for Responsible Business Conduct](https://www.oecd.org/en/topics/due-diligence-for-responsible-business-conduct.html)：用于界定供应链负面影响识别和风险尽调范围。  这些框架用于建立知识地图和校验业务范围，不表示 Linkincrease 已支持其中全部过程或专业能力。", "domain": "外贸供应链行业知识", "module": "行业知识", "tags": "外贸供应链;行业知识;产品成功", "sources": []}, {"path": "docs/55-外贸供应链行业知识/行业知识页面模板.md", "title": "行业知识页面模板", "folder": "docs/55-外贸供应链行业知识", "text": "# 行业知识页面模板  复制本模板创建具体行业知识页。删除无关提示，但不要省略“来源与可信度”和“待确认问题”。  # 场景或主题名称  ## 1. 业务定义  说明该主题解决什么业务问题，以及不包含哪些相邻场景。  ## 2. 适用客户与前提  | 客户类型 | 适用方式 | | --- | --- | | 品牌方 |  | | 贸易公司 |  | | Sourcing Agency |  | | 供应商或工厂 |  |  ## 3. 参与角色与责任  | 角色 | 主要责任 | 提供的数据 | 做出的决策 | | --- | --- | --- | --- |  ## 4. 核心业务对象  | 对象 | 定义 | 关键字段 | 与其他对象的关系 | | --- | --- | --- | --- |  ## 5. 标准业务流程  使用步骤表或 Mermaid 图说明触发条件、阶段、输入、输出和责任人。  ## 6. 状态与业务规则  | 对象 | 状态或规则 | 进入条件 | 允许操作 | 退出条件 | | --- | --- | --- | --- | --- |  ## 7. 异常、风险与控制措施  | 风险或异常 | 业务影响 | 识别方式 | 控制措施 | | --- | --- | --- | --- |  ## 8. 管理指标  | 指标 | 用途 | 计算口径 | 数据来源 | 管理动作 | | --- | --- | --- | --- | --- |  ## 9. 产品研发映射  | 行业需求或规则 | 产品对象或能力 | 数据、状态或权限影响 | 支持度 | 产品依据 | | --- | --- | --- | --- | --- |  支持度使用 L1、L2、L3、L4 或 LX。  ## 10. 测试关注点  | 类别 | 需要验证的内容 | | --- | --- | | 主流程 |  | | 权限 |  | | 状态 |  | | 数据 |  | | 异常 |  | | 审计 |  |  ## 11. 产品差距与需求候选  | 差距 | 业务影响 | 当前替代方案 | 建议优先级 | 去向 | | --- | --- | --- | --- | --- |  尚未经过产品评审的内容只能称为“需求候选”。  ## 12. 产品成功应用  ### 客户识别信号  说明客户出现哪些问题时，应使用本场景知识。  ### 重点诊断问题  -  ### 方案输出入口  - 对应运营支持方案： - 需要说明的平台边界：  ## 13. 来源与可信度  | 来源 | 类型 | 证据等级 | 支撑结论 | 版本或日期 | | --- | --- | --- | --- | --- |  ## 14. 待确认问题  - [ ] 问
