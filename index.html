明 | |---|---| | 编辑日志 | 展示创建、编辑、采集、批复、导入等操作 | | 字段修改次数统计 | 统计字段被修改次数 | | 历史快照 | 切换到当前选中操作记录对应的字段快照 |  快照差异标记：  | 差异 | 标记 | |---|---| | 本次新增内容 | 绿色 | | 本次删除内容 | 红色 | | 本次修改内容 | 原内容红色，新内容绿色 | | 创建记录 | 不显示新增或删除标记 |  字段修改次数统计只统计创建以外的修改记录，并且变更前后值不一致才计数。排序按模板布局顺序，支持搜索字段。  ## 订单主表单历史记录  订单主表单历史记录记录创建订单和编辑订单历史。  | 项目 | 规则 | |---|---| | 编辑日志 | 包括创建、编辑，按操作时间倒序 | | 字段统计 | 统计主表单字段修改次数 | | 快照 | 展示当前选中操作记录的主表单快照 |  订单导入新增或更新时，也会生成订单主表单历史记录。批量编辑订单时，被编辑订单主表单增加编辑历史记录。  ## 工单历史记录  工单历史记录可从修改类动态后的“查看历史”进入，用于查看工单创建、采集、批复的历史快照。  | 项目 | 规则 | |---|---| | 编辑日志 | 包括创建、采集、批复，按操作时间正序 | | 动态定位 | 从某条修改动态进入时，定位到对应菜单 | | 字段统计 | 统计工单字段被修改次数 | | 快照 | 展示当前选中操作记录的工单快照 |  采集提交、批复提交、导入工单、批量创建工单、自动化更新和外部 API 更新，都可能增加工单历史记录。  ## 里程碑批复历史记录  里程碑批复历史记录规则同工单历史记录，主要记录里程碑批复创建、编辑、批复等操作。  自动化创建里程碑批复、更新里程碑批复，或外部 API 同步创建、更新里程碑批复时，也会增加对应历史记录。  ## 资源库数据历史记录  资源库数据列表中，每条数据增加“历史记录”查看按钮。可见该条数据的人都可以查看历史记录。  | 项目 | 规则 | |---|---| | 查看权限 | 可见该条资源库数据的人可查看 | | 排序 | 按操作时间正序 | | 默认查看 | 点击历史记录按钮后默认查看最新一条记录 | | 游客操作 | 增加分享人信息 |  资源库导入新增或修改、手动编辑资源库数据、分享链接中的游客编辑等，都应形成可追溯历史。  ## 邮件协作历史记录  邮件协作历史记录记录邮件协作者提交数据的历史。发出邮件时不记录历史，提交数据时记录。  运营端邮件协作列表中的历史记录，列表和操作规则同贸易端。  ## 系统来源快照  系统来源写入历史记录时，应明确操作人和操作文案。  | 来源 | 操作人 | 典型文案 | |---|---|---| | 公式自动更新 | 系统 | 自动更新 | | 自动化更新 | 自动化 | 更新订单、创建工单、更新工单、更新工单批复、创建里程碑批复、更新里程碑批复 | | 外部API同步 | 来源标识或对应操作人 | 创建订单、编辑订单、创建工单、编辑工单、编辑工单批复、编辑里程碑批复 |  快照仍需展示更新前后字段值，并用红色和绿色标出差异。  ## 关联页面  - [动态与评论](./动态与评论.md) - [订单跟踪记录](./订单跟踪记录.md) - [资源库](../20-业务对象/资源库.md) - [邮件协作](../60-协作通知与自动化/邮件协作.md)  ## 来源  - `source:thoughts-v2-current/v2.2.x/贸易端/【贸易端】【订单详情】查看&操作.md` - `source:thoughts-v2-current/v2.2.x/贸易端/【贸易端】【订单详情】工单&里程碑批复操作.md` - `source:thoughts-v2-current/v2.7/贸易端/【贸易端】【资源库】SCCS应用数据范围、数据编辑历史记录.md` - `source:thoughts-v2-current/v2.2.x/贸易端/【贸易端】【订单详情】邮件协作.md` - `source:thoughts-v2-current/V2.4.x/贸易端/系统自动执行的相关操作日志.md` "}, {"path": "docs/80-日志审计/系统与集成执行日志.md", "title": "系统与集成执行日志", "folder": "docs/80-日志审计", "text": "﻿# 系统与集成执行日志  ## 定位  系统与集成执行日志用于追溯非普通用户手动操作产生的数据变化，包括公式自动更新、自动化执行、资源库数据同步、SCMPro API 数据变更、外部 API 集成同步和运营端自动化记录。  这类记录需要同时进入业务审计链路，避免系统写入的数据无法解释来源。  ## 系统执行来源  | 来源 | 说明 | |---|---| | 公式自动更新 | 公式字段根据依赖字段自动重新计算 | | 自动化更新 | FlowSpace 自动化程序根据触发条件执行动作 | | 关联资源库同步 | 资源库数据或引用字段配置变化后，同步更新订单数据 | | SCMPro API 数据变更 | 第三方系统数据变化后自动更新 Linkincrease | | 外部 API 集成 | 运营端配置外部 API 后，外部数据创建或更新订单、工单等 |  ## 公式自动更新  公式自动更新仅增加订单跟踪记录、动态和历史记录，不更新数据创建人或更新人。  | 模块 | 记录规则 | |---|---| | 订单跟踪记录 | 主表单公式字段更新时增加记录 | | 动态 | 里程碑批复、工单批复、工单采集中的公式字段更新时增加动态，归类为修改记录 | | 历史记录 | 里程碑批复、工单批复、工单采集中的公式字段更新时增加历史记录 |  操作人显示为系统，操作时间为自动更新时间，历史快照展示公式字段更新前后的值。  ## 自动化更新  自动化更新同普通用户操作逻辑，增加订单跟踪记录、动态、历史记录，并更新数据更新时间和更新人。  | 模块 | 记录规则 | |---|---| | 订单跟踪记录 | 主表单内容更新、里程碑首次创建工单、订单状态变更、里程碑状态变更时记录 | | 动态 | 创建里程碑批复、更新里程碑批复、创建工单、更新工单、更新工单批复时记录 | | 历史记录 | 主表单更新、创建工单、更新工单、更新工单批复、创建或更新里程碑批复时记录 | | 数据更新时间/更新人 | 更新时间为自动化执行时间，更新人为自动化 |  操作人显示为自动化，头像为系统。  ## 自动化执行日志  贸易端自动化配置中可查看自动化执行日志。运营端也提供 FlowSpace 自动化记录列表，用于平台级追踪。  ### 贸易端执行日志  每条自动化执行日志可以查看执行记录。详情中每个节点都可以查看配置流程和具体执行数据。  执行记录按自动化配置的数据源展示：  | 数据源 | 执行记录展示 | |---|---| | 订单基本信息 | 被执行 `$订单ID` | | 里程碑批复 | 被执行 `$订单ID_$里程碑名称 里程碑批复` | | 工单 | 被执行 `$订单ID_$里程碑名称_$工单名称` |  ### 运营端自动化记录  运营端自动化记录列表支持按 FlowSpace、团队、自动化、触发类型、执行状态、触发时间、执行时间筛选。  | 字段 | 说明 | |---|---| | FlowSpace名称、CODE | 对应 FlowSpace 基础信息 | | 所属团队、团队码 | 对应团队基础信息 | | 订单ID、订单码 | 自动化涉及的订单信息 | | 自动化名称、自动化ID | 自动化基础信息 | | 触发类型 | 新增数据、数据变更、到达时间、定时任务 | | 触发数据 | 订单信息、工单信息、里程碑批复 | | 执行动作 | 自动化执行的动作 | | 执行状态 | 成功、失败、已失效、待执行 | | 执行结果摘要 | 成功或失败摘要 | | 执行时间 | 自动化实际执行时间 |  列表按创建时间倒序。详情展示规则同贸易端。  ## 关联资源库同步  因关联的是资源库数据 ID，订单侧不增加记录。资源库自身数据历史记录仍需保留资源库数据被编辑、导入、分享编辑等操作来源。  ## 外部API集成日志  外部 API 集成日志展示一定时间范围内的同步日志。  | 字段 | 说明 | |---|---| | 时间 | 触发同步的时间 | | 事件类型 | 创建、更新 | | 同步方向 | 正向、反向 | | 数据标识 | 外部或 Linkincrease 数据标识 | | 状态 | 成功、失败 | | 详情 | 记录成功或失败说明 |  外部系统同步到贸易端业务数据后，还需要写入订单跟踪记录、工单动态和历史记录。  典型记录：  | 模块 | 文案口径 | |---|---| | 订单跟踪记录-创建订单 | `$操作人 在 $来源标识 操作了数据，同步创建了订单` | | 订单跟踪记录-更新订单 | `$操作人 在 $来源标识 操作了数据，同步更新了订单` | | 订单跟踪记录-里程碑开始 | `$操作人 在 $来源标识 操作了数据，同步在 $里程碑名称 创建了工单，里程碑开始` | | 工单动态-创建工单 | `$操作人 在 $来源标识 操作了数据，同步创建了工单` | | 工单动态-更新工单采集 | `$操作人 在 $来源标识 操作了数据，同步更新了工单` | | 工单动态-更新工单批复 | `$操作人 在 $来源标识 操作了数据，同步更新了工单批复，工单无法继续编辑` | | 动态-更新里程碑批复 | `$操作人 在 $来源标识 操作了数据，同步更新了里程碑批复` |  ## 软件更新记录  运营端软件管理包含软件更新管理和软件更新记录。当前用于采集端 APP、Android 平台。  | 能力 | 规则 | |---|---| | 软件更新管理 | 相同产品类型、软件类型只展示最近更新的一条记录 | | 软件更新记录 | 记录每一次更新 | | 查看详情 | 可查看更新详情并下载安装包 | | 更新日志 | 文字，可换行，暂不需要富文本 |  记录字段包括产品、平台、发布时间、支持最小版本、当前版本、更新人、更新时间。  ## 关联页面  - [自动化配置](../60-协作通知与自动化/自动化配置.md) - [自动化与系统执行日志](../60-协作通知与自动化/自动化与系统执行日志.md) - [第三方数据对接](../50-模板表单与数据/第三方数据对接.md) - [历史记录与快照](./历史记录与快照.md) - [订单跟踪记录](./订单跟踪记录.md)  ## 来源  - `source:thoughts-v2-current/V2.4.x/贸易端/系统自动执行的相关操作日志.md` - `source:thoughts-v2-current/V2.4.x/贸易端/【贸易端】【自动化】一期.md` - `source:thoughts-v2-current/V2.4.x/运营端/【运营端】【SCCS管理】SCCS自动化记录.md` - `source:thoughts-v2-current/V2.5.x/运营端/【运营端】【SCCS管理】SCCS列表增加外部api集成配置.md` - `source:thoughts-v2-current/V2.4.x/运营端/【运营端】【设置-软件管理】软件相关信息与记录管理.md` "}, {"path": "docs/80-日志审计/订单跟踪记录.md", "title": "订单跟踪记录", "folder": "docs/80-日志审计", "text": "﻿# 订单跟踪记录  ## 定位  订单跟踪记录是订单级业务过程日志，用于追踪订单、里程碑、工单、翻单、订单关联、FlowSpace 关联等关键业务节点。它回答“这个订单经历了哪些关键事件”。  ## 查看权限  只有拥有当前订单“查看跟踪记录”权限的成员，才能在订单详情中看到跟踪记录入口并查看内容。  ## 记录字段  每条跟踪记录至少包含：  | 字段 | 说明 | |---|---| | 操作人 | 头像、姓名；系统执行时可为系统、自动化或第三方来源 | | 操作时间 | 事件发生时间 | | 事件 | 按操作类型生成的记录文案 |  排序按操作时间正序。  ## 订单操作  | 操作 | 触发页面 | 记录文案 | |---|---|---| | 创建订单 | 订单列表创建订单、导入订单 | `$操作人 创建订单` | | 编辑订单 | 订单列表、订单详情、批量编辑、导入更新 | `$操作人 编辑订单` | | 删除订单 | 订单详情、订单列表 | `$操作人 删除订单` | | 完成订单 | 订单详情、订单列表批量修改状态 | `$操作人 完成订单` | | 取消订单 | 订单详情、订单列表批量修改状态 | `$操作人 取消订单` | | 重启订单 | 订单详情、订单列表批量修改状态 | `$操作人 重启订单` |  订单完成、取消、重启后，均增加跟踪记录。  ## 里程碑与工单操作  | 操作 | 触发页面 | 记录文案 | |---|---|---| | 里程碑开始 | 首次创建工单、批量创建工单、导入工单 | `$操作人 创建工单 $工单名称，$里程碑名称 开始` | | 创建工单 | 订单详情、批量创建工单、导入工单 | `$操作人 在 $里程碑名称 创建工单 $工单名称` | | 删除工单 | 订单详情 | `$操作人 删除 $里程碑名称 的工单 $工单名称` | | 完成里程碑 | 订单详情、批量修改里程碑状态 | `$操作人 完成里程碑 $里程碑名称` | | 取消里程碑 | 订单详情、批量修改里程碑状态 | `$操作人 取消里程碑 $里程碑名称` | | 重启里程碑 | 订单详情、批量修改里程碑状态 | `$操作人 重启里程碑 $里程碑名称` |  首次创建工单时，如果里程碑从未开始进入进行中，需要同时记录里程碑开始。  ## 订单复用关系  ### 里程碑互用  里程碑互用会在原单和被互用单分别增加跟踪记录。  | 场景 | 记录口径 | |---|---| | 原单 | `$操作人 将 $里程碑名称 互用于 $被互用的订单标识...` | | 被互用单 | `$操作人 将 $原单订单标识 中的 $里程碑名称 互用于此订单` | | 原单取消互用 | `$操作人 将 $里程碑名称 取消互用于 $被互用的订单标识` | | 被互用单取消互用并保留数据 | `$操作人 取消 $原单订单标识 中的 $里程碑名称 互用于此订单，并保留了数据` | | 被互用单取消互用并清空数据 | `$操作人 取消 $原单订单标识 中的 $里程碑名称 互用于此订单，并清空了数据` |  ### 翻单  | 场景 | 原单记录 | 翻单记录 | |---|---|---| | 创建新订单为翻单 | `$操作人 创建 $翻单订单标识 为此订单的翻单` | `$操作人 创建此订单为 $原单订单标识 的翻单` | | 设置已有订单为翻单 | `$操作人 设置 $翻单订单标识 为此订单的翻单` | `$操作人 设置此订单为 $原单订单标识 的翻单` | | 取消翻单 | `$操作人 取消 $翻单订单标识 作为此单的翻单` | `$操作人 取消此订单作为 $原单订单标识 的翻单` |  ### 订单关联与FlowSpace关联  | 操作 | 记录文案 | |---|---| | 订单关联 | `$操作人 建立与 $订单标识 关联` | | 取消订单关联 | `$操作人 取消与 $订单标识 关联` | | FlowSpace关联 | `$操作人 建立与 $FlowSpace名称 中的 $订单标识 关联` | | 取消FlowSpace关联 | `$操作人 取消与 $FlowSpace名称 中的 $订单标识 关联` |  ## 系统来源记录  系统、自动化、第三方 API 也可能写入订单跟踪记录。系统来源需要在操作人位置清晰标识，常见来源包括：  | 来源 | 记录场景 | |---|---| | 公式自动更新 | 主表单公式字段更新时记录 | | 自动化 | 主表单更新、首次创建工单、创建工单、订单状态变更、里程碑状态变更 | | 外部API | 外部系统创建或更新订单、创建或删除工单 |  ## 关联页面  - [订单生命周期](../30-业务流程/订单生命周期.md) - [订单复用关系](../30-业务流程/订单复用关系.md) - [系统与集成执行日志](./系统与集成执行日志.md)  ## 来源  - `source:thoughts-v2-current/v2.2.x/贸易端/【贸易端】【订单详情】查看&操作.md` - `source:thoughts-v2-current/v2.3.x/贸易端/【贸易端】【订单管理】订单翻单功能.md` - `source:thoughts-v2-current/v2.3.x/贸易端/【贸易端】【订单管理】订单关联功能.md` - `source:thoughts-v2-current/v2.3.x/贸易端/【贸易端】【订单管理】里程碑互用功能.md` - `source:thoughts-v2-current/V2.4.x/贸易端/系统自动执行的相关操作日志.md` - `source:thoughts-v2-current/V2.5.x/运营端/【运营端】【SCCS管理】SCCS列表增加外部api集成配置.md` "}, {"path": "docs/80-日志审计/设置操作日志.md", "title": "设置操作日志", "folder": "docs/80-日志审计", "text": "﻿# 设置操作日志  ## 定位  设置操作日志用于追溯团队、FlowSpace、协作 FlowSpace、资源库等配置类功能的新增、编辑、删除和权限变更。它记录的是“配置被谁改了、改了什么、改前改后是什么”，区别于订单跟踪记录和工单动态。  ## 适用范围  | 日志范围 | 记录对象 | |---|---| | 团队设置 | 基本信息、团队角色、成员管理、协作团队管理、FlowSpace 关联设置 | | FlowSpace设置 | 基本信息、业务角色、协作方角色、数据围栏、成员管理、协作团队管理、计划时间、标签设置、订单标识设置、订单取消原因 | | 协作FlowSpace设置 | 自建角色、主团队角色、成员管理 | | 资源库设置 | 基本信息、权限管理 |  运营端模板修改不记录在贸易端 FlowSpace 设置、协作 FlowSpace 设置或资源库设置操作日志中。  ## 列表查询  设置操作日志列表支持按操作对象、功能模块、操作类型、操作人和操作时间查询。  | 查询项 | 说明 | |---|---| | 模糊搜索 | 搜索操作对象 | | 功能模块 | 取值参照各设置日志的记录内容 | | 操作类型 | 新增、编辑、删除、设置权限 | | 操作人 | 可选择日志列表中出现过的成员 | | 操作时间 | 日期范围 |  列表数据中可点击快照查看对应操作的详细变更内容。  ## 团队设置日志  | 模块 | 记录操作 | |---|---| | 基本信息 | 新增、编辑；新增指创建团队 | | 团队角色 | 新增、编辑、删除；在角色中修改成员，仅记录在角色操作中 | | 成员管理 | 新增、删除、设置权限 | | 协作团队管理 | 新增、删除 | | FlowSpace关联设置 | 新增、删除；仅记录主动新增或删除的 FlowSpace |  FlowSpace 被动关联或被动取消关联时，不在团队设置日志中记录。  ## FlowSpace设置日志  | 模块 | 记录操作 | |---|---| | 基本信息 | 新增、删除；新增指创建 FlowSpace | | 业务角色 | 新增、编辑、删除 | | 协作方角色 | 新增、编辑、删除 | | 数据围栏 | 新增、编辑、删除 | | 成员管理 | 新增、删除、设置权限 | | 协作团队管理 | 新增、删除、设置权限 | | 计划时间 | 编辑 | | 标签设置 | 新增、编辑、删除 | | 订单标识设置 | 编辑 | | 订单取消原因 | 新增、编辑、删除 |  从团队设置中删除成员或协作团队，导致其从 FlowSpace 中被删除时，FlowSpace 设置日志也记录一条删除记录。  ## 协作FlowSpace设置日志  | 模块 | 记录操作 | |---|---| | 自建角色 | 新增、编辑、删除 | | 主团队角色 | 编辑，仅能编辑主团队角色中的成员 | | 成员管理 | 新增、删除、设置权限 |  主团队修改协作团队协作的里程碑，不记录在协作方 FlowSpace 的操作日志内。主团队修改或删除协作方角色，也不记录在协作方 FlowSpace 的操作日志内。  ## 资源库设置日志  | 模块 | 记录操作 | |---|---| | 基本信息 | 新增、编辑；新增指创建资源库 | | 权限管理 | 新增、编辑、删除 |  ## 快照查看  快照用于查看某次配置操作当时的数据。  | 操作类型 | 快照规则 | |---|---| | 新增 | 仅展示新增当时的数据 | | 删除 | 仅展示删除当时的数据 | | 编辑 | 展示编辑前和编辑后的数据 | | 协作团队增删 | 仅记录“我邀请的”团队增删，无快照 |  多层级内容需要通过气泡方式展示，例如业务角色或协作方角色的自定义订单范围规则、计划时间默认负责人规则、标签设置多语言、自建角色自定义订单范围等。  ## 关联页面  - [团队权限](../40-权限与安全/团队权限.md) - [FlowSpace业务角色权限](../40-权限与安全/FlowSpace业务角色权限.md) - [协作FlowSpace权限](../40-权限与安全/协作FlowSpace权限.md) - [资源库权限](../40-权限与安全/资源库权限.md)  ## 来源  - `source:thoughts-v2-current/V2.4.x/贸易端/【贸易端】【操作日志】所有设置类功能.md` "}, {"path": "docs/90-来源与待办/README.md", "title": "90 来源与待办", "folder": "docs/90-来源与待办", "text": "# 90 来源与待办  本目录用于承接来源追溯和建设过程中的问题。  ## 已沉淀页面  - [来源入库状态.md](./来源入库状态.md) - [待确认问题.md](./待确认问题.md) - [外部链接快照清单.md](./外部链接快照清单.md) - [版本变更记录.md](./版本变更记录.md) - [可运行文件与导入导出文件说明.md](./可运行文件与导入导出文件说明.md) - [团队共享与只读发布方案.md](./团队共享与只读发布方案.md)  ## 根目录关联文件  - [../../05-需求文档来源台账.md](../../05-需求文档来源台账.md) - [../../99-待办与问题池.md](../../99-待办与问题池.md)  ## 管理范围  - 来源入库状态 - 待确认问题 - 外部链接快照清单 - 版本变更记录 - 可运行脚本与导入导出文件说明 - 团队共享、只读发布和 Skill 分发方式"}, {"path": "docs/90-来源与待办/可运行文件与导入导出文件说明.md", "title": "可运行文件与导入导出文件说明", "folder": "docs/90-来源与待办", "text": "# 可运行文件与导入导出文件说明  ## 1. 定位  本页列出当前 Linkincrease 知识库及其最新需求源中可以运行的脚本、会被脚本读取或生成的文件，以及维护时的注意事项。  当前唯一最新需求源为：  最新需求源（source:thoughts-v2-current）  其本地目录不写入仓库，由维护人通过环境变量 `LINKINCREASE_SOURCE_PATH` 指定。  知识库根目录为：  知识库私有 Git 仓库本地工作区  ## 2. 可运行文件  | 文件 | 位置 | 运行目录 | 命令 | 作用 | 是否会修改文件 | | --- | --- | --- | --- | --- | --- | | `scan_source_manifest.py` | `<知识库仓库本地目录>\\scripts\\scan_source_manifest.py` | `<知识库仓库本地目录>` | `python scripts\\scan_source_manifest.py` | 扫描 `最新需求源（source:thoughts-v2-current）` 中的 `.md` 需求文件，生成来源全量清单和本次差异清单 | 会改写 `metadata/source-manifest.csv` 和 `metadata/source-diff.csv` | | `build_static_site.py` | `<知识库仓库本地目录>\\scripts\\build_static_site.py` | `<知识库仓库本地目录>` | `python scripts\\build_static_site.py` | 将 Markdown 知识库打包成只读静态站点，供产品团队查看 | 会重建 `exports/site` | | `thoughts_sync.py` | `<最新需求源本地目录>\\thoughts_sync.py` | `<最新需求源本地目录>` | `python thoughts_sync.py` 或按脚本参数运行 | 从所思在线同步/导出最新需求文档到 `最新需求源（source:thoughts-v2-current）` | 会更新最新需求源中的需求 `.md`、图片资产和 `.thoughts_sync` 同步状态 |  ## 3. 脚本说明  ### 3.1 `scan_source_manifest.py`  用途：  - 读取 `metadata/source-roots.csv`，找到当前 active 的外部来源目录。 - 扫描来源目录中的 `.md` 文件。 - 排除 `.thoughts_sync`、`__pycache__`、`*_assets` 等非正文目录。 - 为每份需求生成文件大小、最后修改时间、SHA256 内容指纹。 - 从路径和标题中推断版本、产品端、模块。 - 生成全量来源清单 `metadata/source-manifest.csv`。 - 与上次 manifest 对比，生成差异清单 `metadata/source-diff.csv`。  运行后输出示例：  source_roots=1 manifest=63 diff=0  含义：  - `source_roots=1`：扫描了 1 个 active 来源根目录。 - `manifest=63`：当前最新源中有 63 份 `.md` 需求文档。 - `diff=0`：本次与上次扫描相比没有新增、修改、删除。  适合运行时机：  - 每次运行 `thoughts_sync.py` 之后。 - 手动新增、移动、删除 `2.0需求文档` 中的需求文档之后。 - 准备判断知识库是否需要更新之前。  注意事项：  - 该脚本只读取 `最新需求源（source:thoughts-v2-current）`，不会修改最新源目录。 - 该脚本会覆盖 `metadata/source-manifest.csv` 和 `metadata/source-diff.csv`。 - 如果 `source-diff.csv` 出现 `modified`，需要人工判断对应知识页是否要更新。 - 如果 `source-diff.csv` 出现 `deleted`，不要直接删除知识页，应先确认需求是否迁移、改名或废弃。 - 如果新增来源是图片资产，目前不会进入 manifest；图片资产后续需要单独建立清单。  ### 3.2 `build_static_site.py`  用途：  - 扫描知识库中的 Markdown 文档。 - 将文档复制到 `exports/site/content`。 - 生成 `exports/site/index.html`，提供左侧目录、搜索框和 Markdown 阅读界面。 - 用于给产品团队发布只读知识库站点。  运行后输出示例：  site=知识库私有 Git 仓库本地工作区\\exports\\site documents=78  适合运行时机：  - 知识库内容更新后。 - 需求确认并入库后。 - 准备给产品团队发布最新只读站点前。  注意事项：  - 该脚本会删除并重建 `exports/site`。 - `exports/site` 是发布结果，不是知识库源文件。 - 如果用本地预览，需在 `exports/site` 目录下运行 `python -m http.server 8010` 后访问 `http://localhost:8010`。 - 当前页面渲染使用浏览器端 Markdown 渲染库；如果内网不允许访问外部 CDN，需要后续将渲染库下载到本地资产。  ### 3.3 `thoughts_sync.py`  用途：  - 从所思在线通过 API 导出需求文档。 - 支持增量同步，只导出所思中已更新的文档。 - 将导出内容落到 `最新需求源（source:thoughts-v2-current）` 的版本目录中。 - 维护 `.thoughts_sync` 下的登录、配置、同步状态和浏览器相关缓存。  适合运行时机：  - 想检查所思在线是否有新需求或变更时。 - 产品文档在所思中更新后，需要同步到本地最新源时。 - 准备更新知识库之前。  注意事项：  - 该脚本不在知识库目录内，而在最新需求源目录中。 - `.thoughts_sync` 可能包含登录状态、Cookie、浏览器 profile 或同步元数据，不要纳入知识库正文，不要随意分享。 - 同步完成后，需要回到知识库目录运行 `python scripts\\scan_source_manifest.py`。 - 如果同步脚本报登录失效，应在 `2.0需求文档` 目录下按脚本说明重新登录。  ## 4. 导入/导出与元数据文件  ### 4.1 来源输入配置  | 文件 | 作用 | 维护方式 | 注意事项 | | --- | --- | --- | --- | | `metadata/source-roots.csv` | 定义外部来源根目录，目前 active 来源为 `最新需求源（source:thoughts-v2-current）` | 少量人工维护 | 改路径后必须重新运行 `scan_source_manifest.py`；不要把 `.thoughts_sync` 设为扫描范围 | | `sources/external/thoughts-current.md` | 说明所思最新需求源如何接入知识库 | 人工维护 | 只写流程说明，不放账号、Cookie、Token |  ### 4.2 脚本输出文件  | 文件 | 由谁生成 | 作用 | 是否建议手改 | 注意事项 | | --- | --- | --- | --- | --- | | `metadata/source-manifest.csv` | `scan_source_manifest.py` | 最新需求源的全量文件清单，包含版本、端、模块、标题、大小、更新时间、SHA256 | 不建议手改 | 会被脚本覆盖；用它判断当前最新源有哪些文件 | | `metadata/source-diff.csv` | `scan_source_manifest.py` | 本次扫描相对上次扫描的新增、修改、删除差异 | 不建议手改 | 会被脚本覆盖；每次同步后优先查看它 |  ### 4.3 知识库管理台账  | 文件 | 作用 | 维护方式 | 注意事项 | | --- | --- | --- | --- | | `metadata/documents.csv` | 知识页台账，记录每个标准知识页的 ID、标题、路径、标签、来源 | 人工维护为主 | 新增/重命名知识页后要同步更新；ID 不可重复 | | `metadata/sources.csv` | 已入库来源台账，记录来源文档、所属端、模块、入库状态 | 人工维护为主 | 来源路径应优先使用 `source:thoughts-v2-current/...`；旧 `missing-current-source/...` 表示最新源缺口 | | `metadata/tags.csv` | 标签表，统一标签分类和含义 | 人工维护 | 新增知识页常用标签时补充；避免同义标签泛滥 | | `metadata/permissions.csv` | 权限分级说明 | 人工维护 | 当前用于内部权限口径，不是产品权限矩阵 | | `metadata/search-index.json` | 本地检索索引，记录可检索知识页 | 人工维护为主 | JSON 格式必须有效；新增重要知识页后要补索引 |  ### 4.4 文档和模板  | 文件或目录 | 作用 | 注意事项 | | --- | --- | --- | | `templates/需求文档入库模板.md` | 新增知识页或来源入库时的模板参考 | 适合人工复制使用，不是脚本输入 | | `exports/` | 预留导出目录 | 当前未见实际导出文件；后续可放离线包、PDF、压缩包 | | `sources/exported/` | 预留外部资料导出目录 | 可放钉钉表格、外部报告、补充资料 | | `sources/snapshots/` | 预留快照目录 | 可放重要链接、图片、PDF 的本地快照 | | `archive/` | 预留归档目录 | 可放废弃旧文件、历史压缩包；不要混入当前最新源 |  ## 5. 推荐运行流程  ### 5.1 检查所思是否更新  $env:LINKINCREASE_SOURCE_PATH=\"最新需求源（source:thoughts-v2-current）\"\" cd 最新需求源（source:thoughts-v2-current） python thoughts_sync.py  然后回到知识库：  cd <知识库仓库本地目录> python scripts\\scan_source_manifest.py  最后查看：  metadata/source-diff.csv  ### 5.2 发现新增需求  1. 查看 `source-diff.csv` 中 `change_type=added` 的行。 2. 判断是新功能、新模块、补充说明还是通用规则。 3. 更新 `05-需求文档来源台账.md`。 4. 新建或更新 `docs/` 知识页。 5. 更新 `metadata/documents.csv`、`metadata/sources.csv`、`metadata/search-index.json`。  ### 5.3 发现需求变更  1. 查看 `source-diff.csv` 中 `change_type=modified` 的行。 2. 打开对应 `最新需求源（source:thoughts-v2-current）` 源文件。 3. 找出变更影响的知识页。 4. 更新知识页正文和来源说明。 5. 必要时更新待确认问题。  ### 5.4 发现需求删除或移动  1. 查看 `source-diff.csv` 中 `change_type=deleted` 的行。 2. 先判断是文件改名、移动、版本归档，还是需求废弃。 3. 不要立即删除知识页。 4. 若业务口径仍有效，知识页保留，但来源状态改为待确认或历史来源。 5. 若确认废弃，更新知识页、来源台账和版本变更记录。  ## 6. 当前已知注意事项  1. 旧 `需求文档/` 已删除，不再维护双来源。 2. 当前最新源 `最新需求源（source:thoughts-v2-current）` 中有 63 份 `.md` 文档。 3. 旧来源中有 3 份文件未在最新源中出现，已标记为待确认： - `公式函数.md` - `【运营端】【资源库模版】表单设计组件.md` - `【运营端】【仪表盘】表单设计组件.md` 4. 如果这 3 份仍有效，应补入 `最新需求源（source:thoughts-v2-current）` 后重新运行扫描脚本。 5. 不要手动编辑 `.thoughts_sync`，除非明确知道同步脚本的登录和缓存机制。 6. 不要把浏览器缓存、Cookie、Token、临时数据库放入知识库正文或 metadata。 7. `source-manifest.csv` 和 `source-diff.csv` 是脚本输出，可以查看和分析，但不建议长期手动维护。 8. 标准知识页以 `docs/` 为准；来源文档不是最终产品口径，只是证据和变更输入。  ## 7. 快速判断表  | 你想做什么 | 应该看/运行什么 | | --- | --- | | 检查所思是否有更新 | 运行 `<最新需求源本地目录>\\thoughts_sync.py` | | 让知识库知道最新源变了没 | 运行 `scripts/scan_source_manifest.py` | | 看当前最新源有哪些需求文件 | `metadata/source-manifest.csv` | | 看这次新增/修改/删除了什么 | `metadata/source-diff.csv` | | 看某个知识页登记情况 | `metadata/documents.csv` | | 看某个来源是否已入库 | `metadata/sources.csv` | | 看知识库检索入口 | `metadata/search-index.json` | | 看单源接入说明 | `sources/external/thoughts-current.md` |"}, {"path": "docs/90-来源与待办/团队共享与只读发布方案.md", "title": "团队共享与只读发布方案", "folder": "docs/90-来源与待办", "text": "# 团队共享与只读发布方案  ## 定位  本页说明如何将 Linkincrease 知识库提供给产品团队查看，同时保持“仅维护人可管理”的权限边界。  推荐方案：  私有 Git 仓库管理源文件 + 静态网站只读发布给产品团队 + linkincrease-requirement-design Skill 辅助需求设计和入库 + Daren 保留维护权限  ## 1. 权限模型  | 角色 | 权限 | 说明 | |---|---|---| | 知识库维护人 | 读写源文件、提交 Git、发布站点、更新 Skill | 通常由 Daren 负责 | | 产品成员 | 只读访问静态站点 | 查看知识库，不直接修改源文件 | | 需求提出人 | 提交需求草稿或确认稿 | 可让 Skill 做检查，但不直接入库 | | 评审参与人 | 查看影响范围、待确认问题、版本记录 | 用于评审和对齐 |  ## 2. Git 私有仓库  建议将知识库本地工作区初始化为私有 Git 仓库，并托管到公司认可的平台。  可选平台：  - 公司内部 GitLab / Git 服务。 - GitHub Private Repository。 - Gitee 私有仓库。 - Azure DevOps / Bitbucket 等。  建议权限：  | 成员类型 | Git 权限 | |---|---| | Daren | Maintainer / Admin | | 产品成员 | Reporter / Read-only | | 研发、测试 | Reporter / Read-only |  源文件只通过维护人合入，避免知识库口径被多人随手改散。  ## 3. 静态网站只读发布  当前知识库提供本地静态站点生成脚本：  python scripts\\build_static_site.py  生成目录：  exports\\site  发布方式可以按团队条件选择：  | 方式 | 说明 | |---|---| | 内网服务器 | 将 `exports\\site` 部署为只读目录 | | Git Pages / GitLab Pages | 由私有仓库发布静态站点 | | NAS / 共享盘 | 将 `exports\\site` 作为只读共享目录 | | 临时预览 | 本机运行 `python -m http.server` 预览 |  本地预览命令：  cd exports\\site python -m http.server 8010  然后访问：  http://localhost:8010  ## 4. Skill 共享方式  Skill 名称：  linkincrease-requirement-design  当前本机位置：  C:\\Users\\DarenSCM\\.codex\\skills\\linkincrease-requirement-design  团队使用时建议采用可配置知识库路径：  LINKINCREASE_KB_PATH  优先级建议：  1. 使用环境变量 `LINKINCREASE_KB_PATH` 指向团队共享的知识库本地副本或只读路径。 2. 如果没有环境变量，由使用者提供知识库本地路径。 3. 如果都不存在，由使用者提供知识库路径。  产品成员如果只是查看知识库，不需要安装 Skill。只有需要在 Codex 中做需求设计、草稿检查、影响分析的人才需要安装。  ## 5. 需求确认后的入库流程  成员编写需求草稿 → 使用 Skill 做补漏和冲突检查 → 需求评审确认 → 维护人将确认稿同步到最新需求源（source:thoughts-v2-current） → 维护人运行来源扫描 → 维护人更新知识页、来源台账、metadata、待确认问题和版本记录 → 重新生成静态站点 → 产品团队查看最新只读站点  扫描命令：  python scripts\\scan_source_manifest.py  生成站点命令：  python scripts\\build_static_site.py  ## 6. 注意事项  1. 静态站点是阅读入口，不是编辑入口。 2. Skill 是工作方法和路径索引，不是知识库副本。 3. 知识库正文统一使用 FlowSpace；历史 `source:` 引用中的 SCCS 保留原始文件名。 4. 产品成员可以提交需求建议，但最终入库应由维护人审核。 5. 每次入库后需要重新生成并发布静态站点。"}, {"path": "docs/90-来源与待办/外部链接快照清单.md", "title": "外部链接快照清单", "folder": "docs/90-来源与待办", "text": "﻿# 外部链接快照清单  ## 定位  原始需求文档中包含大量远程截图、Teambition 图片、Thoughts 链接和钉钉表格链接。为了避免外部链接失效，本页用于定义外部链接的快照策略和优先处理清单。  ## 外部链接类型  | 类型 | 示例来源 | 风险 | 处理策略 | |---|---|---|---| | Teambition 图片 | `https://tcs.teambition.net/storage/...` | 链接过期、签名失效 | 批量下载到 `assets/images/` 并建立映射 | | Thoughts 文档 | `https://thoughts.teambition.com/...` | 权限变化、目录结构变化 | 导出为 Markdown 或 PDF 放入 `sources/exported/` | | 钉钉表格 | `https://alidocs.dingtalk.com/spreadsheetv2/...` | 权限变化、在线内容变动 | 导出为 xlsx/csv 放入 `sources/exported/` | | 外部 API 说明 | 需求中的外部链接或嵌入说明 | 链接不可访问、字段口径丢失 | 整理为本地接口说明文档 |  ## 当前重点外部资料  | 资料 | 当前出现位置 | 建议处理 | |---|---|---| | FlowSpace 权限矩阵钉钉表格 | `【贸易端】【SCCS设置】.md`、`【贸易端】【协作SCCS设置】.md`、订单详情相关文档 | 优先导出为权限矩阵表，补入 `docs/40-权限与安全/` | | 需求截图 | 几乎所有原始需求文档 | 批量下载并按来源文档、行号或资源 ID 建立索引 | | 采集端消息中心关联 Thoughts 文档 | `【采集端】【消息中心】消息通知列表.md` | 导出原文，补入消息模板来源 | | 邮件、短信、通知规则及模板 | 多份文档引用但未见独立完整文档 | 从在线资料或团队文件中补齐后入库 | | 第三方 API / SCMPRO 字段说明 | 外部 API、第三方数据对接、PDF 导入相关需求 | 整理为字段映射和接口示例文档 |  ## 建议本地存储结构  sources/ exported/ tables/ thoughts/ api/ snapshots/ screenshots/ assets/ images/ requirements/  命名建议：  需求来源短名__资源类型__序号__简述.ext  示例：  sccs-settings__table__permission-matrix.xlsx order-detail__image__tracking-record.png external-api__doc__field-mapping.md  ## 快照元数据建议  后续可新增 `metadata/external-links.csv`，字段建议如下：  | 字段 | 说明 | |---|---| | id | 外部资源唯一 ID | | source_file | 出现在哪个原始需求文档 | | source_line | 出现行号 | | url | 原始 URL | | type | image、thoughts、dingtalk、api、other | | local_path | 本地快照路径 | | status | pending、downloaded、failed、not_needed | | captured_at | 快照时间 | | notes | 备注 |  ## 优先级  | 优先级 | 范围 | 原因 | |---|---|---| | P0 | 权限矩阵表、通知模板、外部 API 字段说明 | 会影响产品规则和后续开发判断 | | P1 | 订单、工单、权限、自动化关键截图 | 有助于还原复杂交互 | | P2 | 普通页面原型截图 | 可在知识页稳定后批量归档 |  ## 关联页面  - [来源入库状态](./来源入库状态.md) - [待确认问题](./待确认问题.md) - [知识库工程架构](../../06-知识库工程架构.md)"}, {"path": "docs/90-来源与待办/待确认问题.md", "title": "待确认问题", "folder": "docs/90-来源与待办", "text": "# 待确认问题  ## 定位  本页沉淀会影响知识库口径、产品理解或后续实现判断的问题。进入本页的问题不代表当前知识页不可用，而是说明后续需要产品、研发、测试或运营共同确认。  ## 当前待确认问题  | 编号 | 问题 | 影响范围 | 状态 | 建议处理 | |---|---|---|---|---| | Q001 | SCCS 已更名为 FlowSpace（流空间），旧名仅作为历史来源名保留 | 全库术语、历史需求追溯 | 已处理 | 知识库正文统一使用 FlowSpace；历史需求文件名和 `source:` 引用保留 SCCS 以便追溯 | | Q002 | 订单完成、取消、重启后，对互用、邮件协作、自动化是否存在例外场景 | 订单、工单、自动化、邮件协作 | 待确认 | 逐项列出订单终态后的可操作矩阵 | | Q003 | 资源库同步与自动化更新同一字段时的优先级和冲突处理 | 资源库、自动化、系统日志 | 待确认 | 需要确认字段写入来源优先级和日志记录口径 | | Q004 | 协作团队负责人、对接人、有指派权限成员三者在所有场景中的定义是否完全一致 | 协作 FlowSpace、工单指派、消息通知 | 待确认 | 按场景建立角色定义表 | | Q005 | 报告权限的完整权限点和页面入口是否已有更多需求文档 | 仪表盘、报告 | 待补充 | 核对报告管理、报告查看、报告按钮展示的完整入口 | | Q006 | 采集端是否完整覆盖贸易端全部工单/批复状态限制 | 采集端、工单与批复 | 待校验 | 对比采集端任务详情与贸易端工单操作限制 | | Q007 | 运营端“业务模版/业务模板”历史文件命名不一致，是否需要统一迁移文件名 | 文档维护 | 待处理 | 若迁移，需同步更新来源台账和 metadata | | Q008 | 旧 `需求文档/` 中存在但最新源 `最新需求源（source:thoughts-v2-current）` 未包含的 `公式函数.md`、`【运营端】【资源库模版】表单设计组件.md`、`【运营端】【仪表盘】表单设计组件.md` 是否需要重新补回最新源 | 表单、公式、仪表盘、资源库模板 | 待确认 | 以最新源为准；若仍有效，应补入 `2.0需求文档` 并重新扫描 |  ## 当前待补充来源  | 内容 | 需要补充 | |---|---| | 邮件、短信、通知规则及模板 | 多份需求引用该材料，但最新源中未见独立完整文档 | | 权限矩阵表 | 多处引用钉钉表格，需要导出并入库为可追溯材料 | | 第三方 API / PDF 导入字段整理 | 需求中有外部链接和嵌入说明，建议整理为本地文档 | | 线上实际菜单结构 | 需要与当前产品版本核对，确认知识库功能地图是否与线上一致 | | 截图资源 | 需求文档中大量截图仍为远程链接，建议批量下载并建立本地映射 |  ## 处理原则  1. 不确定内容不直接写成最终规则；先标注来源和假设。 2. 如果多个需求文档冲突，以更晚版本或产品确认结果为准。 3. 一旦问题确认，需要同步更新对应知识页、来源台账、metadata 和本页状态。 4. SCCS 更名为 FlowSpace 已按当前口径处理；后续新增需求若仍出现 SCCS，正文继续映射为 FlowSpace。 4. 与权限、状态、数据写入优先级相关的问题优先处理，因为它们会影响多个模块。  ## 关联页面  - [来源入库状态](./来源入库状态.md) - [外部链接快照清单](./外部链接快照清单.md) - [待办与问题池](../../99-待办与问题池.md)"}, {"path": "docs/90-来源与待办/来源入库状态.md", "title": "来源入库状态", "folder": "docs/90-来源与待办", "text": "# 来源入库状态  ## 定位  本页用于追踪 `最新需求源（source:thoughts-v2-current）` 原始材料与标准知识页之间的入库关系，回答三个问题：  1. 哪些原始需求已经被归类。 2. 哪些原始需求已经抽取进标准知识页。 3. 哪些模块还需要继续拆页、补来源或校验。  ## 当前总览  | 项目 | 当前状态 | |---|---| | 原始需求文档数量 | 63 份 | | 已归类状态 | 已完成一级归类 | | 已建立来源元数据 | `metadata/sources.csv` | | 已接入最新来源层 | `最新需求源（source:thoughts-v2-current）` | | 已建立最新来源清单 | `metadata/source-manifest.csv` | | 已建立来源差异清单 | `metadata/source-diff.csv` | | 已建立知识页元数据 | `metadata/documents.csv` | | 已建立检索索引 | `metadata/search-index.json` | | 原始资料处理方式 | `最新需求源（source:thoughts-v2-current）` 作为唯一最新来源层；旧 `需求文档/` 不再保留 |  ## 已建知识页模块  | 模块 | 当前沉淀结果 | |---|---| | 产品端 | 运营端、贸易端、采集端、三端数据关系、账号与个人中心 | | 业务对象 | FlowSpace、订单、工单与批复、资源库、团队与协作团队、里程碑、业务模板、资源库模板 | | 业务流程 | 从模板到 FlowSpace、订单生命周期、工单采集与批复、跨团队协作、资源库引用与同步、自动化执行、移动端采集、订单复用关系 | | 权限与安全 | 权限体系总表、团队权限、FlowSpace 业务角色权限、协作 FlowSpace 权限、数据围栏、资源库权限、仪表盘与报告权限 | | 模板表单与数据 | 表单设计组件、表单属性与显隐设置、公式函数、PDF 与批量导入导出、第三方数据对接、验货组件流程 | | 协作通知与自动化 | 消息中心与实时通知、邮件协作、批量邮件协作、自动化配置、自动化与系统执行日志 | | 展示分析 | 工作台与 FlowSpace 入口、订单日程与任务中心、常用视图与视图设置、仪表盘管理与设计器、报告管理与权限 | | 日志审计 | 设置操作日志、订单跟踪记录、动态与评论、历史记录与快照、系统与集成执行日志 |  ## 待继续建设模块  | 模块 | 说明 | 建议优先级 | |---|---|---| | 运营端平台管理细页 | 已有总纲，后续拆用户、团队、FlowSpace、资源库、软件管理等平台监管后台细页 | P1 | | 采集端任务细页 | 已有总纲，后续拆登录、首页、任务列表、任务搜索、任务详情、消息中心、我的 | P1 | | 账号与个人中心细则 | 已创建账号与个人中心页，后续补邮件模板、语言持久化流程图和截图资产 | P2 | | 资源库分享与细则 | 分享链接、游客操作、FlowSpace 应用数据范围、视图细则 | P2 | | 字段级矩阵 | 权限矩阵、组件属性矩阵、日志文案矩阵、异常提示矩阵 | P2 |  ## 入库状态定义  | 状态 | 说明 | |---|---| | 已归类 | 已确定原始需求所属模块，但未必完整抽取 | | imported | 已进入 `metadata/sources.csv` 来源台账 | | authoritative | 已形成标准知识页，可作为当前知识库口径 | | draft | 仍作为问题池或过程文档，需要后续确认 | | 待校验 | 需求之间存在冲突，或需要与线上版本、产品负责人确认 | | 待补充来源 | 需求中引用了外部表格、外部链接或未入库材料 |  ## 维护动作  新增或更新需求文档时，按以下顺序处理：  1. 将所思在线内容同步到 `最新需求源（source:thoughts-v2-current）`。 2. 运行 `python scripts\\scan_source_manifest.py`，更新 `metadata/source-manifest.csv` 和 `metadata/source-diff.csv`。 3. 更新 [需求文档来源台账](../../05-需求文档来源台账.md)。 4. 更新 `metadata/sources.csv`。 5. 抽取或更新对应 `docs/` 知识页。 6. 更新 `metadata/documents.csv` 和 `metadata/search-index.json`。 7. 如果存在冲突或缺口，更新 [待确认问题](./待确认问题.md)。  ## 关联文件  - [需求文档来源台账](../../05-需求文档来源台账.md) - [待办与问题池](../../99-待办与问题池.md) - [documents.csv](../../metadata/documents.csv) - [sources.csv](../../metadata/sources.csv) - [source-roots.csv](../../metadata/source-roots.csv) - [source-manifest.csv](../../metadata/source-manifest.csv) - [source-diff.csv](../../metadata/source-diff.csv) - [search-index.json](../../metadata/search-index.json)"}, {"path": "docs/90-来源与待办/版本变更记录.md", "title": "版本变更记录", "folder": "docs/90-来源与待办", "text": "﻿# 版本变更记录  ## 定位  本页记录 Linkincrease 知识库本身的建设版本，而不是产品线上版本。它用于追踪每一轮知识库新增了哪些模块、补了哪些索引、还留下哪些下一步工作。  ## 当前版本  | 项目 | 内容 | |---|---| | 当前知识库版本 | v0.1 | | 当前阶段 | 标准知识库首轮搭建 | | 最近更新日期 | 2026-05-26 | | 当前状态 | 已完成主体目录、核心对象、流程、权限、配置、协作通知、展示分析、日志审计和来源管理首版 |  ## 变更记录  | 日期 | 版本 | 变更 | |---|---|---| | 2026-05-25 | v0.1-init | 建立根目录总览、维护规范、产品总览、术语、功能地图、知识库架构、来源台账、工程架构、待办池 | | 2026-05-25 | v0.1-objects | 建立业务对象首批页面：FlowSpace、订单、工单与批复、资源库、团队与协作团队、里程碑、业务模板、资源库模板 | | 2026-05-25 | v0.1-flows | 建立业务流程首批页面：从模板到 FlowSpace、订单生命周期、工单采集与批复、跨团队协作、资源库引用与同步、自动化执行、移动端采集、订单复用关系 | | 2026-05-25 | v0.1-permission | 建立权限体系总表及团队、FlowSpace、协作方、数据围栏、资源库、仪表盘与报告权限页面 | | 2026-05-25 | v0.1-config | 建立模板表单与数据页面：表单组件、显隐设置、公式函数、导入导出、第三方数据、验货组件流程 | | 2026-05-25 | v0.1-collab | 建立协作通知与自动化页面：消息中心、邮件协作、批量邮件协作、自动化配置、系统执行日志 | | 2026-05-26 | v0.1-display | 建立展示分析页面：工作台与 FlowSpace 入口、订单日程与任务中心、常用视图与视图设置、仪表盘管理与设计器、报告管理与权限 | | 2026-05-26 | v0.1-audit | 建立日志审计页面：设置操作日志、订单跟踪记录、动态与评论、历史记录与快照、系统与集成执行日志 | | 2026-05-26 | v0.1-source | 建立来源与待办管理页：来源入库状态、待确认问题、外部链接快照清单、版本变更记录 | | 2026-05-26 | v0.1-rename-flowspace | 将知识库正文标准术语由 SCCS 更名为 FlowSpace（流空间）；历史来源文件名和 `source:` 引用保留 SCCS 原名用于追溯 | | 2026-05-26 | v0.1-share-site | 初始化本地 Git 管理底座，新增只读静态站点生成脚本和团队共享发布方案，并将 Skill 调整为可配置知识库路径 |  ## 后续版本建议  | 版本 | 目标 | |---|---| | v0.2 | 补运营端平台管理：用户、团队、FlowSpace、资源库、软件管理 | | v0.3 | 补采集端完整产品端：登录、首页、任务列表、任务搜索、任务详情、消息中心、我的 | | v0.4 | 补账号与个人中心、资源库分享、订单列表细则、工单视图细则 | | v0.5 | 建立字段级矩阵：权限矩阵、日志文案矩阵、表单组件属性矩阵、异常提示矩阵 | | v0.6 | 批量导出外部链接与截图，建立 `metadata/external-links.csv` | | v1.0 | 完成原始需求全量抽取、来源可追溯、检索索引稳定，可作为团队正式知识库 |  ## 发布检查清单  每次知识库版本更新前，至少检查：  1. 新增知识页是否加入对应目录 README。 2. 根 README 阅读路径是否需要更新。 3. `metadata/documents.csv` 是否有对应记录。 4. `metadata/sources.csv` 是否补充来源。 5. `metadata/search-index.json` 是否能解析。 6. ID 是否唯一。 7. 待确认问题是否有新增或状态变化。  ## 关联页面  - [来源入库状态](./来源入库状态.md) - [待确认问题](./待确认问题.md) - [外部链接快照清单](./外部链接快照清单.md)"}, {"path": "docs/README.md", "title": "Linkincrease 标准知识库目录", "folder": "docs", "text": "# Linkincrease 标准知识库目录  本目录承载拆分后的正式知识页。根目录保留总览、规范和索引；`docs/` 按标准知识库结构组织可长期维护的内容。  ## 目录  | 目录 | 内容 | | --- | --- | | `00-入门/` | 产品总览、术语、功能地图、阅读路径 | | `10-产品端/` | 运营端、贸易端、采集端说明 | | `20-业务对象/` | 用户、团队、FlowSpace、订单、里程碑、工单、资源库等对象 | | `30-业务流程/` | 从模板到 FlowSpace、订单生命周期、工单采集批复、资源库同步等流程 | | `40-权限与安全/` | 团队、FlowSpace、协作方、资源库、数据围栏、报告、仪表盘权限 | | `50-模板表单与数据/` | 业务模板、资源库模板、表单组件、公式、验货组件 | | `60-协作通知与自动化/` | 消息、邮件协作、自动化、定时任务、外部 API | | `70-展示分析/` | 工作台、常用视图、订单日程、仪表盘、报告 | | `80-日志审计/` | 操作日志、动态、历史记录、跟踪记录、系统自动日志 | | `90-来源与待办/` | 来源映射、待确认问题、入库状态 |  ## 当前建设阶段  第一阶段先落 P0 页面：  - `10-产品端/运营端.md` - `10-产品端/贸易端.md` - `10-产品端/采集端.md` - `10-产品端/三端数据关系.md` - `10-产品端/账号与个人中心.md` - `20-业务对象/FlowSpace.md` - `20-业务对象/订单.md` - `20-业务对象/工单与批复.md` - `20-业务对象/资源库.md` - `20-业务对象/团队与协作团队.md` - `20-业务对象/里程碑.md` - `20-业务对象/业务模板.md` - `20-业务对象/资源库模板.md` - `40-权限与安全/权限体系总表.md` - `30-业务流程/从模板到FlowSpace.md` - `30-业务流程/订单生命周期.md` - `30-业务流程/工单采集与批复.md` - `30-业务流程/跨团队协作.md` - `30-业务流程/资源库引用与同步.md` - `30-业务流程/自动化执行.md` - `30-业务流程/移动端采集.md` - `30-业务流程/订单复用关系.md` - `40-权限与安全/团队权限.md` - `40-权限与安全/FlowSpace业务角色权限.md` - `40-权限与安全/协作FlowSpace权限.md` - `40-权限与安全/数据围栏.md` - `40-权限与安全/资源库权限.md` - `40-权限与安全/仪表盘与报告权限.md` - `50-模板表单与数据/表单设计组件.md` - `50-模板表单与数据/表单属性与显隐设置.md` - `50-模板表单与数据/公式函数.md` - `50-模板表单与数据/PDF与批量导入导出.md` - `50-模板表单与数据/第三方数据对接.md` - `50-模板表单与数据/验货组件流程.md` - `60-协作通知与自动化/消息中心与实时通知.md` - `60-协作通知与自动化/邮件协作.md` - `60-协作通知与自动化/批量邮件协作.md` - `60-协作通知与自动化/自动化配置.md` - `60-协作通知与自动化/自动化与系统执行日志.md` - `70-展示分析/工作台与FlowSpace入口.md` - `70-展示分析/订单日程与任务中心.md` - `70-展示分析/常用视图与视图设置.md` - `70-展示分析/仪表盘管理与设计器.md` - `70-展示分析/报告管理与权限.md` - `80-日志审计/设置操作日志.md` - `80-日志审计/订单跟踪记录.md` - `80-日志审计/动态与评论.md` - `80-日志审计/历史记录与快照.md` - `80-日志审计/系统与集成执行日志.md` - `90-来源与待办/来源入库状态.md` - `90-来源与待办/待确认问题.md` - `90-来源与待办/外部链接快照清单.md` - `90-来源与待办/版本变更记录.md` - `90-来源与待办/可运行文件与导入导出文件说明.md`  这些页面提供标准口径，后续再逐步从 `最新需求源（source:thoughts-v2-current）` 抽取页面交互、字段规则、异常提示和截图。"}, {"path": "sources/external/thoughts-current.md", "title": "所思最新需求源接入说明", "folder": "sources/external", "text": "# 所思最新需求源接入说明  ## 定位  `最新需求源（source:thoughts-v2-current）` 是从所思在线导出的最新需求文档目录，作为 Linkincrease 知识库的最新来源层。  维护人本地目录由环境变量 `LINKINCREASE_SOURCE_PATH` 指定，知识库仓库和只读站点只展示来源标识，不展示本机绝对路径。  当前知识库根目录下的旧 `需求文档/` 不再保留，也不作为来源维护对象。  ## 来源层分工  | 来源 | 角色 | 使用方式 | | --- | --- | --- | | `最新需求源（source:thoughts-v2-current）` | 最新权威来源层 | 通过扫描脚本生成 manifest 和 diff，作为后续更新知识页的依据 | | `docs/` | 标准知识库正文 | 只沉淀归纳、去重、校验后的稳定口径 | | `metadata/` | 元数据与治理层 | 管理来源根、来源清单、差异、知识页、检索索引 |  ## 同步流程  1. 在 `LINKINCREASE_SOURCE_PATH` 指向的最新需求源本地目录中运行或更新 `thoughts_sync.py`，从所思在线同步最新文档。 2. 回到知识库目录运行：  python scripts\\scan_source_manifest.py  3. 查看 `metadata/source-diff.csv`，判断新增、修改、删除的来源文件。 4. 将影响业务口径的变更抽取到 `docs/` 对应知识页。 5. 更新 `metadata/documents.csv`、`metadata/sources.csv` 和 `metadata/search-index.json`。  ## 文件说明  | 文件 | 说明 | | --- | --- | | `metadata/source-roots.csv` | 外部来源根目录配置 | | `metadata/source-manifest.csv` | 最新来源文件全量清单，包含版本、端、模块、hash、更新时间 | | `metadata/source-diff.csv` | 本次扫描相对上次扫描的差异 | | `scripts/scan_source_manifest.py` | 扫描外部来源并生成 manifest/diff 的脚本 |  ## 注意事项  1. 不把 `.thoughts_sync/` 纳入知识库正文或来源 manifest。 2. 不把浏览器缓存、同步状态数据库、临时文件作为需求材料入库。 3. `*_assets/` 图片目录先暂不纳入 manifest；需要本地化截图资产时，再单独建立图片资产清单。 4. 所有标准知识页仍以 `docs/` 为准，来源文件只作为证据和变更输入。 5. 不再维护知识库内的旧 `需求文档/` 目录，避免双来源。"}, {"path": "templates/需求文档入库模板.md", "title": "需求文档入库模板", "folder": "templates", "text": "# 需求文档入库模板  ## 1. 基本信息  | 字段 | 内容 | | --- | --- | | 需求名称 |  | | 来源链接 / 文件 |  | | 来源类型 | Teambition / 本地 PRD / 原型 / 会议纪要 / Demo / 其他 | | 权威等级 | A / B / C / D | | 所属模块 |  | | 涉及版本 |  | | 原始创建 / 更新时间 |  | | 入库人 |  | | 入库时间 |  |  ## 2. 一句话结论  用一句话说明这个需求改变了什么产品事实。  ## 3. 背景与目标  - 背景： - 目标： - 非目标：  ## 4. 影响的核心概念  | 概念 | 影响 | | --- | --- | |  |  |  ## 5. 功能规则摘要  | 规则编号 | 规则 | 来源位置 | | --- | --- | --- | | R-001 |  |  |  ## 6. 权限与数据范围  | 对象 | 权限点 | 数据范围 | 说明 | | --- | --- | --- | --- | |  |  |  |  |  ## 7. 状态、异常与边界  - 状态变化： - 异常处理： - 不支持场景：  ## 8. 需要同步到的知识库页面  - [ ] 产品总览 - [ ] 核心概念词典 - [ ] 功能地图 - [ ] 专题页 - [ ] 问题池  ## 9. 待确认问题  | 编号 | 问题 | 建议确认人 | 状态 | | --- | --- | --- | --- | | Q-001 |  |  | 待确认 | "}];
    const nav = document.getElementById('nav');
    const search = document.getElementById('search');
    const content = document.getElementById('content');
    const currentPath = document.getElementById('currentPath');
    if (window.mermaid) {
      mermaid.initialize({ startOnLoad:false, theme:'base', securityLevel:'loose', themeVariables: {
        fontFamily:'-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif',
        primaryColor:'#f7f6f3',
        primaryTextColor:'#2f3437',
        primaryBorderColor:'#d8d1c8',
        lineColor:'#8b8173',
        secondaryColor:'#eee9df',
        tertiaryColor:'#fbfaf8',
        noteBkgColor:'#fff',
        noteBorderColor:'#d8d1c8'
      } });
    }
    function normalize(value) { return (value || '').toLowerCase(); }
    function escapeHtml(value) { return String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function renderNav(items) {
      nav.innerHTML = '';
      if (!items.length) {
        const empty = document.createElement('div');
        empty.className = 'empty-state';
        empty.textContent = '没有找到匹配页面';
        nav.appendChild(empty);
        return;
      }
      items.forEach(doc => {
        const a = document.createElement('a');
        a.href = '#' + encodeURIComponent(doc.path);
        a.dataset.path = doc.path;
        a.innerHTML = `<span class="doc-title">${escapeHtml(doc.title)}</span><span class="folder">${escapeHtml(doc.path)}</span>`;
        nav.appendChild(a);
      });
    }
    async function loadDoc(path) {
      const doc = docs.find(item => item.path === path) || docs.find(item => item.path === 'README.md') || docs[0];
      if (!doc) return;
      [...nav.querySelectorAll('a')].forEach(a => a.classList.toggle('active', a.dataset.path === doc.path));
      const folder = doc.path.split('/').slice(0, -1).join(' / ');
      currentPath.textContent = folder ? `Linkincrease / ${folder} / ${doc.title}` : `Linkincrease / ${doc.title}`;
      const response = await fetch('content/' + doc.path);
      const markdown = await response.text();
      content.innerHTML = window.marked ? marked.parse(markdown) : '<pre>' + escapeHtml(markdown) + '</pre>';
      await renderMermaid();
      content.querySelectorAll('a[href$=".md"], a[href*=".md#"]').forEach(link => {
        const raw = link.getAttribute('href');
        if (!raw || raw.startsWith('http') || raw.startsWith('#')) return;
        const base = doc.path.split('/').slice(0, -1).join('/');
        const resolved = new URL(raw, 'https://kb.local/' + (base ? base + '/' : '')).pathname.slice(1);
        const target = docs.find(item => item.path === decodeURI(resolved));
        if (target) link.setAttribute('href', '#' + encodeURIComponent(target.path));
      });
    }
    async function renderMermaid() {
      if (!window.mermaid) return;
      content.querySelectorAll('pre code.language-mermaid, pre code.lang-mermaid').forEach(code => {
        const diagram = document.createElement('div');
        diagram.className = 'mermaid';
        diagram.textContent = code.textContent;
        code.closest('pre').replaceWith(diagram);
      });
      const mermaidStart = /^(flowchart|graph|sequenceDiagram|stateDiagram|stateDiagram-v2|erDiagram|gantt|journey|pie|mindmap|timeline)/i;
      content.querySelectorAll('pre code:not(.language-mermaid):not(.lang-mermaid)').forEach(code => {
        const source = code.textContent.trim();
        if (!mermaidStart.test(source)) return;
        const diagram = document.createElement('div');
        diagram.className = 'mermaid';
        diagram.textContent = source;
        code.closest('pre').replaceWith(diagram);
      });
      const blocks = [...content.querySelectorAll('.mermaid')];
      if (!blocks.length) return;
      try {
        await mermaid.run({ nodes: blocks });
      } catch (error) {
        blocks.forEach(block => {
          if (!block.querySelector('svg')) {
            const pre = document.createElement('pre');
            const code = document.createElement('code');
            code.textContent = block.textContent;
            pre.appendChild(code);
            block.replaceWith(pre);
          }
        });
        console.warn('Mermaid render failed', error);
      }
    }
    search.addEventListener('input', () => {
      const keyword = normalize(search.value.trim());
      renderNav(keyword ? docs.filter(doc => normalize(doc.title + ' ' + doc.path + ' ' + doc.text).includes(keyword)) : docs);
      loadDoc(decodeURIComponent(location.hash.slice(1)) || 'README.md');
    });
    window.addEventListener('hashchange', () => loadDoc(decodeURIComponent(location.hash.slice(1)) || 'README.md'));
    renderNav(docs);
    loadDoc(decodeURIComponent(location.hash.slice(1)) || 'README.md');
  </script>
</body>
</html>
