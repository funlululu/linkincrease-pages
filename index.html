、对象状态不允许或记录范围未命中时，定时任务不执行，且不算执行失败。 - 资源库公式只按普通表单编辑逻辑处理，不纳入跨表单自动计算状态限制表。", "domain": "公共能力", "module": "业务流程与产品流程图", "tags": "自动化;公式;系统自动执行;状态限制", "sources": [{"title": "平台自动计算、更新规则说明", "version": "common", "product_side": "未识别", "module": "", "last_write_time": "2026-09-04T10:47:43"}]}, {"path": "docs/30-业务流程与产品流程图/自动化执行.md", "title": "自动化执行", "folder": "docs/30-业务流程与产品流程图", "text": " # 自动化执行  ## 1. 流程定位  自动化用于在 FlowSpace 内基于触发条件执行机械性业务动作。自动化由触发条件和执行操作组成，启用后才会执行。执行失败时可通知指定对象，并记录执行日志。  ## 2. 流程图  flowchart TD A[\"创建或编辑自动化\"] --> B[\"配置触发条件\"] B --> C[\"配置最多多个执行操作\"] C --> D[\"校验设置完整性\"] D --> E{\"保存并启用\"} E -->|未启用| F[\"仅保存，不执行\"] E -->|启用| G[\"等待触发\"] G --> H{\"满足触发条件\"} H -->|否| G H -->|是| I[\"按顺序执行操作\"] I --> J{\"某一步失败\"} J -->|是| K[\"后续操作不执行，发送失败通知\"] J -->|否| L[\"执行成功\"] K --> M[\"写入执行日志\"] L --> M  ## 3. 触发条件  | 触发条件 | 说明 | | --- | --- | | 数据新增时 | 当订单基本信息、里程碑批复、里程碑工单等数据新增并满足条件时触发 | | 数据内容变更时 | 当指定数据源字段发生变更并满足条件时触发 | | 到达记录中的时间时 | 当到达某数据源内日期字段的指定时间点时触发 | | 定时任务 | 按不重复、每天、每周、每月、每月第 xx 个周 xx 等周期触发 |  自动化触发条件和执行操作在同一订单内发生，不跨订单执行。  ## 4. 执行操作  | 执行动作 | 说明 | | --- | --- | | 发送通知 | 向 FlowSpace 成员、协作团队、业务角色、协作方角色、系统角色、模板控件等对象发送站内或邮件通知 | | 新增数据 | 主要用于自动新增工单，并设置处理人和默认值 | | 更新数据 | 更新订单基本信息、里程碑批复、工单等数据源字段 |  定时任务下的执行操作有特殊限制：  - 发送通知时，通知对象仅保留 FlowSpace 成员、协作团队、业务角色、协作方角色 4 个分组。 - 新增数据时需增加订单筛选条件，筛选符合条件的订单再创建工单。 - 更新数据时需增加记录范围设置，过滤符合条件的订单、里程碑批复或工单。 - 设置的时间不存在时不执行，且不属于执行失败。  ## 5. 权限与状态限制  | 限制 | 说明 | | --- | --- | | 自动化配置权限 | 自动化配置入口由运营端团队列表的功能权限配置授权，不再由贸易端 FlowSpace 业务角色勾选 | | 启用校验 | 条件和操作都至少有一个节点，且设置完整 | | 顺序执行 | 任一步失败，后续操作不执行 | | 订单状态 | 订单已完成或已取消时，新增或更新数据通常不执行 | | 里程碑状态 | 里程碑已完成或已取消时，里程碑批复或工单相关动作不执行 | | 互用限制 | 里程碑互用自其他订单、工单互用自其他订单时，部分动作不执行 |  自动化写入需要遵守系统自动计算与更新规则：订单结束、里程碑结束、工单采集结束后，自动化不能继续改写对应业务字段；定时任务命中但目标对象状态不允许时不执行。设置时间不存在时不执行，且不算执行失败。  ## 6. 通知规则  自动化通知对象包括：  - FlowSpace 成员。 - FlowSpace 协作团队。 - 业务角色和协作方角色。 - 订单模板控件。 - 步骤一数据源角色。 - 系统角色，如订单创建人、订单更新人、里程碑负责人、工单采集人、工单批复人等。  通知渠道：  - Linkincrease 消息。 - 邮件。 - 失败通知可配置站内、邮件、短信。  ## 7. 日志与审计  执行日志需记录：  - 执行数据。 - 执行时间。 - 执行状态：成功、失败、部分成功。 - 满足的条件。 - 每个执行节点的配置和执行结果。 - 操作人：团队成员、协作方成员或机器人。 - 新增或变更的数据内容。  系统自动执行日志中，自动化操作人应标识为机器人或具体自动程序。  ## 8. 待确认问题  - 部分成功的完整处理规则。 - 自动化与资源库同步同时更新同一字段时的优先级。 - 定时任务的时区、夏令时和不存在日期处理是否需要额外规则。  ## 9. 来源需求  - `source:thoughts-v2-current/V2.4.x/贸易端/【贸易端】【自动化】一期.md` - `source:thoughts-v2-current/V2.5.x/贸易端/【贸易端】【自动化】二期：定时任务.md` - `source:thoughts-v2-current/V2.4.x/贸易端/系统自动执行的相关操作日志.md` - `source:thoughts-v2-current/平台自动计算、更新规则说明.md`", "domain": "贸易端", "module": "业务流程与产品流程图", "tags": "自动化;定时任务;通知;执行日志", "sources": [{"title": "【贸易端】【自动化】一期", "version": "V2.4.x", "product_side": "贸易端", "module": "自动化", "last_write_time": "2026-09-04T10:48:09"}, {"title": "【贸易端】【自动化】二期：定时任务", "version": "V2.5.x", "product_side": "贸易端", "module": "自动化", "last_write_time": "2026-09-04T10:48:01"}, {"title": "系统自动执行的相关操作日志", "version": "V2.4.x", "product_side": "贸易端", "module": "贸易端", "last_write_time": "2026-09-04T10:48:06"}, {"title": "【运营端】【团队列表-功能权限】自动化权限移至运营端管理", "version": "v2.8", "product_side": "运营端", "module": "团队列表-功能权限", "last_write_time": "2026-09-04T10:47:47"}]}, {"path": "docs/30-业务流程与产品流程图/订单复用关系.md", "title": "订单复用关系", "folder": "docs/30-业务流程与产品流程图", "text": " # 订单复用关系  ## 1. 流程定位  订单复用关系用于在订单之间建立业务关系或复用历史数据，包括订单翻单、订单关联、里程碑互用和工单互用。它们都服务于减少重复录入、提高协作效率和保留跨订单追溯关系，但数据同步范围和影响不同。  ## 2. 关系总览  | 关系 | 作用 | 是否复制数据 | 是否建立持续关系 | | --- | --- | --- | --- | | 订单翻单 | 基于原订单创建或指定翻单订单 | 可填入原单、复制里程碑、互用里程碑 | 是，原单与翻单互相展示 | | 订单关联 | 建立订单之间的关系 | 不复制数据 | 是，互相关联展示 | | 里程碑互用 | 将里程碑数据互用于其他订单 | 展示并复用除计划时间、负责人外的数据 | 是，来源里程碑决定互用数据 | | 工单互用 | 将工单复用于其他订单里程碑 | 展示工单数据、工单批复、历史和动态 | 是，原工单被复用 |  ## 3. 订单翻单  flowchart TD A[\"选择原订单\"] --> B{\"翻单方式\"} B -->|创建新订单| C[\"填写新订单数据\"] B -->|选择已有订单| D[\"选择可用已有订单\"] C --> E[\"填入原单主表单数据\"] D --> E E --> F{\"里程碑处理\"} F -->|复制原单| G[\"复制里程碑批复、工单批复、工单数据\"] F -->|互用原单| H[\"互用里程碑数据，不同步计划时间\"] F -->|不处理| I[\"仅建立翻单关系\"] G --> J[\"确认翻单并写入跟踪记录\"] H --> J I --> J  关键规则：  - 翻单权限在 FlowSpace 业务角色中配置。 - 可创建新订单作为翻单，也可选择已有订单作为翻单。 - 创建新订单翻单时，新增订单创建人为翻单操作人。 - 已有订单建立翻单关系时，订单创建人不变。 - 复制原单不复制里程碑计划时间、不复制邮件协作数据。 - 复制或互用里程碑时，主表单公式可能需要重新计算。 - 翻单成功后，原单和翻单都写入跟踪记录。  ## 4. 订单关联  订单关联用于建立订单之间的互相关系，不默认复制字段或流程数据。  关键规则：  - 关联权限在 FlowSpace 业务角色中配置。 - 可从订单列表或订单详情发起。 - 可选择一条或多条订单。 - 可选订单排除当前订单和已关联订单。 - 关联后，两边订单都展示关联标识。 - 点击关联订单跳转详情，无权限时提示暂无权限。 - 取消关联后，两边关系解除并写入跟踪记录。 - 关联订单被删除后，另一方不再展示关联信息，并写入跟踪记录。  ## 5. 里程碑互用  里程碑互用用于将某订单的里程碑数据复用于其他订单。  关键规则：  - 需要有里程碑互用权限。 - 互用后，同步展示原里程碑数据，但计划时间和负责人不同步。 - 原无权限的订单若添加互用里程碑，原工单参与人可跳转并查看互用工单。 - 可将当前里程碑互用于其他订单，也可从其他订单互用里程碑到当前订单。 - 可选订单需满足订单进行中、里程碑未开始或进行中、具备对应权限等条件。 - 里程碑或工单已有互用关系时，部分互用入口需置灰或后端拦截。 - 互用和取消互用均需写入订单跟踪记录。  ## 6. 工单互用  工单互用用于将某个工单复用于其他订单的里程碑。  关键规则：  - 需要有工单互用权限。 - 互用后可查看工单数据、工单批复数据、历史记录、工单动态，但互用工单不可发新动态。 - 可在里程碑操作中添加互用工单，也可在工单操作中将工单互用于其他里程碑。 - 互用自其他工单的工单仅有查看功能，无工单编辑操作。 - 里程碑新增工单命名逻辑不受互用工单影响。 - 源工单动态记录互用和取消互用。 - 任一方数据被删除时，需要取消互用关系并更新展示。  ## 7. 权限与状态限制  | 关系 | 权限 | 状态限制 | | --- | --- | --- | | 翻单 | 订单翻单权限 | 可选订单需符合来源规则，避免循环翻单或已翻单订单重复作为翻单 | | 订单关联 | 订单关联权限 | 排除当前订单、已关联订单、不可见订单 | | 里程碑互用 | 里程碑互用权限 | 订单进行中，里程碑未开始或进行中；排除已有互用冲突 | | 工单互用 | 工单互用权限 | 订单进行中，目标里程碑未完成；排除互用自工单、已互用工单等 |  ## 8. 日志与审计  需要记录：  - 创建翻单关系。 - 取消翻单关系。 - 建立订单关联。 - 取消订单关联。 - 里程碑互用和取消互用。 - 工单互用和取消互用。 - 删除订单、里程碑、工单导致复用关系取消。  ## 9. 待确认问题  - 翻单、关联、互用之间是否允许组合使用的完整矩阵。 - 取消里程碑互用时，目标里程碑数据保留或清空的选择规则。 - 工单互用中源工单被删除后，目标工单删除是否需要保留审计快照。  ## 10. 来源需求  - `source:thoughts-v2-current/v2.3.x/贸易端/【贸易端】【订单管理】订单翻单功能.md` - `source:thoughts-v2-current/v2.3.x/贸易端/【贸易端】【订单管理】订单关联功能.md` - `source:thoughts-v2-current/v2.3.x/贸易端/【贸易端】【订单管理】里程碑互用功能.md` - `source:thoughts-v2-current/v2.3.x/贸易端/【贸易端】【订单管理】工单互用功能.md`", "domain": "贸易端", "module": "业务流程与产品流程图", "tags": "订单;翻单;订单关联;里程碑互用;工单互用", "sources": [{"title": "【贸易端】【订单管理】订单翻单功能", "version": "v2.3.x", "product_side": "贸易端", "module": "订单管理", "last_write_time": "2026-09-04T10:48:25"}, {"title": "【贸易端】【订单管理】订单关联功能", "version": "v2.3.x", "product_side": "贸易端", "module": "订单管理", "last_write_time": "2026-09-04T10:48:21"}, {"title": "【贸易端】【订单管理】里程碑互用功能", "version": "v2.3.x", "product_side": "贸易端", "module": "订单管理", "last_write_time": "2026-09-04T10:48:22"}, {"title": "【贸易端】【订单管理】工单互用功能", "version": "v2.3.x", "product_side": "贸易端", "module": "订单管理", "last_write_time": "2026-09-04T10:48:21"}]}, {"path": "docs/30-业务流程与产品流程图/订单生命周期.md", "title": "订单生命周期", "folder": "docs/30-业务流程与产品流程图", "text": " # 订单生命周期  ## 1. 流程定位  订单生命周期描述订单从创建、执行业务、推进里程碑和工单，到完成、取消或重启的完整状态变化，以及各状态下对里程碑、工单、批复和日志的影响。  ## 2. 状态机  stateDiagram-v2 [*] --> 进行中: 创建订单 进行中 --> 已完成: 完成订单 进行中 --> 已取消: 取消订单 已完成 --> 进行中: 重启订单 已取消 --> 进行中: 重启订单  ## 3. 主流程  flowchart TD A[\"创建订单\"] --> B[\"填写订单基本信息\"] B --> C[\"生成里程碑实例\"] C --> D[\"创建工单或处理里程碑批复\"] D --> E[\"工单采集、工单批复\"] E --> F[\"里程碑状态推进\"] F --> G{\"订单是否结束\"} G -->|否| D G -->|完成| H[\"完成订单\"] G -->|取消| I[\"取消订单并选择取消原因\"] H --> J[\"限制后续编辑和处理动作\"] I --> J J --> K[\"写入跟踪记录、历史记录和动态\"]  ## 4. 关键规则  | 动作 | 规则 | | --- | --- | | 创建订单 | 按业务模板主表单填写数据，生成对应里程碑 | | 编辑订单 | 需有编辑订单权限，已完成/已取消状态受限 | | 完成订单 | 仅进行中订单可完成；完成后订单和相关里程碑、工单处理动作受限 | | 取消订单 | 仅进行中订单可取消；需选择取消原因 | | 重启订单 | 已完成或已取消订单可按权限重启为进行中 | | 删除订单 | 需有删除订单权限；删除后相关链接应提示无权限或不可访问 |  ## 5. 完成订单后的影响  - 订单状态变更为已完成。 - 订单不可编辑、不可取消。 - 进行中的里程碑变更为已完成，其余里程碑状态按规则保持。 - 所有里程碑不可创建工单，不可修改状态，不可从其他订单互用里程碑，不可添加互用工单。 - 所有里程碑批复不可编辑、指派、修改处理人。 - 所有工单不可采集、批复、指派、修改处理人、发邮件协作、终止采集、删除工单。 - 跟踪记录增加完成订单记录。  ## 6. 取消订单后的影响  - 订单状态变更为已取消。 - 取消时需选择取消原因。 - 取消原因来自 FlowSpace 设置中的订单取消原因预设。 - 历史订单中保存取消时的文本，后续修改预设不影响已取消订单展示。 - 业务处理动作受限。 - 跟踪记录增加取消订单记录。  ## 7. 权限规则  | 操作 | 权限要求 | | --- | --- | | 查看订单 | 查看订单基本信息权限 + 数据围栏 | | 创建订单 | 创建订单权限 | | 编辑订单 | 编辑订单权限 | | 修改订单状态 | 修改订单状态权限 | | 删除订单 | 删除订单权限 | | 查看跟踪记录 | 查看跟踪记录权限 |  ## 8. 日志与审计  订单生命周期必须写入：  - 订单创建记录。 - 订单编辑历史。 - 完成、取消、重启记录。 - 跟踪记录。 - 自动化修改订单基本信息记录。 - 资源库同步或公式更新引发的系统自动执行日志。  ## 9. 待确认问题  - 订单重启后，已完成/已取消里程碑和工单是否恢复可处理的完整规则。 - 删除订单后，关联订单、翻单、互用数据如何展示和记录。 - 自动化是否允许对已完成或已取消订单继续执行某些动作。  ## 10. 来源需求  - `source:thoughts-v2-current/v2.2.x/贸易端/【贸易端】【订单详情】查看&操作.md` - `source:thoughts-v2-current/v2.2.x/贸易端/【贸易端】【订单列表】订单增删改.md` - `source:thoughts-v2-current/v2.3.x/贸易端/【贸易端】【订单列表】批量操作.md`", "domain": "贸易端", "module": "业务流程与产品流程图", "tags": "订单;生命周期;状态;跟踪记录", "sources": [{"title": "【贸易端】【订单详情】查看&操作", "version": "v2.2.x", "product_side": "贸易端", "module": "订单详情", "last_write_time": "2026-09-04T10:48:34"}, {"title": "【贸易端】【订单列表】订单增删改", "version": "v2.2.x", "product_side": "贸易端", "module": "订单列表", "last_write_time": "2026-09-04T10:48:34"}, {"title": "【贸易端】【订单列表】批量操作", "version": "v2.3.x", "product_side": "贸易端", "module": "订单列表", "last_write_time": "2026-09-04T10:48:20"}]}, {"path": "docs/30-业务流程与产品流程图/资源库引用与同步.md", "title": "资源库引用与同步", "folder": "docs/30-业务流程与产品流程图", "text": " # 资源库引用与同步  ## 1. 流程定位  资源库引用与同步描述团队资源库、协作资源库、分享数据与 FlowSpace 订单数据之间的应用关系。  本页使用 `FlowSpace` 作为标准产品术语；来源文档中的 `SCCS` 对应当前知识库中的 `FlowSpace`。  资源库应用不只是一期中的“订单字段引用资源库数据”，v2.5.x 已补充资源库分享、协作资源库权限、FlowSpace 关联多个资源表、订单引用时选择资源表等规则；v2.7 又补充 FlowSpace 应用数据范围和数据编辑历史记录。因此本页以 v2.5.x 和 v2.7 的迭代后口径为准。  ## 2. 完整业务流程  flowchart TD A[\"运营端配置资源库模板\"] --> B[\"贸易端创建团队资源库\"] B --> C[\"资源库设置：基础信息、角色、表权限、数据范围\"] C --> D[\"按表配置 FlowSpace 应用数据范围\"] C --> E[\"授权协作团队访问资源库表\"] E --> F[\"协作团队形成协作资源库并管理成员\"] C --> G[\"维护资源库表数据\"] G --> H[\"单条或整表资源库分享\"] D --> I[\"FlowSpace 设置关联资源库\"] F --> I I --> J[\"配置表单模块、资源表、订单字段与资源库字段映射\"] J --> K[\"订单或任务表单中选择资源表并引用资源库数据\"] D --> L[\"资源库数据编辑、删除或权限范围变化\"] L --> M{\"关联关系有效且命中同步策略\"} M -->|\"是\"| N[\"系统同步更新或清空已引用业务字段\"] M -->|\"否\"| O[\"订单保留历史文本或已引用数据\"] N --> P[\"资源库历史记录保留变更来源\"] O --> Q[\"通过历史记录追溯引用来源与变更\"]  ## 3. 资源库分享与协作资源库  ### 3.1 资源库设置链路  资源库设置是资源库应用到 FlowSpace 前的前置链路，不能只理解为“创建资源库后维护数据”。完整设置顺序如下：  flowchart LR A[\"创建资源库\"] --> B[\"编辑基础信息\"] B --> C[\"配置成员角色和协作方角色\"] C --> D[\"按资源表配置操作权限\"] D --> E[\"按资源表配置数据范围\"] E --> F[\"按资源表配置 FlowSpace 应用数据范围\"] F --> G[\"维护资源库表数据\"] G --> H[\"授权协作团队或开启分享\"] H --> I[\"FlowSpace 关联资源库\"]  设置项说明：  | 设置项 | 作用 | 对 FlowSpace 应用的影响 | | --- | --- | --- | | 基础信息 | 资源库名称等基础配置 | 影响资源库列表和引用弹窗中的资源库识别 | | 成员角色 | 控制本团队成员可见表、可操作表、可操作数据范围 | 当 FlowSpace 应用范围为“根据用户权限”时，影响用户可引用数据 | | 协作方角色 | 控制协作团队可见表、可操作表、可操作数据范围 | 决定协作资源库可见表，以及协作团队 FlowSpace 可引用的数据基础 | | 表权限 | 查看、创建、编辑、删除、导入、导出、批量操作等 | 没有查看权限的数据不可被引用或分享 | | 数据范围 | 全部、本人创建、自定义条件 | 与 FlowSpace 应用数据范围共同决定引用弹窗数据 | | FlowSpace 应用数据范围 | 所有数据、根据用户权限 | 控制同团队 FlowSpace 内引用资源库数据时是否按用户资源库权限过滤 | | 分享设置 | 单条或整表分享、只读、密码、失效 | 外部编辑会反向更新资源库数据，并可能触发同步策略 |  缺少以上任一设置，都可能导致 FlowSpace 关联后出现“可选表为空、引用弹窗无数据、协作团队不可见、同步范围不符合预期”等问题。  ### 3.2 分享能力  资源库分享用于让平台外用户或外部协作方查看、填写或维护资源库数据。典型场景包括工厂信息填报、规范文件共享、款式信息共享等。  | 分享对象 | 发起条件 | 数据范围 | 关键规则 | | --- | --- | --- | --- | | 单条数据分享 | 内部成员或协作团队成员拥有该条数据查看权限 | 当前单条数据 | 同一条数据可被多个成员分别分享，分享链接互不干扰 | | 整表数据分享 | 内部成员或协作团队成员拥有资源表查看权限 | 当前分享者可见的表数据范围 | 整表分享和单条数据分享可同时存在 | | 分享链接管理 | 按当前用户权限查看分享记录 | 管理员看权限范围内分享，成员看本人分享 | 列表仅展示有效分享记录 |  分享配置规则：  - 分享默认关闭，开启后展示分享配置并生成分享链接。 - 只读默认开启；关闭只读后，被分享者是否可编辑取决于分享者是否拥有编辑权限。 - 密码默认启用，随机生成 4 位密码，支持手动修改和重新生成；修改后原密码立即失效。 - 复制链接时，如启用密码，需要同时复制链接和密码。 - 分享者权限变更后，被分享者的数据查看和编辑权限同步变化。 - 分享者失去该条数据或该表查看权限后，分享链接失效；分享者重新获得权限后，原链接仍保持失效，需要重新分享。  ### 3.3 外部访问与编辑  | 场景 | 规则 | | --- | --- | | 打开启用密码的链接 | 先输入密码，密码错误提示“密码错误，请重新输入” | | 打开未启用密码的链接 | 直接进入分享数据页面 | | 链接失效 | 提示“链接已失效” | | 查看数据 | 可查看链接范围内的数据详情 | | 编辑数据 | 需未开启只读，且分享者仍拥有编辑权限；提交时再次校验权限 | | 筛选、排序、导出、批量下载、列统计 | 仅在当前链接数据范围内执行 | | 批量编辑 | 当前分享表数据可编辑时展示批量编辑入口 |  外部用户编辑后，更新资源库数据，并记录更新人、更新时间和游客信息。游客操作需要可追溯到分享人；若分享人为协作团队成员，还需体现所属团队和协作标识。  ### 3.4 协作资源库  主团队授权协作团队后，协作团队资源库列表展示协作类型资源库，并只展示授权给该协作团队且有查看权限的表。  协作资源库规则：  - 主团队资源库下展示已授权团队信息。 - 协作团队拥有多个角色时，权限叠加。 - 协作资源库设置包含成员管理。 - 具备协作资源库管理权限的成员可管理协作资源库设置和成员。 - 协作资源库成员角色包括资源库管理员和普通成员。 - 协作资源库管理员拥有当前协作资源库设置权限，以及主团队授权给本团队的相关表权限。  ## 4. FlowSpace 应用数据范围  资源库可按表配置 FlowSpace 应用数据范围，用于控制用户在 FlowSpace 订单中引用资源库数据时能看到哪些数据。  | 配置 | 说明 | | --- | --- | | 所有数据 | FlowSpace 关联该资源库表后，所有用户在订单中引用资源库数据时，可引用该表所有数据 | | 根据用户权限 | 用户在 FlowSpace 订单中引用资源库数据时，只可引用本人可查看的资源库数据 |  规则：  - 此处 FlowSpace 指与资源库所属同一团队下的 FlowSpace。 - 表头可批量设置所有资源表的应用数据范围。 - 修改配置后，需要保存才生效。 - 修改配置不影响 FlowSpace 已引用的数据。 - 再次编辑订单数据时，可引用数据范围按最新配置生效。 - 协作团队创建的 FlowSpace 引用协作资源库时，按主团队授权给该协作团队的数据范围处理；v2.7 来源中特别说明，此类协作场景暂不纳入同团队应用数据范围的复杂配置。  ### 4.1 引用弹窗数据计算口径  用户在 FlowSpace 中打开资源库引用弹窗时，可选数据不是单一权限决定，而是以下范围叠加后的结果：  可选资源库数据 = 已关联的资源表 ∩ 当前资源表仍有效 ∩ 当前用户对资源表有查看权限 ∩ 当前用户命中的资源库数据范围 ∩ 当前资源表的 FlowSpace 应用数据范围 ∩ 协作资源库授权范围（如引用协作资源库）  其中：  - FlowSpace 应用数据范围为“所有数据”时，不再按当前用户资源库数据范围过滤。 - FlowSpace 应用数据范围为“根据用户权限”时，必须按当前用户在资源库中的表权限和数据范围过滤。 - 协作资源库引用时，先受主团队授权给协作团队的资源表和数据范围限制，再受协作资源库成员角色限制。 - 已删除、已失效、已移除授权的资源表，不可继续出现在新引用选择范围中。  ## 5. FlowSpace 关联资源库  ### 5.1 入口与配置对象  FlowSpace 关联资源库在 FlowSpace 设置中配置，用于建立 FlowSpace 表单字段与资源库表字段之间的映射关系。拥有 FlowSpace 业务角色中“关联资源库”权限的成员才可配置。  关联配置不是全局只对订单主表单生效，而是按 FlowSpace 模板中的业务模块配置。来源文档中按 SCCS 模板列出主表单和各个里程碑，每个模块下可分别添加多组资源库关联关系。  可配置对象：  | 配置对象 | 规则 | | --- | --- | | 关联表单 | 订单模块沿用原有逻辑；资源库表可多选 | | 资源库表 | 最多选择 5 个资源表 | | 可选资源表范围 | 本团队创建的资源库表 + 协作团队授权的资源库表 | | 订单字段 | 同一订单字段只可出现在一组关联关系中 | | 资源库字段 | 选择几个资源表，就展示几列资源库字段映射 |  模块应用规则：  - 主表单字段可配置资源库引用，用于订单基础信息录入和编辑。 - 各里程碑下的工单采集、工单批复、里程碑批复字段，如配置了资源库关联，也应按对应模块的引用入口和同步策略处理。 - 同一模块下可添加多组关联关系。 - 同一订单字段在当前模块内不可被多组关联关系重复使用。 - 资源库关联配置属于 FlowSpace 设置类功能，需纳入 FlowSpace 设置操作日志。  ### 5.2 字段映射规则  - 关联资源库字段可以非必填。 - 每个订单字段后至少需要选择一个资源库表字段。 - 一组关联关系关联了几个资源表，订单中引用时即可从几个资源表中选择数据。 - 如果某个订单字段未关联某个资源表字段，引用该资源表整行数据时，该订单字段按空值处理，并清空该字段的关联关系。 - 地址控件可关联引用到 FlowSpace，但当资源库地址精度低于 FlowSpace 地址精度时，无法补齐的精度需要留空或按控件能力处理。  ### 5.3 保存校验  | 校验场景 | 提示或处理 | | --- | --- | | 当前用户无关联资源库权限 | 提示“暂无权限，请联系管理员” | | 关联资源表被删除 | 提示“资源库表已被删除，请重新选择” | | 协作资源表被主团队移除授权 | 提示关联资源表已不可用，需要重新选择 | | 订单模板字段被删除 | 对应字段提示“字段已被删除，请重新选择” | | 资源库字段被删除 | 对应字段提示“字段已被删除，请重新选择” | | 订单字段重复设置关联 | 提示“该字段已设置关联资源库，不可重复关联” |  ## 6. 订单引用资源库数据  ### 6.1 引用入口与选择资源表  用户点击已配置资源库关联的订单字段进行引用时，需要先选择资源表。  规则：  - 可选择范围为该字段已配置关联字段的所有资源表。 - 默认选中第一组配置关系中的第一个资源表。 - 选择资源表后，再选择对应资源表数据。 - 打开的引用弹窗数据都应为最新数据。 - 允许手动修改的字段，用户可手动输入，也可引用资源库数据；引用后仍可继续修改。 - 不允许手动修改的字段，点击输入框或引用按钮都打开引用数据弹窗。 - 再次进入引用弹窗时，需要记住上一次选中的选项。  ### 6.2 控件引用规则  | 订单字段类型 | 引用规则 | | --- | --- | | 单行文本、多行文本 | 直接填入文本；引用多选或关联引用时，多值用逗号分隔 | | 单选、多选 | 配置资源库引用后统一使用下拉样式；原运营端配置选项隐藏，只可通过资源库引用填值 | | 成员单选、多选 | 资源库数据中的成员未加入当前 FlowSpace 时不引用，并提示仅引用当前 FlowSpace 成员 | | 协作方单选、多选 | 资源库数据中的协作团队未加入当前 FlowSpace 时不引用，并提示仅引用当前 FlowSpace 协作团队 | | 关联引用 | 需要进入二级引用页面，一级选择当前资源表数据，二级选择关联引用控件关联的源表数据 |  关联引用特殊规则：  - 一级弹窗展示订单控件关联的资源表完整字段。 - 二级弹窗展示运营端配置的关联引用显示字段。 - 同一组关联关系中，多个订单字段关联了资源库的关联引用控件时，需要在二级弹窗一次性展示。 - 订单字段为单选时只能选一条数据。 - 订单字段为多选时可选择多条数据。 - 订单字段为其他类型时可选择多条数据，并以逗号分隔展示。  ## 7. 同步资源库策略  同步资源库用于控制资源库数据编辑、删除后，是否影响已经引用过资源库数据的订单主表单、工单采集、里程碑批复或工单批复数据。  ### 7.1 同步范围  | 同步策略 | 说明 | | --- | --- | | 不同步 | 资源库数据修改不影响已引用数据，默认选中 | | 同步指定日期及之后创建的新订单 | 需设置具体日期；该日期及之后创建的订单命中同步范围，包含当天 | | 同步所有进行中的订单 | 配置保存后，当下状态为进行中的订单命中同步范围 | | 同步所有订单 | 所有订单命中同步范围 |  规则：  - 配置修改本身不立即批量更新已有订单数据。 - 需要在后续资源库数据修改或删除时，按最新配置判断是否同步订单数据。 - 如果此前未设置同步资源库，后续改为同步，不因保存配置本身立即同步历史引用数据。 - 当开启同步资源库时，资源库数据更新需要同步到已引用过资源库数据的订单、里程碑批复和工单中。 - 若被同步字段位于工单、工单批复或里程碑批复中，需要遵循该业务对象当前是否允许系统自动更新的规则；当前知识库仍将“批复后是否允许字段被资源库同步更新”列为待确认风险。 - 资源库中的关联引用控件发生源头表数据修改，或运营端修改该关联引用控件的显示字段时，也需要同步更新订单中的引用值。  ### 7.2 同步触发  | 触发动作 | 处理 | | --- | --- | | 资源库数据编辑 | 命中同步策略时，更新已引用字段 | | 资源库数据删除 | 命中同步策略时，清空对应已引用字段或按失效规则处理 | | 资源库关联引用源数据修改 | 命中同步策略时，同步更新订单引用值 | | 关联引用显示字段配置变化 | 命中同步策略时，同步更新订单引用值 | | 分享链接外部用户编辑资源库数据 | 本质为资源库数据编辑，命中同步策略时同样触发同步 |  同步不由“保存关联配置”立即触发；保存配置只改变后续资源库变更时的判断规则。  ## 8. 失效、删除与历史保留  ### 8.1 关联关系失效  以下情况视为关联关系失效：  - 整个关联关系被删除。 - 字段关联关系被删除。 - 运营端模板中删除已关联的订单字段。 - 运营端模板中删除已关联的资源库字段。 - 资源库表被删除。 - 协作资源库表被主团队移除授权。  处理规则：  - 新订单不可继续引用失效的资源库表或字段。 - 已引用过资源库数据的订单保留历史文本或已引用数据。 - 关联关系失效后，即使资源库主团队继续修改资源库数据，也不再通过该失效关系同步更新历史引用数据。  ### 8.2 协作资源库数据不可见  当主团队修改资源库数据，导致授权给协作团队的数据范围发生变化，例如数据不再符合自定义权限条件时，v2.5.x 评审先按简单方案处理：  - 资源库主团队修改资源库数据时，也同步已经无权限的协作团队 FlowSpace 订单数据。 - 当满足同步资源库条件时，若资源库数据按删除或不可见处理，则对应订单字段按同步规则清空或失效。 - 后续如需改为“协作团队历史引用数据保留但关联断开，不再同步”，需要另行确认。  ## 9. 历史记录  资源库数据列表每条数据增加历史记录查看按钮。  规则：  - 可见该条数据的人可以查看历史记录。 - 历史记录按操作时间正序排序。 - 点击历史记录时默认查看最新一条记录。 - 导入成功时，资源库数据历史记录增加导入人操作的新增或修改记录。 - 批量编辑成功后，被编辑的数据增加编辑历史记录。 - 游客通过分享链接编辑数据时，需要记录游客操作，并增加分享人信息。  ## 10. 日志与审计  需要记录以下行为：  | 类型 | 记录内容 | | --- | --- | | 资源库操作 | 创建、编辑、删除资源库 | | 资源库权限 | 角色、成员、协作团队授权、表权限、数据范围变更 | | 分享操作 | 开启分享、关闭分享、复制链接、删除分享链接、外部编辑 | | FlowSpace 关联资源库 | 创建、编辑、删除关联关系，字段映射变更，同步策略变更 | | 资源库数据 | 创建、编辑、删除、导入、导出、批量编辑、批量下载 | | 系统同步 | 关联资源库数据同步更新时，订单侧不新增普通操作记录；资源库自身历史记录保留数据变更来源 | | 历史记录 | 单条资源库数据的编辑历史和游客操作追溯 |  审计口径：  - 资源库基础信息和权限管理变更，进入资源库设置操作日志。 - FlowSpace 关联资源库配置变更，进入 FlowSpace 设置操作日志。 - 资源库数据编辑、导入、批量编辑、外部分享编辑，进入资源库数据历史记录。 - 关联资源库数据同步更新时，来源需求明确“因关联的是资源库数据 ID，所以订单这边不增加记录”。 - 如果自动化被“资源库数据变更”触发，则自动化执行日志中操作人显示为自动程序，名称可体现“资源库数据变更”；这属于自动化执行审计，不等同于订单侧人工操作记录。  ## 11. 待确认问题  - 资源库同步与自动化更新同一字段时的优先级。 - 资源库引用字段被手动修改后，再次资源库同步时是否覆盖手动修改值。 - 协作资源库数据不可见后的长期规则是否继续沿用 v2.5.x 评审的简单方案。 - 关联关系失效后的历史快照字段范围是否需要明确为文本、引用 ID、来源资源库、来源表、来源数据 ID。 - 工单、工单批复、里程碑批复完成或锁定后，资源库同步是否仍可更新对应字段。  ## 12. 来源需求  - `source:thoughts-v2-current/V2.4.x/贸易端/【贸易端】【资源库】第一阶段.md` - `source:thoughts-v2-current/V2.5.x/贸易端/【贸易端】【资源库】资源库分享.md` - `source:thoughts-v2-current/v2.7/贸易端/【贸易端】【资源库】SCCS应用数据范围、数据编辑历史记录.md` - `source:thoughts-v2-current/V2.4.x/贸易端/【贸易端】【操作日志】所有设置类功能.md` - `source:thoughts-v2-current/V2.4.x/贸易端/系统自动执行的相关操作日志.md`", "domain": "贸易端", "module": "业务流程与产品流程图", "tags": "资源库;引用;同步;资源库分享;协作资源库;FlowSpace应用数据范围;历史记录", "sources": [{"title": "【贸易端】【资源库】第一阶段", "version": "V2.4.x", "product_side": "贸易端", "module": "资源库", "last_write_time": "2026-09-04T10:48:14"}, {"title": "【贸易端】【资源库】资源库分享", "version": "V2.5.x", "product_side": "贸易端", "module": "资源库", "last_write_time": "2026-09-04T10:48:03"}, {"title": "【贸易端】【资源库】SCCS应用数据范围、数据编辑历史记录", "version": "v2.7", "product_side": "贸易端", "module": "资源库", "last_write_time": "2026-09-04T10:47:57"}, {"title": "【贸易端】【操作日志】所有设置类功能", "version": "V2.4.x", "product_side": "贸易端", "module": "操作日志", "last_write_time": "2026-09-04T10:48:09"}, {"title": "系统自动执行的相关操作日志", "version": "V2.4.x", "product_side": "贸易端", "module": "贸易端", "last_write_time": "2026-09-04T10:48:06"}]}, {"path": "docs/30-业务流程与产品流程图/跨团队协作.md", "title": "跨团队协作", "folder": "docs/30-业务流程与产品流程图", "text": " # 跨团队协作  ## 1. 流程定位  跨团队协作描述主团队如何邀请外部团队建立协作关系，并将协作团队加入具体 FlowSpace 参与订单、里程碑、工单和批复处理。  ## 2. 流程图  flowchart TD A[\"主团队邀请协作团队\"] --> B[\"协作团队接受邀请\"] B --> C[\"建立团队层协作关系\"] C --> D[\"主团队将协作团队加入 FlowSpace\"] D --> E[\"设置协作方角色、数据围栏、协作里程碑\"] E --> F[\"协作团队对接人默认加入\"] F --> G[\"工单或批复中选择协作团队/协作成员\"] G --> H{\"是否负责人模式\"} H -->|是| I[\"协作方指派具体成员\"] H -->|否| J[\"具体成员直接处理\"] I --> J  ## 3. 两层协作关系  | 层级 | 说明 | | --- | --- | | 团队层协作 | 当前团队与外部团队建立协作关系，是加入 FlowSpace 的前置关系 | | FlowSpace 层协作 | 将已建立关系的协作团队加入具体 FlowSpace，并设置角色、数据围栏和协作里程碑 |  ## 4. 权限规则  | 场景 | 权限来源 | | --- | --- | | 邀请协作团队 | 团队设置权限 | | 将协作团队加入 FlowSpace | FlowSpace 设置权限 | | 设置协作方角色 | FlowSpace 设置权限 | | 协作成员查看订单/工单 | 协作方角色 + 数据围栏 | | 协作方指派成员 | 对应里程碑或工单的指派权限 | | 协作成员采集/批复 | 被指派或被授权为处理人 |  ## 5. 关键规则  - 团队层协作使用团队码发起邀请。 - 被邀请团队中有团队设置权限的成员收到邀请。 - 协作团队接受后，才能被加入具体 FlowSpace。 - 添加协作团队到 FlowSpace 时，可设置协作方角色、数据围栏、协作里程碑。 - 协作团队拥有者默认成为该 FlowSpace 的对接人。 - 删除协作团队会同步影响其参与的 FlowSpace。 - 相关邮件和消息跳转时，如果权限已失效，应提示暂无权限。  ## 6. 通知与日志  需要记录：  - 协作团队邀请。 - 接受或拒绝协作邀请。 - 将协作团队加入 FlowSpace。 - 设置协作方角色、数据围栏、协作里程碑。 - 删除协作团队。 - 协作方指派、采集、批复相关动态。  ## 7. 待确认问题  - 对接人、负责人、有指派权限成员三者边界是否完全一致。 - 删除协作团队后的任务批量移交规则。 - 协作团队创建的 FlowSpace 引用主团队授权资源库数据的完整规则。  ## 8. 来源需求  - `source:thoughts-v2-current/v2.0.x/贸易端/【贸易端】【团队设置】团队信息、角色、成员、协作团队管理.md` - `source:thoughts-v2-current/v2.1.x/贸易端/【贸易端】【协作SCCS设置】.md` - `source:thoughts-v2-current/v2.1.x/贸易端/【贸易端】【SCCS设置】.md` - `source:thoughts-v2-current/v2.2.x/贸易端/【贸易端】【订单详情】工单&里程碑批复操作.md`", "domain": "贸易端", "module": "业务流程与产品流程图", "tags": "团队;协作团队;协作FlowSpace;指派", "sources": [{"title": "【贸易端】【团队设置】团队信息、角色、成员、协作团队管理", "version": "v2.0.x", "product_side": "贸易端", "module": "团队设置", "last_write_time": "2026-09-04T10:48:47"}, {"title": "【贸易端】【协作SCCS设置】", "version": "v2.1.x", "product_side": "贸易端", "module": "协作SCCS设置", "last_write_time": "2026-09-04T10:48:42"}, {"title": "【贸易端】【订单详情】工单&里程碑批复操作", "version": "v2.2.x", "product_side": "贸易端", "module": "订单详情", "last_write_time": "2026-09-04T10:48:34"}]}, {"path": "docs/40-权限、安全与审计/FlowSpace业务角色权限.md", "title": "FlowSpace业务角色权限", "folder": "docs/40-权限、安全与审计", "text": " # FlowSpace业务角色权限  ## 1. 功能定位  FlowSpace 业务角色用于控制主团队成员在当前 FlowSpace 内的业务操作权限和相关表单数据权限。它决定成员能否查看、创建、编辑、删除订单，能否处理里程碑和工单，以及能否配置自动化、资源库关联、仪表盘等 FlowSpace 工具能力。  ## 2. 角色模型  | 角色 | 规则 | | --- | --- | | 业务管理员 | 固定角色，拥有当前 FlowSpace 业务角色中的所有权限；不可删除，不可修改权限勾选，但可修改成员 | | 自定义业务角色 | 可配置角色名称、成员、权限点和订单权限范围 | | 成员 | 来自当前 FlowSpace 成员列表；同一成员拥有多个角色时权限叠加 |  ## 3. FlowSpace 工具权限  | 权限名称 | 控制功能 | | --- | --- | | FlowSpace 设置 | 当前 FlowSpace 的成员、协作团队、角色、数据围栏和业务设置 | | 仪表盘管理 | 查看当前 FlowSpace 所有仪表盘数据，并配置各仪表盘的可见成员 | | 关联资源库 | 配置 FlowSpace 与资源库数据的关联 | | 数据移交 | 在当前 FlowSpace 内发起数据移交、查看移交记录 |  `自动化配置` 不再作为贸易端 FlowSpace 业务角色权限点配置。贸易端 FlowSpace 设置 - 业务角色权限应隐藏该勾选项，团队设置 - 角色权限中的内部 FlowSpace 管理也不再描述为可控制自动化配置。是否展示自动化配置入口改由运营端团队列表的功能权限配置决定，且服务端需拒绝或忽略贸易端旧接口提交的该权限点。  ## 4. 订单权限  | 权限名称 | 控制功能 | | --- | --- | | 创建订单 | 订单列表创建订单 | | 导入订单 | Excel 导入订单、PDF 导入订单 | | 查看订单基本信息 | 订单列表查看订单、订单详情主表单 | | 查看跟踪记录 | 订单详情跟踪记录 | | 编辑订单 | 订单列表编辑/批量编辑、订单详情编辑 | | 修改订单状态 | 完成订单、取消订单、还原订单 | | 删除订单 | 订单列表或订单详情删除订单 | | 订单关联/取消关联 | FlowSpace 内订单关联或取消关联 | | FlowSpace 间订单关联/取消关联 | 与其他 FlowSpace 的订单关联或取消关联 | | 订单翻单/取消翻单 | 订单列表或订单详情翻单 |  ## 5. 里程碑权限  里程碑权限按不同里程碑分别控制。  | 权限名称 | 控制功能 | | --- | --- | | 查看工单 | 工单视图和订单详情查看工单 | | 查看里程碑批复 | 里程碑批复视图和订单详情查看里程碑批复 | | 创建工单 | 订单详情创建工单、订单列表或工单视图批量创建工单 | | 修改处理人 | 修改进行中的里程碑批复人、工单批复人、工单采集人 | | 删除工单 | 订单列表删除工单 | | 终止采集 | 订单详情终止工单采集 | | 修改里程碑状态 | 完成、取消、重开里程碑；批量修改里程碑状态 | | 里程碑互用/取消互用 | 将里程碑数据互用给其他订单或取消互用 | | 工单互用/取消互用 | 将工单互用给其他订单或取消互用 | | 导入工单 | 在订单列表或对应里程碑工单列表导入工单 |  ## 6. 订单权限范围  | 范围 | 说明 | | --- | --- | | 所有订单 | 不限制订单范围 | | 本人创建的订单 | 仅当前登录用户创建的订单 | | 自定义 | 通过条件限定订单范围；条件为空时表示无任何订单权限 |  自定义条件字段范围为主表单模板字段、订单创建人、订单状态等。成员控件、订单创建人、更新人可选择“当前用户”；协作方控件可选择“当前团队”。  通用条件配置口径见 [通用条件规则](../20-业务对象与数据模型/通用条件规则.md)。订单负责人作为订单系统字段后，也应进入自动化、标签设置和自定义权限的条件设置范围。订单负责人默认不直接赋予订单可见或操作权限；只有自定义权限条件配置了订单负责人时，才按条件命中结果影响数据范围。  ## 7. 勾选联动规则  - 勾选“查看订单基本信息”以下的订单权限时，必须同时勾选“查看订单基本信息”。 - 勾选任意里程碑权限时，必须同时勾选“查看订单基本信息”。 - 勾选“查看里程碑批复”时，必须同时勾选“查看工单”。 - 勾选“查看里程碑批复”之后的权限时，必须同时勾选“查看工单”和“查看里程碑批复”。 - 勾选权限后，才可设置对应行的订单权限范围。 - 当“查看订单基本信息”的订单范围为“本人创建”或“自定义”时，其余权限范围必须保持一致。  ## 8. 成员与失效  - 删除业务角色后，使用该角色的成员失去对应角色权限。 - 从 FlowSpace 删除成员后，该成员不可查看当前 FlowSpace 相关业务数据；任务中心相关工单隐藏；相关邮件和消息跳转需提示“暂无权限”。 - 从团队设置删除成员导致成员从 FlowSpace 中删除时，也需要在 FlowSpace 设置操作日志中记录删除。  ## 9. 审计要求  FlowSpace 设置操作日志需要覆盖业务角色新增、编辑、删除。运营端模板修改不记录在 FlowSpace 设置操作日志中。  ## 10. 待确认问题  - 完整业务角色权限矩阵仍依赖外部表格，建议导出为本地来源。 - 状态限制与权限点之间的优先级需要在订单、里程碑、工单细页继续补全。 - 成员删除后的任务交接已由 FlowSpace 数据移交承接；订单负责人默认不直接赋予订单权限，需通过自定义权限条件配置；移交后权限命中范围是否需要立即刷新仍需结合权限服务确认。 ", "domain": "贸易端", "module": "权限", "tags": "权限;FlowSpace;业务角色;订单权限", "sources": [{"title": "【贸易端】【SCCS设置】", "version": "v2.1.x", "product_side": "贸易端", "module": "SCCS设置", "last_write_time": "2026-09-04T10:48:45"}, {"title": "【贸易端】【仪表盘】权限管理", "version": "V2.5.x", "product_side": "贸易端", "module": "仪表盘", "last_write_time": "2026-09-04T10:48:00"}, {"title": "【贸易端】【订单列表】工单导入、导出", "version": "v2.3.x", "product_side": "贸易端", "module": "订单列表", "last_write_time": "2026-09-04T10:48:17"}, {"title": "【贸易端】【操作日志】所有设置类功能", "version": "V2.4.x", "product_side": "贸易端", "module": "操作日志", "last_write_time": "2026-09-04T10:48:09"}, {"title": "【贸易端】FS 数据移交", "version": "v2.8", "product_side": "贸易端", "module": "贸易端", "last_write_time": "2026-09-04T10:47:56"}, {"title": "【运营端】【团队列表-功能权限】自动化权限移至运营端管理", "version": "v2.8", "product_side": "运营端", "module": "团队列表-功能权限", "last_write_time": "2026-09-04T10:47:47"}]}, {"path": "docs/40-权限、安全与审计/README.md", "title": "40 权限、安全与审计", "folder": "docs/40-权限、安全与审计", "text": "# 40 权限、安全与审计  本目录用于沉淀角色权限、数据围栏、安全边界、操作日志、历史记录和系统执行审计。  ## 页面  - [权限体系总表](./权限体系总表.md) - [团队权限](./团队权限.md) - [FlowSpace 业务角色权限](./FlowSpace业务角色权限.md) - [协作 FlowSpace 权限](./协作FlowSpace权限.md) - [资源库权限](./资源库权限.md) - [仪表盘与报告权限](./仪表盘与报告权限.md) - [数据围栏](./数据围栏.md) - [操作日志](./操作日志.md) - [订单跟踪记录](./订单跟踪记录.md) - [动态与评论](./动态与评论.md) - [历史记录与快照](./历史记录与快照.md) - [系统与集成执行日志](./系统与集成执行日志.md) - [自动化与系统执行日志](./自动化与系统执行日志.md) ", "domain": "公共能力", "module": "权限、安全与审计", "tags": "40-权限、安全与审计;40 权限、安全与审计", "sources": []}, {"path": "docs/40-权限、安全与审计/仪表盘与报告权限.md", "title": "仪表盘与报告权限", "folder": "docs/40-权限、安全与审计", "text": " # 仪表盘与报告权限  ## 1. 功能定位  仪表盘与报告权限控制分析类内容的查看、授权和入口展示。仪表盘偏向 FlowSpace 内统计分析页面，报告偏向订单、里程碑、工单报告页面。  ## 2. 仪表盘管理权限  | 来源 | 权限效果 | | --- | --- | | 团队角色：内部 FlowSpace 管理 | 可查看本团队创建的所有内部 FlowSpace 仪表盘数据，并可对这些仪表盘授权 | | FlowSpace 业务角色：仪表盘管理 | 可查看当前 FlowSpace 所有仪表盘数据，并可对这些仪表盘授权 |  有团队角色“内部 FlowSpace 管理”或当前 FlowSpace 业务角色“仪表盘管理”的用户，可以配置当前 FlowSpace 仪表盘权限。  ## 3. 单个仪表盘权限配置  配置弹窗列出已添加到当前 FlowSpace 的内部成员和协作团队成员。  | 配置项 | 规则 | | --- | --- | | 模糊搜索 | 同时搜索内部成员姓名、协作团队名称、协作成员姓名 | | 内部成员 | 未注册成员也可以授权 | | 协作团队成员 | 两级下钻选择成员，未注册成员也可以授权 | | 已选 | 显示已选计数；左右列表选中状态需要同步 | | 协作标识 | 协作成员头像需要增加协作标识 | | 权限校验 | 当前用户无仪表盘管理权限时，提示暂无权限 |  当某个成员在授权后被移出 FlowSpace，对应仪表盘权限列表也需要删除该成员；重新加入后需重新授权。  ## 4. 仪表盘权限汇总  仪表盘分组下可查看当前 FlowSpace 所有仪表盘权限分布。有仪表盘管理权限的成员可见。  汇总展示：  - 可管理成员：当前 FlowSpace 拥有仪表盘配置权限的成员，包括团队角色和 FlowSpace 角色有权限成员。 - 各仪表盘内部可见成员。 - 各仪表盘协作团队可见成员。 - 协作团队成员按协作团队名称分组展示。  ## 5. 仪表盘查看  - 可以管理当前 FlowSpace 仪表盘的用户，可查看当前 FlowSpace 所有仪表盘数据。 - 被授权部分仪表盘查看权限的成员、协作团队成员，只能查看被授权仪表盘数据。 - 可查看仪表盘均可星标，星标后在工作台常用视图展示。 - 仪表盘权限被取消后，常用视图同步隐藏；重新授权后如需展示，需要重新星标。  ## 6. 报告类型  | 报告 | 入口规则 | | --- | --- | | 订单报告 | 有一个报告时展示“查看报告”；多个报告时下拉多个报告名称 | | 里程碑报告 | 同上 | | 工单报告 | 同上 |  报告查看页支持打印。前端有相关报告权限才展示按钮，点击按钮后仍需再次判断权限；无权限提示暂无权限。  ## 7. 报告权限矩阵  | 角色或身份 | 订单报告 | 里程碑报告 | 工单报告 | | --- | --- | --- | --- | | 团队角色：内部 FlowSpace 管理 | 可看 | 可看 | 可看 | | FlowSpace 角色：查看订单报告 | FlowSpace 内可看 | 不适用 | 不适用 | | FlowSpace 角色：查看里程碑报告 | 不适用 | FlowSpace 内可看 | 不适用 | | FlowSpace 角色：查看工单报告 | 不适用 | 不适用 | FlowSpace 内可看 | | 里程碑批复人 | 不适用 | 参与里程碑批复的里程碑可看 | 参与里程碑批复的工单可看 | | 工单批复人 | 不适用 | 不适用 | 参与批复工单可看 | | 工单采集人 | 不适用 | 不适用 | 参与采集工单可看 | | 协作团队：里程碑批复指派 | 不适用 | 本团队参与里程碑批复的里程碑可看 | 本团队参与里程碑批复的工单可看 | | 协作团队：工单批复指派 | 不适用 | 不适用 | 本团队参与工单批复的工单可看 | | 协作团队：工单采集指派 | 不适用 | 不适用 | 本团队参与工单采集的工单可看 |  ## 8. 待确认问题  - 报告权限中的“查看订单报告/里程碑报告/工单报告”是否已在当前 FlowSpace 业务角色和协作方角色页面完整配置，需要补来源。 - 仪表盘查看是否受数据围栏影响，需要与实际统计口径核对。 - 仪表盘和报告的操作日志是否有独立记录需求，当前资料未完整覆盖。 ", "domain": "贸易端", "module": "权限、安全与审计", "tags": "权限;仪表盘;报告;可见性", "sources": [{"title": "【贸易端】【仪表盘】权限管理", "version": "V2.5.x", "product_side": "贸易端", "module": "仪表盘", "last_write_time": "2026-09-04T10:48:00"}, {"title": "【贸易端】报告权限", "version": "V2.5.x", "product_side": "贸易端", "module": "贸易端", "last_write_time": "2026-09-04T10:48:04"}]}, {"path": "docs/40-权限、安全与审计/动态与评论.md", "title": "动态与评论", "folder": "docs/40-权限、安全与审计", "text": "# 动态与评论  ## 定位  动态是工单和里程碑批复级别的过程记录，用于展示采集、批复、指派、修改处理人、终止采集、互用、评论等事件。动态同时承担协作评论入口和未读角标提示。  ## 动态类型  | 类型 | 说明 | |---|---| | 修改 | 创建工单、采集工单、批复工单、创建或编辑里程碑批复等 | | 评论 | 成员在工单或里程碑批复动态中发表评论 | | 其他 | 指派、修改处理人、终止采集、工单互用、取消互用等 |  动态按操作时间正序排序。  ## 工单动态  有工单动态的页面包括查看工单、工单采集、工单批复。动态按钮数字角标表示当前成员上次打开这些页面之后新增的评论数。  ### 参与人  工单动态参与人包括：  1. 工单发起人。 2. 采集人。 3. 批复人。 4. 里程碑批复人。  对接人或负责人未指派时，处理人头像显示协作团队头像；已指派后展示对应协作成员头像并增加协作标识。已提交的采集人、批复人头像展示已提交标识。  ### 过滤  | 过滤项 | 说明 | |---|---| | 所有 | 展示所有类型动态 | | 仅评论 | 只展示评论类动态，默认过滤该项 | | 仅修改历史 | 只展示修改表单类型动态，此类动态可查看编辑历史记录 |  ### 典型记录  | 操作 | 动态文案 | |---|---| | 创建工单 | `$操作人 创建了工单` | | 导入工单 | `$操作人 导入工单` | | 采集工单或修改工单采集部分 | `$操作人 编辑了工单` | | 批复工单 | `$操作人 批复了工单，工单无法继续编辑` | | 协作方指派采集 | `$操作人 将工单任务指派给 $被指派人...` | | 协作方指派批复 | `$操作人 将工单批复任务指派给 $被指派人...` | | 修改采集人 | `$操作人 将工单任务处理人修改为 $修改后成员...` | | 修改批复人 | `$操作人 将工单批复人修改为 $修改后成员...` | | 移交工单采集人 | `$执行人 已将工单任务从 $原处理人 移交给 $新处理人...` | | 移交工单批复人 | `$执行人 已将工单批复任务从 $原处理人 移交给 $新处理人...` | | 终止采集 | `$操作人 终止采集，工单无法继续编辑` | | 工单互用于 | `$操作人 将此工单互用于 $订单标识` | | 取消互用 | `$操作人 取消 $订单标识 互用此工单` |  修改处理人前后不一致时才记录。  ## 里程碑批复动态  有里程碑批复动态的页面为查看里程碑批复。动态按钮数字角标表示当前成员上次打开页面之后新增的评论数。  ### 参与人  里程碑批复动态参与人包括发起人和里程碑批复人。协作团队未指派时展示协作团队头像；已指派后展示具体协作成员头像并增加协作标识。  ### 典型记录  | 操作 | 动态文案 | |---|---| | 创建里程碑批复 | `$操作人 创建了里程碑批复` | | 里程碑批复 | `$操作人 编辑了里程碑批复` | | 协作方指派里程碑批复 | `$操作人 将里程碑批复任务指派给 $被指派人...` | | 修改里程碑批复人 | `$操作人 将里程碑批复人修改为 $修改后成员...` | | 协作方修改批复指派 | `$操作人 将其团队的里程碑批复人修改为 $被指派人...` | | 移交里程碑批复人 | `$执行人 已将里程碑批复任务从 $原处理人 移交给 $新处理人...` |  ## 评论与通知  评论支持 @ 成员、@ 团队和 @ 所有参与者。  | @对象 | 通知规则 | |---|---| | @成员 | 仅通知对应成员 | | @团队 | 通知该团队下参与当前工单或里程碑批复的成员 | | @所有参与者 | 当前工单或里程碑批复的所有参与成员都收到消息和邮件 | | 不@成员 | 不发送通知，仅在详情页面动态按钮上显示未读角标 |  成员支持按姓名或邮箱模糊搜索；团队支持按团队名称或简称模糊搜索。  工单评论可 @ 工单发起人、当前采集人、当前工单批复人、里程碑批复人，以及这些身份所属团队。里程碑批复评论可 @ 发起人、当前里程碑批复人及相关团队。  ## 采集端一致性  采集端任务详情页中的工单动态和里程碑批复动态，数据与操作规则同贸易端。采集端参与评论、查看动态时，应复用同一套动态记录和未读角标规则。  ## 关联页面  - [工单采集与批复](../30-业务流程与产品流程图/工单采集与批复.md) - [移动端采集](../30-业务流程与产品流程图/移动端采集.md) - [消息中心与实时通知](../10-功能模块详情/消息中心与实时通知.md) - [历史记录与快照](./历史记录与快照.md)  ## 来源  - `source:thoughts-v2-current/v2.2.x/贸易端/【贸易端】【订单详情】工单&里程碑批复操作.md` - `source:thoughts-v2-current/v2.3.x/贸易端/【贸易端】【工单视图】批量操作：批量发邮件协作、批量采集.md` - `source:thoughts-v2-current/v2.3.x/采集端/【采集端】【任务详情页】工单、工单批复、里程碑批复详情页.md` - `source:thoughts-v2-current/v2.8/贸易端/【贸易端】FS 数据移交.md` ", "domain": "贸易端", "module": "权限、安全与审计", "tags": "动态;评论;工单;里程碑批复;未读角标", "sources": [{"title": "【贸易端】【订单详情】工单&里程碑批复操作", "version": "v2.2.x", "product_side": "贸易端", "module": "订单详情", "last_write_time": "2026-09-04T10:48:34"}, {"title": "【贸易端】【工单视图】批量操作：批量发邮件协作、批量采集", "version": "v2.3.x", "product_side": "贸易端", "module": "工单视图", "last_write_time": "2026-09-04T10:48:18"}, {"title": "【采集端】【任务详情页】工单、工单批复、里程碑批复详情页", "version": "v2.3.x", "product_side": "采集端", "module": "任务详情页", "last_write_time": "2026-09-04T10:48:26"}]}, {"path": "docs/40-权限、安全与审计/协作FlowSpace权限.md", "title": "协作FlowSpace权限", "folder": "docs/40-权限、安全与审计", "text": " # 协作FlowSpace权限  ## 1. 功能定位  协作 FlowSpace 权限控制外部协作团队成员在链主方 FlowSpace 中能看什么、能处理什么、能否指派协作任务。它由链主方在 FlowSpace 设置中授予协作团队角色和协作里程碑，再由协作团队在协作 FlowSpace 设置中分配具体成员。  ## 2. 权限来源  | 来源 | 说明 | | --- | --- | | 链主方 FlowSpace 协作方角色 | 链主方创建，选择协作团队并配置订单、里程碑、工单相关权限 | | 协作团队自建角色 | 协作团队在协作 FlowSpace 设置中自建，控制本团队成员对协作任务的查看和指派 | | 对接人角色 | 协作团队固定角色，可管理角色和成员，并可指派所有协作任务 | | 主团队角色 | 链主方创建并开放给当前协作团队的角色，协作团队只能编辑成员，不能改权限点 |  ## 3. 链主方配置规则  链主方在 FlowSpace 设置中添加协作团队时，可配置：  - 协作方角色。 - 数据围栏。 - 协作的里程碑。  添加协作团队到 FlowSpace 时，协作团队拥有者默认成为该 FlowSpace 的对接人。链主方删除协作团队后，该协作团队所有成员在当前 FlowSpace 相关业务数据不可查看，任务中心相关工单隐藏，相关邮件和消息跳转提示暂无权限。  ## 4. 协作团队角色权限点  | 权限分类 | 权限名称 | 控制功能 | | --- | --- | --- | | FlowSpace 工具权限 | FlowSpace 设置 | 当前协作 FlowSpace 的设置权限 | | FlowSpace 工具权限 | 数据移交 | 在本协作团队可管理范围内发起数据移交、查看移交记录 | | 订单权限 | 查看订单基本信息 | 订单列表查看订单、订单详情主表单 | | 里程碑权限 | 查看工单 | 工单视图和订单详情查看工单 | | 里程碑权限 | 查看里程碑批复 | 里程碑批复视图和订单详情查看里程碑批复 | | 里程碑权限 | 工单采集/指派 | 指派或修改本团队工单采集成员，也可处理相关采集任务 | | 里程碑权限 | 工单批复/指派 | 指派或修改本团队工单批复成员，也可处理相关批复任务 | | 里程碑权限 | 里程碑批复/指派 | 指派或修改本团队里程碑批复成员，也可处理相关批复任务 |  ## 5. 订单范围  | 范围 | 说明 | | --- | --- | | 所有参与协作的订单 | 当前协作团队作为工单采集人、工单批复人、里程碑批复人的订单 | | 自定义 | 在本团队参与的所有订单基础上，再按主表单字段设置限制条件 |  协作方自定义订单范围是在“参与协作订单”的基础上收窄，不是跨越链主方授权范围的扩权。  ## 6. 勾选联动规则  - 勾选工单采集/指派、工单批复/指派时，需要同时勾选查看工单。 - 勾选里程碑批复/指派时，需要同时勾选查看里程碑批复。 - 勾选查看里程碑批复时，需要同时勾选查看工单。 - 勾选任意里程碑权限时，需要同时勾选查看订单基本信息。 - 自定义订单范围权限跟随查看订单基本信息。  ## 7. 消息通知设置  协作团队自建角色中，里程碑任务指派权限旁可设置“对接人不再接收此类消息通知”。打开时，如果当前里程碑对应权限尚无其他角色勾选，需要提醒：暂未设置其他成员接收该类消息，打开后可能无法及时通知。  ## 8. 成员管理规则  - 协作 FlowSpace 成员来自已成功加入本团队的成员。 - 添加成员时可设置角色，多选且非必填。 - 删除最后一名对接人时不可删除，提示至少保留一名对接人。 - 删除成员后，该成员当前 FlowSpace 相关业务数据不可查看；任务中心相关工单隐藏；相关邮件、消息跳转提示暂无权限。 - 删除成员后，如该成员仍持有可移交数据，拥有数据移交权限的成员进入 FlowSpace 时需要看到待移交提醒。  ## 9. 审计要求  协作 FlowSpace 设置操作日志需要记录：  - 自建角色新增、编辑、删除。 - 主团队角色编辑，仅记录成员编辑。 - 成员管理新增、删除、设置权限。  主团队修改或删除协作方角色，不记录在协作方 FlowSpace 的操作日志中。  ## 10. 待确认问题  - “对接人”“有指派权限成员”“任务实际处理人”在所有通知和任务列表中的边界需要继续校验。 - 链主方删除协作里程碑权限时，协作团队历史任务和历史记录是否保留完整可见，需要补规则。 ", "domain": "贸易端", "module": "权限", "tags": "权限;协作FlowSpace;协作方角色;对接人", "sources": [{"title": "【贸易端】【SCCS设置】", "version": "v2.1.x", "product_side": "贸易端", "module": "SCCS设置", "last_write_time": "2026-09-04T10:48:45"}, {"title": "【贸易端】【协作SCCS设置】", "version": "v2.1.x", "product_side": "贸易端", "module": "协作SCCS设置", "last_write_time": "2026-09-04T10:48:42"}, {"title": "【贸易端】【操作日志】所有设置类功能", "version": "V2.4.x", "product_side": "贸易端", "module": "操作日志", "last_write_time": "2026-09-04T10:48:09"}, {"title": "【贸易端】FS 数据移交", "version": "v2.8", "product_side": "贸易端", "module": "贸易端", "last_write_time": "2026-09-04T10:47:56"}]}, {"path": "docs/40-权限、安全与审计/历史记录与快照.md", "title": "历史记录与快照", "folder": "docs/40-权限、安全与审计", "text": "# 历史记录与快照  ## 定位  历史记录用于查看订单主表单、工单、里程碑批复、资源库数据和邮件协作等实体在创建、编辑、采集、批复、导入、同步过程中的字段快照。它回答“某次修改前后字段值是什么”。  ## 通用展示规则  历史记录通常由左侧操作记录和右侧历史快照组成。  | 区域 | 说明 | |---|---| | 编辑日志 | 展示创建、编辑、采集、批复、导入等操作 | | 字段修改次数统计 | 统计字段被修改次数 | | 历史快照 | 切换到当前选中操作记录对应的字段快照 |  快照差异标记：  | 差异 | 标记 | |---|---| | 本次新增内容 | 绿色 | | 本次删除内容 | 红色 | | 本次修改内容 | 原内容红色，新内容绿色 | | 创建记录 | 不显示新增或删除标记 |  字段修改次数统计只统计创建以外的修改记录，并且变更前后值不一致才计数。排序按模板布局顺序，支持搜索字段。  ## 订单主表单历史记录  订单主表单历史记录记录创建订单和编辑订单历史。  | 项目 | 规则 | |---|---| | 编辑日志 | 包括创建、编辑，按操作时间倒序 | | 字段统计 | 统计主表单字段修改次数 | | 快照 | 展示当前选中操作记录的主表单快照 |  订单导入新增或更新时，也会生成订单主表单历史记录。批量编辑订单时，被编辑订单主表单增加编辑历史记录。  ## 工单历史记录  工单历史记录可从修改类动态后的“查看历史”进入，用于查看工单创建、采集、批复的历史快照。  | 项目 | 规则 | |---|---| | 编辑日志 | 包括创建、采集、批复，按操作时间正序 | | 动态定位 | 从某条修改动态进入时，定位到对应菜单 | | 字段统计 | 统计工单字段被修改次数 | | 快照 | 展示当前选中操作记录的工单快照 |  采集提交、批复提交、导入工单、批量创建工单、自动化更新和外部 API 更新，都可能增加工单历史记录。  ## 里程碑批复历史记录  里程碑批复历史记录规则同工单历史记录，主要记录里程碑批复创建、编辑、批复等操作。  自动化创建里程碑批复、更新里程碑批复，或外部 API 同步创建、更新里程碑批复时，也会增加对应历史记录。  ## 资源库数据历史记录  资源库数据列表中，每条数据增加“历史记录”查看按钮。可见该条数据的人都可以查看历史记录。  | 项目 | 规则 | |---|---| | 查看权限 | 可见该条资源库数据的人可查看 | | 排序 | 按操作时间正序 | | 默认查看 | 点击历史记录按钮后默认查看最新一条记录 | | 游客操作 | 增加分享人信息 |  资源库导入新增或修改、手动编辑资源库数据、分享链接中的游客编辑等，都应形成可追溯历史。  ## 邮件协作历史记录  邮件协作历史记录记录邮件协作者提交数据的历史。发出邮件时不记录历史，提交数据时记录。  运营端邮件协作列表中的历史记录，列表和操作规则同贸易端。  ## 系统来源快照  系统来源写入历史记录时，应明确操作人和操作文案。  | 来源 | 操作人 | 典型文案 | |---|---|---| | 公式自动更新 | 系统 | 自动更新 | | 自动化更新 | 自动化 | 更新订单、创建工单、更新工单、更新工单批复、创建里程碑批复、更新里程碑批复 | | 外部API同步 | 来源标识或对应操作人 | 创建订单、编辑订单、创建工单、编辑工单、编辑工单批复、编辑里程碑批复 |  快照仍需展示更新前后字段值，并用红色和绿色标出差异。  ## 关联页面  - [动态与评论](./动态与评论.md) - [订单跟踪记录](./订单跟踪记录.md) - [资源库](../20-业务对象与数据模型/资源库.md) - [邮件协作](../10-功能模块详情/邮件协作.md)  ## 来源  - `source:thoughts-v2-current/v2.2.x/贸易端/【贸易端】【订单详情】查看&操作.md` - `source:thoughts-v2-current/v2.2.x/贸易端/【贸易端】【订单详情】工单&里程碑批复操作.md` - `source:thoughts-v2-current/v2.7/贸易端/【贸易端】【资源库】SCCS应用数据范围、数据编辑历史记录.md` - `source:thoughts-v2-current/v2.2.x/贸易端/【贸易端】【订单详情】邮件协作.md` - `source:thoughts-v2-current/V2.4.x/贸易端/系统自动执行的相关操作日志.md` ", "domain": "公共能力", "module": "权限、安全与审计", "tags": "历史记录;快照;字段修改次数;资源库历史;邮件协作历史", "sources": [{"title": "【贸易端】【订单详情】查看&操作", "version": "v2.2.x", "product_side": "贸易端", "module": "订单详情", "last_write_time": "2026-09-04T10:48:34"}, {"title": "【贸易端】【订单详情】工单&里程碑批复操作", "version": "v2.2.x", "product_side": "贸易端", "module": "订单详情", "last_write_time": "2026-09-04T10:48:34"}, {"title": "【贸易端】【资源库】SCCS应用数据范围、数据编辑历史记录", "version": "v2.7", "product_side": "贸易端", "module": "资源库", "last_write_time": "2026-09-04T10:47:57"}, {"title": "【贸易端】【订单详情】邮件协作", "version": "v2.2.x", "product_side": "贸易端", "module": "订单详情", "last_write_time": "2026-09-04T10:48:28"}, {"title": "系统自动执行的相关操作日志", "version": "V2.4.x", "product_side": "贸易端", "module": "贸易端", "last_write_time": "2026-09-04T10:48:06"}]}, {"path": "docs/40-权限、安全与审计/团队权限.md", "title": "团队权限", "folder": "docs/40-权限、安全与审计", "text": " # 团队权限  ## 1. 功能定位  团队权限控制贸易端团队级配置和团队级资源入口，包括团队设置、团队成员、团队角色、协作团队、创建 FlowSpace、FlowSpace 分组、资源库创建与删除等能力。团队权限是 FlowSpace、资源库、仪表盘等后续权限的上层入口。  ## 2. 权限主体  | 主体 | 说明 | | --- | --- | | 拥有者 | 固定角色，有且只有一名成员，默认为团队创建人，可在团队基本信息中移交，拥有团队角色内所有权限 | | 团队管理员 | 固定角色，拥有团队角色内所有权限；不可删除，不可修改权限勾选，但可修改成员 | | 自定义团队角色 | 团队内自定义角色，可配置成员和权限点 | | 团队成员 | 加入或被邀请加入团队的账号，可同时拥有多个团队角色，权限叠加 | | 协作团队 | 与当前团队建立协作关系的外部团队，可加入本团队创建的 FlowSpace 或资源库协作链路 |  ## 3. 团队角色权限点  | 权限分类 | 权限名称 | 控制范围 | | --- | --- | --- | | 团队管理 | 团队设置 | 团队设置页面、邀请成员快捷入口、团队角色、团队成员、协作团队管理 | | FlowSpace 管理 | 创建 FlowSpace | 工作台创建 FlowSpace | | FlowSpace 管理 | 内部 FlowSpace 管理 | 查看和管理本团队创建的 FlowSpace 内订单、工单、仪表盘等全部数据；可配置 FlowSpace 设置、自动化、关联资源库、仪表盘权限 | | FlowSpace 管理 | 协作 FlowSpace 设置 | 查看协作 FlowSpace 内本团队权限范围内的数据；可管理协作 FlowSpace 设置 | | FlowSpace 管理 | FlowSpace 分组 | 工作台 FlowSpace 分组管理 | | FlowSpace 管理 | FlowSpace 互通配置 | 团队设置 > FlowSpace 互通菜单；创建、编辑、发布、停用互通方案和查看历史版本 | | 资源库管理 | 创建资源库 | 在当前团队下创建资源库 | | 资源库管理 | 删除资源库 | 删除本团队下资源库，并可查看所有资源库数据 | | 资源库管理 | 资源库设置 | 查看本团队资源库所有数据，管理资源库设置 | | 资源库管理 | 协作资源库管理 | 管理本团队参与协作的资源库设置和主团队授权的数据操作权限 |  ## 4. 成员管理规则  | 操作 | 规则 | | --- | --- | | 邀请成员 | 输入邮箱并设置团队角色；成员可为未注册账号；后续流程变更后，被邀请邮箱可立即成为团队成员 | | 设置成员角色 | 可为成员设置多个团队角色；与团队角色列表数据双向同步 | | 删除成员 | 成员从团队移除，同时从参与的 FlowSpace 中同步删除 | | 重新邀请 | 未注册或未加入成员可重新发送邀请邮件 | | 拥有者限制 | 拥有者不可删除，也无需设置团队角色 |  删除成员时，如果该成员是某些协作 FlowSpace 的唯一对接人，需要先设置其他对接人后再删除。被删除成员当前若仍在该团队上下文内，请求时应跳转到剩余团队选择页或首次创建团队引导页，并提示已被移出团队。  ## 5. 协作团队管理规则  | 操作 | 规则 | | --- | --- | | 邀请协作团队 | 通过团队码识别对方团队；后续流程变更后，邀请团队后协作团队即加入当前团队作为协作方 | | 协作团队列表 | 展示我邀请的团队、邀请我的团队、参与的 FlowSpace 等信息 | | 删除协作团队 | 协作团队从团队中移除，同时从参与的 FlowSpace 中同步删除 | | 邀请失效 | 协作团队被删除后，未处理的邮件链接失效 |  ## 6. 权限叠加与失效  - 同一成员可以拥有多个团队角色，权限按并集叠加。 - 删除角色后，使用该角色的成员失去对应角色权限。 - 从团队删除成员，会同步影响 FlowSpace 成员、任务中心、消息跳转和相关可见数据。 - 从团队删除协作团队，会同步影响 FlowSpace 协作团队、协作任务和相关可见数据。  ## 7. 审计要求  团队设置操作日志需要覆盖：  - 团队角色新增、编辑、删除。 - 成员管理新增、删除、设置权限。 - 协作团队管理新增、删除。  在角色中修改成员，仅记录在角色操作中；在成员中修改权限，仅记录在成员操作中。  ## 8. 运营端功能权限配置  运营端团队列表新增 `功能权限` 入口，用于配置团队级或 FlowSpace 维度功能入口权限。V1.0 团队权限配置区仅作为占位，不提供具体配置项；FlowSpace 维度权限区用于配置 `自动化配置入口` 的授权成员。  自动化配置入口权限规则：  | 项目 | 规则 | | --- | --- | | 配置入口 | 运营端 > 团队管理 > 团队列表 > 功能权限 | | 配置粒度 | 当前团队下的 FlowSpace | | 授权对象 | 仅当前 FlowSpace 内部成员，不展示协作方成员 | | 生效规则 | 成员列表为空即无权限；成员列表非空时，对应成员可见贸易端 FlowSpace 内自动化配置入口 | | 保存规则 | 配置成员弹窗保存后立即生效，并记录配置日志 | | 日志 | 记录操作人、类型、权限、变更前后成员，成员需保留邮箱便于追溯 |  贸易端不再提供 `自动化配置` 权限点的配置入口。FlowSpace 设置的业务角色权限不展示自动化配置勾选项，业务管理员默认角色也不可直接获得该权限；服务端也必须停止接受贸易端对该权限点的写入，旧接口提交该权限点时应忽略或返回不支持修改。  ## 9. 待确认问题  - 团队角色完整权限矩阵仍依赖外部钉钉表格，建议导出为本地来源文件。 - 删除团队成员后的任务批量交接仍为后期规划，需要补充正式规则。 - 协作团队加入流程已发生优化，历史“接受/拒绝”流程是否仍在部分场景保留，需要与线上核对。 ", "domain": "贸易端", "module": "权限、安全与审计", "tags": "权限;团队;团队角色;协作团队", "sources": [{"title": "【贸易端】【团队设置】团队信息、角色、成员、协作团队管理", "version": "v2.0.x", "product_side": "贸易端", "module": "团队设置", "last_write_time": "2026-09-04T10:48:47"}, {"title": "【贸易端】【团队设置】邀请成 员_协作团队流程变更", "version": "v2.1.x", "product_side": "贸易端", "module": "团队设置", "last_write_time": "2026-09-04T10:48:42"}, {"title": "【贸易端】【操作日志】所有设置类功能", "version": "V2.4.x", "product_side": "贸易端", "module": "操作日志", "last_write_time": "2026-09-04T10:48:09"}, {"title": "【运营端】【团队列表-功能权限】自动化权限移至运营端管理", "version": "v2.8", "product_side": "运营端", "module": "团队列表-功能权限", "last_write_time": "2026-09-04T10:47:47"}, {"title": "【贸易端】FlowSpace 数据互通", "version": "v2.9", "product_side": "贸易端", "module": "贸易端", "last_write_time": "2026-09-04T10:47:46"}]}, {"path": "docs/40-权限、安全与审计/操作日志.md", "title": "设置操作日志", "folder": "docs/40-权限、安全与审计", "text": "# 设置操作日志  ## 定位  设置操作日志用于追溯团队、FlowSpace、协作 FlowSpace、资源库等配置类功能的新增、编辑、删除和权限变更。它记录的是“配置被谁改了、改了什么、改前改后是什么”，区别于订单跟踪记录和工单动态。  ## 适用范围  | 日志范围 | 记录对象 | |---|---| | 团队设置 | 基本信息、团队角色、成员管理、协作团队管理、FlowSpace 关联设置 | | FlowSpace设置 | 基本信息、业务角色、协作方角色、数据围栏、成员管理、协作团队管理、计划时间、标签设置、订单标识设置、订单取消原因 | | 协作FlowSpace设置 | 自建角色、主团队角色、成员管理 | | 资源库设置 | 基本信息、权限管理 |  运营端模板修改不记录在贸易端 FlowSpace 设置、协作 FlowSpace 设置或资源库设置操作日志中。  ## 列表查询  设置操作日志列表支持按操作对象、功能模块、操作类型、操作人和操作时间查询。  | 查询项 | 说明 | |---|---| | 模糊搜索 | 搜索操作对象 | | 功能模块 | 取值参照各设置日志的记录内容 | | 操作类型 | 新增、编辑、删除、设置权限 | | 操作人 | 可选择日志列表中出现过的成员 | | 操作时间 | 日期范围 |  列表数据中可点击快照查看对应操作的详细变更内容。  ## 团队设置日志  | 模块 | 记录操作 | |---|---| | 基本信息 | 新增、编辑；新增指创建团队 | | 团队角色 | 新增、编辑、删除；在角色中修改成员，仅记录在角色操作中 | | 成员管理 | 新增、删除、设置权限 | | 协作团队管理 | 新增、删除 | | FlowSpace关联设置 | 新增、删除；仅记录主动新增或删除的 FlowSpace |  FlowSpace 被动关联或被动取消关联时，不在团队设置日志中记录。  ## FlowSpace设置日志  | 模块 | 记录操作 | |---|---| | 基本信息 | 新增、删除；新增指创建 FlowSpace | | 业务角色 | 新增、编辑、删除 | | 协作方角色 | 新增、编辑、删除 | | 数据围栏 | 新增、编辑、删除 | | 成员管理 | 新增、删除、设置权限 | | 协作团队管理 | 新增、删除、设置权限 | | 计划时间 | 编辑 | | 标签设置 | 新增、编辑、删除 | | 订单标识设置 | 编辑 | | 订单取消原因 | 新增、编辑、删除 |  从团队设置中删除成员或协作团队，导致其从 FlowSpace 中被删除时，FlowSpace 设置日志也记录一条删除记录。  ## 协作FlowSpace设置日志  | 模块 | 记录操作 | |---|---| | 自建角色 | 新增、编辑、删除 | | 主团队角色 | 编辑，仅能编辑主团队角色中的成员 | | 成员管理 | 新增、删除、设置权限 |  主团队修改协作团队协作的里程碑，不记录在协作方 FlowSpace 的操作日志内。主团队修改或删除协作方角色，也不记录在协作方 FlowSpace 的操作日志内。  ## 资源库设置日志  | 模块 | 记录操作 | |---|---| | 基本信息 | 新增、编辑；新增指创建资源库 | | 权限管理 | 新增、编辑、删除 |  ## 快照查看  快照用于查看某次配置操作当时的数据。  | 操作类型 | 快照规则 | |---|---| | 新增 | 仅展示新增当时的数据 | | 删除 | 仅展示删除当时的数据 | | 编辑 | 展示编辑前和编辑后的数据 | | 协作团队增删 | 仅记录“我邀请的”团队增删，无快照 |  多层级内容需要通过气泡方式展示，例如业务角色或协作方角色的自定义订单范围规则、计划时间默认负责人规则、标签设置多语言、自建角色自定义订单范围等。  ## 关联页面  - [团队权限](../40-权限、安全与审计/团队权限.md) - [FlowSpace业务角色权限](../40-权限、安全与审计/FlowSpace业务角色权限.md) - [协作FlowSpace权限](../40-权限、安全与审计/协作FlowSpace权限.md) - [资源库权限](../40-权限、安全与审计/资源库权限.md)  ## 来源  - `source:thoughts-v2-current/V2.4.x/贸易端/【贸易端】【操作日志】所有设置类功能.md` ", "domain": "贸易端", "module": "权限、安全与审计", "tags": "操作日志;设置;快照;权限变更", "sources": [{"title": "【贸易端】【操作日志】所有设置类功能", "version": "V2.4.x", "product_side": "贸易端", "module": "操作日志", "last_write_time": "2026-09-04T10:48:09"}]}, {"path": "docs/40-权限、安全与审计/数据围栏.md", "title": "数据围栏", "folder": "docs/40-权限、安全与审计", "text": " # 数据围栏  ## 1. 功能定位  数据围栏用于限制 FlowSpace 内成员或协作团队不可查看部分订单主表单字段、订单标签或里程碑标签。它控制“看得见什么”，不直接等同于“能不能操作”。  ## 2. 适用对象  | 对象 | 规则 | | --- | --- | | FlowSpace 成员 | 可作为限制成员加入数据围栏 | | 协作团队 | 可作为限制协作团队加入数据围栏，限制作用于该团队下所有成员 | | 未注册成员 | 如果已在成员列表或相关权限列表中出现，需要展示未注册标识 |  ## 3. 可限制内容  | 内容 | 说明 | | --- | --- | | 订单标签 | FlowSpace 标签设置中配置的订单标签字段 | | 里程碑标签 | FlowSpace 标签设置中配置的里程碑标签字段 | | 主表单字段 | 按实际查看订单的布局展示主表单所有字段，可按模块分组全选 |  勾选“不可查看”的字段后，相关成员和协作团队成员在查看主表单数据时需要隐藏对应字段。  ## 4. 管理规则  | 操作 | 规则 | | --- | --- | | 创建/编辑数据围栏 | 名称必填，限制 100 字符；可选择限制成员、限制协作团队，并设置不可查看字段 | | 查询数据围栏 | 支持按名称、限制成员、限制协作团队筛选 | | 删除数据围栏 | 对应成员和协作团队取消字段查看限制 | | 数据双向同步 | 成员或协作团队中的数据围栏设置，与数据围栏列表同步 |  ## 5. 与业务角色的关系  - 业务角色决定是否有查看订单、工单、里程碑等对象的权限。 - 数据围栏在对象可见基础上进一步隐藏字段或标签。 - 如果成员没有对象查看权限，数据围栏不会让其获得查看权限。 - 如果成员有对象查看权限，但命中数据围栏，则对应字段仍不可见。  ## 6. 与标签设置的关系  删除标签后：  - 订单列表和工单列表不再展示该标签字段，包括字段和查询条件。 - 订单详情不再展示该标签字段。 - 数据围栏中不再展示该标签字段。  ## 7. 审计要求  FlowSpace 设置操作日志需要记录数据围栏新增、编辑、删除。运营端模板修改不记录在 FlowSpace 设置操作日志中。  ## 8. 待确认问题  - 数据围栏是否影响历史记录、动态、跟踪记录中的字段展示。 - 数据围栏命中时，导出、报告、仪表盘是否同样隐藏字段。 - 多个数据围栏同时作用于同一成员时，是否按不可见字段并集处理，需与线上规则核对。 ", "domain": "贸易端", "module": "权限、安全与审计", "tags": "权限;数据围栏;字段可见性;标签", "sources": [{"title": "【贸易端】【SCCS设置】", "version": "v2.1.x", "product_side": "贸易端", "module": "SCCS设置", "last_write_time": "2026-09-04T10:48:45"}, {"title": "【贸易端】【团队设置】邀请成 员_协作团队流程变更", "version": "v2.1.x", "product_side": "贸易端", "module": "团队设置", "last_write_time": "2026-09-04T10:48:42"}, {"title": "【贸易端】【操作日志】所有设置类功能", "version": "V2.4.x", "product_side": "贸易端", "module": "操作日志", "last_write_time": "2026-09-04T10:48:09"}]}, {"path": "docs/40-权限、安全与审计/权限体系总表.md", "title": "权限体系总表", "folder": "docs/40-权限、安全与审计", "text": " # 权限体系总表  ## 1. 功能定位  权限体系用于控制用户在 Linkincrease 中“能否看到、能否进入、能否操作、能否管理、能否导出或分享”。权限不能只按页面入口判断，还必须结合业务对象状态、成员关系、数据围栏和服务端校验。  ## 2. 权限分层  flowchart TD A[\"账号身份\"] --> B[\"团队成员身份\"] B --> C[\"团队角色\"] B --> D[\"FlowSpace成员身份\"] D --> E[\"FlowSpace业务角色\"] D --> F[\"数据围栏\"] B --> G[\"协作团队关系\"] G --> H[\"协作FlowSpace角色\"] B --> I[\"资源库角色\"] E --> J[\"业务操作权限\"] F --> K[\"数据可见范围\"] H --> J I --> L[\"资源库操作权限\"]  ## 3. 权限域总表  | 权限域 | 控制对象 | 典型权限点 | 主要来源 | | --- | --- | --- | --- | | 账号权限 | 登录、个人信息、语言、退出 | 登录、修改密码、查看个人信息 | 账号、个人中心需求 | | 团队权限 | 团队信息、成员、角色、协作团队、资源库入口 | 邀请成员、删除成员、设置角色、邀请协作团队、创建资源库 | 团队设置、资源库需求 | | FlowSpace 业务权限 | 订单、里程碑、工单、批复、自动化、仪表盘 | 查看、创建、编辑、删除、状态修改、指派、采集、批复、互用、终止采集、还原采集、导入导出 | FlowSpace 设置、订单详情需求 | | 协作 FlowSpace 权限 | 协作团队成员在 FlowSpace 内的业务操作 | 指派、采集、批复、查看、修改处理人 | 协作 FlowSpace 设置、工单批复需求 | | 数据围栏 | 字段、标签、订单、里程碑、工单数据范围 | 可见范围控制 | FlowSpace 设置需求 | | 资源库权限 | 资源库设置、表数据、分享、导入导出 | 查看、创建、编辑、删除、导入、导出、批量操作、分享 | 资源库需求 | | 仪表盘权限 | FlowSpace 仪表盘 | 查看、管理、汇总查看 | 仪表盘权限需求 | | 报告权限 | 报告 | 查看、管理 | 报告权限需求 | | 运营端权限 | 平台用户、团队、FlowSpace、资源库、模板、软件管理 | 平台级查看、配置、监管 | 运营端需求 |  ## 4. 通用判断模型  入口是否展示 = 用户身份 + 所属团队 / FlowSpace / 协作团队关系 + 角色权限 + 对象状态 + 数据围栏或数据范围  提交是否成功 = 服务端权限校验 + 对象是否存在 + 对象状态是否允许 + 数据版本是否最新 + 表单字段是否通过校验  ## 5. 角色与权限关系  | 角色类型 | 所属层级 | 说明 | | --- | --- | --- | | 团队角色 | 团队 | 控制团队设置、团队成员、协作团队、资源库等团队级能力 | | FlowSpace 业务角色 | FlowSpace | 控制主团队成员在当前 FlowSpace 内的订单、里程碑、工单等能力 | | 协作方角色 | 协作 FlowSpace | 控制协作团队成员在当前 FlowSpace 内的业务能力 | | 资源库角色 | 资源库 | 控制资源库设置和表数据操作 | | 运营端角色 | 平台后台 | 控制运营端平台管理能力，当前资料未完整沉淀角色模型 |  ## 6. 数据围栏  数据围栏负责控制“看得见什么”，不等同于“能不能操作”。  需要沉淀的范围：  - 订单字段可见性。 - 里程碑字段和标签可见性。 - 工单表单字段可见性。 - 订单详情左侧树展示范围。 - 标签展示范围。 - 历史记录、动态、跟踪记录是否受围栏影响。  ## 7. 状态限制  权限存在不代表一定可操作，状态会进一步限制入口。  典型限制：  - 订单已完成或已取消时，订单编辑、工单采集、批复、指派等动作受限。 - 里程碑已完成或已取消时，创建工单、采集、批复、互用等动作受限。 - 工单已终止采集或已批复时，采集动作受限。 - 工单已终止采集但订单和里程碑仍进行中、工单未批复/未删除时，可由具备“还原采集”权限的成员解除终止锁；还原后仍需按当前权限、数据围栏和表单显隐重新计算可编辑范围。 - 资源库或资源库数据删除后，新业务不可继续引用。  ## 8. 通知、日志与审计  权限相关变更必须可追溯：  - 团队角色变更。 - 团队成员邀请、删除、角色设置。 - 协作团队邀请、删除。 - FlowSpace 业务角色变更。 - FlowSpace 成员和协作团队权限变更。 - 资源库角色和成员变更。 - 数据围栏变更。 - 仪表盘和报告权限变更。  ## 9. 待拆细页  - 团队权限。 - FlowSpace 业务角色权限。 - 协作 FlowSpace 权限。 - 数据围栏。 - 资源库权限。 - 仪表盘权限。 - 报告权限。  ## 10. 来源需求  - `source:thoughts-v2-current/v2.0.x/贸易端/【贸易端】【团队设置】团队信息、角色、成员、协作团队管理.md` - `source:thoughts-v2-current/v2.1.x/贸易端/【贸易端】【团队设置】邀请成 员_协作团队流程变更.md` - `source:thoughts-v2-current/v2.1.x/贸易端/【贸易端】【SCCS设置】.md` - `source:thoughts-v2-current/v2.1.x/贸易端/【贸易端】【协作SCCS设置】.md` - `source:thoughts-v2-current/v2.2.x/贸易端/【贸易端】【订单详情】工单&里程碑批复操作.md` - `source:thoughts-v2-current/V2.4.x/贸易端/【贸易端】【资源库】第一阶段.md` - `source:thoughts-v2-current/V2.5.x/贸易端/【贸易端】【仪表盘】权限管理.md` - `source:thoughts-v2-current/V2.5.x/贸易端/【贸易端】报告权限.md` - `source:thoughts-v2-current/v2.8/贸易端/【贸易端】工单终止还原为采集状态.md`  ## 11. 待确认问题  - 各端是否存在统一的权限矩阵表，可导出为本地来源。 - 数据围栏是否影响历史记录、动态、跟踪记录中的字段展示。 - 协作团队负责人、对接人、有指派权限成员的边界是否完全一致。", "domain": "公共能力", "module": "权限", "tags": "权限;角色;数据围栏;协作团队", "sources": [{"title": "【贸易端】【团队设置】团队信息、角色、成员、协作团队管理", "version": "v2.0.x", "product_side": "贸易端", "module": "团队设置", "last_write_time": "2026-09-04T10:48:47"}, {"title": "【贸易端】【SCCS设置】", "version": "v2.1.x", "product_side": "贸易端", "module": "SCCS设置", "last_write_time": "2026-09-04T10:48:45"}, {"title": "【贸易端】【协作SCCS设置】", "version": "v2.1.x", "product_side": "贸易端", "module": "协作SCCS设置", "last_write_time": "2026-09-04T10:48:42"}, {"title": "【贸易端】【资源库】第一阶段", "version": "V2.4.x", "product_side": "贸易端", "module": "资源库", "last_write_time": "2026-09-04T10:48:14"}, {"title": "【贸易端】【仪表盘】权限管理", "version": "V2.5.x", "product_side": "贸易端", "module": "仪表盘", "last_write_time": "2026-09-04T10:48:00"}, {"title": "【贸易端】报告权限", "version": "V2.5.x", "product_side": "贸易端", "module": "贸易端", "last_write_time": "2026-09-04T10:48:04"}, {"title": "【贸易端】工单终止还原为采集状态", "version": "v2.8", "product_side": "贸易端", "module": "贸易端", "last_write_time": "2026-09-04T10:47:53"}]}, {"path": "docs/40-权限、安全与审计/系统与集成执行日志.md", "title": "系统与集成执行日志", "folder": "docs/40-权限、安全与审计", "text": "# 系统与集成执行日志  ## 定位  系统与集成执行日志用于追溯非普通用户手动操作产生的数据变化，包括公式自动更新、自动化执行、资源库数据同步、SCMPro API 数据变更、外部 API 集成同步和运营端自动化记录。  这类记录需要同时进入业务审计链路，避免系统写入的数据无法解释来源。  ## 系统执行来源  | 来源 | 说明 | |---|---| | 公式自动更新 | 公式字段根据依赖字段自动重新计算 | | TODAY 公式自动更新 | 包含 TODAY 的公式随日期变化自动重新计算 | | 自动化更新 | FlowSpace 自动化程序根据触发条件执行动作 | | FlowSpace 互通 | 目标侧引用来源 FlowSpace 数据、后续自动更新、手动刷新、跳过或失败 | | 关联资源库同步 | 资源库数据或引用字段配置变化后，同步更新订单数据 | | SCMPro API 数据变更 | 第三方系统数据变化后自动更新 Linkincrease | | 外部 API 集成 | 运营端配置外部 API 后，外部数据创建或更新订单、工单等 |  ## 公式自动更新  公式自动更新仅增加订单跟踪记录、动态和历史记录，不更新数据创建人或更新人。  | 模块 | 记录规则 | |---|---| | 订单跟踪记录 | 主表单公式字段更新时增加记录 | | 动态 | 里程碑批复、工单批复、工单采集中的公式字段更新时增加动态，归类为修改记录 | | 历史记录 | 里程碑批复、工单批复、工单采集中的公式字段更新时增加历史记录 |  操作人显示为系统，操作时间为自动更新时间，历史快照展示公式字段更新前后的值。  公式自动更新需要遵守业务对象状态限制。订单已完成、已取消或已删除时，不再自动更新订单主表单公式；里程碑已完成或已取消时，不再自动更新里程碑批复公式；工单已批复、已终止采集或已删除时，不再自动更新工单采集公式。  ## 自动化更新  自动化更新同普通用户操作逻辑，增加订单跟踪记录、动态、历史记录，并更新数据更新时间和更新人。  | 模块 | 记录规则 | |---|---| | 订单跟踪记录 | 主表单内容更新、里程碑首次创建工单、订单状态变更、里程碑状态变更时记录 | | 动态 | 创建里程碑批复、更新里程碑批复、创建工单、更新工单、更新工单批复时记录 | | 历史记录 | 主表单更新、创建工单、更新工单、更新工单批复、创建或更新里程碑批复时记录 | | 数据更新时间/更新人 | 更新时间为自动化执行时间，更新人为自动化 |  操作人显示为自动化，头像为系统。  ## 自动化执行日志  贸易端自动化配置中可查看自动化执行日志。运营端也提供 FlowSpace 自动化记录列表，用于平台级追踪。  ### 贸易端执行日志  每条自动化执行日志可以查看执行记录。详情中每个节点都可以查看配置流程和具体执行数据。  执行记录按自动化配置的数据源展示：  | 数据源 | 执行记录展示 | |---|---| | 订单基本信息 | 被执行 `$订单ID` | | 里程碑批复 | 被执行 `$订单ID_$里程碑名称 里程碑批复` | | 工单 | 被执行 `$订单ID_$里程碑名称_$工单名称` |  ### 运营端自动化记录  运营端自动化记录列表支持按 FlowSpace、团队、自动化、触发类型、执行状态、触发时间、执行时间筛选。  | 字段 | 说明 | |---|---| | FlowSpace名称、CODE | 对应 FlowSpace 基础信息 | | 所属团队、团队码 | 对应团队基础信息 | | 订单ID、订单码 | 自动化涉及的订单信息 | | 自动化名称、自动化ID | 自动化基础信息 | | 触发类型 | 新增数据、数据变更、到达时间、定时任务 | | 触发数据 | 订单信息、工单信息、里程碑批复 | | 执行动作 | 自动化执行的动作 | | 执行状态 | 成功、失败、已失效、待执行 | | 执行结果摘要 | 成功或失败摘要 | | 执行时间 | 自动化实际执行时间 |  列表按创建时间倒序。详情展示规则同贸易端。  ## 关联资源库同步  因关联的是资源库数据 ID，订单侧不增加记录。资源库自身数据历史记录仍需保留资源库数据被编辑、导入、分享编辑等操作来源。  ## FlowSpace 互通日志  FlowSpace 数据互通需要同时记录方案配置日志、互通执行日志和业务模块日志。方案配置日志只记录互通方案的创建、编辑、保存草稿、发布、启用、停用、删除草稿和配置快照；具体订单、工单或批复被引用时，不写入方案配置日志，而是写入互通执行日志。  互通执行日志需记录执行时间、执行类型、互通方案、使用版本、来源数据、目标数据、处理方式、执行状态和详情。引用或后续更新导致业务数据变化时，还需写入对应订单跟踪记录、工单动态、批复动态和历史记录，并标记操作来源为 `FlowSpace 互通`。  互通日志详见 [FlowSpace 数据互通](../10-功能模块详情/FlowSpace数据互通.md)。  ## 外部API集成日志  外部 API 集成日志展示一定时间范围内的同步日志。  | 字段 | 说明 | |---|---| | 时间 | 触发同步的时间 | | 事件类型 | 创建、更新 | | 同步方向 | 正向、反向 | | 数据标识 | 外部或 Linkincrease 数据标识 | | 状态 | 成功、失败 | | 详情 | 记录成功或失败说明 |  外部系统同步到贸易端业务数据后，还需要写入订单跟踪记录、工单动态和历史记录。  典型记录：  | 模块 | 文案口径 | |---|---| | 订单跟踪记录-创建订单 | `$操作人 在 $来源标识 操作了数据，同步创建了订单` | | 订单跟踪记录-更新订单 | `$操作人 在 $来源标识 操作了数据，同步更新了订单` | | 订单跟踪记录-里程碑开始 | `$操作人 在 $来源标识 操作了数据，同步在 $里程碑名称 创建了工单，里程碑开始` | | 工单动态-创建工单 | `$操作人 在 $来源标识 操作了数据，同步创建了工单` | | 工单动态-更新工单采集 | `$操作人 在 $来源标识 操作了数据，同步更新了工单` | | 工单动态-更新工单批复 | `$操作人 在 $来源标识 操作了数据，同步更新了工单批复，工单无法继续编辑` | | 动态-更新里程碑批复 | `$操作人 在 $来源标识 操作了数据，同步更新了里程碑批复` |  ## 软件更新记录  运营端软件管理包含软件更新管理和软件更新记录。当前用于采集端 APP、Android 平台。  | 能力 | 规则 | |---|---| | 软件更新管理 | 相同产品类型、软件类型只展示最近更新的一条记录 | | 软件更新记录 | 记录每一次更新 | | 查看详情 | 可查看更新详情并下载安装包 | | 更新日志 | 文字，可换行，暂不需要富文本 |  记录字段包括产品、平台、发布时间、支持最小版本、当前版本、更新人、更新时间。  ## 关联页面  - [自动化配置](../10-功能模块详情/自动化配置.md) - [FlowSpace 数据互通](../10-功能模块详情/FlowSpace数据互通.md) - [自动化与系统执行日志](../40-权限、安全与审计/自动化与系统执行日志.md) - [第三方数据对接](../80-架构与技术方案/集成方案.md) - [历史记录与快照](./历史记录与快照.md) - [订单跟踪记录](./订单跟踪记录.md)  ## 来源  - `source:thoughts-v2-current/V2.4.x/贸易端/系统自动执行的相关操作日志.md` - `source:thoughts-v2-current/v2.9/贸易端/【贸易端】FlowSpace 数据互通.md` - `source:thoughts-v2-current/平台自动计算、更新规则说明.md` - `source:thoughts-v2-current/V2.4.x/贸易端/【贸易端】【自动化】一期.md` - `source:thoughts-v2-current/V2.4.x/运营端/【运营端】【SCCS管理】SCCS自动化记录.md` - `source:thoughts-v2-current/V2.5.x/运营端/【运营端】【SCCS管理】SCCS列表增加外部api集成配置.md` - `source:thoughts-v2-current/V2.4.x/运营端/【运营端】【设置-软件管理】软件相关信息与记录管理.md` ", "domain": "公共能力", "module": "权限、安全与审计", "tags": "系统执行;自动化记录;公式自动更新;外部API日志;软件更新记录", "sources": [{"title": "系统自动执行的相关操作日志", "version": "V2.4.x", "product_side": "贸易端", "module": "贸易端", "last_write_time": "2026-09-04T10:48:06"}, {"title": "平台自动计算、更新规则说明", "version": "common", "product_side": "未识别", "module": "", "last_write_time": "2026-09-04T10:47:43"}, {"title": "【贸易端】【自动化】一期", "version": "V2.4.x", "product_side": "贸易端", "module": "自动化", "last_write_time": "2026-09-04T10:48:09"}, {"title": "【运营端】【SCCS管理】SCCS自动化记录", "version": "V2.4.x", "product_side": "运营端", "module": "SCCS管理", "last_write_time": "2026-09-04T10:48:04"}, {"title": "【运营端】【SCCS管理】SCCS列表增加外部api集成配置", "version": "V2.5.x", "product_side": "运营端", "module": "SCCS管理", "last_write_time": "2026-09-04T10:48:05"}, {"title": "【运营端】【设置-软件管理】软件相关信息与记录管理", "version": "V2.4.x", "product_side": "运营端", "module": "设置-软件管理", "last_write_time": "2026-09-04T10:48:05"}, {"title": "【贸易端】FlowSpace 数据互通", "version": "v2.9", "product_side": "贸易端", "module": "贸易端", "last_write_time": "2026-09-04T10:47:46"}]}, {"path": "docs/40-权限、安全与审计/自动化与系统执行日志.md", "title": "自动化与系统执行日志", "folder": "docs/40-权限、安全与审计", "text": " # 自动化与系统执行日志  ## 1. 功能定位  自动化与系统执行日志用于追踪自动化、公式自动更新、资源库同步、SCMPro API 数据变更等系统行为，确保自动执行过程可审计、可解释、可排查。  ## 2. 贸易端自动化执行日志  自动化列表中可点击日志查看对应自动化程序的执行记录。  | 字段 | 说明 | | --- | --- | | 执行数据 | 非定时任务显示具体订单标识；定时任务显示定时任务 | | 执行时间 | 自动化执行时间 | | 执行状态 | 成功、失败、部分成功 | | 详情 | 查看触发条件、执行操作、具体数据和结果 |  当前后续规划中提到执行状态可能先只保留成功和失败，部分成功是否启用需要确认。  ## 3. 日志详情  | 节点 | 记录内容 | | --- | --- | | 新增数据触发 | 流程设置、执行记录、操作人、新增数据内容 | | 数据变更触发 | 流程设置、执行记录、操作人、变更前后值 | | 到达时间触发 | 流程设置、执行记录、触发字段值 | | 发送通知 | 通知对象、渠道、标题、内容、链接页面、附件 | | 新增数据 | 被新增记录、处理人、新增数据内容 | | 更新数据 | 被更新记录、更新字段及变更前后值 |  操作人可能是团队成员、协作方成员或自动程序。自动程序头像为机器人，名称为具体触发程序。  ## 4. 运营端自动化记录  运营端 FlowSpace 管理中存在自动化记录模块，用于平台侧追踪自动化任务全生命周期。  筛选项：  - FlowSpace 名称、团队 ID/名称、自动化 ID/名称。 - 触发类型：新增数据、数据变更、到达时间、定时任务。 - 执行状态：成功、失败、已失效、待执行。 - 触发时间、执行时间。  列表字段包括 FlowSpace、所属团队、订单、自动化名称、触发类型、触发数据、触发时间、执行动作、执行状态、执行结果摘要和执行时间。  ## 5. 系统自动执行日志  需要纳入系统自动执行记录的能力：  - 公式自动更新。 - 自动化更新。 - TODAY 公式和开启自动计算的公式更新。 - 关联资源库数据同步更新。 - SCMPro API 数据变更自动更新。  自动化更新时：  - 操作人显示为自动化，头像为系统。 - 操作时间为自动化执行时间。 - 主表单更新、创建工单、更新工单采集/批复、更新里程碑批复时，需要增加历史记录。 - 更新时间和更新人也应显示自动化或系统身份。  公式自动计算时，也需要按照数据源写入对应业务记录：订单主表单写入订单主表单历史记录或订单跟踪记录；里程碑批复写入里程碑批复动态或历史记录；工单采集和工单批复写入工单动态或对应历史记录。  ## 6. 与业务动态的关系  自动化执行后，需要在业务对象内留下对应动态：  - 创建工单：工单动态增加创建记录，订单跟踪记录增加创建工单。 - 更新工单：按采集和批复分别增加动态。 - 更新里程碑批复：里程碑批复动态增加编辑记录。 - 更新订单基本信息：订单跟踪记录增加编辑订单。  ## 7. 待确认问题  - 失败操作的详情展示原文中仍有待确认项，需要产品补齐。 - 运营端自动化记录与贸易端执行日志是否共用同一数据模型。 - 系统自动执行失败是否有重试、告警、人工处理入口。 ", "domain": "公共能力", "module": "权限、安全与审计", "tags": "自动化;执行日志;系统日志;审计", "sources": [{"title": "【贸易端】【自动化】一期", "version": "V2.4.x", "product_side": "贸易端", "module": "自动化", "last_write_time": "2026-09-04T10:48:09"}, {"title": "【运营端】【SCCS管理】SCCS自动化记录", "version": "V2.4.x", "product_side": "运营端", "module": "SCCS管理", "last_write_time": "2026-09-04T10:48:04"}, {"title": "系统自动执行的相关操作日志", "version": "V2.4.x", "product_side": "贸易端", "module": "贸易端", "last_write_time": "2026-09-04T10:48:06"}, {"title": "平台自动计算、更新规则说明", "version": "common", "product_side": "未识别", "module": "", "last_write_time": "2026-09-04T10:47:43"}]}, {"path": "docs/40-权限、安全与审计/订单跟踪记录.md", "title": "订单跟踪记录", "folder": "docs/40-权限、安全与审计", "text": "# 订单跟踪记录  ## 定位  订单跟踪记录是订单级业务过程日志，用于追踪订单、里程碑、工单、翻单、订单关联、FlowSpace 关联等关键业务节点。它回答“这个订单经历了哪些关键事件”。  ## 查看权限  只有拥有当前订单“查看跟踪记录”权限的成员，才能在订单详情中看到跟踪记录入口并查看内容。  ## 记录字段  每条跟踪记录至少包含：  | 字段 | 说明 | |---|---| | 操作人 | 头像、姓名；系统执行时可为系统、自动化或第三方来源 | | 操作时间 | 事件发生时间 | | 事件 | 按操作类型生成的记录文案 |  排序按操作时间正序。  ## 订单操作  | 操作 | 触发页面 | 记录文案 | |---|---|---| | 创建订单 | 订单列表创建订单、导入订单 | `$操作人 创建订单` | | 编辑订单 | 订单列表、订单详情、批量编辑、导入更新 | `$操作人 编辑订单` | | 删除订单 | 订单详情、订单列表 | `$操作人 删除订单` | | 完成订单 | 订单详情、订单列表批量修改状态 | `$操作人 完成订单` | | 取消订单 | 订单详情、订单列表批量修改状态 | `$操作人 取消订单` | | 重启订单 | 订单详情、订单列表批量修改状态 | `$操作人 重启订单` |  订单完成、取消、重启后，均增加跟踪记录。  ## 里程碑与工单操作  | 操作 | 触发页面 | 记录文案 | |---|---|---| | 里程碑开始 | 首次创建工单、批量创建工单、导入工单 | `$操作人 创建工单 $工单名称，$里程碑名称 开始` | | 创建工单 | 订单详情、批量创建工单、导入工单 | `$操作人 在 $里程碑名称 创建工单 $工单名称` | | 删除工单 | 订单详情 | `$操作人 删除 $里程碑名称 的工单 $工单名称` | | 完成里程碑 | 订单详情、批量修改里程碑状态 | `$操作人 完成里程碑 $里程碑名称` | | 取消里程碑 | 订单详情、批量修改里程碑状态 | `$操作人 取消里程碑 $里程碑名称` | | 重启里程碑 | 订单详情、批量修改里程碑状态 | `$操作人 重启里程碑 $里程碑名称` | | 移交订单负责人 | FlowSpace 管理 > 数据移交 | `$执行人 已将订单负责人从 $原负责人 移交给 $新负责人。移交原因：XXXX。备注：xxxx` | | 移交里程碑负责人 | FlowSpace 管理 > 数据移交 | `$执行人 已将 $里程碑名称 负责人从 $原负责人 移交给 $新负责人。移交原因：XXXX。备注：xxxx` |  首次创建工单时，如果里程碑从未开始进入进行中，需要同时记录里程碑开始。  ## 订单复用关系  ### 里程碑互用  里程碑互用会在原单和被互用单分别增加跟踪记录。  | 场景 | 记录口径 | |---|---| | 原单 | `$操作人 将 $里程碑名称 互用于 $被互用的订单标识...` | | 被互用单 | `$操作人 将 $原单订单标识 中的 $里程碑名称 互用于此订单` | | 原单取消互用 | `$操作人 将 $里程碑名称 取消互用于 $被互用的订单标识` | | 被互用单取消互用并保留数据 | `$操作人 取消 $原单订单标识 中的 $里程碑名称 互用于此订单，并保留了数据` | | 被互用单取消互用并清空数据 | `$操作人 取消 $原单订单标识 中的 $里程碑名称 互用于此订单，并清空了数据` |  ### 翻单  | 场景 | 原单记录 | 翻单记录 | |---|---|---| | 创建新订单为翻单 | `$操作人 创建 $翻单订单标识 为此订单的翻单` | `$操作人 创建此订单为 $原单订单标识 的翻单` | | 设置已有订单为翻单 | `$操作人 设置 $翻单订单标识 为此订单的翻单` | `$操作人 设置此订单为 $原单订单标识 的翻单` | | 取消翻单 | `$操作人 取消 $翻单订单标识 作为此单的翻单` | `$操作人 取消此订单作为 $原单订单标识 的翻单` |  ### 订单关联与FlowSpace关联  | 操作 | 记录文案 | |---|---| | 订单关联 | `$操作人 建立与 $订单标识 关联` | | 取消订单关联 | `$操作人 取消与 $订单标识 关联` | | FlowSpace关联 | `$操作人 建立与 $FlowSpace名称 中的 $订单标识 关联` | | 取消FlowSpace关联 | `$操作人 取消与 $FlowSpace名称 中的 $订单标识 关联` |  ## 系统来源记录  系统、自动化、第三方 API 也可能写入订单跟踪记录。系统来源需要在操作人位置清晰标识，常见来源包括：  | 来源 | 记录场景 | |---|---| | 公式自动更新 | 主表单公式字段更新时记录 | | 自动化 | 主表单更新、首次创建工单、创建工单、订单状态变更、里程碑状态变更 | | 外部API | 外部系统创建或更新订单、创建或删除工单 |  ## 关联页面  - [订单生命周期](../30-业务流程与产品流程图/订单生命周期.md) - [订单复用关系](../30-业务流程与产品流程图/订单复用关系.md) - [系统与集成执行日志](./系统与集成执行日志.md)  ## 来源  - `source:thoughts-v2-current/v2.2.x/贸易端/【贸易端】【订单详情】查看&操作.md` - `source:thoughts-v2-current/v2.3.x/贸易端/【贸易端】【订单管理】订单翻单功能.md` - `source:thoughts-v2-current/v2.3.x/贸易端/【贸易端】【订单管理】订单关联功能.md` - `source:thoughts-v2-current/v2.3.x/贸易端/【贸易端】【订单管理】里程碑互用功能.md` - `source:thoughts-v2-current/V2.4.x/贸易端/系统自动执行的相关操作日志.md` - `source:thoughts-v2-current/V2.5.x/运营端/【运营端】【SCCS管理】SCCS列表增加外部api集成配置.md` - `source:thoughts-v2-current/v2.8/贸易端/【贸易端】FS 数据移交.md` ", "domain": "贸易端", "module": "权限、安全与审计", "tags": "订单跟踪记录;订单;里程碑;工单;复用关系", "sources": [{"title": "【贸易端】【订单详情】查看&操作", "version": "v2.2.x", "product_side": "贸易端", "module": "订单详情", "last_write_time": "2026-09-04T10:48:34"}, {"title": "【贸易端】【订单管理】订单翻单功能", "version": "v2.3.x", "product_side": "贸易端", "module": "订单管理", "last_write_time": "2026-09-04T10:48:25"}, {"title": "【贸易端】【订单管理】订单关联功能", "version": "v2.3.x", "product_side": "贸易端", "module": "订单管理", "last_write_time": "2026-09-04T10:48:21"}, {"title": "【贸易端】【订单管理】里程碑互用功能", "version": "v2.3.x", "product_side": "贸易端", "module": "订单管理", "last_write_time": "2026-09-04T10:48:22"}, {"title": "系统自动执行的相关操作日志", "version": "V2.4.x", "product_side": "贸易端", "module": "贸易端", "last_write_time": "2026-09-04T10:48:06"}, {"title": "【运营端】【SCCS管理】SCCS列表增加外部api集成配置", "version": "V2.5.x", "product_side": "运营端", "module": "SCCS管理", "last_write_time": "2026-09-04T10:48:05"}]}, {"path": "docs/40-权限、安全与审计/资源库数据围栏.md", "title": "资源库数据围栏", "folder": "docs/40-权限、安全与审计", "text": " # 资源库数据围栏  ## 1. 功能定位  资源库数据围栏是在资源库表级操作权限和行级数据范围基础上增加的列级可见权限，用于限制成员、协作团队查看资源表中的敏感列，并统一作用于资源库页面、数据出口、外部分享和 FlowSpace 引用。  本期不包含单元格级权限、字段脱敏、FlowSpace 现有数据围栏改造、权限变更通知。隐藏列不展示字段名及字段值。  ## 2. 管理权限  | 角色 | 权限 | | --- | --- | | 团队层面资源库管理员 | 管理全部资源库的数据围栏 | | 拥有当前资源库设置权限的成员角色 | 管理当前资源库的数据围栏 | | 协作方角色、协作资源库普通成员、其他成员 | 不展示入口；地址访问提示“暂无权限，请联系管理员” |  管理包括查看、新增、编辑、删除数据围栏。服务端必须再次校验权限。  ## 3. 围栏配置  | 配置项 | 规则 | | --- | --- | | 围栏名称 | 必填，最多 100 字符 | | 资源表 | 必填，单选当前资源库内正常资源表 | | 限制成员 | 选填，多选本团队成员，可包含未注册成员 | | 限制协作团队 | 选填，多选与本团队仍有效的协作团队，包括邀请我的和我邀请的团队；限制字段作用于该团队全部成员 | | 不可查看列 | 必填，新增时默认不选；至少 1 列；仅展示所选资源表当前有效业务列，支持按模块分组全选 |  保存时校验管理权限、资源表、成员、团队及字段有效性。资源表失效、成员移出团队、协作关系解除、字段删除等场景需阻止保存或自动移除失效字段。  ## 4. 权限计算  用户可访问数据 = 表级操作权限 ∩ 行级数据范围 ∩ 列级数据围栏 有效可见列 = 当前有效列 - 用户命中的全部不可查看列  规则：  1. 数据围栏只收窄列范围，不授予表、行或操作权限。 2. 同一用户命中多个围栏时，不可查看列取并集。 3. 协作团队围栏作用于该团队全部成员。 4. 资源库管理员本人也可被限制；但有围栏管理权限的用户在围栏配置页可看到全部字段名，以便完成配置。 5. 有资源表查看权限但有效可见列为空时，保留资源表入口和记录数，内容区展示“暂无可查看字段”。  ## 5. 页面与数据出口影响  列权限必须由服务端统一过滤，不能只在前端隐藏。  | 功能面 | 规则 | | --- | --- | | 列表、详情 | 不返回隐藏列名、列值及空占位；关联引用控件来源被围栏限制的字段也不显示 | | 新增、编辑、批量编辑 | 不展示隐藏列；提交其他列时不得覆盖隐藏列原值 | | 模糊查询、筛选、排序、列设置 | 不提供隐藏列；已保存视图中的相关条件失效，且不暴露字段名和值 | | 统计 | 不返回隐藏列统计结果 | | 附件、历史记录 | 附件列隐藏时不可查看/下载或批量下载；历史记录不展示隐藏列新旧值及差异 | | 导出 | 字段选择和文件内容均排除隐藏列 | | 导入 | 字段匹配、预览不展示隐藏列；导入其他列时不校验、不修改隐藏列 |  ## 6. 外部分享列权限  单条数据分享、整表分享均增加“分享列权限”。  外部实际可见列 = 本次分享可见列 ∩ 分享者实时有效可见列 ∩ 当前有效列  | 场景 | 规则 | | --- | --- | | 可选范围 | 仅返回分享者当前有效可见列，不返回被围栏隐藏的字段名 | | 首次创建 | 默认所有可分享字段都勾选为“分享可见” | | 保存校验 | 至少保留 1 个可见字段 | | 搜索/全选 | 仅作用于当前可选列，不得命中隐藏列 | | 编辑分享 | 返回当前仍有效且当前用户可见的列；删除或暂不可见的列不返回，也不可重新选择 | | 实际访问 | 分享创建、预览、外部访问、搜索、筛选、排序、统计、详情、导出、下载、编辑提交时均按最新权限计算 |  分享方式由编辑时实时同步改为需点击保存才生效。分享链接管理列表允许编辑本人创建的链接；关闭分享仍按删除处理，只允许在列表中操作。  ## 7. 默认、变更与兼容  1. 未配置围栏的存量资源库默认全部列可见。 2. 新增资源表字段在平台内默认可见，但不自动加入已有外部分享。 3. 新成员加入受限协作团队后自动命中团队围栏；本团队成员级围栏需单独配置。 4. 权限变更服务端立即生效；已打开页面在刷新、翻页、导出、提交时按最新权限重新校验。 5. 资源库数据编辑、删除及外部分享编辑触发的订单同步，继续遵循既有同步范围和失效规则。  ## 8. 验收重点  1. 数据围栏可按资源表配置成员、协作团队和不可查看列。 2. 多围栏命中时隐藏列按并集生效，且不改变表级、行级和操作权限。 3. 列表、详情、编辑、视图、搜索、统计、附件、历史、导入、导出和用户身份接口结果一致，响应及文件不包含隐藏值。 4. 编辑、导入或外部提交可见列时，不覆盖隐藏列原值。 5. 单条和整表分享均可单独选择分享列；隐藏字段名不出现在可选项、搜索结果或提示中。 6. 外部实际可见列符合三项交集；权限变化、字段新增/重命名/删除和空列状态符合规则。 7. 存量分享的初始分享列等于上线时分享者当前有效可见列，不突破新围栏。  ## 9. 来源需求  - `source:thoughts-v2-current/v2.8/贸易端/【贸易端】资源库数据围栏.md`", "domain": "贸易端", "module": "权限、安全与审计", "tags": "资源库;资源库数据围栏;数据围栏;列级权限;外部分享;字段权限", "sources": [{"title": "【贸易端】资源库数据围栏", "version": "v2.8", "product_side": "贸易端", "module": "贸易端", "last_write_time": "2026-09-04T10:47:47"}]}, {"path": "docs/40-权限、安全与审计/资源库权限.md", "title": "资源库权限", "folder": "docs/40-权限、安全与审计", "text": " # 资源库权限  ## 1. 功能定位  资源库权限控制团队资源库的创建、删除、设置、表数据查看、创建、编辑、删除、导入、导出、分享，以及协作团队对资源库数据的访问和操作范围。  ## 2. 团队级入口权限  | 权限 | 说明 | | --- | --- | | 创建资源库 | 允许成员在当前团队下创建资源库 | | 删除资源库 | 允许成员删除本团队下任意资源库，并可查看所有资源库数据 | | 资源库设置 | 允许成员查看本团队资源库所有数据，并管理资源库设置 | | 协作资源库管理 | 允许成员管理本团队参与协作的资源库设置，以及主团队授权的数据操作权限 |  ## 3. 单个资源库角色  | 角色 | 规则 | | --- | --- | | 资源库管理员 | 每个资源库固定角色，拥有当前资源库所有权限；默认创建资源库的成员为管理员；不可删除，不可修改权限点，但可修改成员 | | 成员角色 | 面向本团队成员，可配置资源库设置和各表权限 | | 协作方角色 | 面向协作团队，权限类似成员角色，但没有资源库设置权限 |  任意资源库中任意角色添加了成员后，该成员即可见资源库主菜单；具体可见哪个资源库、哪些表、哪些数据，继续由角色勾选内容决定。  ## 4. 表权限与数据范围  | 维度 | 规则 | | --- | --- | | 表权限 | 资源库下每张表单独配置权限；勾选任意表操作权限时，需同时勾选该表“查看数据” | | 全部 | 可操作对应表下所有数据 | | 本人创建 | 仅可操作成员本人创建的数据 | | 自定义 | 必须配置字段条件；字段范围包括模板字段、创建人、创建时间、更新人、更新时间等 | | 数据围栏 | 在表级操作权限和行级数据范围基础上，进一步按成员或协作团队收窄资源表列级可见范围 |  成员控件、创建人、更新人可选择“当前用户”；协作方控件可选择“当前团队”。  ## 5. 数据操作权限  | 操作 | 权限要求 | | --- | --- | | 查看数据 | 需拥有当前表查看权限和对应数据范围 | | 创建数据 | 需拥有当前表新增权限 | | 编辑数据 | 需拥有当前表编辑权限；批量编辑按钮也受此权限控制 | | 删除数据 | 需拥有当前表删除权限 | | 导入数据 | 当前用户在当前资源表需有导入权限 | | 导出数据 | 仅导出当前用户有查看权限的表和数据 | | 批量下载文件 | 所有可进入当前资源表的成员可见 | | 快捷创建引用数据 | 在订单资源库引用弹窗中，需拥有当前资源表“创建数据”权限；打开创建页和提交时均由服务端校验 |  导入记录仅能查看本人导入的记录。资源库数据导入成功后，需要增加导入人操作的新增或修改历史记录。  ## 6. 协作资源库  主团队授权后，协作团队资源库列表会展示协作类型资源库，并只展示授权给本团队且有查看权限的表。协作资源库设置包含成员管理，可添加当前团队成员并设置角色。  | 协作角色 | 说明 | | --- | --- | | 资源库管理员 | 拥有当前协作资源库设置权限，以及主团队授权给本团队的所有表内相关权限 | | 普通成员 | 拥有当前资源库中主团队授权给本团队的所有表内相关权限 |  同一协作团队拥有多个角色时，权限叠加。  ## 7. 分享权限  | 分享类型 | 规则 | | --- | --- | | 单条数据分享 | 内部成员或协作团队成员只要有数据查看权限，即可分享单条数据 | | 整表分享 | 有资源表查看权限即可分享整表 | | 分享权限同步 | 分享者权限变更后，被分享方权限同步更新 | | 分享失效 | 分享者失去查看权限时，分享链接失效；重新获得权限后原链接仍失效，需重新分享 | | 分享链接管理 | 管理员可查看权限范围内所有分享链接；成员个人只可查看本人分享链接 | | 分享列权限 | 单条数据分享和整表分享均需叠加分享列权限，实际可见列为“本次分享可见列、分享者实时有效可见列、当前有效列”的交集 |  分享链接删除后失效。预览、删除、编辑提交时均需校验权限。  ## 8. 与 FlowSpace 引用的关系  资源库被 FlowSpace 引用后，数据权限和同步规则会影响订单数据。若资源库协作授权导致数据不可见，当前需求暂按“资源库数据被删除”逻辑同步清空 FlowSpace 订单字段处理，但该方案仍需作为重点确认项保留。  资源库数据围栏只收窄列范围，不授予表、行或操作权限。FlowSpace 引用、列表详情、编辑、导入导出、历史、统计和外部分享均需由服务端按最新列权限过滤。  ## 9. 审计要求  资源库设置操作日志需要记录：  - 基本信息新增、编辑。 - 权限管理新增、编辑、删除。  运营端模板修改不记录在资源库设置操作日志中。  ## 10. 待确认问题  - 协作资源库数据不可见时，历史引用数据保留还是同步清空，目前需求中存在方案说明，需与线上规则确认。 - 外部分享只读开关、分享者编辑权限、被分享者编辑权限之间的最终优先级需补充矩阵。 - 导出是否严格按数据范围过滤字段和记录，需要后续用线上验证。 ", "domain": "贸易端", "module": "权限、安全与审计", "tags": "权限;资源库;协作资源库;分享", "sources": [{"title": "【贸易端】【资源库】第一阶段", "version": "V2.4.x", "product_side": "贸易端", "module": "资源库", "last_write_time": "2026-09-04T10:48:14"}, {"title": "【贸易端】【资源库】资源库分享", "version": "V2.5.x", "product_side": "贸易端", "module": "资源库", "last_write_time": "2026-09-04T10:48:03"}, {"title": "【贸易端】【资源库】SCCS应用数据范围、数据编辑历史记录", "version": "v2.7", "product_side": "贸易端", "module": "资源库", "last_write_time": "2026-09-04T10:47:57"}, {"title": "【贸易端】【操作日志】所有设置类功能", "version": "V2.4.x", "product_side": "贸易端", "module": "操作日志", "last_write_time": "2026-09-04T10:48:09"}, {"title": "【贸易端】订单引用资源库页面快捷创建资源库数据", "version": "v2.8", "product_side": "贸易端", "module": "贸易端", "last_write_time": "2026-09-04T10:47:51"}, {"title": "【贸易端】资源库数据围栏", "version": "v2.8", "product_side": "贸易端", "module": "贸易端", "last_write_time": "2026-09-04T10:47:47"}]}, {"path": "docs/45-测试支持/README.md", "title": "45 测试支持", "folder": "docs/45-测试支持", "text": "# 45 测试支持  本目录面向测试人员和质量保障工作，负责把功能文档、业务对象、业务流程、权限规则、数据模型和版本历史转化为可执行的测试资产。  测试支持区不是重复产品规则，而是将权威知识转成验收清单、测试矩阵、边界场景、回归重点和 FAQ，帮助测试人员更快理解业务、更准确设计用例、更系统定位缺陷。  ## 页面  - [测试支持价值](./测试支持价值.md) - [模块验收标准清单](./模块验收标准清单.md) - [核心业务流程图索引](./核心业务流程图索引.md) - [数据流转与校验规则](./数据流转与校验规则.md) - [权限测试矩阵](./权限测试矩阵.md) - [异常场景与边界值库](./异常场景与边界值库.md) - [历史 Bug 高发区标记](./历史Bug高发区标记.md) - [版本回归测试重点](./版本回归测试重点.md) - [测试常见问题 FAQ](./测试常见问题FAQ.md)  ## 使用原则  1. 功能验收标准从 [功能模块详情](../10-功能模块详情/README.md) 提炼。 2. 流程测试路径引用 [业务流程与产品流程图](../30-业务流程与产品流程图/README.md)。 3. 数据校验规则引用 [业务对象与数据模型](../20-业务对象与数据模型/README.md)。 4. 权限测试矩阵引用 [权限、安全与审计](../40-权限、安全与审计/README.md) 并转化为具体用例。 5. 回归测试重点引用 [版本历史与来源治理](../90-版本历史与来源治理/README.md)。 ", "domain": "测试支持", "module": "测试支持", "tags": "测试;验收;回归;问题排查", "sources": []}, {"path": "docs/45-测试支持/历史Bug高发区标记.md", "title": "历史 Bug 高发区标记", "folder": "docs/45-测试支持", "text": "# 历史 Bug 高发区标记  本页用于沉淀历史缺陷高发区域和回归时必须重点关注的风险点。  ## 当前高风险区域  | 区域 | 常见风险 | | --- | --- | | 权限和数据围栏 | 列表可见、详情可见、字段可见、导出可见不一致 | | 资源库引用与同步 | 引用字段显示正确但保存或同步目标错误 | | 模板同步到实例 | 模板字段变更影响既有 FlowSpace、订单、工单数据 | | 工单与批复 | 工单批复、里程碑批复的基数和状态容易混淆 | | 自动化执行 | 重复触发、失败无日志、写入层级错误 | | 仪表盘与报表 | 指标口径、权限过滤、刷新时机不一致 | | 导入导出 | 字段映射、权限过滤、子表、附件和历史记录容易遗漏 |  ## 记录模板  | 日期 | 缺陷区域 | 问题表现 | 根因 | 回归建议 | | --- | --- | --- | --- | --- | | 待补充 | 待补充 | 待补充 | 待补充 | 待补充 |  ## 维护规则  每次线上缺陷或高优先级缺陷复盘后，应补充本页，并同步更新 [版本回归测试重点](./版本回归测试重点.md)。 ", "domain": "测试支持", "module": "测试支持", "tags": "测试;验收;回归;问题排查", "sources": []}, {"path": "docs/45-测试支持/异常场景与边界值库.md", "title": "异常场景与边界值库", "folder": "docs/45-测试支持", "text": "# 异常场景与边界值库  本页用于长期沉淀测试中高价值的异常场景、边界值和容易遗漏的业务组合。  ## 资源库与引用异常  | 场景 | 测试关注 | | --- | --- | | 订单引用的工厂被停用 | 订单历史展示、再次编辑、统计口径是否明确 | | 工厂准入状态从已准入改为暂停 | 新订单是否禁止选择，旧订单是否保留历史 | | 供应商与工厂解除关联 | 供应商订单是否还能选择该工厂 | | 资源库记录重复 | 搜索、选择、同步、报表是否可识别重复风险 | | 资源库字段类型变更 | 已有订单引用字段是否兼容 |  ## 流程与状态异常  | 场景 | 测试关注 | | --- | --- | | 工厂申报被退回后再次提交 | 历史记录、附件、审批意见是否保留 | | 工单批复前订单被取消 | 工单和批复状态是否同步受控 | | CAP 复核退回后再次提交 | 证据版本、复核记录、通知是否正确 | | 里程碑批复已存在时再次创建工单 | 里程碑批复唯一性是否保持 | | 自动化重复触发 | 是否产生重复通知、重复写入或重复日志 |  ## 权限边界异常  | 场景 | 测试关注 | | --- | --- | | 供应商被移出协作团队 | 历史订单、待处理工单、通知链接是否受控 | | 用户角色被降级 | 已打开页面、导出、接口数据是否同步受限 | | 邮件协作链接过期或转发 | 外部填写权限是否可控 | | 数据围栏调整后 | 列表、详情、搜索、仪表盘、导出是否一致 |  ## 边界值  | 类型 | 边界 | | --- | --- | | 文本 | 空值、超长、特殊符号、重复名称、中英文混合 | | 数字 | 0、负数、小数、超大值、百分比边界 | | 日期 | 过去日期、当天、跨年、有效期过期、开始晚于结束 | | 附件 | 空附件、超大附件、多附件、重复文件名、不支持格式 | | 子表 | 0 行、1 行、多行、删除全部、批量导入重复行 | ", "domain": "测试支持", "module": "测试支持", "tags": "测试;验收;回归;问题排查", "sources": []}, {"path": "docs/45-测试支持/数据流转与校验规则.md", "title": "数据流转与校验规则", "folder": "docs/45-测试支持", "text": "# 数据流转与校验规则  本页用于把业务对象和数据模型转化为测试人员可执行的数据校验规则。  ## 数据层级校验  | 数据层级 | 校验重点 | 来源 | | --- | --- | --- | | 业务模板 | 主表单唯一、里程碑、工单表单、批复表单配置正确 | [业务模板](../20-业务对象与数据模型/业务模板.md) | | FlowSpace | 模板实例化后结构、权限、数据围栏正确 | [FlowSpace](../20-业务对象与数据模型/FlowSpace.md) | | 订单 | 主表单字段、状态、订单级数据、跟踪记录正确 | [订单数据模型](../20-业务对象与数据模型/订单数据模型.md) | | 里程碑 | 计划时间、负责人、状态、工单挂载正确 | [里程碑](../20-业务对象与数据模型/里程碑.md) | | 工单 | 工单字段、附件、采集数据、批复关系正确 | [工单数据模型](../20-业务对象与数据模型/工单数据模型.md) | | 资源库 | 主数据、引用、同步、历史记录、权限过滤正确 | [资源库数据模型](../20-业务对象与数据模型/资源库数据模型.md) | | 子表 | 子表行新增、编辑、删除、导入导出、历史记录正确 | [字段、组件、子表、引用关系](../20-业务对象与数据模型/字段、组件、子表、引用关系.md) |  ## 外贸供应链场景数据流转  flowchart LR A[\"供应商资源库\"] --> B[\"工厂资源库\"] C[\"工厂申报 FlowSpace\"] --> B B --> D[\"订单管理 FlowSpace\"] D --> E[\"社会责任验厂 FlowSpace\"] E --> F[\"CAP 跟进 FlowSpace\"] F --> B B --> D  ## 校验规则  | 场景 | 必验规则 | | --- | --- | | 工厂申报通过 | 工厂资源库生成或更新记录，准入状态、资质附件、所属供应商正确 | | 订单选择工厂 | 只能选择当前供应商名下且符合状态要求的工厂 | | 验厂审核完成 | 审核报告、审核结论、审核日期可以回到工厂资源库或被后续 CAP 引用 | | CAP 关闭 | CAP 状态、未关闭数量、风险等级可以影响工厂资源库和订单风险展示 | | 资源库引用断链 | 被引用记录删除、停用或权限变化后，订单/工单展示和保存行为明确 | | 自动化写入 | 写入目标层级正确，并有系统执行日志 | ", "domain": "测试支持", "module": "测试支持", "tags": "测试;验收;回归;问题排查", "sources": []}, {"path": "docs/45-测试支持/权限测试矩阵.md", "title": "权限测试矩阵", "folder": "docs/45-测试支持", "text": "# 权限测试矩阵  本页用于把权限规则转化为测试用例矩阵。权威规则以权限目录为准，本页负责测试覆盖。  ## 通用权限维度  | 维度 | 测试点 | | --- | --- | | 团队角色 | 拥有者、管理员、普通成员、外部协作者的入口和操作差异 | | FlowSpace 业务角色 | FlowSpace 内订单、里程碑、工单、设置和数据范围 | | 协作 FlowSpace 角色 | 协作团队只看到被授权的数据和任务 | | 数据围栏 | 字段、标签、订单、资源库记录的可见性 | | 资源库权限 | 创建、编辑、删除、分享、引用、同步、历史记录 | | 仪表盘与报告权限 | 图表、报表、数据源和结果是否按权限过滤 |  ## 品牌方供应商工厂场景权限矩阵  | 角色 | 应能操作 | 不应能操作 | | --- | --- | --- | | 品牌方管理员 | 查看全部供应商、工厂、订单、验厂、CAP，配置模板和权限 | 不适用 | | 品牌方审核人 | 审核被分配的工厂申报、验厂报告、CAP 复核 | 修改无关模板和全局权限 | | 供应商管理员 | 提交自己名下工厂申报，查看自己相关订单，提交生产工厂报备 | 查看其他供应商订单、工厂和品牌方内部审核意见 | | 工厂联系人 | 补充本工厂资料，提交被分配的整改证据 | 查看供应商全量订单、其他工厂资料 | | DAREN 服务商 | 查看被分配的验厂和 CAP 任务，提交审核报告或复核意见 | 查看品牌方全部订单和供应商资源库 | | 现场审核员/QC | 在采集端完成现场工单、上传图片附件、签名 | 修改品牌方审批结论和资源库主数据 |  ## 测试用例转化规则  每条权限规则至少转化为三类用例：  1. 有权限用户可以完成操作。 2. 无权限用户看不到入口或无法提交。 3. 数据范围变化后，已有页面、搜索、导出、仪表盘同步受控。 ", "domain": "测试支持", "module": "测试支持", "tags": "测试;验收;回归;问题排查", "sources": []}, {"path": "docs/45-测试支持/核心业务流程图索引.md", "title": "核心业务流程图索引", "folder": "docs/45-测试支持", "text": "# 核心业务流程图索引  本页用于测试人员快速定位需要覆盖的端到端业务流程。流程图源头以业务流程目录为准，本页负责转成测试入口。  ## 核心流程  | 流程 | 测试关注点 | 来源 | | --- | --- | --- | | 从模板到 FlowSpace | 模板发布、创建 FlowSpace、模板同步、实例数据影响 | [从模板到 FlowSpace](../30-业务流程与产品流程图/从模板到FlowSpace.md) | | 订单生命周期 | 创建、编辑、完成、取消、重启、跟踪记录 | [订单生命周期](../30-业务流程与产品流程图/订单生命周期.md) | | 工单采集与批复 | 创建工单、指派、采集、工单批复、里程碑批复、终止采集 | [工单采集与批复](../30-业务流程与产品流程图/工单采集与批复.md) | | 资源库引用与同步 | 资源库引用、同步回写、历史记录、权限过滤 | [资源库引用与同步](../30-业务流程与产品流程图/资源库引用与同步.md) | | 跨团队协作 | 协作团队邀请、协作 FlowSpace、对接人、外部角色权限 | [跨团队协作](../30-业务流程与产品流程图/跨团队协作.md) | | 自动化执行 | 条件触发、动作执行、失败日志、重复执行控制 | [自动化执行](../30-业务流程与产品流程图/自动化执行.md) | | 移动端采集 | 采集端任务列表、任务详情、工单提交、批复查看、消息通知 | [移动端采集](../30-业务流程与产品流程图/移动端采集.md) | | 品牌方供应商与工厂准入 | 工厂申报、资源库同步、订单工厂报备、验厂、CAP 回写 | [品牌方供应商与工厂准入协同方案](../50-运营支持知识/03-业务场景案例库/外贸供应商治理/品牌方供应商与工厂准入协同方案.md) |  ## 测试覆盖建议  每条核心流程至少覆盖：  1. 正常主路径。 2. 权限不足路径。 3. 状态不允许路径。 4. 数据缺失或格式错误路径。 5. 通知、日志、历史记录路径。 6. 跨端或跨角色协作路径。", "domain": "测试支持", "module": "测试支持", "tags": "测试;验收;回归;问题排查", "sources": []}, {"path": "docs/45-测试支持/模块验收标准清单.md", "title": "模块验收标准清单", "folder": "docs/45-测试支持", "text": "# 模块验收标准清单  本页用于把功能模块文档转化为可验收的测试清单。它不替代功能模块说明，而是帮助测试人员判断“什么算通过”。  ## 通用验收维度  | 维度 | 验收问题 | 关联知识 | | --- | --- | --- | | 页面入口 | 用户是否能在正确端、正确菜单、正确权限下进入功能 | [功能模块详情](../10-功能模块详情/README.md) | | 基础操作 | 新增、查看、编辑、删除、提交、批复、导入导出是否符合规则 | [业务对象与数据模型](../20-业务对象与数据模型/README.md) | | 状态流转 | 状态是否按流程变化，异常回退是否可控 | [业务流程与产品流程图](../30-业务流程与产品流程图/README.md) | | 权限边界 | 不同角色的可见、可编辑、可操作范围是否正确 | [权限体系总表](../40-权限、安全与审计/权限体系总表.md) | | 数据留痕 | 操作日志、历史记录、跟踪记录是否完整 | [权限、安全与审计](../40-权限、安全与审计/README.md) | | 通知自动化 | 通知、自动化、系统执行记录是否按规则触发 | [自动化](../10-功能模块详情/自动化.md) | | 分析展示 | 视图、仪表盘、报表是否符合数据口径和权限范围 | [数据分析支持](../60-数据分析支持/README.md) |  ## 核心模块验收清单  | 模块 | 关键验收点 | | --- | --- | | 工作台 | FlowSpace 列表、订单日程、任务中心、常用视图入口与权限过滤正确 | | FlowSpace | 创建、分组、设置、成员、协作方、业务角色、数据围栏生效 | | 业务模板 | 主表单唯一、里程碑配置、工单表单、批复表单、模板发布和同步符合规则 | | 订单 | 创建、编辑、完成、取消、重启、导入导出、订单详情和跟踪记录正确 | | 工单与批复 | 工单创建、采集、批复、终止、里程碑批复、动态与通知正确 | | 资源库 | 资源库模板、记录维护、引用、同步、分享、历史记录和权限正确 | | 表单设计器 | 组件类型、字段校验、显隐规则、子表、公式、关联引用正确 | | 自动化 | 触发条件、执行动作、失败记录、执行日志、权限边界正确 | | 消息通知 | 消息中心、实时通知、邮件协作、批量邮件协作和未读状态正确 | | 仪表盘与报表 | 数据源、指标口径、权限范围、筛选器、图表展示和报表链接正确 | | 设置与权限 | 团队权限、FlowSpace 权限、协作权限、资源库权限、审计日志正确 |  ## 维护规则  新增功能模块或模块边界变化时，应同步补充本页的验收点。 ", "domain": "测试支持", "module": "测试支持", "tags": "测试;验收;回归;问题排查", "sources": []}, {"path": "docs/45-测试支持/测试常见问题FAQ.md", "title": "测试常见问题 FAQ", "folder": "docs/45-测试支持", "text": "# 测试常见问题 FAQ  本页用于沉淀测试人员在理解业务、设计用例和定位缺陷时的常见问题。  ## 常见问题  | 问题 | 回答 | | --- | --- | | 测试一个需求时先看哪些文档？ | 先看功能模块页，再看业务对象、业务流程、权限、安全审计和数据分析相关页面。 | | 如何判断字段应该测订单还是工单？ | 先看 [FlowSpace 数据层级](../20-业务对象与数据模型/FlowSpace数据层级.md)，判断字段属于订单主表单、里程碑工单、批复表单、资源库还是子表。 | | 权限测试只测按钮显示够吗？ | 不够。还要测列表、详情、搜索、导出、仪表盘、报告、通知链接和接口数据范围。 | | 资源库引用类需求怎么测？ | 必须测引用选择、权限过滤、字段带出、同步回写、引用记录停用或删除后的行为。 | | 自动化类需求怎么测？ | 必须测触发条件、执行动作、重复触发、失败记录、执行日志和权限边界。 | | 仪表盘数据不一致怎么定位？ | 先确认指标口径、数据源、权限范围、刷新时机，再对照列表和源数据。 | | 发现知识库与系统行为不一致怎么办？ | 先确认系统行为是否符合产品预期，再更新权威知识页、待确认问题或缺陷记录。 | ", "domain": "测试支持", "module": "测试支持", "tags": "测试;验收;回归;问题排查", "sources": []}, {"path": "docs/45-测试支持/测试支持价值.md", "title": "测试支持价值", "folder": "docs/45-测试支持", "text": "# 测试支持价值  本页用于说明 Linkincrease 知识库如何支持测试人员理解业务、设计用例、判断影响范围、执行回归和定位缺陷。  ## 测试人员可以从知识库获得什么  | 测试关注点 | 知识库价值 | 主要入口 | | --- | --- | --- | | 业务理解 | 快速理解 Linkincrease 面向外贸供应链的业务对象、角色和场景 | [产品能力地图](../00-产品总览与规划/产品能力地图.md)、[业务场景总览](../50-运营支持知识/03-业务场景案例库/业务场景总览.md) | | 功能边界 | 明确每个模块负责什么、不负责什么 | [功能模块详情](../10-功能模块详情/README.md) | | 数据层级 | 判断字段、状态、附件、批复、资源库引用应该落在哪个层级 | [FlowSpace 数据层级](../20-业务对象与数据模型/FlowSpace数据层级.md) | | 流程路径 | 设计端到端主流程、异常流程和跨端协作用例 | [业务流程与产品流程图](../30-业务流程与产品流程图/README.md) | | 权限验证 | 设计不同角色、团队、协作方、数据围栏的可见和可操作用例 | [权限体系总表](../40-权限、安全与审计/权限体系总表.md) | | 数据分析校验 | 校验仪表盘、报表、视图统计口径和数据来源 | [数据分析支持](../60-数据分析支持/README.md) | | 审计追溯 | 验证操作日志、历史记录、系统执行日志是否完整 | [权限、安全与审计](../40-权限、安全与审计/README.md) | | 行业场景验收 | 按品牌方、供应商、工厂、验厂、CAP 等真实场景设计验收用例 | [品牌方供应商与工厂准入协同方案](../50-运营支持知识/03-业务场景案例库/外贸供应商治理/品牌方供应商与工厂准入协同方案.md) |  ## 测试设计建议  ### 1. 按业务对象拆测试范围  需求涉及 FlowSpace、订单、工单、批复、资源库、仪表盘、自动化时，先判断变化发生在哪个对象层级。测试用例不应只按页面入口拆分，还要覆盖对象之间的数据关系。  ### 2. 按角色拆权限矩阵  至少区分：  - 品牌方管理员 - 品牌方审核人 - 供应商管理员 - 工厂联系人 - DAREN 服务商 - 现场审核员或 QC - 仅查看数据的管理层角色  每个角色都应验证“能看到什么、能编辑什么、不能看到什么、不能操作什么”。  ### 3. 按数据流转设计端到端用例  以品牌方供应商与工厂准入场景为例，测试链路应覆盖：  flowchart LR A[\"供应商提交工厂申报\"] --> B[\"品牌方审批\"] B --> C[\"同步工厂资源库\"] C --> D[\"订单选择生产工厂\"] D --> E[\"发起社会责任验厂\"] E --> F[\"生成CAP整改\"] F --> G[\"CAP关闭后回写工厂状态\"] G --> H[\"订单侧展示最新工厂风险\"]  ### 4. 每个需求都要补齐回归检查  | 变更类型 | 必查回归 | | --- | --- | | 新增字段 | 字段显示、编辑、必填、导入导出、历史记录、权限可见性 | | 新增状态 | 状态流转、异常回退、自动化触发、筛选统计 | | 新增资源库引用 | 引用过滤、断链处理、权限过滤、同步回写 | | 新增批复 | 处理人、批复结论、退回、通知、日志 | | 新增自动化 | 触发条件、执行动作、失败重试、执行日志 | | 新增仪表盘/报表 | 数据源、指标口径、权限范围、刷新时机 |  ## 缺陷定位建议  测试发现问题时，先按以下路径定位：  1. 是页面展示问题，还是底层数据层级问题。 2. 是用户权限问题，还是字段可见性/数据围栏问题。 3. 是流程状态不允许操作，还是按钮/入口遗漏。 4. 是资源库引用错误，还是订单/工单保存的数据错误。 5. 是自动化未触发，还是触发后写入目标错误。 6. 是仪表盘口径错误，还是数据源和权限范围不同。 7. 是否有日志、历史记录、快照可以证明问题发生时间和操作者。  ## 需求评审时测试应关注的问题  - 这个需求影响哪些业务对象和数据层级？ - 是否涉及资源库引用、同步或回写？ - 是否影响订单、工单、批复、里程碑状态？ - 是否新增角色、权限、数据围栏或字段可见性？ - 是否影响采集端、贸易端、运营端或外部协作方？ - 是否需要通知、自动化、日志、历史记录？ - 是否影响导入、导出、仪表盘、报表和搜索筛选？ - 是否存在历史数据迁移或兼容性问题？  ## 维护规则  测试发现知识库与系统行为不一致时，应先确认系统行为是否符合产品预期。确认后，按结果更新权威知识页、待确认问题或版本变更记录。", "domain": "测试支持", "module": "测试支持", "tags": "测试;验收;回归;问题排查", "sources": []}, {"path": "docs/45-测试支持/版本回归测试重点.md", "title": "版本回归测试重点", "folder": "docs/45-测试支持", "text": "# 版本回归测试重点  本页用于根据版本变更和历史风险沉淀回归测试重点。  ## 回归范围判断  | 变更类型 | 回归重点 | | --- | --- | | 功能模块变更 | 对应模块验收清单、入口、权限、主流程 | | 业务对象变更 | 数据层级、字段保存、历史记录、导入导出 | | 权限变更 | 不同角色、数据围栏、导出、仪表盘和报告 | | 流程变更 | 主路径、退回路径、状态边界、通知和日志 | | 资源库变更 | 引用、同步、删除/停用、历史记录和权限过滤 | | 自动化变更 | 触发条件、执行动作、失败日志、重复触发 | | 仪表盘/报表变更 | 指标口径、数据源、权限范围、刷新时机 |  ## 版本回归记录模板  | 版本 | 变更摘要 | 必回归模块 | 高风险用例 | 关联来源 | | --- | --- | --- | --- | --- | | 待补充 | 待补充 | 待补充 | 待补充 | [版本变更记录](../90-版本历史与来源治理/版本变更记录.md) |  ## 关联文档  - [版本变更记录](../90-版本历史与来源治理/版本变更记录.md) - [历史 Bug 高发区标记](./历史Bug高发区标记.md) - [模块验收标准清单](./模块验收标准清单.md) ", "domain": "测试支持", "module": "测试支持", "tags": "测试;验收;回归;问题排查", "sources": []}, {"path": "docs/50-运营支持知识/01-新人上手/常见术语一页纸.md", "title": "常见术语一页纸", "folder": "docs/50-运营支持知识/01-新人上手", "text": "# 常见术语一页纸  本页用于运营新人快速掌握 Linkincrease 常用术语。  | 术语 | 一句话解释 | 运营理解重点 | | --- | --- | --- | | FlowSpace | 围绕一个业务流程或协作项目创建的供应链协作空间 | 承载订单、里程碑、工单、批复、成员和权限 | | 业务模板 | 用来创建 FlowSpace 的配置模板 | 决定主表单、里程碑、工单表单和批复表单 | | 订单 | FlowSpace 中的主业务记录 | 常用于承载采购订单、工厂申报、验厂项目或 CAP 项目 | | 里程碑 | 订单下的阶段节点 | 用于拆分流程阶段，例如资料提交、审核、验厂、整改 | | 工单 | 里程碑下的执行任务 | 用于采集数据、提交资料、上传附件、处理现场任务 | | 工单批复 | 针对单个工单的审批或确认 | 每个工单可对应自己的批复 | | 里程碑批复 | 针对整个里程碑阶段的审批或确认 | 一个里程碑通常只有一个里程碑批复 | | 资源库 | 维护可复用主数据的数据库式能力 | 适合供应商、工厂、物料、证书、报告等 | | 关联引用 | 在表单中引用资源库或其他对象数据 | 减少重复录入，保证订单和资源库数据一致 | | 数据围栏 | 控制不同角色能看哪些数据和字段 | 供应商协同、外部服务商协同必须重点配置 | | 协作团队 | 被邀请参与 FlowSpace 或任务的外部团队 | 常用于供应商、工厂、DAREN 服务商、QC 团队 | | 自动化 | 根据条件触发通知、写入或其他动作 | 适合逾期提醒、状态更新、数据回写 | | Tower 仪表盘 | 管理和分析业务数据的看板能力 | 用于订单、验厂、CAP、供应商风险等监控 | | CAP | Corrective Action Plan，整改行动计划 | 常用于验厂或审核后跟进整改项 | ", "domain": "公共能力", "module": "运营支持知识", "tags": "运营支持知识;01-新人上手;常见术语一页纸", "sources": []}, {"path": "docs/50-运营支持知识/01-新人上手/第一天任务清单.md", "title": "第一天任务清单", "folder": "docs/50-运营支持知识/01-新人上手", "text": "# 第一天任务清单  本页用于运营新人第一天快速建立产品和知识库操作感。  ## 必读  | 顺序 | 内容 | 目标 | | --- | --- | --- | | 1 | [产品能力地图](../../00-产品总览与规划/产品能力地图.md) | 知道 Linkincrease 的能力分层 | | 2 | [运营端概览与各模块地图](./运营端概览与各模块地图.md) | 知道运营端能配置和监管什么 | | 3 | [FlowSpace 数据层级](../../20-业务对象与数据模型/FlowSpace数据层级.md) | 知道数据落在哪一层 | | 4 | [品牌方供应商与工厂准入协同方案](../03-业务场景案例库/外贸供应商治理/品牌方供应商与工厂准入协同方案.md) | 理解典型行业方案 | | 5 | [问题排查总览](../05-问题排查手册/问题排查总览.md) | 知道出问题先查哪里 |  ## 第一天练习  1. 用自己的话解释 FlowSpace、订单、里程碑、工单、工单批复、里程碑批复、资源库。 2. 画出“工厂申报准入 → 工厂资源库 → 订单工厂报备 → 验厂 → CAP 回写”的数据流。 3. 找出供应商、工厂、品牌方、DAREN 服务商四类角色分别能做什么。 4. 选一个业务模板案例，说明它的主表单、里程碑、工单和批复应该如何配置。 5. 阅读一个问题排查页，练习按“权限、状态、数据来源、日志”定位问题。  ## 交付物  新人第一天结束时，应能输出：  - 一张产品能力结构图。 - 一张典型外贸供应链场景数据流图。 - 一份自己理解的常见术语说明。 - 至少 3 个可能的客户问题和排查路径。 ", "domain": "公共能力", "module": "运营支持知识", "tags": "运营支持知识;01-新人上手;第一天任务清单", "sources": []}, {"path": "docs/50-运营支持知识/01-新人上手/运营端概览与各模块地图.md", "title": "运营端概览与各模块地图", "folder": "docs/50-运营支持知识/01-新人上手", "text": "# 运营端概览与各模块地图  本页帮助运营新人快速理解 Linkincrease 运营端负责什么，以及运营端如何支撑贸易端、采集端和客户业务落地。  ## 运营端定位  运营端是平台配置、客户初始化、模板治理、资源库治理、后台监管和产品运营支撑入口。它不直接承载客户每天的订单协作，而是为客户团队提供可复用的模板、资源库结构、权限策略和管理工具。  ## 模块地图  | 模块 | 运营价值 | 关联知识 | | --- | --- | --- | | 用户与团队管理 | 管理平台用户、团队、成员状态和基础权限 | [运营端](../../10-功能模块详情/运营端.md)、[团队权限](../../40-权限、安全与审计/团队权限.md) | | FlowSpace 管理 | 查看客户团队创建和使用的 FlowSpace，辅助定位配置和数据问题 | [FlowSpace](../../20-业务对象与数据模型/FlowSpace.md) | | 模板中心 | 维护业务模板和资源库模板，决定客户可创建的业务空间和数据结构 | [业务模板](../../20-业务对象与数据模型/业务模板.md)、[资源库模板](../../20-业务对象与数据模型/资源库模板.md) | | 表单设计器 | 配置字段、组件、显隐、公式、子表和关联引用 | [表单设计组件](../../20-业务对象与数据模型/表单设计组件.md) | | 资源库管理 | 管理供应商、工厂、物料、证书等可复用主数据结构 | [资源库](../../20-业务对象与数据模型/资源库.md) | | 仪表盘与报表 | 支撑客户管理层查看订单、工单、验厂、CAP 等数据 | [数据分析支持](../../60-数据分析支持/README.md) | | 自动化与集成 | 支撑通知、提醒、数据写入、外部系统对接 | [自动化配置](../../10-功能模块详情/自动化配置.md)、[集成方案](../../80-架构与技术方案/集成方案.md) | | 日志与审计 | 辅助运营排查配置、权限、数据变更和系统执行问题 | [权限、安全与审计](../../40-权限、安全与审计/README.md) |  ## 新人理解路径  1. 先读 [产品能力地图](../../00-产品总览与规划/产品能力地图.md)，理解产品全貌。 2. 再读 [FlowSpace 数据层级](../../20-业务对象与数据模型/FlowSpace数据层级.md)，理解模板、订单、工单、批复、资源库之间的关系。 3. 然后读 [品牌方供应商与工厂准入协同方案](../03-业务场景案例库/外贸供应商治理/品牌方供应商与工厂准入协同方案.md)，理解外贸供应链核心场景。 4. 最后进入日常任务区，学习模板、资源库、自动化、问题排查和 SOP。 ", "domain": "公共能力", "module": "运营支持知识", "tags": "运营支持知识;01-新人上手;运营端概览与各模块地图", "sources": []}, {"path": "docs/50-运营支持知识/02-日常运营任务/工作台与任务管理/视图配置技巧.md", "title": "视图配置技巧", "folder": "docs/50-运营支持知识/02-日常运营任务/工作台与任务管理", "text": "# 视图配置技巧  视图用于把复杂数据按角色和场景组织成可快速查看的列表。  ## 常用视图  | 视图 | 适用对象 | | --- | --- | | 待我处理 | 业务执行人员、审核人 | | 本周到期订单 | 跟单、管理层 | | 待准入工厂 | 品牌方审核人 | | 高风险工厂订单 | 品牌方管理层 | | 逾期 CAP | 供应商管理员、品牌方审核人 | | 待提交验厂报告 | DAREN 服务商 |  ## 配置建议  - 视图字段保留核心判断字段，不要把所有字段都展示出来。 - 管理层视图偏状态和风险，执行层视图偏任务和操作入口。 - 视图保存前确认权限和数据围栏效果。 ", "domain": "公共能力", "module": "运营支持知识", "tags": "运营支持知识;02-日常运营任务;工作台与任务管理;视图配置技巧", "sources": []}, {"path": "docs/50-运营支持知识/02-日常运营任务/工作台与任务管理/订单日程与任务统计如何辅助排期.md", "title": "订单日程与任务统计如何辅助排期", "folder": "docs/50-运营支持知识/02-日常运营任务/工作台与任务管理", "text": "# 订单日程与任务统计如何辅助排期  订单日程和任务中心可以帮助运营和客户团队识别近期计划、逾期任务和人员负载。  ## 使用方式  - 通过里程碑计划开始/结束时间查看订单节奏。 - 通过任务中心查看我的任务、团队任务、关注任务。 - 按 FlowSpace、供应商、负责人、状态筛选待办。 - 将逾期任务、CAP 整改、验厂计划纳入日常巡检。  ## 运营建议  客户上线初期，应帮助客户确认里程碑计划字段和负责人配置，否则工作台无法有效辅助排期。 ", "domain": "公共能力", "module": "运营支持知识", "tags": "运营支持知识;02-日常运营任务;工作台与任务管理;订单日程与任务统计如何辅助排期", "sources": []}, {"path": "docs/50-运营支持知识/02-日常运营任务/工作台与任务管理/采集端APP常见使用问题.md", "title": "采集端 APP 常见使用问题", "folder": "docs/50-运营支持知识/02-日常运营任务/工作台与任务管理", "text": "# 采集端 APP 常见使用问题  采集端用于现场执行、任务采集、附件上传、签名和批复查看。  ## 常见问题  | 问题 | 排查方向 | | --- | --- | | 看不到任务 | 是否被指派、是否有 FlowSpace 权限、任务状态是否正确 | | 无法提交 | 必填字段、附件格式、网络、工单状态 | | 附件上传失败 | 文件大小、格式、网络、权限 | | 登录失败 | 账号状态、密码、验证码、团队权限 | | 消息不提醒 | 通知设置、任务指派、消息中心配置 |  ## 运营建议  给现场人员培训时，应使用真实任务演示：打开任务、填写字段、上传图片、签名、提交、查看反馈。 ", "domain": "公共能力", "module": "运营支持知识", "tags": "运营支持知识;02-日常运营任务;工作台与任务管理;采集端APP常见使用问题", "sources": []}, {"path": "docs/50-运营支持知识/02-日常运营任务/模板配置/CAP整改类模板配置指南.md", "title": "CAP 整改类模板配置指南", "folder": "docs/50-运营支持知识/02-日常运营任务/模板配置", "text": "# CAP 整改类模板配置指南  CAP 整改类模板用于跟进验厂、审核、订单异常或资质报告中提出的改进项。  ## 推荐结构  | 层级 | 推荐内容 | | --- | --- | | 订单主表单 | CAP 编号、工厂、供应商、来源报告、总体状态、风险等级 | | 里程碑 | 问题确认、整改提交、复核、关闭 | | 工单 | 问题项、整改要求、责任人、截止日期、整改证据 | | 批复 | 复核结论、退回原因、是否关闭 | | 资源库回写 | 工厂 CAP 未关闭数量、风险等级、整改状态 |  ## 配置建议  - CAP 应按问题项拆分，不建议整份报告只用一个总状态。 - 每个问题项要有责任人、截止日期、整改证据和复核结论。 - 逾期 CAP 应配置自动化提醒。 - CAP 关闭后应回写工厂资源库，供订单报备和风险分析使用。 ", "domain": "公共能力", "module": "运营支持知识", "tags": "运营支持知识;02-日常运营任务;模板配置;CAP整改类模板配置指南", "sources": []}, {"path": "docs/50-运营支持知识/02-日常运营任务/模板配置/业务模板案例总览.md", "title": "常见业务模板案例", "folder": "docs/50-运营支持知识/02-日常运营任务/模板配置", "text": "# 常见业务模板案例  本页用于沉淀外贸供应链场景中可复用的业务模板方案。  ## 案例 1：工厂申报与准入模板  | 配置项 | 建议 | | --- | --- | | 适用场景 | 品牌方要求供应商提交使用工厂，品牌方审批后进入可用工厂清单 | | 订单主表单 | 申请编号、供应商、工厂名称、工厂地址、联系人、申请原因、是否紧急 | | 里程碑 | 资料提交、品牌方初审、资质审核、准入确认 | | 工单 | 补充资料、资质审核、现场核验、风险评估 | | 批复 | 初审结论、准入结论、不通过原因 | | 资源库同步 | 通过后写入工厂资源库，关联供应商资源库 | | 仪表盘 | 待审核数量、通过率、平均审核周期、按供应商统计申报数量 |  ## 案例 2：订单管理与工厂报备模板  | 配置项 | 建议 | | --- | --- | | 适用场景 | 品牌方需要知道供应商实际使用哪个工厂生产订单 | | 订单主表单 | 订单号、供应商、产品、数量、交期、生产工厂、工厂准入状态 | | 里程碑 | 订单确认、生产准备、生产中、验货、出货 | | 工单 | 生产计划、产前确认、生产进度、异常上报、出货资料 | | 批复 | 品牌方确认生产工厂、验货通过、出货确认 | | 资源库引用 | 生产工厂引用工厂资源库，带出准入、验厂、CAP 信息 | | 仪表盘 | 订单进度、使用工厂分布、高风险工厂订单、延期订单 |  ## 案例 3：社会责任验厂审核模板  | 配置项 | 建议 | | --- | --- | | 适用场景 | 品牌方对准入中或已准入工厂发起社会责任审核 | | 订单主表单 | 审核编号、工厂、供应商、审核类型、计划日期、服务商 | | 里程碑 | 需求确认、排期、现场审核、报告提交、品牌方确认 | | 工单 | 审核计划、现场检查、照片附件、报告上传、补充说明 | | 批复 | 报告审核结论、是否需要 CAP | | 资源库引用 | 引用工厂资源库，审核结论回写工厂审核状态 | | 仪表盘 | 审核通过率、待审核工厂、服务商任务进度、审核周期 |  ## 案例 4：CAP 整改跟进模板  | 配置项 | 建议 | | --- | --- | | 适用场景 | 根据验厂报告、资质报告或订单异常提出整改项 | | 订单主表单 | CAP 编号、工厂、供应商、来源报告、总体状态 | | 里程碑 | 问题确认、整改提交、复核、关闭 | | 工单 | 问题项、风险等级、整改要求、责任人、截止日期、整改证据 | | 批复 | 复核结论、退回原因、是否关闭 | | 资源库同步 | 关闭状态、未关闭数量、风险等级回写工厂资源库 | | 仪表盘 | 未关闭 CAP、逾期 CAP、高风险问题、平均关闭周期 | ", "domain": "公共能力", "module": "运营支持知识", "tags": "运营支持知识;02-日常运营任务;模板配置;业务模板案例总览", "sources": []}, {"path": "docs/50-运营支持知识/02-日常运营任务/模板配置/模板设计通用原则.md", "title": "模板设计通用原则", "folder": "docs/50-运营支持知识/02-日常运营任务/模板配置", "text": "# 模板设计通用原则  模板设计决定客户后续 F
